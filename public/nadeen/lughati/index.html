<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#6D4FC9">
<title>لغتي مع نادين</title>
<style>
@font-face { font-family: B; src: url(fonts/baloo-800.ttf); font-display: swap; }
@font-face { font-family: R; src: url(fonts/readex-600.ttf); font-weight: 600; font-display: swap; }
@font-face { font-family: R; src: url(fonts/readex-400.ttf); font-weight: 400; font-display: swap; }
:root { --ink: #2E2550; --ink2: #6B6390; --bg: #F7F3FF; --card: #fff; --line: #E7E0F7; --main: #6D4FC9; --ok: #2E9C6A; --bad: #E0566B; --sun: #FFC93C; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: R, Tahoma, sans-serif; }
body { min-height: 100vh; background: radial-gradient(circle at 10% 0%, #EDE6FF 0, transparent 40%), radial-gradient(circle at 100% 30%, #FFF0E3 0, transparent 35%), var(--bg); }
button { font: inherit; cursor: pointer; border: 0; color: inherit; }
.wrap { max-width: 860px; margin: 0 auto; padding: 16px 16px 90px; }
.hidden { display: none !important; }
/* lock */
#lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
#lock form { background: #fff; border-radius: 24px; padding: 28px 22px; width: min(92vw, 380px); text-align: center; box-shadow: 0 6px 0 var(--line); display: flex; flex-direction: column; gap: 14px; }
#lock h1 { margin: 0; font: 800 30px B; color: var(--main); }
#lock input { font: 600 20px R; padding: 12px; border: 3px solid var(--line); border-radius: 14px; text-align: center; direction: ltr; }
#lock button { background: var(--main); color: #fff; font: 800 22px B; padding: 12px; border-radius: 14px; box-shadow: 0 5px 0 #4E35A0; }
#msg { color: var(--bad); min-height: 1.4em; font-weight: 600; }
/* header */
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.top h1 { margin: 0; font: 800 30px/1.3 B; color: var(--main); flex: 1; }
.chip { background: #fff; border-radius: 30px; padding: 6px 14px 9px; box-shadow: 0 3px 0 var(--line); font: 800 18px B; white-space: nowrap; }
.iconbtn { width: 46px; height: 46px; border-radius: 14px; background: #fff; box-shadow: 0 3px 0 var(--line); font-size: 22px; flex: none; }
.sub { color: var(--ink2); margin: -6px 0 16px; font-size: 16px; }
.bar { height: 14px; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 0 2px var(--line); margin-bottom: 18px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--sun), #FF9F43); border-radius: 10px; transition: width .5s; }
/* lesson grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
@media (max-width: 520px) { .grid { grid-template-columns: 1fr 1fr; gap: 10px; } .lc b { font-size: 16px; } .lc { min-height: 118px; } }
.lc { background: #fff; border-radius: 20px; padding: 14px 12px 12px; text-align: right; box-shadow: 0 5px 0 var(--line); border-top: 6px solid var(--c); display: flex; flex-direction: column; gap: 6px; min-height: 128px; transition: transform .15s; }
.lc:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.lc .n { font: 800 13px B; color: var(--c); }
.lc .ic { font-size: 30px; line-height: 1; }
.lc b { font: 800 19px/1.35 B; }
.stars { font-size: 16px; letter-spacing: 2px; margin-top: auto; }
.big { display: block; width: 100%; padding: 14px; border-radius: 18px; background: var(--main); color: #fff; font: 800 22px B; box-shadow: 0 5px 0 #4E35A0; margin: 18px 0 10px; }
/* lesson page */
.steps { display: flex; gap: 8px; margin: 4px 0 14px; }
.steps { flex-wrap: wrap; }
.steps button { min-width: 30%; flex: 1; padding: 10px 6px 12px; border-radius: 14px; background: #fff; box-shadow: 0 3px 0 var(--line); font: 800 17px B; color: var(--ink2); }
.steps button.on { background: var(--c); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
.card { background: #fff; border-radius: 22px; padding: 20px 18px; box-shadow: 0 6px 0 var(--line); border-right: 8px solid var(--c); position: relative; }
.card h2 { margin: 0 0 8px; font: 800 24px/1.4 B; color: var(--c); padding-left: 52px; }
.card p { margin: 0; font-size: 21px; line-height: 1.95; }
.ex { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.ex span { background: color-mix(in srgb, var(--c) 12%, white); border: 2px dashed color-mix(in srgb, var(--c) 45%, white); border-radius: 14px; padding: 6px 12px 8px; font-size: 19px; }
.say { position: absolute; left: 14px; top: 14px; width: 44px; height: 44px; border-radius: 50%; background: color-mix(in srgb, var(--c) 14%, white); font-size: 20px; }
.say.playing { animation: pulse .8s infinite; }
@keyframes pulse { 50% { transform: scale(1.12); } }
.nav { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
.nav .dots { flex: 1; text-align: center; color: var(--ink2); font: 800 16px B; }
.btn { padding: 12px 22px 14px; border-radius: 16px; background: var(--c); color: #fff; font: 800 20px B; box-shadow: 0 4px 0 rgba(0,0,0,.18); }
.btn.alt { background: #fff; color: var(--c); box-shadow: 0 4px 0 var(--line); }
.trick { text-align: center; padding: 30px 18px; background: linear-gradient(135deg, color-mix(in srgb, var(--c) 18%, white), #fff); }
.trick .bulb { font-size: 54px; }
.trick p { font: 800 24px/1.9 B; color: var(--ink); }
/* quiz */
.q { font: 800 25px/1.7 B; margin: 4px 0 14px; padding-left: 50px; }
.opts { display: grid; gap: 10px; }
.opts button { text-align: right; padding: 14px 16px 16px; border-radius: 16px; background: #F6F3FD; border: 3px solid transparent; font: 600 21px/1.5 R; }
.opts button.right { background: #E3F6EC; border-color: var(--ok); }
.opts button.wrong { background: #FDE8EC; border-color: var(--bad); }
.opts button:disabled { cursor: default; }
.why { margin-top: 14px; border-radius: 18px; padding: 14px 16px; background: #FFF8E1; border: 3px solid var(--sun); font-size: 20px; line-height: 1.85; position: relative; padding-left: 60px; }
.why b { display: block; font: 800 20px B; }
.why .say { top: 10px; }
.res { text-align: center; padding: 30px 18px; }
.res .st { font-size: 46px; letter-spacing: 6px; }
.res h2 { padding: 0; }
.fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 9; }
.fx i { position: absolute; top: -40px; font-style: normal; font-size: 30px; animation: fall 2.4s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
.hello { background: #fff; border-radius: 18px; padding: 12px 16px; margin: 0 0 14px; box-shadow: 0 3px 0 var(--line); font: 800 18px/1.7 B; color: var(--main); }
.lc .qn { color: var(--ink2); font-size: 14px; }
.sec { font: 800 24px B; margin: 26px 0 12px; }
.tip { background: #F0F7FF; border-radius: 14px; padding: 10px 14px; margin: 0 0 12px; font-size: 17px; line-height: 1.8; color: #2B4A6F; }
.psg { margin-bottom: 14px; }
.psg .pp { position: relative; padding-left: 46px; margin-bottom: 10px; font-size: 20px; line-height: 2; }
.say.sm { width: 36px; height: 36px; font-size: 16px; top: 4px; left: 0; }
.poem .pp { font: 800 20px/2 B; text-align: center; }
.ptog { display: block; width: 100%; margin: 0 0 12px; padding: 10px; border-radius: 14px; background: #fff; box-shadow: 0 3px 0 var(--line); font: 800 18px B; color: var(--c); }
.secn { display: inline-block; background: color-mix(in srgb, var(--c) 14%, white); color: var(--c); border-radius: 10px; padding: 2px 12px 5px; font: 800 14px B; margin-bottom: 6px; }
.again { margin-top: 14px; border-radius: 16px; padding: 12px 16px; background: #FFF0E8; border: 3px solid #E06C3C; font: 800 19px/1.7 B; color: #A2421B; }
.hint { margin-top: 8px; font-size: 18px; color: #6B5A1E; }
.self { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font: 800 18px B; }
.self .btn { padding: 8px 16px 10px; font-size: 18px; }
.grp { background: rgba(255,255,255,.55); border-radius: 22px; padding: 12px; margin-bottom: 14px; }
.gh { display: flex; gap: 10px; align-items: center; margin: 0 4px 10px; }
.gh .gi { font-size: 30px; }
.gh b { display: block; font: 800 21px/1.4 B; color: var(--ink); }
.gh small { display: block; color: var(--ink2); font-size: 15px; }
.big.sum { background: #fff; color: var(--main); box-shadow: 0 5px 0 var(--line); margin-top: 0; }
.secb { background: color-mix(in srgb, var(--c) 14%, white); border-radius: 14px; padding: 6px 12px 8px; margin: 0 0 10px 52px; }
.secb b { display: block; font: 800 17px B; color: var(--c); }
.secb small { display: block; font-size: 15px; color: var(--ink); }
.sumpage .sec { color: var(--main); }
.sc { margin-bottom: 12px; }
.sc ul { margin: 0; padding: 0 20px 0 0; font-size: 18px; line-height: 1.9; }
.sc .eg { color: var(--c); font-weight: 600; }
.sc .tk { margin-top: 8px; background: #FFF8E1; border-radius: 12px; padding: 8px 12px; font: 800 17px/1.8 B; }
@media print { .say, .iconbtn, .big, .tip, .fx { display: none !important; } body { background: #fff; } .card { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; } .wrap { padding: 0; } }
.foot { text-align: center; color: var(--ink2); font-size: 13px; margin-top: 26px; }
@media (max-width: 420px) { .card p { font-size: 19px; } .q { font-size: 22px; } .opts button { font-size: 19px; } .top h1 { font-size: 25px; } }
</style>
</head>

زهور في أشكالها وروائحها، فهناك الورد الجُوري بلونه الأحمر العميق، والياسمين بعطره الهادئ، والأقحوان بألوانه الزاهية، والخُزامى البنفسجية التي تفوح بعبير ناعم؛ لذلك نجد الزهور تزين الحدائق والطرقات والبيوت، وتزيدها بهاء.", "ولأن الزهور جزء من بيئتنا، فمن واجبنا المحافظة عليها؛ فنزرعها في الحدائق المدرسية والبيوت، ولا نقطفها عبثًا، ونوفر لها الماء والضوء، ونعتني بها؛ فالزهرة كائن رقيق، تُسعد من يراها، وتحتاج إلى رعايتنا؛ كي تبقى حية ومتألقة.", "وقد أولت مملكتنا الحبيبة اهتمامًا كبيرًا بالبيئة والنباتات؛ فدعمت مشروعات التشجير، وحافظت على النباتات البرية المنتشرة في صحاريها ومنها زهرة الخُزامى التي تكسو صحاري المملكة بلون بنفسجي آسر، حتى أصبحت رمز الجمال في بلادنا، وتألقت في المهرجانات والمناسبات الوطنية. بل إن مفارش استقبال الوفود الرسمية توشحت بلون الخُزامى؛ تقديرًا لجمالها، وتعزيزًا للهوية البيئية الوطنية."]}, "poem": null, "items": [{"s": "الفهم القرائي", "q": "(الزهور تزيد الأماكن بهاء). معنى كلمة (بهاء):", "o": ["جمالًا.", "ذبولًا.", "اتساعًا.", "ازدحامًا."], "w": "البهاء هو الحُسن والجمال، فالزهور تجعل الأماكن أجمل."}, {"s": "الفهم القرائي", "q": "الزهور التي وصفها الكاتب بلون أحمر في النص هي:", "o": ["الجوري.", "الياسمين.", "الأقحوان.", "النرجس."], "w": "جاء في الفقرة الثانية: (فهناك الورد الجوري بلونه الأحمر العميق)."}, {"s": "الفهم القرائي", "q": "(وكأنها رسائل صغيرة من الطبيعة تقول لنا: الحياة جميلة). نستنتج من العبارة السابقة أن الزهور:", "o": ["تمنحنا البهجة والأمل.", "لا تؤثر في مشاعرنا.", "لا تذبل سريعًا وتدوم.", "تتحمل الحر الشديد."], "w": "الرسالة (الحياة جميلة) تبعث في النفس الفرح والأمل."}, {"s": "الفهم القرائي", "q": "الفكرة التي تناولتها الفقرة الثالثة من النص:", "o": ["حاجة الزهور إلى العناية؛ لتظل جميلة.", "تعدد الزهور يجذب النحل والفراشات.", "اختلاف الزهور في أحجامها وألوانها.", "تبادل الزهور في الأعياد والمناسبات السعيدة."], "w": "تتحدث الفقرة الثالثة عن واجبنا في زراعة الزهور وسقيها ورعايتها كي تبقى حية ومتألقة."}, {"s": "الفهم القرائي", "q": "من النباتات البريَّة المذكورة في النص:", "o": ["الخُزامى.", "القرنفل.", "السِّدر.", "الريحان."], "w": "جاء في الفقرة الرابعة: (النباتات البرية المنتشرة في صحاريها ومنها زهرة الخُزامى)."}, {"s": "الفهم القرائي", "q": "السبب في تزيين مفارش استقبال الوفود الرسمية باللون البنفسجي هو:", "o": ["رمز وطني.", "تقليد أجنبي.", "اختيار عشوائي.", "لون عادي."], "w": "لأن الخزامى أصبحت رمز الجمال في بلادنا، فاختير لونها تعزيزًا للهوية البيئية الوطنية."}, {"s": "الفهم القرائي", "q": "ماذا يمكن أن يحدث لو أهمل الناس العناية بالزهور في الحدائق؟", "ans": "تذبل الزهور وتموت، وتفقد الحدائق جمالها وبهجتها.", "w": "تذكّري أن الزهور تحتاج إلى الماء والضوء والرعاية كي تبقى حية، ففكّري فيما يحدث إن فقدتها."}, {"s": "الفهم القرائي", "q": "(أولت مملكتنا الحبيبة اهتمامًا كبيرًا بالبيئة والنباتات). من خلال فهمك للنص، اذكري أمرين قامت بهما المملكة في هذا المجال.", "ans": "1- دعمت مشروعات التشجير. 2- حافظت على النباتات البرية المنتشرة في صحاريها.", "w": "ارجعي إلى الفقرة الأخيرة من النص، وستجدين الأمرين بعد كلمة (فدعمت)."}, {"s": "النص الشعري", "q": "من خلال دراستك للنص الشعري (لِمَ تألمتِ الفراشة؟):\nقال الشاعر: كنت ألهو في رخاءٍ … حول ورد أو قرنفل\nكنت أمتصُّ رحيقًا … صافيًا عذبًا مُعسَّل\nصفي حال الفراشة وهي تتجول بين الأزهار قبل تلوث البيئة التي كانت تعيش فيها.", "ans": "كانت الفراشة سعيدة مطمئنة، تلهو وتلعب في رخاء حول الورد والقرنفل، وتمتص رحيقًا صافيًا عذبًا كالعسل.", "w": "اقرئي البيتين جيدًا، وصفي حالها بكلمات منهما مثل: (ألهو، رخاء، رحيقًا صافيًا)."}, {"s": "النص الشعري", "q": "وقال الشاعر: حققوا روح التآخي … كي يكون العيش أفضل\nما النصيحة التي قدمها الشاعر في البيت السابق؟", "ans": "ينصحنا الشاعر أن نتآخى ونتعاون ونحب بعضنا؛ لتكون حياتنا أفضل.", "w": "النصيحة في فعل الأمر (حققوا)، فاشرحي معنى (روح التآخي)."}, {"s": "الصنف اللغوي", "q": "جميع الكلمات الآتية أسماء عدا كلمة:", "o": ["نزرع.", "وردة.", "زهرة.", "جميلة."], "w": "كلمة (نزرع) فعل مضارع يدل على حدث، أما البقية فأسماء."}, {"s": "الصنف اللغوي", "q": "عند تحويل الفعل المضارع (يشكر) إلى فعل ماضٍ يصبح:", "o": ["شكرَ.", "اشكرَ.", "نشكرُ.", "تشكرُ."], "w": "الفعل الماضي يدل على حدث مضى، و(شكرَ) هو ماضي (يشكر)."}, {"s": "الوظيفة النحوية", "q": "(المطر غزير والطرقات مبتلة). إعراب كلمة (غزير) في الجملة السابقة:", "o": ["خبر مرفوع.", "مبتدأ مرفوع.", "اسم مجرور.", "مفعول به منصوب."], "w": "(المطر) مبتدأ، و(غزير) خبر يتمم المعنى، والخبر مرفوع."}, {"s": "الوظيفة النحوية", "q": "(يُعالِج الطبيب المرضى ويصف لهم الدواء المناسب)، وقعت كلمة (الطبيب) في الجملة السابقة:", "o": ["فاعلًا.", "خبرًا.", "مفعولًا به.", "اسمًا مجرورًا."], "w": "الطبيب هو الذي قام بفعل العلاج، فهو فاعل مرفوع."}, {"s": "الوظيفة النحوية", "q": "(ترتب الأُسرة البيت استعدادًا للعيد)، المفعول به في الجملة هو:", "o": ["البيت.", "الأسرة.", "استعدادًا.", "العيد."], "w": "البيت هو الذي وقع عليه فعل الترتيب، فهو مفعول به منصوب."}, {"s": "الأسلوب اللغوي", "q": "(بارك الله فيك؛ فأنت طالب مجتهد)، اشتملت الجملة السابقة على أسلوب:", "o": ["دعاء.", "استفهام.", "نفي.", "نهي."], "w": "(بارك الله فيك) طلبٌ من الله الخير والبركة لشخص، وهذا أسلوب دعاء."}, {"s": "الظاهرة الإملائية", "q": "الجملة التي احتوت على كلمات همزتها وصل هي:", "o": ["انطلقت السفينة في البحر.", "أختي تشاركني ألعابي.", "أسماء ترسم لوحة.", "أحسن خالد إلى والديه."], "w": "همزة (انطلقت) همزة وصل؛ لأنها في ماضٍ خماسي، وتُنطق في أول الكلام ولا تُكتب عليها همزة."}, {"s": "الأسلوب اللغوي", "q": "الجملة المثبتة من بين الجمل الآتية:", "o": ["لعبَ الفريق.", "لن يلعبَ الفريق.", "لم يلعبْ الفريق.", "ما لعبَ الفريق."], "w": "الجملة المثبتة ليس فيها أداة نفي، أما (لن، لم، ما) فهي أدوات نفي."}, {"s": "الظاهرة الإملائية", "q": "(اعتنى أحمد بصحة الغذاء الذي يتناوله)، الكلمة التي بدأت بهمزة قطع في الجملة السابقة:", "o": ["أحمد.", "اعتنى.", "الغذاء.", "الذي."], "w": "همزة (أحمد) تُكتب وتُنطق دائمًا، أما (اعتنى) فهمزتها وصل، و(الـ) في (الغذاء والذي) همزتها وصل."}, {"s": "الظاهرة الإملائية", "q": "(وضع البستاني الغطاء على الزهور)، رُسمت الهمزة في كلمة (الغطاء) على السطر؛ لأن الحرف الذي قبلها:", "o": ["ساكن.", "مكسور.", "مفتوح.", "مضموم."], "w": "قبل الهمزة ألفٌ ساكنة، والهمزة المتطرفة بعد حرف ساكن تُكتب على السطر."}, {"s": "الظاهرة الإملائية", "q": "من الكلمات التي حُذفت الألف من وسطها كلمة:", "o": ["هؤلاء.", "هدوء.", "هتف.", "هو."], "w": "تُنطق (هاؤلاء) بألف بعد الهاء، لكنها تُحذف في الكتابة فنكتب (هؤلاء)."}, {"s": "الظاهرة الإملائية", "q": "(تسقي أمي شجر.... التو....)، لملء الفراغين بشكل التاء المناسب، نكتب على الترتيب:", "o": ["ة - ت.", "ت - ت.", "ت - ة.", "ة - ة."], "w": "(شجرة) اسم مؤنث نقف عليه بالهاء فتاؤه مربوطة، و(التوت) نقف عليه بالتاء فتاؤه مفتوحة."}, {"s": "الأسلوب اللغوي", "q": "(الجوُّ معتدلٌ)، عند تحويل الجملة المثبتة إلى جملة منفية نقول: ليس الجو معتدلًا.", "o": ["صواب", "خطأ"], "w": "(ليس) أداة نفي، وتنصب الخبر فيصبح (معتدلًا)."}, {"s": "الوظيفة النحوية", "q": "(التصحر مشكلة عالمية)، الجملة السابقة جملة اسمية.", "o": ["صواب", "خطأ"], "w": "لأنها بدأت باسم (التصحر)، والجملة التي تبدأ باسم جملة اسمية."}, {"s": "الظاهرة الإملائية", "q": "(السياحة ممتعة، لَكِنَّ الماء باردٌ)، كتبت كلمة (لكِنَّ) كتابة إملائية صحيحة.", "o": ["صواب", "خطأ"], "w": "(لكنَّ) من الكلمات التي تُحذف الألف من وسطها في الكتابة مع أننا ننطقها."}, {"s": "الوظيفة النحوية", "q": "(قراءة الكتب مفيدة)، المبتدأ في الجملة السابقة هو كلمة (مفيدة).", "o": ["خطأ", "صواب"], "w": "المبتدأ هو (قراءة) في أول الجملة، أما (مفيدة) فهي الخبر."}, {"s": "الظاهرة الإملائية", "q": "تكتب الهمزة المتطرفة على (ألف) إذا كان الحرف الذي قبلها مضمومًا.", "o": ["خطأ", "صواب"], "w": "إذا كان ما قبلها مضمومًا كُتبت على واو مثل (التباطُؤ)، وتُكتب على ألف إذا كان ما قبلها مفتوحًا مثل (قرَأ)."}, {"s": "الوظيفة النحوية", "q": "(كتب محمد قصة)، أعربي كلمة (قصة) في الجملة السابقة.", "ans": "قصةً: مفعول به منصوب، وعلامة نصبه الفتحة الظاهرة على آخره.", "w": "اسألي: ماذا كتب محمد؟ الجواب هو المفعول به، وهو منصوب."}, {"s": "الوظيفة النحوية", "q": "(شاهد الأطفال الطيور في الحديقة)، اجعلي الفاعل (الأطفال) مفردًا في الجملة السابقة، واضبطيه بالشكل.", "ans": "شاهدَ الطفلُ الطيورَ في الحديقةِ.", "w": "مفرد (الأطفال) هو (الطفل)، والفاعل مرفوع بالضمة."}, {"s": "الوظيفة النحوية", "q": "أكملي الجدول: (سافرت إلى المدينة، ومكثت فترة أستكشف معالمها الجميلة). حرف الجر هو:", "ans": "إلى", "w": "حرف الجر يأتي قبل الاسم المجرور، مثل: (إلى، من، في، على، عن، الباء)."}, {"s": "الوظيفة النحوية", "q": "في الجملة نفسها (سافرت إلى المدينة...)، الاسم المجرور هو:", "ans": "المدينةِ", "w": "الاسم المجرور هو الاسم الذي يأتي بعد حرف الجر مباشرة."}, {"s": "الوظيفة النحوية", "q": "في الجملة نفسها، العلامة الإعرابية للاسم المجرور (المدينة) هي:", "ans": "الكسرة الظاهرة على آخره.", "w": "الاسم المجرور علامة جره الكسرة."}, {"s": "الظاهرة الإملائية", "q": "صوّبي الخطأ الإملائي في الكلمة التي بين القوسين: حافظْ على (نظافت) فصلك.", "ans": "نظافة", "w": "نقف على الكلمة بالهاء (نظافهْ)، فتاؤها مربوطة (ة)."}, {"s": "الرسم الكتابي", "q": "اكتبي الجملة التالية بخط النسخ وفق القواعد الصحيحة: زهور الطبيعة تجمع بين جمال الشكل والبهجة الدائمة", "ans": "زهور الطبيعة تجمع بين جمال الشكل والبهجة الدائمة", "w": "اكتبي الجملة بخط النسخ بحروف واضحة، واجعلي الحروف على السطر، وأنزلي الحروف النازلة مثل (الراء والواو والميم والعين) تحت السطر، واتركي مسافة بين الكلمات."}], "g": "fin"}, {"id": "fin_2", "t": "نموذج ٢", "passage": {"title": "فهم المقروء", "paras": ["البيئة والصحة مرتبطان بشكل مباشر بصحتنا، فالتلوث البيئي يمكن أن يؤدي إلى مشكلات صحيَّة كثيرة، مثل: أمراض التنفس والسرطانات، ومن ناحية أخرى، فإن الحفاظ على البيئة صحيَّة يمكن أن يساهم في تحسين الصحة العامة.", "إن المناطق الخضراء والحدائق العامة توفر أماكن للرياضة والاسترخاء؛ مما يقلل من التوتر، ويحسن الصحَّة النفسية، لذلك فإن الحفاظ على البيئة ليس مسؤولية الحكومات والمنظمات فقط؛ بل هو أيضًا مسؤولية فردية، ويمكننا جميعًا أن نساهم في حماية البيئة من خلال ترشيد استهلاك الطاقة، وتقليل النفايات، واستخدام النقل العام أو الدراجات الهوائية.", "ختامًا فإن البيئة والصحة مرتبطان بشكل وثيق، والحفاظ على البيئة ضرورة لتحسين الصحة العامة والتمتع بحياة صحيَّة ومستدامة."]}, "poem": null, "items": [{"s": "الفهم القرائي", "q": "البيئة التي نعيش فيها تؤثر بشكل مباشر على:", "o": ["صحتنا.", "مستقبلنا.", "مجتمعنا.", "عقولنا."], "w": "جاء في أول النص: (البيئة والصحة مرتبطان بشكل مباشر بصحتنا)."}, {"s": "الفهم القرائي", "q": "وردت في النص كلمة مرادفة لكلمة (نشارك) هي:", "o": ["نساهم.", "نعيش.", "نقلل.", "نتجنب."], "w": "المرادف هو الكلمة التي لها المعنى نفسه، و(نساهم) بمعنى نشارك."}, {"s": "الفهم القرائي", "q": "ضد كلمة (التوتر) هي:", "o": ["الهدوء.", "السرعة.", "القلق.", "الغضب."], "w": "التوتر هو القلق والانزعاج، وضده الهدوء والراحة."}, {"s": "الفهم القرائي", "q": "أكملي الفراغ بكلمة مناسبة: الحفاظ على البيئة هو ضرورة لتحسين ........... العامة.", "ans": "الصحة", "w": "ارجعي إلى الفقرة الأخيرة: (والحفاظ على البيئة ضرورة لتحسين الصحة العامة)."}, {"s": "الفهم القرائي", "q": "(البيئة والصحة مرتبطان بشكل وثيق). هل العبارة السابقة صحيحة أم خاطئة؟", "o": ["صحيحة", "خاطئة"], "w": "جاءت هذه العبارة في الفقرة الأخيرة من النص."}, {"s": "الفهم القرائي", "q": "على من تقع مسؤولية الحفاظ على البيئة؟", "ans": "تقع على الجميع: الحكومات والمنظمات وكل فرد منا.", "w": "اقرئي الفقرة الثانية: (ليس مسؤولية الحكومات والمنظمات فقط؛ بل هو أيضًا مسؤولية فردية)."}, {"s": "الفهم القرائي", "q": "ما جمع كلمة (حديقة)؟", "ans": "حدائق", "w": "وردت الكلمة مجموعة في النص: (الحدائق العامة)."}, {"s": "الفهم القرائي", "q": "ضعي عنوانًا مناسبًا للنص.", "ans": "البيئة والصحة", "w": "العنوان المناسب قصير ويدل على الفكرة الرئيسة للنص كله."}, {"s": "الفهم القرائي", "q": "ما رأيك في عبارة: \"الحفاظ على البيئة صحية يمكن أن يساهم في تحسين الصحة العامة\"؟", "ans": "عبارة صحيحة أوافق عليها؛ لأن البيئة النظيفة تقلل الأمراض وتجعلنا نعيش بصحة جيدة.", "w": "اذكري رأيكِ (أوافق أو لا أوافق)، ثم اذكري السبب بعد كلمة (لأن)."}, {"s": "الأسلوب اللغوي", "q": "حددي نوع الجملة: (نعم الله لا تُعد ولا تُحصى).", "o": ["منفية", "مثبتة"], "w": "لأن فيها أداة النفي (لا)."}, {"s": "الأسلوب اللغوي", "q": "حددي نوع الجملة: (التصحر مشكلة عالمية).", "o": ["مثبتة", "منفية"], "w": "لأنها لا تحتوي على أداة نفي."}, {"s": "الأسلوب اللغوي", "q": "حددي نوع الجملة: (لم تمطر السماء).", "o": ["منفية", "مثبتة"], "w": "لأن فيها أداة النفي (لم) التي تجزم الفعل المضارع."}, {"s": "الأسلوب اللغوي", "q": "ما نوع الأسلوب في الجملة التالية: (لا تتأخر عن الدرس جزاك الله خيرًا)؟", "o": ["دعاء.", "تعجب.", "نداء.", "استفهام."], "w": "عبارة (جزاك الله خيرًا) طلبٌ من الله الخير للشخص، وهذا أسلوب دعاء."}, {"s": "الأسلوب اللغوي", "q": "عبّري عن المطلوب بين القوسين بأسلوب دعاء: (إطالة العمر).", "ans": "أطال الله عمرك.", "w": "الدعاء طلب من الله تعالى، ويبدأ غالبًا بفعل ماضٍ بعده لفظ الجلالة مثل: (أطال الله...)."}, {"s": "الصنف اللغوي", "q": "أنواع الكلمة:", "o": ["اسم وفعل وحرف.", "مثبتة ومنفية.", "مبتدأ وخبر.", "جار ومجرور."], "w": "الكلمة في اللغة العربية ثلاثة أنواع: اسم، وفعل، وحرف."}, {"s": "الوظيفة النحوية", "q": "(محمد مجتهد في دروسه)، الخبر في الجملة السابقة هو:", "o": ["مجتهد.", "محمد.", "في.", "دروسه."], "w": "(محمد) مبتدأ، و(مجتهد) خبر أتمَّ المعنى وأخبرنا عن محمد."}, {"s": "الوظيفة النحوية", "q": "(لم ينزل المطر على المدينة)، حرف الجر في الجملة السابقة هو:", "o": ["على.", "لم.", "ينزل.", "المدينة."], "w": "(على) حرف جر، وجاء بعده الاسم المجرور (المدينة). أما (لم) فحرف نفي وجزم."}, {"s": "الصنف اللغوي", "q": "نوع الفعل (قال):", "o": ["ماضٍ.", "مضارع.", "أمر.", "مستقبل."], "w": "(قال) يدل على حدث وقع وانتهى، فهو فعل ماضٍ."}, {"s": "الوظيفة النحوية", "q": "(باع التاجر القماش بثمن قليل)، المفعول به في الجملة السابقة هو:", "o": ["القماش.", "باع.", "التاجر.", "قليل."], "w": "القماش هو الذي وقع عليه فعل البيع، فهو مفعول به منصوب."}, {"s": "الوظيفة النحوية", "q": "(عادت الأسرة إلى المنزل)، أكملي الإعراب: الأسرة: .......... مرفوع وعلامة رفعه .......... الظاهرة على آخره.", "ans": "الأسرةُ: فاعل مرفوع وعلامة رفعه الضمة الظاهرة على آخره.", "w": "الأسرة هي التي قامت بفعل العودة، فهي فاعل، والفاعل مرفوع بالضمة."}, {"s": "الوظيفة النحوية", "q": "(الطالب مجتهد)، حوّلي الجملة السابقة من اسمية إلى فعلية.", "ans": "اجتهد الطالب.", "w": "ابدئي الجملة بفعل مناسب لمعنى (مجتهد) مثل: (اجتهد) أو (يجتهد)."}, {"s": "الصنف اللغوي", "q": "استخدمي فعل الأمر لتطلبي من أخيك الإحسان إلى الفقراء.", "ans": "أحسِنْ إلى الفقراء يا أخي.", "w": "فعل الأمر يطلب القيام بعمل، ومن (الإحسان) نقول: (أحسِنْ)."}, {"s": "الظاهرة الإملائية", "q": "أكملي: الهمزة في أول الكلمة نوعان: 1- ......... 2- .........", "ans": "1- همزة القطع. 2- همزة الوصل.", "w": "همزة القطع تُكتب وتُنطق دائمًا مثل (أحمد)، وهمزة الوصل تُنطق في أول الكلام فقط مثل (انطلق)."}, {"s": "الظاهرة الإملائية", "q": "تكتب الهمزة المتطرفة على واو إذا كان ما قبلها مكسورًا.", "o": ["خطأ", "صواب"], "w": "إذا كان ما قبلها مكسورًا كُتبت على ياء مثل (شاطِئ)، وتكتب على واو إذا كان ما قبلها مضمومًا."}, {"s": "الظاهرة الإملائية", "q": "(الحديقة - سيارة - كبيرة) الكلمات السابقة ختمت بتاء مربوطة.", "o": ["صواب", "خطأ"], "w": "نقف على هذه الكلمات بالهاء (الحديقهْ، سيارهْ، كبيرهْ)، فتاؤها مربوطة."}, {"s": "الظاهرة الإملائية", "q": "(الله هو ........ الرحيم)، املئي الفراغ بكلمة حذفت الألف من وسطها من الكلمات التالية:", "o": ["الرحمن.", "الكريم.", "القوي.", "الخالق."], "w": "ننطقها (الرحمان) بألف بعد الميم، لكنها تُحذف في الكتابة."}, {"s": "الظاهرة الإملائية", "q": "اكتبي حروف هذه الكلمة متصلة (ج - ز - ء).", "ans": "جزء", "w": "الهمزة المتطرفة بعد حرف ساكن (الزاي) تُكتب على السطر."}, {"s": "الظاهرة الإملائية", "q": "صحّحي ما بين القوسين: حديقة المنزل (واسعت).", "ans": "واسعة", "w": "نقف على الكلمة بالهاء (واسعهْ)، فهي تنتهي بتاء مربوطة."}, {"s": "الرسم الكتابي", "q": "في خط النسخ، من الحروف التي تكتب مرتكزة على السطر الباء والدال.", "o": ["صواب", "خطأ"], "w": "الباء والدال تجلسان على السطر في خط النسخ ولا تنزلان تحته."}, {"s": "الرسم الكتابي", "q": "تكتب الحروف (ط - ف - ك) نازلة عن السطر.", "o": ["خطأ", "صواب"], "w": "هذه الحروف تُكتب على السطر ولا تنزل تحته، أما الحروف النازلة فمثل (الراء والواو والميم)."}, {"s": "الرسم الكتابي", "q": "اكتبي الجملة التالية بخط النسخ وفق القواعد الصحيحة: تبتسم الأفواه وتردد الألسنة عبارات الشكر لله تعالى.", "ans": "تبتسم الأفواه وتردد الألسنة عبارات الشكر لله تعالى.", "w": "اكتبي الجملة بخط النسخ بحروف واضحة، واجعلي الحروف على السطر، وأنزلي الحروف النازلة مثل (الراء والواو والميم والعين) تحت السطر، واتركي مسافة بين الكلمات."}], "g": "fin"}, {"id": "fin_3", "t": "نموذج ٣", "passage": {"title": "الفلاح النشيط", "paras": ["كان منذر يحب الزراعة كثيرًا، وهي إحدى هواياته المفضلة إلى نفسه، والتي يمارسها يوميًا بعد الانتهاء من واجباته المدرسية، حيث يقصد بستان والده الصغير، يُقلم الأغصان، ويغرس الورود، ويقلب التربة، وينثر البذور، ويروي المزروعات.", "منذ فترة ذهب مع والده إلى أحد المشاتل الزراعية وأحضر كمية من شتلات الطماطم، وقام بزراعتها وسقايتها.", "قال منذر: أنا سأهتم بها، وأراقب نموها، وكم كان سعيدًا وهو يراها تكبر، وترفع رأسها نحو الشمس، وبعد فترة من الزمن، وحين قاربت شتلات الطماطم أن تعقد الثمار، بدأ النبات بالذبول، فانحنت السيقان، ومالت الأوراق نحو الأرض، حزن منذر، ونقل مشاعره إلى أبيه مستغربًا مما حصل، وقال: أنا لم أقصر بالعناية أو السقاية. اتجه الوالد نحو مشاتل الطماطم، وانكبَّ فوقها متفحصًا، ثم رفع رأسه؛ ليقول: لقد عرفت السبب، لقد نبتت إلى جانب كل شتلة طماطم نبتة طفيلية التفت حول ساقها، وغرزت فيها أشواكًا كالإبر، وأخذت تمتص غذاءها؛ لذا فقد ذبلت النباتات، ولم تقدر على الاستمرار في نموها الطبيعي.", "- ما اسم هذه النباتات الطفيلية يا أبي؟", "- للطفيليات أسماء عديدة ... لكن هذا النوع الذي يلتف حول أغراس الطماطم اسمه \"الهالوك\".", "- وكيف نستطيع القضاء على الهالوك؟ أجاب الأب: بتعقيم التربة، ورشها بالمبيدات (الأدوية) المخصصة لها قبل الزرع، وقد فاتنا أن نقوم بهذه العملية.", "قال منذر: سأستفيد من هذه التجربة، فلا أدعُ الطفيليات المفسدة تقضي على إنتاجنا.", "فرح الأب باندفاع ابنه نحو الأمور المفيدة، واهتمامه بالزراعة، وتمضية وقت فراغه بهواية محببة، ثم أكمل حديثه قائلًا: ماذا تشبه هذه الأعشاب الضارة يا منذر؟ فكَّر منذر قليلًا، ثم ابتسم مجيبًا: إنها كرفاق السوء تمامًا... يصاحبوننا ثم يسيئون إلينا.", "- أحسنت ... وكيف نتصرف تجاههم؟", "- نبتعد عنهم، ونجنب أنفسنا أذاهم."]}, "poem": null, "items": [{"s": "الفهم القرائي", "q": "متى كان منذر يمارس هوايته المفضلة؟", "o": ["يوميًا، بعد إنجاز واجباته المدرسية.", "في بعض الأيام، قبل انتهاء واجباته المدرسية.", "يوميًا، قبل الانتهاء من واجباته المدرسية.", "في بعض الأيام، بعد الانتهاء من واجباته المدرسية."], "w": "جاء في الفقرة الأولى: (والتي يمارسها يوميًا بعد الانتهاء من واجباته المدرسية)."}, {"s": "الفهم القرائي", "q": "عبارة (يُقلم الأغصان) تعني أنه:", "o": ["يقصها.", "يتسلقها.", "يسقيها.", "يهملها."], "w": "تقليم الأغصان هو قص الزائد منها لينمو النبات جيدًا."}, {"s": "الفهم القرائي", "q": "ما الحدث الذي وقع مباشرة بعد تقليم الأغصان، حسب ما ورد في النص؟", "o": ["غرس الورود.", "قلب التربة.", "نثر البذور.", "ري المزروعات."], "w": "جاء في النص: (يُقلم الأغصان، ويغرس الورود...)، فغرس الورود جاء بعد التقليم مباشرة."}, {"s": "الفهم القرائي", "q": "تغير شعور منذر من الفرح إلى الحزن حسب النص، عندما:", "o": ["بدأت شتلات الطماطم بالذبول.", "استطاع القضاء على الهالوك.", "قصَّر بالعناية والسقاية.", "تجنب أصدقاء السوء."], "w": "جاء في النص: (بدأ النبات بالذبول، فانحنت السيقان... حزن منذر)."}, {"s": "الفهم القرائي", "q": "في جملة (سأل منذر أباه متلهفًا) توجد كلمة تدل على العاطفة والانفعال هي:", "o": ["متلهفًا.", "منذر.", "سأل.", "أباه."], "w": "(متلهفًا) تصف شعور منذر وشوقه الشديد لمعرفة الجواب."}, {"s": "الفهم القرائي", "q": "أضرت نبتة الهالوك بشتلات الطماطم؛ لأنها:", "o": ["امتصت غذاءها.", "نبتت في التربة بعدها.", "نبتت في التربة قبلها.", "أكلت أوراقها."], "w": "قال الأب: (وأخذت تمتص غذاءها؛ لذا فقد ذبلت النباتات)."}, {"s": "الفهم القرائي", "q": "في جملة (قد فاتنا أن نقوم بهذه العملية) ما المقصود هنا بالعملية؟", "o": ["عملية تعقيم التربة، ورشها بالمبيدات قبل الزرع.", "عملية جمع محصول الطماطم، وبيعه في السوق.", "عملية غرس الورود التي يقوم بها منذر.", "عملية سقاية شتلات الطماطم بالماء قبل أن تذبل."], "w": "قال الأب قبلها مباشرة: (بتعقيم التربة، ورشها بالمبيدات المخصصة لها قبل الزرع)."}, {"s": "الفهم القرائي", "q": "أصدقاء السوء يشبهون الهالوك؛ لأنهم:", "o": ["يسيئون للصاحب.", "لا يفهمون في الزراعة.", "يفهمون في الزراعة.", "يحسنون للصاحب."], "w": "قال منذر: (إنها كرفاق السوء تمامًا... يصاحبوننا ثم يسيئون إلينا)."}, {"s": "الفهم القرائي", "q": "نفهم من النص:", "o": ["أن الأب أكثر خبرة في الزراعة من منذر.", "أن منذر، ووالده ليس لديهما خبرة في الزراعة.", "أن منذر، ووالده لديهما خبرة في الزراعة.", "أن منذر أكثر خبرة في الزراعة من أبيه."], "w": "الأب هو الذي عرف سبب الذبول واسم الهالوك وطريقة القضاء عليه."}, {"s": "الفهم القرائي", "q": "كيف نتوقع أن يتصرف منذر في المستقبل بالاعتماد على النص؟", "o": ["يعقِّم التربة، ويرشها بالمبيدات قبل الزرع.", "يتخلى ت رة الإملائية", "q": "(المساء - الضوضاء - العشاء). أكملي: كتبت الهمزة المتطرفة على السطر في الكلمات السابقة؛ لأن ما قبلها ............", "ans": "ساكن (ألف ساكنة).", "w": "انظري إلى الحرف الذي قبل الهمزة في الكلمات الثلاث."}, {"s": "الظاهرة الإملائية", "q": "املئي الفراغ بالكلمة الصحيحة إملائيًّا: تنشرُ .......... أشعتها الذهبية.", "o": ["الشمس", "ألشمس", "شمس", "اشمس"], "w": "همزة (ال) التعريف همزة وصل، فلا تُكتب عليها همزة."}, {"s": "الظاهرة الإملائية", "q": "املئي الفراغ بالكلمة الصحيحة إملائيًّا: .......... التلميذ واجبه.", "o": ["أكمل", "اكمل", "إكمل", "كمل"], "w": "(أكمل) فعل ماضٍ رباعي، وهمزته همزة قطع مفتوحة تُكتب فوق الألف."}, {"s": "الرسم الكتابي", "q": "حرف الألف من الحروف التي ينزل جزء منها عن السطر.", "o": ["خطأ", "صواب"], "w": "الألف تُكتب قائمة فوق السطر ولا ينزل منها شيء تحته."}, {"s": "الرسم الكتابي", "q": "من مميزات خط النسخ تساوي أحجام الحروف.", "o": ["صواب", "خطأ"], "w": "خط النسخ واضح، وحروفه متناسقة متقاربة في أحجامها."}, {"s": "الرسم الكتابي", "q": "اكتبي الجملة التالية بخط النسخ وفق القواعد الصحيحة: المواطن الصالح هو المورد الأساسي في بناء الوطن.", "ans": "المواطن الصالح هو المورد الأساسي في بناء الوطن.", "w": "اكتبي الجملة بخط النسخ بحروف واضحة، واجعلي الحروف على السطر، وأنزلي الحروف النازلة مثل (الراء والواو والميم والعين) تحت السطر، واتركي مسافة بين الكلمات."}], "g": "fin"}, {"id": "fin_4", "t": "نموذج ٤", "passage": {"title": "فهم المقروء", "paras": ["في صباح يوم مشمس، قررت مدرسة الحي تنظيم رحلة إلى المحمية الطبيعية. انطلق الطلاب بالحافلة مع معلميهم إلى المحمية، وفي أثناء الطريق سأل سامي معلمه: ماذا تعني المحمية الطبيعية؟ أجاب المعلم: المحمية هي منطقة جغرافية تحددها الدولة، تحتوي على نباتات طبيعية وحيوانات معرضة للانقراض؛ للمحافظة عليها.", "كان سامي ورفاقه متحمسين جدًا لهذه المغامرة، فقد سمعوا كثيرًا عن جمال المحميات في المملكة، إلا أنهم لم يزوروها من قبل. عند وصولهم استقبلهم مرشد بيئي يدعى عادل، ثم شرح لهم أهمية المحافظة على البيئة، فقال: \"إن الحيوانات هنا تعتمد على نظافة غاباتها ومياهها لتعيش بأمان، فيجب علينا ألا نترك خلفنا أي نفايات\".", "سار التلاميذ عبر ممشى خشبي طويل يمر بين الأشجار الكثيفة، شاهدوا غزالًا يقف بعيدًا، ونعامة مسرعة، ولأول مرة يشاهدون النمر العربي. شعر سامي بسعادة كبيرة، وقال لرفيقه: لم أتخيل أن الطبيعة بهذا الجمال!", "في نهاية الرحلة اجتمع الجميع لزراعة شجرة صغيرة؛ تعبيرًا عن شكرهم للمحمية. عاد التلاميذ إلى المدرسة وهم يدركون أن حماية البيئة مسؤولية يشترك فيها الجميع."]}, "poem": null, "items": [{"s": "الفهم القرائي", "q": "ما معنى كلمة (الكثيفة)؟", "ans": "الملتفة المتقاربة الكثيرة.", "w": "الأشجار الكثيفة هي الأشجار الكثيرة المتلاصقة بعضها ببعض."}, {"s": "الفهم القرائي", "q": "ما مضاد كلمة (الأمان)؟", "ans": "الخوف (الخطر).", "w": "المضاد كلمة تعطي المعنى العكسي."}, {"s": "الفهم القرائي", "q": "أين ذهب طلاب مدرسة الحي؟", "ans": "ذهبوا في رحلة إلى المحمية الطبيعية.", "w": "الجواب في السطر الأول من النص."}, {"s": "الفهم القرائي", "q": "ضعي كلمة (سعادة) في جملة من إنشائك.", "ans": "شعرتُ بسعادة كبيرة حين نجحتُ في الاختبار.", "w": "اكتبي جملة مفيدة كاملة المعنى تحتوي على كلمة (سعادة)."}, {"s": "الفهم القرائي", "q": "اقترحي عنوانًا للنص.", "ans": "رحلة إلى المحمية الطبيعية", "w": "العنوان المناسب قصير ويدل على فكرة النص كله."}, {"s": "الفهم القرائي", "q": "من المشاهد التي تلوث البيئة ترك النفايات بعد الاستمتاع بالطبيعة. فكيف تساهمين في المحافظة على البيئة في نهاية كل رحلة؟", "ans": "أجمع النفايات في كيس وأضعها في الحاوية المخصصة لها، ولا أترك خلفي أي نفايات.", "w": "تذكّري نصيحة المرشد: (يجب علينا ألا نترك خلفنا أي نفايات)."}, {"s": "الفهم القرائي", "q": "ما رأيك في الطريقة التي عبّر بها الطلاب عن شكرهم؟", "ans": "طريقة رائعة؛ لأن زراعة الشجرة تفيد البيئة وتبقى ذكرى جميلة.", "w": "اذكري رأيكِ ثم السبب بعد كلمة (لأن). عبّر الطلاب عن شكرهم بزراعة شجرة صغيرة."}, {"s": "الفهم القرائي", "q": "الكلمة التي وصفت الطقس في يوم الرحلة:", "o": ["مشمس.", "الطبيعة.", "النباتات.", "الأشجار."], "w": "جاء في أول النص: (في صباح يوم مشمس)."}, {"s": "الفهم القرائي", "q": "استقبل التلاميذ عند ذهابهم للمحمية شخص يُدعى عادل وهو مرشد:", "o": ["بيئي.", "صحي.", "نفسي.", "اجتماعي."], "w": "جاء في النص: (استقبلهم مرشد بيئي يدعى عادل)."}, {"s": "الفهم القرائي", "q": "كل الأفكار التالية في النص عدا:", "o": ["أسماء المحميات في المملكة.", "مفهوم المحمية الطبيعية.", "مشاهدة الطلاب لبعض الحيوانات.", "حماية البيئة مسؤولية الجميع."], "w": "لم يذكر النص أسماء المحميات، أما بقية الأفكار فقد وردت فيه."}, {"s": "الفهم القرائي", "q": "إذا كنتِ تريدين تصميم لافتة إرشادية توضع على مدخل المحمية فإن العبارة المناسبة:", "o": ["المحافظة على الطبيعة واجب وطني.", "لا تتنمر، كن صديقًا جيدًا.", "سامح، أنت الرابح.", "حياتك أمانة فلا تسرع."], "w": "المحمية مكان لحماية الطبيعة، فالعبارة المناسبة تدعو إلى المحافظة عليها."}, {"s": "الوظيفة النحوية", "q": "حددي نوع الكلمات التي تحتها خط: (حفظ الطالب سورة من القرآن الكريم). الحرف هو:", "ans": "مِن", "w": "الحرف كلمة لا يظهر معناها إلا مع غيرها، مثل حروف الجر."}, {"s": "الوظيفة النحوية", "q": "في الجملة نفسها، الاسم الذي تحته خط هو:", "ans": "الكريم", "w": "الاسم كلمة تدل على إنسان أو حيوان أو شيء أو صفة، ولا ترتبط بزمن."}, {"s": "الوظيفة النحوية", "q": "في الجملة نفسها، الفعل الذي تحته خط هو:", "ans": "حفظ", "w": "الفعل كلمة تدل على حدث مرتبط بزمن."}, {"s": "الوظيفة النحوية", "q": "في الجملة نفسها (حفظ الطالب سورة من القرآن الكريم)، نوع الجملة هو:", "ans": "جملة فعلية.", "w": "الجملة التي تبدأ بفعل جملة فعلية."}, {"s": "الوظيفة النحوية", "q": "(الخضرة مبهجة للنفس والروح). الخبر في الجملة:", "o": ["مبهجة.", "النفس.", "الروح.", "الخضرة."], "w": "(الخضرة) مبتدأ، و(مبهجة) خبر أتمَّ المعنى."}, {"s": "الوظيفة النحوية", "q": "الاجتهاد طريق .......... النجاح. حرف الجر المناسب للفراغ:", "o": ["إلى.", "عن.", "في.", "الباء."], "w": "الطريق يوصل إلى مكان أو غاية، فنقول: طريق إلى النجاح."}, {"s": "الوظيفة النحوية", "q": "الجملة الفعلية التي في أولها فعل ماضٍ:", "o": ["تعاونَ الناس في الخير.", "يتعاونُ الناس في الخير.", "أتعاونُ في الخير.", "نتعاونُ في الخير."], "w": "(تعاونَ) فعل ماضٍ مبني على الفتح، أما البقية فأفعال مضارعة تبدأ بأحد حروف (أنيت)."}, {"s": "الوظيفة النحوية", "q": "انتصر الجندي على الأعداء. (اضبطي آخر الاسم المجرور بالحركة المناسبة).", "ans": "انتصر الجندي على الأعداءِ.", "w": "الاسم المجرور بعد حرف الجر (على) يُجر بالكسرة."}, {"s": "الوظيفة النحوية", "q": "السلام على الصغير والكبير. (عبّري عن المعنى باستخدام فعل أمر).", "ans": "سلِّمْ على الصغير والكبير.", "w": "حوّلي كلمة (السلام) إلى فعل أمر يطلب القيام بالعمل."}, {"s": "الوظيفة النحوية", "q": "أنجز المهندس المشروع بهمة عالية. (حددي الفاعل والمفعول به).", "ans": "الفاعل: المهندس. المفعول به: المشروع.", "w": "الفاعل هو من أنجز، والمفعول به هو ما وقع عليه الإنجاز."}, {"s": "الوظيفة النحوية", "q": "بيئتنا / على / صحتنا / لنحمي / نحافظ. (رتبي الكلمات السابقة لتكون جملة مفيدة).", "ans": "نحافظ على بيئتنا لنحمي صحتنا.", "w": "ابدئي بالفعل (نحافظ)، ثم (على بيئتنا)، ثم السبب (لنحمي صحتنا)."}, {"s": "الوظيفة النحوية", "q": "شاركي في إعراب ما تحته خط: (قدم المسلم النصيحة). المسلم: .......... مرفوع وعلامة رفعه .......... الظاهرة على آخره.", "ans": "المسلمُ: فاعل مرفوع وعلامة رفعه الضمة الظاهرة على آخره.", "w": "المسلم هو الذي قدّم النصيحة، فهو فاعل."}, {"s": "الوظيفة النحوية", "q": "في الجملة نفسها: النصيحة: .......... منصوب وعلامة نصبه .......... الظاهرة على آخره.", "ans": "النصيحةَ: مفعول به منصوب وعلامة نصبه الفتحة الظاهرة على آخره.", "w": "النصيحة هي ما وقع عليه فعل التقديم، فهي مفعول به."}, {"s": "الوظيفة النحوية", "q": "(تتنفس المخلوقات الهواء النقي). تتنفس: فعل .......... وعلامة .......... الظاهرة على آخره.", "ans": "تتنفسُ: فعل مضارع مرفوع، وعلامة رفعه الضمة الظاهرة على آخره.", "w": "الفعل المضارع يبدأ بأحد حروف (أنيت)، ويُرفع بالضمة إذا لم يسبقه ناصب أو جازم."}, {"s": "الأسلوب اللغوي", "q": "الجمل الآتية جمل منفية عدا:", "o": ["الجو لطيف.", "لم تتفتح الأزهار.", "لن ألوث بيئتي.", "ليست السماء صافية."], "w": "(الجو لطيف) ليس فيها أداة نفي، فهي جملة مثبتة."}, {"s": "الأسلوب اللغوي", "q": "(اللهم غيثًا مغيثًا). يُسمى هذا الأسلوب أسلوب:", "o": ["دعاء.", "استفهام.", "نفي.", "نهي."], "w": "فيها طلب من الله تعالى أن ينزل المطر، وهذا دعاء."}, {"s": "الأسلوب اللغوي", "q": "ميّزي نوع الجملة: (ما أورقت الأشجار).", "o": ["جملة منفية", "جملة مثبتة"], "w": "فيها أداة الن ُ الرياض)، فهي تاء مربوطة."}, {"s": "الظاهرة الإملائية", "q": "في الجملة نفسها، الحرف الأخير في كلمة (بمئذنته) هو:", "o": ["هاء.", "تاء مربوطة."], "w": "الهاء هنا ضمير يعود على الجامع، وتبقى هاءً عند الوصل: (بمئذنتِهِ الجميلة)."}, {"s": "الرسم الكتابي", "q": "(ط، ك، هـ) كلها حروف نازلة عن السطر في خط النسخ.", "o": ["خطأ", "صواب"], "w": "هذه الحروف تُكتب على السطر ولا تنزل تحته في خط النسخ."}, {"s": "الرسم الكتابي", "q": "من مميزات خط النسخ تساوي أحجام الحروف.", "o": ["صواب", "خطأ"], "w": "خط النسخ واضح، وحروفه متناسقة متقاربة في أحجامها."}, {"s": "الرسم الكتابي", "q": "اكتبي الجملة التالية بخط النسخ وفق القواعد الصحيحة: الأدب تاج العلم.", "ans": "الأدب تاج العلم.", "w": "اكتبي الجملة بخط النسخ بحروف واضحة، واجعلي الحروف على السطر، وأنزلي الحروف النازلة مثل (الراء والواو والميم والعين) تحت السطر، واتركي مسافة بين الكلمات."}], "g": "fin"}, {"id": "fin_5", "t": "نموذج ٥", "passage": {"title": "حدائق الوطن العابقة", "paras": ["كانت الزهور منذ قِدم الزمن صديقة الإنسان، تلون أيامه وتمنحه شعورًا بالسعادة، ولعلنا نحب الزهور؛ لأنها تجمع بين جمال الشكل وبهجة الألوان، فنشعر معها بالراحة والطمأنينة، وكأنها رسائل صغيرة من الطبيعة تقول لنا: \"الحياة جميلة\".", "وتتنوع الزهور في أشكالها وروائحها، فهناك الورد الجُوري بلونه الأحمر العميق، والياسمين بعطره الهادئ، والأقحوان بألوانه الزاهية، والخُزامى البنفسجية التي تفوح بعبير ناعم؛ لذلك نجد الزهور تزين الحدائق والطرقات والبيوت، وتزيدها بهاء.", "ولأن الزهور جزء من بيئتنا، فمن واجبنا المحافظة عليها؛ فنزرعها في الحدائق المدرسية والبيوت، ولا نقطفها عبثًا، ونوفر لها الماء والضوء، ونعتني بها؛ فالزهرة كائن رقيق، تُسعد من يراها، وتحتاج إلى رعايتنا؛ كي تبقى حية ومتألقة.", "وقد أولت مملكتنا الحبيبة اهتمامًا كبيرًا بالبيئة والنباتات؛ فدعمت مشروعات التشجير، وحافظت على النباتات البرية المنتشرة في صحاريها ومنها زهرة الخُزامى التي تكسو صحاري المملكة بلون بنفسجي آسر، حتى أصبحت رمزَ الجمال في بلادنا، وتألقت في المهرجانات والمناسبات الوطنية. بل إن مفارش استقبال الوفود الرسمية توشحت بلون الخُزامى؛ تقديرًا لجمالها، وتعزيزًا للهوية البيئية الوطنية."]}, "p assage": {"title": "فهم المقروء", "paras": ["البيئة والصحة مرتبطان بشكل مباشر بصحتنا، فالتلوث البيئي يمكن أن يؤدي إلى مشكلات صحية كثيرة، مثل: أمراض التنفس والسرطانات، ومن ناحية أخرى، فإن الحفاظ على البيئة صحيَّة يمكن أن يساهم في تحسين الصحة العامة.", "إن المناطق الخضراء والحدائق العامة توفر أماكن للرياضة والاسترخاء؛ مما يقلل من التوتر، ويحسن الصحَّة النفسيَّة، لذلك فإن الحفاظ على البيئة ليس مسؤولية الحكومات والمنظمات فقط؛ بل هو أيضًا مسؤولية فردية، ويمكننا جميعًا أن نساهم في حماية البيئة من خلال ترشيد استهلاك الطاقة، وتقليل النفايات، واستخدام النقل العام أو الدراجات الهوائية.", "ختامًا فإن البيئة والصحة مرتبطان بشكل وثيق، والحفاظ على البيئة ضرورة لتحسين الصحة العامة والتمتع بحياة صحيَّة ومستدامة."]}, "poem": null, "items": [{"s": "الفهم القرائي", "q": "البيئة التي نعيش فيها تؤثر بشكل مباشر على:", "o": ["صحتنا", "مستقبلنا", "مجتمعنا", "عقولنا"], "w": "في أولِ النص: «البيئة والصحة مرتبطان بشكل مباشر بصحتنا»."}, {"s": "الفهم القرائي", "q": "وردت في النص كلمة مرادفة لكلمة (نشارك) هي:", "o": ["نساهم", "نعيش", "نقلل", "نتجنب"], "w": "في الفقرة الثانية: «يمكننا جميعًا أن نساهم في حماية البيئة»، و(نساهم) بمعنى نشارك."}, {"s": "الفهم القرائي", "q": "ضد كلمة (التوتر) هي:", "o": ["الهدوء", "السرعة", "القلق", "الغضب"], "w": "التوترُ قلقٌ وانزعاج، وعكسُه الهدوءُ والراحة."}, {"s": "الفهم القرائي", "q": "أكملي الفراغ بكلمة مناسبة: الحفاظ على البيئة هو ضرورة لتحسين ......... العامة.", "ans": "الصحة", "w": "انظري إلى الفقرة الأخيرة: «ضرورة لتحسين الصحة العامة»."}, {"s": "الفهم القرائي", "q": "(البيئة والصحة مرتبطان بشكل وثيق). هل العبارة السابقة صحيحة أم خاطئة؟", "o": ["صحيحة", "خاطئة"], "w": "وردت هذه العبارةُ في الفقرةِ الأخيرةِ من النص."}, {"s": "الفهم القرائي", "q": "على من تقع مسؤولية الحفاظ على البيئة؟", "ans": "على الحكومات والمنظمات وعلى كل فرد منا.", "w": "اقرئي: «ليس مسؤولية الحكومات والمنظمات فقط؛ بل هو أيضًا مسؤولية فردية»."}, {"s": "الفهم القرائي", "q": "ما جمع كلمة (حديقة)؟", "ans": "حدائق", "w": "وردت الكلمةُ مجموعةً في النص: «الحدائق العامة»."}, {"s": "الفهم القرائي", "q": "ضعي عنوانًا مناسبًا للنص.", "ans": "البيئة والصحة", "w": "اختاري عنوانًا قصيرًا يجمعُ فكرةَ النصِّ كلَّها."}, {"s": "الفهم القرائي", "q": "ما رأيكِ في عبارة: \"الحفاظ على البيئة صحية يمكن أن يساهم في تحسين الصحة العامة\"؟", "ans": "عبارة صحيحة؛ فالبيئة النظيفة تقلل الأمراض، والمناطق الخضراء توفر لنا أماكن للرياضة والاسترخاء.", "w": "اذكري رأيكِ (صحيحة) ثمَّ علِّليه بدليلٍ من النص."}, {"s": "الأسلوب اللغوي", "q": "حدِّدي نوع الجملة: (نعم الله لا تعد ولا تحصى).", "o": ["منفية", "مثبتة"], "w": "لأنَّ فيها أداةَ النفي (لا)."}, {"s": "الأسلوب اللغوي", "q": "حدِّدي نوع الجملة: (التصحر مشكلة عالمية).", "o": ["مثبتة", "منفية"], "w": "لأنها خاليةٌ من أدواتِ النفي."}, {"s": "الأسلوب اللغوي", "q": "حدِّدي نوع الجملة: (لم تمطر السماء).", "o": ["منفية", "مثبتة"], "w": "لأنَّ فيها أداةَ النفي (لم) التي تجزمُ المضارع."}, {"s": "الأسلوب اللغوي", "q": "ما نوع الأسلوب في الجملة التالية: (لا تتأخر عن الدرس جزاك الله خيرًا).", "o": ["دعاء", "تعجب", "نداء", "استفهام"], "w": "عبارةُ (جزاك الله خيرًا) طلبُ الخيرِ من اللهِ للمخاطَب، وهذا دعاء."}, {"s": "الأسلوب اللغوي", "q": "عبِّري عن المطلوب بين القوسين بأسلوب دعاء: (إطالة العمر).", "ans": "أطال الله في عمرك يا أبي.", "w": "ابدئي بطلبٍ من الله، مثل: أطالَ اللهُ عمرَكِ."}, {"s": "الصنف اللغوي", "q": "أنواع الكلمة:", "o": ["اسم وفعل وحرف", "مثبتة ومنفية", "مبتدأ وخبر", "جار ومجرور"], "w": "الكلمةُ في العربيةِ ثلاثةُ أنواع: اسمٌ وفعلٌ وحرف."}, {"s": "الوظيفة النحوية", "q": "(محمد مجتهد في دروسه)، الخبر في الجملة السابقة هو:", "o": ["مجتهد", "محمد", "في", "دروسه"], "w": "(مجتهد) أخبرت عن المبتدأ (محمد) وأتمَّت معنى الجملة."}, {"s": "الوظيفة النحوية", "q": "(لم ينزل المطر على المدينة)، حرف الجر في الجملة السابقة هو:", "o": ["على", "لم", "ينزل", "المدينة"], "w": "(على) من حروفِ الجر، وما بعدها (المدينة) اسمٌ مجرور. أمّا (لم) فحرفُ نفيٍ وجزم."}, {"s": "الصنف اللغوي", "q": "نوع الفعل (قال):", "o": ["ماض", "مضارع", "أمر", "مستقبل"], "w": "(قال) يدلُّ على حدثٍ وقعَ وانتهى، فهو فعلٌ ماضٍ."}, {"s": "الوظيفة النحوية", "q": "(باع التاجر القماش بثمن قليل)، المفعول به في الجملة السابقة هو:", "o": ["القماش", "باع", "التاجر", "قليل"], "w": "اسألي: ماذا باع التاجر؟ الجوابُ (القماش)، فهو الذي وقعَ عليه الفعل."}, {"s": "الوظيفة النحوية", "q": "(عادت الأسرة إلى المنزل)، أكملي الإعراب: الأسرة: ...... مرفوع وعلامة رفعه ...... الظاهرة على آخره.", "ans": "الأسرة: فاعل مرفوع وعلامة رفعه الضمة الظاهرة على آخره.", "w": "الأسرةُ هي التي قامت بالعودة، فهي فاعل."}, {"s": "الوظيفة النحوية", "q": "(الطالب مجتهد)، حوِّلي الجملة السابقة من اسمية إلى فعلية.", "ans": "اجتهد الطالب.", "w": "ابدئي الجملةَ بفعلٍ مأخوذٍ من الخبر (مجتهد ← اجتهدَ)."}, {"s": "الصنف اللغوي", "q": "استخدمي فعل الأمر لتطلبي من أخيكِ الإحسان إلى الفقراء.", "ans": "أحسِنْ إلى الفقراء يا أخي.", "w": "فعلُ الأمرِ من (يُحسِنُ) هو (أحسِنْ)."}, {"s": "الظاهرة الإملائية", "q": "أكملي: الهمزة في أول الكلمة نوعان: 1- ...... 2- ......", "ans": "1- همزة قطع  2- همزة وصل", "w": "همزةُ القطعِ تُنطقُ دائمًا، وهمزةُ الوصلِ تسقطُ في وسطِ الكلام."}, {"s": "الظاهرة الإملائية", "q": "تكتب الهمزة المتطرفة على واو إذا كان ما قبلها مكسورًا.", "o": ["خطأ", "صواب"], "w": "إذا كان ما قبلها مكسورًا تُكتبُ على ياء (نبرة) مثل (شاطِئ)، وتُكتبُ على واوٍ إذا كان ما قبلها مضمومًا."}, {"s": "الظاهرة الإملائية", "q": "(الحديقة - سيارة - كبيرة) الكلمات السابقة خُتمت بتاء مربوطة.", "o": ["صواب", "خطأ"], "w": "كلُّها أسماءٌ نقفُ عليها بالهاء، فتاؤها مربوطة."}, {"s": "الظاهرة الإملائية", "q": "(الله هو ........ الرحيم)، املئي الفراغ بكلمة حُذفت الألف من وسطها من الكلمات التالية.", "o": ["الرحمن", "الكريم", "القوي", "الخالق"], "w": "تُنطقُ (الرحمان) بألفٍ بعد الميم، لكنَّها تُحذفُ في الكتابة."}, {"s": "الظاهرة الإملائية", "q": "اكتبي حروف هذه الكلمة متصلة (ج - ز - ء).", "ans": "جزء", "w": "الهمزةُ بعد الزاي الساكنةِ في آخرِ الكلمةِ تُكتبُ على السطر."}, {"s": "الظاهرة الإملائية", "q": "صحِّحي ما بين القوسين: حديقة المنزل (واسعت).", "ans": "واسعة", "w": "(واسعة) صفةٌ مؤنثةٌ نقفُ عليها بالهاء، فتُكتبُ بتاءٍ مربوطة."}, {"s": "الرسم الكتابي", "q": "في خط النسخ، من الحروف التي تكتب مرتكزة على السطر غه بهواية محببة، ثم أكمل حديثه قائلًا: ماذا تشبه هذه الأعشاب الضارة يا منذر؟ فكَّر منذر قليلًا، ثم ابتسم مجيبًا: إنها كرفاق السوء تمامًا... يصاحبوننا ثم يسيئون إلينا.", "- أحسنت ... وكيف نتصرف تجاههم؟", "- نبتعد عنهم، ونجنب أنفسنا أذاهم."]}, "poem": null, "items": [{"s": "الفهم القرائي", "q": "متى كان منذر يمارس هوايته المفضلة؟", "o": ["يوميًا، بعد إنجاز واجباته المدرسية", "في بعض الأيام، قبل إنهاء واجباته المدرسية", "يوميًا، قبل الانتهاء من واجباته المدرسية", "في بعض الأيام، بعد الانتهاء من واجباته المدرسية"], "w": "في الفقرة الأولى: «يمارسها يوميًا بعد الانتهاء من واجباته المدرسية»."}, {"s": "الفهم القرائي", "q": "عبارة (يُقلم الأغصان) تعني أنه:", "o": ["يقصها", "يتسلقها", "يسقيها", "يهملها"], "w": "تقليمُ الأغصانِ هو قصُّ الزائدِ منها لتنموَ الشجرةُ جيدًا."}, {"s": "الفهم القرائي", "q": "ما الحدث الذي وقع مباشرة بعد تقليم الأغصان، حسب ما ورد في النص؟", "o": ["غرس الورود", "قلب التربة", "نثر البذور", "ري المزروعات"], "w": "ترتيبُ الأعمالِ في النص: يقلم الأغصان، ثمَّ يغرس الورود، ثمَّ يقلب التربة."}, {"s": "الفهم القرائي", "q": "تغير شعور منذر من الفرح إلى الحزن حسب النص، عندما:", "o": ["بدأت شتلات الطماطم بالذبول", "استطاع القضاء على الهالوك", "قصَّر بالعناية والسقاية", "تجنب أصدقاء السوء"], "w": "في النص: «بدأ النبات بالذبول... حزن منذر»."}, {"s": "الفهم القرائي", "q": "في جملة (سأل منذر أباه متلهفًا) توجد كلمة تدل على العاطفة والانفعال هي:", "o": ["متلهفًا", "منذر", "سأل", "أباه"], "w": "(متلهفًا) تصفُ شعورَ منذرٍ وشوقَه الشديدَ لمعرفةِ الجواب."}, {"s": "الفهم القرائي", "q": "أضرت نبتة الهالوك بشتلات الطماطم؛ لأنها:", "o": ["امتصت غذاءها", "نبتت في التربة بعدها", "نبتت في التربة قبلها", "أكلت أوراقها"], "w": "في النص: «وأخذت تمتص غذاءها؛ لذا فقد ذبلت النباتات»."}, {"s": "الفهم القرائي", "q": "في جملة (قد فاتنا أن نقوم بهذه العملية) ما المقصود هنا بالعملية؟", "o": ["عملية تعقيم التربة، ورشها بالمبيدات قبل الزرع", "عملية جمع محصول الطماطم، وبيعه في السوق", "عملية غرس الورود التي يقوم بها منذر", "عملية سقاية شتلات الطماطم بالماء قبل أن تذبل"], "w": "قبلَها مباشرةً وي", "q": "اكتبي مفردًا مناسبًا لكلمة (الطريقان).", "ans": "الطريق", "w": "احذفي علامةَ التثنيةِ (ان)."}, {"s": "الصنف اللغوي", "q": "اكتبي مفردًا مناسبًا لكلمة (المزارعون).", "ans": "المزارع", "w": "احذفي علامةَ الجمعِ (ون)."}, {"s": "الصنف اللغوي", "q": "اكتبي مفردًا مناسبًا لكلمة (التلميذات).", "ans": "التلميذة", "w": "احذفي (ات) وضعي تاءً مربوطة."}, {"s": "الظاهرة الإملائية", "q": "(تباطؤ - شاطئ - منشأ - بدَءًا). الكلمة التي كتبت بشكل خاطئ فيما سبق هي:", "o": ["بدَءًا", "تباطؤ", "شاطئ", "منشأ"], "w": "الدالُ في (بدَءًا) مفتوحة، والهمزةُ بعدَ الفتحِ تُكتبُ على الألف، أمّا الكلماتُ الأخرى فرُسمت همزتُها رسمًا صحيحًا."}, {"s": "الظاهرة الإملائية", "q": "(المساء - الضوضاء - العشاء). أكملي: كُتبت الهمزة المتطرفة على السطر في الكلمات السابقة؛ لأن ما قبلها ......", "ans": "ساكن", "w": "انظري إلى الحرفِ قبلَ الهمزة: إنه ألفٌ ساكنة."}, {"s": "الظاهرة الإملائية", "q": "تنشرُ ............ أشعتها الذهبية. الكلمة الصحيحة إملائيًا:", "o": ["الشمس", "ألشمس", "شمس", "اشمس"], "w": "(ال) في أولِ الاسمِ همزتُها همزةُ وصلٍ فلا تُكتبُ عليها همزة."}, {"s": "الظاهرة الإملائية", "q": "............ التلميذ واجبه. الكلمة الصحيحة إملائيًا:", "o": ["أكمل", "اكمل", "إكمل", "كمل"], "w": "(أكملَ) فعلٌ ماضٍ رباعي، همزتُه همزةُ قطعٍ مفتوحةٌ تُكتبُ فوقَ الألف."}, {"s": "الرسم الكتابي", "q": "حرف الألف من الحروف التي ينزل جزء منها عن السطر.", "o": ["خطأ", "صواب"], "w": "الألفُ تُكتبُ قائمةً فوقَ السطرِ ولا تنزلُ تحته."}, {"s": "الرسم الكتابي", "q": "من مميزات خط النسخ تساوي أحجام الحروف.", "o": ["صواب", "خطأ"], "w": "خطُّ النسخِ واضحٌ ومنتظمٌ، وحروفُه متناسقةُ الأحجام."}, {"s": "الرسم الكتابي", "q": "اكتبي الجملة التالية بخط النسخ وفق القواعد الصحيحة: المواطن الصالح هو المورد الأساسي في بناء الوطن.", "ans": "المواطن الصالح هو المورد الأساسي في بناء الوطن.", "w": "في خط النسخ ضعي الحروفَ على السطر، وأنزلي الحروفَ النازلةَ (ر، ي، ح، ن) تحته، واتركي مسافاتٍ متساويةً بين الكلمات."}], "g": "fin"}, {"id": "fin_8", "t": "نموذج ٨", "passage": {"title": "فهم المقروء", "paras": ["في صباح يوم مشمس، قررت مدرسة الحي تنظيم رحلة إلى المحمية الطبيعية. انطلق الطلاب بالحافلة مع معلميهم إلى المحمية، وفي أثناء الطريق سأل سامي معلمه: ماذا تعني المحمية الطبيعية؟ أجاب المعلم: المحمية هي منطقة جغرافية تحددها الدولة، تحتوي على نباتات طبيعية وحيوانات معرضة للانقراض؛ للمحافظة عليها.", "كان سامي ورفاقه متحمسين جدًا لهذه المغامرة، فقد سمعوا كثيرًا عن جمال المحميات في المملكة، إلا أنهم لم يزوروها من قبل. عند وصولهم استقبلهم مرشد بيئي يدعى عادل، ثم شرح لهم أهمية المحافظة على البيئة، فقال: \"إن الحيوانات هنا تعتمد على نظافة غاباتها ومياهها لتعيش بأمان، فيجب علينا ألا نترك خلفنا أي نفايات\".", "سار التلاميذ عبر ممشى خشبي طويل يمر بين الأشجار الكثيفة، شاهدوا غزالًا يقف بعيدًا، ونعامة مسرعة، ولأول مرة يشاهدون النمر العربي. شعر سامي بسعادة كبيرة، وقال لرفيقه: لم أتخيل أن الطبيعة بهذا الجمال!", "في نهاية الرحلة اجتمع الجميع لزراعة شجرة صغيرة؛ تعبيرًا عن شكرهم للمحمية. عاد التلاميذ إلى المدرسة وهم يدركون أن حماية البيئة مسؤولية يشترك فيها الجميع."]}, "poem": null, "items": [{"s": "الفهم القرائي", "q": "ما معنى كلمة (الكثيفة)؟", "ans": "الكثيرة المتقاربة الملتفة الأوراق.", "w": "الأشجارُ الكثيفةُ هي الأشجارُ الكثيرةُ المتقاربةُ بعضُها من بعض."}, {"s": "الفهم القرائي", "q": "ما مضاد كلمة (الأمان)؟", "ans": "الخوف", "w": "المضادُّ هو عكسُ المعنى."}, {"s": "الفهم القرائي", "q": "أين ذهب طلاب مدرسة الحي؟", "ans": "ذهبوا في رحلة إلى المحمية الطبيعية.", "w": "الجوابُ في أولِ سطرٍ من النص."}, {"s": "الفهم القرائي", "q": "ضعي كلمة (سعادة) في جملة من إنشائكِ.", "ans": "شعرتُ بسعادةٍ كبيرةٍ عندما نجحتُ.", "w": "اكتبي جملةً مفيدةً تامةَ المعنى فيها كلمةُ (سعادة)."}, {"s": "الفهم القرائي", "q": "اقترحي عنوانًا للنص.", "ans": "رحلة إلى المحمية الطبيعية", "w": "اختاري عنوانًا قصيرًا يدلُّ على فكرةِ النص."}, {"s": "الفهم القرائي", "q": "من المشاهد التي تلوث البيئة ترك النفايات بعد الاستمتاع بالطبيعة. فكيف تساهمين في المحافظة على البيئة في نهاية كل رحلة؟", "ans": "بعد الانتهاء من الرحلة، أجمع كل النفايات وأضعها في المكان المخصص لها؛ حتى يبقى المكان نظيفًا ولا يتأذى من يأتي بعدنا.", "w": "تذكَّري قولَ المرشد: «ي   function stop() { if (cur) { cur.pause(); cur = null; } if (window.speechSynthesis) speechSynthesis.cancel(); if (curBtn) curBtn.classList.remove('playing'); curBtn = null; }
  function speak(text, key, btn) {
    stop(); curBtn = btn || null; if (btn) btn.classList.add('playing');
    var done = function () { if (btn) btn.classList.remove('playing'); };
    if (key && AUDIO[key]) { cur = new Audio(AUDIO[key]); cur.onended = done; cur.play().catch(done); return; }
    if (!window.speechSynthesis) return done();
    var u = new SpeechSynthesisUtterance(text.replace(/[⭐☆🎀🚪✂️🔗👀🏷️🏃🔤🙈☝️✌️🖐️❓🎯🙋📦😊😢🧹📝📏👂✍️❌↔️🟰😴😃🚂✋]/g, ''));
    u.lang = 'ar-SA'; u.rate = .9;
    var v = speechSynthesis.getVoices().filter(function (x) { return /^ar/i.test(x.lang); });
    if (v.length) u.voice = v.filter(function (x) { return /female|laila|zariyah|salma|hoda|mariam/i.test(x.name); })[0] || v[0];
    u.onend = done; u.onerror = done; speechSynthesis.speak(u);
  }
  if (window.speechSynthesis) speechSynthesis.getVoices();

  function lessonsHome() {
    var n = 0;
    return G.map(function (g) {
      return '<div class="grp"><div class="gh"><span class="gi">' + g[0] + '</span><div><b>' + g[1] + '</b><small>' + g[2] + '</small></div></div><div class="grid">' + g[3].map(function (id) {
        var i = LIX[id], l = L[i]; n++;
        return '<button class="lc" style="--c:' + l.c + '" data-i="' + i + '"><span class="n">الدَّرس ' + AR(n) + '</span><span class="ic">' + l.ic + '</span><b>' + l.t + '</b><span class="stars">' + stars(prog[l.id] || 0) + '</span></button>';
      }).join('') + '</div></div>';
    }).join('');
  }
  function summary() {
    stop();
    app.innerHTML = '<div class="wrap sumpage"><div class="top"><button class="iconbtn" id="back" aria-label="رجوع">→</button><h1>📋 الملخَّصُ السَّريع</h1><button class="iconbtn" id="prn" aria-label="طباعة">🖨️</button></div>' +
      '<div class="tip">💡 كلُّ درسٍ في بطاقة: القاعدةُ والأمثلةُ والحيلة. اضغطي 🔊 لتسمعي الدَّرس.</div>' +
      G.map(function (g) {
        return '<h2 class="sec">' + g[0] + ' ' + g[1] + '</h2>' + g[3].map(function (id) {
          var i = LIX[id], l = L[i];
          return '<div class="card sc" style="--c:' + l.c + '"><button class="say" data-l="' + i + '">🔊</button><h2>' + l.ic + ' ' + l.t + '</h2><ul>' +
            l.learn.map(function (c) { return '<li><b>' + c[0] + ':</b> ' + c[1] + (c[2].length ? ' <span class="eg">' + c[2].join(' · ') + '</span>' : '') + '</li>'; }).join('') +
            '</ul><div class="tk">💡 ' + l.trick + '</div></div>';

      }).join('') + '<button class="big" id="back2">← العودة إلى الدُّروس</button></div>';
    document.getElementById('back').onclick = home; document.getElementById('back2').onclick = home;
    document.getElementById('prn').onclick = function () { window.print(); };
    [].forEach.call(app.querySelectorAll('[data-l]'), function (b) {
      b.onclick = function () { var l = L[+b.dataset.l]; speak(l.t + '. ' + l.learn.map(function (c) { return c[0] + '. ' + c[1] + ' ' + c[2].join('. '); }).join('. ') + '. ' + l.trick, null, b); };
    });
    window.scrollTo(0, 0);
  }
  function home() {
    stop();
    var total = L.length * 3, got = 0; L.forEach(function (l) { got += (prog[l.id] || 0); });
    app.innerHTML = '<div class="wrap"><div class="top"><h1>لغتي مع نادين 📚</h1><span class="chip">⭐ ' + AR(got) + ' / ' + AR(total) + '</span></div>' +
      '<div class="sub">مهاراتُ لغتي — الصفُّ الرابع — الفصلُ الدراسيُّ الأوَّل</div><div class="hello">' + pick(HELLO) + '</div><div class="bar"><i style="width:' + (got / total * 100) + '%"></i></div>' +
      '<button class="big sum" id="sumb">📋 الملخَّصُ السَّريع لكلِّ الدُّروس</button>' +
      '<h2 class="sec" style="color:var(--main)">📚 الدُّروس</h2>' + lessonsHome() +
      '<button class="big" id="mix">🎯 اختبارٌ سريعٌ من كلِّ الدُّروس</button>' + examsHome() +
      '<div class="foot">من كتاب «مهارات لغتي» — أ. موضي الحربي · خاصٌّ بنادين الشمراني 💜</div></div>';

    document.getElementById('sumb').onclick = summary;
    [].forEach.call(app.querySelectorAll('.xc'), function (b) { b.onclick = function () { exam(+b.dataset.x, 0); }; });
    document.getElementById('mix').onclick = function () {

      quiz({ id: 'mix', t: 'اختبارٌ سريع', c: '#6D4FC9', ic: '🎯' }, shuffle(all).slice(0, 10), true);

  function header(l, step) {
    return '<div class="top"><button class="iconbtn" id="back" aria-label="رجوع">→</button><h1 style="color:' + l.c + '">' + l.ic + ' ' + l.t + '</h1></div>' +
      (step == null ? '' : '<div class="steps">' + ['🎧 أفهم', '💡 تذكَّري', '✏️ أتدرَّب'].concat(l.xq && l.xq.length ? ['📝 من الاختبارات'] : []).map(function (s, i) { return '<button data-s="' + i + '"' + (i === step ? ' class="on"' : '') + '>' + s + '</button>'; }).join('') + '</div>');
  }
  function wire(l, li) {
    document.getElementById('back').onclick = home;
    [].forEach.call(app.querySelectorAll('.steps button'), function (b) { b.onclick = function () { lesson(li, +b.dataset.s); }; });
  }

  function lesson(li, step, ci) {
    stop(); var l = L[li]; ci = ci || 0;
    var body = '';
    if (step === 0) {
      var c = l.learn[ci];
      body = '<div class="card"><button class="say" id="say">🔊</button><h2>' + c[0] + '</h2><p>' + c[1] + '</p>' +
        (c[2].length ? '<div class="ex">' + c[2].map(function (e) { return '<span>' + e + '</span>'; }).join('') + '</div>' : '') + '</div>' +
        '<div class="nav">' + (ci ? '<button class="btn alt" id="prev">→ السَّابق</button>' : '<span></span>') + '<span class="dots">' + AR(ci + 1) + ' / ' + AR(l.learn.length) + '</span>' +
        '<button class="btn" id="next">' + (ci < l.learn.length - 1 ? 'التَّالي ←' : 'تذكَّري 💡') + '</button></div>';
    } else if (step === 1) {
      body = '<div class="card trick"><button class="say" id="say">🔊</button><div class="bulb">💡</div><h2 style="padding:0">حيلةٌ تساعدُكِ على التَّذكُّر</h2><p>' + l.trick + '</p></div>' +
        '<div class="nav"><button class="btn alt" id="prev">→ أفهم</button><span class="dots"></span><button class="btn" id="next">أتدرَّب ✏️</button></div>';
    }
    if (step === 2) return quiz(l, l.qs.map(function (q, k) { return { l: l, q: q, k: k }; }), false, li, 2);
    if (step === 3) return quiz(l, l.xq.map(function (q, k) { return { l: l, q: q, k: 100 + k }; }), false, li, 3);
    app.innerHTML = '<div class="wrap" style="--c:' + l.c + '">' + header(l, step) + body + '</div>';
    wire(l, li);
    var say = document.getElementById('say');
    if (step === 0) {
      var c2 = l.learn[ci], txt = c2[0] + '. ' + c2[1] + ' ' + c2[2].join('. ');
      say.onclick = function () { speak(txt, l.id + '/l' + (ci + 1), say); };
      document.getElementById('next').onclick = function () { ci < l.learn.length - 1 ? lesson(li, 0, ci + 1) : lesson(li, 1); };
      if (ci) document.getElementById('prev').onclick = function () { lesson(li, 0, ci - 1); };
    } else {
      say.onclick = function () { speak(l.trick, l.id + '/trick', say); };
      document.getElementById('next').onclick = function () { lesson(li, 2); };
      document.getElementById('prev').onclick = function () { lesson(li, 0); };
    }
    window.scrollTo(0, 0);
  }

  function quiz(l, items, mixed, li, qstep, replay) {
    var qi = 0, score = 0, wrongs = [], tried;
    function show() {
      stop();
      var it = items[qi], q = it.q, ll = it.l; tried = false;
      var opts = shuffle(q[1].map(function (o, i) { return { o: o, ok: i === q[2] }; }));
      app.innerHTML = '<div class="wrap" style="--c:' + (mixed ? l.c : ll.c) + '">' + header(l, mixed ? null : qstep) +
        '<div class="card">' + (mixed ? '<div style="color:' + ll.c + ';font:800 15px B">' + ll.ic + ' ' + ll.t + '</div>' : '') +
        '<button class="say" id="sayq">🔊</button><div class="q">' + q[0] + '</div><div class="opts">' +
        opts.map(function (o, i) { return '<button data-i="' + i + '">' + o.o + '</button>'; }).join('') + '</div><div id="why"></div></div>' +
        '<div class="nav"><span></span><span class="dots">السُّؤال ' + AR(qi + 1) + ' / ' + AR(items.length) + '</span><button class="btn hidden" id="next">' + (qi < items.length - 1 ? 'التَّالي ←' : 'النَّتيجة 🏆') + '</button></div></div>';
      document.getElementById('back').onclick = home;
      if (!mixed) [].forEach.call(app.querySelectorAll('.steps button'), function (b) { b.onclick = function () { lesson(li, +b.dataset.s); }; });
      var sq = document.getElementById('sayq'), qtext = q[0].replace(/…/g, '، ') + ' ' + q[1].join('، أم ') + '؟';
      sq.onclick = function () { speak(qtext, ll.id + '/q' + (it.k + 1), sq); };
      setTimeout(function () { speak(qtext, ll.id + '/q' + (it.k + 1), sq); }, 250);
      [].forEach.call(app.querySelectorAll('.opts button'), function (b) {
        b.onclick = function () {
          var o = opts[+b.dataset.i], praise;
          if (!o.ok && !tried && opts.length > 2) { tried = true; b.disabled = true; b.classList.add('wrong'); var m = pick(AGAIN); document.getElementById('why').innerHTML = '<div class="again">' + m + '</div>'; speak(plain(m)); return; }
          var first = !tried;
          [].forEach.call(app.querySelectorAll('.opts button'), function (x) { x.disabled = true; if (opts[+x.dataset.i].ok) x.classList.add('right'); });
          if (o.ok && first) score++; if (!o.ok) b.classList.add('wrong'); if (!(o.ok && first)) wrongs.push(it);
          var right = q[1][q[2]];
          document.getElementById('why').innerHTML = '<div class="why"><button class="say" id="sayw">🔊</button><b>' + (o.ok ? '✅ ' + (praise = pick(first ? GOOD : SECOND)) : '💡 ' + (praise = pick(TRY)) + '<br>الإجابةُ الصَّحيحة: ' + right) + '</b>لماذا؟ ' + q[3] + '</div>';
          var sw = document.getElementById('sayw'), wt = plain(praise) + '. ' + (o.ok ? '' : 'الإجابةُ الصَّحيحة: ' + right + '. ') + 'لماذا؟ ' + q[3];
          sw.onclick = function () { speak(wt, ll.id + '/w' + (it.k + 1), sw); };
          speak(wt, ll.id + '/w' + (it.k + 1), sw);
          document.getElementById('next').classList.remove('hidden');
          if (o.ok && first) confettiSmall();
        };
      });
      document.getElementById('next').onclick = function () { qi++; qi < items.length ? show() : result(); };
      window.scrollTo(0, 0);
    }
    function confettiSmall() { var fx = document.getElementById('fx'); for (var i = 0; i < 8; i++) { var e = document.createElement('i'); e.textContent = '⭐'; e.style.left = 30 + Math.random() * 40 + 'vw'; fx.appendChild(e); setTimeout(function (x) { x.remove(); }, 2600, e); } }
    function result() {
      stop();
      var r = score / items.length, st = r === 1 ? 3 : r >= .7 ? 2 : 1;
      if (!mixed && !replay) { prog[l.id] = Math.max(prog[l.id] || 0, st); save(); }
      if (st >= 2) confetti();
      app.innerHTML = '<div class="wrap" style="--c:' + l.c + '">' + header(l, null) + '<div class="card res"><div class="st">' + stars(st) + '</div><h2>' + (st === 3 ? 'ممتاز يا نادين! 🎉' : st === 2 ? 'أحسنتِ يا نادين! 👏' : 'تحتاجينَ إلى تدريبٍ أكثر؛ أعيدي حتَّى تحصلي على ثلاثِ نجوم 💪') + '</h2>' +
        '<p>أجبتِ إجابةً صحيحةً عن ' + AR(score) + ' من ' + AR(items.length) + '</p></div>' +
        '<div class="nav"><button class="btn alt" id="again">🔁 أعيدي</button><span></span><button class="btn" id="home">الدُّروس 📚</button></div>' +
        (wrongs.length ? '<button class="big" id="fix" style="background:#E06C3C">🔁 أعيدي الأسئلةَ التي أخطأتِ فيها (' + AR(wrongs.length) + ')</button>' : '') +
        (!mixed && qstep === 2 && l.xq && l.xq.length ? '<button class="big" id="more" style="background:' + l.c + '">📝 تدرَّبي على أسئلةِ الاختباراتِ (' + AR(l.xq.length) + ')</button>' : '') + '</div>';
      if (document.getElementById('fix')) document.getElementById('fix').onclick = function () { quiz(l, wrongs, mixed, li, qstep, true); };
      if (document.getElementById('more')) document.getElementById('more').onclick = function () { lesson(li, 3); };
      document.getElementById('back').onclick = home; document.getElementById('home').onclick = home;
      document.getElementById('again').onclick = function () { mixed ? document.getElementById('home').click() : lesson(li, qstep); };
      var s = st === 3 ? 'ممتاز يا نادين!' : st === 2 ? 'أحسنتِ يا نادين!' : 'تحتاجينَ إلى تدريبٍ أكثر؛ أعيدي حتَّى تحصلي على ثلاثِ نجوم';
      speak(s);
    }
    show();
  }

  // ---- practice exams (from the teacher's exam papers) ----
  var XG = [['p1', '📝 اختبارات الفترة الأولى', '#2E9E6B'], ['p2', '📗 اختبارات الفترة الثانية', '#2B7BB9'], ['sim', '⭐ الاختبار المحاكي للوزاري', '#C77A12'], ['fin', '🏁 اختبارات نهاية الفصل', '#D9534F']];
  function examsHome() {
    if (!X.length) return '';
    var TAG = { p1: 'الفترة الأولى', p2: 'الفترة الثانية', sim: 'المحاكي للوزاري', fin: 'نهاية الفصل' };
    var XH = [['p1', '📝', 'اختباراتُ الفترةِ الأولى', 'تبدئين بها أوَّلًا.'], ['p2', '📗', 'اختباراتُ الفترةِ الثَّانية', 'بعدَ أن تُنهي الفترةَ الأولى.'], ['c', '⭐', 'الاختباراتُ المركزيَّة (نهايةُ الفصل)', 'تشبهُ اختبارَ آخرِ الفصل تمامًا.']];
    return '<h2 class="sec" style="color:#2E9E6B">📝 الاختبارات (' + AR(X.length) + ')</h2>' + XH.map(function (h) {
      var list = X.map(function (x, i) { return [x, i]; }).filter(function (p) { return h[0] === 'c' ? (p[0].g === 'sim' || p[0].g === 'fin') : p[0].g === h[0]; });
      if (!list.length) return '';
      return '<div class="grp"><div class="gh"><span class="gi">' + h[1] + '</span><div><b>' + h[2] + '</b><small>' + h[3] + '</small></div></div><div class="grid">' + list.map(function (p) {
        var x = p[0], i = p[1];
        return '<button class="lc xc" style="--c:' + xcolor(x) + '" data-x="' + i + '"><span class="n">' + TAG[x.g] + '</span><span class="ic">' + (x.passage ? '📖' : '✏️') + '</span><b>الاختبار ' + AR(i + 1) + '</b><span class="qn">' + AR(x.items.length) + ' سؤالًا</span><span class="stars">' + stars(prog['x_' + x.id] || 0) + '</span></button>';
      }).join('') + '</div></div>';
    }).join('');
  }
  function xtitle(x, n) { var t = x.passage && x.passage.title; return t && !/المقروء|القرائي|^النص$/.test(t) ? esc(t) : 'اختبار ' + AR(n + 1); }
  function xcolor(x) { for (var i = 0; i < XG.length; i++) if (XG[i][0] === x.g) return XG[i][2]; return '#2E9E6B'; }
  function passageHTML(x) {
    var h = '';
    if (x.passage) h += '<div class="card psg"><h2>📖 ' + esc(x.passage.title || 'النَّصّ') + '</h2>' + x.passage.paras.map(function (p, i) { return '<p class="pp"><button class="say sm" data-p="' + i + '">🔊</button>' + esc(p) + '</p>'; }).join('') + '</div>';
    if (x.poem && x.poem.length) h += '<div class="card psg poem"><h2>🦋 الأبيات</h2>' + x.poem.map(function (p, i) { return '<p class="pp"><button class="say sm" data-b="' + i + '">🔊</button>' + esc(p) + '</p>'; }).join('') + '</div>';
    return h;
  }
  function wirePassage(x, root) {
    [].forEach.call(root.querySelectorAll('[data-p]'), function (b) { b.onclick = function () { speak(x.passage.paras[+b.dataset.p], null, b); }; });
    [].forEach.call(root.querySelectorAll('[data-b]'), function (b) { b.onclick = function () { speak(x.poem[+b.dataset.b], null, b); }; });
  }
  function exam(xi, step) {
    stop(); var x = X[xi], c = xcolor(x), hasText = !!(x.passage || (x.poem && x.poem.length));
    var top = '<div class="top"><button class="iconbtn" id="back" aria-label="رجوع">→</button><h1 style="color:' + c + '">الاختبار ' + AR(xi + 1) + '</h1></div>';
    if (step === 0 && hasText) {
      app.innerHTML = '<div class="wrap" style="--c:' + c + '">' + top + '<div class="tip">💡 اقرئي النَّصَّ بهدوء، واضغطي 🔊 لتسمعي كلَّ فقرة، ثمَّ ابدئي الأسئلة.</div>' + passageHTML(x) +
        '<button class="big" style="background:' + c + '" id="go">ابدئي الأسئلة ✏️</button></div>';
      wirePassage(x, app);
      document.getElementById('back').onclick = home;
      document.getElementById('go').onclick = function () { exam(xi, 1); };
      window.scrollTo(0, 0); return;
    }
    var qi = 0, score = 0, total = 0, items = x.items, wrongs = [], tried;
    function show() {
      stop();
      var it = items[qi], open = !it.o; tried = false;
      var opts = open ? [] : shuffle(it.o.map(function (o, i) { return { o: o, ok: i === 0 }; }));
      app.innerHTML = '<div class="wrap" style="--c:' + c + '">' + top +
        (hasText ? '<button class="ptog" id="ptog">📖 اعرضي النَّصّ</button><div id="pbox" class="hidden">' + passageHTML(x) + '</div>' : '') +
        '<div class="card">' + (it.s ? '<div class="secb"><b>' + esc(it.s) + '</b>' + (qi === 0 || items[qi - 1].s !== it.s ? '<small>قسمٌ جديد: ' + esc(SDESC[it.s] || '') + '</small>' : '') + '</div>' : '') + '<button class="say" id="sayq">🔊</button><div class="q">' + esc(it.q) + '</div>' +
        (open ? '<div class="tip">✍️ فكِّري في الإجابة، أو اكتبيها في دفترك، ثمَّ اضغطي الزِّر.</div><button class="btn" id="show">👀 أظهري الإجابة</button>'
              : '<div class="opts">' + opts.map(function (o, i) { return '<button data-i="' + i + '">' + esc(o.o) + '</button>'; }).join('') + '</div>') +
        '<div id="why"></div></div>' +
        '<div class="nav"><span></span><span class="dots">السُّؤال ' + AR(qi + 1) + ' / ' + AR(items.length) + '</span><button class="btn hidden" id="next">' + (qi < items.length - 1 ? 'التَّالي ←' : 'النَّتيجة 🏆') + '</button></div></div>';
      document.getElementById('back').onclick = home;
      if (hasText) { wirePassage(x, document.getElementById('pbox')); document.getElementById('ptog').onclick = function () { var b = document.getElementById('pbox'); b.classList.toggle('hidden'); this.textContent = b.classList.contains('hidden') ? '📖 اعرضي النَّصّ' : '🙈 أخفي النَّصّ'; }; }
      var sq = document.getElementById('sayq'), qtext = it.q.replace(/…|\.{3,}/g, '، ') + (open ? '' : ' ' + it.o.join('، أم ') + '؟');
      sq.onclick = function () { speak(qtext, null, sq); };
      setTimeout(function () { speak(qtext, null, sq); }, 250);
      var next = document.getElementById('next');
      function whyBox(head, body, spoken) {
        document.getElementById('why').innerHTML = '<div class="why"><button class="say" id="sayw">🔊</button><b>' + head + '</b>' + body + '</div>';
        var sw = document.getElementById('sayw'); sw.onclick = function () { speak(spoken, null, sw); }; speak(spoken, null, sw);
      }
      if (open) {
        document.getElementById('show').onclick = function () {
          this.remove();
          whyBox('✅ الإجابة:', esc(it.ans) + (it.w ? '<div class="hint">💡 ' + esc(it.w) + '</div>' : '') +
            '<div class="self">هل كانت إجابتُكِ مثلَها؟<button class="btn" id="yes">نعم 😊</button><button class="btn alt" id="no">ليس تمامًا</button></div>',
            'الإجابة: ' + it.ans + '. ' + (it.w || ''));
          function mark(ok) { total++; if (ok) { score++; confettiSmall(); } else wrongs.push(it); var s = document.querySelector('.self'); s.innerHTML = ok ? pick(GOOD) : pick(TRY); speak(plain(s.textContent)); next.classList.remove('hidden'); }
          document.getElementById('yes').onclick = function () { mark(true); };
          document.getElementById('no').onclick = function () { mark(false); };
        };
      } else {
        [].forEach.call(app.querySelectorAll('.opts button'), function (b) {
          b.onclick = function () {
            var o = opts[+b.dataset.i];
            if (!o.ok && !tried && opts.length > 2) { tried = true; b.disabled = true; b.classList.add('wrong'); var m = pick(AGAIN); document.getElementById('why').innerHTML = '<div class="again">' + m + '</div>'; speak(plain(m)); return; }
            var first = !tried, pr = o.ok ? pick(first ? GOOD : SECOND) : pick(TRY); total++;
            [].forEach.call(app.querySelectorAll('.opts button'), function (y) { y.disabled = true; if (opts[+y.dataset.i].ok) y.classList.add('right'); });
            if (o.ok && first) { score++; confettiSmall(); } if (!o.ok) b.classList.add('wrong'); if (!(o.ok && first)) wrongs.push(it);
            whyBox((o.ok ? '✅ ' : '💡 ') + pr + (o.ok ? '' : '<br>الإجابةُ الصَّحيحة: ' + esc(it.o[0])), (it.w ? 'لماذا؟ ' + esc(it.w) : ''),
              plain(pr) + '. ' + (o.ok ? '' : 'الإجابةُ الصَّحيحة: ' + it.o[0] + '. ') + (it.w ? 'لماذا؟ ' + it.w : ''));
            next.classList.remove('hidden');
          };
        });
      }
      next.onclick = function () { qi++; qi < items.length ? show() : result(); };
      window.scrollTo(0, 0);
    }
    function confettiSmall() { var fx = document.getElementById('fx'); for (var i = 0; i < 8; i++) { var e = document.createElement('i'); e.textContent = '⭐'; e.style.left = 30 + Math.random() * 40 + 'vw'; fx.appendChild(e); setTimeout(function (y) { y.remove(); }, 2600, e); } }
    function result() {
      stop();
      var r = total ? score / total : 0, st = r >= .95 ? 3 : r >= .7 ? 2 : 1;
      if (items === x.items) { prog['x_' + x.id] = Math.max(prog['x_' + x.id] || 0, st); save(); }
      if (st >= 2) confetti();
      var msg = st === 3 ? 'ممتازٌ يا نادين! أنتِ جاهزةٌ للاختبار 🏆' : st === 2 ? 'أحسنتِ يا نادين! راجعي الأخطاءَ القليلةَ وستصلينَ إلى القمَّة 👏' : 'تحتاجينَ إلى تدريبٍ أكثر؛ أعيدي الأسئلةَ التي أخطأتِ فيها حتَّى تُتقنيها 💪';
      app.innerHTML = '<div class="wrap" style="--c:' + c + '">' + top + '<div class="card res"><div class="st">' + stars(st) + '</div><h2>' + msg + '</h2>' +
        '<p>أصبتِ في ' + AR(score) + ' من ' + AR(total) + '</p></div>' +
        '<div class="nav"><button class="btn alt" id="again">🔁 أعيدي</button><span></span><button class="btn" id="home">الرَّئيسيَّة 📚</button></div>' +
        (wrongs.length ? '<button class="big" id="fix" style="background:#E06C3C">🔁 أعيدي الأسئلةَ التي أخطأتِ فيها (' + AR(wrongs.length) + ')</button>' : '') + '</div>';
      if (document.getElementById('fix')) document.getElementById('fix').onclick = function () { items = wrongs; wrongs = []; qi = 0; score = 0; total = 0; show(); };
      document.getElementById('back').onclick = home; document.getElementById('home').onclick = home;
      document.getElementById('again').onclick = function () { exam(xi, 0); };
      speak(plain(msg));
    }
    show();
  }
  // direct links from the study sheet: #k=…&l=<lesson id> | &x=<exam id> | &v=sum
  window.addEventListener('hashchange', function () { location.reload(); });
  (function route() {
    var h = location.hash + '&' + location.search.replace(/^\?/, '&'), m;
    if ((m = h.match(/[#&]l=([\w-]+)/)) && LIX[m[1]] != null) return lesson(LIX[m[1]], 0);
    if ((m = h.match(/[#&]x=([\w-]+)/))) { for (var i = 0; i < X.length; i++) if (X[i].id === m[1]) return exam(i, 0); }
    if (/[#&]v=sum/.test(h)) return summary();
    home();
  })();
}
</script>
