<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#6D4FC9">
<title>لغتي مع نادين</title>
<style>
@font-face { font-family: B; src: url(fonts/baloo-800.ttf); font-display: swap; }
@font-face { font-family: R; src: url(fonts/readex-600.ttf); font-weight: 600; font-display: swap; }
@font-face { font-family: R; src: url(fonts/readex-400.ttf); font-weight: 400; font-display: swap; }
:root { --ink: #2E2550; --ink2: #6B6390; --bg: #F7F3FF; --card: #fff; --line: #E7E0F7; --main: #6D4FC9; --ok: #2E9C6A; --bad: #E0566B; --sun: #FFC93C; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: R, Tahoma, sans-serif; }
body { min-height: 100vh; background: radial-gradient(circle at 10% 0%, #EDE6FF 0, transparent 40%), radial-gradient(circle at 100% 30%, #FFF0E3 0, transparent 35%), var(--bg); }
button { font: inherit; cursor: pointer; border: 0; color: inherit; }
.wrap { max-width: 860px; margin: 0 auto; padding: 16px 16px 90px; }
.hidden { display: none !important; }
/* lock */
#lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
#lock form { background: #fff; border-radius: 24px; padding: 28px 22px; width: min(92vw, 380px); text-align: center; box-shadow: 0 6px 0 var(--line); display: flex; flex-direction: column; gap: 14px; }
#lock h1 { margin: 0; font: 800 30px B; color: var(--main); }
#lock input { font: 600 20px R; padding: 12px; border: 3px solid var(--line); border-radius: 14px; text-align: center; direction: ltr; }
#lock button { background: var(--main); color: #fff; font: 800 22px B; padding: 12px; border-radius: 14px; box-shadow: 0 5px 0 #4E35A0; }
#msg { color: var(--bad); min-height: 1.4em; font-weight: 600; }
/* header */
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.top h1 { margin: 0; font: 800 30px/1.3 B; color: var(--main); flex: 1; }
.chip { background: #fff; border-radius: 30px; padding: 6px 14px 9px; box-shadow: 0 3px 0 var(--line); font: 800 18px B; white-space: nowrap; }
.iconbtn { width: 46px; height: 46px; border-radius: 14px; background: #fff; box-shadow: 0 3px 0 var(--line); font-size: 22px; flex: none; }
.sub { color: var(--ink2); margin: -6px 0 16px; font-size: 16px; }
.bar { height: 14px; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 0 2px var(--line); margin-bottom: 18px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--sun), #FF9F43); border-radius: 10px; transition: width .5s; }
/* lesson grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
@media (max-width: 520px) { .grid { grid-template-columns: 1fr 1fr; gap: 10px; } .lc b { font-size: 16px; } .lc { min-height: 118px; } }
.lc { background: #fff; border-radius: 20px; padding: 14px 12px 12px; text-align: right; box-shadow: 0 5px 0 var(--line); border-top: 6px solid var(--c); display: flex; flex-direction: column; gap: 6px; min-height: 128px; transition: transform .15s; }
.lc:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.lc .n { font: 800 13px B; color: var(--c); }
.lc .ic { font-size: 30px; line-height: 1; }
.lc b { font: 800 19px/1.35 B; }
.stars { font-size: 16px; letter-spacing: 2px; margin-top: auto; }
.big { display: block; width: 100%; padding: 14px; border-radius: 18px; background: var(--main); color: #fff; font: 800 22px B; box-shadow: 0 5px 0 #4E35A0; margin: 18px 0 10px; }
/* lesson page */
.steps { display: flex; gap: 8px; margin: 4px 0 14px; }
.steps { flex-wrap: wrap; }
.steps button { min-width: 30%; flex: 1; padding: 10px 6px 12px; border-radius: 14px; background: #fff; box-shadow: 0 3px 0 var(--line); font: 800 17px B; color: var(--ink2); }
.steps button.on { background: var(--c); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
.card { background: #fff; border-radius: 22px; padding: 20px 18px; box-shadow: 0 6px 0 var(--line); border-right: 8px solid var(--c); position: relative; }
.card h2 { margin: 0 0 8px; font: 800 24px/1.4 B; color: var(--c); padding-left: 52px; }
.card p { margin: 0; font-size: 21px; line-height: 1.95; }
.ex { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.ex span { background: color-mix(in srgb, var(--c) 12%, white); border: 2px dashed color-mix(in srgb, var(--c) 45%, white); border-radius: 14px; padding: 6px 12px 8px; font-size: 19px; }
.say { position: absolute; left: 14px; top: 14px; width: 44px; height: 44px; border-radius: 50%; background: color-mix(in srgb, var(--c) 14%, white); font-size: 20px; }
.say.playing { animation: pulse .8s infinite; }
@keyframes pulse { 50% { transform: scale(1.12); } }
.nav { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
.nav .dots { flex: 1; text-align: center; color: var(--ink2); font: 800 16px B; }
.btn { padding: 12px 22px 14px; border-radius: 16px; background: var(--c); color: #fff; font: 800 20px B; box-shadow: 0 4px 0 rgba(0,0,0,.18); }
.btn.alt { background: #fff; color: var(--c); box-shadow: 0 4px 0 var(--line); }
.trick { text-align: center; padding: 30px 18px; background: linear-gradient(135deg, color-mix(in srgb, var(--c) 18%, white), #fff); }
.trick .bulb { font-size: 54px; }
.trick p { font: 800 24px/1.9 B; color: var(--ink); }
/* quiz */
.q { font: 800 25px/1.7 B; margin: 4px 0 14px; padding-left: 50px; }
.opts { display: grid; gap: 10px; }
.opts button { text-align: right; padding: 14px 16px 16px; border-radius: 16px; background: #F6F3FD; border: 3px solid transparent; font: 600 21px/1.5 R; }
.opts button.right { background: #E3F6EC; border-color: var(--ok); }
.opts button.wrong { background: #FDE8EC; border-color: var(--bad); }
.opts button:disabled { cursor: default; }
.why { margin-top: 14px; border-radius: 18px; padding: 14px 16px; background: #FFF8E1; border: 3px solid var(--sun); font-size: 20px; line-height: 1.85; position: relative; padding-left: 60px; }
.why b { display: block; font: 800 20px B; }
.why .say { top: 10px; }
.res { text-align: center; padding: 30px 18px; }
.res .st { font-size: 46px; letter-spacing: 6px; }
.res h2 { padding: 0; }
.fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 9; }
.fx i { position: absolute; top: -40px; font-style: normal; font-size: 30px; animation: fall 2.4s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
.hello { background: #fff; border-radius: 18px; padding: 12px 16px; margin: 0 0 14px; box-shadow: 0 3px 0 var(--line); font: 800 18px/1.7 B; color: var(--main); }
.lc .qn { color: var(--ink2); font-size: 14px; }
.sec { font: 800 24px B; margin: 26px 0 12px; }
.tip { background: #F0F7FF; border-radius: 14px; padding: 10px 14px; margin: 0 0 12px; font-size: 17px; line-height: 1.8; color: #2B4A6F; }
.psg { margin-bottom: 14px; }
.psg .pp { position: relative; padding-left: 46px; margin-bottom: 10px; font-size: 20px; line-height: 2; }
.say.sm { width: 36px; height: 36px; font-size: 16px; top: 4px; left: 0; }
.poem .pp { font: 800 20px/2 B; text-align: center; }
.ptog { display: block; width: 100%; margin: 0 0 12px; padding: 10px; border-radius: 14px; background: #fff; box-shadow: 0 3px 0 var(--line); font: 800 18px B; color: var(--c); }
.secn { display: inline-block; background: color-mix(in srgb, var(--c) 14%, white); color: var(--c); border-radius: 10px; padding: 2px 12px 5px; font: 800 14px B; margin-bottom: 6px; }
.hint { margin-top: 8px; font-size: 18px; color: #6B5A1E; }
.self { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font: 800 18px B; }
.self .btn { padding: 8px 16px 10px; font-size: 18px; }
.foot { text-align: center; color: var(--ink2); font-size: 13px; margin-top: 26px; }
@media (max-width: 420px) { .card p { font-size: 19px; } .q { font-size: 22px; } .opts button { font-size: 19px; } .top h1 { font-size: 25px; } }
</style>
</head>

      app.innerHTML = '<div class="wrap" style="--c:' + (mixed ? l.c : ll.c) + '">' + header(l, mixed ? null : qstep) +
        '<div class="card">' + (mixed ? '<div style="color:' + ll.c + ';font:800 15px B">' + ll.ic + ' ' + ll.t + '</div>' : '') +
        '<button class="say" id="sayq">🔊</button><div class="q">' + q[0] + '</div><div class="opts">' +
        opts.map(function (o, i) { return '<button data-i="' + i + '">' + o.o + '</button>'; }).join('') + '</div><div id="why"></div></div>' +
        '<div class="nav"><span></span><span class="dots">السُّؤال ' + AR(qi + 1) + ' / ' + AR(items.length) + '</span><button class="btn hidden" id="next">' + (qi < items.length - 1 ? 'التَّالي ←' : 'النَّتيجة 🏆') + '</button></div></div>';
      document.getElementById('back').onclick = home;
      if (!mixed) [].forEach.call(app.querySelectorAll('.steps button'), function (b) { b.onclick = function () { lesson(li, +b.dataset.s); }; });
      var sq = document.getElementById('sayq'), qtext = q[0].replace(/…/g, '، ') + ' ' + q[1].join('، أم ') + '؟';
      sq.onclick = function () { speak(qtext, ll.id + '/q' + (it.k + 1), sq); };
      setTimeout(function () { speak(qtext, ll.id + '/q' + (it.k + 1), sq); }, 250);
      [].forEach.call(app.querySelectorAll('.opts button'), function (b) {
        b.onclick = function () {
          var o = opts[+b.dataset.i], praise;
          [].forEach.call(app.querySelectorAll('.opts button'), function (x) { x.disabled = true; if (opts[+x.dataset.i].ok) x.classList.add('right'); });
          if (o.ok) score++; else b.classList.add('wrong');
          var right = q[1][q[2]];
          document.getElementById('why').innerHTML = '<div class="why"><button class="say" id="sayw">🔊</button><b>' + (o.ok ? '✅ ' + (praise = pick(GOOD)) : '💡 ' + (praise = pick(TRY)) + '<br>الإجابةُ الصَّحيحة: ' + right) + '</b>لماذا؟ ' + q[3] + '</div>';
          var sw = document.getElementById('sayw'), wt = plain(praise) + '. ' + (o.ok ? '' : 'الإجابةُ الصَّحيحة: ' + right + '. ') + 'لماذا؟ ' + q[3];
          sw.onclick = function () { speak(wt, ll.id + '/w' + (it.k + 1), sw); };
          speak(wt, ll.id + '/w' + (it.k + 1), sw);
          document.getElementById('next').classList.remove('hidden');
          if (o.ok) confettiSmall();
        };
      });
      document.getElementById('next').onclick = function () { qi++; qi < items.length ? show() : result(); };
      window.scrollTo(0, 0);
    }
    function confettiSmall() { var fx = document.getElementById('fx'); for (var i = 0; i < 8; i++) { var e = document.createElement('i'); e.textContent = '⭐'; e.style.left = 30 + Math.random() * 40 + 'vw'; fx.appendChild(e); setTimeout(function (x) { x.remove(); }, 2600, e); } }
    function result() {
      stop();
      var r = score / items.length, st = r === 1 ? 3 : r >= .7 ? 2 : 1;
      if (!mixed) { prog[l.id] = Math.max(prog[l.id] || 0, st); save(); }
      if (st >= 2) confetti();
      app.innerHTML = '<div class="wrap" style="--c:' + l.c + '">' + header(l, null) + '<div class="card res"><div class="st">' + stars(st) + '</div><h2>' + (st === 3 ? 'ممتاز يا نادين! 🎉' : st === 2 ? 'أحسنتِ يا نادين! 👏' : 'محاولةٌ جيِّدة، أعيدي مرَّةً أخرى 💪') + '</h2>' +
        '<p>أجبتِ إجابةً صحيحةً عن ' + AR(score) + ' من ' + AR(items.length) + '</p></div>' +
        '<div class="nav"><button class="btn alt" id="again">🔁 أعيدي</button><span></span><button class="btn" id="home">الدُّروس 📚</button></div>' +
        (!mixed && qstep === 2 && l.xq && l.xq.length ? '<button class="big" id="more" style="background:' + l.c + '">📝 تدرَّبي على أسئلةِ الاختباراتِ (' + AR(l.xq.length) + ')</button>' : '') + '</div>';
      if (document.getElementById('more')) document.getElementById('more').onclick = function () { lesson(li, 3); };
      document.getElementById('back').onclick = home; document.getElementById('home').onclick = home;
      document.getElementById('again').onclick = function () { mixed ? document.getElementById('home').click() : lesson(li, qstep); };
      var s = st === 3 ? 'ممتاز يا نادين!' : st === 2 ? 'أحسنتِ يا نادين!' : 'محاولةٌ جيِّدة، أعيدي مرَّةً أخرى';
      speak(s);
    }
    show();
  }

  // ---- practice exams (from the teacher's exam papers) ----
  var XG = [['p1', '📝 اختبارات الفترة الأولى', '#2E9E6B'], ['p2', '📗 اختبارات الفترة الثانية', '#2B7BB9'], ['sim', '⭐ الاختبار المحاكي للوزاري', '#C77A12'], ['fin', '🏁 اختبارات نهاية الفصل', '#D9534F']];
  function examsHome() {
    if (!X.length) return '';
    var TAG = { p1: 'الفترة الأولى', p2: 'الفترة الثانية', sim: 'المحاكي للوزاري', fin: 'نهاية الفصل' };
    return '<h2 class="sec" style="color:#2E9E6B">📝 الاختبارات (' + AR(X.length) + ')</h2><div class="sub">اختباراتُ الفترةِ الأولى والثَّانيةِ والاختباراتُ المركزيَّة، كلُّها هنا مع الشَّرح.</div><div class="grid">' + X.map(function (x, i) {
      var c = xcolor(x);
      return '<button class="lc xc" style="--c:' + c + '" data-x="' + i + '"><span class="n">' + TAG[x.g] + '</span><span class="ic">' + (x.passage ? '📖' : '✏️') + '</span><b>الاختبار ' + AR(i + 1) + '</b><span class="qn">' + AR(x.items.length) + ' سؤالًا</span><span class="stars">' + stars(prog['x_' + x.id] || 0) + '</span></button>';
    }).join('') + '</div>';
  }
  function xtitle(x, n) { var t = x.passage && x.passage.title; return t && !/المقروء|القرائي|^النص$/.test(t) ? esc(t) : 'اختبار ' + AR(n + 1); }
  function xcolor(x) { for (var i = 0; i < XG.length; i++) if (XG[i][0] === x.g) return XG[i][2]; return '#2E9E6B'; }
  function passageHTML(x) {
    var h = '';
    if (x.passage) h += '<div class="card psg"><h2>📖 ' + esc(x.passage.title || 'النَّصّ') + '</h2>' + x.passage.paras.map(function (p, i) { return '<p class="pp"><button class="say sm" data-p="' + i + '">🔊</button>' + esc(p) + '</p>'; }).join('') + '</div>';
    if (x.poem && x.poem.length) h += '<div class="card psg poem"><h2>🦋 الأبيات</h2>' + x.poem.map(function (p, i) { return '<p class="pp"><button class="say sm" data-b="' + i + '">🔊</button>' + esc(p) + '</p>'; }).join('') + '</div>';
    return h;
  }
  function wirePassage(x, root) {
    [].forEach.call(root.querySelectorAll('[data-p]'), function (b) { b.onclick = function () { speak(x.passage.paras[+b.dataset.p], null, b); }; });
    [].forEach.call(root.querySelectorAll('[data-b]'), function (b) { b.onclick = function () { speak(x.poem[+b.dataset.b], null, b); }; });
  }
  function exam(xi, step) {
    stop(); var x = X[xi], c = xcolor(x), hasText = !!(x.passage || (x.poem && x.poem.length));
    var top = '<div class="top"><button class="iconbtn" id="back" aria-label="رجوع">→</button><h1 style="color:' + c + '">الاختبار ' + AR(xi + 1) + '</h1></div>';
    if (step === 0 && hasText) {
      app.innerHTML = '<div class="wrap" style="--c:' + c + '">' + top + '<div class="tip">💡 اقرئي النَّصَّ بهدوء، واضغطي 🔊 لتسمعي كلَّ فقرة، ثمَّ ابدئي الأسئلة.</div>' + passageHTML(x) +
        '<button class="big" style="background:' + c + '" id="go">ابدئي الأسئلة ✏️</button></div>';
      wirePassage(x, app);
      document.getElementById('back').onclick = home;
      document.getElementById('go').onclick = function () { exam(xi, 1); };
      window.scrollTo(0, 0); return;
    }
    var qi = 0, score = 0, total = 0, items = x.items;
    function show() {
      stop();
      var it = items[qi], open = !it.o;
      var opts = open ? [] : shuffle(it.o.map(function (o, i) { return { o: o, ok: i === 0 }; }));
      app.innerHTML = '<div class="wrap" style="--c:' + c + '">' + top +
        (hasText ? '<button class="ptog" id="ptog">📖 اعرضي النَّصّ</button><div id="pbox" class="hidden">' + passageHTML(x) + '</div>' : '') +
        '<div class="card"><div class="secn">' + esc(it.s || '') + '</div><button class="say" id="sayq">🔊</button><div class="q">' + esc(it.q) + '</div>' +
        (open ? '<div class="tip">✍️ فكِّري في الإجابة، أو اكتبيها في دفترك، ثمَّ اضغطي الزِّر.</div><button class="btn" id="show">👀 أظهري الإجابة</button>'
              : '<div class="opts">' + opts.map(function (o, i) { return '<button data-i="' + i + '">' + esc(o.o) + '</button>'; }).join('') + '</div>') +
        '<div id="why"></div></div>' +
        '<div class="nav"><span></span><span class="dots">السُّؤال ' + AR(qi + 1) + ' / ' + AR(items.length) + '</span><button class="btn hidden" id="next">' + (qi < items.length - 1 ? 'التَّالي ←' : 'النَّتيجة 🏆') + '</button></div></div>';
      document.getElementById('back').onclick = home;
      if (hasText) { wirePassage(x, document.getElementById('pbox')); document.getElementById('ptog').onclick = function () { var b = document.getElementById('pbox'); b.classList.toggle('hidden'); this.textContent = b.classList.contains('hidden') ? '📖 اعرضي النَّصّ' : '🙈 أخفي النَّصّ'; }; }
      var sq = document.getElementById('sayq'), qtext = it.q.replace(/…|\.{3,}/g, '، ') + (open ? '' : ' ' + it.o.join('، أم ') + '؟');
      sq.onclick = function () { speak(qtext, null, sq); };
      setTimeout(function () { speak(qtext, null, sq); }, 250);
      var next = document.getElementById('next');
      function whyBox(head, body, spoken) {
        document.getElementById('why').innerHTML = '<div class="why"><button class="say" id="sayw">🔊</button><b>' + head + '</b>' + body + '</div>';
        var sw = document.getElementById('sayw'); sw.onclick = function () { speak(spoken, null, sw); }; speak(spoken, null, sw);
      }
      if (open) {
        document.getElementById('show').onclick = function () {
          this.remove();
          whyBox('✅ الإجابة:', esc(it.ans) + (it.w ? '<div class="hint">💡 ' + esc(it.w) + '</div>' : '') +
            '<div class="self">هل كانت إجابتُكِ مثلَها؟<button class="btn" id="yes">نعم 😊</button><button class="btn alt" id="no">ليس تمامًا</button></div>',
            'الإجابة: ' + it.ans + '. ' + (it.w || ''));
          function mark(ok) { total++; if (ok) { score++; confettiSmall(); } var s = document.querySelector('.self'); s.innerHTML = ok ? pick(GOOD) : pick(TRY); speak(plain(s.textContent)); next.classList.remove('hidden'); }
          document.getElementById('yes').onclick = function () { mark(true); };
          document.getElementById('no').onclick = function () { mark(false); };
        };
      } else {
        [].forEach.call(app.querySelectorAll('.opts button'), function (b) {
          b.onclick = function () {
            var o = opts[+b.dataset.i], pr = o.ok ? pick(GOOD) : pick(TRY); total++;
            [].forEach.call(app.querySelectorAll('.opts button'), function (y) { y.disabled = true; if (opts[+y.dataset.i].ok) y.classList.add('right'); });
            if (o.ok) { score++; confettiSmall(); } else b.classList.add('wrong');
            whyBox((o.ok ? '✅ ' : '💡 ') + pr + (o.ok ? '' : '<br>الإجابةُ الصَّحيحة: ' + esc(it.o[0])), (it.w ? 'لماذا؟ ' + esc(it.w) : ''),
              plain(pr) + '. ' + (o.ok ? '' : 'الإجابةُ الصَّحيحة: ' + it.o[0] + '. ') + (it.w ? 'لماذا؟ ' + it.w : ''));
            next.classList.remove('hidden');
          };
        });
      }
      next.onclick = function () { qi++; qi < items.length ? show() : result(); };
      window.scrollTo(0, 0);
    }
    function confettiSmall() { var fx = document.getElementById('fx'); for (var i = 0; i < 8; i++) { var e = document.createElement('i'); e.textContent = '⭐'; e.style.left = 30 + Math.random() * 40 + 'vw'; fx.appendChild(e); setTimeout(function (y) { y.remove(); }, 2600, e); } }
    function result() {
      stop();
      var r = total ? score / total : 0, st = r >= .95 ? 3 : r >= .7 ? 2 : 1;
      prog['x_' + x.id] = Math.max(prog['x_' + x.id] || 0, st); save();
      if (st >= 2) confetti();
      var msg = st === 3 ? 'ممتازٌ يا نادين! أنتِ جاهزةٌ للاختبار 🏆' : st === 2 ? 'أحسنتِ يا نادين! راجعي الأخطاءَ القليلةَ وستصلينَ إلى القمَّة 👏' : 'بدايةٌ جميلة! أعيدي النَّموذجَ مرَّةً أخرى وستتحسَّنين 💪';
      app.innerHTML = '<div class="wrap" style="--c:' + c + '">' + top + '<div class="card res"><div class="st">' + stars(st) + '</div><h2>' + msg + '</h2>' +
        '<p>أصبتِ في ' + AR(score) + ' من ' + AR(total) + '</p></div>' +
        '<div class="nav"><button class="btn alt" id="again">🔁 أعيدي</button><span></span><button class="btn" id="home">الرَّئيسيَّة 📚</button></div></div>';
      document.getElementById('back').onclick = home; document.getElementById('home').onclick = home;
      document.getElementById('again').onclick = function () { exam(xi, 0); };
      speak(plain(msg));
    }
    show();
  }
  home();
}
</script>
</body>
</html>
