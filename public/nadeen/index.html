  --both:#2F6FB3; --both-soft:#DDE9F7; --amber:#E39E2F; --amber-soft:#FBEBCF;
  --ok:#23845A; --ok-soft:#DDF1E6; --no:#B8453B; --no-soft:#F8E0DC;
  --k1:#A8672F; --k2:#2F6FB3; --k3:#23877F; --k4:#7B55A0; --k5:#2F8A57; --k6:#C24C78;
  --r:14px; --gap:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Readex,system-ui,sans-serif;font-size:17px;line-height:1.75}
h1,h2,h3{line-height:1.3;margin:0}
p{margin:0 0 12px}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== cover: the folded foldable ===== */
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 16px 40px;text-align:center;gap:22px}
.cover .kicker{font-size:15px;color:var(--ink-2)}
.cover h1{font-size:clamp(40px,11vw,68px);font-weight:700;letter-spacing:-.5px}
.fold{display:flex;perspective:1200px;width:min(560px,100%);height:230px;margin:6px 0}
.fold .pn{flex:1;background:var(--paper);border:1.5px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:14px 8px;gap:8px;font-weight:600;font-size:15px;line-height:1.45;transition:transform .9s cubic-bezier(.3,.7,.2,1);backface-visibility:hidden;position:relative}
.fold .pn svg{width:64px;height:64px;margin-bottom:auto;margin-top:6px}
.fold .pn:nth-child(1){transform-origin:left center;border-radius:12px 0 0 12px}
.fold .pn:nth-child(3){transform-origin:right center;border-radius:0 12px 12px 0}
.fold .pn:nth-child(2){z-index:1}
.fold.closed .pn:nth-child(1){transform:rotateY(-172deg)}
.fold.closed .pn:nth-child(3){transform:rotateY(172deg)}
.fold .pn::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(21,51,58,.08),transparent 30%);pointer-events:none;border-radius:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ===== sticky foldable tabs ===== */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(234,242,240,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:6px;padding-top:8px}
.tabs a{flex:1;text-decoration:none;color:var(--ink-2);background:#DCE8E5;border-radius:10px 10px 0 0;padding:8px 6px 7px;font-size:13.5px;line-height:1.35;text-align:center;font-weight:600;min-height:48px;display:flex;align-items:center;justify-content:center;border:1.5px solid transparent;border-bottom:0;transition:background .25s,color .25s}
.tabs a[aria-current="true"]{background:var(--paper);color:var(--ink);border-color:var(--line)}
.tabs a .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;margin-inline-end:6px;flex:none}

/* ===== sections ===== */
.sec{background:var(--paper);border-radius:0 0 var(--r) var(--r);margin:0 0 28px;padding:28px 18px 30px;scroll-margin-top:66px}
.sec > h2{font-size:clamp(25px,6.5vw,32px);font-weight:700;margin-bottom:14px}
.lead{font-size:19px}
.lead b{font-weight:700}
.note{font-size:14.5px;color:var(--ink-2)}
.block{margin-top:26px}
.block > h3{font-size:19px;font-weight:600;margin-bottom:10px}
.def{border-inline-start:5px solid var(--both);background:var(--both-soft);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0;font-size:18px}

/* ===== quiz ===== */
.quiz{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;margin-top:26px;background:#FBFDFC}
.quiz .q-tag{display:inline-block;font-size:13px;font-weight:600;color:var(--amber);background:var(--amber-soft);border-radius:999px;padding:1px 12px;margin-bottom:8px}
.quiz .q{font-weight:600;font-size:18px;margin-bottom:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.opt{min-height:52px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:start;transition:background .2s,border-color .2s,transform .2s}
.opt:hover{border-color:var(--ink-2)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);font-weight:600}
.opt.wrong{background:var(--no-soft);border-color:var(--no);animation:shake .35s}
.fb{margin-top:12px;border-radius:10px;padding:0 14px;max-height:0;overflow:hidden;transition:max-height .35s,padding .35s;font-size:16px}
.fb.show{max-height:260px;padding:10px 14px}
.fb.good{background:var(--ok-soft)}
.fb.hint{background:var(--amber-soft)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ===== sort game ===== */
.sort .chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px;min-height:52px}
.chip{min-height:48px;padding:6px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-weight:600;transition:transform .2s,background .2s,border-color .2s}
.chip[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-soft);transform:translateY(-3px)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bin{min-height:120px;border:2px dashed var(--line);border-radius:14px;padding:10px;background:#FBFDFC;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center;transition:border-color .2s,background .2s}
.bin .bt{font-weight:700;font-size:15.5px}
.bin.ready{border-color:var(--amber);background:var(--amber-soft)}
.bin .placed{font-size:14.5px;border-radius:8px;padding:4px 8px;background:var(--ok-soft);animation:pop .3s}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* ===== order game ===== */
.order .slots{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.order .slot{flex:1;min-width:52px;min-height:52px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-weight:600;font-size:15px;padding:4px}
.order .slot.filled{border-style:solid;border-color:var(--ok);background:var(--ok-soft);animation:pop .3s}

/* ===== credits ===== */
.credits{margin:10px auto 40px;max-width:760px;padding:0 16px}
.credits .card{background:var(--ink);color:#fff;border-radius:var(--r);padding:22px 20px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.credits .card div{font-size:14px;color:#B9CFD2}
.credits .card b{display:block;font-size:19px;color:#fff;font-weight:600}
.credits .actions{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}

/* ===== print ===== */
.print{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;font-size:12.5pt}
  .screen{display:none!important}
  .print{display:grid!important;grid-template-columns:repeat(3,1fr);gap:0;height:188mm;border:1px solid #999}
  .print .col{padding:6mm 5mm;border-inline-start:1px dashed #999;overflow:hidden;line-height:1.6}
  .print .col:first-child{border-inline-start:0}
  .print .pic{display:block;margin:4mm auto;width:62mm;height:auto}
  .print h2{font-size:16pt;margin:0 0 3mm;padding-bottom:2mm;border-bottom:2px solid var(--ink)}
  .print h3{font-size:11.5pt;margin:3mm 0 1mm}
  .print ul{margin:0;padding-inline-start:5mm}
  .print .who{margin-top:4mm;font-size:10pt;border-top:1px solid #999;padding-top:2mm}
  .print svg{max-width:100%;height:auto}
}

/* ===== reduced motion ===== */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important;scroll-behavior:auto!important}
}
@media (min-width:640px){ .sec{padding:36px 34px 38px} .tabs a{font-size:15px} }

/* ===== narration ===== */
.listen{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:8px 18px 8px 14px;margin:0 0 16px;border-radius:999px;border:1.5px solid var(--line);background:#F4F8F7;cursor:pointer;font-weight:600}
.listen .wave{display:inline-flex;gap:3px;align-items:center;height:20px}
.listen .wave i{width:4px;height:8px;border-radius:2px;background:var(--both);transition:height .2s}
.listen.on{background:var(--both);color:#fff;border-color:var(--both)}
.listen.on .wave i{background:#fff;animation:wave .9s ease-in-out infinite}
.listen.on .wave i:nth-child(2){animation-delay:.15s}.listen.on .wave i:nth-child(3){animation-delay:.3s}.listen.on .wave i:nth-child(4){animation-delay:.45s}
@keyframes wave{50%{height:20px}}
.listen-msg{font-size:14px;color:var(--ink-2);margin:-8px 0 14px}
@media print{.listen,.listen-msg{display:none}}

/* ===== cheerful theme (layered over the base) ===== */
:root{--ink:#2A2850;--ink-2:#5F5B85;--line:#E1DCF2;--pri:#6E4BD8;--pri-2:#EC5E9A;
  --s1:#1FAE86;--s1-soft:#DDF6EC;--s2:#7B5BE0;--s2-soft:#ECE6FD;--s3:#F0689F;--s3-soft:#FDE4EF}
body{background:linear-gradient(180deg,#F1EDFF 0%,#EAF8F2 45%,#FFF1F6 100%) fixed}
.cover{position:relative;overflow:hidden}
.cover::before,.cover::after{content:"";position:absolute;border-radius:50%;filter:blur(2px);z-index:-1}
.cover::before{width:260px;height:260px;background:radial-gradient(circle at 35% 35%,#FFFFFF 0 18%,#D9CCFF 19% 60%,transparent 61%);top:6%;right:-70px}
.cover::after{width:200px;height:200px;background:radial-gradient(circle at 40% 40%,#FFFFFF 0 16%,#BDEFD9 17% 60%,transparent 61%);bottom:8%;left:-60px}
.cover h1{background:linear-gradient(90deg,var(--pri),var(--pri-2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:6px}
.fold .pn{border:0;box-shadow:0 10px 28px -14px rgba(76,52,160,.45)}
.fold .pn:nth-child(1){border-top:6px solid var(--s1)}
.fold .pn:nth-child(2){border-top:6px solid var(--s2)}
.fold .pn:nth-child(3){border-top:6px solid var(--s3)}
.btn{background:linear-gradient(90deg,var(--pri),#8B5CF6)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.tabs{background:rgba(245,242,255,.92)}
.tabs a{background:#E9E4FA}
.tabs a:nth-child(1){--sa:var(--s1)} .tabs a:nth-child(2){--sa:var(--s2)} .tabs a:nth-child(3){--sa:var(--s3)}
.tabs a .n{background:var(--sa)}
.tabs a[aria-current="true"]{background:#fff;border-color:var(--sa);color:var(--ink)}
#s1{--sa:var(--s1);--sa-soft:var(--s1-soft)} #s2{--sa:var(--s2);--sa-soft:var(--s2-soft)} #s3{--sa:var(--s3);--sa-soft:var(--s3-soft)}
.sec{border-top:7px solid var(--sa);border-radius:var(--r);box-shadow:0 14px 34px -22px rgba(76,52,160,.35);margin-top:14px}
.sec > h2{display:flex;align-items:center;gap:10px}
.sec > h2::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--sa);box-shadow:0 0 0 6px var(--sa-soft);flex:none}
.def{border-inline-start-color:var(--sa);background:var(--sa-soft)}
.quiz{background:#FFFDF7;border-color:#F3DDB0}
.quiz .q-tag{color:#fff;background:var(--sa)}
.opt:hover{border-color:var(--sa)}
.listen{background:var(--sa-soft);border-color:transparent}
.listen .wave i{background:var(--sa)}
.listen.on{background:var(--sa);border-color:var(--sa)}
.credits .card{background:linear-gradient(120deg,var(--pri),var(--pri-2))}
.credits .card div{color:#F3E9FF}

/* celebration on a right answer */
.boom{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:50;animation:boom .8s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes boom{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.boom{display:none}}

.fb.hint.show::before{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2228%22%20fill%3D%22%23FFD9EA%22%20stroke%3D%22%232A2850%22%20stroke-width%3D%223%22/%3E%3Ccircle%20cx%3D%2246%22%20cy%3D%2218%22%20r%3D%226%22%20fill%3D%22%23C9A7F7%22%20stroke%3D%22%232A2850%22%20stroke-width%3D%222%22/%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2234%22%20r%3D%222.4%22%20fill%3D%22%232A2850%22/%3E%3Ccircle%20cx%3D%2237%22%20cy%3D%2234%22%20r%3D%222.4%22%20fill%3D%22%232A2850%22/%3E%3Ccircle%20cx%3D%2227.7%22%20cy%3D%2233.2%22%20r%3D%220.8%22%20fill%3D%22%23fff%22/%3E%3Ccircle%20cx%3D%2237.7%22%20cy%3D%2233.2%22%20r%3D%220.8%22%20fill%3D%22%23fff%22/%3E%3Cpath%20d%3D%22M28.8%2040q3.2-2%206.4%200%22%20fill%3D%22none%22%20stroke%3D%22%232A2850%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22/%3E%3Cellipse%20cx%3D%2223.5%22%20cy%3D%2237.5%22%20rx%3D%222.2%22%20ry%3D%221.4%22%20fill%3D%22%23FF8FB5%22%20opacity%3D%22.7%22/%3E%3Cellipse%20cx%3D%2240.5%22%20cy%3D%2237.5%22%20rx%3D%222.2%22%20ry%3D%221.4%22%20fill%3D%22%23FF8FB5%22%20opacity%3D%22.7%22/%3E%3C/svg%3E")}
.fb.good.show::before{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@media (prefers-reduced-motion:reduce){.hero-art svg,.cast svg{animation:none}}
