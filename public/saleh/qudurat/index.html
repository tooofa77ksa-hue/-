<style>
:root{--bg:#070b08;--bg2:#0e1710;--card:#141f17;--card2:#1a2a1e;--line:#2b4232;--ink:#eafbe9;--muted:#9ab8a1;--gold:#ffc83d;--ok:#36e07a;--bad:#ff4d4d;--zom:#7dff6a;--blood:#b3001b;--blue:#4aa3ff;
  --r0:#4f5d53;--r1:#36e07a;--r2:#4aa3ff;--r3:#b06bff;--r4:#ffc83d;--rad:18px;--f:"HeroBaloo","Baloo Bhaijaan 2","Noto Sans Arabic",Tahoma,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--f);font-size:clamp(16px,1vw + 12px,22px);line-height:1.7;background:#070b08}
body::before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;z-index:-2;background:radial-gradient(900px 500px at 50% -10%,#1d3a22 0,transparent 65%),repeating-linear-gradient(90deg,#0b130d 0 120px,#0d1710 120px 124px),linear-gradient(180deg,#0e1710,#050805)}
body::after{content:"";position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:8px 10px;background:rgba(7,11,8,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .who{display:flex;align-items:center;gap:8px;flex:1;min-width:0}.ava{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:linear-gradient(160deg,#3fd56a,#147a3a);box-shadow:0 0 14px rgba(125,255,106,.35)}
.who b{display:block;line-height:1.2}.who small{color:var(--muted);font-size:.72em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 8px;font-weight:800;white-space:nowrap;font-size:.9em}
.hb{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px}
.xpbar{height:6px;background:#020402;border-radius:6px;overflow:hidden;margin-top:3px}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--zom),#1fae4b)}
main{max-width:980px;margin:0 auto;padding:14px 16px 60px;display:flex;flex-direction:column;gap:14px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--rad);padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px 18px;border:1px solid #2f5a37;background:linear-gradient(180deg,rgba(10,20,12,.2),rgba(5,8,5,.9)),repeating-linear-gradient(90deg,#16261a 0 46px,#1b3020 46px 48px,#16261a 48px 92px,#203826 92px 94px);box-shadow:inset 0 -40px 60px rgba(0,0,0,.6),0 0 30px rgba(125,255,106,.08)}

"المتحالفتان مجموعهما 180°", "180 − 75 = 105"], "a": "105°"}, "memo": "كلهن توائم متساويات… إلا **المتحالفتين**: تتحالفان لتصنعا 180.", "think": {"q": "زاويتان متحالفتان متساويتان. كم قياس كل واحدة؟", "a": "90°، لأن مجموعهما 180 وهما متساويتان، و 180 ÷ 2 = 90."}}, "tri1": {"story": "قصّ قطعة كعكة مستطيلة من الركن إلى الركن، يخرج لك مثلثان متساويان. لذلك مساحة المثلث نصف (القاعدة × الارتفاع).", "steps": ["اقرأ المطلوب: مساحة أو محيط أو زاوية.", "المساحة: اضرب القاعدة × الارتفاع ثم اقسم على 2.", "المحيط: اجمع الأضلاع الثلاثة.", "الزاوية الناقصة: اجمع الزاويتين المعطاتين واطرح الناتج من 180."], "example": {"q": "مثلث قاعدته 8 وارتفاعه 5، مساحته:", "steps": ["8 × 5 = 40", "40 ÷ 2 = 20"], "a": "20"}, "memo": "مساحة المثلث = **نصف** (قاعدة × ارتفاع)، وزواياه معاً **دائماً 180**.", "think": {"q": "مثلث فيه زاوية 90°، هل يمكن أن تكون فيه زاوية ثانية 95°؟", "a": "لا، لأن 90 + 95 = 185 وهذا أكبر من 180، ومجموع زوايا المثلث كله 180 فقط."}}, "tri2": {"story": "تريد أن تبني مثلثاً من 3 أعواد. العودان القصيران معاً يجب أن يكونا أطول من العود الطويل، وإلا لن يلتقي طرفاهما أبداً!", "steps": ["متباينة المثلث: اجمع أصغر ضلعين.", "إذا كان مجموعهما **أكبر** من الضلع الأطول ← تصلح مثلثاً.", "الزاوية الخارجية: اجمع الزاويتين الداخليتين البعيدتين (اترك المجاورة).", "المتطابق الضلعين: زاويتا القاعدة متساويتان، فالأخرى مثلها."], "example": {"q": "هل تصلح الأطوال 2 ، 4 ، 7 أن تكون أضلاع مثلث؟", "steps": ["أصغر ضلعين: 2 + 4 = 6", "هل 6 أكبر من 7؟ لا"], "a": "لا تصلح"}, "memo": "**الصغيران معاً أكبر من الكبير**، و**الخارجية = البعيدتان معاً**.", "think": {"q": "الأطوال 3 ، 4 ، 7: لماذا لا تصنع مثلثاً؟", "a": "لأن 3 + 4 = 7 يساوي الضلع الثالث ولا يزيد عليه، والقانون يطلب «أكبر». فالعودان ينامان فوق العود الثالث خطاً مستقيماً."}}, "pyth": {"story": "سلّم مائل على جدار في اللعبة: الجدار والأرض هما ضلعا القائمة، والسلّم هو الوتر الأطول. فيثاغورس يخبرك كم طول السلّم.", "steps": ["الوتر هو أطول ضلع، وهو مقابل الزاوية القائمة.", "لو طُلب الوتر: ربّع الضلعين، اجمعهما، ثم خذ الجذر.", "لو طُلب ضلع قائمة: ربّع الوتر، اطرح منه مربع الضلع الآخر، ثم خذ الجذر.", "اختصر الوقت: هل الأعداد من (3، 4، 5) أو (5، 12، 13) أو مضاعفاتهما؟"], "example": {"q": "ضلعا القائمة 9 و 12، الوتر:", "steps": ["9^{2} = 81 و 12^{2} = 144", "81 + 144 = 225", "√{225} = 15"], "a": "15 ، وهي (3، 4، 5) × 3"}, "memo": "جـ^{2} = أ^{2} + ب^{2}، واحفظ العائلتين: **(3، 4، 5)** و **(5، 12، 13)**.", "think": {"q": "ضلعا القائمة 12 و 16. هل تعرف الوتر بلا حساب طويل؟", "a": "20، لأن (12، 16، 20) = (3، 4، 5) × 4."}}, "special": {"story": "في المثلث الثلاثيني الستيني: الضلع المقابل للزاوية 30° يأخذ نصف الوتر، والضلع المقابل للزاوية 60° يأخذ نفس النصف **مضروباً في** √{3}.", "steps": ["حدّد المثلث: ثلاثيني ستيني، أو قائم متطابق الضلعين (45°).", "الثلاثيني الستيني: المقابل للزاوية 30° = الوتر ÷ 2.", "والمقابل للزاوية 60° = نصف الوتر × √{3}.", "المتطابق الضلعين: الوتر = الضلع × √{2}، والضلع = الوتر ÷ √{2}."], "example": {"q": "مثلث ثلاثيني ستيني وتره 14، ما طولا الضلعين؟", "steps": ["المقابل للزاوية 30° = 14 ÷ 2 = 7", "المقابل للزاوية 60° = 7 × √{3} = 7√{3}"], "a": "7 و 7√{3}"}, "memo": "**30 ← نصف الوتر**، **60 ← نصف الوتر √{3}**، **45 ← الضلع √{2}**.", "think": {"q": "مثلث قائم متطابق الضلعين وتره 6√{2}، كم طول ضلعه؟", "a": "6، لأن الوتر = الضلع × √{2}، إذن الضلع = 6√{2} ÷ √{2} = 6."}}, "quad": {"story": "عائلة الأشكال الرباعية مثل فريق أبطال، كل بطل له قدرة خاصة. والمربع هو البطل الأقوى: يملك قدرات المستطيل والمعين معاً!", "steps": ["سؤال زوايا: مجموع زوايا الرباعي 360°، فاطرح المعطى منه.", "سؤال اسم الشكل: اقرأ الصفات واحدة واحدة.", "زوايا كلها قائمة ← مستطيل أو مربع. أضلاع كلها متطابقة ← معين أو مربع.", "ضلعان **فقط** متوازيان ← شبه منحرف.", "احذف كل خيار تنقصه صفة من الصفات."], "example": {"q": "شكل رباعي ثلاث من زواياه 90° و 80° و 100°، الرابعة:", "steps": ["90 + 80 + 100 = 270", "360 − 270 = 90"], "a": "90°"}, "memo": "الرباعي = **360** (ضعف المثلث). **المربع = مستطيل + معين**.", "think": {"q": "هل كل مربع معين؟ وهل كل معين مربع؟", "a": "كل مربع معين لأن أضلاعه كلها متطابقة. لكن ليس كل معين مربعاً، لأن المعين لا يُشترط أن تكون زواياه قائمة."}}, "quad2": {"story": "القطعة المتوسطة مثل لاعب يقف في منتصف الملعب بين خطين: طولها في الوسط بين القاعدتين، لا أطول من الكبيرة ولا أقصر من الصغيرة.", "steps": ["القطعة المتوسطة: اجمع طولي القاعدتين.", "اقسم المجموع على 2.", "الرباعي الدائري: كل زاويتين متقابلتين مجموعهما 180°.", "فاطرح الزاوية المعطاة من 180."], "example": {"q": "قاعدتا شبه منحرف 9 و 15، طول القطعة المتوسطة:", "steps": ["9 + 15 = 24", "24 ÷ 2 = 12"], "a": "12"}, "memo": "**المتوسطة = نصف المجموع**. **الدائري: كل متقابلتين = 180**.", "think": {"q": "قطعة متوسطة طولها 10، وإحدى القاعدتين 7، كم القاعدة الأخرى؟", "a": "13، لأن مجموع القاعدتين = 10 × 2 = 20، و 20 − 7 = 13."}}, "polygon": {"story": "كل ضلع جديد تضيفه للمضلع مثل مرحلة جديدة تمنحك 180° زيادة. المثلث 180، الرباعي 360، الخماسي 540… وهكذا.", "steps": ["عدّ الأضلاع وسمّها ن.", "مجموع الزوايا الداخلية = (ن − 2) × 180.", "زاوية واحدة في المضلع المنتظم: اقسم المجموع على ن.", "الزوايا الخارجية لأي مضلع مجموعها دائماً 360°.", "إذا أُعطيت المجموع وطُلب ن: اقسم على 180 ثم أضف 2."], "example": {"q": "قياس زاوية الثماني المنتظم:", "steps": ["ن = 8", "(8 − 2) × 180 = 6 × 180 = 1080", "1080 ÷ 8 = 135"], "a": "135°"}, "memo": "**اطرح 2 واضرب في 180**. والخارجية **دائماً 360**.", "think": {"q": "مضلع مجموع زواياه الداخلية 900°، كم ضلعاً له؟", "a": "7 (السباعي)، لأن 900 ÷ 180 = 5، ثم 5 + 2 = 7."}}, "area": {"story": "المساحة = عدد البلاطات التي تغطي أرض غرفتك في اللعبة، والمحيط = طول السور الذي يلفّ حولها.", "steps": ["حدّد اسم الشكل.", "اكتب قانونه قبل أي رقم.", "عوّض بالأرقام في القانون.", "احسب بهدوء، وتذكّر: في المعين، وفي المربع إذا أُعطيت قطره، نقسم على 2."], "example": {"q": "معين قطراه 10 و 4، مساحته:", "steps": ["10 × 4 = 40", "40 ÷ 2 = 20"], "a": "20"}, "memo": "**إذا جاء القطر جاء معه ÷ 2** (المعين والمربع بقطره).", "think": {"q": "مستطيل طوله 6 وعرضه 4، ومربع ضلعه 5. أيهما مساحته أكبر؟", "a": "المربع: مساحته 25 والمستطيل 24، مع أن محيط كل منهما 20!"}}, "volume": {"story": "المكعب مثل صندوق كنز مصنوع من 6 مربعات متطابقة. حجمه = عدد المكعبات الصغيرة التي تملؤه.", "steps": ["حدّد المجسم: مكعب أو متوازي مستطيلات أو أسطوانة.", "المكعب: الحجم = الحرف × الحرف × الحرف.", "متوازي المستطيلات: الحجم = الطول × العرض × الارتفاع.", "الأسطوانة: الحجم = ط نق^{2} ع.", "المساحة السطحية للمكعب = مساحة وجه واحد × 6."], "example": {"q": "مكعب طول حرفه 4، ما حجمه وما مساحته السطحية؟", "steps": ["الحجم = 4 × 4 × 4 = 64", "مساحة الوجه = 4 × 4 = 16", "المساحة السطحية = 16 × 6 = 96"], "a": "الحجم 64 ، والمساحة السطحية 96"}, "memo": "المكعب: **6 أوجه، 8 رؤوس، 12 حرفاً** (6 ثم 8 ثم 12).", "think": {"q": "كبّرنا حرف المكعب من 2 إلى 4. كم مرة يكبر الحجم؟", "a": "8 مرات، لأن 2^{3} = 8 و 4^{3} = 64، و 64 ÷ 8 = 8."}}, "circle": {"story": "الدائرة مثل حلبة سباق: المحيط = طول الطريق حولها، والمساحة = الأرض داخلها. ونصف القطر هو الحبل من المركز إلى الحافة.", "steps": ["اكتب نق (نصف القطر). إذا أُعطيت القطر فاقسمه على 2.", "المحيط = 2 × ط × نق.", "المساحة = ط × نق × نق.", "مضلع داخل الدائرة: السداسي ← ل = نق، المربع ← ل = نق√{2}، المثلث المتطابق الأضلاع ← ل = نق√{3}."], "example": {"q": "دائرة نصف قطرها 14 (ط = {22|7})، محيطها:", "steps": ["المحيط = 2 × {22|7} × 14", "{22|7} × 14 = 44", "2 × 44 = 88"], "a": "88"}, "memo": "**سداسي = نق**، **مربع = نق√{2}**، **مثلث = نق√{3}**.", "think": {"q": "دائرة نصف قطرها 7 مساحتها 154. لو صار نصف القطر 14، كم تصير المساحة؟", "a": "616، لأن في المساحة نق^{2}، فإذا تضاعف نق تضاعفت المساحة 4 مرات: 154 × 4 = 616."}}, "clock": {"story": "الساعة دائرة 360° مقسومة إلى 12 قطعة متساوية مثل الكعكة، فكل ساعة على وجه الساعة = 30°.", "steps": ["اضرب عدد الساعات × 30.", "اضرب عدد الدقائق × {11|2} (يعني × 11 ثم ÷ 2).", "اطرح الناتج الثاني من الأول.", "إذا خرج سالباً احذف الإشارة.", "المطلوب الزاوية الصغرى: إذا زاد الناتج على 180 فاطرحه من 360."], "example": {"q": "الزاوية بين العقربين الساعة 4:20", "steps": ["4 × 30 = 120", "20 × {11|2} = 110", "120 − 110 = 10"], "a": "10°"}, "memo": "**ساعات × 30 ، ناقص دقائق × {11|2}**.", "think": {"q": "الساعة 9:00 يعطي الناتج 9 × 30 = 270. هل الزاوية بين العقربين 270°؟", "a": "لا، المطلوب الزاوية الصغرى: 360 − 270 = 90°."}}, "shade": {"story": "الدائرة مثل كعكة كاملة 360°. أي قطعة تأخذها اسأل: كم قطعة مثلها تكفي للكعكة كلها؟", "steps": ["تأكد أن الأجزاء متساوية، وعدّها كلها ← هذا المقام.", "عدّ الأجزاء المظللة ← هذا البسط.", "اختصر الكسر إن أمكن.", "في الدائرة: اقسم 360 على زاوية القطاع لتعرف المقام."], "example": {"q": "قطاع زاويته 60° من الدائرة =", "steps": ["360 ÷ 60 = 6", "إذن القطاع جزء واحد من 6"], "a": "{1|6}"}, "memo": "**180 نصف، 90 ربع، 120 ثلث، 60 سدس، 45 ثمن، 36 عُشر**.", "think": {"q": "قطاع زاويته 270°، كم هو من الدائرة؟ وكم الجزء الباقي؟", "a": "{3|4}، والباقي {1|4}، لأن 360 − 270 = 90 وهي ربع الدائرة."}}, "coord": {"story": "الإحداثيات مثل خريطة اللعبة: (س ، ص) تعني امشِ يميناً س ثم اصعد ص. والمنتصف هو نقطة اللقاء العادلة بين لاعبَين.", "steps": ["اكتب النقطتين: (س١ ، ص١) و (س٢ ، ص٢).", "المنتصف: اجمع السينين ÷ 2، واجمع الصادين ÷ 2.", "الميل: فرق الصادين ÷ فرق السينين (بنفس الترتيب).", "الطول: ربّع الفرقين، اجمعهما، ثم خذ الجذر.", "متوازيان ← نفس الميل. متعامدان ← اقلب الكسر وغيّر الإشارة."], "example": {"q": "الميل بين (2 ، 1) و (4 ، 7):", "steps": ["فرق الصادين: 7 − 1 = 6", "فرق السينين: 4 − 2 = 2", "6 ÷ 2 = 3"], "a": "3"}, "memo": "**الميل = الصعود ÷ المشي** (ص فوق، س تحت). المتعامد: **اقلب واعكس الإشارة**.", "think": {"q": "ميل مستقيم {2|3}، ما ميل المستقيم العمودي عليه؟", "a": "{−3|2}، لأن حاصل ضرب ميلي المتعامدين = −1، و {2|3} × {−3|2} = −1."}}, "speed1": {"story": "سيارتك في سباق اللعبة تقطع كل ساعة نفس عدد الكيلومترات (السرعة). اضربها في عدد الساعات تعرف المسافة.", "steps": ["اكتب القانون: المسافة = السرعة × الزمن.", "غطِّ المطلوب بإصبعك: المسافة ← اضرب، السرعة ← المسافة ÷ الزمن، الزمن ← المسافة ÷ السرعة.", "جسمان في اتجاهين متعاكسين ← اجمع السرعتين.", "جسمان في اتجاه واحد ← اطرح السرعتين.", "ثم اضرب الناتج في الزمن."], "example": {"q": "قطاران في اتجاهين متعاكسين سرعتاهما 50 و 70، المسافة بينهما بعد ساعتين:", "steps": ["متعاكسان ← 50 + 70 = 120", "120 × 2 = 240"], "a": "240 كم"}, "memo": "**متعاكسان = اجمع، اتجاه واحد = اطرح**، ثم × الزمن.", "think": {"q": "لماذا نطرح السرعتين عندما تسير السيارتان في اتجاه واحد؟", "a": "لأن السريعة تبتعد عن البطيئة بالفرق فقط كل ساعة: 70 و 50 ← تبتعد 20 كم كل ساعة."}}, "speed2": {"story": "أخوك خرج قبلك على الدراجة، وأنت أسرع منه. كل ساعة تقترب منه بمقدار فرق السرعتين، حتى تلحق به!", "steps": ["اللحاق: المسافة التي سبقك بها = سرعته × الفارق الزمني.", "اقسمها على فرق السرعتين ← هذا زمن اللحاق.", "العجلة: محيطها = 2 ط نق، المسافة = اللفات × المحيط، واللفات = المسافة ÷ المحيط.", "السرعة المتوسطة (ذهاب وعودة لنفس المسافة): 2 × السرعة الأولى × السرعة الثانية ÷ مجموعهما."], "example": {"q": "ذهب بسرعة 30 ورجع بسرعة 60 (نفس المسافة)، السرعة المتوسطة:", "steps": ["2 × 30 × 60 = 3600", "30 + 60 = 90", "3600 ÷ 90 = 40"], "a": "40"}, "memo": "**اللحاق = المسافة بينهما ÷ فرق السرعتين**. والمتوسطة **ليست** نصف المجموع!", "think": {"q": "ذهب بسرعة 30 ورجع بسرعة 60. لماذا السرعة المتوسطة 40 وليست 45؟", "a": "لأنه قضى وقتاً أطول في الذهاب البطيء. جرّب مسافة 60: الذهاب ساعتان والعودة ساعة، فالمجموع {120|3} = 40."}}, "evenodd": {"story": "تخيّل فريقك يمشي في ممرات مدرسة الوحوش **أزواجاً أزواجاً**. لو كل واحد معه صاحب فالعدد [b:زوجي]، ولو بقي واحد وحده فالعدد [r:فردي].", "steps": ["حاول تكتب العدد على شكل 2 × عدد.", "لو نجحت بلا زيادة ← العدد **زوجي** [b:2ن].", "لو بقي 1 زيادة ← العدد **فردي** [r:2ن + 1].", "لو أعطوك قيمة ن: اضربها في 2، وللفردي أضف 1."], "example": {"q": "إذا كان ن = 6، فإن العدد الفردي 2ن + 1 = ؟", "steps": ["2ن = 2 × 6 = 12", "نضيف 1: 12 + 1 = 13", "13 لا ينقسم أزواجاً، يبقى واحد ← فردي ✓"], "a": "13"}, "memo": "زوجي = ضعف عدد. فردي = ضعف عدد + 1.", "think": {"q": "لو جمعت عددين **فرديين** مثل 3 + 5، هل الناتج زوجي أم فردي دائماً؟", "a": "زوجي دائماً: 3 + 5 = 8، و 7 + 9 = 16. لأن كل فردي معه 1 زيادة، والواحدان الزائدان يصيران زوجاً."}}, "prime": {"story": "العدد الأولي مثل باب سري لا يفتحه إلا **مفتاحان** فقط: الواحد، والعدد نفسه. لو فتحه مفتاح ثالث فهو ليس أولياً.", "steps": ["تذكّر: الأولي له قاسمان مخت "}, "memo": "لا نجمع المقامات أبداً!", "think": {"q": "لماذا {1|2} + {1|2} لا تساوي {2|4}؟", "a": "لأن {2|4} = {1|2} نصف فقط، ونصفان يساويان 1 كاملاً: {1|2} + {1|2} = {2|2} = 1. جمع المقامات يصغّر الجواب خطأً."}}, "fracmul": {"story": "عندك 16 فطيرة، وكل لاعب يأخذ **نصف** فطيرة. كم لاعباً يأكل؟ 32! لذلك القسمة على {1|2} تعني الضرب في 2.", "steps": ["العدد الكسري أولاً: (الصحيح × المقام + البسط) فوق نفس المقام.", "الضرب: بسط × بسط، ومقام × مقام.", "القسمة: اترك الأول، اقلب الثاني، ثم اضرب.", "بسّط الناتج.", "انتبه: القسمة على صفر غير معرّفة."], "example": {"q": "{3|4} ÷ 1{1|2} = ؟", "steps": ["نحوّل العدد الكسري: 1{1|2} = {1 × 2 + 1|2} = {3|2}", "نقلب الثاني ونضرب: {3|4} × {2|3}", "{3 × 2|4 × 3} = {6|12}", "نبسّط: {6|12} = {1|2}"], "a": "{1|2}"}, "memo": "القسمة = اقلب الثاني واضرب.", "think": {"q": "لماذا 10 ÷ {1|2} أكبر من 10؟", "a": "لأننا نسأل: كم نصفاً في 10؟ في كل واحد نصفان، إذن 10 × 2 = 20."}}, "decimal": {"story": "الفاصلة مثل **حارس البوابة**: كل صفر في المقام يعطيك خانة واحدة بعد الفاصلة. {25|100} فيها صفران، إذن خانتان: 0.25", "steps": ["للتحويل: عدد الأصفار في المقام = عدد الخانات بعد الفاصلة.", "الجمع والطرح: رتّب الفواصل تحت بعض، وأكمل الخانات الناقصة بأصفار.", "الضرب: اضرب الأعداد بدون فاصلة، ثم عُدّ الخانات بعد الفاصلة في العددين معاً، وضع الفاصلة.", "القسمة: حرّك الفاصلة في العددين نفس العدد من الخانات حتى يصير المقسوم عليه عدداً صحيحاً."], "example": {"q": "0.4 × 0.25 = ؟", "steps": ["نضرب بدون فاصلة: 4 × 25 = 100", "الخانات بعد الفاصلة: 1 (في 0.4) + 2 (في 0.25) = 3 خانات", "نضع الفاصلة قبل 3 خانات: 0.100", "100 = 0.1"], "a": "0.1"}, "memo": "كم صفراً في المقام؟ كم خانة بعد الفاصلة!", "think": {"q": "لماذا 0.5 × 0.5 أصغر من 0.5؟", "a": "0.5 × 0.5 = 0.25، لأنك تأخذ **نصف النصف**. الضرب في عدد أصغر من 1 يصغّر العدد."}}, "famous": {"story": "هذه الكسور مثل **أسلحتك المحفوظة** في اللعبة: لو تعرفها بسرعة، تهزم السؤال في ثانية بدون حساب طويل.", "steps": ["احفظ الأساسيات: {1|4} = 25% ، {1|2} = 50% ، {3|4} = 75%", "والأخماس: {1|5} = 20% ، {2|5} = 40% ، {3| function chCreate(){screen();var c=el('div','card');c.innerHTML='<h2>🆕 اختر الدور للتحدي</h2>';var g=el('div','grid');
  [['🏫','كل الأدوار',0]].concat(WORLDS.map(function(w,i){return[w.ic,w.name,i+1]})).forEach(function(x){var b=btn('isl','<div class="ic">'+x[0]+'</div><div class="t">'+x[1]+'</div>',function(){var code=String(x[2])+String(1000+Math.floor(Math.random()*9000));chReady(code,true)});g.appendChild(b)});c.appendChild(g);main.appendChild(c)}
function chJoin(){screen();var c=el('div','card victory');c.innerHTML='<h2>🔢 اكتب رمز التحدي</h2><p>الرمز ٥ أرقام وصلك في القروب.</p>';var inp=el('input','cin');inp.setAttribute('inputmode','numeric');inp.setAttribute('maxlength','10');inp.placeholder='34821';c.appendChild(inp);
  var r=el('div','row');r.appendChild(btn('btn','دخول ←',function(){var code=normCode(inp.value);if(code.length!==5||+code.charAt(0)>WORLDS.length){toast('الرمز لازم يكون ٥ أرقام صحيحة 🔢');return}chReady(code,false)}));c.appendChild(r);main.appendChild(c);inp.focus()}
function chReady(code,mine){screen();var f=+code.charAt(0);var c=el('div','card victory');c.innerHTML='<p>رمز التحدي</p><div class="code">'+m(code)+'</div><p>'+(f?WORLDS[f-1].ic+' '+WORLDS[f-1].name:'🏫 كل الأدوار')+' — '+m('10')+' أسئلة — '+m('30')+' ثانية لكل سؤال</p>'+(S.ch&&S.ch[code]?'<p style="color:var(--muted)">لعبته قبل: '+m(S.ch[code].s+' / 10')+'</p>':'');
  if(mine){c.appendChild(el('p',null,'أرسل الرمز لأصحابك أولاً 👇'));c.appendChild(shareBtns('🧟 تحدي أبطال موهبة!\nرمز التحدي: '+code+'\nادخل اللعبة واضغط «👥 تحدَّ أصحابك» ثم «🔢 عندي رمز» 😎\n'+location.href.split('#')[0]))}
  var r=el('div','row');r.appendChild(btn('btn red','⚔️ ابدأ',function(){countdown(function(){quiz(chItems(code),'challenge',challenge,{code:code})})}));r.appendChild(btn('btn ghost','← رجوع',challenge));c.appendChild(r);main.appendChild(c)}
function countdown(done){var d=el('div','cdown');document.body.appendChild(d);var n=3;function step(){if(n>0){d.textContent=AD[n];tone(440,.15,'square',.08);n--;setTimeout(step,900)}else{d.textContent='يلا!';tone(880,.3,'square',.1);setTimeout(function(){d.remove();done()},600)}}step()}
function dueCards(){var d=day();return ALL.filter(function(k){var c=S.cards[k.id];return c&&c.b>0&&c.due<=d})}
function daily(){var due=dueCards();if(!due.length){var seen=ALL.filter(function(k){return C(k.id).b>0});if(!seen.length){toast('ابدأ بالدور الأرضي واجمع أول بطاقة 🔢');return}due=seen.sort(function(a,b){return C(a.id).b-C(b.id).b}).slice(0,6)}
  quiz(pick(due,8).map(function(k){return{q:rnd(k.q),k:k}}),'daily',lobby)}
function boss(w){var it=[];w.cards.forEach(function(k){it.push({q:rnd(k.q),k:k})});quiz(pick(it,Math.min(10,it.length)),'boss',function(){world(w)},{w:w})}
// ---------- race the AI: 60 seconds, the robot answers at a steady pace ----------
function race(){var pool=ALL.filter(function(k){return C(k.id).b>0});if(pool.length<3)pool=WORLDS[0].cards;var left=60,me=0,ai=0,tick=0;screen();
  var top=el('div','card');top.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b>🤖 تحدَّ الذكاء الاصطناعي</b><span class="timer" id="tm"></span></div><div class="race"><div class="lane"><span id="lm" style="left:2%">🏃</span><b id="sm"></b></div><div class="lane"><span id="la" style="left:2%">🤖</span><b id="sa"></b></div></div>';main.appendChild(top);var area=el('div');main.appendChild(area);
  function upd(){$('#lm').style.left=Math.min(85,2+me*5)+'%';$('#la').style.left=Math.min(85,2+ai*5)+'%';$('#sm').innerHTML=m('أنت '+me);$('#sa').innerHTML=m('الروبوت '+ai)}
  function q(){area.innerHTML='';var k=rnd(pool),it=rnd(k.q),box=el('div','qbox');box.appendChild(el('div','prompt',m(it.q)));var g=el('div','opts');
    shuffle(it.o.map(function(o,j){return{o:o,ok:j===0}})).forEach(function(o){g.appendChild(btn('opt',m(o.o),function(){if(o.ok){me++;sfx('ok')}else{me=Math.max(0,me-1);sfx('bad');flash('r');C(k.id).bad++}upd();q()}))});box.appendChild(g);area.appendChild(box)}
  function step(){var e=$('#tm');if(e){e.innerHTML=m('⏱️ '+left);e.classList.toggle('low',left<=10)}tick++;if(tick%4===0){ai++;upd()}if(left--<=0){clearInterval(timer);timer=null;fin()}}
  function fin(){var won=me>ai,best=me>S.best;if(best)S.best=me;if(won)S.aiWins=(S.aiWins||0)+1;addXP(me*3);save();screen();var v=el('div','card victory');
    v.innerHTML='<div class="crown">'+(won?'🏆':me===ai?'🤝':'🤖')+'</div><div class="bigs">'+m(me+' : '+ai)+'</div><p style="font-weight:800">'+(won?phAt('ok',10):me===ai?'تعادل! المرة الجاية تسبقه 💪':'الروبوت سبقك هالمرة… '+ph('no'))+'</p><p>'+m('أفضل رقم لك: '+S.best)+'</p>';
    var r=el('div','row');r.appendChild(btn('btn','🔁 مرة ثانية',race));r.appendChild(btn('btn ghost','الرئيسية',lobby));v.appendChild(r);main.appendChild(v);sfx(won?'win':'lose');if(won)confetti()}
  upd();step();timer=setInterval(step,1000);q()}
// ---------- traps: the coach's "common mistakes", true or false ----------
function traps(){var it=shuffle(TRAPS.map(function(t){return{s:t.w,ok:false,fix:t.r}}).concat(TRAPS.map(function(t){return{s:t.r,ok:true,fix:t.r}}))).slice(0,10),i=0,right=0;
  function show(){screen();var t=it[i],box=el('div','qbox');box.appendChild(el('div','prog','<span class="chip">'+m((i+1)+' / '+it.length)+'</span><div class="meter"><i style="width:'+Math.round(i/it.length*100)+'%"></i></div><span>🪤</span>'));
    box.appendChild(el('p',null,'الزومبي حط فخ في الممر! هل هذا <b>صحيح</b> أم <b>فخ</b>؟'));box.appendChild(el('div','prompt',m(t.s)));var g=el('div','opts'),done=false;
    [['✅ صحيح',true],['🪤 فخ!',false]].forEach(function(o){var b=btn('opt',o[0],function(){if(done)return;done=true;var good=o[1]===t.ok;if(good){right++;sfx('ok');flash('g');addXP(5)}else{sfx('bad');flash('r');shake()}b.classList.add(good?'good':'bad');
      box.appendChild(el('div','fb '+(good?'ok':'no'),(good?ph('ok'):ph('no'))+(t.ok?'':'<small>✅ الصحيح: '+m(t.fix)+'</small>')));var r=el('div','row');r.appendChild(btn('btn',i<it.length-1?'التالي ←':'النتيجة 🏁',function(){i++;if(i<it.length)show();else end()}));box.appendChild(r)});g.appendChild(b)});
    box.appendChild(g);main.appendChild(box)}
  function end(){screen();var v=el('div','card victory');v.innerHTML='<div class="crown">🪤</div><div class="bigs">'+m(right+' / '+it.length)+'</div><p style="font-weight:800">'+(right>=8?'ما طحت في ولا فخ تقريباً! '+ph('ok'):'الفخاخ تعلّمنا! راجعها وارجع 💪')+'</p>';var r=el('div','row');r.appendChild(btn('btn','🔁 مرة ثانية',traps));r.appendChild(btn('btn ghost','الرئيسية',lobby));v.appendChild(r);main.appendChild(v);sfx('win')}
  show()}
// ---------- collection & parent ----------
function collection(){screen();var n=ALL.filter(function(k){return C(k.id).b>0}).length;main.appendChild(el('div','card','<h2>🃏 بطاقاتي</h2><p style="margin:0">جمعت '+m(n+' من '+ALL.length)+' بطاقة. عادية ← نادرة ← ملحمية ← أسطورية 🌟</p>'));
  WORLDS.forEach(function(w,i){main.appendChild(el('h3',null,w.ic+' '+FLOOR[i]+': '+w.name));var g=el('div','grid');w.cards.forEach(function(k){g.appendChild(cardTile(k,function(){learn(k)}))});main.appendChild(g)})}
function parent(){screen();var c=el('div','card');c.innerHTML='<h2>👨‍👦 لوحة ولي الأمر</h2><p>'+m('🔥 '+S.streak+' يوم متتالي — 📅 '+(S.days||0)+' يوم — ⭐ '+S.xp+' — 🤖 فاز على الذكاء الاصطناعي '+(S.aiWins||0)+' مرة — أفضل سباق: '+S.best)+'</p>';
  var t=el('table','par');t.innerHTML='<tr><th>الدور</th><th>جمع</th><th>أتقن</th><th>الزعيم</th></tr>';WORLDS.forEach(function(w){var s=wstat(w);t.innerHTML+='<tr><td>'+w.ic+' '+w.name+'</td><td>'+m(s.seen+' / '+s.n)+'</td><td>'+m(s.good+'')+'</td><td>'+(S.boss[w.id]?'🏆':'—')+'</td></tr>'});c.appendChild(t);
  var weak=ALL.filter(function(k){return C(k.id).bad>=2}).sort(function(a,b){return C(b.id).bad-C(a.id).bad}).slice(0,10);c.appendChild(el('h3',null,'قوانين تحتاج مراجعة'));c.appendChild(el('p',null,weak.length?weak.map(function(k){return k.ic+' '+m(k.t)}).join(' · '):'لا يوجد حتى الآن 👏'));
  var r=el('div','row');r.appendChild(btn('btn ghost',S.scare===false?'😴 مفاجآت الزومبي: طافية':'😱 مفاجآت الزومبي: شغّالة',function(){S.scare=S.scare===false;save();parent()}));r.appendChild(btn('btn ghost','🗑️ تصفير التقدم',function(){if(confirm('تصفير كل التقدم؟')){S={xp:0,streak:1,last:day(),days:1,cards:{},boss:{},best:0,aiWins:0,sound:S.sound,scare:S.scare,ch:{}};save();hud();lobby()}}));c.appendChild(r);main.appendChild(c)}
$('#b-home').onclick=lobby;$('#b-snd').onclick=function(){S.sound=!S.sound;save();hud()};
window.__q={S:function(){return S},ALL:ALL,m:m,PH:PH};
hud();lobby();setTimeout(function(){toast('🧟 '+phAt('hi',0))},400);
})();
</script>
