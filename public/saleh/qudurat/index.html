<style>
:root{--bg:#070b08;--bg2:#0e1710;--card:#141f17;--card2:#1a2a1e;--line:#2b4232;--ink:#eafbe9;--muted:#9ab8a1;--gold:#ffc83d;--ok:#36e07a;--bad:#ff4d4d;--zom:#7dff6a;--blood:#b3001b;--blue:#4aa3ff;
  --r0:#4f5d53;--r1:#36e07a;--r2:#4aa3ff;--r3:#b06bff;--r4:#ffc83d;--rad:18px;--f:"HeroBaloo","Baloo Bhaijaan 2","Noto Sans Arabic",Tahoma,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--f);font-size:clamp(16px,1vw + 12px,22px);line-height:1.7;background:#070b08}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(900px 500px at 50% -10%,#1d3a22 0,transparent 65%),repeating-linear-gradient(90deg,#0b130d 0 120px,#0d1710 120px 124px),linear-gradient(180deg,#0e1710,#050805)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:8px 10px;background:rgba(7,11,8,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .who{display:flex;align-items:center;gap:8px;flex:1;min-width:0}.ava{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:linear-gradient(160deg,#3fd56a,#147a3a);box-shadow:0 0 14px rgba(125,255,106,.35)}
.who b{display:block;line-height:1.2}.who small{color:var(--muted);font-size:.72em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 8px;font-weight:800;white-space:nowrap;font-size:.9em}
.hb{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px}
.xpbar{height:6px;background:#020402;border-radius:6px;overflow:hidden;margin-top:3px}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--zom),#1fae4b)}
main{max-width:980px;margin:0 auto;padding:14px 16px 60px;display:flex;flex-direction:column;gap:14px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--rad);padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px 18px;border:1px solid #2f5a37;background:linear-gradient(180deg,rgba(10,20,12,.2),rgba(5,8,5,.9)),repeating-linear-gradient(90deg,#16261a 0 46px,#1b3020 46px 48px,#16261a 48px 92px,#203826 92px 94px);box-shadow:inset 0 -40px 60px rgba(0,0,0,.6),0 0 30px rgba(125,255,106,.08)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(260px 120px at 50% 0,rgba(220,255,200,.35),transparent 70%);animation:flick 5s infinite;pointer-events:none}
@keyframes flick{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.15}}

.hero .zz{position:absolute;inset-inline-end:10px;bottom:-6px;font-size:64px;animation:lurch 3.2s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(125,255,106,.6))}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.isl{background:linear-gradient(180deg,#1c2e21,#121c15);border:2px solid var(--c,var(--line));border-radius:18px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 rgba(0,0,0,.5),0 0 18px color-mix(in srgb,var(--c,#000) 25%,transparent)}
.isl:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.5)}.isl .ic{font-size:38px;line-height:1.1}.isl .t{font-weight:800;line-height:1.3}.isl small{color:var(--muted);font-size:.75em;line-height:1.4}
.isl .fl{font-size:.7em;font-weight:800;color:#0b120d;background:var(--c);border-radius:999px;padding:0 10px}
.meter{width:100%;height:8px;background:#020402;border-radius:8px;overflow:hidden}.meter i{display:block;height:100%;background:var(--c,var(--ok))}
.btn{background:linear-gradient(180deg,#8dff7a,#2fbf55);color:#062a10;font-weight:800;border-radius:16px;padding:12px 20px;box-shadow:0 5px 0 #146b2c,0 0 16px rgba(125,255,106,.25);min-height:50px}
.btn.red{background:linear-gradient(180deg,#ff6b6b,#c0122a);color:#fff;box-shadow:0 5px 0 #6d0715,0 0 16px rgba(255,60,60,.3)}.btn.blue{background:linear-gradient(180deg,#5db2ff,#2f80ed);color:#fff;box-shadow:0 5px 0 #1b4f9a}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.5)}.btn:active{transform:translateY(3px);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.pill{display:inline-block;background:var(--c,#2b4232);color:#071008;border-radius:999px;padding:2px 12px;font-weight:800;font-size:.8em}
.law{background:#0d160f;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0}
.rule{background:#241d08;border:2px solid var(--gold);border-radius:14px;padding:10px 14px;margin:8px 0}
.trick{background:#0e2a17;border:2px solid var(--ok);border-radius:14px;padding:10px 14px;margin:8px 0}
.trap{background:#2a0c10;border:2px solid var(--bad);border-radius:14px;padding:10px 14px;margin:8px 0}.trap .w{text-decoration:line-through;text-decoration-color:var(--bad);opacity:.85}

.ov{border-top:2px solid currentColor;padding:0 .12em;margin-inline-start:.05em}sup{font-size:.65em}
.kr{color:#ff8a8a;font-weight:800}.kg{color:#7dff9e;font-weight:800}.kb{color:#86c8ff;font-weight:800}

.prompt{font-size:1.3em;font-weight:800;text-align:center;margin:8px 0 14px;line-height:1.8}

.chase{position:relative;height:64px;border-radius:14px;background:linear-gradient(180deg,#0b130d,#132017);border:1px solid var(--line);overflow:hidden;direction:ltr;margin-bottom:8px}
.chase::after{content:"";position:absolute;left:0;right:0;bottom:10px;height:2px;background:repeating-linear-gradient(90deg,#2b4232 0 14px,transparent 14px 26px)}
.chase .z,.chase .h,.chase .door{position:absolute;bottom:8px;font-size:36px;transition:left .5s cubic-bezier(.3,1.4,.6,1)}.chase .z{filter:drop-shadow(0 0 8px rgba(125,255,106,.7))}.chase .door{right:6px;font-size:34px}

.boss{display:flex;align-items:center;gap:10px;margin-bottom:8px}.boss .bz{font-size:52px;filter:drop-shadow(0 0 12px rgba(125,255,106,.7));animation:lurch 2.4s infinite}.boss .bz.hit{animation:hit .4s}

.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.prog{display:flex;align-items:center;gap:10px}.prog .meter{flex:1}
.cardv{border:3px solid var(--rc);border-radius:18px;padding:12px 8px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent),#0d160f;box-shadow:0 0 14px color-mix(in srgb,var(--rc) 30%,transparent)}
.cardv .ic{font-size:34px}.cardv .t{font-weight:800;font-size:.85em;line-height:1.35}.cardv .rk{font-size:.7em;color:var(--rc);font-weight:800}.cardv.locked{filter:grayscale(1);opacity:.5}
.victory{text-align:center}.victory .crown{font-size:76px}.victory .bigs{font-size:2.2em;font-weight:800;color:var(--gold)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#123a1d;border:1px solid var(--zom);color:#fff;padding:10px 18px;border-radius:14px;font-weight:800;z-index:50;max-width:90vw;text-align:center;animation:tp .25s;box-shadow:0 0 20px rgba(125,255,106,.3)}
@keyframes tp{from{opacity:0;transform:translate(-50%,10px)}}
.race{direction:ltr;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}.lane{position:relative;height:42px;border-radius:12px;background:#0b130d;border:1px solid var(--line)}.lane span{position:absolute;top:2px;font-size:30px;transition:left .4s}.lane b{position:absolute;right:8px;top:6px}
.timer{font-size:1.4em;font-weight:800;color:var(--gold)}.timer.low{color:var(--bad);animation:pulse .8s infinite}@keyframes pulse{50%{transform:scale(1.15)}}
.wd{background:#0d160f;border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;text-align:center}.wd input[type=range]{width:100%;accent-color:#5fe07a}.wd svg{max-width:240px;width:100%;height:auto}
table.par{width:100%;border-collapse:collapse}table.par td,table.par th{border-bottom:1px solid var(--line);padding:6px;text-align:center}
.conf{position:fixed;top:-10px;width:10px;height:14px;z-index:30;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(max-width:420px){.opts{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
