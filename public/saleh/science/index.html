<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مراجعة العلوم · الصف السادس</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Calm layout: one idea per screen. Top bar (home · title · mute), a lesson has 4 tabs
   (أفهم · أهم النقاط · المصطلحات · اختبار الدرس); each tab is a deck of cards with a fixed bottom bar. */
:root{
  --bg:#f6f3ec; --card:#fffdf9; --ink:#1d2733; --muted:#66707d; --line:#e7e0d2;
  --g:#2e7d4f; --g2:#e8f4ec; --b:#2563a6; --b2:#eaf1fa; --y:#ffd84d; --y2:#fff6cc; --o:#e3871c; --ok:#1f8a4c; --no:#c2412d;
  --f:'SalehBaloo','Segoe UI',Tahoma,sans-serif; --r:22px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:19px;line-height:1.7;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px}
.top h1{flex:1;margin:0;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:rgba(255,255,255,.16);border:0;border-radius:14px;min-width:48px;min-height:48px;font-size:1.25rem;color:#fff}
.ib.mute{background:#fff;color:var(--g);font-size:1.4rem}
main{max-width:760px;margin:0 auto;padding:12px 16px 120px}
/* home */
.hero{text-align:center;padding:10px 0 4px}
.hero h2{margin:6px 0 0;font-size:1.5rem;color:var(--g)}
.hero p{margin:0;color:var(--muted);font-size:.95rem}
.go{display:block;width:100%;border:0;border-radius:var(--r);background:var(--o);color:#fff;font-size:1.2rem;min-height:60px;margin:14px 0 4px;box-shadow:0 4px 0 #c06c0c}
.ch{margin:22px 0 6px;font-size:1.05rem;color:var(--b)}
.tile{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:8px 0;min-height:70px}
.tile .ic{font-size:1.8rem;width:44px;text-align:center}
.tile .n{flex:1;font-weight:600}
.tile small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.tile.small{min-height:56px;border-style:dashed}
.tile.final{border-color:var(--o);background:#fff7ec}
.ring{width:46px;height:46px;flex:none}
/* tabs */
.tabs{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;margin:4px 0 10px}
.tabs button{border:2px solid var(--line);background:#fff;border-radius:16px;min-height:56px;font-size:.88rem;line-height:1.3;padding:4px}
.tabs button b{display:block;font-size:1.2rem}
.tabs button.on{background:var(--g);border-color:var(--g);color:#fff}
/* card */
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:0 2px 12px rgba(60,40,10,.07);min-height:50vh}
.ct{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:.85rem}
.pg{flex:none;border:1.5px solid #e6c97a;background:#fff8e1;color:#7a5a12;border-radius:12px;padding:0 8px;font-size:.8rem;min-height:44px;white-space:nowrap}
.card h2{margin:0;font-size:1.25rem;line-height:1.5;color:var(--ink)}
.stage{position:relative;margin:6px auto 0;border-radius:16px;overflow:hidden;background:#fff;touch-action:manipulation}
.stage svg{display:block;width:100%;height:100%}
.say{font-size:1.12rem;line-height:1.8;margin:8px 0;min-height:3.6em;background:var(--g2);border-radius:16px;padding:8px 12px}
.say.dim{opacity:.25}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{border:2px solid var(--line);background:#fff;border-radius:14px;min-height:46px;padding:2px 14px;font-size:.95rem}
.chip.on{background:var(--y2);border-color:var(--y)}
.bubble{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(255,255,255,.96);border:2px solid var(--y);border-radius:14px;padding:6px 10px;font-size:.95rem;line-height:1.5;display:none}
.bubble.on{display:block}
.bubble b{color:var(--g)}
.part{cursor:pointer}
.part.hi image{filter:drop-shadow(0 0 5px #ffd84d) drop-shadow(0 0 2px #7a5a12)}
.part .hit{fill:transparent}
.ld{stroke:#7a5a12;stroke-width:1.6;stroke-dasharray:5 4;fill:none}
.nm{font-family:var(--f);font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:6px;fill:#1d2733;pointer-events:none}
/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(246,243,236,.97);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px}
.nav{flex:1;min-height:56px;border-radius:18px;border:2px solid var(--line);background:#fff;font-size:1.05rem}
.nav.next{background:var(--g);border-color:var(--g);color:#fff}
.nav.next.pulse{animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 0 6px rgba(46,125,79,.25)}}
.nav:disabled{opacity:.35}
.cnt{min-width:64px;text-align:center;color:var(--muted);font-size:.9rem}
.dots{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:0 0 10px}
.dots i{display:block;height:100%;background:var(--y);transition:width .3s}
/* terms */
.term{perspective:900px;margin:8px 0}
.term .fc{position:relative;min-height:230px;transition:transform .6s;transform-style:preserve-3d}
.term.flip .fc{transform:rotateY(180deg)}
.term .fs{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px}
.term .front{background:var(--y2);border:3px solid var(--y)}
.term .front b{font-size:2rem;line-height:1.4}
.term .back{background:var(--g2);border:3px solid var(--g);transform:rotateY(180deg);font-size:1.15rem;line-height:1.8}
.hl{background:var(--y);border-radius:6px;padding:0 4px}
.big{display:block;width:100%;min-height:54px;border-radius:16px;border:2px solid var(--line);background:#fff;font-size:1.05rem;margin:8px 0}
.big.p{background:var(--b);border-color:var(--b);color:#fff}
/* points */
.pt{font-size:1.3rem;line-height:1.8;background:var(--b2);border-radius:18px;padding:12px 14px;margin:6px 0}
/* questions */
.qx{font-size:1.15rem;line-height:1.8;margin:6px 0 10px}
.opt{display:block;width:100%;text-align:right;border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 14px;margin:8px 0;min-height:54px;font-size:1.05rem}
.opt.ok{border-color:var(--ok);background:#e6f6ec}
.opt.no{border-color:var(--no);background:#fbebe8}
.fb{border-radius:16px;padding:10px 14px;margin:10px 0;font-size:1rem}
.fb.ok{background:#e6f6ec;border:2px solid var(--ok)}
.fb.no{background:#fbebe8;border:2px solid var(--no)}
.fb.in{background:var(--b2);border:2px solid var(--b)}
.lnk{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0}
.lnk button{border:0;background:none;color:var(--b);font-size:.95rem;min-height:44px;padding:0 6px;text-decoration:underline}
textarea{width:100%;min-height:90px;border:2px solid var(--line);border-radius:14px;padding:10px;font:inherit;font-size:1.05rem}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt button{min-height:52px;border:2px solid var(--line);border-radius:14px;background:#fff;padding:6px}
.mt button.sel{border-color:var(--b);background:var(--b2)}
.mt button.done{border-color:var(--ok);background:#e6f6ec}
.chk label{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.chk input{width:24px;height:24px;margin-top:6px;flex:none}
.qimg{width:100%;border-radius:14px;border:1px solid var(--line);margin:4px 0}
.oos{background:#fdf0e6;border:1px solid #f0c59c;border-radius:12px;padding:4px 10px;font-size:.85rem;margin:4px 0}
.tag{font-size:.78rem;color:var(--muted)}
.score{text-align:center;font-size:1.3rem}
.score b{font-size:2.4rem;color:var(--g)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,20,.75);z-index:50;display:none;align-items:center;justify-content:center;padding:10px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:18px;max-width:860px;width:100%;max-height:94vh;overflow:auto;padding:12px}
.modal img{width:100%;display:block}
.set label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;min-height:48px}
.set select{font:inherit;min-height:44px}
.set input{width:26px;height:26px}
.note{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#1d2733;color:#fff;padding:8px 16px;border-radius:14px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (max-width:420px){html,body{font-size:18px}.tabs button{font-size:.78rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="ib" id="home" aria-label="الرئيسية">🏠</button>
  <h1 id="ttl">مراجعة العلوم</h1>
  <button class="ib mute" id="mute" aria-label="كتم الصوت">🔊</button>
  <button class="ib" id="setb" aria-label="الإعدادات">⚙️</button>
</header>
<main id="m"></main>
<div class="bar" id="bar" hidden><div class="in">
  <button class="nav" id="prev">→ السابق</button>
  <span class="cnt" id="cnt"></span>
  <button class="nav next" id="next">التالي ←</button>
</div></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

<script>
const D = {"fx": {"ok": ["vcdbd8c72cd48", "v8c456c0655d3", "v78a814ab8053"], "no": ["vd1c1174df333", "v3b4a688d9716"], "cmp": ["vc3949e97b78c"], "qs": ["vc76e08cad429"], "end": ["v041ed346c0b5"]}, "title": "مراجعة العلوم التفاعلية", "sub": "العلوم · الصف السادس الابتدائي · الفصل الدراسي الأول · الوحدة الأولى: تنوّع الحياة", "scope": "صفحات الكتاب ٢٤–٧٤ (تحديد الأستاذ) · الشرح والرسومات والأسئلة كلها من كتاب الطالب", "credit": "الرسومات والنصوص من كتاب العلوم للصف السادس (وزارة التعليم ١٤٤٨هـ). الشرح المبسّط والإجابات المقترحة من إعدادنا اعتمادًا على الكتاب. الصوت: صوت عربي آلي (Microsoft Hamed).", "lessons": [{"id": "L01", "unit": "الوحدة الأولى: تنوّع الحياة", "chapter": "الفصل الأول: الخلايا", "name": "الدرس الأول: نظرية الخلية", "pages": [24, 29], "note": "الدرس يبدأ في الكتاب من صفحة ٢٢ (أنظر وأتساءل، ونشاط أستكشف «كيف تبدو الخلايا؟» ص٢٣)، وتحديد الأستاذ يبدأ من ٢٤.", "sections": [{"id": "L01-s1", "page": 24, "title": "كيف اكتشفت الخلايا؟", "book": "تتكون المخلوقات الحية جميعها من خلية أو أكثر. والخلية هي الوحدة الأساسية للمخلوق الحي، وهي أصغر جزء فيه قادر على الحياة. ومعظم الخلايا لا يمكن مشاهدتها بالعين المجردة. لذلك كان اختراع المجهر بداية الطريق لتعرف الخلايا.\nوقد كان العالم الإنجليزي روبرت هوك أول من شاهد الخلية، وهو أول من أطلق عليها اسم الخلية. وفي عام ١٦٦٥م قام بصنع مجهر، واستخدمه لفحص شريحة رقيقة من الفلين، فاستطاع أن يشاهد جدران نسيج الفلين، ووصفها بأنها صناديق صغيرة متراصة تشبه خلايا النحل.\nوجاء بعد روبرت هوك بوقت قصير تاجر هولندي يدعى ليفنهوك، كان أول من استطاع أن يشاهد مخلوقات حية وحيدة الخلية بمجهر قام بصنعه. وكانت قوة تكبيره أكبر تسع مرات من قوة تكبير مجهر روبرت هوك.", "simple": "كل مخلوق حي مبني من خلية أو أكثر. معظم الخلايا صغيرة جدًا لا تراها العين. لذلك احتجنا إلى المجهر لنراها. الخلية هي الوحدة الأساسية للمخلوق الحي.", "steps": [{"q": "ماذا أرى؟", "t": "أرى مجهرًا قديمًا، ودائرتين مكبّرتين تُظهران خلايا الفلين.", "fig": "f24a", "parts": [], "a": "va40af743fb0d"}, {"q": "ما الأجزاء؟", "t": "على اليسار مجهر يشبه مجهر روبرت هوك. وعلى اليمين خلايا الفلين تحت المجهر الإلكتروني الماسح.", "fig": "f24a", "parts": ["p1", "p2"], "a": "va4cc33e9c06f"}, {"q": "ما اسم كل جزء؟", "t": "الخلية: الوحدة الأساسية للمخلوق الحي، وأصغر جزء فيه قادر على الحياة.", "a": "v128c833e5d0a"}, {"q": "ماذا يفعل؟", "t": "صنع روبرت هوك مجهرًا عام ١٦٦٥م، وفحص به شريحة رقيقة من الفلين. رأى صناديق صغيرة متراصّة تشبه خلايا النحل.", "a": "v2a3a51438b47"}, {"q": "كيف يرتبط بغيره؟", "t": "بعده جاء ليفنهوك بمجهر أقوى تسع مرات. فشاهد أول مرة مخلوقات حية وحيدة الخلية.", "a": "v49a21d8b6737"}, {"q": "الفكرة المهمة", "t": "روبرت هوك أول من شاهد الخلية وسمّاها. واختراع المجهر كان بداية طريق معرفة الخلايا.", "a": "v747c010421d0"}], "figs": ["f24a"], "key": "الخلية هي الوحدة الأساسية للمخلوق الحي، واكتُشفت بفضل المجهر.", "sa": "vecb8e20f7802"}, {"id": "L01-s2", "page": 25, "title": "تطور نظرية الخلية", "book": "لاحظ ليفنهوك العديد من المخلوقات الحية بمجهره، وكان يرسم كل اكتشاف جديد يراه بالمجهر. وأظهرت بعض رسوماته تفاصيل دقيقة للبكتيريا والخميرة وخلايا الدم. وقد ازداد فهمنا لتركيب الخلية عبر السنين مع تقدم صناعة المجاهر وتحسينها.\nوفي عام ١٨٣١م اكتشف العالم الإسكتلندي روبرت براون نواة الخلية النباتية. كذلك اهتم العالم الألماني شلايدن بدراسة خلايا النباتات تحت المجهر. وفي عام ١٨٣٨م استنتج شلايدن أن جميع النباتات تتكون من خلايا. وبعد سنة اكتشف ثيودور شفان أن جميع الحيوانات تتكون من خلايا أيضًا. وقام العالمان براون وشفان معًا بوضع نظرية الخلية، مستعينين بأعمال هوك وليفنهوك.\nتتضمن نظرية الخلية ثلاث أفكار رئيسة:\n• جميع المخلوقات الحية تتكون من خلية أو أكثر.\n• الخلايا هي الوحدة الأساسية للتركيب والوظيفة في المخلوقات الحية جميعها.\n• تنتج الخلايا عن خلايا موجودة.", "simple": "تعاون علماء كثيرون عبر السنين لفهم الخلية. كل عالم أضاف اكتشافًا جديدًا. ومع تحسّن المجاهر زاد فهمنا. فوُضعت نظرية الخلية بثلاث أفكار رئيسة.", "steps": [{"q": "ماذا أرى؟", "t": "ليفنهوك رسم ما رآه بمجهره: تفاصيل دقيقة للبكتيريا والخميرة وخلايا الدم.", "a": "v72cfb5047534"}, {"q": "ما الأجزاء؟", "t": "١٨٣١م: روبرت براون اكتشف نواة الخلية النباتية.", "a": "v434c0a1c9a22"}, {"q": "ما اسم كل جزء؟", "t": "١٨٣٨م: شلايدن استنتج أن جميع النباتات تتكون من خلايا. وبعد سنة اكتشف شفان أن جميع الحيوانات تتكون من خلايا أيضًا.", "a": "vee11e93ae4d8"}, {"q": "كيف يرتبط بغيره؟", "t": "وضع براون وشفان معًا نظرية الخلية، مستعينين بأعمال هوك وليفنهوك. كل اكتشاف بُني على ما قبله.", "a": "ve0c5129cf02f"}, {"q": "الفكرة المهمة", "t": "نظرية الخلية: كل المخلوقات الحية من خلية أو أكثر. الخلايا وحدة التركيب والوظيفة. الخلايا تنتج عن خلايا موجودة.", "a": "v029bcc090d09"}], "figs": [], "key": "نظرية الخلية: المخلوقات الحية من خلايا، والخلية وحدة التركيب والوظيفة، والخلايا تنتج عن خلايا موجودة.", "sa": "v5fd49342b65c"}, {"id": "L01-s3", "page": 25, "title": "الخلايا والمخلوقات الحية", "book": "المخلوقات الحية جميعها تتكون من خلايا. وبعض المخلوقات الحية تتكون أجسامها من خلية واحدة وتسمى مخلوقات وحيدة الخلية. فالبكتيريا والبراميسيوم واليوجلينا جميعها مخلوقات وحيدة الخلية.\nأما المخلوقات العديدة الخلايا فتتكون أجسامها من أكثر من خلية، وقد يحتوي بعضها على بلايين الخلايا التي تقوم بوظائف متخصصة، وجسم الإنسان أيضًا مكون من خلايا مختلفة، تكون الجلد والأعصاب والدم والعضلات.\nقد تحتوي مستعمرة الفولفكس على أكثر من ٥٠٠ خلية، ولكل خلية سوط، وتتحرك الأسواط باتساق لدفع المستعمرة في الماء.\nالبراميسيوم مخلوق وحيد الخلية يعيش في الماء.", "simple": "بعض المخلوقات جسمها خلية واحدة فقط. وبعضها جسمها من خلايا كثيرة جدًا. الأولى اسمها: مخلوقات وحيدة الخلية. والثانية: مخلوقات عديدة الخلايا.", "steps": [{"q": "ماذا أرى؟", "t": "أرى البراميسيوم: مخلوق وحيد الخلية يعيش في الماء.", "fig": "f25b", "parts": [], "a": "vb2a1570b9255"}, {"q": "ما الأجزاء؟", "t": "وأرى مستعمرة الفولفكس: قد تحتوي على أكثر من ٥٠٠ خلية، ولكل خلية سوط.", "fig": "f25a", "parts": [], "a": "va9b35b5fdd12"}, {"q": "ما اسم كل جزء؟", "t": "البكتيريا والبراميسيوم واليوجلينا: مخلوقات وحيدة الخلية.", "a": "v8294278940e0"}, {"q": "ماذا يفعل؟", "t": "في المخلوقات العديدة الخلايا تقوم الخلايا بوظائف متخصصة. وقد يحتوي بعضها على بلايين الخلايا.", "a": "v816c9f16fafa"}, {"q": "الفكرة المهمة", "t": "جسمك أيضًا من خلايا مختلفة، تكوّن الجلد والأعصاب والدم والعضلات.", "a": "v1ddb1328bbc3"}], "figs": ["f25a", "f25b"], "key": "المخلوقات الحية إما وحيدة الخلية مثل البراميسيوم، أو عديدة الخلايا مثل الإنسان.", "sa": "v26f8ac83795f"}, {"id": "L01-s4", "page": 26, "title": "ما مستويات التنظيم في المخلوقات الحية؟", "book": "تشبه الخلايا إلى حد ما لبنات البناء، وتسمح مجموعة الخلايا معًا للمخلوق الحي بأداء جميع الوظائف الحيوية.\nيتكون المخلوق الحي الوحيد الخلية من خلية واحدة تقوم بجميع الأنشطة الضرورية للبقاء على قيد الحياة والتكاثر. أما في المخلوقات المتعددة الخلايا فتقوم كل خلية بوظيفة خاصة. وتقوم مجموعة الخلايا المتشابهة معًا بالوظيفة نفسها، وتشكل نسيجًا.\nتتكون أجسام الحيوانات غالبًا من أربعة أنواع رئيسة من الأنسجة، هي: النسيج العضلي، الذي يتكون من ألياف تحرك العظام وتضخ الدم وتحرك المواد في الجهاز الهضمي. والنسيج الضام ومنه العظام والغضاريف والدهون والدم. والنسيج العصبي الذي ينقل رسائل في الجسم. وأخيرًا النسيج الطلائي الذي يغطي أجزاء الجسم الداخلية، وطبقة الجلد الخارجية، والطبقة التي تبطن باطن الخد والجهاز الهضمي.", "simple": "الخلايا مثل لبنات البناء. الخلايا المتشابهة تجتمع وتقوم بالوظيفة نفسها. هذه المجموعة اسمها: النسيج. وللحيوانات أربعة أنواع رئيسة من الأنسجة.", "steps": [{"q": "ماذا أرى؟", "t": "أرى أربع صور مجهرية، كل صورة لنوع من الأنسجة.", "fig": "f26a", "parts": [], "a": "vab681d00b171"}, {"q": "ما الأجزاء؟", "t": "الأنواع الأربعة: نسيج عضلي، ونسيج ضام، ونسيج عصبي، ونسيج طلائي.", "fig": "f26a", "parts": ["p1", "p2", "p3", "p4"], "a": "vb04744cf3a74"}, {"q": "ما اسم كل جزء؟", "t": "النسيج: مجموعة خلايا متشابهة تقوم معًا بالوظيفة نفسها.", "a": "v74c770496971"}, {"q": "ماذا يفعل؟", "t": "العضلي يحرك العظام ويضخ الدم. العصبي ينقل الرسائل. الطلائي يغطي ويبطّن. والضام منه العظام والدم والدهون.", "a": "v5cca8a842ddb"}, {"q": "كيف يرتبط بغيره؟", "t": "الوحيد الخلية: خليته تقوم بكل الأنشطة. أما في المتعدد الخلايا فلكل خلية وظيفة خاصة.", "a": "v2421c5c782b4"}, {"q": "الفكرة المهمة", "t": "خلايا متشابهة لها الوظيفة نفسها تشكّل نسيجًا.", "a": "vc18b8d08e5be"}], "figs": ["f26a"], "key": "مجموعة الخلايا المتشابهة التي تقوم بالوظيفة نفسها تشكّل نسيجًا.", "sa": "vf259e584b743"}, {"id": "L01-s5", "page": 26, "title": "الأعضاء والأجهزة الحيوية", "book": "تنتظم الأنسجة في أجسام المخلوقات الحية لتشكل الأعضاء.\nالعضو مجموعة من نسيجين مختلفين أو أكثر، تعمل معًا للقيام بوظيفة محددة. والجلد أكبر عضو في جسم الإنسان، والقلب عضو آخر يعتمد في وظيفته على نسيج عضلي ونسيج عصبي ونسيج ضام. ومن الأمثلة الأخرى على الأعضاء في الحيوانات الدماغ والعين والرئة.\nوللنباتات أيضًا أعضاء؛ ويقوم كل منها بوظائف حيوية مختلفة. ومن هذه الأعضاء الجذر، ومن وظائفه امتصاص الماء والأملاح المعدنية من التربة، والساق الذي من وظائفه دعم النبات وحمل الأوراق والأزهار، والورقة أيضًا عضو، ومن وظائفها القيام بعملية البناء الضوئي، أما الزهرة فهي عضو التكاثر الجنسي في بعض أنواع النباتات.\nتشكل مجموعة الأعضاء التي تعمل معًا لأداء وظائف محددة جهازًا حيويًا. ويتكون جسم المخلوق الحي المتعدد الخلايا غالبًا من مجموعة من الأجهزة الحيوية تقوم بأداء الوظائف الأساسية للحياة. فجهاز الدوران مثلًا في جسم الإنسان يتكون من القلب والأوعية الدموية والدم، ويقوم بوظيفة نقل الأكسجين والمواد الغذائية إلى الخلايا، والتخلص من الفضلات. ويعتمد جسم الإنسان على الرئتين وبقية أعضاء الجهاز التنفسي للحصول على الأكسجين بشكل كاف.", "simple": "الأنسجة المختلفة تعمل معًا فتصنع عضوًا، مثل القلب. والأعضاء تعمل معًا فتصنع جهازًا حيويًا، مثل جهاز الدوران. هكذا يُبنى الجسم خطوة خطوة.", "steps": [{"q": "ماذا أرى؟", "t": "أرى القلب بين الرئتين، وفوقه الأوعية الدموية.", "fig": "f27a", "parts": [], "a": "v90620c427d8b"}, {"q": "ما الأجزاء؟", "t": "الأجزاء المسمّاة: القلب، والأوعية الدموية، والرئتان.", "fig": "f27a", "parts": ["p1", "p2", "p3"], "a": "v15708a4a6f6a"}, {"q": "ما اسم كل جزء؟", "t": "العضو: نسيجان مختلفان أو أكثر يعملان معًا لوظيفة محددة. والجهاز الحيوي: أعضاء تعمل معًا لوظائف محددة.", "a": "v0cf7a4f18b28"}, {"q": "ماذا يفعل؟", "t": "جهاز الدوران (القلب والأوعية الدموية والدم) ينقل الأكسجين والغذاء إلى الخلايا، ويتخلص من الفضلات.", "a": "vdc6d919a604d"}, {"q": "كيف يرتبط بغيره؟", "t": "القلب يعتمد على نسيج عضلي وعصبي وضام. والجسم يعتمد على الرئتين للحصول على الأكسجين.", "a": "v3e7a4709eca0"}, {"q": "الفكرة المهمة", "t": "للنبات أعضاء أيضًا: الجذر يمتص الماء، والساق يدعم، والورقة تقوم بالبناء الضوئي، والزهرة للتكاثر.", "a": "v06432a1a21be"}], "figs": ["f27a"], "key": "الأنسجة تكوّن الأعضاء، والأعضاء تعمل معًا فتكوّن الأجهزة الحيوية.", "sa": "ve3c184428f0a"}, {"id": "L01-s6", "page": 27, "title": "نشاط: المقارنة بين الخلايا في نسيج حيواني", "book": "١ الخلايا التي تكون أنواعًا مختلفة من الأنسجة في المخلوقات الحية المتعددة الخلايا تؤدي وظائف محددة. أحصل من معلمي على شريحة جاهزة لكل من الأنسجة التالية: الطلائي، والعصبي، والضام، والعضلي، وأطوي طوليًا ورقة قياسها ٢٩×٢١سم، ثم أطويها عرضيًا لتشكل أربعة مستطيلات أستخدمها في تدوين ملاحظاتي.\n٢ ألاحظ. أحصل على شريحة لنوع من الأنسجة، وأكتب اسمها في أول مستطيل في الورقة. أستعمل المجهر لفحصها، وأرسم في المستطيل ما شاهدته، وأكتب أي ملاحظات عن خلايا النسيج أثارت اهتمامي. أكرر ما قمت به مع الشرائح الثلاث المتبقية، مع ملاحظة استخدام مستطيل واحد لكل نوع من خلايا الأنسجة.\n٣ أقارن. أراجع رسومي الأربعة. ما بعض خصائص كل نوع من الخلايا؟ هل أستطيع تحديد كل نوع من الخلايا؟ أكتب ملاحظات إضافية على الرسم، مع أسماء الأجزاء التي أستطيع تحديدها.\n٤ أستنتج. لماذا يتخصص الأطباء في الأمراض التي تصيب نوعًا من الأعضاء أو الأنسجة؟", "simple": "في هذا النشاط تفحص أربعة أنسجة بالمجهر. ترسم كل نسيج في مستطيل خاص. ثم تقارن بين رسومك لترى كيف تختلف الخلايا.", "steps": [{"q": "ماذا أرى؟", "t": "الهدف: مقارنة خلايا أربعة أنسجة حيوانية تحت المجهر.", "a": "vd856536d505b"}, {"q": "ما الأجزاء؟", "t": "تحتاج شرائح جاهزة للأنسجة: الطلائي والعصبي والضام والعضلي، وورقة مطويّة إلى أربعة مستطيلات.", "a": "vec39f6f153c8"}, {"q": "ماذا يفعل؟", "t": "ألاحظ: تفحص كل شريحة بالمجهر، وترسمها في مستطيلها، وتكتب ملاحظاتك.", "a": "vdc615aeb1fec"}, {"q": "كيف يرتبط بغيره؟", "t": "أقارن ثم أستنتج: تراجع رسومك الأربعة، وتفكّر لماذا يتخصص الأطباء.", "a": "v43fde63af789"}, {"q": "الفكرة المهمة", "t": "خلايا كل نسيج تؤدي وظائف محددة، لذلك يختلف شكلها.", "a": "v3b28e8f2a5cc"}], "figs": [], "key": "خلايا الأنسجة المختلفة تؤدي وظائف محددة، ويمكن مقارنتها بالمجهر.", "sa": "v8bc87e765e7c"}, {"id": "L01-s7", "page": 28, "title": "ما المواد الموجودة في جميع المخلوقات الحية؟", "book": "جميع الأشياء من حولنا تتكون من جسيمات دقيقة تسمى الذرات. وهناك أكثر من ١٠٠ نوع من الذرات، ولكل نوع خصائصه التي تميزه. والعنصر مادة نقية لا يمكن تجزئتها إلى مواد أبسط منها. ويتكون العنصر الواحد من نوع واحد من الذرات لها التركيب نفسه. ويمكن للعناصر أن تتحد لتكون المركبات. والمركب مادة تتكون باتحاد كيميائي بين عنصرين أو أكثر.", "simple": "كل الأشياء مبنية من جسيمات دقيقة اسمها الذرات. العنصر من نوع واحد من الذرات. والعناصر تتحد فتصنع المركّبات.", "steps": [{"q": "ما الأجزاء؟", "t": "الذرات: جسيمات دقيقة تتكون منها جميع الأشياء. وهناك أكثر من ١٠٠ نوع منها.", "a": "v357c4a762ae8"}, {"q": "ما اسم كل جزء؟", "t": "العنصر: مادة نقية لا يمكن تجزئتها إلى مواد أبسط منها.", "a": "v3514754aa8bd"}, {"q": "ماذا يفعل؟", "t": "العنصر الواحد يتكون من نوع واحد من الذرات لها التركيب نفسه.", "a": "vb676e1055260"}, {"q": "كيف يرتبط بغيره؟", "t": "المركّب: مادة تتكون باتحاد كيميائي بين عنصرين أو أكثر.", "a": "ve6359ba5690d"}, {"q": "الفكرة المهمة", "t": "ذرات ← عناصر ← مركّبات: كل مستوى مبني من الذي قبله.", "a": "v702a2424848e"}], "figs": [], "key": "العنصر مادة نقية من نوع واحد من الذرات، والمركّب اتحاد كيميائي بين عنصرين أو أكثر.", "sa": "v18db44b1cc66"}, {"id": "L01-s8", "page": 28, "title": "العناصر والمركبات الموجودة في الخلايا", "book": "هناك العديد من المركبات التي توجد في الخلايا كلها. منها الكربوهيدرات وهي مركبات مكونة من الكربون والهيدروجين والأكسجين، وتزود الكربوهيدرات الخلايا بالطاقة.\nوالدهون مركب مكون من الكربون والهيدروجين والأكسجين، وتختزن الدهون وتحرر طاقة أكبر من الكربوهيدرات؛ وذلك بسبب تركيبها.\nوالبروتينات مركبات مكونة من الكربون والهيدروجين والأكسجين والنيتروجين، وهي ضرورية لنمو الخلايا وتجديدها.\nوالأحماض النووية مركبات مكونة من الأكسجين والكربون والهيدروجين والنيتروجين والفوسفور، وهي تساعد الخلايا على بناء بروتيناتها. وهذه المركبات مجتمعة تساعد الخلايا على القيام بوظائفها الحيوية.\nصورة مجهرية للدهون في خلايا دهنية لدى الإنسان.", "simple": "في كل الخلايا مركّبات مهمة. الكربوهيدرات والدهون للطاقة. البروتينات للنمو والتجديد. والأحماض النووية تساعد على بناء البروتينات. وأكبر جزء من خلية الإنسان ماء.", "steps": [{"q": "ماذا أرى؟", "t": "أرى رسمًا دائريًا لمكونات خلايا الإنسان بالنسب المئوية.", "fig": "f28b", "parts": [], "a": "vd52d8a85ee1f"}, {"q": "ما الأجزاء؟", "t": "الماء ٧٠٪، البروتينات ١٥٪، الدهون ١٠٪، الأحماض النووية ٤٪، الكربوهيدرات ١٪.", "fig": "f28b", "parts": ["p1", "p2", "p3", "p4", "p5"], "a": "v3e8cbcd66cdc"}, {"q": "ماذا يفعل؟", "t": "الكربوهيدرات تزوّد الخلايا بالطاقة. والدهون تختزن وتحرر طاقة أكبر منها بسبب تركيبها.", "a": "v93bd46d303cb"}, {"q": "ماذا يفعل؟", "t": "البروتينات ضرورية لنمو الخلايا وتجديدها. والأحماض النووية تساعد الخلايا على بناء بروتيناتها.", "a": "v746a2f9b7ad8"}, {"q": "كيف يرتبط بغيره؟", "t": "كلها من الكربون والهيدروجين والأكسجين. وتزيد البروتينات النيتروجين، وتزيد الأحماض النووية النيتروجين والفوسفور.", "a": "vc1b27de3c9b8"}, {"q": "الفكرة المهمة", "t": "هذه المركبات مجتمعة تساعد الخلايا على القيام بوظائفها الحيوية.", "a": "vc344d8f8260e"}], "figs": ["f28b", "f28a"], "key": "الكربوهيدرات والدهون والبروتينات والأحماض النووية مركّبات تساعد الخلايا على القيام بوظائفها الحيوية.", "sa": "vee3738371ede"}, {"id": "L01-s9", "page": 29, "title": "ملخص مصور", "book": "تنص نظرية الخلية على أن جميع المخلوقات الحية مكونة من خلايا، وأن الخلايا هي الوحدات الأساسية في البناء والوظيفة في المخلوقات الحية.\nمستويات التنظيم الخمسة في المخلوقات الحية هي الخلايا والأنسجة والأعضاء والأجهزة والمخلوقات الحية.\nالعناصر مواد نقية يمكن أن تتحد معًا لتكون المركبات. ويوجد العديد منها في الخلايا.", "simple": "ثلاث أفكار تلخّص الدرس كله: نظرية الخلية، ومستويات التنظيم الخمسة، والعناصر والمركبات في الخلايا. أحسنت، وصلت إلى آخر الدرس بجهدك.", "steps": [{"q": "ماذا أرى؟", "t": "ثلاث صور، كل صورة بجانب فكرة من الملخص.", "fig": "f29a", "parts": [], "a": "v940ee214d029"}, {"q": "الفكرة المهمة", "t": "المخلوقات الحية من خلايا، والخلايا هي الوحدات الأساسية في البناء والوظيفة.", "a":
