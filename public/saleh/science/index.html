<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مراجعة العلوم · صالح</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: sticky top bar; views (home / lesson) swap inside <main>. Every book item carries a page badge. */
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2a37; --muted:#5b6574; --line:#e3dccd;
  --brand:#2d7a4b; --brand-2:#1e5a8a; --accent:#e08a1e; --ok:#1f8a4c; --bad:#c2412d; --book:#fff6dc; --book-line:#e6c97a;
  --hl:#ffd23f; --shadow:0 2px 10px rgba(40,30,10,.08);
  --f:'SalehBaloo','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:18px;line-height:1.75;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;touch-action:manipulation}
img{max-width:100%}
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:8px 14px calc(8px);display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.top h1{font-size:1.05rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:12px;min-width:44px;min-height:44px;padding:0 10px;font-size:1rem}
.prog{height:8px;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden;width:90px}
.prog i{display:block;height:100%;background:var(--hl);width:0;transition:width .4s}
main{max-width:900px;margin:0 auto;padding:14px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}
.hero{text-align:center;padding:18px 16px}
.hero h2{margin:0;font-size:1.45rem;color:var(--brand)}
.hero p{margin:4px 0 0;color:var(--muted)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.mode{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px;text-align:center;min-height:96px}
.mode b{display:block;font-size:1.15rem}
.mode small{color:var(--muted);font-size:.85rem;line-height:1.5;display:block}
.mode.on{border-color:var(--brand);background:#eaf6ee}
.big{display:block;width:100%;border:0;border-radius:16px;background:var(--accent);color:#fff;font-size:1.15rem;padding:12px;margin-top:12px;min-height:54px}
.unit{margin-top:18px}
.unit>h3{margin:0 0 4px;font-size:1.15rem;color:var(--brand-2)}
.chap{font-size:1rem;color:var(--muted);margin:10px 0 4px;font-weight:600}
.lsn{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0;min-height:56px}
.lsn .n{flex:1}
.lsn .n small{display:block;color:var(--muted);font-size:.82rem}
.ring{width:44px;height:44px;flex:none}
.pg{display:inline-block;background:var(--book);border:1px solid var(--book-line);color:#7a5a12;border-radius:10px;padding:0 8px;font-size:.82rem;white-space:nowrap}
.tabs{display:flex;gap:8px;position:sticky;top:60px;z-index:10;background:var(--bg);padding:6px 0}
.tabs button{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;min-height:48px;font-size:1rem}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sec h3{margin:0 0 6px;font-size:1.15rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.book{background:var(--book);border:1.5px dashed var(--book-line);border-radius:14px;padding:8px 12px;margin:8px 0;font-size:.95rem}
.book>summary{cursor:pointer;color:#7a5a12;font-weight:600;min-height:40px;display:flex;align-items:center}
.book p{margin:6px 0}
.ours{border-right:5px solid var(--brand-2);padding:4px 12px;margin:8px 0;background:#f1f6fb;border-radius:10px}
.ours .lbl,.book .lbl{font-size:.78rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.btn{border:2px solid var(--line);background:#fff;border-radius:12px;min-height:46px;padding:4px 12px;font-size:.95rem;color:var(--ink)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.b{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.btn.on{outline:3px solid var(--hl)}
.btn:disabled{opacity:.45}
.steps{list-style:none;margin:6px 0;padding:0}
.steps li{padding:6px 10px;border-radius:10px;margin:4px 0;opacity:.45;transition:opacity .3s,background .3s}
.steps li.on{opacity:1;background:#fff7d6}
.steps li.done{opacity:1}
.steps li b.q{color:var(--brand-2)}
/* figure viewer */
.fig{border:1px solid var(--line);border-radius:16px;background:#fff;padding:8px;margin:10px 0}
.fig .ft{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-size:.95rem}
.fig .stage{position:relative;width:100%;touch-action:manipulation}
.fig svg{width:100%;height:auto;display:block;max-height:72vh}
.fig .cap{font-size:.85rem;color:var(--muted);margin:4px 0}
.part{cursor:pointer}
.part.hi .pimg{filter:drop-shadow(0 0 6px var(--hl)) drop-shadow(0 0 2px #000)}
.part .hit{fill:transparent;stroke:transparent;stroke-width:3}
.part.hi .hit{stroke:var(--hl);stroke-width:4}
.base.dim{opacity:.22}
.nm{font-family:var(--f);font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:5px;fill:#123;pointer-events:none}
.ld{stroke:#555;stroke-width:1.6;stroke-dasharray:5 4;fill:none}
.info{background:#fffbea;border:2px solid var(--hl);border-radius:14px;padding:8px 12px;margin-top:8px;font-size:.95rem}
.info h4{margin:0;font-size:1.05rem}
.note{font-size:.8rem;color:var(--muted)}
/* questions */
.q .qt{font-size:1.05rem;margin:4px 0 8px}
.opt{display:block;width:100%;text-align:right;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;margin:6px 0;min-height:50px;font-size:1rem}
.opt.sel{border-color:var(--brand-2);background:#eef5fc}
.opt.ok{border-color:var(--ok);background:#e6f6ec}
.opt.no{border-color:var(--bad);background:#fbebe8}
.fb{border-radius:14px;padding:8px 12px;margin:8px 0}
.fb.ok{background:#e6f6ec;border:1.5px solid var(--ok)}
.fb.no{background:#fbebe8;border:1.5px solid var(--bad)}
.fb.info2{background:#f1f6fb;border:1.5px solid var(--brand-2)}
textarea{width:100%;min-height:84px;border:2px solid var(--line);border-radius:12px;padding:8px;font:inherit;font-size:1rem}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt button{min-height:50px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:6px;font-size:.95rem}
.mt button.sel{border-color:var(--brand-2);background:#eef5fc}
.mt button.done{border-color:var(--ok);background:#e6f6ec}
.chk label{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.chk input{width:22px;height:22px;margin-top:6px;flex:none}
.tag{font-size:.78rem;background:#eef0f3;border-radius:8px;padding:0 6px;color:var(--muted)}
.oos{background:#fdf0e6;border:1px solid #f0c59c;border-radius:10px;padding:4px 10px;font-size:.85rem}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,20,.75);z-index:50;display:none;align-items:center;justify-content:center;padding:10px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;max-width:900px;width:100%;max-height:94vh;overflow:auto;padding:10px}
.modal .box img{width:100%;height:auto;display:block}
.set label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;min-height:44px}
.set select,.set input{font:inherit;min-height:40px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2a37;color:#fff;padding:8px 16px;border-radius:14px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.audio{display:inline-flex;gap:6px}
.audio button{min-width:46px;min-height:46px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:1.1rem}
.audio button.on{background:var(--hl)}
@media (max-width:560px){html,body{font-size:17px}.modes{grid-template-columns:1fr}.tabs{top:58px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <button id="home" aria-label="الرئيسية">🏠</button>
  <h1 id="ttl">مراجعة العلوم</h1>
  <div class="prog" title="التقدم"><i id="pbar"></i></div>
  <button id="mute" aria-label="كتم الصوت">🔊</button>
  <button id="setb" aria-label="الإعدادات">⚙️</button>
</header>
<main id="m"></main>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
const D = {"title": "مراجعة العلوم التفاعلية", "sub": "العلوم · الصف السادس الابتدائي · الفصل الدراسي الأول · الوحدة الأولى: تنوّع الحياة", "scope": "صفحات الكتاب ٢٤–٧٤ (تحديد الأستاذ) · الشرح والرسومات والأسئلة كلها من كتاب الطالب", "credit": "الرسومات والنصوص من كتاب العلوم للصف السادس (وزارة التعليم ١٤٤٨هـ). الشرح المبسّط والإجابات المقترحة من إعدادنا اعتمادًا على الكتاب. الصوت: صوت عربي آلي (Microsoft Hamed).", "lessons": [{"id": "L01", "unit": "الوحدة الأولى: تنوّع الحياة", "chapter": "الفصل الأول: الخلايا", "name": "الدرس الأول: نظرية الخلية", "pages": [24, 29], "note": "الدرس يبدأ في الكتاب من صفحة ٢٢ (أنظر وأتساءل، ونشاط أستكشف «كيف تبدو الخلايا؟» ص٢٣)، وتحديد الأستاذ يبدأ من ٢٤.", "sections": [{"id": "L01-s1", "page": 24, "title": "كيف اكتشفت الخلايا؟", "book": "تتكون المخلوقات الحية جميعها من خلية أو أكثر. والخلية هي الوحدة الأساسية للمخلوق الحي، وهي أصغر جزء فيه قادر على الحياة. ومعظم الخلايا لا يمكن مشاهدتها بالعين المجردة. لذلك كان اختراع المجهر بداية الطريق لتعرف الخلايا.\nوقد كان العالم الإنجليزي روبرت هوك أول من شاهد الخلية، وهو أول من أطلق عليها اسم الخلية. وفي عام ١٦٦٥م قام بصنع مجهر، واستخدمه لفحص شريحة رقيقة من الفلين، فاستطاع أن يشاهد جدران نسيج الفلين، ووصفها بأنها صناديق صغيرة متراصة تشبه خلايا النحل.\nوجاء بعد روبرت هوك بوقت قصير تاجر هولندي يدعى ليفنهوك، كان أول من استطاع أن يشاهد مخلوقات حية وحيدة الخلية بمجهر قام بصنعه. وكانت قوة تكبيره أكبر تسع مرات من قوة تكبير مجهر روبرت هوك.", "simple": "كل مخلوق حي مبني من خلية أو أكثر. معظم الخلايا صغيرة جدًا لا تراها العين. لذلك احتجنا إلى المجهر لنراها. الخلية هي الوحدة الأساسية للمخلوق الحي.", "steps": [{"q": "ماذا أرى؟", "t": "أرى مجهرًا قديمًا، ودائرتين مكبّرتين تُظهران خلايا الفلين.", "fig": "f24a", "parts": [], "a": "va40af743fb0d"}, {"q": "ما الأجزاء؟", "t": "على اليسار مجهر يشبه مجهر روبرت هوك. وعلى اليمين خلايا الفلين تحت المجهر الإلكتروني الماسح.", "fig": "f24a", "parts": ["p1", "p2"], "a": "va4cc33e9c06f"}, {"q": "ما اسم كل جزء؟", "t": "الخلية: الوحدة الأساسية للمخلوق الحي، وأصغر جزء فيه قادر على الحياة.", "a": "v128c833e5d0a"}, {"q": "ماذا يفعل؟", "t": "صنع روبرت هوك مجهرًا عام ١٦٦٥م، وفحص به شريحة رقيقة من الفلين. رأى صناديق صغيرة متراصّة تشبه خلايا النحل.", "a": "v2a3a51438b47"}, {"q": "كيف يرتبط بغيره؟", "t": "بعده جاء ليفنهوك بمجهر أقوى تسع مرات. فشاهد أول مرة مخلوقات حية وحيدة الخلية.", "a": "v49a21d8b6737"}, {"q": "الفكرة المهمة", "t": "روبرت هوك أول من شاهد الخلية وسمّاها. واختراع المجهر كان بداية طريق معرفة الخلايا.", "a": "v747c010421d0"}], "figs": ["f24a"], "key": "الخلية هي الوحدة الأساسية للمخلوق الحي، واكتُشفت بفضل المجهر.", "sa": "vecb8e20f7802"}, {"id": "L01-s2", "page": 25, "title": "تطور نظرية الخلية", "book": "لاحظ ليفنهوك العديد من المخلوقات الحية بمجهره، وكان يرسم كل اكتشاف جديد يراه بالمجهر. وأظهرت بعض رسوماته تفاصيل دقيقة للبكتيريا والخميرة وخلايا الدم. وقد ازداد فهمنا لتركيب الخلية عبر السنين مع تقدم صناعة المجاهر وتحسينها.\nوفي عام ١٨٣١م اكتشف العالم الإسكتلندي روبرت براون نواة الخلية النباتية. كذلك اهتم العالم الألماني شلايدن بدراسة خلايا النباتات تحت المجهر. وفي عام ١٨٣٨م استنتج شلايدن أن جميع النباتات تتكون من خلايا. وبعد سنة اكتشف ثيودور شفان أن جميع الحيوانات تتكون من خلايا أيضًا. وقام العالمان براون وشفان معًا بوضع نظرية الخلية، مستعينين بأعمال هوك وليفنهوك.\nتتضمن نظرية الخلية ثلاث أفكار رئيسة:\n• جميع المخلوقات الحية تتكون من خلية أو أكثر.\n• الخلايا هي الوحدة الأساسية للتركيب والوظيفة في المخلوقات الحية جميعها.\n• تنتج الخلايا عن خلايا موجودة.", "simple": "تعاون علماء كثيرون عبر السنين لفهم الخلية. كل عالم أضاف اكتشافًا جديدًا. ومع تحسّن المجاهر زاد فهمنا. فوُضعت نظرية الخلية بثلاث أفكار رئيسة.", "steps": [{"q": "ماذا أرى؟", "t": "ليفنهوك رسم ما رآه بمجهره: تفاصيل دقيقة للبكتيريا والخميرة وخلايا الدم.", "a": "v72cfb5047534"}, {"q": "ما الأجزاء؟", "t": "١٨٣١م: روبرت براون اكتشف نواة الخلية النباتية.", "a": "v434c0a1c9a22"}, {"q": "ما اسم كل جزء؟", "t": "١٨٣٨م: شلايدن استنتج أن جميع النباتات تتكون من خلايا. وبعد سنة اكتشف شفان أن جميع الحيوانات تتكون من خلايا أيضًا.", "a": "vee11e93ae4d8"}, {"q": "كيف يرتبط بغيره؟", "t": "وضع براون وشفان معًا نظرية الخلية، مستعينين بأعمال هوك وليفنهوك. كل اكتشاف بُني على ما قبله.", "a": "ve0c5129cf02f"}, {"q": "الفكرة المهمة", "t": "نظرية الخلية: كل المخلوقات الحية من خلية أو أكثر. الخلايا وحدة التركيب والوظيفة. الخلايا تنتج عن خلايا موجودة.", "a": "v029bcc090d09"}], "figs": [], "key": "نظرية الخلية: المخلوقات الحية من خلايا، والخلية وحدة التركيب والوظيفة، والخلايا تنتج عن خلايا موجودة.", "sa": "v5fd49342b65c"}, {"id": "L01-s3", "page": 25, "title": "الخلايا والمخلوقات الحية", "book": "المخلوقات الحية جميعها تتكون من خلايا. وبعض المخلوقات الحية تتكون أجسامها من خلية واحدة وتسمى مخلوقات وحيدة الخلية. فالبكتيريا والبراميسيوم واليوجلينا جميعها مخلوقات وحيدة الخلية.\nأما المخلوقات العديدة الخلايا فتتكون أجسامها من أكثر من خلية، وقد يحتوي بعضها على بلايين الخلايا التي تقوم بوظائف متخصصة، وجسم الإنسان أيضًا مكون من خلايا مختلفة، تكون الجلد والأعصاب والدم والعضلات.\nقد تحتوي مستعمرة الفولفكس على أكثر من ٥٠٠ خلية، ولكل خلية سوط، وتتحرك الأسواط باتساق لدفع المستعمرة في الماء.\nالبراميسيوم مخلوق وحيد الخلية يعيش في الماء.", "simple": "بعض المخلوقات جسمها خلية واحدة فقط. وبعضها جسمها من خلايا كثيرة جدًا. الأولى اسمها: مخلوقات وحيدة الخلية. والثانية: مخلوقات عديدة الخلايا.", "steps": [{"q": "ماذا أرى؟", "t": "أرى البراميسيوم: مخلوق وحيد الخلية يعيش في الماء.", "fig": "f25b", "parts": [], "a": "vb2a1570b9255"}, {"q": "ما الأجزاء؟", "t": "وأرى مستعمرة الفولفكس: قد تحتوي على أكثر من ٥٠٠ خلية، ولكل خلية سوط.", "fig": "f25a", "parts": [], "a": "va9b35b5fdd12"}, {"q": "ما اسم كل جزء؟", "t": "البكتيريا والبراميسيوم واليوجلينا: مخلوقات وحيدة الخلية.", "a": "v8294278940e0"}, {"q": "ماذا يفعل؟", "t": "في المخلوقات العديدة الخلايا تقوم الخلايا بوظائف متخصصة. وقد يحتوي بعضها على بلايين الخلايا.", "a": "v816c9f16fafa"}, {"q": "الفكرة المهمة", "t": "جسمك أيضًا من خلايا مختلفة، تكوّن الجلد والأعصاب والدم والعضلات.", "a": "v1ddb1328bbc3"}], "figs": ["f25a", "f25b"], "key": "المخلوقات الحية إما وحيدة الخلية مثل البراميسيوم، أو عديدة الخلايا مثل الإنسان.", "sa": "v26f8ac83795f"}, {"id": "L01-s4", "page": 26, "title": "ما مستويات التنظيم في المخلوقات الحية؟", "book": "تشبه الخلايا إلى حد ما لبنات البناء، وتسمح مجموعة الخلايا معًا للمخلوق الحي بأداء جميع الوظائف الحيوية.\nيتكون المخلوق الحي الوحيد الخلية من خلية واحدة تقوم بجميع الأنشطة الضرورية للبقاء على قيد الحياة والتكاثر. أما في المخلوقات المتعددة الخلايا فتقوم كل خلية بوظيفة خاصة. وتقوم مجموعة الخلايا المتشابهة معًا بالوظيفة نفسها، وتشكل نسيجًا.\nتتكون أجسام الحيوانات غالبًا من أربعة أنواع رئيسة من الأنسجة، هي: النسيج العضلي، الذي يتكون من ألياف تحرك العظام وتضخ الدم وتحرك المواد في الجهاز الهضمي. والنسيج الضام ومنه العظام والغضاريف والدهون والدم. والنسيج العصبي الذي ينقل رسائل في الجسم. وأخيرًا النسيج الطلائي الذي يغطي أجزاء الجسم الداخلية، وطبقة الجلد الخارجية، والطبقة التي تبطن باطن الخد والجهاز الهضمي.", "simple": "الخلايا مثل لبنات البناء. الخلايا المتشابهة تجتمع وتقوم بالوظيفة نفسها. هذه المجموعة اسمها: النسيج. وللحيوانات أربعة أنواع رئيسة من الأنسجة.", "steps": [{"q": "ماذا أرى؟", "t": "أرى أربع صور مجهرية، كل صورة لنوع من الأنسجة.", "fig": "f26a", "parts": [], "a": "vab681d00b171"}, {"q": "ما الأجزاء؟", "t": "الأنواع الأربعة: نسيج عضلي، ونسيج ضام، ونسيج عصبي، ونسيج طلائي.", "fig": "f26a", "parts": ["p1", "p2", "p3", "p4"], "a": "vb04744cf3a74"}, {"q": "ما اسم كل جزء؟", "t": "النسيج: مجموعة خلايا متشابهة تقوم معًا بالوظيفة نفسها.", "a": "v74c770496971"}, {"q": "ماذا يفعل؟", "t": "العضلي يحرك العظام ويضخ الدم. العصبي ينقل الرسائل. الطلائي يغطي ويبطّن. والضام منه العظام والدم والدهون.", "a": "v5cca8a842ddb"}, {"q": "كيف يرتبط بغيره؟", "t": "الوحيد الخلية: خليته تقوم بكل الأنشطة. أما في المتعدد الخلايا فلكل خلية وظيفة خاصة.", "a": "v2421c5c782b4"}, {"q": "الفكرة المهمة", "t": "خلايا متشابهة لها الوظيفة نفسها تشكّل نسيجًا.", "a": "vc18b8d08e5be"}], "figs": ["f26a"], "key": "مجموعة الخلايا المتشابهة التي تقوم بالوظيفة نفسها تشكّل نسيجًا.", "sa": "vf259e584b743"}, {"id": "L01-s5", "page": 26, "title": "الأعضاء والأجهزة الحيوية", "book": "تنتظم الأنسجة في أجسام المخلوقات الحية لتشكل الأعضاء.\nالعضو مجموعة من نسيجين مختلفين أو أكثر، تعمل معًا للقيام بوظيفة محددة. والجلد أكبر عضو في جسم الإنسان، والقلب عضو آخر يعتمد في وظيفته على نسيج عضلي ونسيج عصبي ونسيج ضام. ومن الأمثلة الأخرى على الأعضاء في الحيوانات الدماغ والعين والرئة.\nوللنباتات أيضًا أعضاء؛ ويقوم كل منها بوظائف حيوية مختلفة. ومن هذه الأعضاء الجذر، ومن وظائفه امتصاص الماء والأملاح المعدنية من التربة، والساق الذي من وظائفه دعم النبات وحمل الأوراق والأزهار، والورقة أيضًا عضو، ومن وظائفها القيام بعملية البناء الضوئي، أما الزهرة فهي عضو التكاثر الجنسي في بعض أنواع النباتات.\nتشكل مجموعة الأعضاء التي تعمل معًا لأداء وظائف محددة جهازًا حيويًا. ويتكون جسم المخلوق الحي المتعدد الخلايا غالبًا من مجموعة من الأجهزة الحيوية تقوم بأداء الوظائف الأساسية للحياة. فجهاز الدوران مثلًا في جسم الإنسان يتكون من القلب والأوعية الدموية والدم، ويقوم بوظيفة نقل الأكسجين والمواد الغذائية إلى الخلايا، والتخلص من الفضلات. ويعتمد جسم الإنسان على الرئتين وبقية أعضاء الجهاز التنفسي للحصول على الأكسجين بشكل كاف.", "simple": "الأنسجة المختلفة تعمل معًا فتصنع عضوًا، مثل القلب. والأعضاء تعمل معًا فتصنع جهازًا حيويًا، مثل جهاز الدوران. هكذا يُبنى الجسم خطوة خطوة.", "steps": [{"q": "ماذا أرى؟", "t": "أرى القلب بين الرئتين، وفوقه الأوعية الدموية.", "fig": "f27a", "parts": [], "a": "v90620c427d8b"}, {"q": "ما الأجزاء؟", "t": "الأجزاء المسمّاة: القلب، والأوعية الدموية، والرئتان.", "fig": "f27a", "parts": ["p1", "p2", "p3"], "a": "v15708a4a6f6a"}, {"q": "ما اسم كل جزء؟", "t": "العضو: نسيجان مختلفان أو أكثر يعملان معًا لوظيفة محددة. والجهاز الحيوي: أعضاء تعمل معًا لوظائف محددة.", "a": "v0cf7a4f18b28"}, {"q": "ماذا يفعل؟", "t": "جهاز الدوران (القلب والأوعية الدموية والدم) ينقل الأكسجين والغذاء إلى الخلايا، ويتخلص من الفضلات.", "a": "vdc6d919a604d"}, {"q": "كيف يرتبط بغيره؟", "t": "القلب يعتمد على نسيج عضلي وعصبي وضام. والجسم يعتمد على الرئتين للحصول على الأكسجين.", "a": "v3e7a4709eca0"}, {"q": "الفكرة المهمة", "t": "للنبات أعضاء أيضًا: الجذر يمتص الماء، والساق يدعم، والورقة تقوم بالبناء الضوئي، والزهرة للتكاثر.", "a": "v06432a1a21be"}], "figs": ["f27a"], "key": "الأنسجة تكوّن الأعضاء، والأعضاء تعمل معًا فتكوّن الأجهزة الحيوية.", "sa": "ve3c184428f0a"}, {"id": "L01-s6", "page": 27, "title": "نشاط: المقارنة بين الخلايا في نسيج حيواني", "book": "١ الخلايا التي تكون أنواعًا مختلفة من الأنسجة في المخلوقات الحية المتعددة الخلايا تؤدي وظائف محددة. أحصل من معلمي على شريحة جاهزة لكل من الأنسجة التالية: الطلائي، والعصبي، والضام، والعضلي، وأطوي طوليًا ورقة قياسها ٢٩×٢١سم، ثم أطويها عرضيًا لتشكل أربعة مستطيلات أستخدمها في تدوين ملاحظاتي.\n٢ ألاحظ. أحصل على شريحة لنوع من الأنسجة، وأكتب اسمها في أول مستطيل في الورقة. أستعمل المجهر لفحصها، وأرسم في المستطيل ما شاهدته، وأكتب أي ملاحظات عن خلايا النسيج أثارت اهتمامي. أكرر ما قمت به مع الشرائح الثلاث المتبقية، مع ملاحظة استخدام مستطيل واحد لكل نوع من خلايا الأنسجة.\n٣ أقارن. أراجع رسومي الأربعة. ما بعض خصائص كل نوع من الخلايا؟ هل أستطيع تحديد كل نوع من الخلايا؟ أكتب ملاحظات إضافية على الرسم، مع أسماء الأجزاء التي أستطيع تحديدها.\n٤ أستنتج. لماذا يتخصص الأطباء في الأمراض التي تصيب نوعًا من الأعضاء أو الأنسجة؟", "simple": "في هذا النشاط تفحص أربعة أنسجة بالمجهر. ترسم كل نسيج في مستطيل خاص. ثم تقارن بين رسومك لترى كيف تختلف الخلايا.", "steps": [{"q": "ماذا أرى؟", "t": "الهدف: مقارنة خلايا أربعة أنسجة حيوانية تحت المجهر.", "a": "vd856536d505b"}, {"q": "ما الأجزاء؟", "t": "تحتاج شرائح جاهزة للأنسجة: الطلائي والعصبي والضام والعضلي، وورقة مطويّة إلى أربعة مستطيلات.", "a": "vec39f6f153c8"}, {"q": "ماذا يفعل؟", "t": "ألاحظ: تفحص كل شريحة بالمجهر، وترسمها في مستطيلها، وتكتب ملاحظاتك.", "a": "vdc615aeb1fec"}, {"q": "كيف يرتبط بغيره؟", "t": "أقارن ثم أستنتج: تراجع رسومك الأربعة، وتفكّر لماذا يتخصص الأطباء.", "a": "v43fde63af789"}, {"q": "الفكرة المهمة", "t": "خلايا كل نسيج تؤدي وظائف محددة، لذلك يختلف شكلها.", "a": "v3b28e8f2a5cc"}], "figs": [], "key": "خلايا الأنسجة المختلفة تؤدي وظائف محددة، ويمكن مقارنتها بالمجهر.", "sa": "v8bc87e765e7c"}, {"id": "L01-s7", "page": 28, "title": "ما المواد الموجودة في جميع المخلوقات الحية؟", "book": "جميع الأشياء من حولنا تتكون من جسيمات دقيقة تسمى الذرات. وهناك أكثر من ١٠٠ نوع من الذرات، ولكل نوع خصائصه التي تميزه. والعنصر مادة نقية لا يمكن تجزئتها إلى مواد أبسط منها. ويتكون العنصر الواحد من نوع واحد من الذرات لها التركيب نفسه. ويمكن للعناصر أن تتحد لتكون المركبات. والمركب مادة تتكون باتحاد كيميائي بين عنصرين أو أكثر.", "simple": "كل الأشياء مبنية من جسيمات دقيقة اسمها الذرات. العنصر من نوع واحد من الذرات. والعناصر تتحد فتصنع المركّبات.", "steps": [{"q": "ما الأجزاء؟", "t": "الذرات: جسيمات دقيقة تتكون منها جميع الأشياء. وهناك أكثر من ١٠٠ نوع منها.", "a": "v357c4a762ae8"}, {"q": "ما اسم كل جزء؟", "t": "العنصر: مادة نقية لا يمكن تجزئتها إلى مواد أبسط منها.", "a": "v3514754aa8bd"}, {"q": "ماذا يفعل؟", "t": "العنصر الواحد يتكون من نوع واحد من الذرات لها التركيب نفسه.", "a": "vb676e1055260"}, {"q": "كيف يرتبط بغيره؟", "t": "المركّب: مادة تتكون باتحاد كيميائي بين عنصرين أو أكثر.", "a": "ve6359ba5690d"}, {"q": "الفكرة المهمة", "t": "ذرات ← عناصر ← مركّبات: كل مستوى مبني من الذي قبله.", "a": "v702a2424848e"}], "figs": [], "key": "العنصر مادة نقية من نوع واحد من الذرات، والمركّب اتحاد كيميائي بين عنصرين أو أكثر.", "sa": "v18db44b1cc66"}, {"id": "L01-s8", "page": 28, "title": "العناصر والمركبات الموجودة في الخلايا", "book": "هناك العديد من المركبات التي توجد في الخلايا كلها. منها الكربوهيدرات وهي مركبات مكونة من الكربون والهيدروجين والأكسجين، وتزود الكربوهيدرات الخلايا بالطاقة.\nوالدهون مركب مكون من الكربون والهيدروجين والأكسجين، وتختزن الدهون وتحرر طاقة أكبر من الكربوهيدرات؛ وذلك بسبب تركيبها.\nوالبروتينات مركبات مكونة من الكربون والهيدروجين والأكسجين والنيتروجين، وهي ضرورية لنمو الخلايا وتجديدها.\nوالأحماض النووية مركبات مكونة من الأكسجين والكربون والهيدروجين والنيتروجين والفوسفور، وهي تساعد الخلايا على بناء بروتيناتها. وهذه المركبات مجتمعة تساعد الخلايا على القيام بوظائفها الحيوية.\nصورة مجهرية للدهون في خلايا دهنية لدى الإنسان.", "simple": "في كل الخلايا مركّبات مهمة. الكربوهيدرات والدهون للطاقة. البروتينات للنمو والتجديد. والأحماض النووية تساعد على بناء البروتينات. وأكبر جزء من خلية الإنسان ماء.", " ج الماء من الشريحتين فتنكمشان."], "keys": [{"t": "تنكمش الشريحتان وتصبحان طريتين", "alts": ["تنكمش", "طرية", "الشريحتان", "كلتاهما"]}, {"t": "الماء يتحرك نحو المحلول الأكثر تركيزًا", "alts": ["اكثر تركيزا", "السكر", "يخرج الماء", "تركيز"]}], "back": "L02-s1", "fig": null, "evp": 30, "oos": null, "left": [], "right": [], "items": []}]}, {"id": "L03", "unit": "الوحدة الأولى: تنوّع الحياة", "chapter": "الفصل الأول: الخلايا", "name": "الدرس الثاني: الخلية النباتية والخلية الحيوانية", "pages": [32, 41], "sections": [{"id": "L03-s1", "page": 32, "title": "أنظر وأتساءل", "book": "الخلايا هي الوحدات البنائية الأساسية للحياة. وتقوم الخلايا بوظائف محددة لمساعدة المخلوقات الحية على العيش، مثل هذا الضفدع، أو نبات عدس الماء. كيف يمكن المقارنة بين تركيب الخلية النباتية والخلية الحيوانية؟", "simple": "الخلايا هي الوحدات البنائية الأساسية للحياة. في الصورة ضفدع ونبات عدس الماء. كلاهما مكوّن من خلايا. سنقارن في هذا الدرس بين الخلية النباتية والخلية الحيوانية.", "steps": [{"q": "ماذا أرى؟", "t": "ضفدع (حيوان) بين نباتات عدس الماء (نبات).", "fig": "f32a", "parts": [], "a": "va675eeaa7ad0"}, {"q": "ما الفكرة؟", "t": "الخلايا هي الوحدات البنائية الأساسية للحياة.", "a": "vcda837f43fa3"}, {"q": "ماذا تفعل الخلايا؟", "t": "تقوم بوظائف محددة لتساعد المخلوق الحي على العيش.", "a": "v27465cd2f152"}, {"q": "سؤال الدرس", "t": "كيف نقارن بين تركيب الخلية النباتية والخلية الحيوانية؟", "a": "v13f250f4ded3"}], "figs": ["f32a"], "key": "الخلايا هي الوحدات البنائية الأساسية للحياة، في النبات وفي الحيوان.", "sa": "v47a4be191d02"}, {"id": "L03-s2", "page": 33, "title": "أستكشف: فيم تختلف الخلايا النباتية عن الخلايا الحيوانية؟", "book": "الهدف: الخلايا هي الوحدات البنائية الأساسية في المخلوقات الحية جميعها. كيف أقارن بين الخلايا النباتية والخلايا الحيوانية؟ أفحص خلايا من حيوانات ونباتات، وأحدد أوجه التشابه وأوجه الاختلاف بين النوعين.\nأحتاج إلى: شريحة مجهرية، قطارة، ملقط، ورقة نبات كالإلوديا أو البصل، غطاء شريحة، ماء، مجهر مركب، شريحة محضرة لخلايا، باطن خد الإنسان\nالخطوات\n١ أحضر شريحة رطبة لورقة نبات الإلوديا (نبات مائي)، مأخوذة من قمة النبات، وذلك بوضع قطرة ماء على شريحة زجاجية، ثم أستخدم الملقط لنزع ورقة من نبات الإلوديا، وأضعها فوق قطرة الماء، وأضع فوقها غطاء الشريحة.\n٢ ألاحظ أفحص الورقة باستخدام القوة الصغرى للمجهر مركزًا على أطراف الخلايا، وأدون ملاحظاتي حول خلية واحدة. ثم أستخدم القوة الكبرى للمجهر لأفحص مركز الخلية، وأرسم ما أشاهد. ثم أعيد العدسة الشيئية الصغرى إلى مكانها فوق الشريحة، وأنزع الشريحة عن منضدة المجهر.\n٣ ألاحظ أعيد الخطوة الثانية مستخدمًا شريحة محضرة لخلايا باطن الخد بدلًا من ورقة الإلوديا.\nأستخلص النتائج\n٤ أقارن أصف أوجه التشابه وأوجه الاختلاف بين خلايا الإلوديا وخلايا باطن الخد.\n٥ أفسر البيانات: كيف أفسر بعض أوجه التشابه والاختلاف بين هذه الخلايا؟\nأستكشف أكثر: أفحص شرائح محضرة لعينات خلايا أخرى. هل تتشابه الخلايا الجديدة مع خلايا نبات الإلوديا أو مع خلايا باطن الخد عند الإنسان؟ ولماذا؟", "simple": "نفحص بالمجهر خلايا ورقة نبات الإلوديا. ثم نفحص خلايا باطن الخد عند الإنسان. ونكتب أوجه التشابه وأوجه الاختلاف بينهما.", "steps": [{"q": "ما الهدف؟", "t": "أقارن بين خلايا نبات وخلايا حيوان بالمجهر.", "a": "v661a90ef60ef"}, {"q": "الخطوة ١", "t": "أحضّر شريحة رطبة لورقة الإلوديا: قطرة ماء، ثم الورقة، ثم غطاء الشريحة.", "fig": "f33b", "parts": [], "a": "vc29d9af6a437"}, {"q": "الخطوة ٢", "t": "أفحص الورقة بالقوة الصغرى ثم الكبرى للمجهر، وأرسم ما أشاهد.", "fig": "f33c", "parts": [], "a": "v619af5b818fa"}, {"q": "الخطوة ٣", "t": "أكرّر الفحص مع شريحة محضّرة لخلايا باطن الخد.", "a": "v3c2725a4b3ec"}, {"q": "أستخلص النتائج", "t": "أقارن بين النوعين، وأفسّر سبب التشابه والاختلاف.", "a": "vc92a889eedfd"}], "figs": ["f33b", "f33c"], "key": "نفحص خلايا نباتية وخلايا حيوانية بالمجهر لنكتشف ما يتشابه فيهما وما يختلف.", "sa": "v43160abd1ea1"}, {"id": "L03-s3", "page": 34, "title": "كيف أقارن بين الخلايا النباتية والخلايا الحيوانية؟", "book": "تتكون كلُّ خليةٍ من مجموعةٍ منَ الأجزاءِ تعملُ معًا بوصفِها وحدةً واحدةً. وعلى الرغمِ مِنْ أنَّ الخلايا النباتيةَ والخلايَا الحيوانيةَ لها أجزاءٌ مشتركةٌ إلا أنَّ هناكَ بعضَ الاختلافاتِ بينَهُما. أبحثُ أولًا في الأشياءِ المشتركةِ بينَهُما.\nلكلِّ خليةٍ غشاءٌ بلازميٌّ يحيطُ بها، ويُعطيها شكلَها المميزَ، ويسمحُ بدخولِ الموادِّ وخروجِها منَ الخليةِ. وهذا الغشاءُ البلازميُّ يشبهُ الجدارَ الذي يحيطُ بمصنعٍ ليحميَهُ.\nمعظمُ الخلايا لها نواةٌ تعملُ بوصفِها مركزَ تحكُّمٍ في الخليةِ، حيثُ تنظّمُ التفاعلاتِ الكيميائيةَ فيها، وتخزنُ المعلوماتِ الضروريةَ لانقسامِ الخليةِ. ويَسهلُ رؤيةُ نواةِ الخليةِ باستعمالِ مجهرٍ بسيطٍ؛ لأنَّها كبيرةٌ، ولونُها داكنٌ.\nوتحتوي النواةُ على معظمِ المعلوماتِ الوراثيةِ للخليةِ، التي تحدّدُ كيفَ تقومُ الخليةُ بنَسْخِ نفسِها. ويوجدُ في النواةِ أشرطةٌ طويلةٌ منَ الأحماضِ النوويةِ تُسمّى الكروموسوماتِ، تخزنُ المعلوماتِ اللازمةَ لتنفيذِ كافةِ الأنشطةِ وتحفظُها؛ لنقلِها إلى خلايَا النسلِ الجديدِ.", "simple": "كل خلية أجزاء تعمل معًا كوحدة واحدة. للخلية النباتية والحيوانية أجزاء مشتركة. منها الغشاء البلازمي الذي يحيط بالخلية. ومنها النواة، مركز التحكم، وفيها الكروموسومات.", "steps": [{"q": "ماذا أرى؟", "t": "رسم مقطوع لخلية حيوانية، تظهر أجزاؤها الداخلية.", "fig": "f34a", "parts": [], "a": "v84143bf045fc"}, {"q": "ما الأجزاء؟", "t": "من الخارج الغشاء البلازمي، وفي الوسط النواة، وداخلها الكروموسومات.", "fig": "f34a", "parts": ["p1", "p2", "p3"], "a": "ve8e61aeafa1d"}, {"q": "ماذا يفعل الغشاء البلازمي؟", "t": "يحيط بالخلية، ويعطيها شكلها، ويسمح بدخول المواد وخروجها.", "fig": "f34a", "parts": ["p1"], "a": "vadc515e73bd6"}, {"q": "ماذا تفعل النواة؟", "t": "تتحكّم في الخلية، وتنظّم تفاعلاتها، وتخزن معلومات انقسامها.", "fig": "f34a", "parts": ["p2"], "a": "v3df2d90790ea"}, {"q": "ما الكروموسومات؟", "t": "أشرطة طويلة من الأحماض النووية داخل النواة، تحفظ المعلومات وتنقلها إلى النسل الجديد.", "fig": "f34a", "parts": ["p3"], "a": "vf441c26ee8e4"}, {"q": "الفكرة المهمة", "t": "كل خلية في جسم الببغاء فيها هذه التراكيب.", "fig": "f34b", "parts": [], "a": "vfdd308ef959d"}], "figs": ["f34a", "f34b"], "key": "لكل خلية غشاء بلازمي يحيط بها، ولمعظم الخلايا نواة تعمل مركز تحكّم.", "sa": "v9bb00c4340b0"}, {"id": "L03-s4", "page": 35, "title": "كيف أقارن بين الخلايا النباتية والخلايا الحيوانية؟ (تابع)", "book": "يوجدُ بينَ النواةِ والغشاءِ البلازميِّ مادةٌ تشبهُ الهلامَ تسمَّى السيتوبلازمَ، ويحتوي علَى كميةٍ كبيرةٍ منَ الماءِ. ويوجدُ فيه أيضًا أجزاءُ الخليةِ الداخليةُ والموادُّ الكيميائيةُ، ولكلٍّ منها وظائفُ محددةٌ. ويمتدُّ في السيتوبلازمِ أيضًا نظامُ النقلِ في الخليةِ، حيثُ يقومُ بنقلِ الموادِّ اللازمةِ إليها.\nوالميتوكندريا مصدرُ طاقةِ الخليةِ. وهيَ أجسامٌ على شكلِ عصيٍّ تقومُ بعمليةِ التنفسِ الهوائيِّ، ويتمُّ فيها تحوّلُ الموادِّ الكيميائيةِ في الغذاءِ إلى طاقةٍ تستعملُها الخليةُ. والخلايَا التي تحتاجُ إلى الطاقةِ باستمرارٍ - ومنها خلايَا عضلاتِ القلبِ - تحتوي على ألوفٍ منَ الميتوكندريا.\nأمّا الفجواتُ فهيَ تراكيبُ تشبهُ الكيسَ، تخزنُ الماءَ والغِذاءَ، كما تقومُ بخزنِ بعضِ الفضلاتِ قبلَ أنْ تتخلَّصَ منها. والفجواتُ في الخليةِ النباتيةِ أكبرُ منها في الخليةِ الحيوانيةِ.", "simple": "بين النواة والغشاء يوجد السيتوبلازم، وهو يشبه الهلام. والميتوكندريا مصدر طاقة الخلية. والفجوات أكياس تخزن الماء والغذاء والفضلات.", "steps": [{"q": "ما السيتوبلازم؟", "t": "مادة تشبه الهلام بين النواة والغشاء البلازمي، فيها ماء كثير.", "fig": "f34a", "parts": ["p4"], "a": "vbc4e257a5228"}, {"q": "ماذا يوجد فيه؟", "t": "أجزاء الخلية الداخلية والمواد الكيميائية، ونظام النقل في الخلية.", "a": "v35acc0666607"}, {"q": "ما الميتوكندريا؟", "t": "أجسام على شكل عصي، هي مصدر طاقة الخلية.", "fig": "f34a", "parts": ["p5"], "a": "vdad7de96714b"}, {"q": "ماذا تفعل الميتوكندريا؟", "t": "تقوم بالتنفس الهوائي، فتحوّل الغذاء إلى طاقة. وخلايا عضلات القلب فيها ألوف منها.", "a": "vcffe728053cf"}, {"q": "ما الفجوات؟", "t": "أكياس تخزن الماء والغذاء وبعض الفضلات.", "fig": "f34a", "parts": ["p6"], "a": "vdba84833b8a0"}, {"q": "الفكرة المهمة", "t": "الفجوات في الخلية النباتية أكبر منها في الخلية الحيوانية.", "a": "v27bb4886c7fb"}], "figs": ["f34a"], "key": "السيتوبلازم يملأ الخلية، والميتوكندريا مصدر الطاقة، والفجوات للتخزين.", "sa": "v720e4ef1aaea"}, {"id": "L03-s5", "page": 35, "title": "تركيب الخلية النباتية", "book": "تركيبُ الخليةِ النباتيةِ\nويوجدُ في الخلايا النباتيةِ تراكيبُ وموادُّ كيميائيةٌ لا توجدُ في الخلايا الحيوانيةِ، ومنها: الجدارُ الخلويُّ، والبلاستيداتُ الخضراءُ، والكلوروفيلُ.\nأمّا الجدارُ الخلويُّ فطبقةٌ صلبةٌ تحيطُ بالغشاءِ البلازميِّ. ويدعمُ هذا الجدارُ الخليةَ النباتيةَ، ويعطيها شكلَها، ويحميها منَ الظروفِ البيئيةِ.\nوتوجدُ البلاستيداتُ الخضراءُ في أوراقِ العديدِ منَ النباتاتِ وسيقانِها، وتقومُ بصنعِ الغذاءِ؛ إذْ تمتصُّ طاقةَ الضوءِ عنْ طريقِ صبغةٍ خضراءَ فيها تُسمَّى الكلوروفيلَ، وهذه الصبغةُ هيَ التي تُكسبُ النباتاتِ لونَها الأخضرَ.", "simple": "في الخلية النباتية أجزاء لا توجد في الخلية الحيوانية. منها الجدار الخلوي الصلب الذي يدعمها ويحميها. ومنها البلاستيدات الخضراء التي تصنع الغذاء بصبغة الكلوروفيل.", "steps": [{"q": "ماذا أرى؟", "t": "رسم مقطوع لخلية نباتية على شكل صندوق.", "fig": "f35a", "parts": [], "a": "va0fb9d9c37e3"}, {"q": "ما الأجزاء المشتركة؟", "t": "الغشاء البلازمي، والسيتوبلازم، والنواة، والميتوكندريا، والفجوة.", "fig": "f35a", "parts": ["p2", "p3", "p4", "p8", "p6"], "a": "v369df786b49e"}, {"q": "ما الجدار الخلوي؟", "t": "طبقة صلبة تحيط بالغشاء البلازمي، تدعم الخلية وتعطيها شكلها وتحميها.", "fig": "f35a", "parts": ["p1"], "a": "vb1254970dc79"}, {"q": "ما البلاستيدات الخضراء؟", "t": "تراكيب تصنع الغذاء، وتمتص طاقة الضوء بصبغة الكلوروفيل الخضراء.", "fig": "f35a", "parts": ["p7"], "a": "v077e6b614b46"}, {"q": "كيف يرتبط بغيره؟", "t": "الكلوروفيل هو الذي يُكسب النباتات لونها الأخضر.", "a": "v7d1eb762b2a5"}, {"q": "الفكرة المهمة", "t": "الجدار الخلوي والبلاستيدات الخضراء والكلوروفيل في الخلايا النباتية فقط.", "fig": "f35b", "parts": [], "a": "v67c2bb83054f"}], "figs": ["f35a", "f35b"], "key": "تتميّز الخلية النباتية بالجدار الخلوي والبلاستيدات الخضراء والكلوروفيل.", "sa": "v8806c8adcdb8"}, {"id": "L03-s6", "page": 36, "title": "ما النقل السلبي؟", "book": "يدخلُ المخبزَ كلَّ يومٍ موادُّ مختلفةٌ، حيثُ تُخلَطُ هذهِ الموادُّ وتعجَنُ وتخبَزُ، ثمَّ يغلَّفُ المنتَجُ ويوزَّعُ، ويُتخلَّصُ منَ النفاياتِ.\nهلْ يعملُ جسمِي بطريقةٍ مشابهةٍ؟ تقومُ خلايَا الدمِ باستمرارٍ بتزويدِ خلايَا الجسمِ بالغذاءِ والأكسجينِ وموادَّ أخرَى للقيامِ بنشاطاتِها الحيويةِ، وفي الوقتِ نفسِه يقومُ الدمُ بنقلِ الفضلاتِ الناتجةِ - ومنها ثاني أكسيدِ الكربونِ - بعيدًا عنِ الخليةِ. ومعَ ذلكَ لا يدخلُ الدمُ إلى الخلايا! فكيفَ تنتقلُ الموادُّ التي تحتاجُ إليهَا خلايَا جسمي؟ وكيفَ يتمُّ التخلصُ منَ الفضلاتِ وطرحُها خارجَ الخليةِ؟\nالنقلُ السلبيُّ هو حركةُ الموادِّ عبرَ أغشيةٍ مِنْ دونِ أنْ تستخدمَ طاقةَ الخليةِ. وهناكَ نوعانِ من النقلِ السلبيِّ، اعتمادًا علَى نوعِ المادةِ التي تنتقلُ عبرَ الغشاءِ البلازميِّ، هما: الانتشارُ، والخاصيةُ الأسموزيةُ. وكلاهما ضروريٌّ وأساسيٌّ للخلايا الحيةِ.\nوالانتشارُ عمليةُ انتقالِ الموادِّ - ومنها السكرُ والأكسجينُ وثاني أكسيدِ الكربونِ - عبرَ الغشاءِ البلازميِّ مِنْ منطقةِ التركيزِ المرتفعِ إلى منطقةِ التركيزِ المنخفضِ منْ دونِ الحاجةِ إلى طاقةٍ. وهذهِ العمليةُ تشبهُ وضعَ نقطةِ حبرٍ في كأسٍ فيها ماءٌ؛ إذ تنتشرُ جسيماتُ الحبرِ منَ المناطقِ الأكثرِ تركيزًا إلى المناطقِ الأقلِّ تركيزًا مِنْ دونِ أنْ تحتاجَ إلى طاقةٍ.\nوالخاصيةُ الأسموزيةُ هي انتقالُ جزيئاتِ الماءِ عبرَ الغشاءِ البلازميِّ، وينتقلُ الماءُ مثلَ باقِي الموادِّ منَ المناطقِ التي يكونُ تركيزُهُ فيها أكبرَ إلى المناطقِ التي يكونُ تركيزُه فيها أقلَّ. وبذلك يمكنُ القولُ إن الخاصيةَ الأسموزيةَ عمليةُ انتشارٍ للماءِ فقطْ.", "simple": "الدم يوصل الغذاء والأكسجين، لكنه لا يدخل الخلايا. فالمواد تعبر الغشاء البلازمي. النقل السلبي: حركة المواد عبر الأغشية بلا طاقة من الخلية. ونوعاه: الانتشار والخاصية الأسموزية.", "steps": [{"q": "ما المشكلة؟", "t": "الدم يحمل الغذاء والأكسجين، لكنه لا يدخل إلى الخلايا. فكيف تصل المواد؟", "a": "v27deaa7a52cb"}, {"q": "ما النقل السلبي؟", "t": "حركة المواد عبر الأغشية من دون أن تستخدم طاقة الخلية.", "a": "vc65d815cbbab"}, {"q": "ما الانتشار؟", "t": "انتقال المواد، مثل الأكسجين، من التركيز المرتفع إلى المنخفض، بلا طاقة.", "fig": "f36b", "parts": ["p1", "p2"], "a": "v08b8e403ea35"}, {"q": "ما مثاله؟", "t": "نقطة حبر في كأس ماء تنتشر وحدها في الماء.", "a": "v9f1a5741da06"}, {"q": "ما الخاصية الأسموزية؟", "t": "انتقال جزيئات الماء عبر الغشاء البلازمي؛ أي انتشار للماء فقط.", "fig": "f36a", "parts": [], "a": "v1c385b1fabe5"}, {"q": "الفكرة المهمة", "t": "الانتشار والخاصية الأسموزية كلاهما نقل سلبي، وكلاهما ضروري للخلايا.", "a": "vc05ff767c66b"}], "figs": ["f36b", "f36a"], "key": "النقل السلبي حركة المواد عبر الأغشية بلا طاقة، ونوعاه: الانتشار والخاصية الأسموزية.", "sa": "v8cb9985971c7"}, {"id": "L03-s7", "page": 37, "title": "ما النقل السلبي؟ (تابع): الاتزان", "book": "افترضْ أنَّ ماءً وجليسرولًا قد فُصلَ أحدُهما عنْ الآخرِ بغشاءٍ رقيقٍ فإنَّ جسيماتِ الماءِ تنتقلُ بفعلِ الخاصيةِ الأسموزيةِ إلى الجليسرول، منْ جانبِ الغشاءِ الذي فيه تركيزُ الماءِ مرتفعٌ إلى الجانبِ الآخرِ الذي يكونُ فيه تركيزُ الماءِ منخفضًا. وهذهِ العمليةُ لا تستهلكُ طاقةً.\nوتستمرُّ عمليتا الانتشارِ والخاصيّةِ الأسموزيةِ إلى أنْ يتساوَى تركيزُ الموادِّ على جانبَيِ الغشاءِ، وعندَها تتوقفُ عمليتَا الانتشارِ والخاصيّةِ الأسموزيةِ، ويحدثُ الاتّزانُ.\nويكونُ النباتُ سليمًا إذا كانَ في حالةِ اتزانٍ، وذلكَ عندَما يكونُ دخولُ الماءِ إلى خلايَاهُ وخروجُه منهَا بكمياتٍ متساويةٍ. أمَّا إذَا كانَ خروجُ الماءِ من خلاياه أكثرَ من دخولِهِ إليها فإنَّ أجزاءَ الخليةِ الداخليةَ تنكمشُ، وينكمشُ الغشاءُ البلازميُّ مبتعدًا عنِ الجدارِ الخلويِّ، فيذبلُ النباتُ.", "simple": "الماء ينتقل من الجانب الذي فيه ماء كثير إلى الجانب الذي فيه ماء قليل. ويستمر ذلك حتى يتساوى التركيز، فيحدث الاتزان. والنبات السليم متزن؛ فإن خرج منه ماء أكثر ذبل.", "steps": [{"q": "مثال الكتاب", "t": "ماء وجليسرول بينهما غشاء رقيق: الماء ينتقل إلى جهة الجليسرول.", "a": "ve6fc26df4470"}, {"q": "إلى أين يتحرك الماء؟", "t": "من جهة تركيز الماء المرتفع إلى جهة تركيز الماء المنخفض، بلا طاقة.", "a": "v013830c45a09"}, {"q": "متى يتوقف؟", "t": "عندما يتساوى التركيز على جانبي الغشاء، فيحدث الاتزان.", "a": "v054209093d1d"}, {"q": "النبات السليم", "t": "يدخل الماء إلى خلاياه ويخرج منها بكميات متساوية.", "fig": "f36a", "parts": [], "a": "v3d593ffe5f9e"}, {"q": "النبات الذابل", "t": "يخرج منه ماء أكثر مما يدخل؛ فينكمش الغشاء البلازمي مبتعدًا عن الجدار الخلوي.", "fig": "f37a", "parts": [], "a": "ve3efff5d7a93"}, {"q": "الفكرة المهمة", "t": "الانتشار والخاصية الأسموزية يستمران حتى الاتزان.", "a": "vac2a1c282725"}], "figs": ["f36a", "f37a"], "key": "تستمر حركة المواد حتى يتساوى التركيز على جانبي الغشاء، وعندها يحدث الاتزان.", "sa": "vb6116630341e"}, {"id": "L03-s8", "page": 37, "title": "نشاط: الانتشار والخاصية الأسموزية", "book": "١ أجرّبُ. أملأُ كأسًا بماءٍ دافئٍ، وأضعُ فيهِ كيسَ شاي صغيرًا، وأضيفُ إليهِ ملعقةً منَ الرملِ.\n٢ ألاحظُ. أحرّكُ الكأسَ عدةَ ثوانٍ، ثمَّ أتركُه مِنْ دونِ تحريكٍ مدةَ ١٥ دقيقةً. ما لونُ الماءِ؟ وهلْ توزَّعَ اللونُ في الكأسِ بالتساوي؟\n٣ أدوّنُ البياناتِ. أرفعُ كيسَ الشاي منَ الكأسِ، وأضعُه على منشفةٍ ورقيةٍ. وأنظرُ بدقةٍ إلى الماءِ الذي في الكأسِ. هلْ هناكَ أوراقُ شاي طافيةٌ في الماءِ؟ أفتحُ كيسَ الشاي بالمقصِّ. هلْ يوجدُ رملٌ في الكيسِ؟\n٤ أفسّرُ البياناتِ. ما الذي انتقلَ منْ كيسِ الشاي وإليْهِ؟ كيفَ تعرفُ أنَّ هذا قدْ حدثَ؟\n٥ أستنتجُ. ما الذي حدّدَ حركةَ الجزيئاتِ إلى داخلِ الكيسِ وإلى خارجِه. ماذَا أتوقعُ أنْ يحدثَ للماءِ لو بقيَ كيسُ الشاي داخلَه مدةً طويلةً؟", "simple": "نضع كيس شاي في ماء دافئ ونضيف رملًا. ثم نلاحظ لون الماء، وهل دخل الرمل الكيس. وبذلك نرى ما يعبر الكيس وما لا يعبره.", "steps": [{"q": "الخطوة ١", "t": "أملأ كأسًا بماء دافئ، وأضع فيه كيس شاي، وأضيف ملعقة رمل.", "fig": "f37b", "parts": [], "a": "v33ebc4875030"}, {"q": "الخطوة ٢", "t": "أحرّك الكأس، ثم أتركه ١٥ دقيقة، وألاحظ لون الماء.", "a": "v239e45307021"}, {"q": "الخطوة ٣", "t": "أُخرج الكيس وأفتحه: هل فيه رمل؟ وهل في الماء أوراق شاي؟", "a": "v903afdc4c939"}, {"q": "الخطوتان ٤ و٥", "t": "أفسّر ما انتقل من الكيس وإليه، وأستنتج ما حدّد حركة الجزيئات.", "a": "v04ca3d290fc2"}], "figs": ["f37b"], "key": "كيس الشاي يشبه الغشاء: بعض المواد تعبره وبعضها لا يعبره.", "sa": "v169f8ad5829c"}, {"id": "L03-s9", "page": 38, "title": "ما البناء الضوئي؟ وما التنفس الخلوي؟ — البناء الضوئي", "book": "عندَ إعدادِ الكعكِ تُخلطُ مكوّناتُه - ومنها الدقيقُ ومسحوقُ الخَبْزِ (مسحوقُ الخميرةِ) والسكرُ والبيضُ - معًا. وعندَ وضعِها في الفرنِ تسبِّبُ الحرارةُ حدوثَ تفاعلاتٍ تحوِّلُ هذهِ المكوّناتِ إلى كعكٍ. وبطريقةٍ مشابهةٍ تحدثُ عمليةُ البناءِ الضوئيِّ. وعمليةُ البناءِ الضوئيِّ التي تحدثُ في النباتاتِ وبعضِ المخلوقاتِ الحيةِ الأخرَى تستخدمُ طاقةَ الشمسِ لإنتاجِ غذاءٍ على شكلِ سكرِ الجلوكوز. والموادُّ المتفاعلةُ في هذهِ العمليةِ هي ثاني أكسيدِ الكربونِ والماءُ. أمَّا الموادُّ الناتجةُ عنِ العمليةِ فهيَ سكرُ الجلوكوزِ والأكسجينُ. وتتحكمُ الطاقةُ الشمسيةُ في سيرِ عمليةِ البناءِ الضوئيِّ كلِّها. وتمثّلُ المعادلةُ التاليةُ خلاصةَ التفاعلاتِ الكيميائيةِ لهذهِ العمليةِ بالكلماتِ:\nثاني أكسيد الكربون + ماء ← (ضوء) سكر الجلوكوز + الأكسجين\nوتتمُّ عمليةُ البناءِ الضوئيِّ داخلَ البلاستيداتِ الخضراءِ. وهيَ تراكيبُ مميزةٌ تحتوِي علَى صبغةِ الكلوروفيلِ الخضراءِ، وتقومُ بالتقاطِ الطاقةِ الشمسيةِ التي تُستعمَلُ في عمليةِ البناءِ الضوئيِّ، ويُخزنُ سكرُ الجلوكوزِ الناتجُ عنْ هذهِ العمليةِ داخلَ المخلوقِ الحيِّ، ويُطردُ الأكسجينُ بوصفِه فضلاتٍ ناتجةً عنْ عمليةِ البناءِ الضوئيِّ إلى الغلافِ الجويِّ.", "simple": "البناء الضوئي عملية يصنع بها النبات غذاءه. يستخدم طاقة الشمس، مع ثاني أكسيد الكربون والماء. فينتج سكر الجلوكوز والأكسجين. وتتم داخل البلاستيدات الخضراء.", "steps": [{"q": "ماذا أرى؟", "t": "الشمس فوق أوراق نبات، ثم تكبير لخلية نباتية، ثم لبلاستيدة خضراء.", "fig": "f38a", "parts": [], "a": "v8e16f25ab495"}, {"q": "ما المواد المتفاعلة؟", "t": "ثاني أكسيد الكربون والماء.", "fig": "f38a", "parts": ["p3", "p4"], "a": "v371fd88ab10b"}, {"q": "من أين الطاقة؟", "t": "من الشمس؛ تتحكم طاقتها في سير العملية كلها.", "fig": "f38a", "parts": ["p1"], "a": "v98346526422c"}, {"q": "أين تحدث؟", "t": "داخل البلاستيدات الخضراء التي فيها الكلوروفيل.", "fig": "f38a", "parts": ["p2"], "a": "v68f614db246f"}, {"q": "ما النواتج؟", "t": "سكر الجلوكوز يُخزَّن في النبات، والأكسجين يخرج إلى الغلاف الجوي.", "fig": "f38a", "parts": ["p5", "p6"], "a": "v0d5cdc205bb9"}, {"q": "الفكرة المهمة", "t": "ثاني أكسيد الكربون + ماء ← (ضوء) سكر الجلوكوز + الأكسجين.", "a": "v3298e043ea7d"}], "figs": ["f38a"], "key": "البناء الضوئي يستخدم طاقة الشمس لتحويل ثاني أكسيد الكربون والماء إلى جلوكوز وأكسجين.", "sa": "v156822338b8e"}, {"id": "L03-s10", "page": 39, "title": "التنفس والتخمر", "book": "تستخلصُ النباتاتُ والحيواناتُ الطاقةَ منْ سكرِ الجلوكوزِ بعمليةٍ تُسمَّى التنفسَ الخلويَّ، وخلالَ هذهِ العمليةِ تقومُ الخلايا بتحليلِ السكرِ وإطلاقِ الطاقةِ. ويتطلبُ حدوثُ التنفسِ الخلويِّ في النباتاتِ والحيواناتِ وجودَ الأكسجينِ. لذا يُسمَّى هذا التنفسَ التنفسَ الهوائيَّ. وتستعملُ الخلايا الأكسجينَ لتحليلِ السكرِ لإطلاقِ طاقةٍ يمكنُ استخدامُها للقيامِ بالنشاطاتِ الحيويةِ. ويَنتجُ عنْ هذهِ العمليةِ الماءُ وثاني أكسيدِ الكربونِ بوصفِهما فضلاتٍ، وتَستخدمُ النباتاتُ هذهِ الفضلاتِ مرةً أخرَى في عمليةِ البناءِ الضوئيِّ.\nهناكَ نوعٌ آخرُ منَ التنفسِ الخلويِّ لا يَستعملُ الأكسجينَ، يُسمَّى التنفسَ اللاهوائيَّ. وأكثرُ عملياتِ التنفسِ اللاهوائيِّ شيوعًا هيَ التخمّرُ. وهيَ عمليةٌ مرتبطةٌ معَ إنتاجِ الغذاءِ وحفظِهِ، ومنْ ذلكَ إنتاجُ اللبنِ الرائبِ.\nتحدثُ عمليةُ التنفسِ اللاهوائيُّ في جميعِ الخلايا، عندَما لا تستطيعُ الخليةُ القيامَ بعمليةِ التنفسِ الخلويِّ. ويحدثُ هذا عندَ ممارسةِ التمارينِ الرياضيةِ المجهدةِ. ورغمَ أنَّ الشخصَ يتنفسُ (شهيقًا وزفيرًا) بسرعةٍ في أثناءِ هذهِ التمارينِ إلا أنَّ الأكسجينَ لا يصلُ إلى جميعِ الخلايا. ويتمُّ إطلاقُ الطاقةِ عنْ طريقِ عمليةِ التخمُّرِ. وتُنتجُ عمليةُ التخمُّرِ فضلاتٍ تُسمَّى حمضَ اللاكتيك، الذي يسبِّبُ ارتفاعُ تركيزِه في العضلاتِ الإحساسَ بألمٍ في العضلاتِ أوِ الإعياءِ.", "simple": "التنفس الخلوي: الخلايا تحلّل السكر لتطلق الطاقة، ويحتاج إلى الأكسجين. وينتج عنه الماء وثاني أكسيد الكربون. وعند نقص الأكسجين يحدث التخمّر، فينتج حمض اللاكتيك.", "steps": [{"q": "ما التنفس الخلوي؟", "t": "عملية تستخلص بها النباتات والحيوانات الطاقة من سكر الجلوكوز.", "a": "v53cabb9cdc2b"}, {"q": "لماذا يسمّى هوائيًّا؟", "t": "لأنه يحتاج إلى الأكسجين لتحليل السكر.", "a": "v2eacee7a27f0"}, {"q": "ما نواتجه؟", "t": "الماء وثاني أكسيد الكربون، ويستعملهما النبات مرة أخرى في البناء الضوئي.", "fig": "f39a", "parts": ["p1", "p2", "p3", "p4"], "a": "vc9e3c501375f"}, {"q": "كيف أقارن العمليتين؟", "t": "البناء الضوئي يخزّن الطاقة في الجلوكوز، والتنفس يحرّر الطاقة منه.", "fig": "f39b", "parts": [], "a": "v90a0d1f62d5e"}, {"q": "ما التنفس اللاهوائي؟", "t": "تنفس خلوي بلا أكسجين، وأشهره التخمّر، ومنه إنتاج اللبن الرائب.", "a": "v5f4d6cd04955"}, {"q": "الفكرة المهمة", "t": "في التمارين المجهدة يحدث التخمّر في العضلات، فيتجمع حمض اللاكتيك ويسبّب الألم.", "a": "v5cded0feedfa"}], "figs": ["f39a", "f39b"], "key": "التنفس الخلوي يحرّر الطاقة من الجلوكوز بالأكسجين، والتخمّر يحرّرها بلا أكسجين.", "sa": "v6714dc230c37"}, {"id": "L03-s11", "page": 40, "title": "ما النقل النشط؟", "book": "تشملُ عمليتَا الانتشارِ والخاصيَّةِ الأسموزيةِ نقلَ موادَّ مِنْ منطقةِ تركيزٍ مرتفعٍ إلى منطقةِ تركيزٍ منخفضٍ، ولا يتطلبُ هذا أنْ تَستخدمَ الخليةُ طاقةً. ومعَ ذلكَ هناكَ بعضُ الموادِّ تنتقلُ أحيانًا مِنْ منطقةِ التركيزِ المنخفضِ إلى منطقةِ التركيزِ المرتفعِ. وعندَما يحتاجُ انتقالُ الموادِّ عبرَ الأغشيةِ إلى طاقةٍ يحدثُ نقلٌ نشطٌ. ومنْ ذلكَ حاجةُ الخليةِ إلى الطاقةِ؛ لنقلِ الأملاحِ المعدنيةِ والموادِّ الغذائيةِ إلى داخلِ الخليةِ وخارجِها. فالخليةُ العصبيةُ تحتاجُ إلى النقلِ النشطِ لضخِّ البوتاسيومِ داخلَ الخليةِ، كما أنَّها تحتاجُ إلى النقلِ النشطِ لضخِّ الصوديومِ خارجَها.\nولكنَّ هناكَ بعضَ الموادِّ حجمُها كبيرٌ جدًّا، لذا لا تستطيعُ أنَّ تمرَّ في خلالِ الغشاءِ البلازميِّ للخليةِ عنْ طريقِ النقلِ النشطِ أوِ النقلِ السلبيِّ؛ ولذلكَ تقومُ هذهِ الخلايا بهضمِ الموادِّ الكبيرةِ مثلِ البروتيناتِ والبكتيريا بإحاطتِها بغشاءٍ بلازميٍّ، وتكوينِ جيبٍ حولَها. وتُسمَّى هذه العمليةُ البلعمةَ، كما في طريقةِ ابتلاعِ الأميبا لغذائِها ومخلوقاتٍ حيةٍ أخرَى وحيدةِ الخليةِ كذلكَ.\nحقيقة: يحدثُ النقلُ النشطُ عبرَ أغشيةٍ متلاصقةٍ سليمةٍ.", "simple": "أحيانًا تنتقل المواد من التركيز المنخفض إلى المرتفع. هنا تحتاج الخلية إلى طاقة، وهذا هو النقل النشط. أما المواد الكبيرة جدًّا فتحيطها الخلية بجيب من غشائها، وهذه البلعمة.", "steps": [{"q": "ما الفرق عن النقل السلبي؟", "t": "النقل السلبي من المرتفع إلى المنخفض بلا طاقة.", "a": "vfbb3fa73e295"}, {"q": "ما النقل النشط؟", "t": "انتقال المواد عبر الأغشية عندما يحتاج إلى طاقة.", "a": "v508f81286523"}, {"q": "كيف يحدث في الشكل؟", "t": "الغشاء يحيط بالجزيئات، ثم يكوّن جيبًا، ثم ينقلها إلى الداخل.", "fig": "f40b", "parts": ["p1", "p2", "p3"], "a": "vfcab44a48c8e"}, {"q": "ما مثاله؟", "t": "الخلية العصبية تضخ البوتاسيوم إلى داخلها والصوديوم إلى خارجها.", "a": "v65b0101601bd"}, {"q": "ما البلعمة؟", "t": "إحاطة مادة كبيرة بغشاء بلازمي وتكوين جيب حولها، كما تفعل الأميبا.", "fig": "f40a", "parts": ["p1", "p2"], "a": "v064a9e6090a5"}, {"q": "الفكرة المهمة", "t": "النقل النشط يستهلك طاقة الخلية، ويحدث عبر أغشية متلاصقة سليمة.", "a": "ve1e90f1244f3"}], "figs": ["f40b", "f40a"], "key": "النقل النشط يحتاج إلى طاقة لنقل المواد من التركيز المنخفض إلى المرتفع.", "sa": "vb08f58123723"}, {"id": "L03-s12", "page": 41, "title": "مراجعة الدرس: ملخص مصور", "book": "تتكوَّنُ الخلايَا مِنْ أجزاءٍ عديدةٍ، لكلٍّ منها دورُه ووظيفتُه في النشاطاتِ التي تحافظُ على الحياةِ.\nتنتقلُ الموادُّ منَ الخليةِ وإليها عنْ طريقِ الانتشارِ. وتنتقلُ جزيئاتُ الماءِ عبرَ الأغشيةِ البلازميةِ عنْ طريقِ الخاصيةِ الأسموزيةِ.\nالبناءُ الضوئيُّ عمليةٌ تقومُ فيها النباتاتُ بصنعِ الغذاءِ. والتنفسُ الخلويُّ عمليةٌ تستعملُ فيها الخليةُ الطاقةَ.", "simple": "الخلية أجزاء لكل منها وظيفة. المواد تدخل وتخرج بالانتشار، والماء بالخاصية الأسموزية. النبات يصنع غذاءه بالبناء الضوئي، والخلية تستعمل الطاقة بالتنفس الخلوي.", "steps": [{"q": "الفكرة ١", "t": "الخلية أجزاء كثيرة، لكل جزء دوره في الحفاظ على الحياة.", "fig": "f41a", "parts": ["p1"], "a": "v8f644cabd435"}, {"q": "الفكرة ٢", "t": "المواد تنتقل بالانتشار، والماء ينتقل بالخاصية الأسموزية.", "fig": "f41a", "parts": ["p2"], "a": "vd208488073bc"}, {"q": "الفكرة ٣", "t": "البناء الضوئي يصنع الغذاء، والتنفس الخلوي تستعمل فيه الخلية الطاقة.", "fig": "f41a", "parts": ["p3"], "a": "va9cd7835c13d"}], "figs": ["f41a"], "key": "أجزاء الخلية، وانتقال المواد، والبناء الضوئي والتنفس: هذه أفكار الدرس الثلاث.", "sa": "v11ba0fb61aac"}], "questions": [{"id": "L03-q1", "page": 32, "section": "أنظر وأتساءل", "type": "explain", "text": "كيف يمكن المقارنة بين تركيب الخلية النباتية والخلية الحيوانية؟", "options": [], "answer": null, "answerText": "نفحص الخليتين بالمجهر ونحدّد أجزاءهما. كلتاهما فيها غشاء بلازمي وسيتوبلاز : "٣ أدوّنُ البياناتِ. أرفعُ كيسَ الشاي منَ الكأسِ، وأضعُه على منشفةٍ ورقيةٍ. وأنظرُ بدقةٍ إلى الماءِ الذي في الكأسِ. هلْ هناكَ أوراقُ شاي طافيةٌ في الماءِ؟ أفتحُ كيسَ الشاي بالمقصِّ. هلْ يوجدُ رملٌ في الكيسِ؟", "options": [], "answer": null, "answerText": "لا توجد أوراق شاي طافية في الماء، ولا يوجد رمل في الكيس؛ لأنها لا تعبر الكيس.", "why": {}, "what": "أجب عن سؤالين: هل خرجت أوراق الشاي؟ وهل دخل الرمل؟", "hint": "الكيس يسمح لبعض المواد بالمرور، لا لكلها.", "explain": "أوراق الشاي والرمل لم تعبر الكيس؛ أما الماء ومواد الشاي الملوّنة فعبرته.", "solve": ["أنظر إلى الماء: هل فيه أوراق؟", "أفتح الكيس: هل فيه رمل؟", "أستنتج أن الكيس لا يسمح بمرور كل شيء."], "keys": [{"t": "لا أوراق شاي في الماء", "alts": ["لا توجد اوراق", "لا", "لم تخرج"]}, {"t": "لا رمل في الكيس", "alts": ["لا يوجد رمل", "لم يدخل", "لا"]}], "back": "L03-s8", "fig": "f37b", "evp": 37, "oos": null, "left": [], "right": [], "items": []}, {"id": "L03-q12", "page": 37, "section": "نشاط: الانتشار والخاصية الأسموزية", "type": "explain", "text": "٤ أفسّرُ البياناتِ. ما الذي انتقلَ منْ كيسِ الشاي وإليْهِ؟ كيفَ تعرفُ أنَّ هذا قدْ حدثَ؟", "options": [], "answer": null, "answerText": "دخل الماء إلى الكيس، وخرجت مواد الشاي الملوّنة منه إلى الماء. نعرف ذلك من تغيّر لون الماء ومن ابتلال أوراق الشاي.", "why": {}, "what": "ما الذي خرج من الكيس؟ وما الذي دخل إليه؟ وما الدليل؟", "hint": "انظر إلى لون الماء، وإلى أوراق الشاي داخل الكيس.", "explain": "الماء دخل الكيس (الخاصية الأسموزية)، ومواد الشاي خرجت إلى الماء (الانتشار).", "solve": ["الدليل: لون الماء تغيّر.", "إذن خرجت مواد الشاي الملوّنة من الكيس.", "والأوراق في الكيس مبللة، إذن دخل الماء إليه."], "keys": [{"t": "خرجت مواد الشاي الملوّنة إلى الماء", "alts": ["الشاي", "اللون", "خرج"]}, {"t": "دخل الماء إلى الكيس", "alts": ["دخل الماء", "الماء", "مبللة"]}, {"t": "الدليل تغيّر لون الماء", "alts": ["لون", "تغير"]}], "back": "L03-s6", "fig": null, "evp": 36, "oos": null, "left": [], "right": [], "items": []}, {"id": "L03-q13", "page": 37, "section": "نشاط: الانتشار والخاصية الأسموزية", "type": "explain", "text": "٥ أستنتجُ. ما الذي حدّدَ حركةَ الجزيئاتِ إلى داخلِ الكيسِ وإلى خارجِه. ماذَا أتوقعُ أنْ يحدثَ للماءِ لو بقيَ كيسُ الشاي داخلَه مدةً طويلةً؟", "options": [], "answer": null, "answerText": "حدّد الحركةَ فرقُ التركيز: من المرتفع إلى المنخفض. ولو بقي الكيس طويلًا يستمر الانتشار حتى يتساوى التركيز (الاتزان)، فلا يزداد اللون بعدها.", "why": {}, "what": "لماذا تحركت الجزيئات؟ وماذا يحدث لو تركنا الكيس مدة طويلة؟", "hint": "ارجع إلى فقرة الاتزان في صفحة ٣٧.", "explain": "الانتشار يستمر إلى أن يتساوى تركيز المواد على الجانبين، وعندها يحدث الاتزان.", "solve": ["الدليل: الجزيئات انتقلت من الكيس إلى الماء.", "التفسير: تتحرك من التركيز المرتفع إلى المنخفض.", "الاستنتاج: تستمر الحركة حتى الاتزان."], "keys": [{"t": "التركيز: من المرتفع إلى المنخفض", "alts": ["التركيز", "المرتفع", "المنخفض"]}, {"t": "يستمر حتى يتساوى التركيز (الاتزان)", "alts": ["الاتزان", "يتساوى", "متساو"]}], "back": "L03-s7", "fig": null, "evp": 37, "oos": null, "left": [], "right": [], "items": []}, {"id": "L03-q14", "page": 37, "section": "أختبر نفسي", "type": "short", "text": "ألخّصُ. ماذا يحدثُ خلالَ الخاصيةِ الأسموزيةِ؟", "options": [], "answer": null, "answerText": "تنتقل جزيئات الماء عبر الغشاء البلازمي من مكان تركيز الماء المرتفع إلى المنخفض، بلا طاقة، حتى يحدث الاتزان.", "why": {}, "what": "صف حركة الماء في الخاصية الأسموزية: ماذا يتحرك؟ وإلى أين؟", "hint": "الخاصية الأسموزية انتشار لمادة واحدة فقط. ما هي؟", "explain": "الخاصية الأسموزية انتقال جزيئات الماء عبر الغشاء البلازمي، أي انتشار للماء فقط.", "solve": ["المادة المتحركة: الماء.", "تعبر الغشاء البلازمي.", "من تركيز الماء المرتفع إلى المنخفض، بلا طاقة."], "keys": [{"t": "تنتقل جزيئات الماء عبر الغشاء البلازمي", "alts": ["الماء", "الغشاء"]}, {"t": "من التركيز المرتفع إلى المنخفض", "alts": ["المرتفع", "المنخفض", "اكبر", "اقل"]}], "back": "L03-s6", "fig": "f36a", "evp": 36, "oos": null, "left": [], "right": [], "items": []}, {"id": "L03-q15", "page": 37, "section": "أختبر نفسي", "type": "critical", "text": ": [], "right": [], "items": []}, {"id": "L03-q29", "page": 41, "section": "العلوم والفن", "type": "open", "text": "رسمُ الخليةِ. أرسمُ مخططًا للخليةِ الحيوانيَّةِ بثلاثةِ أبعادٍ أظهرُ فيه التراكيبَ التي تعلّمتُها، وأكتبُ أسماءَها ووصفًا مختصرًا لدورِها في الخليةِ.", "options": [], "answer": null, "answerText": "إجابة مفتوحة: رسم ثلاثي الأبعاد للخلية الحيوانية فيه النواة، والغشاء البلازمي، والسيتوبلازم، والميتوكندريا، والفجوات، مع وظيفة كل جزء.", "why": {}, "what": "ارسم خلية حيوانية مجسّمة، واكتب اسم كل جزء ودوره.", "hint": "استعن برسم الخلية الحيوانية في صفحة ٣٤.", "explain": "الخلية الحيوانية فيها غشاء بلازمي ونواة وسيتوبلازم وميتوكندريا وفجوات، وليس فيها جدار خلوي.", "solve": ["أرسم الشكل الخارجي مجسّمًا.", "أرسم الأجزاء الداخلية.", "أكتب اسم كل جزء ووظيفته."], "keys": [{"t": "النواة: مركز التحكم", "alts": ["النواة"]}, {"t": "الغشاء البلازمي والسيتوبلازم", "alts": ["الغشاء", "السيتوبلازم"]}, {"t": "الميتوكندريا: مصدر الطاقة", "alts": ["الميتوكندريا"]}], "back": "L03-s3", "fig": "f34a", "evp": 34, "oos": null, "left": [], "right": [], "items": []}]}, {"id": "L04", "unit": "الوحدة الأولى: تنوّع الحياة", "chapter": "الفصل الأول: الخلايا", "name": "أعمل كالعلماء: ما التنفس الخلوي؟", "pages": [42, 43], "note": "صفحتا إثراء وتوسع: تجربة عملية تطبّق ما تعلمته عن التنفس الخلوي في الدرس الثاني.", "sections": [{"id": "L04-s1", "page": 42, "title": "ما التنفسُ الخلويُّ؟ (أكوّنُ فرضيّةً)", "book": "التنفسُ الخلويُّ عمليةٌ تقومُ بها الخلايا لتحويلِ جزيئاتِ الغذاءِ إلى طاقةٍ وثاني أكسيدِ الكربونِ، تَستخدمُها لاستمرارِ أداءِ وظائفِها الحيويةِ. المخلوقاتُ الوحيدةُ الخليةِ ومنها البكتيريا تَستخدمُ هذهِ الطاقةَ لتنظيمِ تدفقِ الموادِّ منَ الخليةِ وإليها، وللانتقالِ من مكانٍ إلى آخرَ، ولأداءِ العديدِ منَ الوظائفِ الأخرى. وبعضُ المخلوقاتِ الحيةِ تَســتخدمُ التنفسَ الخلويَّ مِنْ دونِ الحاجةِ إلى وجودِ الأكسجينِ.\nكيفَ يمكنُني قيــاسُ معدلِ التنفسِ الخلــويِّ في الخميــرةِ؟ أكتبُ الإجابةَ على شكلِ فرضيةٍ على النحوِ الآتي: «إذا كانتْ خلايا الخميرةِ تقومُ بتكســيرِ جزيئاتِ الســكرِ، فإنَّ سرعةَ إنتاجِ الفقاعةِ سوفَ.................».", "simple": "الخلايا تحوّل جزيئات الغذاء إلى طاقة وثاني أكسيد الكربون. هذه العملية اسمها التنفس الخلوي. في هذه التجربة نقيس سرعتها في الخميرة. نعدّ الفقاعات التي تخرج منها.", "steps": [{"q": "ماذا أرى؟", "t": "أرى قائمة أدوات التجربة: «أحتاج إلى».", "fig": "f42a", "parts": [], "a": "v54bc1433dcf1"}, {"q": "ما الأجزاء؟", "t": "خميرة وسكر وماء، وماصتان وأنابيب اختبار وكاشف.", "fig": "f42a", "parts": ["p3", "p5", "p4", "p2", "p7", "p8"], "a": "vb9cd12714b53"}, {"q": "ماذا يفعل؟", "t": "التنفس الخلوي يحوّل جزيئات الغذاء إلى طاقة وثاني أكسيد الكربون.", "a": "v66c93d197f89"}, {"q": "كيف يرتبط بغيره؟", "t": "المخلوقات الوحيدة الخلية تستخدم هذه الطاقة لتنقل المواد وتتحرك.", "a": "v65f1348271ac"}, {"q": "الفكرة المهمة", "t": "بعض المخلوقات تقوم بالتنفس الخلوي من دون الحاجة إلى الأكسجين.", "a": "v0be6cbd76d9e"}], "figs": ["f42a"], "key": "التنفس الخلوي عملية تحوّل فيها الخلايا جزيئات الغذاء إلى طاقة وثاني أكسيد الكربون.", "sa": "v8f62337f8f3c"}, {"id": "L04-s2", "page": 42, "title": "أختبرُ فرضيّتي", "book": "١ أمــلأُ الماصّةَ البلاســتيكيةَ بمحلولِ الخمــيرةِ، والماءِ والســكرِ، ثمَّ ألفُّ حولها ســلكًا طولُهُ ١٠ سم؛ ليمثلَ ثقلًا لإبقاءِ الماصةِ تحتَ سطحِ الماءِ.\n٢ أملأُ أنبوبَ الاختبــارِ إلى منتصفِهِ بالمــاءِ، ثمَّ أضيفُ خمسَ قطراتٍ من بروموثايمولِ الأزرقِ.\n٣ أحذرْ. أســتخدمُ المقصَّ لقصِّ ٢,٥ سم من طرفِ الماصةِ. مما يسمحُ للماءِ بتغطيةِ الماصةِ.\n٤ أمســكُ الماصةَ مــنْ طرفِها العلــويِّ وأضعُهــا في أنبوبِ الاختبارِ، ثمَّ أضيفُ ماءً إلى الأنبوبِ حتى يغمرَ الماصةَ.\n٥ أتواصلُ. أســجلُ كمْ فقاعةً تظهرُ خلالَ ١٠ دقائقَ، وأسجلُ أيَّ تغيرٍ في اللونِ يطرأُ في أنبوبِ الاختبارِ.\n٦ أكررُ الخطواتِ من ١ إلى ٥ مرةً أخرى، وأسجلُ نتائجي.", "simple": "نضع محلول الخميرة والسكر والماء في ماصة. نغمرها في أنبوب فيه ماء وكاشف. ثم نعدّ الفقاعات خلال ١٠ دقائق. ونكرر التجربة لنتأكد.", "steps": [{"q": "الخطوة ١", "t": "أملأ الماصة بمحلول الخميرة والماء والسكر، وألفّ حولها السلك ثقلًا.", "fig": "f42b", "parts": [], "a": "vc0f4bf4b5e74"}, {"q": "الخطوة ٢", "t": "أملأ الأنبوب إلى منتصفه بالماء، وأضيف خمس قطرات من الكاشف.", "fig": "f42c", "parts": [], "a": "v7f62545ade47"}, {"q": "الخطوة ٣", "t": "أحذر وأنا أقص ٢,٥ سم من طرف الماصة بالمقص.", "fig": "f42d", "parts": [], "a": "v856dc00373d8"}, {"q": "الخطوة ٤", "t": "أضع الماصة في الأنبوب، وأضيف ماء حتى يغمرها.", "fig": "f42e", "parts": [], "a": "vfa6c5d8227a3"}, {"q": "الخطوة ٥", "t": "أسجل عدد الفقاعات خلال ١٠ دقائق، وأي تغير في اللون.", "a": "v084c591d7f8d"}, {"q": "الخطوة ٦", "t": "أكرر الخطوات من ١ إلى ٥ مرة أخرى، وأسجل نتائجي.", "a": "v848c9bd02684"}], "figs": ["f42b", "f42c", "f42d", "f42e"], "key": "نقيس سرعة التنفس الخلوي في الخميرة بعدّ الفقاعات خلال زمن محدد.", "sa": "vd6610c5916bd"}, {"id": "L04-s3", "page": 43, "title": "استقصاءٌ موجَّهٌ: ما الذي يؤثرُ في سرعةِ التنفسِ الخلويِّ؟", "book": "هناكَ عواملُ كثيرةٌ تؤثرُ في سرعــةِ التنفسِ الخلويِّ، فإذا قمتُ بالركــضِ أو ركوبِ الدراجةِ الهوائيةِ، فســأبدأُ في أخذِ نفسٍ عميقٍ بشــكلٍ متواصلٍ. كيــفَ يمكنُني زيادةُ سرعةِ التنفــسِ الخلويِّ في الخميرةِ؟ أكتــبُ إجابتي على شــكلِ فرضيةٍ على النحوِ التالي: \"إذا تغيرتْ بيئةُ الخميرةِ بتغيرِ ..........، فإنَّ سرعةَ التنفسِ الخلويِّ ستزدادُ\".\nأصممُ تجربةً لزيــادةِ سرعةِ التنفسِ الخلــويِّ للخميرةِ. أكتبُ الموادَّ التي أحتاجُ إليها والخطواتِ التي ســأتبعُها، وأسجّلُ ملاحظاتِي ونتائجي.\nهل كانتِ النتائجُ التــي توصلتُ إليها تدعمُ فرضيتي؟ أفسّرُ ذلك. ما العواملُ التي أثرتْ في سرعةِ التنفسِ الخلويِّ؟", "simple": "عوامل كثيرة تؤثر في سرعة التنفس الخلوي. عندما تركض تتنفس بعمق أكثر. الآن تصمم أنت تجربة تزيد سرعة التنفس الخلوي في الخميرة.", "steps": [{"q": "ماذا أرى؟", "t": "سؤال جديد: ما الذي يؤثر في سرعة التنفس الخلوي؟", "a": "v0962e65f33ef"}, {"q": "ماذا يفعل؟", "t": "أغيّر شيئًا واحدًا في بيئة الخميرة، وأراقب الفقاعات.", "a": "vf85ee4a4d29a"}, {"q": "كيف يرتبط بغيره؟", "t": "هذه التجربة تبني على التجربة الأولى بالأدوات نفسها.", "a": "v241e34d3bcb3"}, {"q": "الفكرة المهمة", "t": "أكتب أدواتي وخطواتي، وأسجل ملاحظاتي ونتائجي، ثم أقارنها بفرضيتي.", "a": "vf4e98bcd8bd7"}], "figs": [], "key": "هناك عوامل كثيرة تؤثر في سرعة التنفس الخلوي.", "sa": "vd0cf5570ee31"}, {"id": "L04-s4", "page": 43, "title": "استقصاءٌ مفتوحٌ", "book": "ما الذي يمكنُ أن أتعلمَهُ أيضًا حولَ التنفسِ الخلويِّ؟ على ســبيلِ المثالِ: ما الفرقُ بينَ التنفسِ الهوائيِّ الذي يتطلبُ وجودُ الأكســجينِ والتنفســِ اللاهوائيِّ الذي يحدثُ منْ دونِ وجودِ الأكسجينِ؟ أصممُ تجربةً للإجابةِ عنْ هذهِ الأسئلةِ.\nأنظّمُ تجربتي بحيثُ أختبرُ متغيرًا واحدًا فقط، أو عنصرًا واحــدًا يتمُّ تغييرُه. أكتبُ تجربتِــي لتتمكنَ المجموعاتُ الأخرى منْ إكمالِها منْ خلالِ اتباعِ الخطواتِ.\nأتبعُ خطواتِ الطريقةِ العلميةِ.\nأطرحُ سؤالًا ← أكوّنُ فرضيةً ← أختبرُ فرضيتي ← أستخلصُ النتائجَ", "simple": "تستطيع أن تسأل سؤالك الخاص عن التنفس الخلوي. مثل: ما الفرق بين التنفس الهوائي واللاهوائي؟ في تجربتك تغيّر متغيرًا واحدًا فقط. وتتبع خطوات الطريقة العلمية.", "steps": [{"q": "ماذا أرى؟", "t": "لوحة «أتذكر» فيها خطوات الطريقة العلمية.", "fig": "f43a", "parts": [], "a": "vafbc46e1da41"}, {"q": "ما الأجزاء؟", "t": "أربع خطوات متتالية تربطها أسهم.", "fig": "f43a", "parts": ["p1", "p2", "p3", "p4"], "a": "vac59201e79bc"}, {"q": "كيف يرتبط بغيره؟", "t": "هي نفسها عناوين التجربة: أكوّن فرضية، أختبر فرضيتي، أستخلص النتائج.", "a": "v897e58ac19ac"}, {"q": "الفكرة المهمة", "t": "أختبر متغيرًا واحدًا فقط، وأكتب خطواتي ليكررها غيري.", "a": "v628ee6fc3fb3"}], "figs": ["f43a"], "key": "أتبع خطوات الطريقة العلمية، وأغيّر متغيرًا واحدًا فقط في التجربة.", "sa": "va5363b20d0e8"}], "questions": [{"type": "fill", "options": [], "answer": null, "why": {}, "fig": null, "oos": null, "left": [], "right": [], "items": [], "id": "L04-q1", "page": 42, "section": "أكوّنُ فرضيّةً", "text": "كيفَ يمكنُني قيــاسُ معدلِ التنفسِ الخلــويِّ في الخميــرةِ؟ أكتبُ الإجابةَ على شكلِ فرضيةٍ على النحوِ الآتي: «إذا كانتْ خلايا الخميرةِ تقومُ بتكســيرِ جزيئاتِ الســكرِ، فإنَّ سرعةَ إنتاجِ الفقاعةِ سوفَ.................».", "answerText": "... فإن سرعة إنتاج الفقاعة سوف تزداد.", "what": "أن تكمل جملة الفرضية: ماذا يحدث لسرعة الفقاعات إذا كسّ
