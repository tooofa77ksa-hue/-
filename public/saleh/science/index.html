null, "ha": null, "whyA": {"0": "vd3398a8acc9c", "1": "vcb504be30839", "3": "v06030f5669b9"}}, {"id": "L05-m3", "src": "L05-q3", "kept": false, "page": 44, "type": "mcq", "text": "العملية التي تقوم بها الخلية وتحوّل فيها الجلوكوز إلى طاقة تستعملها في الأنشطة الحيوية تُسمّى:", "options": ["أ. البناء الضوئي", "ب. الخاصية الأسموزية", "ج. البلعمة", "د. التنفس الخلوي"], "answer": 3, "answerText": "د. التنفس الخلوي", "explain": "الكتاب: تستخلص النباتات والحيوانات الطاقة من سكر الجلوكوز بعملية تُسمّى التنفس الخلوي.", "why": {"0": "البناء الضوئي يصنع الجلوكوز، لا يحلله.", "1": "الخاصية الأسموزية انتقال الماء.", "2": "البلعمة إحاطة المواد الكبيرة بجيب."}, "evp": 39, "back": "L03-s10", "section": "اختر الإجابة الصحيحة", "qa": "v4efdb18f5d32", "ea": "vbc3dc54be460", "wa": null, "ha": null, "whyA": {"0": "ve15362fcb1bf", "1": "v005823428cb3", "2": "vf58bc4ea86e3"}}, {"id": "L05-m4", "src": "L05-q4", "kept": false, "page": 44, "type": "mcq", "text": "المادة النقية التي لا يمكن تجزئتها إلى مواد أبسط منها تُسمّى:", "options": ["أ. العنصر", "ب. المركّب", "ج. النسيج", "د. الخلية"], "answer": 0, "answerText": "أ. العنصر", "explain": "الكتاب: العنصر مادة نقية لا يمكن تجزئتها إلى مواد أبسط منها.", "why": {"1": "المركّب يتكوّن من عنصرين أو أكثر، فيمكن تجزئته.", "2": "النسيج مجموعة خلايا.", "3": "الخلية وحدة المخلوق الحي."}, "evp": 28, "back": "L01-s7", "section": "اختر الإجابة الصحيحة", "qa": "vae1a3331a2b7", "ea": "vcc3bd8033354", "wa": null, "ha": null, "whyA": {"1": "v3feb36949125", "2": "vaa7e8dbb888a", "3": "v3a568f262f70"}}, {"id": "L05-m5", "src": "L05-q5", "kept": false, "page": 44, "type": "tf", "text": "الخلايا المتشابهة التي تقوم بالوظيفة نفسها تشكّل عضوًا.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "الصحيح: الخلايا المتشابهة التي تقوم بالوظيفة نفسها تشكّل نسيجًا. أما العضو فنسيجان مختلفان أو أكثر.", "why": {"0": "الخلايا المتشابهة تشكّل نسيجًا."}, "evp": 26, "back": "L01-s4", "section": "صح أم خطأ", "qa": "v491f610ceee3", "ea": "v9aeb516da31e", "wa": null, "ha": null, "whyA": {"0": "v059d099d5223"}}, {"id": "L05-m6", "src": "L05-q6", "kept": false, "page": 44, "type": "mcq", "text": "عملية انتقال المواد من منطقة التركيز المرتفع إلى منطقة التركيز المنخفض من دون الحاجة إلى طاقة هي:", "options": ["أ. النقل النشط", "ب. الانتشار", "ج. البناء الضوئي", "د. التخمّر"], "answer": 1, "answerText": "ب. الانتشار", "explain": "الكتاب: الانتشار انتقال المواد، ومنها السكر والأكسجين وثاني أكسيد الكربون، من التركيز المرتفع إلى المنخفض بلا طاقة.", "why": {"0": "النقل النشط يحتاج طاقة، ومن المنخفض إلى المرتفع.", "2": "البناء الضوئي صنع الغذاء.", "3": "التخمّر تنفس لاهوائي."}, "evp": 36, "back": "L03-s6", "section": "اختر الإجابة الصحيحة", "qa": "vc8af9c63694e", "ea": "v8e1d32f8dd84", "wa": null, "ha": null, "whyA": {"0": "v6c33cc07f019", "2": "vcb504be30839", "3": "v9de7b84284d3"}}, {"id": "L05-m7", "src": "L05-q8", "kept": false, "page": 45, "type": "tf", "text": "اكتشف روبرت براون نواة الخلية النباتية قبل أن يشاهد روبرت هوك خلايا الفلين.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "الصحيح: هوك شاهد خلايا الفلين عام ١٦٦٥م، وبراون اكتشف النواة بعده عام ١٨٣١م.", "why": {"0": "هوك (١٦٦٥م) أقدم من براون (١٨٣١م)."}, "evp": 25, "back": "L01-s2", "section": "صح أم خطأ", "qa": "v8fcebf42b522", "ea": "v3970cc543859", "wa": null, "ha": null, "whyA": {"0": "v9c458b2f1a4a"}}, {"id": "L05-m8", "src": "L05-q9", "kept": false, "page": 45, "type": "mcq", "text": "ماذا يحدث خلال التنفس الخلوي؟", "options": ["أ. تصنع الخلية الجلوكوز من طاقة الضوء", "ب. تحلّل الخلايا السكر بالأكسجين فتنطلق طاقة، وينتج الماء وثاني أكسيد الكربون", "ج. تنتقل جزيئات الماء عبر الغشاء البلازمي", "د. تبتلع الخلية المواد الكبيرة"], "answer": 1, "answerText": "ب. تحلّل الخلايا السكر بالأكسجين فتنطلق طاقة، وينتج الماء وثاني أكسيد الكربون", "explain": "الكتاب: تستعمل الخلايا الأكسجين لتحليل السكر لإطلاق طاقة للنشاطات الحيوية، وينتج الماء وثاني أكسيد الكربون.", "why": {"0": "هذا البناء الضوئي.", "2": "هذه الخاصية الأسموزية.", "3": "هذه البلعمة."}, "evp": 39, "back": "L03-s10", "section": "اختر الإجابة الصحيحة", "qa": "v933e9876fcd0", "ea": "veffc3eea0cda", "wa": null, "ha": null, "whyA": {"0": "v269cfbf075a9", "2": "v3bc43079dc4e", "3": "v300e41bec3f0"}}, {"id": "L05-m9", "src": "L05-q10", "kept": false, "page": 45, "type": "tf", "text": "ثاني أكسيد الكربون والماء الناتجان من التنفس الخلوي تستخدمهما النباتات مرة أخرى في البناء الضوئي.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "الكتاب: ينتج عن التنفس الماء وثاني أكسيد الكربون، وتستخدم النباتات هذه الفضلات مرة أخرى في البناء الضوئي؛ فالعمليتان متعاكستان.", "why": {"1": "العبارة صحيحة كما في الكتاب ص٣٩."}, "evp": 39, "back": "L03-s10", "fig": "f39b", "section": "صح أم خطأ", "qa": "vb11042ec1578", "ea": "v1f02f51aad28", "wa": null, "ha": null, "whyA": {"1": "ve098d12b55b7"}}, {"id": "L05-m10", "src": "L05-q11", "kept": false, "page": 45, "type": "mcq", "text": "كيف أميّز بين خلية نباتية وخلية حيوانية؟", "options": ["أ. للخلية الحيوانية جدار خلوي", "ب. للخلية النباتية نواة، والحيوانية بلا نواة", "ج. الخلية الحيوانية فيها بلاستيدات خضراء", "د. للخلية النباتية جدار خلوي وبلاستيدات خضراء"], "answer": 3, "answerText": "د. للخلية النباتية جدار خلوي وبلاستيدات خضراء", "explain": "الجدار الخلوي والبلاستيدات الخضراء والكلوروفيل توجد في الخلايا النباتية ولا توجد في الحيوانية.", "why": {"0": "الجدار الخلوي في الخلية النباتية فقط.", "1": "معظم الخلايا النباتية والحيوانية لها نواة.", "2": "البلاستيدات الخضراء في الخلية النباتية فقط."}, "evp": 35, "back": "L03-s5", "section": "اختر الإجابة الصحيحة", "qa": "v7f8327dd7b35", "ea": "v21edc2633b6b", "wa": null, "ha": null, "whyA": {"0": "va1c957681441", "1": "v732adb0df9b7", "2": "v2140341d7ed8"}}, {"id": "L05-m11", "src": "L05-q12", "kept": false, "page": 45, "type": "tf", "text": "قد لا تنمو أنواع كثيرة من النباتات على شاطئ البحر؛ لأن الملح يجعل الماء يخرج من خلاياها فتذبل.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "إذا كان خروج الماء من خلايا النبات أكثر من دخوله إليها ينكمش الغشاء البلازمي فيذبل النبات (ص٣٧).", "why": {"1": "الملح حول الجذور يسحب الماء من الخلايا بالخاصية الأسموزية."}, "evp": 37, "back": "L03-s7", "section": "صح أم خطأ", "qa": "v2c3afbee9bd7", "ea": "v94cc2bfe40c4", "wa": null, "ha": null, "whyA": {"1": "vbb53fadbee15"}}, {"id": "L05-m12", "src": "L05-q13", "kept": false, "page": 45, "type": "mcq", "text": "أفسّر البيانات: ما نوع النقل السلبي الذي يحدث في الشكل (انتقال الأكسجين عبر الغشاء البلازمي)؟", "options": ["أ. الخاصية الأسموزية", "ب. النقل النشط", "ج. الانتشار", "د. البلعمة"], "answer": 2, "answerText": "ج. الانتشار", "explain": "الشكل يُظهر جزيئات الأكسجين تنتقل من حيث تركيزها مرتفع إلى داخل الخلية حيث تركيزها منخفض: هذا انتشار.", "why": {"0": "الخاصية الأسموزية لانتقال الماء، والشكل يُظهر الأكسجين.", "1": "النقل النشط ليس نقلًا سلبيًا؛ يحتاج طاقة.", "3": "البلعمة للمواد الكبيرة جدًا، وليست نقلًا سلبيًا."}, "evp": 36, "back": "L03-s6", "fig": "f45a", "section": "اختر الإجابة الصحيحة", "qa": "vd7cc3ff8399b", "ea": "v75ffdeeb5244", "wa": null, "ha": null, "whyA": {"0": "v4b0865f42838", "1": "v9c89694f2d46", "3": "vda2bd63c79dd"}}, {"id": "L05-m13", "src": "L05-q14", "kept": true, "page": 45, "type": "tf", "text": "١٣. صوابٌ أمْ خطأٌ. الخليةُ أصغرُ جزءٍ في المخلوقِ الحيِّ يمكنُه القيامُ بالعملياتِ الحيويةِ. هلْ هذهِ العبارةُ صحيحةٌ أم خطأٌ؟ أفسّرُ إجابتِي.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "الكتاب يقول: الخلية هي الوحدة الأساسية للمخلوق الحي، وهي أصغر جزء فيه قادر على الحياة.", "why": {"1": "الكتاب: الخلية أصغر جزء في المخلوق الحي قادر على الحياة."}, "evp": 24, "back": "L01-s1", "section": "صح أم خطأ", "qa": "v7b5cb0abbbb7", "ea": "va7035222ade9", "wa": null, "ha": null, "whyA": {"1": "v3b97ca3702e9"}}, {"id": "L05-m14", "src": "L05-q15", "kept": true, "page": 45, "type": "mcq", "text": "١٤. أختارُ الإجابةَ الصحيحةَ: ما العمليةُ التي تظهرُ في الشكلِ أدناهُ؟", "options": ["أ. نقلٌ سلبيٌّ", "ب. نقلٌ نشطٌ", "جـ. بناءٌ ضوئيٌّ", "د. تخمُّرٌ"], "answer": 2, "answerText": "جـ. بناءٌ ضوئيٌّ", "explain": "يدخل الماء وثاني أكسيد الكربون وطاقة الشمس، ويخرج الجلوكوز والأكسجين، في البلاستيدة الخضراء. هذا هو البناء الضوئي.", "why": {"0": "الشكل فيه ضوء الشمس وبلاستيدة خضراء، وهذا بناء ضوئي لا نقل.", "1": "النقل النشط نقل مواد بطاقة عبر الغشاء.", "3": "التخمّر تنفس لاهوائي، والشكل يُظهر طاقة الشمس."}, "evp": 38, "back": "L03-s9", "fig": "f45b", "section": "اختر الإجابة الصحيحة", "qa": "vd580ba83c818", "ea": "va4afe5140d91", "wa": null, "ha": null, "whyA": {"0": "v140fe2cf77ac", "1": "v922400c8494c", "3": "vf08de5fc4e2c"}}, {"id": "L05-m15", "src": "L05-q16", "kept": false, "page": 45, "type": "mcq", "text": "فيمَ تشترك جميع المخلوقات الحية؟", "options": ["أ. لها جدار خلوي", "ب. تتكوّن من خلية واحدة أو أكثر", "ج. تحتوي على بلاستيدات خضراء", "د. تتكوّن من بلايين الخلايا"], "answer": 1, "answerText": "ب. تتكوّن من خلية واحدة أو أكثر", "explain": "الكتاب: جميع المخلوقات الحية تتكوّن من خلية واحدة أو أكثر.", "why": {"0": "الجدار الخلوي في الخلايا النباتية فقط.", "2": "البلاستيدات الخضراء في النبات فقط.", "3": "بعض المخلوقات وحيدة الخلية مثل البكتيريا."}, "evp": 24, "back": "L01-s1", "section": "اختر الإجابة الصحيحة", "qa": "vb9bd2635583c", "ea": "vcae7812b3cf7", "wa": null, "ha": null, "whyA": {"0": "vf28ed2038045", "2": "v13bfd0db8884", "3": "v8c5b9a3b5884"}}, {"id": "L05-m16", "src": "L05-q17", "kept": false, "page": 45, "type": "tf", "text": "في التقويم الأدائي يبقى الملح جافًا في حفرة البطاطس بعد نصف ساعة.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "الصحيح: لا يبقى الملح جافًا؛ يخرج الماء من خلايا البطاطس إليه بالخاصية الأسموزية.", "why": {"0": "الماء يخرج من خلايا البطاطس نحو الملح."}, "evp": 36, "back": "L03-s6", "section": "صح أم خطأ", "qa": "v1e6fa56a1ed2", "ea": "vf9107fa47fb9", "wa": null, "ha": null, "whyA": {"0": "vd0e2c9918d8f"}}, {"id": "L05-m17", "src": "L05-q18", "kept": false, "page": 45, "type": "mcq", "text": "ما عملية النقل التي حدثت في نصفي حبة البطاطس (حفرة الملح وحفرة الماء)؟", "options": ["أ. النقل النشط", "ب. البلعمة", "ج. البناء الضوئي", "د. الخاصية الأسموزية"], "answer": 3, "answerText": "د. الخاصية الأسموزية", "explain": "في النصفين انتقل الماء عبر أغشية الخلايا: خرج نحو الملح، ودخل من حفرة الماء. وهذه خاصية أسموزية، وهي نقل سلبي بلا طاقة.", "why": {"0": "انتقال الماء هنا لا يحتاج طاقة.", "1": "البلعمة لإدخال المواد الكبيرة جدًا.", "2": "البناء الضوئي صنع الغذاء بالضوء."}, "evp": 36, "back": "L03-s6", "section": "اختر الإجابة الصحيحة", "qa": "v488a012c9e69", "ea": "v7a419edfb2eb", "wa": null, "ha": null, "whyA": {"0": "vde733a227db1", "1": "va34d7b36507e", "2": "v49fada7673cd"}}, {"id": "L05-m18", "src": "L05-q19", "kept": true, "page": 46, "type": "mcq", "text": "١. أوّلُ ما شاهدَهُ ليفنهوكُ تحتَ المجهرِ", "options": ["أ. الخليةُ.", "ب. المخلوقاتُ الوحيدةُ الخليةِ.", "ج. نواةُ الخليةِ.", "د. مخلوقاتٌ عديدةُ الخلايا."], "answer": 1, "answerText": "ب. المخلوقاتُ الوحيدةُ الخليةِ.", "explain": "ليفنهوك أول من استطاع أن يشاهد مخلوقات حية وحيدة الخلية بمجهر صنعه.", "why": {"0": "روبرت هوك هو أول من شاهد الخلية.", "2": "براون اكتشف النواة عام ١٨٣١م.", "3": "ليفنهوك أول من شاهد مخلوقات وحيدة الخلية."}, "evp": 24, "back": "L01-s1", "section": "اختر الإجابة الصحيحة", "qa": "v11165b615b36", "ea": "v68cca26f36d3", "wa": null, "ha": null, "whyA": {"0": "v27d957ef55c2", "2": "v27d7ebac7d09", "3": "v669c8123bc28"}}, {"id": "L05-m19", "src": "L05-q20", "kept": true, "page": 46, "type": "mcq", "text": "٢. أيُّ الفقراتِ التاليةِ ليسَتْ جزءًا منْ نظريةِ الخليةِ؟", "options": ["أ. جميعُ المخلوقاتِ الحيةِ تتكوّنُ منْ خليةٍ أو أكثرَ.", "ب. الخليةُ وحدةُ البناءِ الأساسيةِ للمخلوقاتِ الحيةِ.", "ج. الخليةُ تتكوّنُ منَ العديدِ منَ العناصرِ والمركباتِ.", "د. تَنتجُ الخلايا عنْ خلايا موجودةٍ."], "answer": 2, "answerText": "ج. الخليةُ تتكوّنُ منَ العديدِ منَ العناصرِ والمركباتِ.", "explain": "أفكار النظرية: المخلوقات من خلية أو أكثر، والخلية وحدة التركيب والوظيفة، والخلايا تنتج عن خلايا موجودة. العناصر والمركبات ليست منها.", "why": {"0": "هذه إحدى أفكار النظرية الثلاث.", "1": "هذه إحدى أفكار النظرية الثلاث.", "3": "هذه إحدى أفكار النظرية الثلاث."}, "evp": 25, "back": "L01-s2", "section": "اختر الإجابة الصحيحة", "qa": "vd9661e32b1be", "ea": "ve4a9027449e9", "wa": null, "ha": null, "whyA": {"0": "vb2fab7b4689c", "1": "vb2fab7b4689c", "3": "vb2fab7b4689c"}}, {"id": "L05-m20", "src": "L05-q21", "kept": true, "page": 46, "type": "mcq", "text": "٣. تختلفُ خليةُ المخلوقِ الوحيدِ الخليةِ عنْ خلايا المخلوقاتِ العديدةِ الخلايا في أنَّها:", "options": ["أ. خليةٌ حيةٌ.", "ب. لها نواةٌ واحدةٌ فقطْ.", "ج. تؤدّي مجموعةً منَ الوظائفِ المتخصصةِ.", "د. نتجتْ عنْ خليةٍ موجودةٍ."], "answer": 2, "answerText": "ج. تؤدّي مجموعةً منَ الوظائفِ المتخصصةِ.", "explain": "خلية المخلوق الوحيد الخلية تقوم وحدها بجميع الأنشطة الضرورية، أما في العديد الخلايا فكل خلية تقوم بوظيفة خاصة.", "why": {"0": "كل الخلايا حية في الحالتين.", "1": "معظم الخلايا لها نواة في الحالتين.", "3": "كل الخلايا تنتج عن خلايا موجودة."}, "evp": 26, "back": "L01-s4", "section": "اختر الإجابة الصحيحة", "qa": "vb427d3cdf971", "ea": "ve9bc7958741e", "wa": null, "ha": null, "whyA": {"0": "v742ee2712d7d", "1": "vfe7c9d64c65e", "3": "v2c493fe2ba47"}}, {"id": "L05-m21", "src": "L05-q22", "kept": true, "page": 46, "type": "mcq", "text": "٤. النسيجُ الذي ينقلُ رسائلَ الجسمِ هوَ النسيجُ:", "options": ["أ. الطلائيُّ.", "ب. العصبيُّ.", "ج. العضليُّ.", "د. الضامُّ."], "answer": 1, "answerText": "ب. العصبيُّ.", "explain": "الكتاب: النسيج العصبي ينقل رسائل في الجسم.", "why": {"0": "النسيج الطلائي يغطي أجزاء الجسم.", "2": "النسيج العضلي يحرّك العظام ويضخ الدم.", "3": "النسيج الضام مثل العظام والغضاريف والدم."}, "evp": 26, "back": "L01-s4", "section": "اختر الإجابة الصحيحة", "qa": "v1412b7a99659", "ea": "vc18ed435f489", "wa": null, "ha": null, "whyA": {"0": "va14ef9faa15e", "2": "vee845b7debce", "3": "vc5352533aed6"}}, {"id": "L05-m22", "src": "L05-q23", "kept": true, "page": 46, "type": "mcq", "text": "٥. أيُّ العباراتِ التاليةِ تصفُ التنظيمَ الصحيحَ للمادةِ؟", "options": ["أ. المركبُ ◄ الذرةُ ◄ العنصرُ", "ب. الذرةُ ◄ العنصرُ ◄ المركبُ", "ج. العنصرُ ◄ الذرةُ ◄ المركبُ", "د. المركبُ ◄ العنصرُ ◄ الذرةُ"], "answer": 1, "answerText": "ب. الذرةُ ◄ العنصرُ ◄ المركبُ", "explain": "العنصر يتكوّن من نوع واحد من الذرات، والمركب يتكوّن من اتحاد عنصرين أو أكثر.", "why": {"0": "الذرة أصغر، فهي أولًا.", "2": "العنصر يتكوّن من ذرات، فالذرة قبله.", "3": "هذا الترتيب مقلوب."}, "evp": 28, "back": "L01-s7", "section": "اختر الإجابة الصحيحة", "qa": "v60951be31ed3", "ea": "v7b53683c19c6", "wa": null, "ha": null, "whyA": {"0": "v76bd12bf08ec", "2": "v202776946674", "3": "v000598b8e5a2"}}, {"id": "L05-m23", "src": "L05-q24", "kept": true, "page": 46, "type": "mcq", "text": "٦. أدرسُ شكلَ الخليةِ الحيوانيةِ، وأجيبُ عنِ السؤالِ الذي يليه. معظمُ المعلوماتِ الوراثيةِ للخليةِ الحيوانيةِ موجودةٌ في:", "options": ["أ. الميتوكندريا.", "ب. السيتوبلازمِ.", "ج. الفجوةِ.", "د. النواةِ."], "answer": 3, "answerText": "د. النواةِ.", "explain": "الكتاب: النواة تحتوي على معظم المعلومات الوراثية للخلية.", "why": {"0": "الميتوكندريا مصدر الطاقة.", "1": "السيتوبلازم مادة هلامية فيها أجزاء الخلية.", "2": "الفجوة للتخزين."}, "evp": 34, "back": "L03-s3", "fig": "f46a", "section": "اختر الإجابة الصحيحة", "qa": "v03ffe5a9a689", "ea": "v0f99f8efacd4", "wa": null, "ha": null, "whyA": {"0": "v373eb0717a91", "1": "vea86afe0f399", "2": "v0bb06d5c0e85"}}, {"id": "L05-m24", "src": "L05-q25", "kept": true, "page": 47, "type": "mcq", "text": "٧. أقارنُ بينَ النبتتينِ في الشكلِ أدناهُ: أيُّ الحالاتِ التاليةِ قد تكونُ السببَ في ذبولِ النبتةِ (ب) مقارنةً بالنبتةِ (أ)؟", "options": ["أ. كميةُ الماءِ التي فقدتْها النبتةُ أكثرُ منْ كميةِ الماءِ التي امتصّتْها منَ التربةِ.", "ب. كميةُ الماءِ التي فقدتْها النبتةُ مساويةٌ لكميةِ الماءِ التي امتصّتْها.", "ج. كميةُ الماءِ التي فقدتْها النبتةُ أقلُّ منْ كميةِ الماءِ التي امتصّتْها.", "د. النبتةُ لم تتعرّضْ لضوءٍ كافٍ لامتصاصِ الماءِ."], "answer": 0, "answerText": "أ. كميةُ الماءِ التي فقدتْها النبتةُ أكثرُ منْ كميةِ الماءِ التي امتصّتْها منَ التربةِ.", "explain": "يذبل النبات عندما يفقد جزيئات ماء أكثر مما يحصل عليها.", "why": {"1": "إذا تساوى الداخل والخارج كان النبات في اتزان وسليمًا.", "2": "إذا امتص أكثر مما فقد لا يذبل.", "3": "الذبول سببه خروج الماء أكثر من دخوله."}, "evp": 37, "back": "L03-s7", "fig": "f47a", "section": "اختر الإجابة الصحيحة", "qa": "v5ac79b51ff48", "ea": "vaf58a9f0f6fb", "wa": null, "ha": null, "whyA": {"1": "v15ad519a066a", "2": "v8bb3b01c3845", "3": "v68c65c3f8bb9"}}, {"id": "L05-m25", "src": "L05-q26", "kept": true, "page": 47, "type": "mcq", "text": "٨. ما المادتانِ الناتجتانِ عنْ عمليةِ البناءِ الضوئيِّ؟", "options": ["أ. ثاني أكسيدِ الكربونِ وسكرُ الجلوكوزِ.", "ب. الأكسجينُ والماءُ.", "ج. الماءُ وثاني أكسيدِ الكربونِ.", "د. سكرُ الجلوكوزِ والأكسجينُ."], "answer": 3, "answerText": "د. سكرُ الجلوكوزِ والأكسجينُ.", "explain": "الكتاب: المواد الناتجة عن البناء الضوئي هي سكر الجلوكوز والأكسجين.", "why": {"0": "ثاني أكسيد الكربون مادة متفاعلة لا ناتجة.", "1": "الماء مادة متفاعلة لا ناتجة.", "2": "هاتان هما المادتان المتفاعلتان."}, "evp": 38, "back": "L03-s9", "section": "اختر الإجابة الصحيحة", "qa": "v981944114866", "ea": "v07bf112ccab6", "wa": null, "ha": null, "whyA": {"0": "v7d75e5a7a846", "1": "v76cd1966b7f9", "2": "vca6e44b7e45b"}}, {"id": "L05-m26", "src": "L05-q27", "kept": false, "page": 47, "type": "mcq", "text": "ما الفرق بين التنفس الهوائي والتنفس اللاهوائي؟", "options": ["أ. الهوائي يستعمل الأكسجين، واللاهوائي لا يستعمله", "ب. اللاهوائي يستعمل الأكسجين، والهوائي لا يستعمله", "ج. كلاهما يحدث في البلاستيدات الخضراء فقط", "د. الهوائي ينتج حمض اللاكتيك"], "answer": 0, "answerText": "أ. الهوائي يستعمل الأكسجين، واللاهوائي لا يستعمله", "explain": "الكتاب: التنفس الهوائي يتطلب الأكسجين لتحليل السكر. والتنفس اللاهوائي لا يستعمل الأكسجين، وأشهره التخمّر الذي ينتج حمض اللاكتيك في العضلات.", "why": {"1": "هذا مقلوب.", "2": "البلاستيدات الخضراء للبناء الضوئي.", "3": "حمض اللاكتيك ينتج من التخمّر، وهو لاهوائي."}, "evp": 39, "back": "L03-s10", "section": "اختر الإجابة الصحيحة", "qa": "vc181dc92ea41", "ea": "vc124575998b3", "wa": null, "ha": null, "whyA": {"1": "vae91f97e89fa", "2": "v6d9ac2b4ba26", "3": "vdf03c203363e"}}, {"id": "L05-m27", "src": "L05-q28", "kept": false, "page": 47, "type": "mcq", "text": "لماذا لم يكن الناس يعرفون عن وجود الخلايا قبل اكتشاف المجهر؟", "options": ["أ. لأن الخلايا لم تكن موجودة", "ب. لأن الخلايا توجد في النبات فقط", "ج. لأن معظم الخلايا لا تُرى بالعين المجردة", "د. لأن الخلايا كبيرة جدًا"], "answer": 2, "answerText": "ج. لأن معظم الخلايا لا تُرى بالعين المجردة", "explain": "الكتاب: معظم الخلايا لا يمكن مشاهدتها بالعين المجردة، لذلك كان اختراع المجهر بداية الطريق لتعرّف الخلايا.", "why": {"0": "جميع المخلوقات الحية تتكوّن من خلايا منذ وُجدت.", "1": "الخلايا في كل المخلوقات الحية.", "3": "معظم الخلايا صغيرة جدًا، لا كبيرة."}, "evp": 24, "back": "L01-s1", "section": "اختر الإجابة الصحيحة", "qa": "v075202f5cb1f", "ea": "vc207de958bcb", "wa": null, "ha": null, "whyA": {"0": "v5bb98a39a84b", "1": "va06ee1313bba", "3": "v5b355977c2ff"}}]}, {"id": "L06", "unit": "الوحدة الأولى: تنوّع الحياة", "chapter": "الفصل الثاني: الخلية والوراثة", "name": "الدرس الأول: انقسام الخلايا", "pages": [48, 59], "note": "صفحتا ٤٨–٤٩ مدخل الفصل الثاني، والدرس يبدأ من صفحة ٥٠.", "sections": [{"id": "L06-s1", "page": 48, "title": "الخليةُ والوراثةُ", "book": "الفصلُ الثاني: الخليةُ والوراثةُ\nالفكرةُ العامّةُ: كيف تَنقُلُ المخلوقاتُ الحيةُ الصفاتِ إلى أبنائِها؟\nالأسئلةُ الأساسيةُ\nالدرسُ الأولُ: كيفَ تُنتجُ الخليةُ خلايا جديدةً؟\nالدرسُ الثاني: كيفَ تنتقلُ الصفاتُ منَ الآباءِ إلى الأبناءِ؟", "simple": "هذا مدخل الفصل الثاني. سندرس كيف تُنتج الخلية خلايا جديدة، وكيف تنتقل الصفات من الآباء إلى الأبناء. أهم الكلمات: دورة الخلية، والانقسام المتساوي، والانقسام المنصّف، والوراثة.", "steps": [{"q": "ماذا أرى؟", "t": "صورة بالمجهر لخلايا نبات، بعضها في أثناء الانقسام.", "fig": "f48a", "a": "vc676ba7cd602"}, {"q": "ما السؤال الكبير؟", "t": "كيف تنقل المخلوقات الحية الصفات إلى أبنائها؟", "a": "vdece29bcfa49"}, {"q": "ما أسئلة الدرسين؟", "t": "الدرس الأول: كيف تُنتج الخلية خلايا جديدة؟ والدرس الثاني: كيف تنتقل الصفات من الآباء إلى الأبناء؟", "a": "v5b63bfc59ba7"}, {"q": "الفكرة المهمة", "t": "الخلية تنقسم لتصنع خلايا جديدة، والصفات تنتقل من الآباء إلى الأبناء بالوراثة.", "a": "vd9f58a334401"}], "figs": ["f48a"], "key": "يدرس الفصل كيف تُنتج الخلية خلايا جديدة، وكيف تنتقل الصفات من الآباء إلى الأبناء.", "sa": "v83e263d740a1"}, {"id": "L06-s2", "page": 49, "title": "مفرداتُ الفكرةِ العامةِ", "book": "دورةُ الخليةِ: عمليةٌ مستمرةٌ لنموِّ الخلايَا وانقسامِها وتعويضِ التالفِ منها.\nالانقسامُ المتساوي: انقسامُ نواةِ الخليةِ في أثناءِ انقسامِ الخليةِ إلى خليتينِ متماثلتينِ.\nالانقسامُ المنصِّفُ: نوعٌ خاصٌّ منَ الانقسامِ الخلويِّ تنتجُ عنهُ الخلايا التَناسليةُ ويحتوي كلٌّ منها على نصفِ عددِ الكروموسوماتِ الموجودةِ في الخليةِ الأمِّ وفي غيرِها منَ الخلايا.\nالوراثةُ: انتقالُ الصفاتِ الموروثةِ منَ الآباءِ إلى الأبناءِ.\nالصفةُ السائدةُ: صفةٌ وراثيةٌ في المخلوقاتِ الحيّةِ تمنعُ صفةً أخرَى منَ الظهورِ.\nمخطّطُ السُّلالةِ: مُخطّطٌ يُستعملُ لتتبُّعِ الصِّفاتِ في العائِلةِ، ودراسةِ الأنماطِ الوراثيةِ.", "simple": "هذه كلمات الفصل المهمة. دورة الخلية: نمو وانقسام وتعويض. الانقسام المتساوي ينتج خليتين متماثلتين. الانقسام المنصّف ينتج خلايا تناسلية بنصف عدد الكروموسومات. والوراثة انتقال الصفات من الآباء إلى الأبناء.", "steps": [{"q": "ماذا أرى؟", "t": "صورة صغيرة لكل كلمة، مثل دائرة دورة الخلية.", "fig": "f49a", "a": "ve38baf2a5b28"}, {"q": "كلمات الدرس الأول", "t": "دورة الخلية، والانقسام المتساوي، والانقسام المنصّف.", "a": "v7a559736668c"}, {"q": "كلمات الدرس الثاني", "t": "الوراثة، والصفة السائدة، ومخطط السلالة.", "a": "v8cf6156fab11"}, {"q": "الفكرة المهمة", "t": "الانقسام المنصّف ينتج خلايا تناسلية فيها نصف عدد الكروموسومات.", "a": "v4ade2352a36c"}], "figs": ["f49a"], "key": "مفردات الفصل: دورة الخلية، والانقسام المتساوي والمنصّف، والوراثة، والصفة السائدة، ومخطط السلالة.", "sa": "vc70e228420ea"}, {"id": "L06-s3", "page": 50, "title": "أنظرُ وأتساءلُ", "book": "يبدأُ الضفدعُ حياتَهُ، كما في الحيواناتِ كلِّهَا، منْ خليةٍ واحدةٍ. يمكنُ للخلايا أنْ تنموَ، ولكنَّ هناكَ حدًّا أعلى للحجمِ الذي يمكنُ أن تنموَ إليهِ الخليةُ. فكيفَ تنمو خليةٌ واحدةٌ لتصبحَ ضفدعًا مكتملَ النموِّ؟", "simple": "الضفدع يبدأ حياته من خلية واحدة. الخلية تكبر، لكن لكبرها حدّ لا تتجاوزه. فكيف يصير الضفدع كبيرًا؟ هذا ما سنعرفه في الدرس.", "steps": [{"q": "ماذا أرى؟", "t": "بيض ضفدع: كرات شفافة، في وسط كل منها نقطة داكنة.", "fig": "f50a", "a": "vd28145fe39a2"}, {"q": "من أين يبدأ الضفدع؟", "t": "يبدأ الضفدع حياته من خلية واحدة، مثل الحيوانات كلها.", "a": "v49c9cea1f52d"}, {"q": "ما المشكلة؟", "t": "الخلية تنمو، لكن هناك حدًّا أعلى لحجمها.", "a": "v032470ac3f6d"}, {"q": "الفكرة المهمة", "t": "ليصير المخلوق كبيرًا يحتاج إلى خلايا أكثر، لا إلى خلية أكبر فقط.", "a": "ve684a17563e1"}], "figs": ["f50a"], "key": "المخلوق الحي يبدأ من خلية واحدة، والخلية لا تكبر بلا حدود.", "sa": "v7566fae6a680"}, {"id": "L06-s4", "page": 51, "title": "أستكشفُ: كيفَ تصبحُ الخليةُ الواحدةُ عدةَ خلايَا؟", "book": "الهدفُ: كيفَ تصبحُ خليةٌ واحدةٌ مخلوقًا حيًّا مكتملَ النموِّ؟ لمعرفةِ المزيدِ عنْ هذَا الموضوعِ أفحصُ عددًا منَ الشرائحِ التي تبيِّنُ خلايَا في مراحلَ مختلفةٍ منَ الانقسامِ الخلويِّ، تلكَ العمليةِ التي تؤدِّي إلَى إنتاجِ المَزيدِ منَ الخلايَا.\nأحتاجُ إلى: شرائحَ جاهزةٍ تبينُ الانقسامَ الخلويَّ، مجهرٍ مركّبٍ، لوحةٍ كرتونيةٍ، مقصٍّ، شريطٍ لاصقٍ شفّافٍ، بطاقاتِ فهرسٍ بيضاءَ.\n١ ألاحظُ. أفحصُ الشريحةَ الأولى بقوةِ التكبيرِ الصغرَى للمجهرِ المركبِ، وأستخدمُ الضابطَ الكبيرَ لرؤيةِ الخلايا بصورةٍ واضحةٍ. وأستخدمُ الضابطَ الصغيرَ لجعلِ الرؤيةِ أكثرَ وضوحًا. أكرِّرُ ما قمتُ به مستخدمًا قوةَ تكبيرٍ أكبرَ. أسجّلُ التفاصيلَ التي ألاحظُها، وأرسمُ عيناتٍ من الخلايا التي شاهدتُها على بطاقاتِ الفهرسةِ. وأكرِّرُ هذه العمليةَ لكلِّ شريحةٍ.\n٢ أتواصلُ. أقارنُ ما رسمْتُه برسومِ زملائي في الصفِّ. أحدِّدُ أيَّ الخلايا تبدو في المرحلةِ نفسِها منَ الانقسامِ، وأيُّها يمرُّ بمراحلَ مختلفةٍ، وأناقشُ ذلكَ معَ أحدِ زملائي.\n٣ أصنّفُ. أحذرُ عندما أقصُّ أشكالَ الخلايا التي رسمتُهَا، وأجمعُ الأشكالَ التي تمرُّ بمرحلةِ الانقسامِ نفْسِها في مجموعةٍ واحدةٍ، ثم أقارنُ رسومي برسومِ زملائي في الصفِّ. أُقررُ معَ زملائي في الصفِّ عددَ مجموعاتِ الصورِ التي تمثلُ مراحلَ الانقسامِ.\nأستخلصُ النتائجَ\n٤ أختارُ رسمًا يمثلُ كلَّ مرحلةٍ منْ مراحلِ الانقسامِ وألصقُها بالتسلسلِ علَى لوحةٍ كرتونيةٍ؛ لعملِ مخططٍ يبيِّنُ مراحلَ الانقسامِ، وأحتفظُ بالمخططِ لاستخدامِه مرجعًا خلالَ هذَا الدرسِ.\nأستكشفُ أكثرَ\nهلْ يمكنُ ملاحظةُ المراحلِ نفسِها في الخلايَا النباتيةِ والخلايَا الحيوانيةِ؟ تُرَى، في أيِّ أجزاءِ النباتِ تحدثُ؟ أصمِّمُ استقصاءً لاختبارِ توقُّعي. وأجرِّبُ ذلكَ، وأشاركُ زملاءَ صفِّي في النتائجِ.", "simple": "في هذا النشاط ننظر بالمجهر إلى خلايا تنقسم. نرسمها، ثم نجمع الرسوم المتشابهة معًا. ثم نرتّبها لنرى مراحل الانقسام الخلوي بالتسلسل.", "steps": [{"q": "ما الهدف؟", "t": "معرفة كيف تصبح خلية واحدة مخلوقًا حيًّا مكتمل النمو.", "fig": "f51a", "a": "vd5e28f276452"}, {"q": "ماذا أفعل أولًا؟", "t": "أفحص كل شريحة بالمجهر المركّب، وأرسم الخلايا على بطاقات.", "fig": "f51b", "a": "vb0507aa6b5b5"}, {"q": "ثم ماذا؟", "t": "أقارن رسومي برسوم زملائي، وأجمع الخلايا التي في المرحلة نفسها.", "fig": "f51c", "a": "v3e282ac6bcf8"}, {"q": "ما النتيجة؟", "t": "أرتّب رسمًا لكل مرحلة بالتسلسل على لوحة، لأعرف مراحل الانقسام.", "a": "v1470c3015bc1"}, {"q": "انتبه", "t": "أحذر عند استعمال المقص.", "a": "ve15bc8eeeeeb"}], "figs": ["f51a", "f51b", "f51c"], "key": "الخلية تمرّ بمراحل مختلفة في أثناء الانقسام، ويمكن ترتيبها بالتسلسل.", "sa": "v9e4c4945e209"}, {"id": "L06-s5", "page": 52, "title": "مَا دَورةُ الخليةِ؟", "book": "تتكوَّنُ المخلوقاتُ الحيةُ جميعُها منْ خليةٍ واحدةٍ أوْ أكثرَ. وتنمُو الخلايا لفترةٍ زمنيةٍ محددةٍ، ثمَّ تتوقَّفُ عنِ النموِّ. وبعدَ أنْ يكتملَ نموُّها تموتُ بعضُ الخلايَا، وينقسمُ بعضُها الآخرُ لينتجَ خلايَا جديدةً لتعويضِ الخلايَا الميتةِ. وتُسمَّى هذهِ العمليةُ المستمرةُ منَ النموِّ والانقسامِ والتعويضِ دورةَ الخليةِ.\nقدْ تكونُ دورةُ الخليةِ سريعةً أوْ بطيئةً. ويعتمدُ ذلكَ على نوعِ المخلوقِ الحيِّ ونوعِ النسيجِ الذي توجدُ فيه الخليةُ. فالخليةُ البكتيريةُ مثلًا تستطيعُ أنْ تُنتجَ خليتينِ جديدتينِ كلَّ ٢٠ دقيقةً، والخليتانِ الجديدتانِ تُنتجانِ أربعَ خلايا جديدةٍ، وهكذا، وخلالَ ساعاتٍ قليلةٍ تستطيعُ خليةٌ واحدةٌ أنْ تنتجَ ملايينَ الخلايَا.\nحقيقةٌ: يقومُ جسمُ الإنسانِ باستبدالِ جميعِ خلايَا الدمِ الحمراءِ كلَّ ١٢٠ يومًا تقريبًا.", "simple": "الخلية تنمو مدة محددة ثم تتوقف. بعض الخلايا يموت، وبعضها ينقسم ليعوّض الميت. هذه العملية المستمرة اسمها دورة الخلية. وقد تكون سريعة أو بطيئة.", "steps": [{"q": "ماذا أرى؟", "t": "دائرة فيها خلايا صغيرة تكبر، ثم تنقسم، ثم تكبر من جديد.", "fig": "f52a", "parts": [], "a": "v0f1fef903859"}, {"q": "ما المراحل؟", "t": "ثلاث مراحل: نمو الخلية، والتهيؤ للانقسام، وانقسام الخلية.", "fig": "f52a", "parts": ["p1", "p2", "p3"], "a": "v8240bdada20e"}, {"q": "ماذا يحدث في كل مرحلة؟", "t": "تكبر الخلية، ثم تستعد، ثم تنقسم إلى خليتين صغيرتين.", "fig": "f52a", "parts": ["p2", "p3"], "a": "vf133131d20a7"}, {"q": "لماذا تنقسم الخلايا؟", "t": "لتعويض الخلايا الميتة، ولإنتاج خلايا جديدة.", "a": "v494a9a0afe82"}, {"q": "هل سرعتها واحدة؟", "t": "لا. تعتمد على نوع المخلوق ونوع النسيج. الخلية البكتيرية تنتج خليتين كل ٢٠ دقيقة.", "a": "v393eebedc764"}, {"q": "الفكرة المهمة", "t": "دورة الخلية: نمو ثم انقسام ثم تعويض، وتتكرر باستمرار.", "a": "v696ba7d7e28f"}], "figs": ["f52a"], "key": "دورة الخلية عملية مستمرة من النمو والانقسام والتعويض.", "sa": "v798b3217e4dc"}, {"id": "L06-s6", "page": 53, "title": "محدِّداتُ حجمِ الخليةِ", "book": "تنمُو الخلايَا إلى أحجامٍ مختلفةٍ. ومعظمُ الخلايَا صغيرةٌ جدًّا لا يمكنُ مشاهدتُها إلَّا بالمجهرِ. وهناكَ عواملُ متعددةٌ تمنعُ استمرارَ نموِّ الخليةِ، وتحدِّدُ حجمَهَا. ومنْ هذهِ العواملِ النسبةُ بينَ مساحةِ الغشاءِ البلازمِي وحجمِ الخليةِ. فكلُّ خليّةٍ تحتاجُ إلى الأكسجينِ والسكرِ وموادَّ مغذيةٍ أخرَى. ويجبُ أنْ تتخلَّصَ الخليةُ منَ الفضلاتِ. وهذهِ الموادُّ يجبُ أنْ تمرَّ عبرَ الغشاءِ البلازميِّ.\nوكلَّما نمتِ الخليةُ ازدادَ حجمُها، وازدادتْ كميةُ الموادِّ التي تحتاج إلى تبادُلِها معَ الوسطِ الخارجيِّ. لذلكَ لا بدَّ أنْ يقابلَ الزيادةَ في حجمِ الخليةِ زيادةٌ في مساحةِ الغشاءِ البلازميِّ. إلَّا أنَّ الغشاءَ البلازميَّ ينمُو بمعدلٍ أقلَّ من نموِّ حجمِ الخليةِ، فتصبحُ مساحةُ الغشاءِ غيرَ كافيةٍ لحصولِ الخليةِ على الموادِّ التِي تحتاجُ إليها، أو لتخلُّصِها منَ الفضلاتِ التي تنتجُها، لذلكَ تتوقَّفُ الخليةُ عنِ النموِّ.", "simple": "كل ما يدخل الخلية أو يخرج منها يمرّ عبر الغشاء البلازمي. عندما تكبر الخلية يزيد حجمها أسرع من مساحة غشائها. فلا يكفي الغشاء لإدخال الغذاء وإخراج الفضلات، فتتوقف عن النمو.", "steps": [{"q": "ماذا تحتاج الخلية؟", "t": "الأكسجين والسكر ومواد مغذية أخرى، وتحتاج أن تتخلص من الفضلات.", "a": "v07ad0e871cbe"}, {"q": "من أين تمر المواد؟", "t": "كل هذه المواد تمر عبر الغشاء البلازمي.", "a": "vc9d1ce895b43"}, {"q": "ماذا يحدث عندما تكبر؟", "t": "يزيد حجمها، وتزيد المواد التي تحتاج إلى تبادلها.", "a": "vdb93f54fd4ab"}, {"q": "أين المشكلة؟", "t": "الغشاء البلازمي ينمو بمعدل أقل من نمو حجم الخلية، فتصبح مساحته غير كافية.", "a": "v3009d36ce49f"}, {"q": "الفكرة المهمة", "t": "النسبة بين مساحة الغشاء البلازمي وحجم الخلية تحدد حجمها، فتتوقف عن النمو.", "a": "v6cb3e1319f1a"}], "figs": [], "key": "تتوقف الخلية عن النمو لأن مساحة غشائها لا تكفي لحجمها الكبير.", "sa": "v061b41e173c9"}, {"id": "L06-s7", "page": 53, "title": "مرضُ السرطانِ ودورةُ الخليةِ", "book": "تعملُ بعضُ البروتيناتِ والموادُّ الكيميائيةُ في المخلوقاتِ الحيةِ على نموِّ الخلايا وانقسامِها. وعندَما يحدثُ خللٌ قدْ يسبِّبُ مشكلاتٍ خطيرةً. ومنْ هذهِ المشكلاتِ مرضُ السرطانِ. يحدثُ هذا المرضُ عندَما لا يتمُّ السيطرةُ على انقسامِ الخلايَا ونُموِّها. وقد يؤدِّي النموُّ السريعُ للخلايَا إلى تكوُّنِ الأورامِ، أو تكوُّنِ تجمُّعاتٍ للخلايَا السرطانيةِ. وبعضُ أنواعِ السَّرَطانِ تهدِّدُ حياةَ الإنسانِ.\nفي هذه الصورةِ التي أُخذتْ بالمجهرِ الإلكترونيِّ تَظهرُ الخليةُ الأكولةُ بلونٍ أرجوانيٍّ وهيَ تلتهمُ خليةً سرطانيةً ذاتَ لونٍ أصفرَ. الخليةُ الأكولةُ خليةُ دمٍ بيضاءُ.", "simple": "بعض البروتينات والمواد الكيميائية تنظّم نمو الخلايا وانقسامها. إذا حدث خلل، قد تنقسم الخلايا بلا سيطرة. هذا هو مرض السرطان، وقد تتكوّن أورام.", "steps": [{"q": "ماذا أرى؟", "t": "صورة بالمجهر الإلكتروني: خلية أرجوانية تلتهم خلية صفراء.", "fig": "f53a", "a": "vfc257078cd2c"}, {"q": "ما الخليتان؟", "t": "الأرجوانية هي الخلية الأكولة، وهي خلية دم بيضاء. والصفراء خلية سرطانية.", "a": "vb504e1ccf028"}, {"q": "ماذا ينظم الانقسام؟", "t": "بعض البروتينات والمواد الكيميائية في المخلوق الحي.", "a": "vbd1a650d67ed"}, {"q": "متى يحدث السرطان؟", "t": "عندما لا تتم السيطرة على انقسام الخلايا ونموها.", "a": "v67ec8a63d70f"}, {"q": "الفكرة المهمة", "t": "النمو السريع غير المضبوط للخلايا قد يكوّن أورامًا.", "a": "vd19eb907f4c4"}], "figs": ["f53a"], "key": "السرطان يحدث عندما لا تتم السيطرة على انقسام الخلايا ونموها.", "sa": "v455626f66ce3"}, {"id": "L06-s8", "page": 54, "title": "ما الانقسامُ المتساوِي؟", "book": "هاتانِ الخليتانِ الحيوانيتينِ متماثلتانِ؛ لأنَّهما أُنتِجَتا من المادةِ الوراثيةِ نفسِها لتقومَا بالوظيفةِ نفسِها.\nتوجَدُ داخلَ نواةِ الخليةِ أشرطةٌ صغيرةٌ، تحملُ في داخلِها تفاصيلَ كاملةً عنِ المخلوقِ الحيِّ تسمَّى الكروموسوماتِ. ومعظمُ خلايَا الإنسانِ تحتوِي على ٤٦ كروموسومًا. فهلْ إذَا انقسمتِ الخليةُ إلى جزأَينِ بالتساوِي ستحتوِي كلُّ خليةٍ جديدةٍ علَى نصفِ العددِ الأصليِّ منَ الكروموسوماتِ؟ لو حدثَ ذلكَ لسبَّبَ مشكلاتٍ خطيرةً لجميعِ أنواعِ الخلايَا.\nأمَّا مَا يحدثُ فهوَ أنَّ الخليةَ تُضاعِفُ كروموسوماتِها حتَّى يكونَ لدَيها مجموعةٌ ثانيةٌ مماثلةٌ، ثم تنقسمُ الخليةُ. وعندئذٍ تتكوَّنُ خليتانِ متماثلتانِ، في نواةِ كلٍّ منهما مجموعةٌ كاملةٌ منَ الكروموسوماتِ. وتُسمَّى هذهِ العمليةُ الانقسامَ المتساويَ.", "simple": "في النواة أشرطة صغيرة تحمل تفاصيل المخلوق، اسمها الكروموسومات. قبل الانقسام تضاعف الخلية كروموسوماتها. ثم تنقسم إلى خليتين متماثلتين، لكلٍّ منهما مجموعة كاملة. هذا هو الانقسام المتساوي.", "steps": [{"q": "ماذا أرى؟", "t": "خلايا حيوانية، وإحداها تنقسم إلى خليتين متماثلتين.", "fig": "f54a", "a": "v5d120af20b67"}, {"q": "ما الكروموسومات؟", "t": "أشرطة صغيرة داخل النواة، تحمل تفاصيل كاملة عن المخلوق الحي.", "a": "vfa26e15a1323"}, {"q": "كم عددها في الإنسان؟", "t": "معظم خلايا الإنسان فيها ٤٦ كروموسومًا.", "a": "v6dc3dc9293f2"}, {"q": "ماذا تفعل الخلية قبل الانقسام؟", "t": "تضاعف كروموسوماتها لتكون لديها مجموعة ثانية مماثلة.", "a": "vf1f39f4e7226"}, {"q": "ما النتيجة؟", "t": "خليتان متماثلتان، في نواة كل منهما مجموعة كاملة من الكروموسومات.", "a": "v0e37847497c4"}, {"q": "الفكرة المهمة", "t": "الانقسام المتساوي لا يُنقص عدد الكروموسومات، لأن الخلية تضاعفها أولًا.", "a": "v7526bc4476d3"}], "figs": ["f54a"], "key": "في الانقسام المتساوي تضاعف الخلية كروموسوماتها ثم تنقسم إلى خليتين متماثلتين.", "sa": "vc418d526fc78"}, {"id": "L06-s9", "page": 54, "title": "الانقسامُ المتساوي في النباتاتِ والحيواناتِ", "book": "يحدثُ الانقسامُ المتساوِي عندَ أيِّ عمليةِ انقسامٍ في نوعٍ معيَّنٍ منْ خلايَا الجسمِ يُسمَّى الخلايَا الجسميَّةَ، ومنها خلايَا الجلدِ، وخلايَا العظامِ، وخلايا الدمِ البيضاءُ وخلايا العضلاتِ. وفي عامِ ١٨٧٩م لاحظَ العالِمُ الألمانيُّ والتر فليمنج خلايَا في أطوارٍ مختلفةٍ منَ الانقسامِ عنْ طريقِ إضافةِ صبغةٍ إلى شريحةٍ خليَّةٍ، ثمَّ رسمَ ما شاهدَهُ بالمجهرِ.\nعندَمَا تبدأُ الخليةُ الجسميةُ في الانقسامِ إلى خليتينِ متماثلتينِ تتضاعفُ الكروموسوماتُ داخلَ الخليةِ، ثُمَّ تبدأُ في الاصطفافِ لتكوينِ مجموعتينِ منفصلتينِ ومتماثلتينِ من الكروموسوماتِ في الخليةِ. ثم تنتقلُ كلُّ مجموعةٍ منَ الكروموسوماتِ إلى أحدِ طرفَيِ الخليةِ. وعندَما تنقسمُ الخليةُ إلى خليتينِ جديدتينِ تحتوِي كلُّ خليةٍ جسميَّةٍ جديدةٍ على مجموعةٍ كاملةٍ من الكروموسوماتِ المماثلةِ تمامًا لكروموسوماتِ الخليةِ الأصليةِ.\nوتمرُّ الخلايا النباتيةُ والخلايَا الحيوانيةُ بالانقسامِ المتساوِي. ولكن بسببِ وجودِ جدارٍ خلويٍّ حولَ الخليةِ النباتيةِ تتكوَّنُ صفيحةٌ خلويةٌ تشبهُ امتدادًا للجدارِ الخلويِّ تفصلُ بين الخليتينِ الجديدتينِ. أمّا في الخلايا الحيوانيةِ فإنَّ الغشاءَ البلازميَّ يضيقُ إلى الداخلِ منْ وسطِ الخليةِ.\nويَنتجُ عن الانقسامِ المتساوِي في كلٍّ من الخليةِ النباتيةِ والخليةِ الحيوانيةِ خليتانِ تماثلُ كلٌّ منهُما الخليةَ الأصليةَ.", "simple": "الانقسام المتساوي يحدث في الخلايا الجسمية، مثل خلايا الجلد والعظام والعضلات. يحدث في النبات والحيوان. الفرق في النهاية: النبات تتكوّن فيه صفيحة خلوية، والحيوان يضيق غشاؤه من الوسط.", "steps": [{"q": "أين يحدث؟", "t": "في الخلايا الجسمية: خلايا الجلد، والعظام، والدم البيضاء، والعضلات.", "a": "vd7cf61bda82b"}, {"q": "من لاحظه؟", "t": "العالم الألماني والتر فليمنج سنة ١٨٧٩م، بصبغة وشريحة ومجهر.", "a": "vdc306b7efc6d"}, {"q": "ماذا يحدث للكروموسومات؟", "t": "تتضاعف، ثم تصطف في مجموعتين متماثلتين، ثم تنتقل كل مجموعة إلى طرف.", "a": "vfc0e6336f178"}, {"q": "كيف تنفصل الخلية النباتية؟", "t": "تتكوّن صفيحة خلوية تشبه امتدادًا للجدار الخلوي بين الخليتين.", "a": "v05f0520983be"}, {"q": "كيف تنفصل الخلية الحيوانية؟", "t": "يضيق الغشاء البلازمي إلى الداخل من وسط الخلية.", "a": "v1f96ba56951d"}, {"q": "الفكرة المهمة", "t": "في النبات والحيوان، ينتج الانقسام المتساوي خليتين تماثل كل منهما الأصلية.", "a": "v809ea0659baf"}], "figs": [], "key": "الانقسام المتساوي يحدث في الخلايا الجسمية للنبات والحيوان، وينتج خليتين مماثلتين للأصلية.", "sa": "v26f587f84e62"}, {"id": "L06-s10", "page": 55, "title": "الانقسامُ المتساوي", "book": "١ تشاهَدُ النواةُ بوضوحٍ، وعندَ بدءِ الانقسامِ المتساوِي يتضاعفُ عددُ الكروموسوماتِ في نواةِ الخليةِ.\n٢ تصبحُ الكروموسوماتُ مرئيةً، ويبدأُ الغلافُ المحيطُ بالنواةِ في التلاشي.\n٣ تصطفُ الكروموسوماتُ المتضاعفةُ عندَ وسطِ الخليةِ.\n٤ تنفصلُ الكروموسوماتُ المتضاعفةُ بعضُها عن بعضٍ، وتبدأُ الحركةَ في اتجاهَينِ متضادَّينِ، وتستطيلُ الخليةُ.\n٥ يتكوَّنُ غلافٌ نوويٌّ حولَ كلِّ مجموعةٍ منَ الكروموسوماتِ. بعد ذلك ينقسمُ السيتوبلازمُ، ويُنتِجُ خليتينِ، ثم تبدأُ كلُّ خليةٍ في الانقسامِ.", "simple": "الشكل يبيّن خمس خطوات للانقسام المتساوي. تتضاعف الكروموسومات، ثم تظهر، ثم تصطف في الوسط. ثم تبتعد إلى طرفين، ثم تتكوّن خليتان.", "steps": [{"q": "ماذا أرى؟", "t": "خمس صور بالمجهر، من الأعلى إلى الأسفل، لخلية تنقسم.", "fig": "f55a", "parts": [], "a": "vb61a67ca9d1c"}, {"q": "الخطوة ١", "t": "النواة واضحة، ويتضاعف عدد الكروموسومات.", "fig": "f55a", "parts": ["p1"], "a": "v67953a45a940"}, {"q": "الخطوتان ٢ و٣", "t": "تظهر الكروموسومات ويتلاشى غلاف النواة، ثم تصطف في وسط الخلية.", "fig": "f55a", "parts": ["p2", "p3"], "a": "veb1682f5ee07"}, {"q": "الخطوتان ٤ و٥", "t": "تبتعد الكروموسومات في اتجاهين، ثم يتكوّن غلاف نووي حول كل مجموعة.", "fig": "f55a", "parts": ["p4", "p5"], "a": "vec4fc705941c"}, {"q": "الفكرة المهمة", "t": "ينقسم السيتوبلازم في النهاية، فتنتج خليتان متماثلتان.", "a": "vea66c0d8ba2e"}], "figs": ["f55a"], "key": "يمر الانقسام المتساوي بخمس خطوات تنتهي بخليتين متماثلتين.", "sa": "vbd56e24f46d5"}, {"id": "L06-s11", "page": 56, "title": "ما الانقسامُ المنصِّفُ؟", "book": "تَنتجُ المخلوقاتُ الحيةُ بالتكاثرِ. وتتكاثرُ المخلوقاتُ الوحيدةُ الخليةِ عن طريقِ انقسامِ الخليةِ. أمَّا في معظمِ الحيواناتِ والنباتاتِ فتتحدُ كروموسوماتٌ منَ الأبوينِ معًا في عمليةٍ تُسمَّى التكاثرَ الجنسيَّ.\nوفي هذا النوعِ منَ التكاثرِ يُنتِجُ كلٌّ منَ الأبِ والأمِّ خلايا جنسيةً. وتُسمَّى الخليةُ الجنسيةُ الذكريةُ المشيجَ المذكرَ (الحيوانَ المنويَّ)، وهو صغيرٌ جدًّا، وقادرٌ على الحركةِ ذاتيًّا. أمّا الخليةُ الجنسيةُ الأنثويةُ فتُسمَّى المشيجَ المؤنثَ (البويضةَ)، وهيَ أكبرُ منَ الحيوانِ المنويِّ، ولا تتحرّكُ ذاتيًّا. وتتّحدُ هاتانِ الخليتانِ معًا لتكوِّنا خليةً مخصبةً (تسمَّى الزَّيْجُوتَ أوِ اللاقحةَ). وتنمُو الخليةُ المخصبةُ فتصبحُ مخلوقًا حيًّا جديدًا.\nتحتوِي معظمُ خلايَا جسمِ الإنسانِ على ٤٦ كروموسومًا. فإذَا كانَ عددُ الكروموسوماتِ في المشيجِ المذكرِ ٤٦ وفي المشيجِ المؤنثِ ٤٦ كروموسومًا، فماذا يمكنُ أنْ يحدثَ عندَما يندمجانِ معًا؟ هل تحتوِي الخليةُ المخصبةُ الجديدةُ على ٩٢ كروموسومًا، وهو ضعفُ العددِ الذي يجبُ أنْ يكونَ في كلِّ خليةٍ؟\nإنَّ الخليةَ المخصبةَ لا تحتوِي فعلاً على ضعفِ عددِ الكروموسوماتِ الموجودةِ في الخليةِ العاديةِ. ويرجعُ ذلكَ إلى أنَّ كلًّا منَ المشيجِ المذكرِ والمشيجِ المؤنثِ يتكوّنانِ بفعلِ انقسامٍ خلويٍّ يُسمَّى الانقسامَ المنصِّفَ (الاختزاليَّ)، حيثُ تنقسمُ النواةُ مرتينِ، فينتجُ أربعُ خلايا جنسيةٍ جديدةٍ في نواةِ كلٍّ منها نصفُ العددِ الأصليِّ منَ كروموسوماتِ الخليةِ الأصليةِ. وكلُّ خليةٍ جنسيةٍ في الإنسانِ تحتوِي على ٢٣ كروموسومًا. ويتّحدُ المشيجُ المذكرُ معَ المشيجِ المؤنثِ لتكوينِ الخليةِ المخصبةِ، التي تحتوِي على ٤٦ كروموسومًا، فتشبهُ بذلكَ الخليةَ الأصليةَ الأمَّ عندَ كِلا الأبوينِ. ونتيجةً لذلكَ ينتقلُ إلى الابنِ كروموسوماتٌ منْ كِلا الأبوينِ، وتنتقلُ إليهِ صفاتٌ وراثيةٌ منَ الأبوينِ.\nالانقسامُ المنصِّفُ: خلالَ الأطوارِ المبكرةِ منَ الانقسامِ المنصِّفِ يتمُّ نسخُ الكروموسوماتِ وتضاعفُها. وفي الأطوارِ اللاحقةِ يحدثُ انقسامانِ للخليةِ، وتنتجُ أربعُ خلايا، في كلٍّ منها نصفُ العددِ الأصليِّ منَ الكروموسوماتِ، مقارنةً بالخليةِ الأصليةِ.", "simple": "في التكاثر الجنسي يُنتج الأب مشيجًا مذكرًا، وتُنتج الأم مشيجًا مؤنثًا. يتحدان فتتكوّن خلية مخصبة (لاقحة). الأمشاج تتكوّن بالانقسام المنصّف، فيها نصف عدد الكروموسومات: ٢٣ في الإنسان. فتصبح اللاقحة ٤٦ لا ٩٢.", "steps": [{"q": "ماذا أرى؟", "t": "خلية أصلية تنقسم مرتين، فتنتج أربع خلايا. نقرأ الشكل من اليمين إلى اليسار.", "fig": "f56a", "parts": [], "a": "v2aaca3ee147c"}, {"q": "الانقسام الأول", "t": "تتضاعف الكروموسومات، ثم تصطف في أزواج، ثم تبتعد الأزواج، ثم تنقسم الخلية.", "fig": "f56a", "parts": ["p1", "p2", "p3", "p4", "p5"], "a": "v3326f467b680"}, {"q": "الانقسام الثاني", "t": "تصطف الكروموسومات المزدوجة، ثم تبتعد، ثم تنقسم كل خلية مرة ثانية.", "fig": "f57a", "parts": ["p1", "p2", "p3"], "a": "ve4656e3c574a"}, {"q": "ما الأمشاج؟", "t": "المشيج المذكر (الحيوان المنوي) صغير ويتحرك ذاتيًّا. المشيج المؤنث (البويضة) أكبر ولا يتحرك ذاتيًّا.", "a": "vccdc464134d1"}, {"q": "لماذا النصف؟", "t": "٢٣ من الأب + ٢٣ من الأم = ٤٦ في اللاقحة، مثل الخلية الأصلية.", "a": "v082a5d36fa7b"}, {"q": "الفكرة المهمة", "t": "الانقسام المنصّف: انقسامان، وأربع خلايا، في كل منها نصف عدد الكروموسومات.", "a": "vdd94559fe83e"}], "figs": ["f56a", "f57a"], "key": "الانقسام المنصّف ينتج أربع خلايا جنسية، في كل منها نصف عدد كروموسومات الخلية الأصلية.", "sa": "v37faa09d9eea"}, {"id": "L06-s12", "page": 57, "title": "المقارنةُ بينَ الانقسامِ المتساوي والانقسامِ المنصِّفِ", "book": "الانقسامُ المتساوِي يشبهُ نوعًا مَا الانقسامَ المنصِّفَ. وكلاهما يبدأُ في النواةِ، وبعدَ مضاعفةِ الكروموسوماتِ تكونُ الخلايا في كِلا الانقسامينِ أكثرَ منَ الخلايا الأصليةِ.\nومعَ ذلكَ، فهناكَ فروقٌ واضحةٌ بينَ نوعَي الانقسامِ. وأكثرُ الفروقِ أهميةً أنَّ الخلايا الناتجةَ عنْ الانقسامِ المتساوِي تحتوِي علَى العددِ نفسِه منْ كروموسوماتِ الخليةِ الأصليةِ. أمَّا في الانقسامِ المنصِّفِ فتحتوِي الخليةُ الناتجةُ على نصفِ العددِ الأصليِّ منَ الكروموسوماتِ. ولكي يتحقّقَ ذلكَ يحدثُ انقسامانِ في الانقسامِ المنصِّفِ، بينما يحدث انقسامٌ واحدٌ في الانقسامِ المتساوِي. ومنْ ذلكَ أيضًا أنَّ عددَ الخلايَا الناتجةِ في الانقسامِ المتساوِي خليتانِ جديدتانِ، في حينِ يكونُ في الانقسامِ المنصّفِ أربعُ خلايا جديدةٍ.", "simple": "الانقسامان يبدآن في النواة، وتتضاعف فيهما الكروموسومات أولًا. المتساوي: انقسام واحد، خليتان، العدد نفسه من الكروموسومات. المنصّف: انقسامان، أربع خلايا، نصف العدد.", "steps": [{"q": "فيمَ يتشابهان؟", "t": "كلاهما يبدأ في النواة، وبعد مضاعفة الكروموسومات تصبح الخلايا أكثر من الأصلية.", "a": "va6fe5e6f9a0a"}, {"q": "الفرق الأهم", "t": "المتساوي: العدد نفسه من الكروموسومات. المنصّف: نصف العدد.", "a": "v457034fa98d7"}, {"q": "كم انقسامًا؟", "t": "المتساوي انقسام واحد، والمنصّف انقسامان.", "a": "vd664a5a88420"}, {"q": "كم خلية تنتج؟", "t": "المتساوي خليتان جديدتان، والمنصّف أربع خلايا جديدة.", "a": "v17bf276fa11e"}, {"q": "الفكرة المهمة", "t": "تذكّر: متساوي = ١ انقسام، ٢ خلية، العدد كامل. منصّف = ٢ انقسام، ٤ خلايا، نصف العدد.", "a": "vc6a29270022d"}], "figs": [], "key": "الفرق الأهم: خلايا المتساوي فيها العدد نفسه من الكروموسومات، وخلايا المنصّف فيها نصفه.", "sa": "v03692a7bddd8"}, {"id": "L06-s13", "page": 57, "title": "نَشاطٌ: الانقسامُ المُتساوي", "book": "١ أتفحّصُ مجموعةَ صورٍ مختلفةٍ لأطوارِ الانقسامِ المُتَساوِي. وأستعملُ الرسومَ التي رسمتُها في نشاطِ أستكشفُ إنْ وجدتْ.\n٢ أقارنُ. أدقّقُ جيدًا في كلِّ صورةٍ آخذًا في الاعتبارِ أطوارَ الانقسامِ المُتساوِي. فإذا كانت الصورُ منَ الطورِ نفسِه أضعُها معًا.\n٣ أصنفُ ما المجموعةُ التي تنتمي إليها كلُّ صورةٍ؟ أضعُ الصورَ في فئاتِ المجموعاتِ المناسبةِ، وأكونُ مستعدًّا لتوضيحِ ذلكَ.\n٤ أفسّرُ البياناتِ. أعملُ ضمنَ مجموعةٍ منْ زملائي لترتيبِ الصورِ بحسبِ أطوارِها. وأكتبُ تعريفَ كلِّ طورٍ، وشروحاتٍ عنهُ، مَعَ رسمٍ توضيحيٍّ.", "simple": "نتفحص صورًا لأطوار الانقسام المتساوي. نجمع الصور المتشابهة، ثم نصنّفها ونرتّبها. ثم نكتب تعريف كل طور مع رسم.", "steps": [{"q": "ماذا أرى؟", "t": "طالب يرتّب بطاقات عليها رسوم خلايا.", "fig": "f57b", "a": "v7d0b6d49b672"}, {"q": "ماذا أفعل؟", "t": "أتفحص صور أطوار الانقسام المتساوي، وأستعمل رسومي من نشاط أستكشف.", "a": "vb31ba8567ee8"}, {"q": "كيف أجمعها؟", "t": "أضع الصور التي من الطور نفسه معًا، وأصنّفها في مجموعات.", "a": "v2489acbbab56"}, {"q": "كيف أرتّبها؟", "t": "أرتّبها بحسب خطوات الانقسام المتساوي الخمس في الشكل.", "fig": "f55a", "a": "v965eec47d545"}, {"q": "الفكرة المهمة", "t": "موقع الكروموسومات وشكل النواة يدلّان على الطور.", "a": "v94ea6c12611c"}], "figs": ["f57b", "f55a"], "key": "يمكن تصنيف صور الانقسام المتساوي وترتيبها بحسب أطوارها.", "sa": "v1ecee6d1ee58"}, {"id": "L06-s14", "page": 58, "title": "ما مدّةُ الحياةِ؟", "book": "كما يوجدُ للخليةِ دورةُ حياةٍ، فإنَّ المخلوقاتِ الحيةَ لها دوراتُ نموٍّ وتكاثرٍ، ثمَّ تموتُ. ومراحلُ نموِّ المخلوقِ الحيِّ تكوّنُ دورةَ حياتِه. وتشتملُ دورةُ حياةِ الحيوانِ على الولادةِ والنضجِ والتكاثرِ والهرمِ والموتِ. يقول تعالى: ﴿ وَقَدْ خَلَقَكُمْ أَطْوَارًا ﴿١٤﴾ ﴾ نوح. وأطولُ فترةٍ زمنيةٍ يعيشُها المخلوقُ في أفضلِ الظروفِ تُسمَّى مدةَ الحياةِ. ومدةُ حياةِ المخلوقِ الحيِّ صفةٌ مشتركةٌ بينَ أفرادِ نوعِه. ومن ذلكَ مثلًا أنَّ النباتاتِ الحوليةَ نباتاتٌ زهريةٌ مدّةُ حياتِها سنةٌ تقريبًا. ونباتَ الصنوبرِ ذو المخاريطِ الشوكيةِ لهُ مدةُ حياةٍ أكثرُ من ٧٠٠٠ سنةٍ.\nوالعمرُ المتوقَّعُ له هو مقدارُ الزمنِ الذي سيعيشُه المخلوقُ الحيُّ. ويختلفُ مقدارُ العمرِ المتوقعِ للمخلوقِ الحيِّ اعتمادًا على الظروفِ التي يعيشُها.\nوتؤثرُ الظروفُ البيئيةُ في العمرِ المتوقعِ، ومنها توافرُ كميةِ الغذاءِ والماءِ. لكنَّ هذهِ العواملَ لا تؤثرُ في مدةِ الحياةِ. ومثالُ ذلكَ، فإن متوسطَ العمرِ للناسِ في المملكةِ العربيَّةِ السُّعوديَّةِ حوالي ٧٣ سنةً، ولكنَّ مدةَ الحياةِ التي قدْ يعيشُها الإنسانُ لا يعلمها إلا الله، فقدْ تمتدُّ إلى أكثرَ منْ ١٠٠ سنةٍ. يقول تعالى: ﴿ وَلِكُلِّ أُمَّةٍ أَجَلٌ فَإِذَا جَآءَ أَجَلُهُمْ لَا يَسْتَأْخِرُونَ سَاعَةً وَلَا يَسْتَقْدِمُونَ ﴿٣٤﴾ ﴾ الأعراف.\nالعمرُ المتوقعُ ومدةُ الحياةِ (جدول):\nالمخلوقُ الحيُّ | معدلُ العمرِ المتوقعُ | أطولُ مدةِ حياةٍ\nذبابةُ المنزلِ | ١٥-٣٠ يومًا | ٧٢ يومًا\nالكلبُ | ١٢ سنةً | ٢٩ سنةً\nالقطُّ | ١٥ سنةً | ٣٤ سنةً\nالدلفينُ | ٢٠ سنةً | ٥٠ سنةً\nالحصانُ | ٢٥ سنةً | ٦٢ سنةً\nالسلحفاةُ | ١٠٠ سنةً | أكثرُ منْ ١٠٠ سنةٍ\nقصبُ السكرِ | ١٠٠ سنةٍ | ٢٥٠ سنةً\nالصنوبرُ ذو المخاريطِ الشوكيةِ | حتى ٧٠٠٠ سنةٍ | إذ يقدر عمرها بأربعة آلاف وسبعمائة عاما", "simple": "للمخلوق الحي دورة حياة: ولادة، ثم نضج، ثم تكاثر، ثم هرم، ثم موت. مدة الحياة: أطول زمن يعيشه المخلوق في أفضل الظروف، وهي صفة مشتركة في نوعه. العمر المتوقع: الزمن الذي سيعيشه، ويتأثر بالظروف مثل الغذاء والماء.", "steps": [{"q": "ماذا أرى؟", "t": "سلحفاة عملاقة تعيش طويلًا، وجدولًا لأعمار مخلوقات مختلفة.", "fig": "f58a", "a": "v5763ed0ec871"}, {"q": "ما دورة حياة الحيوان؟", "t": "الولادة، والنضج، والتكاثر، والهرم، والموت.", "a": "v841cab12c85a"}, {"q": "ما مدة الحياة؟", "t": "أطول فترة يعيشها المخلوق في أفضل الظروف، وهي مشتركة بين أفراد نوعه.", "a": "v2361588b7cf1"}, {"q": "ما العمر المتوقع؟", "t": "مقدار الزمن الذي سيعيشه المخلوق، ويختلف بحسب ظروفه.", "a": "v19ff171dd1aa"}, {"q": "ما الفرق بينهما؟", "t": "الغذاء والماء يؤثران في العمر المتوقع، ولا يؤثران في مدة الحياة.", "fig": "f58c", "a": "vb55b2ec477e0"}, {"q": "الفكرة المهمة", "t": "الأعمار بيد الله: متوسط العمر في المملكة حوالي ٧٣ سنة، وقد تمتد الحياة أكثر من ١٠٠ سنة.", "a": "vaf895b3ca748"}], "figs": ["f58a", "f58b", "f58c"], "key": "مدة الحياة أطول زمن يعيشه المخلوق في أفضل الظروف، والعمر المتوقع يتأثر بالظروف.", "sa": "v74145d6155b3"}, {"id": "L06-s15", "page": 59, "title": "مراجعةُ الدرسِ: ملخّصٌ مصوّرٌ", "book": "تتضمّنُ دورةُ الخليةِ نموَّ الخليةِ وانقسامَها.\nالانقسامُ المتساوي عمليةٌ تنقسمُ فيها الخليةُ لتنتجَ خليتانِ متماثلتانِ.\nالانقسامُ المنصِّفُ عمليةٌ ينتجُ عنها أربعُ خلايا، كلُّ خليةٍ تحتوي على نصفِ عددِ الكروموسوماتِ في الخليةِ الأصليةِ.\nالمَطْوِيّاتُ أنظّمُ أفكاري: أعملُ مطويّةً كالمبيَّنةِ في الشكلِ ألخّصُ فيها ما تعلَّمتُه حولَ انقسامِ الخليةِ.\nالأفكارُ الرئيسةُ | ماذا تعلّمتُ؟ | رسوم\nدورةُ الخليةِ |  | \nالانقسامُ المتساوي |  | \nالإنقسامُ المنصفُ |  | ", "simple": "الدرس في ثلاث أفكار: دورة الخلية نمو وانقسام. الانقسام المتساوي ينتج خليتين متماثلتين. الانقسام المنصّف ينتج أربع خلايا بنصف عدد الكروموسومات.", "steps": [{"q": "الفكرة ١", "t": "دورة الخلية تتضمن نمو الخلية وانقسامها.", "fig": "f59a", "a": "v13cb37799335"}, {"q": "الفكرة ٢", "t": "الانقسام المتساوي ينتج خليتين متماثلتين.", "fig": "f59b", "a": "v39dd11e70dc1"}, {"q": "الفكرة ٣", "t": "الانقسام المنصّف ينتج أربع خلايا، في كل منها نصف عدد الكروموسومات.", "fig": "f59c", "a": "v9cef65ed3d08"}, {"q": "ماذا أفعل الآن؟", "t": "أعمل مطوية من ثلاثة صفوف، وأكتب في كل صف ما تعلمته وأرسم.", "fig": "f59d", "a": "vcfdc3aaa4fbb"}], "figs": ["f59a", "f59b", "f59c", "f59d"], "key": "دورة الخلية نمو وانقسام، والانقسام نوعان: متساوٍ ومنصّف.", "sa": "v2d655022229f"}], "questions": [{"id": "L06-q1", "page": 48, "section": "الفكرةُ العامّةُ", "type": "open", "text": "كيف تَنقُلُ المخلوقاتُ الحيةُ الصفاتِ إلى أبنائِها؟", "answerText": "بالوراثة: تنتقل الصفات الموروثة من الآباء إلى الأبناء. فالمشيج المذكر والمشيج المؤنث فيهما كروموسومات، ويتحدان فتنتقل إلى الابن كروموسومات وصفات من الأبوين.", "what": "يسألك: بأي طريقة تصل صفات الآباء إلى الأبناء؟", "hint": "ابحث عن معنى كلمة «الوراثة» في مفردات ص٤٩، ثم آخر فقرة في ص٥٦.", "explain": "الوراثة هي انتقال الصفات الموروثة من الآباء إلى الأبناء. وفي ص٥٦: يتحد المشيجان فتنتقل إلى الابن كروموسومات وصفات وراثية من الأبوين.", "solve": ["الصفات تنتقل بالوراثة.", "كل من الأب والأم يُنتج مشيجًا فيه نصف الكروموسومات.", "يتحد المشيجان فيأخذ الابن كروموسومات وصفات من الأبوين."], "keys": [{"t": "بالوراثة", "alts": ["الوراثه", "وراثة", "وراثه"]}, {"t": "عن طريق الكروموسومات في الأمشاج", "alts": ["كروموسوم", "مشيج", "امشاج"]}], "back": "L06-s11", "fig": null, "evp": 56, "oos": null, "left": [], "right": [], "items": [], "qa": "ve939884b6773", "ea": "v0b0b15867025", "wa": "vceb53fb23973", "ha": "v9f32ba6af411", "whyA": {}}, {"id": "L06-q2", "page": 48, "section": "الأسئلةُ الأساسيةُ", "type": "open", "text": "الدرسُ الأولُ: كيفَ تُنتجُ الخليةُ خلايا جديدةً؟", "answerText": "بالانقسام: تنمو الخلية ثم تنقسم (دورة الخلية). في الانقسام المتساوي تتضاعف الكروموسومات ثم تنقسم لية مرات كثيرة فيزيد عددها.", "solve": ["الخلية تنمو حتى حد معين.", "ثم تنقسم إلى خليتين.", "تتكرر دورة الخلية فيزيد عدد الخلايا كثيرًا."], "keys": [{"t": "تنقسم الخلية", "alts": ["تنقسم", "انقسام"]}, {"t": "يزيد عدد الخلايا", "alts": ["عدد", "تزيد", "يزداد", "خلايا كثيرة"]}], "back": "L06-s5", "fig": "f50a", "evp": 52, "oos": null, "left": [], "right": [], "items": [], "qa": "v263b871a8f6f", "ea": "vbdf523ed1aed", "wa": "ved8dc64dbfd1", "ha": "v5285ec3fde71", "whyA": {}}, {"id": "L06-q5", "page": 51, "section": "أستكشفُ: الخطواتُ", "type": "open", "text": "ألاحظُ. أفحصُ الشريحةَ الأولى بقوةِ التكبيرِ الصغرَى للمجهرِ المركبِ، وأستخدمُ الضابطَ الكبيرَ لرؤيةِ الخلايا بصورةٍ واضحةٍ. وأستخدمُ الضابطَ الصغيرَ لجعلِ الرؤيةِ أكثرَ وضوحًا. أكرِّرُ ما قمتُ به مستخدمًا قوةَ تكبيرٍ أكبرَ. أسجّلُ التفاصيلَ التي ألاحظُها، وأرسمُ عيناتٍ من الخلايا التي شاهدتُها على بطاقاتِ الفهرسةِ. وأكرِّرُ هذه العمليةَ لكلِّ شريحةٍ.", "answerText": "أرى خلايا في مراحل مختلفة من الانقسام: بعضها نواته واضحة، وبعضها كروموسوماته ظاهرة أو مصطفة أو متباعدة، وبعضها انقسم إلى خليتين.", "what": "المطلوب أن تلاحظ الخلايا بالمجهر وترسمها.", "hint": "انظر إلى شكل الكروموسومات وموقعها في كل خلية، وقارن بشكل ص٥٥.", "explain": "الشرائح تبيّن خلايا في مراحل مختلفة من الانقسام الخلوي، كما في شكل الانقسام المتساوي ص٥٥.", "solve": ["أبدأ بالتكبير الصغير والضابط الكبير.", "أوضح الصورة بالضابط الصغير ثم بتكبير أكبر.", "أرسم ما أراه على بطاقة لكل شريحة."], "keys": [{"t": "خلايا في مراحل مختلفة من الانقسام", "alts": ["مراحل", "انقسام", "كروموسوم"]}], "back": "L06-s4", "fig": "f51b", "evp": 55, "oos": null, "left": [], "right": [], "items": [], "qa": "vee4e732b833d", "ea": "v898139267728", "wa": "vd7f8a6f9ec4f", "ha": "v0162662b00ba", "whyA": {}}, {"id": "L06-q6", "page": 51, "section": "أستكشفُ: الخطواتُ", "type": "open", "text": "أتواصلُ. أقارنُ ما رسمْتُه برسومِ زملائي في الصفِّ. أحدِّدُ أيَّ الخلايا تبدو في المرحلةِ نفسِها منَ الانقسامِ، وأيُّها يمرُّ بمراحلَ مختلفةٍ، وأناقشُ ذلكَ معَ أحدِ زملائي.", "answerText":
