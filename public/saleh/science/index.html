03-s4", "fig": "f34a", "parts": ["p4"], "a": "vf60c76264c67"}, {"t": "الميتوكندريا مصدر طاقة الخلية، شكلها كالعصي، وفيها التنفس الهوائي، وخلايا عضلة القلب فيها ألوف منها.", "page": 35, "sec": "L03-s4", "fig": "f34a", "parts": ["p5"], "a": "vb1cecd92c56f"}, {"t": "الفجوات أكياس تخزن الماء والغذاء وبعض الفضلات، وهي في الخلية النباتية أكبر منها في الحيوانية.", "page": 35, "sec": "L03-s4", "fig": "f35a", "parts": ["p6"], "a": "vf4f847a7dfeb"}, {"t": "في الخلية النباتية فقط: الجدار الخلوي (طبقة صلبة تدعم وتعطي الشكل وتحمي)، والبلاستيدات الخضراء، والكلوروفيل الذي يعطي اللون الأخضر.", "page": 35, "sec": "L03-s5", "fig": "f35a", "parts": ["p1", "p7"], "a": "vd2b5d5da94c7"}, {"t": "النقل السلبي نوعان بلا طاقة: الانتشار (مثل نقطة حبر في كأس ماء) والخاصية الأسموزية، وهي انتشار للماء فقط.", "page": 36, "sec": "L03-s6", "fig": "f36b", "parts": ["p1", "p2"], "a": "va62fe256a823"}, {"t": "الانتشار والأسموزية يستمران حتى يتساوى التركيز على جانبي الغشاء فيحدث الاتزان؛ وإذا خرج الماء من خلايا النبات أكثر مما يدخل ينكمش الغشاء البلازمي فيذبل.", "page": 37, "sec": "L03-s7", "fig": "f37a", "parts": [], "a": "v6851fbc1e7d8"}, {"t": "البناء الضوئي في البلاستيدات الخضراء: ثاني أكسيد الكربون + ماء ← (ضوء) سكر الجلوكوز + أكسجين، والأكسجين يُطرد للجو.", "page": 38, "sec": "L03-s9", "fig": "f38a", "parts": ["p1", "p2", "p3", "p4", "p5", "p6"], "a": "va6e83a83cb66"}, {"t": "التنفس: جلوكوز + أكسجين ← ثاني أكسيد الكربون + ماء + طاقة؛ يحدث في معظم الخلايا في الضوء والظلام، أما البناء الضوئي فيحتاج الضوء.", "page": 39, "sec": "L03-s10", "fig": "f39b", "parts": [], "a": "ve5ce2e43c343"}, {"t": "التنفس اللاهوائي بلا أكسجين، وأشهره التخمر (كإنتاج اللبن الرائب)، ويحدث في التمارين المجهدة فينتج حمض اللاكتيك فتتألم العضلات.", "page": 39, "sec": "L03-s10", "fig": null, "parts": [], "a": "v89487500b900"}, {"t": "النقل النشط يحتاج طاقة، من التركيز المنخفض إلى المرتفع؛ مثل ضخ البوتاسيوم داخل الخلية العصبية والصوديوم خارجها.", "page": 40, "sec": "L03-s11", "fig": "f40b", "parts": ["p1", "p2", "p3"], "a": "v7c1cff1595ff"}, {"t": "المواد الكبيرة جدًا تُحاط بغشاء بلازمي يكوّن جيبًا حولها، وهذه البلعمة، كما تبتلع الأميبا غذاءها.", "page": 40, "sec": "L03-s11", "fig": "f40a", "parts": ["p1", "p2"], "a": "v6f341776782e"}], "quiz": [{"id": "L03-m1", "src": "L03-q1", "kept": false, "page": 32, "type": "mcq", "text": "أيّ التراكيب التالية يوجد في الخلية النباتية ولا يوجد في الخلية الحيوانية؟", "options": ["أ. النواة", "ب. الجدار الخلوي", "ج. الغشاء البلازمي", "د. الميتوكندريا"], "answer": 1, "answerText": "ب. الجدار الخلوي", "explain": "الكتاب: في الخلايا النباتية تراكيب لا توجد في الحيوانية، منها الجدار الخلوي والبلاستيدات الخضراء والكلوروفيل.", "why": {"0": "معظم الخلايا النباتية والحيوانية لها نواة.", "2": "لكل خلية غشاء بلازمي يحيط بها.", "3": "الميتوكندريا مصدر الطاقة في الخليتين."}, "evp": 35, "back": "L03-s5", "fig": "f35a", "section": "اختر الإجابة الصحيحة", "qa": "vba8589f4fbde", "ea": "veea3db7f9de3", "wa": null, "ha": null, "whyA": {"0": "v732adb0df9b7", "2": "v96932de77d78", "3": "v7bdb6f7a261b"}}, {"id": "L03-m2", "src": "L03-q4", "kept": false, "page": 33, "type": "mcq", "text": "أيّ مما يلي يوجد في خلايا الإلوديا وخلايا باطن الخد معًا؟", "options": ["أ. الجدار الخلوي", "ب. البلاستيدات الخضراء", "ج. النواة", "د. الكلوروفيل"], "answer": 2, "answerText": "ج. النواة", "explain": "الخليتان فيهما غشاء بلازمي وسيتوبلازم ونواة. أما الجدار الخلوي والبلاستيدات والكلوروفيل ففي الخلية النباتية فقط.", "why": {"0": "الجدار الخلوي في خلايا الإلوديا (نبات) فقط.", "1": "البلاستيدات الخضراء في الخلية النباتية فقط.", "3": "الكلوروفيل صبغة في البلاستيدات الخضراء في النبات فقط."}, "evp": 34, "back": "L03-s3", "fig": "f35a", "section": "اختر الإجابة الصحيحة", "qa": "v2ea51f0cdfcc", "ea": "vdd7acf55755f", "wa": null, "ha": null, "whyA": {"0": "vd88a160bdf60", "1": "v2140341d7ed8", "3": "vce9768a224d6"}}, {"id": "L03-m3", "src": "L03-q5", "kept": false, "page": 33, "type": "mcq", "text": "لماذا تحتوي الخلية النباتية على بلاستيدات خضراء ولا تحتوي عليها الخلية الحيوانية؟", "options": ["أ. لأن النبات يصنع غذاءه بنفسه", "ب. لأن البلاستيدات تخزن الفضلات", "ج. لأن البلاستيدات مركز التحكم في الخلية", "د. لأن الحيوان لا يحتاج إلى طاقة"], "answer": 0, "answerText": "أ. لأن النبات يصنع غذاءه بنفسه", "explain": "البلاستيدات الخضراء تقوم بصنع الغذاء؛ إذ تمتص طاقة الضوء بالكلوروفيل، والنبات هو الذي يصنع غذاءه.", "why": {"1": "الفجوات هي التي تخزن بعض الفضلات.", "2": "النواة هي مركز التحكم.", "3": "الحيوان يحتاج طاقة، ويحصل عليها بالتنفس الخلوي."}, "evp": 35, "back": "L03-s5", "section": "اختر الإجابة الصحيحة", "qa": "v038799b045aa", "ea": "v8ecd54c0ebd2", "wa": null, "ha": null, "whyA": {"1": "vc2cb76131a29", "2": "ve026fe623502", "3": "v278a7e58771f"}}, {"id": "L03-m4", "src": "L03-q6", "kept": false, "page": 33, "type": "tf", "text": "الخلية التي لها جدار خلوي وبلاستيدات خضراء تشبه خلايا الإلوديا أكثر من خلايا باطن الخد.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "الجدار الخلوي والبلاستيدات الخضراء من صفات الخلية النباتية، والإلوديا نبات.", "why": {"1": "هذه صفات الخلية النباتية مثل الإلوديا."}, "evp": 35, "back": "L03-s5", "section": "صح أم خطأ", "qa": "v58fd00a368ae", "ea": "ve6e92af4d2e6", "wa": null, "ha": null, "whyA": {"1": "v8f3b87d89f93"}}, {"id": "L03-m5", "src": "L03-q7", "kept": false, "page": 35, "type": "mcq", "text": "أقرأ الشكل: أيّ مجموعة من التراكيب توجد خارج النواة في الخلية النباتية؟", "options": ["أ. الكروموسومات فقط", "ب. الكروموسومات والميتوكندريا", "ج. الفجوة والميتوكندريا والبلاستيدات الخضراء", "د. الكروموسومات والفجوة"], "answer": 2, "answerText": "ج. الفجوة والميتوكندريا والبلاستيدات الخضراء", "explain": "خارج النواة: السيتوبلازم والفجوة والميتوكندريا والبلاستيدات الخضراء والغشاء البلازمي والجدار الخلوي وغيرها. أما الكروموسومات فداخل النواة.", "why": {"0": "الكروموسومات توجد داخل النواة.", "1": "الكروموسومات داخل النواة، وإن كانت الميتوكندريا خارجها.", "3": "الكروموسومات داخل النواة، وإن كانت الفجوة خارجها."}, "evp": 35, "back": "L03-s5", "fig": "f35a", "section": "اختر الإجابة الصحيحة", "qa": "vc09e7604d862", "ea": "v47355a13db8c", "wa": null, "ha": null, "whyA": {"0": "v2c3d55b7095c", "1": "vf6ddf53d8296", "3": "v46a9254fdfdb"}}, {"id": "L03-m6", "src": "L03-q8", "kept": false, "page": 35, "type": "mcq", "text": "ما وظيفة الفجوات في الخلية؟", "options": ["أ. تنظيم التفاعلات الكيميائية", "ب. تخزين الماء والغذاء وبعض الفضلات", "ج. إطلاق الطاقة من الغذاء", "د. صنع الغذاء بطاقة الضوء"], "answer": 1, "answerText": "ب. تخزين الماء والغذاء وبعض الفضلات", "explain": "الكتاب: الفجوات تراكيب تشبه الكيس، تخزن الماء والغذاء، وتخزن بعض الفضلات قبل التخلص منها.", "why": {"0": "النواة هي التي تنظم التفاعلات.", "2": "الميتوكندريا هي مصدر الطاقة.", "3": "البلاستيدات الخضراء هي التي تصنع الغذاء."}, "evp": 35, "back": "L03-s4", "fig": "f34a", "section": "اختر الإجابة الصحيحة", "qa": "v24df2f4b8945", "ea": "v30b1f368d8c9", "wa": null, "ha": null, "whyA": {"0": "v574be8799670", "2": "v10071491ddb3", "3": "v643839d40bb9"}}, {"id": "L03-m7", "src": "L03-q9", "kept": false, "page": 35, "type": "mcq", "text": "أيّ عبارة تصف الجدار الخلوي في الخلية النباتية؟", "options": ["أ. مادة تشبه الهلام بين النواة والغشاء", "ب. يوجد في الخلايا الحيوانية فقط", "ج. غشاء رقيق داخل السيتوبلازم", "د. طبقة صلبة تحيط بالغشاء البلازمي وتدعم الخلية وتحميها"], "answer": 3, "answerText": "د. طبقة صلبة تحيط بالغشاء البلازمي وتدعم الخلية وتحميها", "explain": "الكتاب: الجدار الخلوي طبقة صلبة تحيط بالغشاء البلازمي، يدعم الخلية النباتية ويعطيها شكلها ويحميها. والغشاء البلازمي يسمح بدخول المواد وخروجها.", "why": {"0": "هذا وصف السيتوبلازم.", "1": "الجدار الخلوي في الخلية النباتية لا الحيوانية.", "2": "الجدار الخلوي خارج الغشاء البلازمي، لا داخل الخلية."}, "evp": 35, "back": "L03-s5", "fig": "f35a", "section": "اختر الإجابة الصحيحة", "qa": "v9caf37f9048b", "ea": "vf9010fbe2300", "wa": null, "ha": null, "whyA": {"0": "ved729e87608d", "1": "v47d4059e72c5", "2": "v6b4d4887e1d0"}}, {"id": "L03-m8", "src": "L03-q10", "kept": false, "page": 37, "type": "tf", "text": "إذا تُرك كيس الشاي في ماء الكأس مدةً كافية من دون تحريك، ينتشر لون الشاي في الماء حتى يتوزّع فيه بالتساوي تقريبًا.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "هذا انتشار: تنتقل المواد من المنطقة الأكثر تركيزًا إلى الأقل تركيزًا، مثل نقطة الحبر في كأس الماء.", "why": {"1": "الانتشار يوزّع المادة حتى يتساوى التركيز."}, "evp": 36, "back": "L03-s6", "section": "صح أم خطأ", "qa": "vd8cc746019b4", "ea": "v5fc42e537fba", "wa": null, "ha": null, "whyA": {"1": "vecffcca1b5f0"}}, {"id": "L03-m9", "src": "L03-q12", "kept": false, "page": 37, "type": "mcq", "text": "في نشاط كيس الشاي: ما الذي انتقل من كيس الشاي إلى ماء الكأس؟", "options": ["أ. أوراق الشاي", "ب. الرمل", "ج. مواد الشاي الملوّنة", "د. قطع من الكيس"], "answer": 2, "answerText": "ج. مواد الشاي الملوّنة", "explain": "خرجت مواد الشاي الملوّنة من الكيس بالانتشار؛ ونعرف ذلك من تغيّر لون الماء. أما أوراق الشاي والرمل فلا تعبر الكيس.", "why": {"0": "أوراق الشاي بقيت داخل الكيس.", "1": "حبيبات الرمل كبيرة لا تعبر الكيس، فلم ينتقل الرمل.", "3": "الكيس بقي سليمًا."}, "evp": 36, "back": "L03-s8", "section": "اختر الإجابة الصحيحة", "qa": "v1afaa2459295", "ea": "vf6f3b659af06", "wa": null, "ha": null, "whyA": {"0": "vc72adbb63af6", "1": "v775383d4f170", "3": "v4d8e39076e4b"}}, {"id": "L03-m10", "src": "L03-q13", "kept": false, "page": 37, "type": "mcq", "text": "ما الذي حدّد حركة الجزيئات إلى داخل كيس الشاي وإلى خارجه؟", "options": ["أ. طاقة الخلية", "ب. فرق التركيز بين داخل الكيس وخارجه", "ج. ضوء الشمس", "د. تحريك الكأس باستمرار"], "answer": 1, "answerText": "ب. فرق التركيز بين داخل الكيس وخارجه", "explain": "في الانتشار تنتقل المواد من التركيز المرتفع إلى المنخفض حتى يتساوى التركيز فيحدث الاتزان.", "why": {"0": "الانتشار نقل سلبي لا يحتاج طاقة.", "2": "الضوء يلزم البناء الضوئي لا الانتشار.", "3": "تُرك الكأس بلا تحريك ١٥ دقيقة وتوزّع اللون."}, "evp": 37, "back": "L03-s7", "section": "اختر الإجابة الصحيحة", "qa": "v251d1ff942ff", "ea": "v90d72fb96ab7", "wa": null, "ha": null, "whyA": {"0": "v259a0bea8f0c", "2": "vcbbdc9829fe4", "3": "v591b6088b308"}}, {"id": "L03-m11", "src": "L03-q14", "kept": false, "page": 37, "type": "mcq", "text": "ماذا يحدث خلال الخاصية الأسموزية؟", "options": ["أ. تنتقل جزيئات الماء عبر الغشاء البلازمي من تركيز الماء المرتفع إلى المنخفض", "ب. تنتقل الأملاح بطاقة الخلية من التركيز المنخفض إلى المرتفع", "ج. تحيط الخلية المواد الكبيرة بجيب من الغشاء", "د. تصنع الخلية سكر الجلوكوز"], "answer": 0, "answerText": "أ. تنتقل جزيئات الماء عبر الغشاء البلازمي من تركيز الماء المرتفع إلى المنخفض", "explain": "الخاصية الأسموزية انتقال جزيئات الماء عبر الغشاء البلازمي من حيث تركيزه أكبر إلى حيث تركيزه أقل، فهي انتشار للماء فقط.", "why": {"1": "هذا نقل نشط.", "2": "هذه البلعمة.", "3": "هذا البناء الضوئي."}, "evp": 36, "back": "L03-s6", "fig": "f36a", "section": "اختر الإجابة الصحيحة", "qa": "vc9f077b194c1", "ea": "v064f5133ef39", "wa": null, "ha": null, "whyA": {"1": "va919d157f4db", "2": "v300e41bec3f0", "3": "v269cfbf075a9"}}, {"id": "L03-m12", "src": "L03-q15", "kept": false, "page": 37, "type": "tf", "text": "ينكمش العنب ويصبح زبيبًا عندما يدخل الماء إلى خلاياه أكثر مما يخرج منها.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "الصحيح: إذا كان خروج الماء من الخلايا أكثر من دخوله إليها تنكمش أجزاؤها، كما يحدث في الزبيب والنبات الذابل.", "why": {"0": "الانكماش يحدث عند خروج الماء أكثر من دخوله."}, "evp": 37, "back": "L03-s7", "fig": "f37a", "section": "صح أم خطأ", "qa": "vde0cba608059", "ea": "v282a8857db26", "wa": null, "ha": null, "whyA": {"0": "v2161ef32f4a4"}}, {"id": "L03-m13", "src": "L03-q16", "kept": false, "page": 38, "type": "mcq", "text": "أقرأ الشكل: ما المواد التي يحتاج إليها النبات للقيام بعملية البناء الضوئي؟", "options": ["أ. الأكسجين وسكر الجلوكوز", "ب. الماء وثاني أكسيد الكربون", "ج. الماء والأكسجين", "د. سكر الجلوكوز وثاني أكسيد الكربون"], "answer": 1, "answerText": "ب. الماء وثاني أكسيد الكربون", "explain": "المواد المتفاعلة في البناء الضوئي هي ثاني أكسيد الكربون والماء. وأشعة الشمس طاقة وليست مادة.", "why": {"0": "هذه نواتج البناء الضوئي.", "2": "الأكسجين ناتج من البناء الضوئي، لا مادة يحتاجها.", "3": "الجلوكوز ناتج من البناء الضوئي."}, "evp": 38, "back": "L03-s9", "fig": "f38a", "section": "اختر الإجابة الصحيحة", "qa": "v192013c45e1d", "ea": "vf3ca1f65c3f2", "wa": null, "ha": null, "whyA": {"0": "v9020ef6e13ae", "2": "v2905782f969a", "3": "v41b1d04955c4"}}, {"id": "L03-m14", "src": "L03-q17", "kept": false, "page": 39, "type": "mcq", "text": "فيمَ يختلف النقل النشط عن النقل السلبي؟", "options": ["أ. النقل النشط لا يحتاج طاقة", "ب. النقل السلبي ينقل الماء فقط", "ج. النقل النشط يحتاج طاقة، وينقل المواد من التركيز المنخفض إلى المرتفع", "د. النقل السلبي يحتاج طاقة الخلية"], "answer": 2, "answerText": "ج. النقل النشط يحتاج طاقة، وينقل المواد من التركيز المنخفض إلى المرتفع", "explain": "النقل السلبي بلا طاقة من المرتفع إلى المنخفض، والنقل النشط يحتاج طاقة من المنخفض إلى المرتفع.", "why": {"0": "النقل النشط هو الذي يحتاج طاقة.", "1": "النقل السلبي يشمل الانتشار (سكر وأكسجين...) والخاصية الأسموزية.", "3": "النقل السلبي لا يستخدم طاقة الخلية."}, "evp": 40, "back": "L03-s11", "fig": "f40b", "section": "اختر الإجابة الصحيحة", "qa": "v1fa407d1535d", "ea": "vab6cad9bac78", "wa": null, "ha": null, "whyA": {"0": "vb967e7fc6bd5", "1": "v5b4da97c9667", "3": "v4c9a8f1eb8bf"}}, {"id": "L03-m15", "src": "L03-q18", "kept": false, "page": 39, "type": "mcq", "text": "ما أثر التمارين الرياضية المجهدة في العضلات؟", "options": ["أ. يزداد البناء الضوئي فيها", "ب. لا يصل الأكسجين لكل خلاياها فتطلق الطاقة بالتخمّر وينتج حمض اللاكتيك", "ج. تنتج فيها البلاستيدات الخضراء", "د. يتوقف انتقال الماء إليها نهائيًا"], "answer": 1, "answerText": "ب. لا يصل الأكسجين لكل خلاياها فتطلق الطاقة بالتخمّر وينتج حمض اللاكتيك", "explain": "الكتاب: في التمارين المجهدة لا يصل الأكسجين إلى جميع الخلايا، فتُطلق الطاقة بالتخمّر، وينتج حمض اللاكتيك الذي يسبب ألم العضلات أو الإعياء.", "why": {"0": "البناء الضوئي يحدث في الخلايا التي فيها بلاستيدات خضراء، لا في العضلات.", "2": "البلاستيدات الخضراء في الخلايا النباتية فقط.", "3": "التمارين لا توقف انتقال الماء؛ المشكلة نقص الأكسجين."}, "evp": 39, "back": "L03-s10", "section": "اختر الإجابة الصحيحة", "qa": "v5a106ef70901", "ea": "v5f7da92e2daa", "wa": null, "ha": null, "whyA": {"0": "va9e8cf178efe", "2": "v7fe56b0f6d68", "3": "v57d351037718"}}, {"id": "L03-m16", "src": "L03-q19", "kept": false, "page": 40, "type": "mcq", "text": "كيف تتخلّص الخلية من الفضلات مثل ثاني أكسيد الكربون؟", "options": ["أ. يدخل الدم إلى الخلية ويأخذها", "ب. تخزنها في النواة إلى الأبد", "ج. تنقلها عبر الغشاء البلازمي إلى خارجها، ثم يحملها الدم بعيدًا", "د. تحوّلها إلى أكسجين في الميتوكندريا"], "answer": 2, "answerText": "ج. تنقلها عبر الغشاء البلازمي إلى خارجها، ثم يحملها الدم بعيدًا", "explain": "ثاني أكسيد الكربون ينتقل عبر الغشاء البلازمي بالانتشار، والدم ينقل الفضلات بعيدًا عن الخلية. وتخزن الفجوات بعض الفضلات قبل التخلص منها.", "why": {"0": "الكتاب يقول: لا يدخل الدم إلى الخلايا.", "1": "النواة مركز التحكم، والفجوات هي التي تخزن الفضلات مؤقتًا.", "3": "الميتوكندريا تطلق الطاقة، ولا تصنع الأكسجين."}, "evp": 36, "back": "L03-s6", "section": "اختر الإجابة الصحيحة", "qa": "vb85f897729fd", "ea": "vf9965f85349d", "wa": null, "ha": null, "whyA": {"0": "vff3aada04a90", "1": "v3fb1fcb2426d", "3": "v1138b1754d2c"}}, {"id": "L03-m17", "src": "L03-q20", "kept": false, "page": 40, "type": "mcq", "text": "لماذا قد يكون النقل النشط مهمًا للخلية؟", "options": ["أ. لأنه ينقل الأملاح المعدنية والمواد الغذائية إلى داخل الخلية وخارجها", "ب. لأنه يصنع الغذاء من ضوء الشمس", "ج. لأنه لا يحتاج إلى أي طاقة", "د. لأنه يبني الجدار الخلوي"], "answer": 0, "answerText": "أ. لأنه ينقل الأملاح المعدنية والمواد الغذائية إلى داخل الخلية وخارجها", "explain": "الكتاب: تحتاج الخلية إلى الطاقة لنقل الأملاح المعدنية والمواد الغذائية إلى داخلها وخارجها، مثل ضخ البوتاسيوم في الخلية العصبية.", "why": {"1": "صنع الغذاء هو البناء الضوئي.", "2": "النقل النشط يحتاج طاقة.", "3": "النقل النشط ينقل المواد عبر الغشاء البلازمي، ولا يبني الجدار الخلوي."}, "evp": 40, "back": "L03-s11", "fig": "f40b", "section": "اختر الإجابة الصحيحة", "qa": "vf9370d082615", "ea": "v420aff380a23", "wa": null, "ha": null, "whyA": {"1": "v33accae8ee16", "2": "v45777900beb9", "3": "v90bc03ec1fea"}}, {"id": "L03-m18", "src": "L03-q21", "kept": false, "page": 41, "type": "mcq", "text": "العملية التي تسبّب انتقال المواد من منطقة التركيز المنخفض إلى منطقة التركيز العالي، وتحتاج إلى طاقة، تُسمّى:", "options": ["أ. الانتشار", "ب. الخاصية الأسموزية", "ج. البلعمة", "د. النقل النشط"], "answer": 3, "answerText": "د. النقل النشط", "explain": "الكتاب: عندما يحتاج انتقال المواد عبر الأغشية إلى طاقة يحدث نقل نشط، من التركيز المنخفض إلى المرتفع.", "why": {"0": "الانتشار من المرتفع إلى المنخفض بلا طاقة.", "1": "الخاصية الأسموزية انتقال الماء بلا طاقة.", "2": "البلعمة لإدخال المواد الكبيرة جدًا بإحاطتها بجيب."}, "evp": 40, "back": "L03-s11", "section": "اختر الإجابة الصحيحة", "qa": "vbe2d165d8d1a", "ea": "vf5bf00e7974a", "wa": null, "ha": null, "whyA": {"0": "v09bba6e4bf97", "1": "v9b51d381b534", "2": "v9f1fef74dc01"}}, {"id": "L03-m19", "src": "L03-q22", "kept": false, "page": 41, "type": "mcq", "text": "كيف تقوم الخلايا النباتية بصنع الغذاء؟", "options": ["أ. تمتص البلاستيدات الخضراء طاقة الضوء وتحوّل ثاني أكسيد الكربون والماء إلى جلوكوز وأكسجين", "ب. تحلل الميتوكندريا الجلوكوز بالأكسجين", "ج. تخزن الفجوات الغذاء من التربة دون تغيير", "د. تبتلع الخلية الغذاء بالبلعمة"], "answer": 0, "answerText": "أ. تمتص البلاستيدات الخضراء طاقة الضوء وتحوّل ثاني أكسيد الكربون والماء إلى جلوكوز وأكسجين", "explain": "البناء الضوئي يتم في البلاستيدات الخضراء؛ تلتقط طاقة الشمس بالكلوروفيل وتحوّل ثاني أكسيد الكربون والماء إلى سكر الجلوكوز والأكسجين.", "why": {"1": "هذا التنفس الخلوي، وهو يطلق الطاقة ولا يصنع الغذاء.", "2": "الفجوات تخزن، ولا تصنع الغذاء.", "3": "البلعمة مثل ابتلاع الأميبا لغذائها، لا صنع الغذاء."}, "evp": 38, "back": "L03-s9", "fig": "f41c", "section": "اختر الإجابة الصحيحة", "qa": "v31cb0aca5ba3", "ea": "v1ba70b892b34", "wa": null, "ha": null, "whyA": {"1": "vc22f4faa22e4", "2": "v2b0703b5f523", "3": "v3220fd8b41c6"}}, {"id": "L03-m20", "src": "L03-q23", "kept": false, "page": 41, "type": "tf", "text": "يشعر العدّاء بألم في عضلات ساقه بعد الجري الطويل بسبب كثرة الأكسجين الواصل إلى عضلاته.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "الصحيح: الأكسجين لا يصل إلى كل الخلايا، فتطلق الطاقة بالتخمّر وينتج حمض اللاكتيك الذي يسبّب الألم.", "why": {"0": "السبب نقص الأكسجين وتكوّن حمض اللاكتيك."}, "evp": 39, "back": "L03-s10", "section": "صح أم خطأ", "qa": "v54858731da9a", "ea": "vc7acd295a870", "wa": null, "ha": null, "whyA": {"0": "ve0db16e40b51"}}, {"id": "L03-m21", "src": "L03-q24", "kept": true, "page": 41, "type": "mcq", "text": "٤ أختارُ الإجابةَ الصحيحةَ. عندَمَا يكونُ تركيزُ المادةِ متساويًا على جانبَيِ الغشاءِ البلازميّ فإنَّ المادّةَ تكونُ في حالةِ:", "options": ["أ. تخمّر", "ب. أسموزية", "ج. انتشار", "د. اتزان"], "answer": 3, "answerText": "د. اتزان", "explain": "الكتاب: عندما يتساوى تركيز المادة على جانبي الغشاء تتوقف عمليتا الانتشار والخاصية الأسموزية، ويحدث الاتزان.", "why": {"0": "التخمّر نوع من التنفس اللاهوائي.", "1": "الخاصية الأسموزية انتقال الماء، وتتوقف عند الاتزان.", "2": "الانتشار يستمر حتى يتساوى التركيز، ثم يحدث الاتزان."}, "evp": 37, "back": "L03-s7", "fig": "f36b", "section": "اختر الإجابة الصحيحة", "qa": "v5c407939f171", "ea": "vf56d99d8a4fa", "wa": null, "ha": null, "whyA": {"0": "v918313ef27b6", "1": "va93b2f0284e4", "2": "va1e5a5841ddc"}}, {"id": "L03-m22", "src": "L03-q25", "kept": true, "page": 41, "type": "mcq", "text": "٥ أختارُ الإجابةَ الصحيحةَ. أيٌّ ممَّا يلي يُعدُّ مركزَ الطاقةِ في الخليةِ؟", "options": ["أ. الميتوكندريا", "ب. نظامُ النقلِ", "ج. جدارُ الخليةِ", "د. الفجواتُ"], "answer": 0, "answerText": "أ. الميتوكندريا", "explain": "الميتوكندريا مصدر طاقة الخلية؛ تقوم بالتنفس الهوائي وتحوّل الغذاء إلى طاقة.", "why": {"1": "نظام النقل ينقل المواد اللازمة داخل السيتوبلازم.", "2": "الجدار الخلوي يدعم الخلية النباتية ويحميها.", "3": "الفجوات تخزن الماء والغذاء وبعض الفضلات."}, "evp": 35, "back": "L03-s4", "fig": "f34a", "section": "اختر الإجابة الصحيحة", "qa": "v899babdbee50", "ea": "v8f706f91ebe8", "wa": null, "ha": null, "whyA": {"1": "ve3b741403e3b", "2": "v8eaa6185dfa1", "3": "v7f6b5b227f37"}}, {"id": "L03-m23", "src": "L03-q26", "kept": false, "page": 41, "type": "tf", "text": "تتكوّن الخلايا من أجزاء عديدة، لكلٍّ منها دوره في النشاطات التي تحافظ على الحياة.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "الكتاب (ملخص مصور ص٤١): لكل جزء من الخلية دوره ووظيفته؛ فالنواة تتحكم، والميتوكندريا تطلق الطاقة، والفجوات تخزن.", "why": {"1": "العبارة صحيحة كما في الكتاب ص٤١."}, "evp": 41, "back": "L03-s12", "fig": "f41a", "section": "صح أم خطأ", "qa": "v337e8100db6f", "ea": "v1b3c56c719e4", "wa": null, "ha": null, "whyA": {"1": "v8927bfecd6af"}}, {"id": "L03-m24", "src": "point", "kept": false, "page": 34, "type": "tf", "text": "الغشاء البلازمي يوجد في الخلايا النباتية فقط.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "الصحيح: لكل خلية غشاء بلازمي يحيط بها، نباتية كانت أو حيوانية.", "why": {"0": "كل الخلايا لها غشاء بلازمي."}, "evp": 34, "back": "L03-s3", "fig": "f34a", "section": "صح أم خطأ", "qa": "v1a798bf70b51", "ea": "v3b9da1ecb7ce", "wa": null, "ha": null, "whyA": {"0": "v1140d0cbf054"}}, {"id": "L03-m25", "src": "point", "kept": false, "page": 34, "type": "mcq", "text": "أيّ أجزاء الخلية يعمل بوصفه مركز التحكم فيها؟", "options": ["أ. الفجوة", "ب. الميتوكندريا", "ج. الجدار الخلوي", "د. النواة"], "answer": 3, "answerText": "د. النواة", "explain": "الكتاب: النواة مركز التحكم في الخلية؛ تنظم التفاعلات الكيميائية وتخزن المعلومات الضرورية لانقسام الخلية.", "why": {"0": "الفجوة للتخزين.", "1": "الميتوكندريا مصدر الطاقة.", "2": "الجدار الخلوي للدعم والحماية."}, "evp": 34, "back": "L03-s3", "fig": "f34a", "section": "اختر الإجابة الصحيحة", "qa": "v1b9860747279", "ea": "v32941ca9283e", "wa": null, "ha": null, "whyA": {"0": "v0bb06d5c0e85", "1": "v373eb0717a91", "2": "v8633bf5ee10e"}}, {"id": "L03-m26", "src": "point", "kept": false, "page": 34, "type": "tf", "text": "الكروموسومات أشرطة طويلة من الأحماض النووية توجد في النواة.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "الكتاب: يوجد في النواة أشرطة طويلة من الأحماض النووية تُسمّى الكروموسومات، تحفظ المعلومات لنقلها إلى خلايا النسل الجديد.", "why": {"1": "العبارة صحيحة كما في الكتاب ص٣٤."}, "evp": 34, "back": "L03-s3", "fig": "f34a", "section": "صح أم خطأ", "qa": "va0a98bcb6c4d", "ea": "v1c211b7fae2e", "wa": null, "ha": null, "whyA": {"1": "v3ad6468c0f6d"}}, {"id": "L03-m27", "src": "point", "kept": false, "page": 35, "type": "mcq", "text": "ما المادة التي تشبه الهلام وتوجد بين النواة والغشاء البلازمي؟", "options": ["أ. السيتوبلازم", "ب. الكلوروفيل", "ج. الجدار الخلوي", "د. الكروموسومات"], "answer": 0, "answerText": "أ. السيتوبلازم", "explain": "الكتاب: السيتوبلازم مادة تشبه الهلام بين النواة والغشاء البلازمي، فيه ماء كثير وأجزاء الخلية الداخلية.", "why": {"1": "الكلوروفيل صبغة خضراء في البلاستيدات.", "2": "الجدار الخلوي طبقة صلبة خارج الغشاء.", "3": "الكروموسومات داخل النواة."}, "evp": 35, "back": "L03-s4", "fig": "f34a", "section": "اختر الإجابة الصحيحة", "qa": "v811b56ffb0aa", "ea": "v6ad280192bc0", "wa": null, "ha": null, "whyA": {"1": "v5c167c870207", "2": "vd0b3f970bf70", "3": "vbe7ba9923ee3"}}, {"id": "L03-m28", "src": "point", "kept": false, "page": 35, "type": "tf", "text": "تحتوي خلايا عضلات القلب على عدد قليل جدًا من الميتوكندريا.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "الصحيح: الخلايا التي تحتاج إلى الطاقة باستمرار، ومنها خلايا عضلات القلب، تحتوي على ألوف من الميتوكندريا.", "why": {"0": "فيها ألوف من الميتوكندريا لأنها تحتاج طاقة باستمرار."}, "evp": 35, "back": "L03-s4", "fig": "f34a", "section": "صح أم خطأ", "qa": "v79da29f4cb32", "ea": "vfc935b4a00d6", "wa": null, "ha": null, "whyA": {"0": "v4a5b55b7110a"}}, {"id": "L03-m29", "src": "point", "kept": false, "page": 35, "type": "tf", "text": "الفجوات في الخلية الحيوانية أكبر منها في الخلية النباتية.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "الصحيح: الفجوات في الخلية النباتية أكبر منها في الخلية الحيوانية.", "why": {"0": "الفجوات أكبر في الخلية النباتية."}, "evp": 35, "back": "L03-s4", "fig": "f35a", "section": "صح أم خطأ", "qa": "v7162963fbf72", "ea": "va836f4916eb1", "wa": null, "ha": null, "whyA": {"0": "vc319b185b707"}}, {"id": "L03-m30", "src": "point", "kept": false, "page": 35, "type": "mcq", "text": "ما الصبغة التي تُكسب النباتات لونها الأخضر؟", "options": ["أ. السيتوبلازم", "ب. حمض اللاكتيك", "ج. الكلوروفيل", "د. الكروموسومات"], "answer": 2, "answerText": "ج. الكلوروفيل", "explain": "الكتاب: تمتص البلاستيدات الخضراء طاقة الضوء بصبغة خضراء تُسمّى الكلوروفيل، وهي التي تُكسب النباتات لونها الأخضر.", "why": {"0": "السيتوبلازم مادة هلامية في الخلية.", "1": "حمض اللاكتيك ينتج من التخمّر.", "3": "الكروموسومات في النواة."}, "evp": 35, "back": "L03-s5", "fig": "f35a", "section": "اختر الإجابة الصحيحة", "qa": "vf7917b8d9aa8", "ea": "vb10353c7aa03", "wa": null, "ha": null, "whyA": {"0": "vd69f57086613", "1": "vdea9967731fd", "3": "vcef56f5e0f91"}}, {"id": "L03-m31", "src": "point", "kept": false, "page": 36, "type": "tf", "text": "تحتاج الخاصية الأسموزية إلى طاقة الخلية.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "الصحيح: الخاصية الأسموزية والانتشار نوعان من النقل السلبي، ولا يستخدمان طاقة الخلية.", "why": {"0": "الخاصية الأسموزية نقل سلبي بلا طاقة."}, "evp": 36, "back": "L03-s6", "fig": "f36a", "section": "صح أم خطأ", "qa": "v8a6ec8011d61", "ea": "v85e32b9d253b", "wa": null, "ha": null, "whyA": {"0": "v63f0fc323078"}}, {"id": "L03-m32", "src": "point", "kept": false, "page": 37, "type": "tf", "text": "يذبل النبات عندما يخرج الماء من خلاياه أكثر مما يدخل إليها.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "الكتاب: إذا كان خروج الماء من خلايا النبات أكثر من دخوله إليها ينكمش الغشاء البلازمي مبتعدًا عن الجدار الخلوي، فيذبل النبات.", "why": {"1": "العبارة صحيحة كما في الكتاب ص٣٧."}, "evp": 37, "back": "L03-s7", "fig": "f37a", "section": "صح أم خطأ", "qa": "v3e9470481a8d", "ea": "v453e56907fde", "wa": null, "ha": null, "whyA": {"1": "v7321df625778"}}, {"id": "L03-m33", "src": "point", "kept": false, "page": 38, "type": "mcq", "text": "أين تتم عملية البناء الضوئي في الخلية النباتية؟", "options": ["أ. الميتوكندريا", "ب. البلاستيدات الخضراء", "ج. النواة", "د. الفجوة"], "answer": 1, "answerText": "ب. البلاستيدات الخضراء", "explain": "الكتاب: تتم عملية البناء الضوئي داخل البلاستيدات الخضراء التي تحتوي على صبغة الكلوروفيل.", "why": {"0": "الميتوكندريا يتم فيها التنفس الهوائي.", "2": "النواة مركز التحكم.", "3": "الفجوة للتخزين."}, "evp": 38, "back": "L03-s9", "fig": "f38a", "section": "اختر الإجابة الصحيحة", "qa": "v4ffdf75259ac", "ea": "vade82d456225", "wa": null, "ha": null, "whyA": {"0": "v31472b85c084", "2": "vcd835f9f6d09", "3": "v0bb06d5c0e85"}}, {"id": "L03-m34", "src": "point", "kept": false, "page": 39, "type": "mcq", "text": "ما المواد الناتجة عن التنفس الخلوي؟", "options": ["أ. سكر الجلوكوز والأكسجين", "ب. الكلوروفيل والماء", "ج. ثاني أكسيد الكربون والماء وطاقة", "د. الأكسجين فقط"], "answer": 2, "answerText": "ج. ثاني أكسيد الكربون والماء وطاقة", "explain": "معادلة التنفس في الكتاب: جلوكوز + أكسجين ← ثاني أكسيد الكربون + ماء + طاقة.", "why": {"0": "هذه نواتج البناء الضوئي.", "1": "الكلوروفيل صبغة في البلاستيدات وليس ناتجًا.", "3": "التنفس يستهلك الأكسجين، لا ينتجه."}, "evp": 39, "back": "L03-s10", "fig": "f39b", "section": "اختر الإجابة الصحيحة", "qa": "vf474c1b9b5b4", "ea": "v5ee1eb8447f7", "wa": null, "ha": null, "whyA": {"0": "v9020ef6e13ae", "1": "va701a3ed8394", "3": "vcad6fc3790df"}}, {"id": "L03-m35", "src": "point", "kept": false, "page": 39, "type": "mcq", "text": "ما أكثر عمليات التنفس اللاهوائي شيوعًا؟", "options": ["أ. البلعمة", "ب. الانتشار", "ج. البناء الضوئي", "د. التخمّر"], "answer": 3, "answerText": "د. التخمّر", "explain": "الكتاب: أكثر عمليات التنفس اللاهوائي شيوعًا هي التخمّر، ومن ذلك إنتاج اللبن الرائب.", "why": {"0": "البلعمة طريقة لإدخال المواد الكبيرة.", "1": "الانتشار نوع من النقل السلبي.", "2": "البناء الضوئي صنع الغذاء، وليس تنفسًا."}, "evp": 39, "back": "L03-s10", "section": "اختر الإجابة الصحيحة", "qa": "v13173ca4798b", "ea": "v312383ff33cc", "wa": null, "ha": null, "whyA": {"0": "v5ad8a1b28dcc", "1": "v14afcac94bba", "2": "v01eeb127cb78"}}, {"id": "L03-m36", "src": "point", "kept": false, "page": 40, "type": "tf", "text": "تضخّ الخلية العصبية البوتاسيوم إلى داخلها بالنقل النشط.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "الكتاب: الخلية العصبية تحتاج إلى النقل النشط لضخ البوتاسيوم داخل الخلية، ولضخ الصوديوم خارجها.", "why": {"1": "العبارة صحيحة كما في الكتاب ص٤٠."}, "evp": 40, "back": "L03-s11", "fig": "f40b", "section": "صح أم خطأ", "qa": "v7391660e8126", "ea": "v679bc8c4bfe8", "wa": null, "ha": null, "whyA": {"1": "v9550d34c866b"}}, {"id": "L03-m37", "src": "point", "kept": false, "page": 40, "type": "mcq", "text": "ما اسم العملية التي تحيط فيها الخلية المواد الكبيرة جدًا بغشاء بلازمي مكوّنة جيبًا حولها؟", "options": ["أ. الانتشار", "ب. البلعمة", "ج. الخاصية الأسموزية", "د. التخمّر"], "answer": 1, "answerText": "ب. البلعمة", "explain": "الكتاب: تُحاط المواد الكبيرة مثل البروتينات والبكتيريا بغشاء بلازمي يكوّن جيبًا حولها، وتُسمّى البلعمة، كما تبتلع الأميبا غذاءها.", "why": {"0": "الانتشار للمواد الصغيرة مثل السكر والأكسجين.", "2": "الخاصية الأسموزية لانتقال الماء.", "3": "التخمّر تنفس لاهوائي."}, "evp": 40, "back": "L03-s11", "fig": "f40a", "section": "اختر الإجابة الصحيحة", "qa": "vb53fcd7652dc", "ea": "vf364c3c4c70c", "wa": null, "ha": null, "whyA": {"0": "v5911b309f606", "2": "v19472a64531d", "3": "v9de7b84284d3"}}]}, {"id": "L04", "unit": "الوحدة الأولى: تنوّع الحياة", "chapter": "الفصل الأول: الخلايا", "name": "أعمل كالعلماء: ما التنفس الخلوي؟", "pages": [42, 43], "note": "صفحتا إثراء وتوسع: تجربة عملية تطبّق ما تعلمته عن التنفس الخلوي في الدرس الثاني.", "sections": [{"id": "L04-s1", "page": 42, "title": "ما التنفسُ الخلويُّ؟ (أكوّنُ فرضيّةً)", "book": "التنفسُ الخلويُّ عمليةٌ تقومُ بها الخلايا لتحويلِ جزيئاتِ الغذاءِ إلى طاقةٍ وثاني أكسيدِ الكربونِ، تَستخدمُها لاستمرارِ أداءِ وظائفِها الحيويةِ. المخلوقاتُ الوحيدةُ الخليةِ ومنها البكتيريا تَستخدمُ هذهِ الطاقةَ لتنظيمِ تدفقِ الموادِّ منَ الخليةِ وإليها، وللانتقالِ من مكانٍ إلى آخرَ، ولأداءِ العديدِ منَ الوظائفِ الأخرى. وبعضُ المخلوقاتِ الحيةِ تَســتخدمُ التنفسَ الخلويَّ مِنْ دونِ الحاجةِ إلى وجودِ الأكسجينِ.\nكيفَ يمكنُني قيــاسُ معدلِ التنفسِ الخلــويِّ في الخميــرةِ؟ أكتبُ الإجابةَ على شكلِ فرضيةٍ على النحوِ الآتي: «إذا كانتْ خلايا الخميرةِ تقومُ بتكســيرِ جزيئاتِ الســكرِ، فإنَّ سرعةَ إنتاجِ الفقاعةِ سوفَ.................».", "simple": "الخلايا تحوّل جزيئات الغذاء إلى طاقة وثاني أكسيد الكربون. هذه العملية اسمها التنفس الخلوي. في هذه التجربة نقيس سرعتها في الخميرة. نعدّ الفقاعات التي تخرج منها.", "steps": [{"q": "ماذا أرى؟", "t": "أرى قائمة أدوات التجربة: «أحتاج إلى».", "fig": "f42a", "parts": [], "a": "v54bc1433dcf1"}, {"q": "ما الأجزاء؟", "t": "خميرة وسكر وماء، وماصتان وأنابيب اختبار وكاشف.", "fig": "f42a", "parts": ["p3", "p5", "p4", "p2", "p7", "p8"], "a": "vb9cd12714b53"}, {"q": "ماذا يفعل؟", "t": "التنفس الخلوي يحوّل جزيئات الغذاء إلى طاقة وثاني أكسيد الكربون.", "a": "v66c93d197f89"}, {"q": "كيف يرتبط بغيره؟", "t": "المخلوقات الوحيدة الخلية تستخدم هذه الطاقة لتنقل المواد وتتحرك.", "a": "v65f1348271ac"}, {"q": "الفكرة المهمة", "t": "بعض المخلوقات تقوم بالتنفس الخلوي من دون الحاجة إلى الأكسجين.", "a": "v0be6cbd76d9e"}], "figs": ["f42a"], "key": "التنفس الخلوي عملية تحوّل فيها الخلايا جزيئات الغذاء إلى طاقة وثاني أكسيد الكربون.", "sa": "v8f62337f8f3c"}, {"id": "L04-s2", "page": 42, "title": "أختبرُ فرضيّتي", "book": "١ أمــلأُ الماصّةَ البلاســتيكيةَ بمحلولِ الخمــيرةِ، والماءِ والســكرِ، ثمَّ ألفُّ حولها ســلكًا طولُهُ ١٠ سم؛ ليمثلَ ثقلًا لإبقاءِ الماصةِ تحتَ سطحِ الماءِ.\n٢ أملأُ أنبوبَ الاختبــارِ إلى منتصفِهِ بالمــاءِ، ثمَّ أضيفُ خمسَ قطراتٍ من بروموثايمولِ الأزرقِ.\n٣ أحذرْ. أســتخدمُ المقصَّ لقصِّ ٢,٥ سم من طرفِ الماصةِ. مما يسمحُ للماءِ بتغطيةِ الماصةِ.\n٤ أمســكُ الماصةَ مــنْ طرفِها العلــويِّ وأضعُهــا في أنبوبِ الاختبارِ، ثمَّ أضيفُ ماءً إلى الأنبوبِ حتى يغمرَ الماصةَ.\n٥ أتواصلُ. أســجلُ كمْ فقاعةً تظهرُ خلالَ ١٠ دقائقَ، وأسجلُ أيَّ تغيرٍ في اللونِ يطرأُ في أنبوبِ الاختبارِ.\n٦ أكررُ الخطواتِ من ١ إلى ٥ مرةً أخرى، وأسجلُ نتائجي.", "simple": "نضع محلول الخميرة والسكر والماء في ماصة. نغمرها في أنبوب فيه ماء وكاشف. ثم نعدّ الفقاعات خلال ١٠ دقائق. ونكرر التجربة لنتأكد.", "steps": [{"q": "الخطوة ١", "t": "أملأ الماصة بمحلول الخميرة والماء والسكر، وألفّ حولها السلك ثقلًا.", "fig": "f42b", "parts": [], "a": "vc0f4bf4b5e74"}, {"q": "الخطوة ٢", "t": "أملأ الأنبوب إلى منتصفه بالماء، وأضيف خمس قطرات من الكاشف.", "fig": "f42c", "parts": [], "a": "v7f62545ade47"}, {"q": "الخطوة ٣", "t": "أحذر وأنا أقص ٢,٥ سم من طرف الماصة بالمقص.", "fig": "f42d", "parts": [], "a": "v856dc00373d8"}, {"q": "الخطوة ٤", "t": "أضع الماصة في الأنبوب، وأضيف ماء حتى يغمرها.", "fig": "f42e", "parts": [], "a": "vfa6c5d8227a3"}, {"q": "الخطوة ٥", "t": "أسجل عدد الفقاعات خلال ١٠ دقائق، وأي تغير في اللون.", "a": "v084c591d7f8d"}, {"q": "الخطوة ٦", "t": "أكرر الخطوات من ١ إلى ٥ مرة أخرى، وأسجل نتائجي.", "a": "v848c9bd02684"}], "figs": ["f42b", "f42c", "f42d", "f42e"], "key": "نقيس سرعة التنفس الخلوي في الخميرة بعدّ الفقاعات خلال زمن محدد.", "sa": "vd6610c5916bd"}, {"id": "L04-s3", "page": 43, "title": "استقصاءٌ موجَّهٌ: ما الذي يؤثرُ في سرعةِ التنفسِ الخلويِّ؟", "book": "هناكَ عواملُ كثيرةٌ تؤثرُ في سرعــةِ التنفسِ الخلويِّ، فإذا قمتُ بالركــضِ أو ركوبِ الدراجةِ الهوائيةِ، فســأبدأُ في أخذِ نفسٍ عميقٍ بشــكلٍ متواصلٍ. كيــفَ يمكنُني زيادةُ سرعةِ التنفــسِ الخلويِّ في الخميرةِ؟ أكتــبُ إجابتي على شــكلِ فرضيةٍ على النحوِ التالي: \"إذا تغيرتْ بيئةُ الخميرةِ بتغيرِ ..........، فإنَّ سرعةَ التنفسِ الخلويِّ ستزدادُ\".\nأصممُ تجربةً لزيــادةِ سرعةِ التنفسِ الخلــويِّ للخميرةِ. أكتبُ الموادَّ التي أحتاجُ إليها والخطواتِ التي ســأتبعُها، وأسجّلُ ملاحظاتِي ونتائجي.\nهل كانتِ النتائجُ التــي توصلتُ إليها تدعمُ فرضيتي؟ أفسّرُ ذلك. ما العواملُ التي أثرتْ في سرعةِ التنفسِ الخلويِّ؟", "simple": "عوامل كثيرة تؤثر في
