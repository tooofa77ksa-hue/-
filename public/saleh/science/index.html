a": "v37b4d916c153", "da": "vde174587e2cd"}, {"term": "الانتخابُ الطَّبيعيُّ", "def": "يُعرفُ الانتخابُ الطَّبيعيُّ بأنَّه عمليةُ تكيُّفِ الكائناتِ الحيَّةِ في بيئةٍ معينةٍ بفضلِ امتلاكِها بعضَ الخصائصِ الَّتي تُمكّنُها من العيشِ في تلكَ البيئةِ أكثرَ من غيرِهَا.", "page": 68, "sec": "L08-s9", "fig": "f68a", "parts": [], "exact": true, "ta": "v2c2c8ba80be2", "da": "vc36f943508eb"}], "points": [{"t": "من الصفات التي يرثها الإنسان: الإبهام المقوّس أو المستقيم، وشحمة الأذن الملتحمة أو غير الملتحمة، والقدرة على لفّ اللسان.", "page": 63, "sec": "L08-s2", "fig": "f63b", "parts": [], "a": "v734325ff8786"}, {"t": "صفات موروثة في النبات: لون الزهرة وطول النبات وشكل البذور. وفي الإنسان: لون الشعر والعيون وملامح الوجه وطريقة الضحك.", "page": 64, "sec": "L08-s3", "fig": null, "parts": [], "a": "v381e303cc735"}, {"t": "أمثلة الغريزة: بناء العنكبوت لشبكته، وبناء طائر الحبّاك لعشّه، وتنفّس الطفل دون تعلّم، واتخاذ النحل بيوتها من الجبال والشجر.", "page": 65, "sec": "L08-s3", "fig": "f64a", "parts": [], "a": "va216e8fbdfd1"}, {"t": "السلوك المكتسب يأتي بالممارسة والخبرة، مثل لعب الكرة ولعب الدلفين بالكرة، ولا ينتقل للأبناء؛ فكسر غصن شجرة لا يؤثر في صفات أفرادها الجديدة.", "page": 65, "sec": "L08-s4", "fig": "f65a", "parts": [], "a": "v759cd278e247"}, {"t": "البيئة تؤثر في الصفات المكتسبة: كمية الماء تؤثر في طول النبات، وكمية الغذاء في حجم صغار القطط، والرياضة تُكسب مهارات.", "page": 65, "sec": "L08-s4", "fig": null, "parts": [], "a": "vd7363bea2e76"}, {"t": "جريجور مندل اكتشف المبادئ الأساسية لعلم الوراثة، وبدأ تجاربه على البازلاء سنة ١٨٥٦م؛ لأنها تنتج البذور بسرعة.", "page": 66, "sec": "L08-s5", "fig": null, "parts": [], "a": "v7e5925a50da9"}, {"t": "كل صفة موروثة يتحكم فيها جينان: واحد من الأب وواحد من الأم، والجينات مخزّنة على الكروموسومات.", "page": 66, "sec": "L08-s5", "fig": null, "parts": [], "a": "vda42cc8611b8"}, {"t": "عند تلقيح بازلاء أرجوانية مع بيضاء جاء الجيل الأول كله أرجوانيًا، ثم ظهرت الأزهار البيضاء مرة أخرى في الجيل الثاني.", "page": 66, "sec": "L08-s6", "fig": "f67b", "parts": ["p1", "p2", "p3", "p4"], "a": "v2c77bbb1d07f"}, {"t": "في البازلاء السائد: البذور الملساء والأزهار الأرجوانية والقرون الخضراء، والمتنحّي: البذور المجعّدة والأزهار البيضاء والقرون الصفراء.", "page": 66, "sec": "L08-s5", "fig": "f66a", "parts": ["p1", "p2", "p3", "p4", "p5", "p6"], "a": "vf3d76aab4b99"}, {"t": "النبات الهجين يحمل جين السائدة وجين المتنحية. ويُرمز للسائدة بحرف كبير (P للأرجواني) وللمتنحية بحرف صغير (p للأبيض).", "page": 66, "sec": "L08-s5", "fig": "f67b", "parts": ["p5"], "a": "v027dc647bddf"}, {"t": "الصفات السائدة تظهر أكثر من المتنحية، وشحمة الأذن وشكل الإبهام عند الإنسان لها شكل سائد وشكل متنحٍّ.", "page": 67, "sec": "L08-s6", "fig": null, "parts": [], "a": "v8e023b79fd8f"}, {"t": "في مخطط السلالة: المربع ذكر والدائرة أنثى، والخط الأفقي يربط الأبوين والعمودي يربطهما بالأبناء، والملوّن سائد والأبيض متنحٍّ.", "page": 68, "sec": "L08-s8", "fig": "f68b", "parts": ["p1", "p2", "p3", "p4", "p5", "p6"], "a": "v4d539a8237d9"}, {"t": "أبوان لهما غمّازات قد ينجبان طفلًا بلا غمّازات؛ لأنهما يحملان جين الصفة المتنحية دون أن تظهر عليهما.", "page": 68, "sec": "L08-s8", "fig": "f68b", "parts": ["p1", "p2"], "a": "v4507dff6f813"}, {"t": "عصافير غالاباغوس كانت مناقيرها كبيرة، ولما جفّ المناخ صارت مع الأجيال أصغر لتلتقط البذور النادرة الصغيرة.", "page": 68, "sec": "L08-s9", "fig": "f68a", "parts": [], "a": "v3e0556bac92a"}], "quiz": [{"id": "L08-m1", "src": "L08-q1", "kept": false, "page": 62, "type": "tf", "text": "تشبهُ صغارُ الدببةِ أمَّها مصادفةً.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "خطأ. ليس مصادفة؛ الله تعالى جعل الصفات تنتقل من الآباء إلى الأبناء، وهذا هو الوراثة (ص٦٤).", "why": {"0": "الشبه ليس مصادفة، بل بالوراثة."}, "evp": 64, "back": "L08-s1", "fig": "f62a", "section": "صح أم خطأ", "qa": "v61b92f0c3e59", "ea": "v35423b8b8f03", "wa": null, "ha": null, "whyA": {"0": "vccb707e5e0f9"}}, {"id": "L08-m2", "src": "L08-q6", "kept": false, "page": 63, "type": "mcq", "text": "لماذا تكونُ بعضُ الصفاتِ أكثرَ شيوعًا منْ غيرِها بينَ الناسِ؟", "options": ["أ. لأنها صفات مكتسبة بالتدريب", "ب. لأن الصفات السائدة تظهر أكثر من الصفات المتنحية", "ج. لأن الصفات المتنحية تمنع السائدة من الظهور", "د. لأنها تتغير بكمية الغذاء"], "answer": 1, "answerText": "ب. لأن الصفات السائدة تظهر أكثر من الصفات المتنحية", "explain": "الكتاب (ص٦٧): من الطبيعي أن تظهر الصفات السائدة أكثر من الصفات المتنحية التي يُحجب ظهورها.", "why": {"0": "صفات مثل شحمة الأذن والإبهام موروثة لا مكتسبة.", "2": "العكس: السائدة هي التي تمنع المتنحية من الظهور.", "3": "الغذاء يؤثر في الصفات المكتسبة مثل الحجم، لا في هذه الصفات الموروثة."}, "evp": 67, "back": "L08-s6", "section": "اختر الإجابة الصحيحة", "qa": "vf1fd0c335464", "ea": "v99fe9b7dd249", "wa": null, "ha": null, "whyA": {"0": "v86b4a5b08202", "2": "v723f53bd17b9", "3": "vb2438257c223"}}, {"id": "L08-m3", "src": "L08-q8", "kept": false, "page": 64, "type": "mcq", "text": "كيفَ تنتقلُ الصفاتُ منَ الآباءِ إلى الأبناءِ؟", "options": ["أ. بالتعلّم من الآباء", "ب. بالانقسام المتساوي في خلايا الجلد", "ج. بالممارسة والخبرة", "د. خلال التكاثر بالجينات: جين من الأب وجين من الأم"], "answer": 3, "answerText": "د. خلال التكاثر بالجينات: جين من الأب وجين من الأم", "explain": "توصّل مندل إلى أن الصفات الموروثة تنتقل خلال عملية التكاثر، وكل صفة يتحكم فيها جينان: من الأب ومن الأم (ص٦٦).", "why": {"0": "ما يُتعلَّم صفة مكتسبة لا تُورَث.", "1": "الانقسام المتساوي يصنع خلايا جديدة في الجسم نفسه.", "2": "الممارسة والخبرة تُكسب سلوكًا مكتسبًا لا يُنقَل للأبناء."}, "evp": 66, "back": "L08-s5", "section": "اختر الإجابة الصحيحة", "qa": "v05d3ab6de911", "ea": "v3e33722122f1", "wa": null, "ha": null, "whyA": {"0": "v73d0d444ca22", "1": "vdea93657e9ba", "2": "v36037fcb11c1"}}, {"id": "L08-m4", "src": "L08-q9", "kept": false, "page": 64, "type": "tf", "text": "بعضُ السلوكِ ـ ومنهُ الغرائزُ ـ صفاتٌ موروثةٌ.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "صح. الكتاب (ص٦٤): بعض السلوك ومنه الغرائز صفات موروثة.", "why": {"1": "العبارة صحيحة؛ الغريزة سلوك موروث غير مكتسب."}, "evp": 64, "back": "L08-s3", "section": "صح أم خطأ", "qa": "v061428e6ec3c", "ea": "v68dfc9907ca5", "wa": null, "ha": null, "whyA": {"1": "v819917498570"}}, {"id": "L08-m5", "src": "L08-q10", "kept": false, "page": 64, "type": "mcq", "text": "مهارةُ العنكبوتِ في نسجِ شبكتِه المعقّدةِ:", "options": ["أ. سلوك مكتسب تعلّمه من أمه", "ب. غريزة موروثة", "ج. صفة يكتسبها بالتدريب", "د. صفة متنحية لا تظهر"], "answer": 1, "answerText": "ب. غريزة موروثة", "explain": "الكتاب (ص٦٤–٦٥): مهارة بناء الشبكة غريزة موروثة، تمامًا كما يولد صغار الإنسان يتنفسون دون تعلّم.", "why": {"0": "العنكبوت لا يتعلم بناء الشبكة؛ هي غريزة.", "2": "الغريزة لا تُكتسب بالتدريب، بل تولد مع الحيوان.", "3": "مهارة النسج تظهر عند العنكبوت، فهي ليست صفة محجوبة."}, "evp": 65, "back": "L08-s3", "fig": "f64b", "section": "اختر الإجابة الصحيحة", "qa": "v8d50e56fb7e3", "ea": "vc6dad5d845f1", "wa": null, "ha": null, "whyA": {"0": "vc68ab64ea84a", "2": "vfb9d888e31e3", "3": "vc86f456e9641"}}, {"id": "L08-m6", "src": "L08-q11", "kept": false, "page": 65, "type": "tf", "text": "التنفّسُ سلوكٌ موروثٌ؛ فصغارُ الإنسانِ يولدونَ يتنفّسونَ منْ دونِ تعلُّمٍ.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "صح، وهذه حقيقة لا رأي. الكتاب (ص٦٥): يولد صغار الإنسان يتنفسون من دون حاجة إلى تعلّم طريقة التنفس.", "why": {"1": "العبارة صحيحة؛ التنفس غريزة لا تحتاج إلى تعلّم."}, "evp": 65, "back": "L08-s3", "section": "صح أم خطأ", "qa": "vc47a4c11c09f", "ea": "v8b421001677e", "wa": null, "ha": null, "whyA": {"1": "va7859043d66a"}}, {"id": "L08-m7", "src": "L08-q12", "kept": false, "page": 65, "type": "mcq", "text": "خرجَ طائرُ الحبّاكِ منْ بيضتِه، ووُضعَ في قفصٍ معَ طائرِ الحنّاءِ ليكبرَ. أيُّ عشٍّ سيبني؟", "options": ["أ. عشًّا مثل عش طائر الحنّاء", "ب. لن يبني عشًّا أبدًا", "ج. عشًّا مثل عش طائر الحبّاك؛ لأن بناء العش غريزة موروثة", "د. شبكة مثل شبكة العنكبوت"], "answer": 2, "answerText": "ج. عشًّا مثل عش طائر الحبّاك؛ لأن بناء العش غريزة موروثة", "explain": "الكتاب (ص٦٥): تخرج أفراخ الطيور من البيض ولدى كل نوع منها مهارة وطريقة مختلفة في بناء عشّه؛ فهي غريزة لا تُتعلَّم.", "why": {"0": "بناء العش غريزة موروثة، فلا يتعلمه من طائر آخر.", "1": "مهارة بناء العش تولد معه.", "3": "نسج الشبكة غريزة العنكبوت لا الطيور."}, "evp": 65, "back": "L08-s3", "section": "اختر الإجابة الصحيحة", "qa": "v031bb00a55f0", "ea": "vb8830b192104", "wa": null, "ha": null, "whyA": {"0": "v5994ab20cd43", "1": "va1403005cad1", "3": "vb529021b1440"}}, {"id": "L08-m8", "src": "L08-q13", "kept": false, "page": 66, "type": "mcq", "text": "لماذا يُشبهُ بعضُ الأشخاصِ أحدَ الأبوينِ ولا يُشبهُ الآخرَ؟", "options": ["أ. لأن صفة أحد الأبوين سائدة تمنع الصفة الأخرى من الظهور", "ب. لأنه يرث الجينات من أحد الأبوين فقط", "ج. لأنه يتعلم صفات أحد الأبوين", "د. لأن الجينات لا توجد على الكروموسومات"], "answer": 0, "answerText": "أ. لأن صفة أحد الأبوين سائدة تمنع الصفة الأخرى من الظهور", "explain": "كل صفة يتحكم فيها جينان: من الأب ومن الأم. والصفة السائدة تمنع الصفة المتنحية من الظهور (ص٦٦).", "why": {"1": "كل صفة يتحكم فيها جين من الأب وجين من الأم.", "2": "الصفات الموروثة لا تُتعلَّم.", "3": "الكتاب يقول: تُخزَّن الجينات على الكروموسومات."}, "evp": 66, "back": "L08-s5", "section": "اختر الإجابة الصحيحة", "qa": "vc6e041937329", "ea": "vdf450233e78b", "wa": null, "ha": null, "whyA": {"1": "v396d698f01ed", "2": "ve02350fc066f", "3": "v4e673c8fab32"}}, {"id": "L08-m9", "src": "L08-q14", "kept": false, "page": 66, "type": "mcq", "text": "لقّحَ مندلُ بازلاءَ أرجوانيةَ الأزهارِ معَ بازلاءَ بيضاءِ الأزهارِ، فجاءَ الأبناءُ كلُّهم أرجوانيين. ماذا حدثَ لصفةِ الأزهارِ البيضاءِ؟", "options": ["أ. اختفت إلى الأبد", "ب. لم تختفِ، بل منعتها صفة الأزهار الأرجوانية السائدة من الظهور", "ج. تحولت إلى صفة سائدة", "د. تغيرت بسبب كمية الماء"], "answer": 1, "answerText": "ب. لم تختفِ، بل منعتها صفة الأزهار الأرجوانية السائدة من الظهور", "explain": "الكتاب (ص٦٦): صفة الأزهار البيضاء لم تختفِ، وإنما منعتها من الظهور صفة الأزهار الأرجوانية، فظهرت مرة أخرى في الجيل الثاني.", "why": {"0": "لو اختفت ما ظهرت في الجيل الثاني، وقد ظهرت.", "2": "الأزهار البيضاء صفة متنحية، والأرجوانية هي السائدة.", "3": "لون الزهرة صفة موروثة لا تتغير بالماء."}, "evp": 66, "back": "L08-s5", "fig": "f67b", "section": "اختر الإجابة الصحيحة", "qa": "v1bbb26fce1b7", "ea": "v55423d356232", "wa": null, "ha": null, "whyA": {"0": "v0d2acfd51bd0", "2": "vb973a5d89121", "3": "v448d5ba88e70"}}, {"id": "L08-m10", "src": "L08-q15", "kept": false, "page": 67, "type": "tf", "text": "عبارةُ «الأزهارُ البيضاءُ أجملُ منَ الأزهارِ الأرجوانيةِ» حقيقةٌ علميةٌ.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "خطأ. هذه العبارة رأي؛ فالجمال يختلف من شخص لآخر ولا يمكن إثباته. والحقيقة العلمية هنا: الأرجوانية صفة سائدة والبيضاء متنحية.", "why": {"0": "الجمال رأي شخصي، لا حقيقة يمكن إثباتها."}, "evp": 66, "back": "L08-s5", "section": "صح أم خطأ", "qa": "vb1c06ec140cd", "ea": "v374f18f09315", "wa": null, "ha": null, "whyA": {"0": "v66b2ed1143e1"}}, {"id": "L08-m11", "src": "L08-q16", "kept": false, "page": 67, "type": "tf", "text": "إذا كانتْ لديَّ زهرةٌ حمراءُ فإنّي أعرفُ بالتأكيدِ لونَ الأزهارِ التي ستنتجُ عنها.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "خطأ. لا يمكن معرفته بالتأكيد؛ فقد تحمل الزهرة جين صفة متنحية لا يظهر عليها، كما ظهرت الأزهار البيضاء في الجيل الثاني (ص٦٦).", "why": {"0": "قد تحمل الزهرة جينًا متنحيًا محجوبًا يظهر في أبنائها."}, "evp": 66, "back": "L08-s5", "section": "صح أم خطأ", "qa": "v7853db2f3565", "ea": "v4b6a5681c689", "wa": null, "ha": null, "whyA": {"0": "vc3de89e22a3e"}}, {"id": "L08-m12", "src": "L08-q20", "kept": false, "page": 67, "type": "mcq", "text": "في صورةِ كوزِ الذرةِ (نشاط ص٦٧)، أيُّ لونٍ عددُ حبوبِه أكثرُ؟", "options": ["أ. الأسود", "ب. الأزرق", "ج. الأخضر", "د. الأصفر"], "answer": 3, "answerText": "د. الأصفر", "explain": "في صورة الكوز أكثر الحبوب صفراء وبعضها أسود.", "why": {"0": "الحبوب السوداء أقل عددًا في الكوز.", "1": "لا توجد حبوب زرقاء في الكوز.", "2": "لا توجد حبوب خضراء في الكوز."}, "evp": 67, "back": "L08-s7", "fig": "f67a", "section": "اختر الإجابة الصحيحة", "qa": "v4c1aeaa25e11", "ea": "vdc6514867a47", "wa": null, "ha": null, "whyA": {"0": "va7008157c1f1", "1": "v26df76f69648", "2": "v0af53b67bce5"}}, {"id": "L08-m13", "src": "L08-q21", "kept": false, "page": 67, "type": "mcq", "text": "صفةُ الحبوبِ السوداءِ في كوزِ الذرةِ:", "options": ["أ. سائدة؛ لأنها أغمق لونًا", "ب. متنحية؛ لأنها أقل ظهورًا، والصفات السائدة تظهر أكثر", "ج. مكتسبة؛ لأنها تتغير بالماء", "د. سائدة؛ لأنها أقل عددًا"], "answer": 1, "answerText": "ب. متنحية؛ لأنها أقل ظهورًا، والصفات السائدة تظهر أكثر", "explain": "الكتاب (ص٦٧): من الطبيعي أن تظهر الصفات السائدة أكثر من المتنحية. والحبوب السوداء أقل، فهي متنحية.", "why": {"0": "اللون الغامق لا يعني أن الصفة سائدة؛ المهم أيهما يظهر أكثر.", "2": "لون الحبوب صفة موروثة من النبتة الأم.", "3": "الصفة السائدة هي التي تظهر أكثر، لا الأقل."}, "evp": 67, "back": "L08-s6", "fig": "f67a", "section": "اختر الإجابة الصحيحة", "qa": "v6e36ad6fba13", "ea": "vc0b53c76877e", "wa": null, "ha": null, "whyA": {"0": "v1698b22133f9", "2": "v23a379e4627e", "3": "v285d6fc0ae61"}}, {"id": "L08-m14", "src": "L08-q22", "kept": false, "page": 67, "type": "mcq", "text": "لماذا مُثِّلتِ الأزهارُ الأرجوانيةُ في الجيلِ الأولِ بالحروفِ Pp؟", "options": ["أ. لأنها ورثت جين P من الأب الأرجواني (PP) وجين p من الأب الأبيض (pp)", "ب. لأنها ورثت جينين من الأب الأرجواني فقط", "ج. لأن P تعني الأزهار البيضاء", "د. لأنها نباتات لا تحمل أي جين متنحٍّ"], "answer": 0, "answerText": "أ. لأنها ورثت جين P من الأب الأرجواني (PP) وجين p من الأب الأبيض (pp)", "explain": "في شكل تلقيح البازلاء (ص٦٧): الأب الأرجواني PP والأب الأبيض pp، فيرث كل ابن P من أحدهما وp من الآخر.", "why": {"1": "كل صفة يتحكم فيها جينان: واحد من كل أب.", "2": "الحرف الكبير P للصفة السائدة (الأرجوانية)، والصغير p للبيضاء.", "3": "الحرف p الصغير يعني أنها تحمل جين الصفة المتنحية."}, "evp": 67, "back": "L08-s6", "fig": "f67b", "section": "اختر الإجابة الصحيحة", "qa": "v97b8ec83fee2", "ea": "vb6ff56d09e6b", "wa": null, "ha": null, "whyA": {"1": "v95ed8103291a", "2": "vc4e7bb01cd8e", "3": "v06bd7c51b7f3"}}, {"id": "L08-m15", "src": "L08-q23", "kept": false, "page": 68, "type": "mcq", "text": "كيفَ يمكنُ لوالدينِ لديهما غمّازاتٌ أنْ ينجبا طفلًا ليسَ لهُ غمّازاتٌ؟", "options": ["أ. لأن الطفل لم يتدرّب على الغمازات", "ب. لأن الغمازات صفة مكتسبة", "ج. لأن كلا الأبوين يحمل جين الصفة المتنحية (بدون غمازات) فورثه الطفل منهما", "د. لأن الطفل ورث جينًا من الأم فقط"], "answer": 2, "answerText": "ج. لأن كلا الأبوين يحمل جين الصفة المتنحية (بدون غمازات) فورثه الطفل منهما", "explain": "الكتاب (ص٦٨): كلا الأبوين له غمازات، ولكنهما يحملان جين الصفة المتنحية؛ فالحامل للصفة ورث جينها ولا تظهر عليه.", "why": {"0": "الغمازات صفة موروثة، لا تأتي بالتدريب.", "1": "الغمازات صفة موروثة سائدة، لا مكتسبة.", "3": "الطفل يرث جينًا من الأب وجينًا من الأم."}, "evp": 68, "back": "L08-s8", "fig": "f68b", "section": "اختر الإجابة الصحيحة", "qa": "v1725387f9515", "ea": "v0476ee311bd0", "wa": null, "ha": null, "whyA": {"0": "v14062bad771b", "1": "vbc9b0db61aef", "3": "v3e71b9eaa0ff"}}, {"id": "L08-m16", "src": "L08-q24", "kept": false, "page": 68, "type": "tf", "text": "في مخطّطِ السلالةِ يُرمزُ إلى الذكورِ بالمربعاتِ، وإلى الإناثِ بالدوائرِ.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "صح، وهذه حقيقة عن مخطط السلالة (ص٦٨).", "why": {"1": "العبارة صحيحة كما في الكتاب."}, "evp": 68, "back": "L08-s8", "fig": "f68b", "section": "صح أم خطأ", "qa": "v7076aa941a69", "ea": "va8f81e721839", "wa": null, "ha": null, "whyA": {"1": "v4a4926c1d851"}}, {"id": "L08-m17", "src": "L08-q25", "kept": false, "page": 68, "type": "mcq", "text": "هلْ يمكنُ لشخصٍ بدونِ غمّازاتٍ أنْ يُنجبَ أطفالًا بغمّازاتٍ؟", "options": ["أ. لا أبدًا؛ لأن الطفل يشبه أباه فقط", "ب. نعم، إذا كان الطرف الآخر له غمازات؛ لأن الغمازات صفة سائدة", "ج. نعم، إذا تدرّب الأطفال على ذلك", "د. لا؛ لأن الغمازات صفة متنحية"], "answer": 1, "answerText": "ب. نعم، إذا كان الطرف الآخر له غمازات؛ لأن الغمازات صفة سائدة", "explain": "في مخطط ص٦٨ الغمازات صفة سائدة؛ فإذا كان الطرف الآخر له غمازات قد يرث الطفل جينها فتظهر عليه.", "why": {"0": "الطفل يرث جينًا من الأب وجينًا من الأم.", "2": "الغمازات صفة موروثة لا تأتي بالتدريب.", "3": "مفتاح المخطط: الغمازات صفة سائدة."}, "evp": 68, "back": "L08-s8", "fig": "f68b", "section": "اختر الإجابة الصحيحة", "qa": "ve71ec38da661", "ea": "ve6475ac7090c", "wa": null, "ha": null, "whyA": {"0": "v3e71b9eaa0ff", "2": "v7007e97ac4fd", "3": "ve9600bdddbb3"}}, {"id": "L08-m18", "src": "L08-q26", "kept": false, "page": 68, "type": "mcq", "text": "في مخطّطِ السلالةِ ص٦٨، أيُّ الأبناءِ ليسَ لهُ غمّازاتٌ؟", "options": ["أ. الابن صاحب المربع البنفسجي", "ب. الابنة الأولى", "ج. الابنة الثانية", "د. الابن صاحب المربع الأبيض"], "answer": 3, "answerText": "د. الابن صاحب المربع الأبيض", "explain": "اللون البنفسجي يمثل الغمازات (صفة سائدة)، والأبيض يمثل بدون غمازات (صفة متنحية). والمربع الأبيض ابن.", "why": {"0": "المربع البنفسجي يعني أن له غمازات.", "1": "دائرة الابنة الأولى بنفسجية، فلها غمازات.", "2": "دائرة الابنة الثانية بنفسجية، فلها غمازات."}, "evp": 68, "back": "L08-s8", "fig": "f68b", "section": "اختر الإجابة الصحيحة", "qa": "v26a21b3793d0", "ea": "v75b9ec855f6c", "wa": null, "ha": null, "whyA": {"0": "v453cd636746a", "1": "v0b58713ac2db", "2": "v1c4822338435"}}, {"id": "L08-m19", "src": "L08-q28", "kept": false, "page": 69, "type": "tf", "text": "تتحكّمُ في الصفاتِ تراكيبُ في الخليةِ تُسمّى الجيناتِ.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "صح. كل صفة موروثة يتحكم فيها عاملان يسميان الجينات، ويحتوي الجين على المعلومات الكيميائية للصفة (ص٦٦).", "why": {"1": "العبارة صحيحة؛ الجينات تتحكم في الصفات."}, "evp": 66, "back": "L08-s5", "section": "صح أم خطأ", "qa": "v8d114e72b8bb", "ea": "v295c139e93a8", "wa": null, "ha": null, "whyA": {"1": "v9d4eedfe9d61"}}, {"id": "L08-m20", "src": "L08-q29", "kept": false, "page": 69, "type": "tf", "text": "بالتدريبِ يمكنُ لأيِّ شخصٍ أنْ يَثنيَ لسانَه.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "خطأ. القدرة على لفّ اللسان من الصفات التي يرثها الإنسان (ص٦٣)، والتدريب يُكسب صفات مكتسبة فقط.", "why": {"0": "ثني اللسان صفة موروثة لا تأتي بالتدريب."}, "evp": 63, "back": "L08-s4", "section": "صح أم خطأ", "qa": "vbb4c3da6fc05", "ea": "vdaa7f8efcdb3", "wa": null, "ha": null, "whyA": {"0": "v92a3e2e5dc55"}}, {"id": "L08-m21", "src": "L08-q30", "kept": false, "page": 69, "type": "mcq", "text": "لماذا ينصحُ الأطباءُ حاملي جيناتِ المرضِ بالفحصِ قبلَ الزواجِ؟", "options": ["أ. لأن المرض يظهر دائمًا على الحامل", "ب. لأن حامل الجين قد لا يظهر عليه المرض لكنه قد ينقل الجين إلى أبنائه", "ج. لأن المرض صفة مكتسبة", "د. لأن الفحص يغيّر الجينات"], "answer": 1, "answerText": "ب. لأن حامل الجين قد لا يظهر عليه المرض لكنه قد ينقل الجين إلى أبنائه", "explain": "الكتاب (ص٦٨–٦٩): الحامل للصفة ورث جينها ولا تظهر عليه، ويمكنه نقل جيناتها إلى أبنائه.", "why": {"0": "الحامل لا تظهر عليه الصفة شكليًّا.", "2": "الأمراض التي تنتقل بالجينات صفات موروثة.", "3": "الفحص يكشف الجين ولا يغيّره."}, "evp": 68, "back": "L08-s8", "section": "اختر الإجابة الصحيحة", "qa": "v2883ef99214c", "ea": "v284d2eca7992", "wa": null, "ha": null, "whyA": {"0": "v64b68d97c7e8", "2": "veebb1e931c57", "3": "vc698f9774723"}}, {"id": "L08-m22", "src": "L08-q31", "kept": true, "page": 69, "type": "mcq", "text": "العواملُ التي وصفَها جريجورُ مندلُ وتتحكَّمُ في صفاتِ المخلوقاتِ الحيّةِ هي:", "options": ["أ. الجيناتُ", "ب. مخططُ السلالةِ", "ج. الغشاءُ الخلويُّ", "د. الغريزةُ"], "answer": 0, "answerText": "أ. الجيناتُ", "explain": "توصل مندل إلى أن كل صفة موروثة يتحكم فيها عاملان يسميان الجينات.", "why": {"1": "مخطط السلالة رسم لتتبع الصفات في العائلة، لا يتحكم فيها.", "2": "الغشاء البلازمي (الخلوي) يتحكم في دخول المواد وخروجها.", "3": "الغريزة سلوك موروث، وليست ما وصفه مندل."}, "evp": 66, "back": "L08-s5", "section": "اختر الإجابة الصحيحة", "qa": "v0e5278c45624", "ea": "v4d0e2aad8739", "wa": null, "ha": null, "whyA": {"1": "vf5c7e2181165", "2": "v0bb0a61c1eea", "3": "veaac14f26936"}}, {"id": "L08-m23", "src": "L08-q32", "kept": true, "page": 69, "type": "mcq", "text": "أيٌّ ممّا يلي سُلوكٌ مكتسَبٌ؟", "options": ["أ. بناءُ الطائرِ عشَّهُ.", "ب. نسجُ العنكبوتِ شبكتَهُ.", "ج. لعبُ الدلفينِ بالكرةِ", "د. تَنفُّسُ الطفلِ"], "answer": 2, "answerText": "ج. لعبُ الدلفينِ بالكرةِ", "explain": "مهارة اللعب بالكرة عند الدلفين سلوك مكتسب، تُكتسب بالتعلم والتدريب.", "why": {"0": "بناء العش غريزة موروثة.", "1": "نسج الشبكة غريزة موروثة.", "3": "التنفس غريزة يولد بها الطفل."}, "evp": 65, "back": "L08-s4", "section": "اختر الإجابة الصحيحة", "qa": "vc5fc15c9f11e", "ea": "vfbead013f791", "wa": null, "ha": null, "whyA": {"0": "v9a1890fdc3fe", "1": "v39956e981cc1", "3": "va7b9cbcd5494"}}, {"id": "L08-m24", "src": "L08-q33", "kept": false, "page": 69, "type": "tf", "text": "تُخزَّنُ الجيناتُ على الكروموسوماتِ.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "صح. الكتاب (ص٦٦): وتُخزن الجينات على الكروموسومات.", "why": {"1": "العبارة صحيحة كما في الكتاب."}, "evp": 66, "back": "L08-s5", "section": "صح أم خطأ", "qa": "v7a7ce3bf4fb5", "ea": "va640dd40454a", "wa": null, "ha": null, "whyA": {"1": "v4a4926c1d851"}}, {"id": "L08-m25", "src": "L08-q35", "kept": false, "page": 69, "type": "mcq", "text": "يحتوي المشيجُ في الإنسانِ على ٢٠٠٠٠ جينٍ تقريبًا محمولةٍ على ٢٣ كروموسومًا. كم جينًا يحملُ كلُّ كروموسومٍ تقريبًا؟", "options": ["أ. ٢٠٠٢٣", "ب. ٨٧٠ تقريبًا", "ج. ٤٦٠٠٠٠", "د. ٢٣"], "answer": 1, "answerText": "ب. ٨٧٠ تقريبًا", "explain": "نقسم عدد الجينات على عدد الكروموسومات: ٢٠٠٠٠ ÷ ٢٣ ≈ ٨٧٠ جينًا.", "why": {"0": "هذا ناتج الجمع، والمطلوب القسمة.", "2": "هذا ناتج الضرب، والمطلوب القسمة.", "3": "٢٣ عدد الكروموسومات لا الجينات."}, "evp": 69, "back": "L08-s5", "section": "اختر الإجابة الصحيحة", "qa": "vd4df72123c13", "ea": "vafd022501e9f", "wa": null, "ha": null, "whyA": {"0": "v6a0d65ed5e7e", "2": "vb0ba767a0c89", "3": "vbe3a686b7880"}}, {"id": "L08-m26", "src": "point", "kept": false, "page": 63, "type": "tf", "text": "القدرةُ على لفِّ اللسانِ وشكلُ شحمةِ الأذنِ منَ الصفاتِ التي يرثُها الإنسانُ.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "صح. من الصفات التي يرثها الإنسان في نشاط أستكشف: الإبهام، وشحمة الأذن، ولفّ اللسان (ص٦٣).", "why": {"1": "العبارة صحيحة كما في نشاط ص٦٣."}, "evp": 63, "back": "L08-s2", "fig": "f63b", "section": "صح أم خطأ", "qa": "v1e841e54b16d", "ea": "v8d9ab87886b6", "wa": null, "ha": null, "whyA": {"1": "v9ef37ec50541"}}, {"id": "L08-m27", "src": "point", "kept": false, "page": 64, "type": "mcq", "text": "أيٌّ ممّا يلي صفةٌ موروثةٌ في النباتِ؟", "options": ["أ. كسر غصن الشجرة", "ب. طول النبات بسبب كثرة الماء", "ج. لون الزهرة", "د. انحناء الساق بسبب الريح"], "answer": 2, "answerText": "ج. لون الزهرة", "explain": "الكتاب (ص٦٤): بعض خواص النباتات ومنها لون الزهرة وطول النبات وشكل البذور صفات موروثة.", "why": {"0": "كسر الغصن لا يؤثر في الصفات التي تنتقل للأفراد الجديدة.", "1": "تأثير كمية الماء في الطول مثال على تأثير البيئة في الصفات المكتسبة.", "3": "ما يحدث بسبب البيئة لا يُورَث."}, "evp": 64, "back": "L08-s3", "section": "اختر الإجابة الصحيحة", "qa": "v72c02ad8fad6", "ea": "v99da3dc593cd", "wa": null, "ha": null, "whyA": {"0": "v28c52edc68ea", "1": "vec0ff095e1f7", "3": "vb54c8c00452e"}}, {"id": "L08-m28", "src": "point", "kept": false, "page": 64, "type": "mcq", "text": "أيٌّ ممّا يلي مثالٌ على الغريزةِ؟", "options": ["أ. تعلّم علم من العلوم", "ب. اتخاذ النحل بيوتها من الجبال والشجر", "ج. لعب كرة القدم", "د. لعب الدلفين بالكرة"], "answer": 1, "answerText": "ب. اتخاذ النحل بيوتها من الجبال والشجر", "explain": "الكتاب (ص٦٤–٦٥): اتخاذ النحل بيوتها من الجبال والأشجار غريزة، ألهمها الله ذلك.", "why": {"0": "تعلّم العلوم سلوك مكتسب بالممارسة.", "2": "مهارة كرة القدم سلوك مكتسب.", "3": "لعب الدلفين بالكرة سلوك مكتسب بالتدريب."}, "evp": 64, "back": "L08-s3", "fig": "f64a", "section": "اختر الإجابة الصحيحة", "qa": "v7324d803328d", "ea": "v873c51122142", "wa": null, "ha": null, "whyA": {"0": "vba2211b6cd6c", "2": "v7c7894c81714", "3": "v2d42b2406b89"}}, {"id": "L08-m29", "src": "point", "kept": false, "page": 65, "type": "tf", "text": "إذا كُسرَ غصنُ شجرةٍ فإنَّ أفرادَها الجديدةَ تنمو بأغصانٍ مكسورةٍ.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "خطأ. الصفات المكتسبة لا تُنقل إلى الأفراد الجديدة؛ فكسر الغصن لا يؤثر فيها، بل تنمو أغصان جديدة (ص٦٥).", "why": {"0": "كسر الغصن صفة مكتسبة لا تُورَث."}, "evp": 65, "back": "L08-s4", "section": "صح أم خطأ", "qa": "vd6294017cf7d", "ea": "v40214dcd027a", "wa": null, "ha": null, "whyA": {"0": "v470210d116e7"}}, {"id": "L08-m30", "src": "point", "kept": false, "page": 65, "type": "mcq", "text": "كيف تؤثّرُ البيئةُ في الصفاتِ المكتسبةِ؟", "options": ["أ. تغيّر لون عيون الإنسان", "ب. تجعل العنكبوت ينسج شبكته", "ج. تغيّر الجينات التي ينقلها الأب", "د. كمية الغذاء التي تُطعَم لصغار القطط تؤثر في أحجامها"], "answer": 3, "answerText": "د. كمية الغذاء التي تُطعَم لصغار القطط تؤثر في أحجامها", "explain": "الكتاب (ص٦٥): كمية الماء تؤثر في طول النبات، وكمية الغذاء تؤثر في أحجام صغار القطط، والرياضة تُكسب مهارات.", "why": {"0": "لون العيون صفة موروثة.", "1": "نسج الشبكة غريزة موروثة.", "2": "الصفات المكتسبة لا تُنقل إلى الأبناء."}, "evp": 65, "back": "L08-s4", "section": "اختر الإجابة الصحيحة", "qa": "v87d12a4b80d8", "ea": "vcd5507b3e13c", "wa": null, "ha": null, "whyA": {"0": "v08575284bba0", "1": "v39956e981cc1", "2": "v4bc7be6c12ff"}}, {"id": "L08-m31", "src": "point", "kept": false, "page": 66, "type": "mcq", "text": "لماذا استعملَ مندلُ نباتَ البازلاءِ في أبحاثِه؟", "options": ["أ. لأنها تنتج البذور بسرعة فيسهل تتبع صفاتها", "ب. لأن أزهارها كلها بيضاء", "ج. لأنها لا تتكاثر", "د. لأنها مخلوق وحيد الخلية"], "answer": 0, "answerText": "أ. لأنها تنتج البذور بسرعة فيسهل تتبع صفاتها", "explain": "الكتاب (ص٦٦): استعمل مندل البازلاء لأنها تنتج البذور بسرعة، مما يسهّل تتبع صفاتها من جيل إلى آخر.", "why": {"1": "أزهار البازلاء أرجوانية وبيضاء.", "2": "البازلاء تتكاثر، ولقّحها مندل.", "3": "البازلاء نبات متعدد الخلايا."}, "evp": 66, "back": "L08-s5", "section": "اختر الإجابة الصحيحة", "qa": "v7ffab7a7de33", "ea": "v07698776ad84", "wa": null, "ha": null, "whyA": {"1": "v7000ebf1be69", "2": "v3c33e7b968d1", "3": "v009b80af303b"}}, {"id": "L08-m32", "src": "point", "kept": false, "page": 66, "type": "tf", "text": "كلُّ صفةٍ موروثةٍ يتحكّمُ فيها جينٌ واحدٌ فقط منَ الأبِ.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "خطأ. كل صفة موروثة يتحكم فيها عاملان (جينان): واحد من الأب وآخر من الأم (ص٦٦).", "why": {"0": "الصفة يتحكم فيها جينان، من الأب ومن الأم."}, "evp": 66, "back": "L08-s5", "section": "صح أم خطأ", "qa": "v1a07fdd39c70", "ea": "v531886cd52d3", "wa": null, "ha": null, "whyA": {"0": "vd7fd36163b11"}}, {"id": "L08-m33", "src": "point", "kept": false, "page": 66, "type": "tf", "text": "عندَ تلقيحِ نباتينِ أرجوانيينِ منَ الجيلِ الأولِ ظهرتِ الأزهارُ البيضاءُ مرةً أخرى في الجيلِ الثاني.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "صح. الكتاب (ص٦٦): عندما لقّح مندل نباتين أرجوانيين من الجيل الأول ظهرت صفة الأزهار البيضاء في الجيل الثاني.", "why": {"1": "العبارة صحيحة كما في تجربة مندل."}, "evp": 66, "back": "L08-s6", "fig": "f67b", "section": "صح أم خطأ", "qa": "vdf5eee4d4817", "ea": "va9b9df843cea", "wa": null, "ha": null, "whyA": {"1": "v873edb1e91bb"}}, {"id": "L08-m34", "src": "point", "kept": false, "page": 66, "type": "mcq", "text": "أيٌّ ممّا يلي صفةٌ سائدةٌ في نباتِ البازلاءِ؟", "options": ["أ. البذور المجعّدة", "ب. الأزهار البيضاء", "ج. القرون الخضراء", "د. القرون الصفراء"], "answer": 2, "answerText": "ج. القرون الخضراء", "explain": "شكل الصفات في البازلاء (ص٦٦): السائد: البذور الملساء والأزهار الأرجوانية والقرون الخضراء.", "why": {"0": "البذور المجعّدة صفة متنحية، والملساء سائدة.", "1": "الأزهار البيضاء صفة متنحية، والأرجوانية سائدة.", "3": "القرون الصفراء صفة متنحية، والخضراء سائدة."}, "evp": 66, "back": "L08-s5", "fig": "f66a", "section": "اختر الإجابة الصحيحة", "qa": "v62430841e107", "ea": "vc87d089f1f5d", "wa": null, "ha": null, "whyA": {"0": "v3cd6782b514d", "1": "v65d24931d80a", "3": "vee60b7febd00"}}, {"id": "L08-m35", "src": "point", "kept": false, "page": 66, "type": "mcq", "text": "بماذا يُرمزُ إلى صفةِ الأزهارِ البيضاءِ المتنحيةِ في البازلاءِ؟", "options": ["أ. بحرف صغير p", "ب. بحرف كبير P", "ج. بمربع ملوّن", "د. بدائرة ملوّنة"], "answer": 0, "answerText": "أ. بحرف صغير p", "explain": "يُرمز للصفة السائدة بحرف كبير (P للأرجواني)، وللمتنحية بحرف صغير (p للأبيض) (ص٦٦–٦٧).", "why": {"1": "الحرف الكبير P للصفة السائدة (الأرجوانية).", "2": "المربعات في مخطط السلالة رمز للذكور.", "3": "الدوائر في مخطط السلالة رمز للإناث."}, "evp": 67, "back": "L08-s5", "fig": "f67b", "section": "اختر الإجابة الصحيحة", "qa": "v19fe1c5a1eb6", "ea": "v2c412123a062", "wa": null, "ha": null, "whyA": {"1": "v90df417e5aa0", "2": "vb06e2213dcc4", "3": "vc3ffe386f9a2"}}, {"id": "L08-m36", "src": "point", "kept": false, "page": 67, "type": "tf", "text": "الصفاتُ المتنحيةُ تظهرُ أكثرَ منَ الصفاتِ السائدةِ.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "خطأ. من الطبيعي أن تظهر الصفات السائدة أكثر من المتنحية التي يُحجب ظهورها (ص٦٧).", "why": {"0": "السائدة هي التي تظهر أكثر."}, "evp": 67, "back": "L08-s6", "section": "صح أم خطأ", "qa": "v78904d58c6c6", "ea": "v3feffc5a2c3d", "wa": null, "ha": null, "whyA": {"0": "vd90f891a37e2"}}, {"id": "L08-m37", "src": "point", "kept": false, "page": 68, "type": "mcq", "text": "في مخطّطِ السلالةِ، ماذا تربطُ الخطوطُ العموديةُ؟", "options": ["أ. الأب بالأم", "ب. الذكور بالإناث فقط", "ج. الآباء بالأبناء", "د. الصفات السائدة بالمتنحية"], "answer": 2, "answerText": "ج. الآباء بالأبناء", "explain": "الكتاب (ص٦٨): تربط الخطوط الأفقية الآباء معًا، أما الخطوط العمودية فتربط الآباء بالأبناء.", "why": {"0": "الخط الأفقي هو الذي يربط الأب بالأم.", "1": "الخطوط تربط أفراد العائلة بحسب القرابة، لا بحسب الجنس.", "3": "الصفات تُعرف بالألوان، لا بالخطوط."}, "evp": 68, "back": "L08-s8", "fig": "f68b", "section": "اختر الإجابة الصحيحة", "qa": "vdb0583d2a78c", "ea": "v8001d2d1599d", "wa": null, "ha": null, "whyA": {"0": "vaed35e5dcbbd", "1": "v90edcff9d43f", "3": "v5e9c0b1242a8"}}, {"id": "L08-m38", "src": "point", "kept": false, "page": 68, "type": "tf", "text": "الحاملُ للصفةِ شخصٌ ورثَ جينَ الصفةِ ولكنَّ الصفةَ لا تظهرُ عليهِ.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "صح. هذا تعريف الحامل للصفة في الكتاب (ص٦٨).", "why": {"1": "العبارة صحيحة؛ هي تعريف الكتاب."}, "evp": 68, "back": "L08-s8", "section": "صح أم خطأ", "qa": "ve5fe75a93170", "ea": "v732db0e1cb56", "wa": null, "ha": null, "whyA": {"1": "v306184f27f89"}}, {"id": "L08-m39", "src": "point", "kept": false, "page": 68, "type": "mcq", "text": "لمّا تغيّرَ المناخُ وأصبحَ جافًّا، كيف تغيّرتْ مناقيرُ عصافيرِ غالاباغوس معَ مرورِ الأجيالِ؟", "options": ["أ. أصبحت أكبر", "ب. أصبحت أصغر لتلتقط البذور النادرة الصغيرة", "ج. اختفت تمامًا", "د. لم تتغير"], "answer": 1, "answerText": "ب. أصبحت أصغر لتلتقط البذور النادرة الصغيرة", "explain": "الكتاب (ص٦٨): تغيّرت أشكال مناقير العصافير لتكون أصغر لتتكيف مع البيئة، فكان أداؤها أفضل في التقاط البذور النادرة الصغيرة.", "why": {"0": "المناقير الكبيرة كانت تناسب وقت الأمطار ووفرة البذور.", "2": "المناقير لم تختفِ، بل تغير حجمها.", "3": "الكتاب يقول إنها تغيّرت مع مرور الأجيال."}, "evp": 68, "back": "L08-s9", "fig": "f68a", "section": "اختر الإجابة الصحيحة", "qa": "vf37521bb9901", "ea": "vb0b7a7d59a6a", "wa": null, "ha": null, "whyA": {"0": "vf350c01de662", "2": "v072e12b7f9a5", "3": "v6eb01a51ab09"}}]}, {"id": "L09", "unit": "الوحدة الأولى: تنوّع الحياة", "chapter": "الفصل الثاني: الخلية والوراثة", "name": "كتابةٌ علميةٌ: تحسينُ المنتجاتِ الزراعيةِ", "pages": [70, 70], "note": "صفحة إثراء وتوسّع في نهاية الفصل الثاني (كتابة علمية).", "sections": [{"id": "L09-s1", "page": 70, "title": "تحسينُ المنتجاتِ الزراعيةِ", "book": "يجدُ المزارعونَ عندَ جمعِ محاصيلِهم أنّ بعضَ النباتاتِ تحملُ صفاتٍ؛ يرغبونَ في زيادتِها؛ لزيادةِ قيمةِ المحاصيلِ، كما يجدونَ في بعضِ المحاصيلِ صفاتٍ يعملونَ على التخلصِ منْها. ويظهرُ التنوُّعُ في الصفاتِ عندَ حدوثِ تلقيحٍ بينَ أفرادٍ منْ نباتٍ يحملونَ جيناتِ صفاتٍ سائدةٍ، وأفرادٍ آخرينَ من النباتِ نفسِه يحملونَ جيناتِ صفاتٍ متنحيةٍ؛ حيثُ يتمُّ تركيزُ الصفاتِ المرغوبةِ في النباتاتِ بعمليةٍ خاصةٍ تجمعُ بينَ صفاتٍ مرغوبةٍ من كلٍّ من النبتةِ الأمِّ والنبتةِ الأبِ.\nكيفَ يمكنُ أنْ يقومَ مزارعٌ بتحسينِ صفاتٍ معينةٍ لنباتِ الذرةِ؟\nأولًا: يقومُ المزارعُ بزراعةِ هذه النباتاتِ منْ سُلالتَيْنِ مختلفتَيْنِ. نسمِّي الصفَّ الأولَ (السلالةَ أ) والصفَّ الآخرَ (السلالةَ ب). وبعدَ نحوِ ٥٥ يومًا نجدُ أنَّ كلَّ سلالةٍ منَ النباتِ قد أنتجتْ شُرَّابةَ الذرةِ الخاصةَ بها (جزءٌ من نباتِ الذرةِ مسؤولٌ عنْ إنتاجِ حبوبِ اللقاحِ في الجزءِ الذكريِّ منَ النباتِ). ثمَّ يقومُ المزارعُ بإزالةِ شُرَّابةِ الذرةِ منَ السلالةِ (أ)؛ ليضمنَ تلقيحَ هذهِ النباتاتِ منْ حبوبِ اللقاحِ التي تنتجُها السلالةُ (ب).\nفي اليومِ ٦٠ يتشكلُ الجزءُ الأنثويُّ منَ الذرةِ، وهي حبيباتٌ على شكلِ صفوفٍ على كوزِ الذرةِ.\nالخطوةُ التاليةُ، تُسمى التلقيحَ الخلطيَّ، وهوَ يحدثُ بشكلٍ طبيعيٍّ. حيثُ يتمُّ تحريرُ حبوبِ اللقاحِ منَ السلالةِ (ب) في الهواءِ، فتقعُ على أفرادِ السلالةِ (أ).\nوعندَ حصادِ نباتاتِ الذرةِ، يكونُ المحصولُ قدْ حملَ صفاتٍ محسّنةٍ منَ السلالتَيْنِ، وتُستخدمُ هذهِ الحبوبُ بذورًا لزراعةِ محاصيلِ الذرةِ المحسّنةِ في المواسمِ التاليةِ.", "simple": "المزارع يريد محصولًا بصفات أفضل. يزرع سلالتين مختلفتين من الذرة. ينزع شرابة الذرة من السلالة (أ). فتتلقح من حبوب لقاح السلالة (ب) بالهواء. هذا اسمه التلقيح الخلطي.", "steps": [{"q": "ماذا أرى؟", "t": "أرى نبات ذرة، وفي أعلاه جزء اسمه شرابة الذرة.", "fig": "f70a", "parts": [], "a": "vd74974f38de8"}, {"q": "ما الأجزاء؟", "t": "شرابة الذرة جزء ذكري ينتج حبوب اللقاح.", "fig": "f70a", "parts": ["p1"], "a": "v6a712af481a8"}, {"q": "الخطوة الأولى", "t": "يزرع المزارع سلالتين مختلفتين: السلالة (أ) والسلالة (ب).", "a": "vca9781261502"}, {"q": "اليوم ٥٥", "t": "تنتج كل سلالة شرابتها، فينزع المزارع شرابة السلالة (أ).", "fig": "f70a", "parts": ["p1"], "a": "vaf027e5f63ab"}, {"q": "اليوم ٦٠", "t": "يتشكّل الجزء الأنثوي: حبيبات في صفوف على كوز الذرة.", "a": "v5bc32543375f"}, {"q": "التلقيح الخلطي", "t": "تنتقل حبوب لقاح السلالة (ب) في الهواء، فتقع على السلالة (أ).", "a": "v0e9577718bfc"}, {"q": "الفكرة المهمة", "t": "الحبوب المحصودة تحمل صفات محسّنة من السلالتين، فتُزرع في المواسم التالية.", "a": "ve6fdc7dbeac6"}], "figs": ["f70a"], "key": "يحسّن المزارع صفات الذرة بالتلقيح الخلطي بين سلالتين، فيجمع الصفات المرغوبة من الأم والأب.", "sa": "v359ed3b1e848"}, {"id": "L09-s2", "page": 70, "title": "الكتابةُ التوضيحيةُ", "book": "الكتابةُ التوضيحيةُ الجيدةُ\n• تُعطِي معلوماتٍ توضِّحُ العمليةَ.\n• تَعرضُ الخطواتِ التي نظِّمتْ بطريقةٍ منطقيةٍ.\n• تُعطي تفاصيلَ واضحةً سهلةَ المتابعةِ.\n• تَربطُ الكلماتِ بالمكانِ والزمانِ؛ لجعلِ العمليةِ واضحةً.", "simple": "الكتابة التوضيحية تشرح عملية خطوة بخطوة. الخطوات مرتبة ترتيبًا منطقيًا. التفاصيل واضحة وسهلة. والكلمات تربط الخطوات بالمكان والزمان.", "steps": [{"q": "ماذا تعطي؟", "t": "تعطي معلومات توضّح العملية.", "a": "v5727088b5ef5"}, {"q": "كيف ترتّب؟", "t": "تعرض الخطوات بطريقة منطقية: أولًا، ثم، بعد ذلك.", "a": "vfe2c007dbbe6"}, {"q": "كيف تكون التفاصيل؟", "t": "تفاصيل واضحة سهلة المتابعة.", "a": "vcbd0d37cacf3"}, {"q": "الزمان والمكان", "t": "تربط الكلمات بالمكان والزمان، مثل: «بعد نحو ٥٥ يومًا».", "a": "v61472b6036aa"}, {"q": "الفكرة المهمة", "t": "نص تحسين الذرة مثال جيد على الكتابة التوضيحية.", "a": "v08a302c2b0ba"}], "figs": [], "key": "الكتابة التوضيحية الجيدة تشرح العملية بخطوات منطقية وتفاصيل واضحة مرتبطة بالزمان والمكان.", "sa": "vc46d1dd60270"}], "questions": [{"type": "explain", "options": [], "answer": null, "why": {}, "fig": "f70a", "oos": null, "left": [], "right": [], "items": [], "keys": [{"t": "زراعة سلالتين مختلفتين", "alts": ["سلالتين", "سلالة", "سلالتان"]}, {"t": "نزع شرابة الذرة من السلالة (أ)", "alts": ["نزع", "ازالة", "الشرابة", "شرابة"]}, {"t": "التلقيح الخلطي بحبوب لقاح السلالة (ب)", "alts": ["التلقيح الخلطي", "خلطي", "حبوب اللقاح", "الهواء"]}, {"t": "زراعة الحبوب المحسّنة في المواسم التالية", "alts": ["بذور", "محسنة", "المواسم", "الحصاد"]}], "back": "L09-s1", "id": "L09-q1", "page": 70, "section": "كتابةٌ علميةٌ", "text": "كيفَ يمكنُ أنْ يقومَ مزارعٌ بتحسينِ صفاتٍ معينةٍ لنباتِ الذرةِ؟", "answerText": "يزرع سلالتين (أ) و(ب)، وينزع شرابة السلالة (أ). فتتلقح بالهواء من السلالة (ب)، ثم تُزرع الحبوب المحسّنة.", "what": "اشرح الخطوات التي يتبعها المزارع ليحسّن صفات الذرة.", "hint": "اقرأ الفقرات التي تبدأ بـ«أولًا» و«في اليوم ٦٠» و«الخطوة التالية».", "explain": "الكتاب يشرح الطريقة بالترتيب: سلالتان، ثم نزع الشرابة، ثم التلقيح الخلطي، ثم حصاد حبوب بصفات محسّنة.", "solve": ["أولًا: يزرع سلالتين مختلفتين (أ) و(ب).", "بعد نحو ٥٥ يومًا: ينزع شرابة الذرة من السلالة (أ).", "التلقيح الخلطي: حبوب لقاح السلالة (ب) تنتقل بالهواء إلى السلالة (أ).", "عند الحصاد: الحبوب تحمل صفات محسّنة، فتُزرع في المواسم التالية."], "evp": 70, "qa": "va8b88cac84e7", "ea": "v3ab643eac61e", "wa": "v7920d7915410", "ha": "vb372405c7821", "whyA": {}}, {"type": "open", "options": [], "answer": null, "why": {}, "fig": null, "oos": null, "left": [], "right": [], "items": [], "keys": [{"t": "اختيار محصول وصفة مرغوبة", "alts": ["صفة", "مرغوبة", "محصول"]}, {"t": "التلقيح بين سلالتين", "alts": ["تلقيح", "سلالتين", "سلالة", "خلطي"]}, {"t": "خطوات مرتبة بالزمان", "alts": ["اولا", "ثم", "بعد", "اخيرا"]}], "back": "L09-s2", "id": "L09-q2", "page": 70, "section": "أكتبُ عنْ: الكتابةُ التوضيحيةُ", "text": "أختارُ محصولًا سواءٌ أكانَ منَ الفواكهِ أم منَ أزهارٍ فيها بعضُ الصفاتِ المرغوبةِ، وأكتبُ تقريرًا أوضح فيه كيفَ يمكنُ زيادةُ هذهِ الصفاتِ في المحصولِ.", "answerText": "تقرير بخطوات مرتبة يشرح كيف تزيد صفة مرغوبة في محصول، مثل طريقة تحسين الذرة.", "what": "اختر فاكهة أو زهرة لها صفة مرغوبة، واكتب خطوات زيادة هذه الصفة.", "hint": "اتبع طريقة الذرة، واستعمل قواعد الكتابة التوضيحية في المربع الجانبي.", "explain": "الكتابة التوضيحية الجيدة تعرض الخطوات بترتيب منطقي، وتربطها بالزمان والمكان. وطريقة الذرة نموذج تحتذي به.", "solve": ["أختار المحصول والصفة المرغوبة.", "أكتب الخطوات بالترتيب: سلالتان، ثم منع التلقيح من سلالة، ثم التلقيح الخلطي.", "أذكر الحصاد واستعمال البذور المحسّنة في المواسم التالية.", "أستعمل كلمات الزمان: أولًا، بعد ذلك، عند الحصاد."], "evp": 70, "qa": "v21bf231b590f", "ea": "v0653985d5e3a", "wa": "v5a84899728d3", "ha": "ve8a2630f17a7", "whyA": {}}], "terms": [], "points": [{"t": "المزارعون يريدون زيادة الصفات المرغوبة في المحاصيل، فيجمعون صفات مرغوبة من النبتة الأم والنبتة الأب.", "page": 70, "sec": "L09-s1", "fig": null, "parts": [], "a": "v8c4fe61667e8"}, {"t": "يزرع المزارع سلالتين (أ) و(ب)، وبعد نحو ٥٥ يومًا تنتج كل سلالة شُرّابة الذرة، وهي الجزء الذكري الذي ينتج حبوب اللقاح.", "page": 70, "sec": "L09-s1", "fig": "f70a", "parts": ["p1"], "a": "v1c5be5553e18"}, {"t": "يزيل المزارع شرّابة الذرة من السلالة (أ) ليضمن أن تُلقَّح بحبوب لقاح السلالة (ب).", "page": 70, "sec": "L09-s1", "fig": "f70a", "parts": ["p1"], "a": "v714f170a897a"}, {"t": "في اليوم ٦٠ يتشكّل الجزء الأنثوي: حبيبات في صفوف على كوز الذرة. ثم يحدث التلقيح الخلطي طبيعيًا بالهواء من (ب) إلى (أ).", "page": 70, "sec": "L09-s1", "fig": null, "parts": [], "a": "v2d06497b7d5f"}, {"t": "عند الحصاد يحمل المحصول صفات محسّنة من السلالتين، وتُستعمل حبوبه بذورًا للمواسم التالية.", "page": 70, "sec": "L09-s1", "fig": null, "parts": [], "a": "vf50a476e36db"}], "quiz": [{"id": "L09-m1", "src": "L09-q1", "kept": false, "page": 70, "type": "mcq", "text": "كيف يُحسِّنُ المزارعُ صفاتِ نباتِ الذرةِ؟", "options": ["أ. يزرع سلالة واحدة ويكثر من سقيها", "ب. يزرع سلالتين (أ) و(ب)، ويزيل شُرّابة السلالة (أ) لتتلقح بحبوب لقاح السلالة (ب)", "ج. يزيل شُرّابة السلالتين معًا", "د. يكسر أغصان النباتات الضعيفة"], "answer": 1, "answerText": "ب. يزرع سلالتين (أ) و(ب)، ويزيل شُرّابة السلالة (أ) لتتلقح بحبوب لقاح السلالة (ب)", "explain": "الكتاب (ص٧٠): يزرع سلالتين، ويزيل شرّابة السلالة (أ)، فيحدث التلقيح الخلطي بالهواء من (ب)، وتُستعمل الحبوب المحسّنة بذورًا.", "why": {"0": "الماء يؤثر في صفات مكتسبة لا تُورَث، والتحسين يجمع صفات من نبتتين.", "2": "إذا أُزيلت الشرّابتان فلن توجد حبوب لقاح للتلقيح.", "3": "الصفات المكتسبة مثل كسر الغصن لا تُورَث."}, "evp": 70, "back": "L09-s1", "fig": "f70a", "section": "اختر الإجابة الصحيحة", "qa": "v917c3e67f245", "ea": "ve9d90bc699d2", "wa": null, "ha": null, "whyA": {"0": "v561164411529", "2": "v2b7ebc909432", "3": "vdff6407bac54"}}]}, {"id": "L10", "unit": "الوحدة الأولى: تنوّع الحياة", "chapter": "الفصل الثاني: الخلية والوراثة", "name": "مراجعة الفصل الثاني ونموذج الاختبار", "pages": [71, 74], "note": "مراجعة الفصل الثاني (ص٧١–٧٢) ونموذج الاختبار (ص٧٣–٧٤). كل سؤال يرجع إلى صفحة شرحه في الكتاب.", "sections": [{"id": "L10-s1", "page": 71, "title": "ملخّصٌ مصوَّرٌ", "book": "الدَّرْسُ الأوَّلُ: تتكاثرُ الخلايَا بالانقسامِ الخلويِّ.\nالدَّرْسُ الثاني: تَتحكّمُ الصفاتُ التي تَنتقلُ منَ الآباءِ إلى الأبناءِ في شكلِ الأبناءِ وَسُلوكِهم.\nالْمَطْوِيّاتُ أنظِّمُ أفكاري: ألصقُ المطويّاتِ التي عملتُها في كلِّ درسٍ على ورقةٍ كبيرةٍ مقوّاةٍ. وأستعينُ بهذهِ المطوياتِ علَى مراجعةِ ما تعلّمتُهُ في هذا الفصلِ.", "simple": "الفصل الثاني فيه درسان. الدرس الأول: الخلايا تتكاثر بالانقسام. الدرس الثاني: الصفات تنتقل من الآباء إلى الأبناء. هذه الصفات تحدد شكل الأبناء وسلوكهم.", "steps": [{"q": "الدرس الأول", "t": "تتكاثر الخلايا بالانقسام الخلوي.", "fig": "f71a", "parts": [], "a": "vf0b341bc26da"}, {"q": "الدرس الثاني", "t": "الصفات التي تنتقل من الآباء تتحكم في شكل الأبناء وسلوكهم.", "fig": "f71b", "parts": [], "a": "vc2c385e8fe25"}, {"q": "المطويات", "t": "ألصق مطويات الدرسين على ورقة كبيرة، وأراجع بها الفصل.", "fig": "f71c", "parts": [], "a": "v0938317d8ed5"}, {"q": "الفكرة المهمة", "t": "الانقسام ينتج خلايا جديدة، والوراثة تنقل الصفات إلى الأبناء.", "a": "vf4d17c9e3640"}], "figs": ["f71a", "f71b", "f71c"], "key": "تتكاثر الخلايا بالانقسام الخلوي، وتنتقل الصفات من الآباء إلى الأبناء.", "sa": "v1ddf0dc2c999"}, {"id": "L10-s2", "page": 72, "title": "التقويمُ الأدائيُّ: صِفاتُ العائلةِ", "book": "الهدفُ: أتعرّفُ الصفاتِ الموروثةَ في عائلتِي أوْ عائلةِ أحدِ أصدقائِي.\nماذا أعملُ؟\n١. أجمعُ صُورًا تُظْهِرُ ثلاثةَ أجيالٍ في العائلةِ على الأقلِّ. أحاولُ إيجادَ صُورٍ لأكثرَ منْ شخصٍ في كلِّ جيلٍ. وإذا أمكنَ، أختارُ صورًا تظهِرُ أشخاصًا أعمارُهم متقاربةٌ.\n٢. أَنظرُ إلى الصُورِ لأتعرَّفَ الصّفاتِ الجسديةَ التي يَملِكُها كلُّ شَخصٍ.\n٣. أَضعُ الصِّفاتِ المشتركةَ للعائلةِ في قائمةٍ، وأذكرُ مَنْ يشتركُ فيها.\nأُحلِّلُ نَتائِجي: أُراجعُ صفاتِ الأشخاصِ في الجيلِ الأخيرِ. من أينَ ورِثوا كلًّا منْ هذِهِ الصفاتِ؟", "simple": "نشاط لتعرّف الصفات الموروثة في العائلة. أجمع صورًا لثلاثة أجيال على الأقل. أبحث عن الصفات المشتركة. ثم أسأل: من أين ورث الجيل الأخير كل صفة؟", "steps": [{"q": "الهدف", "t": "أتعرّف الصفات الموروثة في عائلتي أو عائلة صديق.", "a": "vfae9e013e225"}, {"q": "الخطوة ١", "t": "أجمع صورًا تُظهر ثلاثة أجيال على الأقل.", "a": "v6e964d461a1c"}, {"q": "الخطوة ٢", "t": "أنظر إلى الصور لأتعرّف الصفات الجسدية لكل شخص.", "a": "ve75f7f2c0c04"}, {"q": "الخطوة ٣", "t": "أكتب الصفات المشتركة في قائمة، ومن يشترك فيها.", "a": "v32eb27f9d58f"}, {"q": "أحلّل نتائجي", "t": "أتتبع كل صفة في الجيل الأخير إلى من ورثها عنه.", "a": "v92296c61a69e"}], "figs": [], "key": "الصفات الموروثة تنتقل في العائلة من جيل إلى جيل.", "sa": "vb09399b47dde"}, {"id": "L10-s3", "page": 74, "title": "أتحقَّقُ مِنْ فهمي", "book": "السؤالُ | المرجعُ | السؤالُ | المرجعُ\n١ | ٥٤ | ٢ | ٦٦\n٣ | ٥٦ | ٤ | ٥٦\n٥ | ٥٢ | ٦ | ٦٦–٦٧\n٧ | ٦٨ | ٨ | ٦٦–٦٧", "simple": "هذا الجدول يخبرك أين تجد شرح كل سؤال من نموذج الاختبار. إذا صعب عليك سؤال، ارجع إلى صفحته. المراجعة تقوّي ما تعلّمته.", "steps": [{"q": "الانقسام", "t": "السؤال ١ في ص٥٤، و٣ و٤ في ص٥٦، و٥ في ص٥٢.", "a": "v5ba8711e0fc1"}, {"q": "الوراثة", "t": "السؤال ٢ في ص٦٦، و٦ و٨ في ص٦٦–٦٧، و٧ في ص٦٨.", "a": "va205d1310bdf"}, {"q": "الفكرة المهمة", "t": "ارجع إلى الصفحة، واقرأ الشرح، ثم حاول مرة أخرى.", "a": "v54ad061f7421"}], "figs": [], "key": "كل سؤال في نموذج الاختبار له صفحة شرح في الكتاب.", "sa": "v7ba0b628971c"}], "questions": [{"type": "fill", "options": ["صفةٌ سائدةٌ", "الجين", "الخليةُ المخصبةُ", "الانقسام المنصّف", "دورةُ الخليةِ", "الوراثةَ"], "answer": 5, "why": {}, "fig": null, "oos": null, "left": [], "right": [], "items": [], "keys": [{"t": "الوراثةَ", "alts": ["الوراثة"]}], "back": "L08-s3", "id": "L10-q1", "page": 71, "section": "المفرداتُ", "text": "انتقالُ الصِّفاتِ منْ جيلٍ إلى آخرَ يُسمَّى ............ .", "answerText": الهجرةُ إلى أماكنَ جديدةٍ.", "د- حمايةُ النِّظامِ البيئيِّ."], "answer": 1, "why": {"0": "التنافس على الغذاء لا يحمي المخلوق من الانقراض. فكّر في السمات التكيفية.", "2": "الكتاب لم يذكر الهجرة هنا. تذكّر عصافير غالاباغوس التي تكيفت في بيئتها.", "3": "الكتاب يتحدث عن تكيّف المخلوق نفسه بسماته، لا عن حماية النظام البيئي."}, "fig": null, "oos": null, "left": [], "right": [], "items": [], "keys": [], "back": "L08-s9", "id": "L10-q13", "page": 72, "section": "المهاراتُ والأفكارُ العلميةُ", "text": "اخترْ الإجابةَ الصَّحيحَةَ. حافظتْ بعضُ المخلوقاتِ الحيَّةِ على نفسِهَا من الانقراضِ، ما الَّذِي مكَّنَهَا منْ ذلكَ؟", "answerText": "ب- الانتخابُ الطَّبيعيُّ.", "what": "ما العملية التي ساعدت بعض المخلوقات على البقاء وعدم الانقراض؟", "hint": "ارجع إلى «ما الانتخاب الطبيعي؟» ومثال عصافير غالاباغوس.", "explain": "الانتخاب الطبيعي يجعل المخلوقات ذات السمات التكيفية أكثر قدرة على البقاء والتكاثر، فتنقل سماتها عبر الأجيال.", "solve": ["المخلوق الذي يملك سمات تكيفية يعيش في بيئته أفضل من غيره.", "فيبقى ويتكاثر وينقل هذه السمات إلى أبنائه.", "هذه العملية اسمها الانتخاب الطبيعي."], "evp": 68, "backPage": 68, "qa": "v8517904be01f", "ea": "vf57bffd4e33a", "wa": "v8128193acdd2", "ha": "v8ec9b6b9d436", "whyA": {"0": "v97c87377a224", "2": "v0cb447918a4a", "3": "v0a89f79b46dc"}}, {"type": "tf", "options": [], "answer": 1, "why": {}, "fig": null, "oos": null, "left": [], "right": [], "items": [], "keys": [{"t": "خطأ", "alts": ["خطا", "خاطئة", "غير صحيحة"]}, {"t": "اكتشف أن كل صفة يتحكم فيها عاملان من الأبوين", "alts": ["عاملان", "عاملين", "مبادئ", "البازلاء"]}], "back": "L08-s5", "id": "L10-q14", "page": 72, "section": "المهاراتُ والأفكارُ العلميةُ", "text": "صوابٌ أمْ خطأٌ. اكتشفَ مندلُ وجودَ الجيناتِ في خلايا المخلوقاتِ الحيةِ. هل هذهِ العبارةُ صحيحةٌ أم خطأٌ؟ أفسِّرُ إجابتي.", "answerText": "خطأ؛ مندل لاحظ أن كل صفة يتحكم فيها عاملان (من الأب والأم)، وهذان العاملان سُمّيا الجينات.", "what": "هل رأى مندل الجينات داخل الخلايا؟ وماذا اكتشف فعلًا؟", "hint": "اقرأ ما توصّل إليه مندل من تجاربه على نبات البازلاء.", "explain": "مندل لاحظ كيف تورث صفات البازلاء. وتوصّل إلى أن كل صفة يتحكم فيها عاملان؛ عامل من الأب وآخر من الأم يسميان الجينات. فهو اكتشف المبادئ الأساسية للوراثة من التلقيح، لا الجينات في الخلايا.", "solve": ["مندل أجرى تجارب تلقيح على نبات البازلاء.", "لاحظ كيف تنتقل الصفات من جيل إلى جيل.", "استنتج أن كل صفة يتحكم فيها عاملان، سُمّيا الجينات.", "إذن العبارة خطأ: هو اكتشف مبادئ الوراثة، لا وجود الجينات في الخلايا."], "evp": 66, "backPage": 66, "qa": "vc274400447dd", "ea": "v5abc96ad80e2", "wa": "v92c94d4fdf7f", "ha": "v1e0cdae45f54", "whyA": {}}, {"type": "tf", "options": [], "answer": 0, "why": {}, "fig": null, "oos": null, "left": [], "right": [], "items": [], "keys": [{"t": "صحيحة", "alts": ["صحيحة", "صواب", "صح"]}, {"t": "السمات التكيفية تساعد على البقاء والتكاثر", "alts": ["تكيفية", "تتكيف", "البقاء", "تناسب البيئة"]}], "back": "L08-s9", "id": "L10-q15", "page": 72, "section": "التقويمُ الأدائيُّ", "text": "صوابٌ أمْ خطأٌ. تنوعُ الصفاتِ الوراثيةِ يساعدُ أفرادَ النوعِ الواحدِ علَى البقاءِ والتكاثرِ. هل هذهِ العبارةُ صحيحةٌ أم خطأٌ؟ أفسِّرُ إجابتي.", "answerText": "صحيحة؛ الأفراد الذين يملكون سمات تكيفية أكثر قدرة على البقاء والتكاثر.", "what": "هل اختلاف الصفات بين أفراد النوع يساعدهم على البقاء؟ ولماذا؟", "hint": "تذكّر عصافير غالاباغوس حين أصبح المناخ جافًا.", "explain": "الكائنات التي تمتلك سمات تكيفية تكون غالبًا أكثر قدرة على البقاء والتكاثر. فلما جفّ المناخ نجحت العصافير ذات المناقير الصغيرة.", "solve": ["أفراد النوع الواحد تختلف صفاتهم.", "إذا تغيّرت البيئة، ينجح من يملك صفة تناسبها.", "مثال: العصافير ذات المناقير الصغيرة التقطت البذور الصغيرة النادرة.", "إذن العبارة صحيحة."], "evp": 68, "backPage": 68, "qa": "v0825c2a78883", "ea": "vd3eb3122d61a", "wa": "vb47dc9d5033e", "ha": "v6d5efc67eac2", "whyA": {}}, {"type": "explain", "options": [], "answer": null, "why": {}, "fig": null, "oos": null, "left": [], "right": [], "items": [], "keys": [{"t": "عن طريق الجينات", "alts": ["الجينات", "جين", "جينات"]}, {"t": "الجينات على الكروموسومات", "alts": ["الكروموسومات", "كروموسوم"]}, {"t": "اتحاد المشيج المذكر والمؤنث (التكاثر)", "alts": ["التكاثر", "المشيج", "الخلية المخصبة", "اتحاد"]}], "back": "L08-s5", "id": "L10-q16", "page": 72, "section": "الفِكْرةُ العَامَّةُ", "text": "كيفَ تنقلُ المخلوقاتُ الحيةُ الصفاتِ إلى أبنائِها؟", "answerText": "تنتقل الصفات بالتكاثر عن طريق الجينات على الكروموسومات؛ فالمشيجان يتحدان فتأخذ الخلية المخصبة كروموسومات من الأبوين.", "what": "اشرح كيف تصل صفات الآباء إلى الأبناء.", "hint": "اجمع بين الدرسين: الانقسام المنصف والخلية المخصبة، ثم الجينات عند مندل.", "explain": "الجينات تحمل معلومات الصفات، وهي مخزنة على الكروموسومات. وفي التكاثر الجنسي يتحد المشيج المذكر والمؤنث، فينتقل إلى الابن كروموسومات وصفات من الأبوين.", "solve": ["الصفات تنتقل خلال عملية التكاثر.", "كل صفة يتحكم فيها جينان: من الأب ومن الأم، والجينات على الكروموسومات.", "المشيجان فيهما نصف العدد، ويتحدان في الخلية المخصبة.", "فينتقل إلى الابن كروموسومات وصفات وراثية من الأبوين."], "evp": 56, "backPage": 66, "qa": "v1e8e71cebe59", "ea": "vf2727dadb1eb", "wa": "vbbbcca3644b7", "ha": "v1be1b48283e3", "whyA": {}}, {"type": "open", "options": [], "answer": null, "why": {}, "fig": null, "oos": null, "left": [], "right": [], "items": [], "keys": [{"t": "ورثها من الأب أو الأم", "alts": ["الاب", "الام", "الابوين", "والده", "والدته"]}, {"t": "أو من الأجداد عبر الأبوين", "alts": ["الجد", "الجدة", "الاجداد"]}], "back": "L08-s9", "id": "L10-q17", "page": 72, "section": "التقويمُ الأدائيُّ: صِفاتُ العائلةِ (أُحلِّلُ نَتائِجي)", "text": "أُراجعُ صفاتِ الأشخاصِ في الجيلِ الأخيرِ. من أينَ ورِثوا كلًّا منْ هذِهِ الصفاتِ؟", "answerText": "الجواب يختلف حسب كل عائلة: أتتبع كل صفة إلى الأب أو الأم أو الأجداد.", "what": "لكل صفة في الجيل الأخير: من أي شخص في العائلة جاءت؟", "hint": "الصفة قد تأتي من الأب أو الأم، وقد تظهر صفة متنحية كان الأبوان يحملانها.", "explain": "الوراثة انتقال الصفات من الآباء إلى الأبناء. وحامل الصفة قد ينقلها إلى أبنائه مع أنها لا تظهر عليه.", "solve": ["أختار صفة في شخص من الجيل الأخير.", "أبحث عنها في الأبوين ثم في الأجداد.", "إذا لم تظهر على الأبوين، فقد يكونان حاملين لها."], "evp": 68, "backPage": 68, "qa": "vd080fb08c646", "ea": "v219eece56ae3", "wa": "v9ffd40284d54", "ha": "vacc7093f954a", "whyA": {}}, {"type": "mcq", "options": ["أ. الانقسامُ المنصّفُ.", "ب. الإخصابُ", "ج. الانقسامُ المتساوي.", "د. التكاثرُ الجنسيُّ."], "answer": 2, "why": {"0": "الانقسام المنصف ينتج أربع خلايا بنصف عدد الكروموسومات، لا خليتين متطابقتين.", "1": "الإخصاب اتحاد مشيجين، وليس انقسامًا للخلية.", "3": "التكاثر الجنسي يجمع كروموسومات من أبوين، وليس انقسام خلية إلى خليتين متطابقتين."}, "fig": null, "oos": null, "left": [], "right": [], "items": [], "keys": [], "back": "L06-s9", "id": "L10-q18", "page": 73, "section": "نموذجُ اختبارٍ", "text": "أيُّ العملياتِ التاليةِ تؤدي إلى انقسامِ الخليةِ إلى خليتيْنِ متطابقتيْنِ؟", "answerText": "ج. الانقسامُ المتساوي.", "what": "أي عملية تقسم الخلية إلى خليتين متشابهتين تمامًا؟", "hint": "ارجع إلى ص٥٤: «ما الانقسام المتساوي؟».", "explain": "في الانقسام المتساوي تضاعف الخلية كروموسوماتها ثم تنقسم، فتتكون خليتان متماثلتان.", "solve": ["المطلوب: خليتان متطابقتان.", "الانقسام المتساوي ينتج خليتين متماثلتين.", "الجواب: ج."], "evp": 54, "backPage": 54, "qa": "vb8d81eb2cd72", "ea": "v93da1da67a8c", "wa": "v6d59d896fcd2", "ha": "vc54d41da6656", "whyA": {"0": "vdc2b091d134b", "1": "va171e9f3061f", "3": "vaf6c28609e1c"}}, {"type": "mcq", "options": ["أ. جميعُها أرجوانيّةٌ.", "ب. جميعُها بيضاءُ.", "ج. بعضُها أرجوانيٌّ وبعضُها أبيضُ.", "د. جميعُها أرجوانيّةٌ فاتحةٌ."], "answer": 2, "why": {"0": "تذكّر تجربة مندل: الأزهار البيضاء لم تختفِ، بل ظهرت مرة أخرى في الجيل الثاني.", "1": "الصفة السائدة لا تختفي كلها؛ اللون الأرجواني يظهر أيضًا في الجيل الثاني.", "3": "الكتاب لم يذكر لونًا أرجوانيًا فاتحًا؛ الألوان أرجواني أو أبيض."}, "fig": "f73a", "oos": null, "left": [], "right": [], "items": [], "keys": [], "back": "L08-s5", "id": "L10-q19", "page": 73, "section": "نموذجُ اختبارٍ", "text": "أدرسُ الشكلَ التاليَ، وأجيبُ عنِ السؤالِ الذي يليهِ: إذا كانتْ صفةُ الأزهارِ الأرجوانيةِ سائدةً، فما صفاتُ الأزهارِ التي أتوقّعُ ظهورَها إذا تمَّ تلقيحُ أفرادِ الجيلِ الأولِ تلقيحًا ذاتيًّا؟", "answerText": "ج. بعضُها أرجوانيٌّ وبعضُها أبيضُ.", "what": "الجيل الأول كله أرجواني. ماذا يظهر في الجيل الثاني بعد تلقيحه ذاتيًا؟", "hint": "ارجع إلى تجربة مندل على البازلاء أرجوانية الأزهار وبيضاء الأزهار.", "explain": "لما لقّح مندل نباتين أرجوانيين من الجيل الأول، ظهرت الأزهار البيضاء مرة أخرى في الجيل الثاني. فالصفة البيضاء لم تختفِ، بل منعتها السائدة من الظهور.", "solve": ["الجيل الأول كله أرجواني، لأن الأرجواني صفة سائدة.", "لكنه يحمل جين الأبيض المتنحي مخفيًا.", "في الجيل الثاني تظهر بعض الأزهار البيضاء من جديد.", "الجواب: ج. بعضها أرجواني وبعضها أبيض."], "evp": 66, "backPage": 66, "qa": "vd2faafc44e64", "ea": "va57e1dfd2bdf", "wa": "v67185c4b8a36", "ha": "vccad47838c95", "whyA": {"0": "v1aa5af3ed6bb", "1": "v54effec2f0c6", "3": "v5c5d2ff938d9"}}, {"type": "mcq", "options": ["أ. ٨", "ب. ١٦", "ج. ٣٢", "د. ٦٤"], "answer": 2, "why": {"0": "٨ ربع ٨ × ٤؛ المشيج فيه النصف لا الثُّمن.", "1": "١٦ ربع ٦٤؛ الانقسام المنصف يجعل العدد نصفًا لا ربعًا.", "3": "٦٤ هو عدد الخلية العادية؛ المشيج فيه نصف هذا العدد."}, "fig": null, "oos": null, "left": [], "right": [], "items": [], "keys": [], "back": "L06-s11", "id": "L10-q20", "page": 73, "section": "نموذجُ اختبارٍ", "text": "إذا كانَ عددُ الكروموسوماتِ في خلايا الحصانِ (٦٤) كروموسومًا، فما عددُ الكروموسوماتِ في المشيجِ المذكرِ لهذا الحيوانِ؟", "answerText": "ج. ٣٢", "what": "كم كروموسومًا في المشيج المذكر إذا كانت خلايا الحصان فيها ٦٤؟", "hint": "تذكّر الإنسان: خلاياه ٤٦، وكل خلية جنسية فيها ٢٣.", "explain": "المشيج يتكون بالانقسام المنصف، فيحتوي على نصف العدد الأصلي من الكروموسومات: ٦٤ ÷ ٢ = ٣٢.", "solve": ["المشيج يتكون بالانقسام المنصف.", "فيه نصف عدد كروموسومات الخلية الأصلية.", "٦٤ ÷ ٢ = ٣٢."], "evp": 56, "backPage": 56, "qa": "v442e149dc83e", "ea": "vd88422b57e8b", "wa": "va9bd078cb8ce", "ha": "v401670830f47", "whyA": {"0": "v2ff92c81ce18", "1": "vb45b039f3afd", "3": "v28a2bec3b03f"}}, {"type": "mcq", "options": ["أ. انقسامِ الخلايا الجنسيةِ.", "ب. اندماجِ الخلايا الجنسيةِ.", "ج. انقسامِ الخلايا الجسميةِ.", "د. اندماجِ الخلايا الجسميةِ."], "answer": 1, "why": {"0": "انقسام الخلايا الجنسية ليس ما يكوّن الخلية المخصبة؛ هي تتكون من اتحاد خليتين.", "2": "انقسام الخلايا الجسمية هو الانقسام المتساوي، ولا يكوّن خلية مخصبة.", "3": "الخلايا الجسمية مثل خلايا الجلد والعظام لا تندمج لتكوين خلية مخصبة."}, "fig": null, "oos": null, "left": [], "right": [], "items": [], "keys": [], "back": "L06-s11", "id": "L10-q21", "page": 73, "section": "نموذجُ اختبارٍ", "text": "الخليةُ المخصبةُ تَنتجُ بسببِ:", "answerText": "ب. اندماجِ الخلايا الجنسيةِ.", "what": "كيف تتكون الخلية المخصبة؟", "hint": "ماذا يحدث للمشيج المذكر والمشيج المؤنث؟", "explain": "المشيج المذكر والمشيج المؤنث خليتان جنسيتان، تتحدان معًا لتكوّنا خلية مخصبة.", "solve": ["المشيجان خليتان جنسيتان.", "يتحدان (يندمجان) معًا.", "فتتكون الخلية المخصبة: الجواب ب."], "evp": 56, "backPage": 56, "qa": "v46716ffa74da", "ea": "v9ced8c5ab052", "wa": "v59f6e26a5c0b", "ha": "vd354a2438e98", "whyA": {"0": "v57a7afd0e43a", "2": "v3098d4660cb3", "3": "v9fb2ff017408"}}, {"type": "explain", "options": [], "answer": null, "why": {}, "fig": "f73b", "oos": null, "left": [], "right": [], "items": [], "keys": [{"t": "تنمو الخلية ويزداد حجمها", "alts": ["تنمو", "نمو", "يكبر", "يزداد حجمها"]}, {"t": "تتهيأ للانقسام ثم تنقسم إلى خليتين", "alts": ["تنقسم", "انقسام", "خليتين", "تتهيأ"]}, {"t": "مساحة الغشاء البلازمي لا تكفي لتبادل المواد", "alts": ["الغشاء", "مساحة", "لا تكفي", "غير كافية"]}], "back": "L06-s7", "id": "L10-q22", "page": 73, "section": "نموذجُ اختبارٍ: أجيبُ عنِ الأسئلةِ التاليةِ", "text": "يبيّنُ الشكلُ التالي دورةَ حياةِ الخليةِ. ما التغيّراتُ الظاهرةُ في الشكلِ على الخليةِ في أثناءِ دورةِ حياتِها؟ ولماذا لا تستمرُّ الخليةُ في النموِّ؟", "answerText": "تنمو الخلية فيكبر حجمها، ثم تتهيأ للانقسام، ثم تنقسم إلى خليتين. ولا تستمر في النمو لأن مساحة الغشاء البلازمي لا تكفي لتبادل المواد.", "what": "صف ما يحدث للخلية في الشكل، ثم بيّن سبب توقفها عن النمو.", "hint": "الجزء الأول من الشكل، والجزء الثاني من «محددات حجم الخلية» ص٥٣.", "explain": "الغشاء البلازمي ينمو بمعدل أقل من نمو حجم الخلية. فتصبح مساحته غير كافية لحصول الخلية على المواد أو التخلص من الفضلات. لذلك تتوقف عن النمو.", "solve": ["الشكل: الخلية تنمو فيكبر حجمها.", "ثم تتهيأ للانقسام، ثم تنقسم إلى خليتين صغيرتين.", "كلما كبرت احتاجت إلى مواد أكثر تمر عبر الغشاء البلازمي.", "الغشاء ينمو أبطأ من حجم الخلية، فلا يكفي، فتتوقف عن النمو."], "evp": 52, "backPage": 53, "qa": "vda79a0fb8742", "ea": "vfba70687654e", "wa": "vfb7d8fca6ad5", "ha": "vf2c90d449a7b", "whyA": {}}, {"type": "explain", "options": [], "answer": null, "why": {}, "fig": null, "oos": null, "left": [], "right": [], "items": [], "keys": [{"t": "المجعّدة صفة متنحية", "alts": ["متنحية", "متنحي"]}, {"t": "الأبوان يحملان جينها مخفيًا", "alts": ["يحمل", "حامل", "تحمل", "مخفي"]}, {"t": "ورث بعض الأبناء جين المتنحية من الأبوين", "alts": ["ورث", "الابوين", "كليهما"]}], "back": "L08-s5", "id": "L10-q23", "page": 74, "section": "نموذجُ اختبارٍ", "text": "قامَ مزارعٌ بإجراءِ عمليةِ تلقيحٍ لنباتِ البازلاءِ باستخدامِ بذورٍ ملساءَ، وعندَ نموِّ المحصولِ وجدَ أنّ بذورَ بعضِ النباتاتِ الناتجةِ مجعّدةٌ، وبذورَ النباتاتِ الأخرَى ملساءُ. كيفَ ظهرتِ البذورُ المجعّدةُ في النباتاتِ؟", "answerText": "الملساء صفة سائدة والمجعّدة متنحية؛ النباتات الأصلية كانت تحمل جين المجعّدة مخفيًا، فورثه بعض الأبناء من الأبوين فظهرت.", "what": "لماذا ظهرت بذور مجعّدة من نباتات بذورها ملساء؟", "hint": "تذكّر الأزهار البيضاء التي اختفت في الجيل الأول ثم ظهرت في الجيل الثاني.", "explain": "الصفة السائدة تمنع المتنحية من الظهور، لكن المتنحية لا تختفي. فإذا ورث النبات جين الصفة المتنحية من الأبوين معًا ظهرت عليه.", "solve": ["البذور الملساء صفة سائدة، والمجعّدة صفة متنحية.", "النباتات الأصلية تحمل جين المجعّدة لكنه لا يظهر.", "بعض الأبناء ورثوا جين المجعّدة من الأبوين معًا.", "فظهرت عليهم البذور المجعّدة."], "evp": 66, "backPage": 66, "qa": "ve804082e0c49", "ea": "v28e63690cf89", "wa": "ve4aa781cd924", "ha": "vab03abb39737", "whyA": {}}, {"type": "explain", "options": [], "answer": null, "why": {}, "fig": "f74a", "oos": null, "left": [], "right": [], "items": [], "keys": [{"t": "ابن واحد شحمة أذنه ملتحمة", "alts": ["1", "١", "واحد", "ابن واحد"]}, {"t": "ثلاثة أبناء شحمة أذنهم غير ملتحمة", "alts": ["3", "٣", "ثلاثة", "ثلاث"]}, {"t": "الأبوان يحملان جين الصفة المتنحية", "alts": ["حامل", "يحملان", "متنحية", "متنحي"]}], "back": "L08-s9", "id": "L10-q24", "page": 74, "section": "نموذجُ اختبارٍ", "text": "أدرسُ الشكلَ التاليَ، وأجيبُ عنِ السؤالِ الذي يليه: ما عددُ الأبناءِ الذينَ تظهرُ عليهمْ صفةُ شحمةِ الأذنِ الملتحمةِ، وما عددُ الأبناءِ الذينَ تظهرُ عليهمْ صفةُ شحمةِ الأذنِ غيرِ الملتحمةِ؟ لماذا ظهرَ تنوعٌ في صفاتِ جيلِ الأبناءِ؟ أفسر إجابتي.", "answerText": "ابن واحد شحمة أذنه ملتحمة، وثلاثة أبناء غير ملتحمة. ظهر التنوع لأن الأبوين يحملان جين الصفة المتنحية.", "what": "عُدّ الأبناء بكل لون في المخطط، ثم فسّر لماذا اختلفوا.", "hint": "اللون الغامق: غير ملتحمة (سائدة)، والفاتح: ملتحمة (متنحية).", "explain": "الأبوان تظهر عليهما الصفة السائدة، لكنهما يحملان جين الصفة المتنحية. والابن الذي ورث جين المتنحية من الأبوين ظهرت عليه الشحمة الملتحمة.", "solve": ["أعدّ: مربع فاتح واحد = ابن واحد بشحمة ملتحمة.", "أعدّ: ابنتان وابن غامقون = ثلاثة بشحمة غير ملتحمة.", "الأبوان غامقان، لكن ظهرت صفة متنحية في ابنهما.", "إذن الأبوان حاملان لجين الصفة المتنحية."], "evp": 68, "backPage": 68, "qa": "v2e31d41f6de0", "ea": "vee9b3249eec5", "wa": "v48feca68c220", "ha": "v598f2a93e493", "whyA": {}}, {"type": "explain", "options": [], "answer": null, "why": {}, "fig": null, "oos": "مصطلح «الطفرة الجينية» غير مشروح في صفحات ٢٤–٧٤؛ الإجابة مبنية على تعريف الجين ص٦٦ فقط.", "left": [], "right": [], "items": [], "keys": [{"t": "الجين يحمل معلومات الصفة", "alts": ["معلومات", "المعلومات", "الجين"]}, {"t": "تغيّر الجين يغيّر الصفة", "alts": ["تتغير", "تغير", "يتغير", "تغيير"]}], "back": "L08-s5", "id": "L10-q25", "page": 74, "section": "نموذجُ اختبارٍ", "text": "اشرح كيف يمكن للطفرة الجينية أن تؤثر على الصفات الوراثية.", "answerText": "الجين يحمل المعلومات الكيميائية للصفة؛ فإذا تغيّر الجين قد تتغيّر الصفة الموروثة.", "what": "ماذا يحدث للصفة إذا تغيّر الجين الذي يتحكم فيها؟", "hint": "ارجع إلى تعريف الجين في ص٦٦.", "explain": "الكتاب يقول: يحتوي الجين على المعلومات الكيميائية للصفة الموروثة. فالتغير في الجين يغيّر المعلومات التي تحدد الصفة.", "solve": ["الجين يحتوي على المعلومات الكيميائية للصفة.", "الطفرة الجينية تغيّر في الجين.", "إذن قد تتغيّر الصفة التي يتحكم فيها هذا الجين."], "evp": 66, "backPage": 66, "qa": "v29b55b87ec6b", "ea": "v0e76ac40e87e", "wa": "v96f702b272a1", "ha": "vdf03ab0a84b4", "whyA": {}}], "terms": [], "points": [{"t": "الدرس الأول باختصار: تتكاثر الخلايا بالانقسام الخلوي.", "page": 71, "sec": "L10-s1", "fig": "f71a", "parts": [], "a": "v6aee0a6585d1"}, {"t": "الدرس الثاني باختصار: الصفات التي تنتقل من الآباء إلى الأبناء تتحكم في شكل الأبناء وسلوكهم.", "page": 71, "sec": "L10-s1", "fig": "f71b", "parts": [], "a": "v25894a3d2a7f"}, {"t": "شكل دورة الخلية في المراجعة يُظهر عمليتين: نموّ الخلية ثم انقسامها، وبينهما التهيؤ للانقسام.", "page": 72, "sec": "L10-s3", "fig": "f72a", "parts": ["p1", "p2", "p3"], "a": "vbe3b63cdeb9a"}, {"t": "إذا كان في خلايا الحصان ٦٤ كروموسومًا، ففي مشيجه المذكر نصفها: ٣٢ كروموسومًا، لأنه ناتج عن الانقسام المنصّف.", "page": 73, "sec": "L10-s3", "fig": null, "parts": [], "a": "vc7c90a93df57"}, {"t": "تلقيح أفراد الجيل الأول الأرجوانية (Pp) مع بعضها يُظهر في الجيل الثاني أزهارًا أرجوانية وأخرى بيضاء.", "page": 73, "sec": "L10-s3", "fig": "f73a", "parts": [], "a": "vcb3f648746fe"}], "quiz": [{"id": "L10-m1", "src": "L10-q1", "kept": true, "page": 71, "type": "fill", "text": "انتقالُ الصِّفاتِ منْ جيلٍ إلى آخرَ يُسمَّى ............ .", "options": ["صفةٌ سائدةٌ", "الجين", "الخليةُ المخصبةُ", "الانقسام المنصّف", "دورةُ الخليةِ", "الوراثةَ"], "answer": 5, "answerText": "الوراثةَ", "explain": "الوراثة: انتقال الصفات من الآباء إلى الأبناء.", "why": {}, "evp": 64, "back": "L08-s3", "section": "صح أم خطأ", "qa": "vd876b8706b15", "ea": "vf3df4877c58a", "wa": null, "ha": null, "whyA": {}}, {"id": "L10-m2", "src": "L10-q2", "kept": true, "page": 71, "type": "fill", "text": "ينتجُ عنْ ............ أربعُ خلايا جديدةٍ.", "options": ["صفةٌ سائدةٌ", "الجين", "الخليةُ المخصبةُ", "الانقسام المنصّف", "دورةُ الخليةِ", "الوراثةَ"], "answer": 3, "answerText": "الانقسام المنصّف", "explain": "الانقسام المنصف تنقسم فيه النواة مرتين فتنتج أربع خلايا.", "why": {}, "evp": 56, "back": "L06-s11", "section": "صح أم خطأ", "qa": "v6fa4769beba1", "ea": "v8d2fbbb14dcc", "wa": null, "ha": null, "whyA": {}}, {"id": "L10-m3", "src": "L10-q3", "kept": true, "page": 71, "type": "fill", "text": "تُحمَلُ المعلوماتُ الكيميائيةُ للصفةِ الموروثةِ علـى ............ .", "options": ["صفةٌ سائدةٌ", "الجين", "الخليةُ المخصبةُ", "الانقسام المنصّف", "دورةُ الخليةِ", "الوراثةَ"], "answer": 1, "answerText": "الجين", "explain": "الجين يحتوي على المعلومات الكيميائية للصفة الموروثة.", "why": {}, "evp": 66, "back": "L08-s5", "section": "صح أم خطأ", "qa": "v9838dffc0da2", "ea": "vcfc578b12104", "wa": null, "ha": null, "whyA": {}}, {"id": "L10-m4", "src": "L10-q4", "kept": true, "page": 71, "type": "fill", "text": "الصِفةُ الوراثيةُ التي تَمنَعُ صِفةً أُخرى منَ الظهورِ تُسمَّى ............ .", "options": ["صفةٌ سائدةٌ", "الجين", "الخليةُ المخصبةُ", "الانقسام المنصّف", "دورةُ الخليةِ", "الوراثةَ"], "answer": 0, "answerText": "صفةٌ سائدةٌ", "explain": "الصفة السائدة تمنع الصفة المتنحية من الظهور.", "why": {}, "evp": 66, "back": "L08-s5", "section": "صح أم خطأ", "qa": "v9a7980e19c32", "ea": "v0821217ae240", "wa": null, "ha": null, "whyA": {}}, {"id": "L10-m5", "src": "L10-q5", "kept": true, "page": 71, "type": "fill", "text": "............ عمليةٌ مستمرةٌ من النموِّ والانقسامِ لإنتاجِ خلايا جديدةٍ وتعويضِ الخلايا الميتةِ.", "options": ["صفةٌ سائدةٌ", "الجين", "الخليةُ المخصبةُ", "الانقسام المنصّف", "دورةُ الخليةِ", "الوراثةَ"], "answer": 4, "answerText": "دورةُ الخليةِ", "explain": "دورة الخلية: العملية المستمرة من النمو والانقسام والتعويض.", "why": {}, "evp": 52, "back": "L06-s5", "section": "صح أم خطأ", "qa": "ve44a11df1c8b", "ea": "v40a5d5c7bd67", "wa": null, "ha": null, "whyA": {}}, {"id": "L10-m6", "src": "L10-q6", "kept": true, "page": 71, "type": "fill", "text": "............ تَنتجُ عنِ اتحادِ مشيجٍ مذكّرٍ معَ مشيجٍ مؤنّثٍ.", "options": ["صفةٌ سائدةٌ", "الجين", "الخليةُ المخصبةُ", "الانقسام المنصّف", "دورةُ الخليةِ", "الوراثةَ"], "answer": 2, "answerText": "الخليةُ المخصبةُ", "explain": "يتحد المشيج المذكر مع المشيج المؤنث فتتكون الخلية المخصبة.", "why": {}, "evp": 56, "back": "L06-s11", "section": "صح أم خطأ", "qa": "v2605d8dcc8a1", "ea": "v081d4ed0bf54", "wa": null, "ha": null, "whyA": {}}, {"id": "L10-m7", "src": "L10-q7", "kept": false, "page": 72, "type": "mcq", "text": "ما أولُ طورٍ في الانقسامِ المنصِّفِ؟", "options": ["أ. تنقسم الخلية", "ب. تبتعد أزواج الكروموسومات", "ج. تصطف الكروموسومات في أزواج", "د. تتضاعف الكروموسومات"], "answer": 3, "answerText": "د. تتضاعف الكروموسومات", "explain": "أطوار الانقسام المنصّف (ص٥٦): تتضاعف الكروموسومات أولًا، ثم تصطف في أزواج، ثم تبتعد، ثم تنقسم الخلية.", "why": {"0": "انقسام الخلية يأتي بعد التضاعف والاصطفاف والابتعاد.", "1": "ابتعاد الأزواج يأتي بعد الاصطفاف.", "2": "الاصطفاف في أزواج يأتي بعد التضاعف."}, "evp": 56, "back": "L06-s11", "fig": "f56a", "section": "اختر الإجابة الصحيحة", "qa": "v4702d7a41c04", "ea": "vb97eb603607c", "wa": null, "ha": null, "whyA": {"0": "v54af4236fe45", "1": "v2eaad98607f6", "2": "vfd6161bcbb06"}}, {"id": "L10-m8", "src": "L10-q8", "kept": false, "page": 72, "type": "mcq", "text": "كيف ينتجُ عنِ الانقسامِ المتساوي خليتانِ متماثلتانِ وراثيًّا؟", "options": ["أ. تنقسم الخلية مرتين فتأخذ كل خلية نصف الكروموسومات", "ب. تضاعف الخلية كروموسوماتها ثم تنقسم، فتأخذ كل خلية مجموعة كاملة", "ج. تتحد خليتان ثم تنقسمان", "د. تنقسم الخلية دون أن تضاعف كروموسوماتها"], "answer": 1, "answerText": "ب. تضاعف الخلية كروموسوماتها ثم تنقسم، فتأخذ كل خلية مجموعة كاملة", "explain": "الكتاب (ص٥٤): تضاعف الخلية كروموسوماتها حتى يكون لديها مجموعة ثانية مماثلة، ثم تنقسم، فتتكون خليتان في نواة كل منهما مجموعة كاملة.", "why": {"0": "هذا وصف الانقسام المنصّف، لا المتساوي.", "2": "الاتحاد يكون بين المشيجين في التكاثر الجنسي.", "3": "لو انقسمت دون مضاعفة لأخذت كل خلية النصف، وهذا يسبب مشكلات خطيرة."}, "evp": 54, "back": "L06-s8", "section": "اختر الإجابة الصحيحة", "qa": "v11997fb71aaf", "ea": "v3c7d279b118d", "wa": null, "ha": null, "whyA": {"0": "v34db78fdc3ac", "2": "v3c4b9d79def1", "3": "vc001edb70f26"}}, {"id": "L10-m9", "src": "L10-q9", "kept": false, "page": 72, "type": "mcq", "text": "كيفَ أرى الخليةَ وأدرسُ مكوّناتِها؟", "options": ["أ. بالعين المجردة", "ب. بالمجهر", "ج. بمخطط السلالة", "د. بالعدسة الشمسية"], "answer": 1, "answerText": "ب. بالمجهر", "explain": "معظم الخلايا لا يمكن مشاهدتها بالعين المجردة، لذلك نستعمل المجهر (ص٢٤، وص٥٣: لا تُشاهد إلا بالمجهر).", "why": {"0": "معظم الخلايا صغيرة جدًّا لا تُرى بالعين المجردة.", "2": "مخطط السلالة لتتبع الصفات في العائلة.", "3": "الكتاب يذكر المجهر أداةً لرؤية الخلايا."}, "evp": 24, "back": "L01-s1", "section": "اختر الإجابة الصحيحة", "qa": "v5b6d4c4955fe", "ea": "v77ae973b8143", "wa": null, "ha": null, "whyA": {"0": "v475f22b7c9f7", "2": "vb54bb85ada13", "3": "v70ccb1fd6376"}}, {"id": "L10-m10", "src": "L10-q10", "kept": false, "page": 72, "type": "mcq", "text": "أبوانِ يحملانِ الجينَ السائدَ لعيونٍ بنيّةِ اللونِ. هلْ تكونُ عيونُ طفلِهما بنيّةً بالتأكيدِ؟", "options": ["أ. نعم دائمًا؛ لأن الصفة السائدة لا تختفي أبدًا", "ب. لا أبدًا؛ لأن الطفل يرث صفات الأم فقط", "ج. ليس بالضرورة؛ فقد يحمل الأبوان جين الصفة المتنحية أيضًا فيرثه الطفل منهما", "د. نعم؛ لأن لون العيون صفة مكتسبة"], "answer": 2, "answerText": "ج. ليس بالضرورة؛ فقد يحمل الأبوان جين الصفة المتنحية أيضًا فيرثه الطفل منهما", "explain": "مثل الغمازات (ص٦٨): قد يحمل الأبوان جين الصفة المتنحية دون أن تظهر عليهما، فيرثه الطفل من كليهما فتظهر عليه.", "why": {"0": "الطفل قد يرث الجين المتنحي من كلا الأبوين فتظهر الصفة المتنحية.", "1": "الطفل يرث جينًا من الأب وجينًا من الأم.", "3": "لون العيون صفة موروثة لا مكتسبة."}, "evp": 68, "back": "L08-s8", "section": "اختر الإجابة الصحيحة", "qa": "v1173f0fc1ad3", "ea": "v37fb4fe660dc", "wa": null, "ha": null, "whyA": {"0": "v5f69434f52eb", "1": "v3e71b9eaa0ff", "3": "v37ef61b3b32d"}}, {"id": "L10-m11", "src": "L10-q11", "kept": false, "page": 72, "type": "mcq", "text": "ما عددُ خلايا البكتيريا التي تنتجُ عنْ ٤ خلايا بعدَ انقسامِها انقسامًا متساويًا مرةً واحدةً؟", "options": ["أ. ٤", "ب. ٦", "ج. ١٦", "د. ٨"], "answer": 3, "answerText": "د. ٨", "explain": "كل خلية تنقسم إلى خليتين: ٤ × ٢ = ٨ خلايا.", "why": {"0": "بعد الانقسام يزيد العدد، فلا يبقى ٤.", "1": "كل خلية تصبح خليتين، فالعدد يتضاعف لا يزيد ٢ فقط.", "2": "١٦ تكون بعد انقسامين، والسؤال عن مرة واحدة."}, "evp": 52, "back": "L06-s5", "section": "اختر الإجابة الصحيحة", "qa": "vae666b349841", "ea": "v2591a7064b56", "wa": null, "ha": null, "whyA": {"0": "vad6bc673a340", "1": "vc71780ef7ce0", "2": "vf3b544b45bd8"}}, {"id": "L10-m12", "src": "L10-q12", "kept": true, "page": 72, "type": "mcq", "text": "أختارُ الإجابةَ الصحيحةَ: ما العمليتانِ اللتانِ يظهرُهما الشكلُ؟", "options": ["أ. الإخصابُ والانقسامُ", "ب. الانتشارُ والبناءُ الضوئيُّ", "ج. النموُّ وانقسامُ الخليةِ", "د. الإخصابُ والانقسامُ المنصِّفُ"], "answer": 2, "answerText": "ج. النموُّ وانقسامُ الخليةِ", "explain": "الشكل دورة الخلية، ونمو الخلايا وانقسامها عمليتان مستمرتان فيها.", "why": {"0": "الإخصاب اتحاد المشيجين، والشكل لا يُظهر أمشاجًا.", "1": "الانتشار والبناء الضوئي ليسا في شكل دورة الخلية.", "3": "الشكل دورة الخلية (نمو ثم انقسام)، لا إخصاب ولا انقسام منصّف."}, "evp": 52, "back": "L06-s5", "fig": "f72a", "section": "اختر الإجابة الصحيحة", "qa": "vbb2a9fab3bd9", "ea": "v1e5db6499f66", "wa": null, "ha": null, "whyA": {"0": "vaeafc4afe9b8", "1": "vc365e3e911c7", "3": "vc4d6c6c64fb1"}}, {"id": "L10-m13", "src": "L10-q13", "kept": true, "page": 72, "type": "mcq", "text": "اخترْ الإجابةَ الصَّحيحَةَ. حافظتْ بعضُ المخلوقاتِ الحيَّةِ على نفسِهَا من الانقراضِ، ما الَّذِي مكَّنَهَا منْ ذلكَ؟", "options": ["أ- التَّنافسُ على الغذاءِ.", "ب- الانتخابُ الطَّبيعيُّ.", "ج- الهجرةُ إلى أماكنَ جديدةٍ.", "د- حمايةُ النِّظامِ البيئيِّ."], "answer": 1, "answerText": "ب- الانتخابُ الطَّبيعيُّ.", "explain": "الانتخاب الطبيعي يجعل المخلوقات ذات السمات التكيفية أكثر قدرة على البقاء والتكاثر، فتنقل سماتها عبر الأجيال.", "why": {"0": "التنافس على الغذاء ليس ما يحفظ النوع في الكتاب.", "2": "الكتاب لا يذكر الهجرة سببًا للبقاء.", "3": "الكتاب يذكر الانتخاب الطبيعي والسمات التكيفية."}, "evp": 68, "back": "L08-s9", "section": "اختر الإجابة الصحيحة", "qa": "v8517904be01f", "ea": "vf57bffd4e33a", "wa": null, "ha": null, "whyA": {"0": "vd49b37275b89", "2": "vca9f86319ccf", "3": "v58558d324c44"}}, {"id": "L10-m14", "src": "L10-q14", "kept": true, "page": 72, "type": "tf", "text": "صوابٌ أمْ خطأٌ. اكتشفَ مندلُ وجودَ الجيناتِ في خلايا المخلوقاتِ الحيةِ.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "مندل لاحظ كيف تورث صفات البازلاء. وتوصّل إلى أن كل صفة يتحكم فيها عاملان؛ عامل من الأب وآخر من الأم يسميان الجينات. فهو اكتشف المبادئ الأساسية للوراثة من التلقيح، لا الجينات في الخلايا.", "why": {"0": "مندل لم يرَ الجينات في الخلايا؛ لاحظ بالتلقيح أن كل صفة يتحكم فيها عاملان سُمّيا الجينات."}, "evp": 66, "back": "L08-s5", "section": "صح أم خطأ", "qa": "v85b56863a9f8", "ea": "v3a8560c93393", "wa": null, "ha": null, "whyA": {"0": "vdf352249f78f"}}, {"id": "L10-m15", "src": "L10-q15", "kept": true, "page": 72, "type": "tf", "text": "صوابٌ أمْ خطأٌ. تنوعُ الصفاتِ الوراثيةِ يساعدُ أفرادَ النوعِ الواحدِ علَى البقاءِ والتكاثرِ.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "الكائنات التي تمتلك سمات تكيفية تكون غالبًا أكثر قدرة على البقاء والتكاثر. فلما جفّ المناخ نجحت العصافير ذات المناقير الصغيرة.", "why": {"1": "المخلوقات ذات السمات التكيفية أكثر قدرة على البقاء والتكاثر."}, "evp": 68, "back": "L08-s9", "section": "صح أم خطأ", "qa": "v294d0bc60d82", "ea": "v00be133ec272", "wa": null, "ha": null, "whyA": {"1": "v803fa47b6102"}}, {"id": "L10-m16", "src": "L10-q16", "kept": false, "page": 72, "type": "mcq", "text": "كيفَ تنقلُ المخلوقاتُ الحيةُ الصفاتِ إلى أبنائِها؟", "options": ["أ. بانقسام خلايا الجلد", "ب. بالتعلّم والممارسة", "ج. باتحاد المشيج المذكر والمشيج المؤنث، فتأخذ الخلية المخصبة كروموسومات من الأبوين", "د. بتغيّر البيئة"], "answer": 2, "answerText": "ج. باتحاد المشيج المذكر والمشيج المؤنث، فتأخذ الخلية المخصبة كروموسومات من الأبوين", "explain": "الكتاب (ص٥٦): يتحد المشيجان لتكوين الخلية المخصبة، فينتقل إلى الابن كروموسومات من كلا الأبوين وصفات وراثية منهما.", "why": {"0": "خلايا الجلد خلايا جسمية لا تنقل الصفات للأبناء.", "1": "ما يُتعلَّم صفة مكتسبة لا تُورَث.", "3": "البيئة تؤثر في الصفات المكتسبة التي لا تُنقَل للأبناء."}, "evp": 56, "back": "L06-s11", "section": "اختر الإجابة الصحيحة", "qa": "vdcdf2c793c53", "ea": "v2239cfc33f50", "wa": null, "ha": null, "whyA": {"0": "v90a150fcc074", "1": "v73d0d444ca22", "3": "v5bd5bcd910ca"}}, {"id": "L10-m17", "src": "L10-q18", "kept": true, "page": 73, "type": "mcq", "text": "أيُّ العملياتِ التاليةِ تؤدي إلى انقسامِ الخليةِ إلى خليتيْنِ متطابقتيْنِ؟", "options": ["أ. الانقسامُ المنصّفُ.", "ب. الإخصابُ", "ج. الانقسامُ المتساوي.", "د. التكاثرُ الجنسيُّ."], "answer": 2, "answerText": "ج. الانقسامُ المتساوي.", "explain": "في الانقسام المتساوي تضاعف الخلية كروموسوماتها ثم تنقسم، فتتكون خليتان متماثلتان.", "why": {"0": "الانقسام المنصّف ينتج أربع خلايا بنصف العدد.", "1": "الإخصاب اتحاد المشيجين، لا انقسام.", "3": "التكاثر الجنسي يتحد فيه المشيجان."}, "evp": 54, "back": "L06-s8", "section": "اختر الإجابة الصحيحة", "qa": "vb8d81eb2cd72", "ea": "v93da1da67a8c", "wa": null, "ha": null, "whyA": {"0": "v3ddf6dc35a0d", "1": "v81cd35ef158e", "3": "vdf04c147eed5"}}, {"id": "L10-m18", "src": "L10-q19", "kept": true, "page": 73, "type": "mcq", "text": "أدرسُ الشكلَ التاليَ، وأجيبُ عنِ السؤالِ الذي يليهِ: إذا كانتْ صفةُ الأزهارِ الأرجوانيةِ سائدةً، فما صفاتُ الأزهارِ التي أتوقّعُ ظهورَها إذا تمَّ تلقيحُ أفرادِ الجيلِ الأولِ تلقيحًا ذاتيًّا؟", "options": ["أ. جميعُها أرجوانيّةٌ.", "ب. جميعُها بيضاءُ.", "ج. بعضُها أرجوانيٌّ وبعضُها أبيضُ.", "د. جميعُها أرجوانيّةٌ فاتحةٌ."], "answer": 2, "answerText": "ج. بعضُها أرجوانيٌّ وبعضُها أبيضُ.", "explain": "لما لقّح مندل نباتين أرجوانيين من الجيل الأول، ظهرت الأزهار البيضاء مرة أخرى في الجيل الثاني. فالصفة البيضاء لم تختفِ، بل منعتها السائدة من الظهور.", "why": {"0": "في الجيل الثاني ظهرت الأزهار البيضاء مرة أخرى.", "1": "الأرجوانية سائدة، فلا تكون كلها بيضاء.", "3": "الكتاب لا يذكر لونًا أرجوانيًّا فاتحًا؛ الألوان أرجوانية وبيضاء."}, "evp": 66, "back": "L08-s6", "fig": "f73a", "section": "اختر الإجابة الصحيحة", "qa": "vd2faafc44e64", "ea": "va57e1dfd2bdf", "wa": null, "ha": null, "whyA": {"0": "va26317046346", "1": "v3ef3b3a47858", "3": "vaf352942dbd5"}}, {"id": "L10-m19", "src": "L10-q20", "kept": true, "page": 73, "type": "mcq", "text": "إذا كانَ عددُ الكروموسوماتِ في خلايا الحصانِ (٦٤) كروموسومًا، فما عددُ الكروموسوماتِ في المشيجِ المذكرِ لهذا الحيوانِ؟", "options": ["أ. ٨", "ب. ١٦", "ج. ٣٢", "د. ٦٤"], "answer": 2, "answerText": "ج. ٣٢", "explain": "المشيج يتكون بالانقسام المنصف، فيحتوي على نصف العدد الأصلي من الكروموسومات: ٦٤ ÷ ٢ = ٣٢.", "why": {"0": "٨ ثُمن العدد، والمشيج فيه النصف.", "1": "١٦ ربع العدد، والمشيج فيه النصف.", "3": "٦٤ عدد خلايا الجسم، والمشيج فيه النصف."}, "evp": 56, "back": "L06-s11", "section": "اختر الإجابة الصحيحة", "qa": "v442e149dc83e", "ea": "vd88422b57e8b", "wa": null, "ha": null, "whyA": {"0": "vcf046953d098", "1": "v4150cf52008b", "3": "vec7c5aa9e990"}}, {"id": "L10-m20", "src": "L10-q21", "kept": true, "page": 73, "type": "mcq", "text": "الخليةُ المخصبةُ تَنتجُ بسببِ:", "options": ["أ. انقسامِ الخلايا الجنسيةِ.", "ب. اندماجِ الخلايا الجنسيةِ.", "ج. انقسامِ الخلايا الجسميةِ.", "د. اندماجِ الخلايا الجسميةِ."], "answer": 1, "answerText": "ب. اندماجِ الخلايا الجنسيةِ.", "explain": "المشيج المذكر والمشيج المؤنث خليتان جنسيتان، تتحدان معًا لتكوّنا خلية مخصبة.", "why": {"0": "انقسام الخلايا الجنسية لا يكوّن خلية مخصبة.", "2": "انقسام الخلايا الجسمية انقسام متساوٍ ينتج خلايا جسمية.", "3": "الخلية المخصبة من اتحاد خلايا جنسية لا جسمية."}, "evp": 56, "back": "L06-s11", "section": "اختر الإجابة الصحيحة", "qa": "v46716ffa74da", "ea": "v9ced8c5ab052", "wa": null, "ha": null, "whyA": {"0": "vf83939643ccd", "2": "v245ec994c17e", "3": "v565de75dd036"}}, {"id": "L10-m21", "src": "L10-q22", "kept": false, "page": 73, "type": "mcq", "text": "في شكلِ دورةِ حياةِ الخليةِ، لماذا لا تستمرُّ الخليةُ في النموِّ؟", "options": ["أ. لأن نواتها تختفي", "ب. لأنها لا تحتاج إلى مواد مغذية", "ج. لأن مساحة الغشاء البلازمي لا تكفي لتبادل المواد مع حجمها", "د. لأنها تتحد مع خلية أخرى"], "answer": 2, "answerText": "ج. لأن مساحة الغشاء البلازمي لا تكفي لتبادل المواد مع حجمها", "explain": "تنمو الخلية فيكبر حجمها، ثم تتهيأ للانقسام، ثم تنقسم. ولا تستمر في النمو لأن الغشاء البلازمي ينمو أبطأ من حجمها (ص٥٣).", "why": {"0": "النواة لا تختفي، ومنها يبدأ الانقسام.", "1": "كل خلية تحتاج إلى الأكسجين والسكر والمواد المغذية.", "3": "الخلية تنقسم إلى خليتين، لا تتحد."}, "evp": 53, "back": "L06-s6", "fig": "f73b", "section": "اختر الإجابة الصحيحة", "qa": "ve4143f301900", "ea": "va1a0fc85c1f0", "wa": null, "ha": null, "whyA": {"0": "vd9591aed421b", "1": "v1bc8705ecb77", "3": "v32dd7181b9f9"}}, {"id": "L10-m22", "src": "L10-q23", "kept": false, "page": 74, "type": "mcq", "text": "لقّحَ مزارعٌ نباتاتِ بازلاءَ بذورُها ملساءُ، فظهرتْ في بعضِ النباتاتِ الناتجةِ بذورٌ مجعّدةٌ. كيف ظهرتِ البذورُ المجعّدةُ؟", "options": ["أ. لأن المزارع سقاها ماءً كثيرًا", "ب. لأن البذور الملساء صفة متنحية", "ج. لأن الصفة المجعّدة اختفت ثم ظهرت مصادفة", "د. لأن النباتات الأصلية تحمل جين الصفة المتنحية (المجعّدة) دون أن تظهر عليها"], "answer": 3, "answerText": "د. لأن النباتات الأصلية تحمل جين الصفة المتنحية (المجعّدة) دون أن تظهر عليها", "explain": "البذور الملساء سائدة والمجعّدة متنحية (ص٦٦). النباتات الأصلية تحمل جين المجعّدة محجوبًا، فورثه بعض الأبناء من الأبوين فظهرت.", "why": {"0": "شكل البذور صفة موروثة لا يغيّرها الماء.", "1": "البذور الملساء صفة سائدة.", "2": "الصفة المتنحية لا تختفي، بل تُحجب ثم تظهر بالوراثة."}, "evp": 66, "back": "L08-s5", "section": "اختر الإجابة الصحيحة", "qa": "va7841c265c78", "ea": "vcdbd1217cb2c", "wa": null, "ha": null, "whyA": {"0": "vf607913832e3", "1": "v6ba9d0e11ef5", "2": "v20e1f3e7a7d0"}}, {"id": "L10-m23", "src": "L10-q24", "kept": false, "page": 74, "type": "mcq", "text": "في مخطّطِ السلالةِ (ص٧٤): كمْ عددُ الأبناءِ الذينَ شحمةُ أذنِهم ملتحمةٌ، وكمْ عددُ الذينَ شحمةُ أذنِهم غيرُ ملتحمةٍ؟", "options": ["أ. واحد ملتحمة، وثلاثة غير ملتحمة", "ب. ثلاثة ملتحمة، وواحد غير ملتحمة", "ج. اثنان ملتحمة، واثنان غير ملتحمة", "د. أربعة غير ملتحمة، ولا أحد ملتحمة"], "answer": 0, "answerText": "أ. واحد ملتحمة، وثلاثة غير ملتحمة", "explain": "مفتاح الشكل: الرمادي الغامق شحمة غير ملتحمة (سائدة)، والفاتح ملتحمة (متنحية). من الأبناء الأربعة ابن واحد فاتح. وظهر التنوع لأن الأبوين يحملان جين الصفة المتنحية.", "why": {"1": "الرمادي الغامق يعني غير ملتحمة، وثلاثة أبناء غامقون.", "2": "ابن واحد فقط لونه فاتح.", "3": "هناك ابن واحد لونه فاتح (ملتحمة)."}, "evp": 68, "back": "L08-s8", "fig": "f74a", "section": "اختر الإجابة الصحيحة", "qa": "vfad6ed6c2395", "ea": "vb60c11407f17", "wa": null, "ha": null, "whyA": {"1": "v2ccdaea84cb6", "2": "v3c27ec2048c7", "3": "vac9e94f6221d"}}]}], "figs": {"f24a": {"page": 24, "bbox": [160, 752, 1030, 1408], "title": "مجهر روبرت هوك وخلايا الفلين", "caption": "استطاع روبرت هوك أن يشاهد خلايا الفلين بمجهر يشبه المجهر الذي عن يسار الصورة. أما الصورة عن اليمين فهي لخلايا الفلين، وقد أخذت باستخدام نوع من المجاهر يسمى المجهر الإلكتروني الماسح، وله قوة تكبير عالية جدًا.", "note": "صورة: مجهر قديم وصور مكبّرة لخلايا الفلين", "realNote": "المجهر وصور الخلايا مأخوذة من صور مختلفة، وجُمعت هنا للتعلّم.", "parts": [{"id": "p1", "name": "مجهر يشبه مجهر روبرت هوك", "box": [0, 0, 182, 593], "shape": "rect", "fn": "بمجهر يشبهه شاهد روبرت هوك خلايا الفلين.", "rel": "صنعه هوك عام ١٦٦٥م وفحص به شريحة رقيقة من الفلين.", "page": 24, "a": "ve6bf143e4bdf"}, {"id": "p2", "name": "خلايا الفلين تحت المجهر الإلكتروني الماسح", "box": [620, 316, 868, 596], "shape": "ellipse" /* ---------- lesson: tabs → decks ---------- */
function tabsOf(l) {

  else { t.push(['e', '📘', 'أفهم']); if ((l.points || []).length) t.push(['p', '⭐', 'أهم النقاط']); if ((l.terms || []).length) t.push(['t', '🟨', 'المصطلحات']); if (qsOf(l).length) t.push(['q', '✏️', kind(l) === 'act' ? 'الأسئلة' : 'اختبار الدرس']); }

}

    bub.innerHTML = `<b>${esc(P.name)}</b>${P.fn ? ' — ' + esc(P.fn) : ''}`; bub.classList.add('on'); seq([{a: P.a}]);
  });
  return {enter, whole, focus, toggleExplode};
}

/* ---------- settings ---------- */
$('#setb').onclick = () => {
  $('#mbox').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><b>⚙️ الإعدادات</b><button class="chip" id="mx">✕ إغلاق</button></div><div class="set">
  <label>سرعة الصوت والحركة <select id="sp"><option value=".85">أبطأ</option><option value="1">عادية</option><option value="1.2">أسرع</option></select></label>
  <label>تقليل الحركة <input type="checkbox" id="cm"></label>
  <label>كتم الصوت <input type="checkbox" id="mu"></label>
  <label>مسح تقدّمي في هذا الجهاز <button class="chip" id="rs">مسح</button></label></div><p class="note">${esc(D.credit)}</p>`;
  $('#modal').classList.add('on'); $('#mx').onclick = () => $('#modal').classList.remove('on');
  $('#sp').value = String(S.speed); $('#cm').checked = S.calm; $('#mu').checked = S.mute;
  $('#sp').onchange = e => { S.speed = +e.target.value; save(); };
  $('#cm').onchange = e => { S.calm = e.target.checked; S.calmSet = 1; save(); };
  $('#mu').onchange = e => setMute(e.target.checked);
  $('#rs').onclick = () => { if (confirm('مسح التقدّم والإجابات المحفوظة؟')) { S.seen = {}; S.ans = {}; S.pos = {}; S.last = null; save(); $('#modal').classList.remove('on'); home(); } };
};
$('#home').onclick = home;
home();
</script>
