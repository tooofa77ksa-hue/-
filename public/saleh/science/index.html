أولُ: كيفَ تُنتجُ الخليةُ خلايا جديدةً؟\nالدرسُ الثاني: كيفَ تنتقلُ الصفاتُ منَ الآباءِ إلى الأبناءِ؟", "simple": "هذا مدخل الفصل الثاني. سندرس كيف تُنتج الخلية خلايا جديدة، وكيف تنتقل الصفات من الآباء إلى الأبناء. أهم الكلمات: دورة الخلية، والانقسام المتساوي، والانقسام المنصّف، والوراثة.", "steps": [{"q": "ماذا أرى؟", "t": "صورة بالمجهر لخلايا نبات، بعضها في أثناء الانقسام.", "fig": "f48a", "a": "vc676ba7cd602"}, {"q": "ما السؤال الكبير؟", "t": "كيف تنقل المخلوقات الحية الصفات إلى أبنائها؟", "a": "vdece29bcfa49"}, {"q": "ما أسئلة الدرسين؟", "t": "الدرس الأول: كيف تُنتج الخلية خلايا جديدة؟ والدرس الثاني: كيف تنتقل الصفات من الآباء إلى الأبناء؟", "a": "v5b63bfc59ba7"}, {"q": "الفكرة المهمة", "t": "الخلية تنقسم لتصنع خلايا جديدة، والصفات تنتقل من الآباء إلى الأبناء بالوراثة.", "a": "vd9f58a334401"}], "figs": ["f48a"], "key": "يدرس الفصل كيف تُنتج الخلية خلايا جديدة، وكيف تنتقل الصفات من الآباء إلى الأبناء.", "sa": "v83e263d740a1"}, {"id": "L06-s2", "page": 49, "title": "مفرداتُ الفكرةِ العامةِ", "book": "دورةُ الخليةِ: عمليةٌ مستمرةٌ لنموِّ الخلايَا وانقسامِها وتعويضِ التالفِ منها.\nالانقسامُ المتساوي: انقسامُ نواةِ الخليةِ في أثناءِ انقسامِ الخليةِ إلى خليتينِ متماثلتينِ.\nالانقسامُ المنصِّفُ: نوعٌ خاصٌّ منَ الانقسامِ الخلويِّ تنتجُ عنهُ الخلايا التَناسليةُ ويحتوي كلٌّ منها على نصفِ عددِ الكروموسوماتِ الموجودةِ في الخليةِ الأمِّ وفي غيرِها منَ الخلايا.\nالوراثةُ: انتقالُ الصفاتِ الموروثةِ منَ الآباءِ إلى الأبناءِ.\nالصفةُ السائدةُ: صفةٌ وراثيةٌ في المخلوقاتِ الحيّةِ تمنعُ صفةً أخرَى منَ الظهورِ.\nمخطّطُ السُّلالةِ: مُخطّطٌ يُستعملُ لتتبُّعِ الصِّفاتِ في العائِلةِ، ودراسةِ الأنماطِ الوراثيةِ.", "simple": "هذه كلمات الفصل المهمة. دورة الخلية: نمو وانقسام وتعويض. الانقسام المتساوي ينتج خليتين متماثلتين. الانقسام المنصّف ينتج خلايا تناسلية بنصف عدد الكروموسومات. والوراثة انتقال الصفات من الآباء إلى الأبناء.", "steps": [{"q": "ماذا أرى؟", "t": "صورة صغيرة لكل كلمة، مثل دائرة دورة الخلية.", "fig": "f49a", "a": "ve38baf2a5b28"}, {"q": "كلمات الدرس الأول", "t": "دورة الخلية، والانقسام المتساوي، والانقسام المنصّف.", "a": "v7a559736668c"}, {"q": "كلمات الدرس الثاني", "t": "الوراثة، والصفة السائدة، ومخطط السلالة.", "a": "v8cf6156fab11"}, {"q": "الفكرة المهمة", "t": "الانقسام المنصّف ينتج خلايا تناسلية فيها نصف عدد الكروموسومات.", "a": "v4ade2352a36c"}], "figs": ["f49a"], "key": "مفردات الفصل: دورة الخلية، والانقسام المتساوي والمنصّف، والوراثة، والصفة السائدة، ومخطط السلالة.", "sa": "vc70e228420ea"}, {"id": "L06-s3", "page": 50, "title": "أنظرُ وأتساءلُ", "book": "يبدأُ الضفدعُ حياتَهُ، كما في الحيواناتِ كلِّهَا، منْ خليةٍ واحدةٍ. يمكنُ للخلايا أنْ تنموَ، ولكنَّ هناكَ حدًّا أعلى للحجمِ الذي يمكنُ أن تنموَ إليهِ الخليةُ. فكيفَ تنمو خليةٌ واحدةٌ لتصبحَ ضفدعًا مكتملَ النموِّ؟", "simple": "الضفدع يبدأ حياته من خلية واحدة. الخلية تكبر، لكن لكبرها حدّ لا تتجاوزه. فكيف يصير الضفدع كبيرًا؟ هذا ما سنعرفه في الدرس.", "steps": [{"q": "ماذا أرى؟", "t": "بيض ضفدع: كرات شفافة، في وسط كل منها نقطة داكنة.", "fig": "f50a", "a": "vd28145fe39a2"}, {"q": "من أين يبدأ الضفدع؟", "t": "يبدأ الضفدع حياته من خلية واحدة، مثل الحيوانات كلها.", "a": "v49c9cea1f52d"}, {"q": "ما المشكلة؟", "t": "الخلية تنمو، لكن هناك حدًّا أعلى لحجمها.", "a": "v032470ac3f6d"}, {"q": "الفكرة المهمة", "t": "ليصير المخلوق كبيرًا يحتاج إلى خلايا أكثر، لا إلى خلية أكبر فقط.", "a": "ve684a17563e1"}], "figs": ["f50a"], "key": "المخلوق الحي يبدأ من خلية واحدة، والخلية لا تكبر بلا حدود.", "sa": "v7566fae6a680"}, {"id": "L06-s4", "page": 51, "title": "أستكشفُ: كيفَ تصبحُ الخليةُ الواحدةُ عدةَ خلايَا؟", "book": "الهدفُ: كيفَ تصبحُ خليةٌ واحدةٌ مخلوقًا حيًّا مكتملَ النموِّ؟ لمعرفةِ المزيدِ عنْ هذَا الموضوعِ أفحصُ عددًا منَ الشرائحِ التي تبيِّنُ خلايَا في مراحلَ مختلفةٍ منَ الانقسامِ الخلويِّ، تلكَ العمليةِ التي تؤدِّي إلَى إنتاجِ المَزيدِ منَ الخلايَا.\nأحتاجُ إلى: شرائحَ جاهزةٍ تبينُ الانقسامَ الخلويَّ، مجهرٍ مركّبٍ، لوحةٍ كرتونيةٍ، مقصٍّ، شريطٍ لاصقٍ شفّافٍ، بطاقاتِ فهرسٍ بيضاءَ.\n١ ألاحظُ. أفحصُ الشريحةَ الأولى بقوةِ التكبيرِ الصغرَى للمجهرِ المركبِ، وأستخدمُ الضابطَ الكبيرَ لرؤيةِ الخلايا بصورةٍ واضحةٍ. وأستخدمُ الضابطَ الصغيرَ لجعلِ الرؤيةِ أكثرَ وضوحًا. أكرِّرُ ما قمتُ به مستخدمًا قوةَ تكبيرٍ أكبرَ. أسجّلُ التفاصيلَ التي ألاحظُها، وأرسمُ عيناتٍ من الخلايا التي شاهدتُها على بطاقاتِ الفهرسةِ. وأكرِّرُ هذه العمليةَ لكلِّ شريحةٍ.\n٢ أتواصلُ. أقارنُ ما رسمْتُه برسومِ زملائي في الصفِّ. أحدِّدُ أيَّ الخلايا تبدو في المرحلةِ نفسِها منَ الانقسامِ، وأيُّها يمرُّ بمراحلَ مختلفةٍ، وأناقشُ ذلكَ معَ أحدِ زملائي.\n٣ أصنّفُ. أحذرُ عندما أقصُّ أشكالَ الخلايا التي رسمتُهَا، وأجمعُ الأشكالَ التي تمرُّ بمرحلةِ الانقسامِ نفْسِها في مجموعةٍ واحدةٍ، ثم أقارنُ رسومي برسومِ زملائي في الصفِّ. أُقررُ معَ زملائي في الصفِّ عددَ مجموعاتِ الصورِ التي تمثلُ مراحلَ الانقسامِ.\nأستخلصُ النتائجَ\n٤ أختارُ رسمًا يمثلُ كلَّ مرحلةٍ منْ مراحلِ الانقسامِ وألصقُها بالتسلسلِ علَى لوحةٍ كرتونيةٍ؛ لعملِ مخططٍ يبيِّنُ مراحلَ الانقسامِ، وأحتفظُ بالمخططِ لاستخدامِه مرجعًا خلالَ هذَا الدرسِ.\nأستكشفُ أكثرَ\nهلْ يمكنُ ملاحظةُ المراحلِ نفسِها في الخلايَا النباتيةِ والخلايَا الحيوانيةِ؟ تُرَى، في أيِّ أجزاءِ النباتِ تحدثُ؟ أصمِّمُ استقصاءً لاختبارِ توقُّعي. وأجرِّبُ ذلكَ، وأشاركُ زملاءَ صفِّي في النتائجِ.", "simple": "في هذا النشاط ننظر بالمجهر إلى خلايا تنقسم. نرسمها، ثم نجمع الرسوم المتشابهة معًا. ثم نرتّبها لنرى مراحل الانقسام الخلوي بالتسلسل.", "steps": [{"q": "ما الهدف؟", "t": "معرفة كيف تصبح خلية واحدة مخلوقًا حيًّا مكتمل النمو.", "fig": "f51a", "a": "vd5e28f276452"}, {"q": "ماذا أفعل أولًا؟", "t": "أفحص كل شريحة بالمجهر المركّب، وأرسم الخلايا على بطاقات.", "fig": "f51b", "a": "vb0507aa6b5b5"}, {"q": "ثم ماذا؟", "t": "أقارن رسومي برسوم زملائي، وأجمع الخلايا التي في المرحلة نفسها.", "fig": "f51c", "a": "v3e282ac6bcf8"}, {"q": "ما النتيجة؟", "t": "أرتّب رسمًا لكل مرحلة بالتسلسل على لوحة، لأعرف مراحل الانقسام.", "a": "v1470c3015bc1"}, {"q": "انتبه", "t": "أحذر عند استعمال المقص.", "a": "ve15bc8eeeeeb"}], "figs": ["f51a", "f51b", "f51c"], "key": "الخلية تمرّ بمراحل مختلفة في أثناء الانقسام، ويمكن ترتيبها بالتسلسل.", "sa": "v9e4c4945e209"}, {"id": "L06-s5", "page": 52, "title": "مَا دَورةُ الخليةِ؟", "book": "تتكوَّنُ المخلوقاتُ الحيةُ جميعُها منْ خليةٍ واحدةٍ أوْ أكثرَ. وتنمُو الخلايا لفترةٍ زمنيةٍ محددةٍ، ثمَّ تتوقَّفُ عنِ النموِّ. وبعدَ أنْ يكتملَ نموُّها تموتُ بعضُ الخلايَا، وينقسمُ بعضُها الآخرُ لينتجَ خلايَا جديدةً لتعويضِ الخلايَا الميتةِ. وتُسمَّى هذهِ العمليةُ المستمرةُ منَ النموِّ والانقسامِ والتعويضِ دورةَ الخليةِ.\nقدْ تكونُ دورةُ الخليةِ سريعةً أوْ بطيئةً. ويعتمدُ ذلكَ على نوعِ المخلوقِ الحيِّ ونوعِ النسيجِ الذي توجدُ فيه الخليةُ. فالخليةُ البكتيريةُ مثلًا تستطيعُ أنْ تُنتجَ خليتينِ جديدتينِ كلَّ ٢٠ دقيقةً، والخليتانِ الجديدتانِ تُنتجانِ أربعَ خلايا جديدةٍ، وهكذا، وخلالَ ساعاتٍ قليلةٍ تستطيعُ خليةٌ واحدةٌ أنْ تنتجَ ملايينَ الخلايَا.\nحقيقةٌ: يقومُ جسمُ الإنسانِ باستبدالِ جميعِ خلايَا الدمِ الحمراءِ كلَّ ١٢٠ يومًا تقريبًا.", "simple": "الخلية تنمو مدة محددة ثم تتوقف. بعض الخلايا يموت، وبعضها ينقسم ليعوّض الميت. هذه العملية المستمرة اسمها دورة الخلية. وقد تكون سريعة أو بطيئة.", "steps": [{"q": "ماذا أرى؟", "t": "دائرة فيها خلايا صغيرة تكبر، ثم تنقسم، ثم تكبر من جديد.", "fig": "f52a", "parts": [], "a": "v0f1fef903859"}, {"q": "ما المراحل؟", "t": "ثلاث مراحل: نمو الخلية، والتهيؤ للانقسام، وانقسام الخلية.", "fig": "f52a", "parts": ["p1", "p2", "p3"], "a": "v8240bdada20e"}, {"q": "ماذا يحدث في كل مرحلة؟", "t": "تكبر الخلية، ثم تستعد، ثم تنقسم إلى خليتين صغيرتين.", "fig": "f52a", "parts": ["p2", "p3"], "a": "vf133131d20a7"}, {"q": "لماذا تنقسم الخلايا؟", "t": "لتعويض الخلايا الميتة، ولإنتاج خلايا جديدة.", "a": "v494a9a0afe82"}, {"q": "هل سرعتها واحدة؟", "t": "لا. تعتمد على نوع المخلوق ونوع النسيج. الخلية البكتيرية تنتج خليتين كل ٢٠ دقيقة.", "a": "v393eebedc764"}, {"q": "الفكرة المهمة", "t": "دورة الخلية: نمو ثم انقسام ثم تعويض، وتتكرر باستمرار.", "a": "v696ba7d7e28f"}], "figs": ["f52a"], "key": "دورة الخلية عملية مستمرة من النمو والانقسام والتعويض.", "sa": "v798b3217e4dc"}, {"id": "L06-s6", "page": 53, "title": "محدِّداتُ حجمِ الخليةِ", "book": "تنمُو الخلايَا إلى أحجامٍ مختلفةٍ. ومعظمُ الخلايَا صغيرةٌ جدًّا لا يمكنُ مشاهدتُها إلَّا بالمجهرِ. وهناكَ عواملُ متعددةٌ تمنعُ استمرارَ نموِّ الخليةِ، وتحدِّدُ حجمَهَا. ومنْ هذهِ العواملِ النسبةُ بينَ مساحةِ الغشاءِ البلازمِي وحجمِ الخليةِ. فكلُّ خليّةٍ تحتاجُ إلى الأكسجينِ والسكرِ وموادَّ مغذيةٍ أخرَى. ويجبُ أنْ تتخلَّصَ الخليةُ منَ الفضلاتِ. وهذهِ الموادُّ يجبُ أنْ تمرَّ عبرَ الغشاءِ البلازميِّ.\nوكلَّما نمتِ الخليةُ ازدادَ حجمُها، وازدادتْ كميةُ الموادِّ التي تحتاج إلى تبادُلِها معَ الوسطِ الخارجيِّ. لذلكَ لا بدَّ أنْ يقابلَ الزيادةَ في حجمِ الخليةِ زيادةٌ في مساحةِ الغشاءِ البلازميِّ. إلَّا أنَّ الغشاءَ البلازميَّ ينمُو بمعدلٍ أقلَّ من نموِّ حجمِ الخليةِ، فتصبحُ مساحةُ الغشاءِ غيرَ كافيةٍ لحصولِ الخليةِ على الموادِّ التِي تحتاجُ إليها، أو لتخلُّصِها منَ الفضلاتِ التي تنتجُها، لذلكَ تتوقَّفُ الخليةُ عنِ النموِّ.", "simple": "كل ما يدخل الخلية أو يخرج منها يمرّ عبر الغشاء البلازمي. عندما تكبر الخلية يزيد حجمها أسرع من مساحة غشائها. فلا يكفي الغشاء لإدخال الغذاء وإخراج الفضلات، فتتوقف عن النمو.", "steps": [{"q": "ماذا تحتاج الخلية؟", "t": "الأكسجين والسكر ومواد مغذية أخرى، وتحتاج أن تتخلص من الفضلات.", "a": "v07ad0e871cbe"}, {"q": "من أين تمر المواد؟", "t": "كل هذه المواد تمر عبر الغشاء البلازمي.", "a": "vc9d1ce895b43"}, {"q": "ماذا يحدث عندما تكبر؟", "t": "يزيد حجمها، وتزيد المواد التي تحتاج إلى تبادلها.", "a": "vdb93f54fd4ab"}, {"q": "أين المشكلة؟", "t": "الغشاء البلازمي ينمو بمعدل أقل من نمو حجم الخلية، فتصبح مساحته غير كافية.", "a": "v3009d36ce49f"}, {"q": "الفكرة المهمة", "t": "النسبة بين مساحة الغشاء البلازمي وحجم الخلية تحدد حجمها، فتتوقف عن النمو.", "a": "v6cb3e1319f1a"}], "figs": [], "key": "تتوقف الخلية عن النمو لأن مساحة غشائها لا تكفي لحجمها الكبير.", "sa": "v061b41e173c9"}, {"id": "L06-s7", "page": 53, "title": "مرضُ السرطانِ ودورةُ الخليةِ", "book": "تعملُ بعضُ البروتيناتِ والموادُّ الكيميائيةُ في المخلوقاتِ الحيةِ على نموِّ الخلايا وانقسامِها. وعندَما يحدثُ خللٌ قدْ يسبِّبُ مشكلاتٍ خطيرةً. ومنْ هذهِ المشكلاتِ مرضُ السرطانِ. يحدثُ هذا المرضُ عندَما لا يتمُّ السيطرةُ على انقسامِ الخلايَا ونُموِّها. وقد يؤدِّي النموُّ السريعُ للخلايَا إلى تكوُّنِ الأورامِ، أو تكوُّنِ تجمُّعاتٍ للخلايَا السرطانيةِ. وبعضُ أنواعِ السَّرَطانِ تهدِّدُ حياةَ الإنسانِ.\nفي هذه الصورةِ التي أُخذتْ بالمجهرِ الإلكترونيِّ تَظهرُ الخليةُ الأكولةُ بلونٍ أرجوانيٍّ وهيَ تلتهمُ خليةً سرطانيةً ذاتَ لونٍ أصفرَ. الخليةُ الأكولةُ خليةُ دمٍ بيضاءُ.", "simple": "بعض البروتينات والمواد الكيميائية تنظّم نمو الخلايا وانقسامها. إذا حدث خلل، قد تنقسم الخلايا بلا سيطرة. هذا هو مرض السرطان، وقد تتكوّن أورام.", "steps": [{"q": "ماذا أرى؟", "t": "صورة بالمجهر الإلكتروني: خلية أرجوانية تلتهم خلية صفراء.", "fig": "f53a", "a": "vfc257078cd2c"}, {"q": "ما الخليتان؟", "t": "الأرجوانية هي الخلية الأكولة، وهي خلية دم بيضاء. والصفراء خلية سرطانية.", "a": "vb504e1ccf028"}, {"q": "ماذا ينظم الانقسام؟", "t": "بعض البروتينات والمواد الكيميائية في المخلوق الحي.", "a": "vbd1a650d67ed"}, {"q": "متى يحدث السرطان؟", "t": "عندما لا تتم السيطرة على انقسام الخلايا ونموها.", "a": "v67ec8a63d70f"}, {"q": "الفكرة المهمة", "t": "النمو السريع غير المضبوط للخلايا قد يكوّن أورامًا.", "a": "vd19eb907f4c4"}], "figs": ["f53a"], "key": "السرطان يحدث عندما لا تتم السيطرة على انقسام الخلايا ونموها.", "sa": "v455626f66ce3"}, {"id": "L06-s8", "page": 54, "title": "ما الانقسامُ المتساوِي؟", "book": "هاتانِ الخليتانِ الحيوانيتينِ متماثلتانِ؛ لأنَّهما أُنتِجَتا من المادةِ الوراثيةِ نفسِها لتقومَا بالوظيفةِ نفسِها.\nتوجَدُ داخلَ نواةِ الخليةِ أشرطةٌ صغيرةٌ، تحملُ في داخلِها تفاصيلَ كاملةً عنِ المخلوقِ الحيِّ تسمَّى الكروموسوماتِ. ومعظمُ خلايَا الإنسانِ تحتوِي على ٤٦ كروموسومًا. فهلْ إذَا انقسمتِ الخليةُ إلى جزأَينِ بالتساوِي ستحتوِي كلُّ خليةٍ جديدةٍ علَى نصفِ العددِ الأصليِّ منَ الكروموسوماتِ؟ لو حدثَ ذلكَ لسبَّبَ مشكلاتٍ خطيرةً لجميعِ أنواعِ الخلايَا.\nأمَّا مَا يحدثُ فهوَ أنَّ الخليةَ تُضاعِفُ كروموسوماتِها حتَّى يكونَ لدَيها مجموعةٌ ثانيةٌ مماثلةٌ، ثم تنقسمُ الخليةُ. وعندئذٍ تتكوَّنُ خليتانِ متماثلتانِ، في نواةِ كلٍّ منهما مجموعةٌ كاملةٌ منَ الكروموسوماتِ. وتُسمَّى هذهِ العمليةُ الانقسامَ المتساويَ.", "simple": "في النواة أشرطة صغيرة تحمل تفاصيل المخلوق، اسمها الكروموسومات. قبل الانقسام تضاعف الخلية كروموسوماتها. ثم تنقسم إلى خليتين متماثلتين، لكلٍّ منهما مجموعة كاملة. هذا هو الانقسام المتساوي.", "steps": [{"q": "ماذا أرى؟", "t": "خلايا حيوانية، وإحداها تنقسم إلى خليتين متماثلتين.", "fig": "f54a", "a": "v5d120af20b67"}, {"q": "ما الكروموسومات؟", "t": "أشرطة صغيرة داخل النواة، تحمل تفاصيل كاملة عن المخلوق الحي.", "a": "vfa26e15a1323"}, {"q": "كم عددها في الإنسان؟", "t": "معظم خلايا الإنسان فيها ٤٦ كروموسومًا.", "a": "v6dc3dc9293f2"}, {"q": "ماذا تفعل الخلية قبل الانقسام؟", "t": "تضاعف كروموسوماتها لتكون لديها مجموعة ثانية مماثلة.", "a": "vf1f39f4e7226"}, {"q": "ما النتيجة؟", "t": "خليتان متماثلتان، في نواة كل منهما مجموعة كاملة من الكروموسومات.", "a": "v0e37847497c4"}, {"q": "الفكرة المهمة", "t": "الانقسام المتساوي لا يُنقص عدد الكروموسومات، لأن الخلية تضاعفها أولًا.", "a": "v7526bc4476d3"}], "figs": ["f54a"], "key": "في الانقسام المتساوي تضاعف الخلية كروموسوماتها ثم تنقسم إلى خليتين متماثلتين.", "sa": "vc418d526fc78"}, {"id": "L06-s9", "page": 54, "title": "الانقسامُ المتساوي في النباتاتِ والحيواناتِ", "book": "يحدثُ الانقسامُ المتساوِي عندَ أيِّ عمليةِ انقسامٍ في نوعٍ معيَّنٍ منْ خلايَا الجسمِ يُسمَّى الخلايَا الجسميَّةَ، ومنها خلايَا الجلدِ، وخلايَا العظامِ، وخلايا الدمِ البيضاءُ وخلايا العضلاتِ. وفي عامِ ١٨٧٩م لاحظَ العالِمُ الألمانيُّ والتر فليمنج خلايَا في أطوارٍ مختلفةٍ منَ الانقسامِ عنْ طريقِ إضافةِ صبغةٍ إلى شريحةٍ خليَّةٍ، ثمَّ رسمَ ما شاهدَهُ بالمجهرِ.\nعندَمَا تبدأُ الخليةُ الجسميةُ في الانقسامِ إلى خليتينِ متماثلتينِ تتضاعفُ الكروموسوماتُ داخلَ الخليةِ، ثُمَّ تبدأُ في الاصطفافِ لتكوينِ مجموعتينِ منفصلتينِ ومتماثلتينِ من الكروموسوماتِ في الخليةِ. ثم تنتقلُ كلُّ مجموعةٍ منَ الكروموسوماتِ إلى أحدِ طرفَيِ الخليةِ. وعندَما تنقسمُ الخليةُ إلى خليتينِ جديدتينِ تحتوِي كلُّ خليةٍ جسميَّةٍ جديدةٍ على مجموعةٍ كاملةٍ من الكروموسوماتِ المماثلةِ تمامًا لكروموسوماتِ الخليةِ الأصليةِ.\nوتمرُّ الخلايا النباتيةُ والخلايَا الحيوانيةُ بالانقسامِ المتساوِي. ولكن بسببِ وجودِ جدارٍ خلويٍّ حولَ الخليةِ النباتيةِ تتكوَّنُ صفيحةٌ خلويةٌ تشبهُ امتدادًا للجدارِ الخلويِّ تفصلُ بين الخليتينِ الجديدتينِ. أمّا في الخلايا الحيوانيةِ فإنَّ الغشاءَ البلازميَّ يضيقُ إلى الداخلِ منْ وسطِ الخليةِ.\nويَنتجُ عن الانقسامِ المتساوِي في كلٍّ من الخليةِ النباتيةِ والخليةِ الحيوانيةِ خليتانِ تماثلُ كلٌّ منهُما الخليةَ الأصليةَ.", "simple": "الانقسام المتساوي يحدث في الخلايا الجسمية، مثل خلايا الجلد والعظام والعضلات. يحدث في النبات والحيوان. الفرق في النهاية: النبات تتكوّن فيه صفيحة خلوية، والحيوان يضيق غشاؤه من الوسط.", "steps": [{"q": "أين يحدث؟", "t": "في الخلايا الجسمية: خلايا الجلد، والعظام، والدم البيضاء، والعضلات.", "a": "vd7cf61bda82b"}, {"q": "من لاحظه؟", "t": "العالم الألماني والتر فليمنج سنة ١٨٧٩م، بصبغة وشريحة ومجهر.", "a": "vdc306b7efc6d"}, {"q": "ماذا يحدث للكروموسومات؟", "t": "تتضاعف، ثم تصطف في مجموعتين متماثلتين، ثم تنتقل كل مجموعة إلى طرف.", "a": "vfc0e6336f178"}, {"q": "كيف تنفصل الخلية النباتية؟", "t": "تتكوّن صفيحة خلوية تشبه امتدادًا للجدار الخلوي بين الخليتين.", "a": "v05f0520983be"}, {"q": "كيف تنفصل الخلية الحيوانية؟", "t": "يضيق الغشاء البلازمي إلى الداخل من وسط الخلية.", "a": "v1f96ba56951d"}, {"q": "الفكرة المهمة", "t": "في النبات والحيوان، ينتج الانقسام المتساوي خليتين تماثل كل منهما الأصلية.", "a": "v809ea0659baf"}], "figs": [], "key": "الانقسام المتساوي يحدث في الخلايا الجسمية للنبات والحيوان، وينتج خليتين مماثلتين للأصلية.", "sa": "v26f587f84e62"}, {"id": "L06-s10", "page": 55, "title": "الانقسامُ المتساوي", "book": "١ تشاهَدُ النواةُ بوضوحٍ، وعندَ بدءِ الانقسامِ المتساوِي يتضاعفُ عددُ الكروموسوماتِ في نواةِ الخليةِ.\n٢ تصبحُ الكروموسوماتُ مرئيةً، ويبدأُ الغلافُ المحيطُ بالنواةِ في التلاشي.\n٣ تصطفُ الكروموسوماتُ المتضاعفةُ عندَ وسطِ الخليةِ.\n٤ تنفصلُ الكروموسوماتُ المتضاعفةُ بعضُها عن بعضٍ، وتبدأُ الحركةَ في اتجاهَينِ متضادَّينِ، وتستطيلُ الخليةُ.\n٥ يتكوَّنُ غلافٌ نوويٌّ حولَ كلِّ مجموعةٍ منَ الكروموسوماتِ. بعد ذلك ينقسمُ السيتوبلازمُ، ويُنتِجُ خليتينِ، ثم تبدأُ كلُّ خليةٍ في الانقسامِ.", "simple": "الشكل يبيّن خمس خطوات للانقسام المتساوي. تتضاعف الكروموسومات، ثم تظهر، ثم تصطف في الوسط. ثم تبتعد إلى طرفين، ثم تتكوّن خليتان.", "steps": [{"q": "ماذا أرى؟", "t": "خمس صور بالمجهر، من الأعلى إلى الأسفل، لخلية تنقسم.", "fig": "f55a", "parts": [], "a": "vb61a67ca9d1c"}, {"q": "الخطوة ١", "t": "النواة واضحة، ويتضاعف عدد الكروموسومات.", "fig": "f55a", "parts": ["p1"], "a": "v67953a45a940"}, {"q": "الخطوتان ٢ و٣", "t": "تظهر الكروموسومات ويتلاشى غلاف النواة، ثم تصطف في وسط الخلية.", "fig": "f55a", "parts": ["p2", "p3"], "a": "veb1682f5ee07"}, {"q": "الخطوتان ٤ و٥", "t": "تبتعد الكروموسومات في اتجاهين، ثم يتكوّن غلاف نووي حول كل مجموعة.", "fig": "f55a", "parts": ["p4", "p5"], "a": "vec4fc705941c"}, {"q": "الفكرة المهمة", "t": "ينقسم السيتوبلازم في النهاية، فتنتج خليتان متماثلتان.", "a": "vea66c0d8ba2e"}], "figs": ["f55a"], "key": "يمر الانقسام المتساوي بخمس خطوات تنتهي بخليتين متماثلتين.", "sa": "vbd56e24f46d5"}, {"id": "L06-s11", "page": 56, "title": "ما الانقسامُ المنصِّفُ؟", "book": "تَنتجُ المخلوقاتُ الحيةُ بالتكاثرِ. وتتكاثرُ المخلوقاتُ الوحيدةُ الخليةِ عن طريقِ انقسامِ الخليةِ. أمَّا في معظمِ الحيواناتِ والنباتاتِ فتتحدُ كروموسوماتٌ منَ الأبوينِ معًا في عمليةٍ تُسمَّى التكاثرَ الجنسيَّ.\nوفي هذا النوعِ منَ التكاثرِ يُنتِجُ كلٌّ منَ الأبِ والأمِّ خلايا جنسيةً. وتُسمَّى الخليةُ الجنسيةُ الذكريةُ المشيجَ المذكرَ (الحيوانَ المنويَّ)، وهو صغيرٌ جدًّا، وقادرٌ على الحركةِ ذاتيًّا. أمّا الخليةُ الجنسيةُ الأنثويةُ فتُسمَّى المشيجَ المؤنثَ (البويضةَ)، وهيَ أكبرُ منَ الحيوانِ المنويِّ، ولا تتحرّكُ ذاتيًّا. وتتّحدُ هاتانِ الخليتانِ معًا لتكوِّنا خليةً مخصبةً (تسمَّى الزَّيْجُوتَ أوِ اللاقحةَ). وتنمُو الخليةُ المخصبةُ فتصبحُ مخلوقًا حيًّا جديدًا.\nتحتوِي معظمُ خلايَا جسمِ الإنسانِ على ٤٦ كروموسومًا. فإذَا كانَ عددُ الكروموسوماتِ في المشيجِ المذكرِ ٤٦ وفي المشيجِ المؤنثِ ٤٦ كروموسومًا، فماذا يمكنُ أنْ يحدثَ عندَما يندمجانِ معًا؟ هل تحتوِي الخليةُ المخصبةُ الجديدةُ على ٩٢ كروموسومًا، وهو ضعفُ العددِ الذي يجبُ أنْ يكونَ في كلِّ خليةٍ؟\nإنَّ الخليةَ المخصبةَ لا تحتوِي فعلاً على ضعفِ عددِ الكروموسوماتِ الموجودةِ في الخليةِ العاديةِ. ويرجعُ ذلكَ إلى أنَّ كلًّا منَ المشيجِ المذكرِ والمشيجِ المؤنثِ يتكوّنانِ بفعلِ انقسامٍ خلويٍّ يُسمَّى الانقسامَ المنصِّفَ (الاختزاليَّ)، حيثُ تنقسمُ النواةُ مرتينِ، فينتجُ أربعُ خلايا جنسيةٍ جديدةٍ في نواةِ كلٍّ منها نصفُ العددِ الأصليِّ منَ كروموسوماتِ الخليةِ الأصليةِ. وكلُّ خليةٍ جنسيةٍ في الإنسانِ تحتوِي على ٢٣ كروموسومًا. ويتّحدُ المشيجُ المذكرُ معَ المشيجِ المؤنثِ لتكوينِ الخليةِ المخصبةِ، التي تحتوِي على ٤٦ كروموسومًا، فتشبهُ بذلكَ الخليةَ الأصليةَ الأمَّ عندَ كِلا الأبوينِ. ونتيجةً لذلكَ ينتقلُ إلى الابنِ كروموسوماتٌ منْ كِلا الأبوينِ، وتنتقلُ إليهِ صفاتٌ وراثيةٌ منَ الأبوينِ.\nالانقسامُ المنصِّفُ: خلالَ الأطوارِ المبكرةِ منَ الانقسامِ المنصِّفِ يتمُّ نسخُ الكروموسوماتِ وتضاعفُها. وفي الأطوارِ اللاحقةِ يحدثُ انقسامانِ للخليةِ، وتنتجُ أربعُ خلايا، في كلٍّ منها نصفُ العددِ الأصليِّ منَ الكروموسوماتِ، مقارنةً بالخليةِ الأصليةِ.", "simple": "في التكاثر الجنسي يُنتج الأب مشيجًا مذكرًا، وتُنتج الأم مشيجًا مؤنثًا. يتحدان فتتكوّن خلية مخصبة (لاقحة). الأمشاج تتكوّن بالانقسام المنصّف، فيها نصف عدد الكروموسومات: ٢٣ في الإنسان. فتصبح اللاقحة ٤٦ لا ٩٢.", "steps": [{"q": "ماذا أرى؟", "t": "خلية أصلية تنقسم مرتين، فتنتج أربع خلايا. نقرأ الشكل من اليمين إلى اليسار.", "fig": "f56a", "parts": [], "a": "v2aaca3ee147c"}, {"q": "الانقسام الأول", "t": "تتضاعف الكروموسومات، ثم تصطف في أزواج، ثم تبتعد الأزواج، ثم تنقسم الخلية.", "fig": "f56a", "parts": ["p1", "p2", "p3", "p4", "p5"], "a": "v3326f467b680"}, {"q": "الانقسام الثاني", "t": "تصطف الكروموسومات المزدوجة، ثم تبتعد، ثم تنقسم كل خلية مرة ثانية.", "fig": "f57a", "parts": ["p1", "p2", "p3"], "a": "ve4656e3c574a"}, {"q": "ما الأمشاج؟", "t": "المشيج المذكر (الحيوان المنوي) صغير ويتحرك ذاتيًّا. المشيج المؤنث (البويضة) أكبر ولا يتحرك ذاتيًّا.", "a": "vccdc464134d1"}, {"q": "لماذا النصف؟", "t": "٢٣ من الأب + ٢٣ من الأم = ٤٦ في اللاقحة، مثل الخلية الأصلية.", "a": "v082a5d36fa7b"}, {"q": "الفكرة المهمة", "t": "الانقسام المنصّف: انقسامان، وأربع خلايا، في كل منها نصف عدد الكروموسومات.", "a": "vdd94559fe83e"}], "figs": ["f56a", "f57a"], "key": "الانقسام المنصّف ينتج أربع خلايا جنسية، في كل منها نصف عدد كروموسومات الخلية الأصلية.", "sa": "v37faa09d9eea"}, {"id": "L06-s12", "page": 57, "title": "المقارنةُ بينَ الانقسامِ المتساوي والانقسامِ المنصِّفِ", "book": "الانقسامُ المتساوِي يشبهُ نوعًا مَا الانقسامَ المنصِّفَ. وكلاهما يبدأُ في النواةِ، وبعدَ مضاعفةِ الكروموسوماتِ تكونُ الخلايا في كِلا الانقسامينِ أكثرَ منَ الخلايا الأصليةِ.\nومعَ ذلكَ، فهناكَ فروقٌ واضحةٌ بينَ نوعَي الانقسامِ. وأكثرُ الفروقِ أهميةً أنَّ الخلايا الناتجةَ عنْ الانقسامِ المتساوِي تحتوِي علَى العددِ نفسِه منْ كروموسوماتِ الخليةِ الأصليةِ. أمَّا في الانقسامِ المنصِّفِ فتحتوِي الخليةُ الناتجةُ على نصفِ العددِ الأصليِّ منَ الكروموسوماتِ. ولكي يتحقّقَ ذلكَ يحدثُ انقسامانِ في الانقسامِ المنصِّفِ، بينما يحدث انقسامٌ واحدٌ في الانقسامِ المتساوِي. ومنْ ذلكَ أيضًا أنَّ عددَ الخلايَا الناتجةِ في الانقسامِ المتساوِي خليتانِ جديدتانِ، في حينِ يكونُ في الانقسامِ المنصّفِ أربعُ خلايا جديدةٍ.", "simple": "الانقسامان يبدآن في النواة، وتتضاعف فيهما الكروموسومات أولًا. المتساوي: انقسام واحد، خليتان، العدد نفسه من الكروموسومات. المنصّف: انقسامان، أربع خلايا، نصف العدد.", "steps": [{"q": "فيمَ يتشابهان؟", "t": "كلاهما يبدأ في النواة، وبعد مضاعفة الكروموسومات تصبح الخلايا أكثر من الأصلية.", "a": "va6fe5e6f9a0a"}, {"q": "الفرق الأهم", "t": "المتساوي: العدد نفسه من الكروموسومات. المنصّف: نصف العدد.", "a": "v457034fa98d7"}, {"q": "كم انقسامًا؟", "t": "المتساوي انقسام واحد، والمنصّف انقسامان.", "a": "vd664a5a88420"}, {"q": "كم خلية تنتج؟", "t": "المتساوي خليتان جديدتان، والمنصّف أربع خلايا جديدة.", "a": "v17bf276fa11e"}, {"q": "الفكرة المهمة", "t": "تذكّر: متساوي = ١ انقسام، ٢ خلية، العدد كامل. منصّف = ٢ انقسام، ٤ خلايا، نصف العدد.", "a": "vc6a29270022d"}], "figs": [], "key": "الفرق الأهم: خلايا المتساوي فيها العدد نفسه من الكروموسومات، وخلايا المنصّف فيها نصفه.", "sa": "v03692a7bddd8"}, {"id": "L06-s13", "page": 57, "title": "نَشاطٌ: الانقسامُ المُتساوي", "book": "١ أتفحّصُ مجموعةَ صورٍ مختلفةٍ لأطوارِ الانقسامِ المُتَساوِي. وأستعملُ الرسومَ التي رسمتُها في نشاطِ أستكشفُ إنْ وجدتْ.\n٢ أقارنُ. أدقّقُ جيدًا في كلِّ صورةٍ آخذًا في الاعتبارِ أطوارَ الانقسامِ المُتساوِي. فإذا كانت الصورُ منَ الطورِ نفسِه أضعُها معًا.\n٣ أصنفُ ما المجموعةُ التي تنتمي إليها كلُّ صورةٍ؟ أضعُ الصورَ في فئاتِ المجموعاتِ المناسبةِ، وأكونُ مستعدًّا لتوضيحِ ذلكَ.\n٤ أفسّرُ البياناتِ. أعملُ ضمنَ مجموعةٍ منْ زملائي لترتيبِ الصورِ بحسبِ أطوارِها. وأكتبُ تعريفَ كلِّ طورٍ، وشروحاتٍ عنهُ، مَعَ رسمٍ توضيحيٍّ.", "simple": "نتفحص صورًا لأطوار الانقسام المتساوي. نجمع الصور المتشابهة، ثم نصنّفها ونرتّبها. ثم نكتب تعريف كل طور مع رسم.", "steps": [{"q": "ماذا أرى؟", "t": "طالب يرتّب بطاقات عليها رسوم خلايا.", "fig": "f57b", "a": "v7d0b6d49b672"}, {"q": "ماذا أفعل؟", "t": "أتفحص صور أطوار الانقسام المتساوي، وأستعمل رسومي من نشاط أستكشف.", "a": "vb31ba8567ee8"}, {"q": "كيف أجمعها؟", "t": "أضع الصور التي من الطور نفسه معًا، وأصنّفها في مجموعات.", "a": "v2489acbbab56"}, {"q": "كيف أرتّبها؟", "t": "أرتّبها بحسب خطوات الانقسام المتساوي الخمس في الشكل.", "fig": "f55a", "a": "v965eec47d545"}, {"q": "الفكرة المهمة", "t": "موقع الكروموسومات وشكل النواة يدلّان على الطور.", "a": "v94ea6c12611c"}], "figs": ["f57b", "f55a"], "key": "يمكن تصنيف صور الانقسام المتساوي وترتيبها بحسب أطوارها.", "sa": "v1ecee6d1ee58"}, {"id": "L06-s14", "page": 58, "title": "ما مدّةُ الحياةِ؟", "book": "كما يوجدُ للخليةِ دورةُ حياةٍ، فإنَّ المخلوقاتِ الحيةَ لها دوراتُ نموٍّ وتكاثرٍ، ثمَّ تموتُ. ومراحلُ نموِّ المخلوقِ الحيِّ تكوّنُ دورةَ حياتِه. وتشتملُ دورةُ حياةِ الحيوانِ على الولادةِ والنضجِ والتكاثرِ والهرمِ والموتِ. يقول تعالى: ﴿ وَقَدْ خَلَقَكُمْ أَطْوَارًا ﴿١٤﴾ ﴾ نوح. وأطولُ فترةٍ زمنيةٍ يعيشُها المخلوقُ في أفضلِ الظروفِ تُسمَّى مدةَ الحياةِ. ومدةُ حياةِ المخلوقِ الحيِّ صفةٌ مشتركةٌ بينَ أفرادِ نوعِه. ومن ذلكَ مثلًا أنَّ النباتاتِ الحوليةَ نباتاتٌ زهريةٌ مدّةُ حياتِها سنةٌ تقريبًا. ونباتَ الصنوبرِ ذو المخاريطِ الشوكيةِ لهُ مدةُ حياةٍ أكثرُ من ٧٠٠٠ سنةٍ.\nوالعمرُ المتوقَّعُ له هو مقدارُ الزمنِ الذي سيعيشُه المخلوقُ الحيُّ. ويختلفُ مقدارُ العمرِ المتوقعِ للمخلوقِ الحيِّ اعتمادًا على الظروفِ التي يعيشُها.\nوتؤثرُ الظروفُ البيئيةُ في العمرِ المتوقعِ، ومنها توافرُ كميةِ الغذاءِ والماءِ. لكنَّ هذهِ العواملَ لا تؤثرُ في مدةِ الحياةِ. ومثالُ ذلكَ، فإن متوسطَ العمرِ للناسِ في المملكةِ العربيَّةِ السُّعوديَّةِ حوالي ٧٣ سنةً، ولكنَّ مدةَ الحياةِ التي قدْ يعيشُها الإنسانُ لا يعلمها إلا الله، فقدْ تمتدُّ إلى أكثرَ منْ ١٠٠ سنةٍ. يقول تعالى: ﴿ وَلِكُلِّ أُمَّةٍ أَجَلٌ فَإِذَا جَآءَ أَجَلُهُمْ لَا يَسْتَأْخِرُونَ سَاعَةً وَلَا يَسْتَقْدِمُونَ ﴿٣٤﴾ ﴾ الأعراف.\nالعمرُ المتوقعُ ومدةُ الحياةِ (جدول):\nالمخلوقُ الحيُّ | معدلُ العمرِ المتوقعُ | أطولُ مدةِ حياةٍ\nذبابةُ المنزلِ | ١٥-٣٠ يومًا | ٧٢ يومًا\nالكلبُ | ١٢ سنةً | ٢٩ سنةً\nالقطُّ | ١٥ سنةً | ٣٤ سنةً\nالدلفينُ | ٢٠ سنةً | ٥٠ سنةً\nالحصانُ | ٢٥ سنةً | ٦٢ سنةً\nالسلحفاةُ | ١٠٠ سنةً | أكثرُ منْ ١٠٠ سنةٍ\nقصبُ السكرِ | ١٠٠ سنةٍ | ٢٥٠ سنةً\nالصنوبرُ ذو المخاريطِ الشوكيةِ | حتى ٧٠٠٠ سنةٍ | إذ يقدر عمرها بأربعة آلاف وسبعمائة عاما", "simple": "للمخلوق الحي دورة حياة: ولادة، ثم نضج، ثم تكاثر، ثم هرم، ثم موت. مدة الحياة: أطول زمن يعيشه المخلوق في أفضل الظروف، وهي صفة مشتركة في نوعه. العمر المتوقع: الزمن الذي سيعيشه، ويتأثر بالظروف مثل الغذاء والماء.", "steps": [{"q": "ماذا أرى؟", "t": "سلحفاة عملاقة تعيش طويلًا، وجدولًا لأعمار مخلوقات مختلفة.", "fig": "f58a", "a": "v5763ed0ec871"}, {"q": "ما دورة حياة الحيوان؟", "t": "الولادة، والنضج، والتكاثر، والهرم، والموت.", "a": "v841cab12c85a"}, {"q": "ما مدة الحياة؟", "t": "أطول فترة يعيشها المخلوق في أفضل الظروف، وهي مشتركة بين أفراد نوعه.", "a": "v2361588b7cf1"}, {"q": "ما العمر المتوقع؟", "t": "مقدار الزمن الذي سيعيشه المخلوق، ويختلف بحسب ظروفه.", "a": "v19ff171dd1aa"}, {"q": "ما الفرق بينهما؟", "t": "الغذاء والماء يؤثران في العمر المتوقع، ولا يؤثران في مدة الحياة.", "fig": "f58c", "a": "vb55b2ec477e0"}, {"q": "الفكرة المهمة", "t": "الأعمار بيد الله: متوسط العمر في المملكة حوالي ٧٣ سنة، وقد تمتد الحياة أكثر من ١٠٠ سنة.", "a": "vaf895b3ca748"}], "figs": ["f58a", "f58b", "f58c"], "key": "مدة الحياة أطول زمن يعيشه المخلوق في أفضل الظروف، والعمر المتوقع يتأثر بالظروف.", "sa": "v74145d6155b3"}, {"id": "L06-s15", "page": 59, "title": "مراجعةُ الدرسِ: ملخّصٌ مصوّرٌ", "book": "تتضمّنُ دورةُ الخليةِ نموَّ الخليةِ وانقسامَها.\nالانقسامُ المتساوي عمليةٌ تنقسمُ فيها الخليةُ لتنتجَ خليتانِ متماثلتانِ.\nالانقسامُ المنصِّفُ عمليةٌ ينتجُ عنها أربعُ خلايا، كلُّ خليةٍ تحتوي على نصفِ عددِ الكروموسوماتِ في الخليةِ الأصليةِ.\nالمَطْوِيّاتُ أنظّمُ أفكاري: أعملُ مطويّةً كالمبيَّنةِ في الشكلِ ألخّصُ فيها ما تعلَّمتُه حولَ انقسامِ الخليةِ.\nالأفكارُ الرئيسةُ | ماذا تعلّمتُ؟ | رسوم\nدورةُ الخليةِ |  | \nالانقسامُ المتساوي |  | \nالإنقسامُ المنصفُ |  | ", "simple": "الدرس في ثلاث أفكار: دورة الخلية نمو وانقسام. الانقسام المتساوي ينتج خليتين متماثلتين. الانقسام المنصّف ينتج أربع خلايا بنصف عدد الكروموسومات.", "steps": [{"q": "الفكرة ١", "t": "دورة الخلية تتضمن نمو الخلية وانقسامها.", "fig": "f59a", "a": "v13cb37799335"}, {"q": "الفكرة ٢", "t": "الانقسام المتساوي ينتج خليتين متماثلتين.", "fig": "f59b", "a": "v39dd11e70dc1"}, {"q": "الفكرة ٣", "t": "الانقسام المنصّف ينتج أربع خلايا، في كل منها نصف عدد الكروموسومات.", "fig": "f59c", "a": "v9cef65ed3d08"}, {"q": "ماذا أفعل الآن؟", "t": "أعمل مطوية من ثلاثة صفوف، وأكتب في كل صف ما تعلمته وأرسم.", "fig": "f59d", "a": "vcfdc3aaa4fbb"}], "figs": ["f59a", "f59b", "f59c", "f59d"], "key": "دورة الخلية نمو وانقسام، والانقسام نوعان: متساوٍ ومنصّف.", "sa": "v2d655022229f"}], "questions": [{"id": "L06-q1", "page": 48, "section": "الفكرةُ العامّةُ", "type": "open", "text": "كيف تَنقُلُ المخلوقاتُ الحيةُ الصفاتِ إلى أبنائِها؟", "answerText": "بالوراثة: تنتقل الصفات الموروثة من الآباء إلى الأبناء. فالمشيج المذكر والمشيج المؤنث فيهما كروموسومات، ويتحدان فتنتقل إلى الابن كروموسومات وصفات من الأبوين.", "what": "يسألك: بأي طريقة تصل صفات الآباء إلى الأبناء؟", "hint": "ابحث عن معنى كلمة «الوراثة» في مفردات ص٤٩، ثم آخر فقرة في ص٥٦.", "explain": "الوراثة هي انتقال الصفات الموروثة من الآباء إلى الأبناء. وفي ص٥٦: يتحد المشيجان فتنتقل إلى الابن كروموسومات وصفات وراثية من الأبوين.", "solve": ["الصفات تنتقل بالوراثة.", "كل من الأب والأم يُنتج مشيجًا فيه نصف الكروموسومات.", "يتحد المشيجان فيأخذ الابن كروموسومات وصفات من الأبوين."], "keys": [{"t": "بالوراثة", "alts": ["الوراثه", "وراثة", "وراثه"]}, {"t": "عن طريق الكروموسومات في الأمشاج", "alts": ["كروموسوم", "مشيج", "امشاج"]}], "back": "L06-s11", "fig": null, "evp": 56, "oos": null, "left": [], "right": [], "items": []}, {"id": "L06-q2", "page": 48, "section": "الأسئلةُ الأساسيةُ", "type": "open", "text": "الدرسُ الأولُ: كيفَ تُنتجُ الخليةُ خلايا جديدةً؟", "answerText": "بالانقسام: تنمو الخلية ثم تنقسم (دورة الخلية). في الانقسام المتساوي تتضاعف الكروموسومات ثم تنقسم الخلية إلى خليتين متماثلتين.", "what": "يسألك: كيف يزيد عدد الخلايا؟", "hint": "تذكّر دورة الخلية في ص٥٢ والانقسام المتساوي في ص٥٤.", "explain": "دورة الخلية نمو ثم انقسام. وفي الانقسام المتساوي تضاعف الخلية كروموسوماتها ثم تنقسم إلى خليتين متماثلتين.", "solve": ["الخلية تنمو أولًا.", "تتضاعف الكروموسومات.", "تنقسم الخلية إلى خليتين جديدتين."], "keys": [{"t": "بانقسام الخلية", "alts": ["انقسام", "تنقسم"]}, {"t": "تتضاعف الكروموسومات ثم تنتج خليتان", "alts": ["تتضاعف", "تضاعف", "خليتين", "خليتان"]}], "back": "L06-s5", "fig": null, "evp": 54, "oos": null, "left": [], "right": [], "items": []}, {"id": "L06-q3", "page": 48, "section": "الأسئلةُ الأساسيةُ", "type": "open", "text": "الدرسُ الثاني: كيفَ تنتقلُ الصفاتُ منَ الآباءِ إلى الأبناءِ؟", "answerText": "بالوراثة؛ أي انتقال الصفات الموروثة من الآباء إلى الأبناء. وتفصيله في الدرس الثاني.", "what": "يسألك عن طريقة انتقال الصفات بين الأجيال.", "hint": "انظر مفردة «الوراثة» في ص٤٩.", "explain": "الوراثة: انتقال الصفات الموروثة من الآباء إلى الأبناء (ص٤٩). وهذا سؤال الدرس الثاني، وسيُشرح هناك.", "solve": ["اقرأ مفردة الوراثة.", "الصفات الموروثة تنتقل من الآباء إلى الأبناء."], "keys": [{"t": "بالوراثة", "alts": ["الوراثه", "وراثة", "وراثه"]}], "back": "L06-s2", "fig": null, "evp": 49, "oos": null, "left": [], "right": [], "items": []}, {"id": "L06-q4", "page": 50, "section": "أنظرُ وأتساءلُ", "type": "open", "text": "فكيفَ تنمو خليةٌ واحدةٌ لتصبحَ ضفدعًا مكتملَ النموِّ؟", "answerText": "تنمو الخلية ثم تنقسم، وتنمو الخلايا الجديدة وتنقسم مرات كثيرة، فيزيد عدد الخلايا حتى يتكوّن جسم الضفدع.", "what": "يسألك: كيف تتحول خلية واحدة إلى ضفدع كامل؟", "hint": "الخلية لا تكبر بلا حدود. ماذا تفعل بعد أن تنمو؟ راجع دورة الخلية ص٥٢.", "explain": "للخلية حد أعلى للحجم، فلا يكبر الضفدع بكِبَر خلية واحدة. بل تنقسم الخلايا في دورة الخلية مرات كثيرة فيزيد عددها.", "solve": ["الخلية تنمو حتى حد معين.", "ثم تنقسم إلى خليتين.", "تتكرر دورة الخلية فيزيد عدد الخلايا كثيرًا."], "keys": [{"t": "تنقسم الخلية", "alts": ["تنقسم", "انقسام"]}, {"t": "يزيد عدد الخلايا", "alts": ["عدد", "تزيد", "يزداد", "خلايا كثيرة"]}], "back": "L06-s5", "fig": "f50a", "evp": 52, "oos": null, "left": [], "right": [], "items": []}, {"id": "L06-q5", "page": 51, "section": "أستكشفُ: الخطواتُ", "type": "open", "text": "ألاحظُ. أفحصُ الشريحةَ الأولى بقوةِ التكبيرِ الصغرَى للمجهرِ المركبِ، وأستخدمُ الضابطَ الكبيرَ لرؤيةِ الخلايا بصورةٍ واضحةٍ. وأستخدمُ الضابطَ الصغيرَ لجعلِ الرؤيةِ أكثرَ وضوحًا. أكرِّرُ ما قمتُ به مستخدمًا قوةَ تكبيرٍ أكبرَ. أسجّلُ التفاصيلَ التي ألاحظُها، وأرسمُ عيناتٍ من الخلايا التي شاهدتُها على بطاقاتِ الفهرسةِ. وأكرِّرُ هذه العمليةَ لكلِّ شريحةٍ.", "answerText": "أرى خلايا في مراحل مختلفة من الانقسام: بعضها نواته واضحة، وبعضها كروموسوماته ظاهرة أو مصطفة أو متباعدة، وبعضها انقسم إلى خليتين.", "what": "المطلوب أن تلاحظ الخلايا بالمجهر وترسمها.", "hint": "انظر إلى شكل الكروموسومات وموقعها في كل خلية، وقارن بشكل ص٥٥.", "explain": "الشرائح تبيّن خلايا في مراحل مختلفة من الانقسام الخلوي، كما في شكل الانقسام المتساوي ص٥٥.", "solve": ["أبدأ بالتكبير الصغير والضابط الكبير.", "أوضح الصورة بالضابط الصغير ثم بتكبير أكبر.", "أرسم ما أراه على بطاقة لكل شريحة."], "keys": [{"t": "خلايا في مراحل مختلفة من الانقسام", "alts": ["مراحل", "انقسام", "كروموسوم"]}], "back": "L06-s4", "fig": "f51b", "evp": 55, "oos": null, "left": [], "right": [], "items": []}, {"id": "L06-q6", "page": 51, "section": "أستكشفُ: الخطواتُ", "type": "open", "text": "أتواصلُ. أقارنُ ما رسمْتُه برسومِ زملائي في الصفِّ. أحدِّدُ أيَّ الخلايا تبدو في المرحلةِ نفسِها منَ الانقسامِ، وأيُّها يمرُّ بمراحلَ مختلفةٍ، وأناقشُ ذلكَ معَ أحدِ زملائي.", "answerText": "الخلايا التي يتشابه فيها شكل الكروموسومات وموقعها تكون في المرحلة نفسها، والتي تختلف تكون في مراحل مختلفة.", "what": "المطلوب أن تميّز الخلايا المتشابهة في مرحلة الانقسام من المختلفة.", "hint": "قارن موقع الكروموسومات: في النواة؟ في الوسط؟ عند الطرفين؟", "explain": "مراحل الانقسام المتساوي تختلف في شكل النواة وموقع الكروموسومات (ص٥٥).", "solve": ["أنظر إلى النواة والكروموسومات في كل رسم.", "أضع المتشابه معًا.", "المختلف يكون في مرحلة أخرى."], "keys": [{"t": "المرحلة نفسها إذا تشابه شكل الكروموسومات وموقعها", "alts": ["موقع", "شكل", "تتشابه", "متشابهة"]}], "back": "L06-s10", "fig": "f55a", "evp": 55, "oos": null, "left": [], "right": [], "items": []}, {"id": "L06-q7", "page": 51, "section": "أستكشفُ: الخطواتُ", "type": "open", "text": "أصنّفُ. أحذرُ عندما أقصُّ أشكالَ الخلايا التي رسمتُهَا، وأجمعُ الأشكالَ التي تمرُّ بمرحلةِ الانقسامِ نفْسِها في مجموعةٍ واحدةٍ، ثم أقارنُ رسومي برسومِ زملائي في الصفِّ. أُقررُ معَ زملائي في الصفِّ عددَ مجموعاتِ الصورِ التي تمثلُ مراحلَ الانقسامِ.", "answerText": "خمس مجموعات، بعدد خطوات الانقسام المتساوي في الكتاب.", "what": "المطلوب: كم مجموعة تمثل مراحل الانقسام؟", "hint": "عُدّ الخطوات في شكل «الانقسام المتساوي» ص٥٥.", "explain": "شكل الكتاب يقسم الانقسام المتساوي إلى خمس خطوات، فتكون الرسوم خمس مجموعات تقريبًا.", "solve": ["أجمع كل الرسوم المتشابهة معًا.", "أقارن بخطوات شكل ص٥٥.", "أعدّ المجموعات: خمس."], "keys": [{"t": "خمس مجموعات", "alts": ["خمس", "5", "٥", "خمسة"]}], "back": "L06-s10", "fig": "f55a", "evp": 55, "oos": null, "left": [], "right": [], "items": []}, {"id": "L06-q8", "page": 51, "section": "أستخلصُ النتائجَ", "type": "order", "text": "أختارُ رسمًا يمثلُ كلَّ مرحلةٍ منْ مراحلِ الانقسامِ وألصقُها بالتسلسلِ علَى لوحةٍ كرتونيةٍ؛ لعملِ مخططٍ يبيِّنُ مراحلَ الانقسامِ، وأحتفظُ بالمخططِ لاستخدامِه مرجعًا خلالَ هذَا الدرسِ.", "answerText": "النواة واضحة وتتضاعف الكروموسومات ← تظهر الكروموسومات ويتلاشى غلاف النواة ← تصطف في الوسط ← تنفصل إلى الطرفين ← يتكوّن غلافان نوويان وتنتج خليتان.", "what": "المطلوب ترتيب مراحل الانقسام من الأولى إلى الأخيرة.", "hint": "استعمل ترتيب الخطوات ١–٥ في شكل ص٥٥.", "explain": "هذا هو ترتيب الكتاب لخطوات الانقسام المتساوي في ص٥٥.", "solve": ["أبدأ بالخلية ذات النواة الواضحة.", "ثم الكروموسومات الظاهرة، ثم المصطفة في الوسط.", "ثم المنفصلة، ثم الخليتان الجديدتان."], "keys": [], "back": "L06-s10", "fig": "f55a", "evp": 55, "oos": null, "left": [], "right": [], "items": ["تشاهَد النواة بوضوح ويتضاعف عدد الكروموسومات", "تصبح الكروموسومات مرئية ويبدأ غلاف النواة في التلاشي", "تصطف الكروموسومات المتضاعفة عند وسط الخلية", "تنفصل الكروموسومات وتتحرك في اتجاهين متضادين", "يتكوّن غلاف نووي حول كل مجموعة وتنتج خليتان"], "shuffled": [4, 2, 0, 3, 1]}, {"id": "L06-q9", "page": 51, "section": "أستكشفُ أكثرَ", "type": "open", "text": "هلْ يمكنُ ملاحظةُ المراحلِ نفسِها في الخلايَا النباتيةِ والخلايَا الحيوانيةِ؟ تُرَى، في أيِّ أجزاءِ النباتِ تحدثُ؟ أصمِّمُ استقصاءً لاختبارِ توقُّعي. وأجرِّبُ ذلكَ، وأشاركُ زملاءَ صفِّي في النتائجِ.", "answerText": "نعم؛ الخلايا النباتية والحيوانية كلتاهما تمر بالانقسام المتساوي. والفرق في النهاية: في النبات صفيحة خلوية، وفي الحيوان يضيق الغشاء البلازمي. أما مكانه في النبات فأختبره بنفسي بفحص شرائح من أجزاء النبات بالمجهر.", "what": "يسألك: هل المراحل نفسها في النبات والحيوان؟ ثم تصمم تجربة.", "hint": "اقرأ فقرة «وتمرّ الخلايا النباتية والخلايا الحيوانية…» في ص٥٥.", "explain": "الكتاب يقول إن الخلايا النباتية والحيوانية تمر بالانقسام المتساوي، ويختلف الانفصال بسبب الجدار الخلوي في النبات.", "solve": ["الكتاب: النبات والحيوان يمران بالانقسام المتساوي.", "الفرق: صفيحة خلوية في النبات، وتضيّق الغشاء في الحيوان.", "أصمم استقصاء: أفحص شرائح من أجزاء نبات وخلايا حيوان وأقارن."], "keys": [{"t": "نعم، تمر الخلايا النباتية والحيوانية بالانقسام المتساوي", "alts": ["نعم", "تمر", "النباتية والحيوانية"]}, {"t": "الفرق: صفيحة خلوية في النبات", "alts": ["صفيحة", "جدار"]}], "back": "L06-s9", "fig": null, "evp": 55, "oos": null, "left": [], "right": [], "items": []}, {"id": "L06-q10", "page": 53, "section": "أختبرُ نفسي", "type": "order", "text": "أتتبَّعُ. أكتبُ مراحلَ دورةِ حياةِ الخليةِ.", "answerText": "نمو الخلية ← التهيؤ للانقسام ← انقسام الخلية، ثم تعود الخلايا الجديدة إلى النمو.", "what": "المطلوب أن تكتب مراحل دورة الخلية بالترتيب.", "hint": "انظر إلى شكل دورة الخلية في ص٥٢ واتبع السهم.", "explain": "شكل ص٥٢ يبيّن: نمو الخلية، ثم التهيؤ للانقسام، ثم انقسام الخلية. والعملية مستمرة.", "solve": ["أبدأ من الخلية الصغيرة: تنمو.", "تتهيأ للانقسام.", "تنقسم إلى خليتين، ثم تتكرر الدورة."], "keys": [], "back": "L06-s5", "fig": "f52a", "evp": 52, "oos": null, "left": [], "right": [], "items": ["نموُّ الخليةِ", "التهيؤُ للانقسامِ", "انقسامُ الخليةِ"], "shuffled": [2, 0, 1]}, {"id": "L06-q11", "page": 53, "section": "أختبرُ نفسي", "type": "critical", "text": "التفكيرُ الناقدُ. أيُّ الخليَّتين يمكنُ أنْ ينموَ حجمُها أكبرَ: الخليةُ المنبسطةُ أمِ الخليةُ المكعبةُ الشكلِ؟ أوضّحُ إجابتي.", "answerText": "الخلية المنبسطة؛ لأن مساحة غشائها البلازمي كبيرة بالنسبة إلى حجمها، فتبقى قادرة على تبادل المواد وهي تكبر.", "what": "يسألك: أي شكل للخلية يسمح لها أن تكبر أكثر، ولماذا؟", "hint": "تذكّر ما يحدد حجم الخلية: النسبة بين مساحة الغشاء البلازمي وحجمها (ص٥٣).", "explain": "الخلية تتوقف عن النمو عندما لا تكفي مساحة غشائها لحجمها. الخلية المنبسطة لها مساحة كبيرة مقارنة بحجمها، فيتأخر وصولها إلى هذا الحد.", "solve": ["الدليل: كل المواد تمر عبر الغشاء البلازمي، والخلية تتوقف عندما لا تكفي مساحته.", "التفكير: الشكل المنبسط له سطح كبير مقارنة بحجمه، والمكعب سطحه أقل مقارنة بحجمه.", "الاستنتاج: الخلية المنبسطة يمكن أن تنمو أكبر."], "keys": [{"t": "الخلية المنبسطة", "alts": ["المنبسطة", "المنبسطه", "منبسطة"]}, {"t": "مساحة غشائها كبيرة بالنسبة إلى حجمها", "alts": ["مساحة", "الغشاء", "سطح"]}], "back": "L06-s6", "fig": null, "evp": 53, "oos": null, "left": [], "right": [], "items": []}, {"id": "L06-q12", "page": 55, "section": "أقرأُ الشكلَ", "type": "short", "text": "ماذَا يحدثُ للكروموسوماتِ في المرحلةِ الأخيرةِ منْ مراحلِ الانقسامِ المتَساوِي؟ إرشادٌ أقا ليتان"]}, {"t": "المنصّف: أربع خلايا بنصف العدد", "alts": ["المنصف", "أربع", "اربع", "نصف"]}], "back": "L06-s12", "fig": null, "evp": 57, "oos": null, "left": [], "right": [], "items": []}, {"id": "L06-q30", "page": 59, "section": "المَطْوِيّاتُ أنظّمُ أفكاري", "type": "open", "text": "أعملُ مطويّةً كالمبيَّنةِ في الشكلِ ألخّصُ فيها ما تعلَّمتُه حولَ انقسامِ الخليةِ.", "answerText": "دورة الخلية: نمو ثم انقسام (أرسم دائرة). الانقسام المتساوي: خلية ← خليتان متماثلتان بالعدد نفسه. الانقسام المنصّف: انقسامان ← أربع خلايا جنسية بنصف العدد.", "what": "المطلوب أن تلخص الدرس في جدول من ثلاثة صفوف.", "hint": "استعمل جمل الملخص المصوّر في ص٥٩.", "explain": "الصفوف الثلاثة هي أفكار الدرس الرئيسة: دورة الخلية، والانقسام المتساوي، والانقسام المنصّف.", "solve": ["أكتب في كل صف ماذا تعلمت.", "أرسم شكلًا صغيرًا لكل فكرة."], "keys": [{"t": "دورة الخلية: نمو وانقسام", "alts": ["نمو", "دورة"]}, {"t": "المتساوي: خليتان متماثلتان", "alts": ["خليتان", "خليتين", "متماثلتان"]}, {"t": "المنصّف: أربع خلايا بنصف العدد", "alts": ["أربع", "اربع", "نصف"]}], "back": "L06-s15", "fig": "f59d", "evp": 59, "oos": null, "left": [], "right": [], "items": []}, {"id": "L06-q31", "page": 59, "section": "العُلومُ وَالرِّياضِيّاتُ: أحسبُ نموَّ الخليةِ", "type": "short", "text": "يُنتجُ جسمُ الإنسانِ ٢,٣ مليون خلية دم حمراءَ تقريبًا كلَّ ثانيةٍ. ما عددُ خلايا الدمِ التي ينتجُها في دقيقةٍ واحدةٍ؟", "answerText": "١٣٨ مليون خلية دم حمراء تقريبًا.", "what": "يسألك: كم خلية في ٦٠ ثانية؟", "hint": "الدقيقة = ٦٠ ثانية. اضرب.", "explain": "في كل ثانية ٢٫٣ مليون خلية، والدقيقة ٦٠ ثانية، فنضرب: ٢٫٣ × ٦٠ = ١٣٨ مليون.", "solve": ["الدقيقة = ٦٠ ثانية.", "٢٫٣ مليون × ٦٠.", "= ١٣٨ مليون خلية."], "keys": [{"t": "١٣٨ مليون خلية", "alts": ["138", "١٣٨"]}], "back": "L06-s15", "fig": null, "evp": 59, "oos": null, "left": [], "right": [], "items": []}, {"id": "L06-q32", "page": 59, "section": "العُلومُ والمُجتمعُ: أبحثُ في العمرِ المتوقَّعِ", "type": "open", "text": "أبحثُ كيفَ تغيرَ متوسطُ العمرِ المتوقَّعِ للإنسانِ في المملكةِ العربيةِ السعوديةِ قديمًا وحديثًا، وما سببُ هذا التغيرِ؟", "answerText": "الكتاب يذكر أن متوسط العمر اليوم في المملكة حوالي ٧٣ سنة، وأن العمر المتوقع يتأثر بالظروف مثل توافر الغذاء والماء. فإذا تحسّنت الظروف زاد العمر المتوقع.", "what": "المطلوب بحث صغير: كيف تغيّر متوسط العمر، ولماذا؟", "hint": "ابدأ بما في ص٥٨: ٧٣ سنة، وتأثير الظروف.", "explain": "العمر المتوقع يعتمد على الظروف التي يعيشها الإنسان، فتحسّن الظروف يغيّره.", "solve": ["أبدأ من الكتاب: حوالي ٧٣ سنة اليوم.", "أبحث عن الرقم القديم مع ولي أمري.", "السبب: تغيّر الظروف مثل الغذاء والماء."], "keys": [{"t": "متوسط العمر اليوم حوالي ٧٣ سنة", "alts": ["73", "٧٣"]}, {"t": "السبب: تحسّن الظروف", "alts": ["ظروف", "الغذاء", "الماء", "تحسن"]}], "back": "L06-s14", "fig": null, "evp": 58, "oos": "الأرقام القديمة غير موجودة في الكتاب؛ تحتاج بحثًا خارجه", "left": [], "right": [], "items": []}]}, {"id": "L07", "unit": "الوحدة الأولى: تنوّع الحياة", "chapter": "الفصل الثاني: الخلية والوراثة", "name": "قراءة علمية: السرطان خلل في دورة الخلية", "pages": [60, 61], "note": "قراءة إثرائية بعد الدرس الأول؛ عنوانها في الكتاب: «السرطانُ: خَلَلٌ في دورةِ الخليةِ».", "sections": [{"id": "L07-s1", "page": 60, "title": "السرطانُ: خَلَلٌ في دورةِ الخليةِ", "book": "وهبَ اللهُ للمخلوقاتِ الحيةِ القدرةَ على السيطرةِ على نموِّ خلاياهُ وانقسامِها؛ حيثُ تتحكّمُ مجموعةُ عواملَ في دورةِ الخليةِ. فالخليةُ تنمو وتنقسمُ وقدْ تتوقّفُ عن النموِّ وفقَ دورةٍ منتظمةٍ لا تؤثّرُ في سلامةِ الخلايا المجاورةِ.\nولكنْ قدْ يحدثُ خللٌ في السيطرةِ على العواملِ التي تتحكّمُ في دورةِ الخليةِ، فتمرُّ الخلايا بسلسلةٍ لا نهائيةٍ من الانقساماتِ تحدثُ بصورةٍ غيرِ منتظمةٍ. وقدْ يؤدِّي النموُّ السريعُ للخلايا إلى تكوُّنِ تجمّعاتٍ للخلايا تُسمّى الأورامَ السرطانيةَ. وهذه الأورامُ تحدثُ في أجسامِ العديدِ من المخلوقاتِ الحيةِ، ومنها الإنسانُ، وقدْ تهدِّدُ حياتَه.", "simple": "وهب الله المخلوقات القدرة على ضبط نمو خلاياها وانقسامها. فالخلية تنمو وتنقسم وتتوقف وفق دورة منتظمة. إذا حدث خلل في هذا الضبط، تنقسم الخلايا بلا نهاية وبلا نظام. فتتكوّن تجمعات اسمها الأورام السرطانية.", "steps": [{"q": "ماذا أرى؟", "t": "نسيج فيه طبقة منتظمة من الخلايا، وكتلة كبيرة غير منتظمة تنتفخ منها.", "fig": "f60a", "parts": [], "a": "v009c112ae752"}, {"q": "ما الأجزاء؟", "t": "خلايا طبيعية في صف منتظم، وخلايا سرطانية متكدّسة.", "fig": "f60a", "parts": ["p1", "p2"], "a": "v6501cf4346c0"}, {"q": "كيف تعمل الخلايا الطبيعية؟", "t": "تنمو وتنقسم وتتوقف وفق دورة منتظمة، ولا تضر الخلايا المجاورة.", "fig": "f60a", "parts": ["p1"], "a": "v422e6d5aabc4"}, {"q": "ماذا يحدث عند الخلل؟", "t": "تنقسم الخلايا انقسامات لا نهائية غير منتظمة، فتتكوّن الأورام السرطانية.", "fig": "f60a", "parts": ["p2"], "a": "v8ccdc18d6bb6"}, {"q": "الفكرة المهمة", "t": "السرطان خلل في السيطرة على العوامل التي تتحكم في دورة الخلية.", "a": "vb32e6c897f7d"}], "figs": ["f60a"], "key": "السرطان خلل في السيطرة على دورة الخلية، فتنقسم الخلايا بلا نظام وتتكوّن أورام.", "sa": "vec1ed1cebe10"}, {"id": "L07-s2", "page": 60, "title": "ما السرطانُ؟", "book": "ويمكنُ القولُ إنَّ السرطانَ مصطلحٌ يشملُ مجموعةً واسعةً منَ الأمراضِ تتميّزُ بنموِّ الخلايا وانقسامِها بشكلٍ غيرِ طبيعيٍّ، ولديْها القدرةُ على اختراقِ أنسجةِ الجسمِ وتدميرِ السليمِ منها. ويمكنُ للسرطانِ الانتشارُ في جميعِ أنحاءِ الجسمِ.\nأطلق اليونان تسميةَ السرطانِ على هذه الأمراضِ تشبيهًا لها بسرطانِ البحرِ ومقدرتهِ على التحركِ بسرعةٍ وفي جميعِ الاتجاهاتِ منْ دونِ أنْ يُحسَّ بهِ أحدٌ.", "simple": "السرطان ليس مرضًا واحدًا، بل مجموعة واسعة من الأمراض. تنمو فيها الخلايا وتنقسم بشكل غير طبيعي، وتخترق الأنسجة السليمة. وسُمّي بهذا الاسم تشبيهًا بسرطان البحر.", "steps": [{"q": "ما السرطان؟", "t": "مصطلح يشمل مجموعة واسعة من الأمراض.", "a": "v6b188e9193a2"}, {"q": "بماذا تتميز؟", "t": "بنمو الخلايا وانقسامها بشكل غير طبيعي.", "a": "v084a9ff97e35"}, {"q": "ماذا تفعل الخلايا السرطانية؟", "t": "تخترق أنسجة الجسم وتدمّر السليم منها، وقد تنتشر في الجسم كله.", "fig": "f60a", "parts": ["p2"], "a": "v74755d9aeeaf"}, {"q": "لماذا سُمّي سرطانًا؟", "t": "شبّهه اليونان بسرطان البحر الذي يتحرك بسرعة وفي كل اتجاه دون أن يُحسّ به أحد.", "a": "ve5543d89a1a1"}], "figs": ["f60a"], "key": "السرطان مجموعة أمراض تنمو فيها الخلايا بشكل غير طبيعي وتخترق الأنسجة السليمة.", "sa": "v7f60f24bd4fd"}, {"id": "L07-s3", "page": 61, "title": "أسبابُ السرطانِ", "book": "أمَّا عنْ أسبابِه فلا يوجدُ سببٌ محددٌ لحدوثِ خللٍ في انقسامِ الخلايا والإصابةِ بالسرطانِ، إلا أنَّ الأطباءَ لاحظوا زيادةً في عددِ المصابينَ بينَ الأشخاصِ الذين يتعرَّضونَ لعواملَ معينةٍ؛ مثلِ التدخينِ، والتلوّثِ، وتناولِ أنواعٍ معينةٍ منَ الموادِّ الغذائيةِ المعلبةِ بشكلٍ مستمرٍّ.\nوالأمراضُ السرطانيةُ في مُجملِها أمراضٌ غيرُ مُعديةٍ، وَلا تنتقِلُ مِنْ شخصٍ إلى آخرَ. وَلا يُوجدُ - حتى الآنَ - ما يُثبتُ أنَّها تنتقلُ بالوراثةِ.", "simple": "لا يوجد سبب محدد للسرطان. لكن الإصابة تزيد عند التعرض للتدخين والتلوث، وكثرة تناول بعض الأغذية المعلبة. والسرطان لا ينتقل بالعدوى من شخص إلى آخر.", "steps": [{"q": "هل له سبب محدد؟", "t": "لا يوجد سبب محدد لحدوث الخلل في انقسام الخلايا.", "a": "vd50b98d77a71"}, {"q": "ماذا لاحظ الأطباء؟", "t": "زيادة الإصابة عند من يتعرضون للتدخين، والتلوث، وتناول أنواع معينة من الأغذية المعلبة باستمرار.", "a": "v6e36718ae11e"}, {"q": "هل هو معدٍ؟", "t": "لا. الأمراض السرطانية في مجملها غير معدية، ولا تنتقل من شخص إلى آخر.", "a": "vccdab1e1b61e"}, {"q": "هل ينتقل بالوراثة؟", "t": "لا يوجد حتى الآن ما يثبت أنه ينتقل بالوراثة.", "a": "v515bde8fef17"}, {"q": "الفكرة المهمة", "t": "نبتعد عن التدخين والتلوث، ونقلل الأغذية المعلبة؛ حفاظًا على صحتنا.", "a": "vf089618ff06c"}], "figs": [], "key": "لا يوجد سبب محدد للسرطان، لكن التدخين والتلوث وبعض الأغذية المعلبة تزيد الإصابة.", "sa": "v5254f44604f0"}, {"id": "L07-s4", "page": 61, "title": "علاجُ السرطانِ", "book": "وعلى الرغمِ مِنْ أنَّ هذا المرضَ يُعدُّ مِنْ أكثرِ الأمراضِ المسبِّبةِ للوفاةِ إلا أنَّ احتمالاتِ الشفاءِ منهُ آخذةٌ في الازديادِ باستمرارٍ في معظمِ الأنواعِ؛ بفضلِ التقدّمِ في أساليبِ الكشفِ المبكِّرِ عنْ هذا المرضِ وأسبابِهِ.\nوقدْ أنشئتِ العديدُ منَ المراكزِ المتخصصةِ في الكشفِ عنْ هذا المرضِ وعلاجِهِ في العالَمِ، وفي المملكةِ العربيّةِ السُّعوديَّةِ تَنتشرُ العديدُ منَ المراكزِ المتقدمةِ لعلاجِ هذا المرضِ، ومِنْ أهمِّها مركزُ المَلكِ عبدُاللَّهِ للأورامِ وأمراضِ الكبدِ في مُستشفَى المَلكِ فيصلٍ التَّخصصيِّ ومركزِ الأبحاثِ الذي يُعدُّ أكبرَ مِرفقٍ طبّيٍّ لعلاجِ الأورامِ في منطقةِ الخليجِ العربيِّ.", "simple": "احتمالات الشفاء من السرطان تزيد باستمرار، بفضل الله ثم التقدم في الكشف المبكر. وفي المملكة مراكز متقدمة لعلاجه، أهمها مركز الملك عبدالله للأورام وأمراض الكبد.", "steps": [{"q": "هل الشفاء ممكن؟", "t": "نعم، احتمالات الشفاء تزداد باستمرار في معظم الأنواع.", "a": "v47eaa651c7ea"}, {"q": "لماذا تزداد؟", "t": "بفضل التقدم في أساليب الكشف المبكر عن المرض وأسبابه.", "a": "v17cda5c6e80c"}, {"q": "أين يُعالج؟", "t": "في مراكز متخصصة في العالم وفي المملكة العربية السعودية.", "a": "v3e12863877db"}, {"q": "ما أهم مركز في المملكة؟", "t": "مركز الملك عبدالله للأورام وأمراض الكبد في مستشفى الملك فيصل التخصصي ومركز الأبحاث.", "a": "vdcc7612f6871"}, {"q": "الفكرة المهمة", "t": "الكشف المبكر يزيد فرص الشفاء، والعلماء والأطباء يعملون لنفع الناس.", "a": "v35ed3ae0f847"}], "figs": [], "key": "الكشف المبكر يزيد احتمالات الشفاء من السرطان، وفي المملكة مراكز متقدمة لعلاجه.", "sa": "vc961cb4ee6cd"}, {"id": "L07-s5", "page": 61, "title": "السببُ والنتيجةُ", "book": "أفكّرُ في الأسبابِ التي تؤدّي إلى حدوثِ ظاهرةٍ أوْ حدثٍ ما.\nما الآثارُ الناتجةُ عنْ وقوعِ تلكَ الأسبابِ؟", "simple": "مهارة السبب والنتيجة: أسأل لماذا حدث الشيء؟ ثم أسأل ماذا نتج عنه؟ مثال: خلل في ضبط دورة الخلية (سبب) ← أورام سرطانية (نتيجة).", "steps": [{"q": "ما السبب؟", "t": "هو ما يؤدي إلى حدوث ظاهرة أو حدث.", "a": "vdca4aa56eb2b"}, {"q": "ما النتيجة؟", "t": "هي الأثر الذي ينتج عن وقوع السبب.", "a": "vbbc07a5dd0ec"}, {"q": "مثال من القراءة", "t": "خلل في السيطرة على دورة الخلية ← انقسامات غير منتظمة ← أورام سرطانية.", "a": "v710f59ee3f16"}], "figs": [], "key": "لكل نتيجة سبب؛ وفي السرطان: الخلل في ضبط الانقسام يسبب الأورام.", "sa": "v230100ac7296"}], "questions": [{"id": "L07-q1", "page": 61, "section": "أكتبُ عنْ: السببُ والنتيجةُ", "type": "explain", "text": "١. لماذا تكونُ انقساماتُ الخلايا وفقَ دورةٍ منتظمةٍ؟", "answerText": "لأن الله وهب المخلوقات القدرة على السيطرة على نمو خلاياها وانقسامها؛ إذ تتحكم مجموعة عوامل في دورة الخلية، فلا تتأثر سلامة الخلايا المجاورة.", "what": "يسألك عن سبب انتظام انقسام الخلايا.", "hint": "اقرأ الفقرة الأولى في ص٦٠.", "explain": "الكتاب: وهب الله المخلوقات القدرة على السيطرة على نمو خلاياها وانقسامها، وتتحكم مجموعة عوامل في دورة الخلية.", "solve": ["السبب: عوامل تتحكم في دورة الخلية، بقدرة وهبها الله.", "النتيجة: تنمو الخلية وتنقسم وتتوقف بنظام.", "فلا تتأثر الخلايا المجاورة."], "keys": [{"t": "تتحكم مجموعة عوامل في دورة الخلية", "alts": ["عوامل", "تتحكم", "السيطرة"]}, {"t": "قدرة وهبها الله للمخلوقات", "alts": ["الله", "وهب"]}], "back": "L07-s1", "fig": null, "evp": 60, "oos": null, "left": [], "right": [], "items": []}, {"id": "L07-q2", "page": 61, "section": "أكتبُ عنْ: السببُ والنتيجةُ", "type": "explain", "text": "٢. ما الذي يسببُ خللًا في السيطرةِ على انقسامِ الخليةِ؟", "answerText": "لا يوجد سبب محدد، لكن الأطباء لاحظوا زيادة الإصابة عند التعرض لعوامل مثل: التدخين، والتلوث، وتناول أنواع معينة من الأغذية المعلبة باستمرار.", "what": "يسألك عن أسباب الخلل في انقسام الخلية.", "hint": "اقرأ فقرة «أما عن أسبابه» في ص٦١.", "explain": "الكتاب: لا يوجد سبب محدد، إلا أن الأطباء لاحظوا زيادة المصابين بين من يتعرضون للتدخين والتلوث وبعض الأغذية المعلبة.", "solve": ["لا يوجد سبب محدد.", "لكن هناك عوامل تزيد الإصابة.", "وهي: التدخين، والتلوث، والأغذية المعلبة باستمرار."], "keys": [{"t": "لا يوجد سبب محدد", "alts": ["محدد", "لا يوجد"]}, {"t": "التدخين", "alts": ["التدخين", "تدخين"]}, {"t": "التلوث", "alts": ["التلوث", "تلوث"]}, {"t": "الأغذية المعلبة", "alts": ["معلبة", "المعلبة", "معلبه"]}], "back": "L07-s3", "fig": null, "evp": 61, "oos": null, "left": [], "right": [], "items": []}]}, {"id": "L08", "unit": "الوحدة الأولى: تنوّع الحياة", "chapter": "الفصل الثاني: الخلية والوراثة", "name": "الدرس الثاني: الوراثة والصفات", "pages": [62, 69], "note": "الصفحة ٦٩ مراجعة الدرس.", "sections": [{"id": "L08-s1", "page": 62, "title": "أنظرُ وأتساءلُ", "book": "صِغارُ الدِّببةِ في الصورةِ تُشْبِهُ أُمَّها. هلْ حدثَ ذلكَ مصادفةً، أَمِ أنَّ اللهَ تعالَى جعلَ الصفاتِ تنتقلُ منَ الآباءِ إلى الأَبناءِ؟", "simple": "الصغار في الصورة تشبه أمها. هذا ليس مصادفة. الله تعالى جعل الصفات تنتقل من الآباء إلى الأبناء. هذا ما سنتعلمه في درس الوراثة والصفات.", "steps": [{"q": "ماذا أرى؟", "t": "أرى دبة قطبية تمشي على الثلج ومعها صغيران.", "fig": "f62a", "parts": [], "a": "v65e92554d1e3"}, {"q": "كيف يرتبط بغيره؟", "t": "الصغيران يشبهان أمهما في الشكل واللون.", "a": "v515ee2ea7acf"}, {"q": "الفكرة المهمة", "t": "الصفات تنتقل من الآباء إلى الأبناء بتقدير الله تعالى.", "a": "vfaa41eb4d081"}], "figs": ["f62a"], "key": "الأبناء يشبهون آباءهم لأن الصفات تنتقل من الآباء إلى الأبناء.", "sa": "v102863b18224"}, {"id": "L08-s2", "page": 63, "title": "أستكشفُ: ما بعضُ الصِّفاتِ التي يَرِثُها الإنسانُ؟", "book": "لكلِّ شَخصٍ خواصُّ جسْميةٌ تميِّزُهُ. وعلى الرغمِ مِن ذلكَ هناكَ صفاتٌ عديدةٌ يشتركُ فيها الأشخاصُ المختلفونَ. فهلْ أتحلَّى بصفاتٍ مُشابهةٍ لصفاتِ أحدِ زُملائِي في الصَّفِّ؟ أتأمّلُ صفاتِ زُملائي، وأَستعملُ المَعلوماتِ التي حصلْتُ عليها لأعرفَ أيُّ الصّفاتِ أكثرُ ظُهورًا وتَكرارًا.\nأحتاجُ إلى: أوراقٍ بيضاءَ، أقلامِ رصاصٍ\n١ أَطلبُ إلى أحدِ زُملائي أَنْ يتأمَّلَني ليتعرَّفَ أيُّ الصِّفاتِ الظاهرةِ في الصُّورِ المقابلةِ موجودةٌ لديَّ، ثمَّ أُسجِّلُ الصِّفةَ التي أتَّصِفُ بها في جَدولٍ.\n٢ أتبادلُ الأدوارَ معَ زَميلِي، ثمَّ أكرِّرُ الخُطوةَ السابقةَ.\n٣ أَتَواصلُ. أعرِضُ نَتائِجي على الصَّفِّ، وَأُقارِنُها بنَتائجِ زُملائي، وَأُسجِّلُ النّتائجَ في لوحةِ الصفِّ.\n٤ أُفسِّرُ البياناتِ. أَستعملُ بياناتِ لوحةِ الصفِّ، وَأُمثِّلُها برسمٍ بيانيٍّ بالأعمدةِ.\n٥ أستخدِمُ الأرقامَ. أَكتبُ الكسرَ الذي يمثّلُ كلَّ صفةٍ منَ الصفاتِ الموجودةِ في الصفِّ.\n٦ أيُّ الصفاتِ تتكرَّرُ أكثرَ؟\n٧ أَستَنتِجُ. هلْ هناكَ صِفاتٌ شائعةٌ أكثرُ مِنْ غيرِها؟ ولماذا؟\nأستكشفُ أكثرَ: كيفَ أُقارِنُ نَتائِجي بنَتائجِ مجموعاتِ التلاميذِ؟ أضعُ مخطَّطَ تجربةٍ لأتمكَّنَ مِنَ الإجابةِ عنْ هذا السؤالِ.", "simple": "لكل شخص صفات جسمية تميزه. لكن بعض الصفات يشترك فيها كثير من الناس. في هذا النشاط نفحص ثلاث صفات في زملاء الصف. ثم نعرف أي الصفات أكثر تكرارًا.", "steps": [{"q": "ماذا أرى؟", "t": "أرى صورًا لثلاث صفات، ولكل صفة شكلان.", "fig": "f63b", "parts": [], "a": "v2ab048f0a82a"}, {"q": "ما الأجزاء؟", "t": "الإبهام: مقوّس إلى الخلف أو مستقيم.", "fig": "f63c", "parts": [], "a": "v327459d8ac9d"}, {"q": "ما الأجزاء؟", "t": "شحمة الأذن: ملتحمة أو غير ملتحمة.", "fig": "f63d", "parts": [], "a": "v23c36192b49e"}, {"q": "ما الأجزاء؟", "t": "اللسان: قادر على الالتفاف أو غير قادر.", "fig": "f63f", "parts": [], "a": "v7f499bba8486"}, {"q": "ماذا يفعل؟", "t": "زميلي يتأملني ويسجل صفاتي في جدول، ثم نتبادل الأدوار.", "a": "v3014313a8996"}, {"q": "كيف يرتبط بغيره؟", "t": "نجمع نتائج الصف في لوحة، ونمثلها برسم بياني بالأعمدة.", "a": "v0bf584f0b1ad"}, {"q": "الفكرة المهمة", "t": "نكتب كسرًا لكل صفة لنعرف أي الصفات أكثر تكرارًا.", "a": "v4f3e99becb05"}], "figs": ["f63a", "f63b", "f63c", "f63d", "f63e", "f63f", "f63g"], "key": "بعض الصفات الجسمية يشترك فيها كثير من الناس، وبعضها أكثر تكرارًا من غيره.", "sa": "v56ea249f6349"}, {"id": "L08-s3", "page": 64, "title": "ما الوراثةُ؟", "book": "لعلّكَ تجوَّلتَ في إحدَى الحدائقِ، فأبصرتَ الأزهارَ بألوانِها المختلفةِ الجميلةِ. ولعلّكَ لاحظتَ أيضًا اختلافَ ألوانِ عيونِ زملائِك. إن اختلافَ ألوانِ الأزهارِ والعيونِ يعودُ إلَى السببِ نفسِهِ، وهوَ عاملُ الوراثةِ. الوراثةُ تعنِي انتقالَ الصفاتِ الوراثيةِ منَ الآباءِ إلى الأبناءِ.\nوتنطبقُ مبادئُ الوراثةِ على المخلوقاتِ الحيّةِ جميعِها؛ فبعضُ خواصِّ النباتاتِ ـ ومنها لونُ الزهرةِ، وطولُ النباتِ، وشكلُ البذورِ ـ صفاتٌ موروثةٌ. الصفةُ الموروثةُ صفةٌ تنتقلُ من الآباءِ إلى الأبناءِ. ومنَ الصفاتِ الموروثةِ في الإنسانِ لونُ الشَّعرِ والعيونِ، وملامحُ الوجهِ، وحتى طريقةُ الضحكِ. لكنَّ هلْ يمكنُ للوراثةِ أنْ تؤثِّرَ في سلوكِ المخلوقِ الحيِّ؟ بعضُ السلوكِ ـ ومنهُ الغرائزُ ـ صفاتٌ موروثةٌ.\nالغريزةُ سلوكٌ ومهاراتٌ تولدُ مع الإنسانِ أو الحيوانِ، ولا يتمُّ اكتسابُها؛ أيْ أنها سلوكٌ غيرُ مكتسبٍ. هلْ يتعلَّمُ العنكبوتُ مثلاً كيفَ ينسجُ هذهِ الشبكةَ المعقّدةَ، أمْ أنَّ مهارةَ بناءِ الشبكةِ غريزةٌ موروثةٌ؟ نعمْ، هيَ غريزةٌ، تمامًا كما يولدُ صغارُ الإنسانِ يتنفَّسونَ منْ دونِ حاجةٍ إلى تعلّمِ طريقةِ التنفُّسِ. وكما تخرجُ أفراخُ الطيورِ منْ البيضِ ولدى كلِّ نوعٍ منها مهارةٌ وطريقةٌ مختلفةٌ في بناءِ عُشِّه، وكما هو الحالُ أيضًا لدى النحلِ في اتِّخاذِ بيوتِها منَ الأشجارِ والجبالِ.", "simple": "تختلف ألوان الأزهار وألوان العيون بسبب الوراثة. الوراثة انتقال الصفات من الآباء إلى الأبناء. الصفة التي تنتقل هكذا اسمها الصفة الموروثة. وبعض السلوك موروث أيضًا، واسمه الغريزة.", "steps": [{"q": "ماذا أرى؟", "t": "أرى طائر الحباك معلقًا بعشه المنسوج من العشب.", "fig": "f64a", "parts": [], "a": "v34c73606cb39"}, {"q": "ما اسم كل جزء؟", "t": "الوراثة: انتقال الصفات الوراثية من الآباء إلى الأبناء.", "a": "v380024f13f60"}, {"q": "ما الأجزاء؟", "t": "صفات موروثة في النبات: لون الزهرة، وطول النبات، وشكل البذور.", "a": "v52e9471214d8"}, {"q": "ما الأجزاء؟", "t": "صفات موروثة في الإنسان: لون الشعر والعيون، وملامح الوجه، وطريقة الضحك.", "a": "v7a3cf9941bcf"}, {"q": "ماذا يفعل؟", "t": "الغريزة سلوك يولد مع المخلوق، ولا يتعلمه.", "fig": "f64b", "parts": [], "a": "va33f2bfde29a"}, {"q": "الفكرة المهمة", "t": "بناء العنكبوت لشبكته وبناء الحباك لعشه سلوك غريزي موروث.", "a": "v30e5b1185fa0"}], "figs": ["f64a", "f64b"], "key": "الوراثة انتقال الصفات من الآباء إلى الأبناء، وبعض السلوك كالغرائز موروث.", "sa": "vcbe9eff40784"}, {"id": "L08-s4", "page": 65, "title": "ما الوراثةُ؟ (الغريزةُ والصفةُ المكتسَبةُ)", "book": "﴿ وَأَوۡحَىٰ رَبُّكَ إِلَى ٱلنَّحۡلِ أَنِ ٱتَّخِذِي مِنَ ٱلۡجِبَالِ بُيُوتٗا وَمِنَ ٱلشَّجَرِ وَمِمَّا يَعۡرِشُونَ ٦٨ ﴾ النحل. فسبحانَ منْ هداهَا وألهمَها إلى فِعلِ ذلكَ، وأودعَ فيها وفي غيرِها منَ المخلوقاتِ ما يفيدُها منْ صفاتٍ غريزيةٍ.\nوهناكَ سلوكٌ مكتسبٌ غيرُ موروثٍ، وهوَ ما يكتسبُهُ الإنسانُ أو الحيوانُ منْ خلالِ الممارسةِ والخبرةِ. فمثلاً تعلُّمُ علمٍ منَ العلومِ أو مهارةٍ منَ المهاراتِ، كمهارةِ لعبِ كرةِ القدمِ سلوكٌ مكتسبٌ. ولعلَّكَ شاهدْتَ الدلافينَ وهيَ تلعبُ الكرةَ بكلِّ مهارةٍ واقتدارٍ. والصفةُ المكتسبةُ لا تورثُ منْ أبوينِ، بلْ تُكتسبُ بالتعلُّمِ والتدريبِ. وتساعدُ القدرةُ على التَّعلُّمِ على المحافظةِ على البقاءِ والاستجابةِ بشكلٍ أفضلَ للتغيراتِ التي تحدثُ في البيئةِ.\nوتؤثرُ البيئةُ في الصفاتِ المكتسَبةِ بطُرقٍ عدةٍ، فمثلاً كميةُ الماءِ التي يُسقَى بها النباتُ تؤثرُ في طولِهِ. وكميةُ الغذاءِ التي تُطعمُها لصغارِ القططِ تؤثرُ في أحجامِها، وممارسةُ الألعابِ الرياضيةِ تُكسبُ الشخصَ مهاراتٍ رياضيةً.\nوالصفاتُ المكتسبةُ لا تُنقَلُ إلى الأفرادِ الناتجةِ الجديدةِ. ولو كُسرَ غصنُ شجرةٍ فإنَّ هذا لا يؤثّرُ في الصفاتِ التي ستنقلُها الشجرةُ إلى أفرادِها الناتجةِ، بلْ تنمو أغصانٌ جديدةٌ للأفرادِ الجديدةِ.", "simple": "الله ألهم النحل أن تتخذ بيوتها من الجبال والشجر؛ هذه غريزة. أما السلوك المكتسب فنتعلمه بالممارسة والخبرة. الصفة المكتسبة لا تورث من الأبوين. وهي لا تنتقل إلى الأبناء.", "steps": [{"q": "ماذا أرى؟", "t": "أرى دلفينًا يدفع كرة زرقاء في الماء.", "fig": "f65a", "parts": [], "a": "ve4e0f2fea000"}, {"q": "ما اسم كل جزء؟", "t": "لعب الدلفين بالكرة سلوك مكتسب، تعلّمه بالتدريب.", "a": "v5a80e48ddc4c"}, {"q": "ماذا يفعل؟", "t": "القدرة على التعلم تساعد على البقاء والاستجابة لتغيرات البيئة.", "a": "v2e5144d10c7d"}, {"q": "كيف يرتبط بغيره؟", "t": "البيئة تؤثر في الصفات المكتسبة: الماء يؤثر في طول النبات، والغذاء في حجم القطط.", "a": "v1f37247b583d"}, {"q": "الفكرة المهمة", "t": "الصفات المكتسبة لا تنتقل إلى الأبناء؛ فكسر غصن الشجرة لا يؤثر في صفات أفرادها الجديدة.", "a": "v5b9da1e73ed1"}], "figs": ["f65a"], "key": "الصفة المكتسبة تُكتسب بالتعلم والتدريب، ولا تورث من الأبوين.", "sa": "v7e4fc286189f"}, {"id": "L08-s5", "page": 66, "title": "كيفَ تُورَّثُ الصِّفاتُ؟", "book": "مَا الذي يَحكُمُ الصِّفاتِ التي نرثُها عنْ آبائِنَا؟ لماذا يُشبهُ بَعضُ الأشخاصِ أحدَ الآباءِ ولا يشبهُ الآخَرَ؟ لأتعرَّفَ الإجابةَ عنْ هذينِ السؤالينِ يجبُ أنْ أتعرَّفَ نتائجَ تجاربِ العالِمِ جِريجورِ مندلِ الذي اكتشفَ المبادئَ الأساسيةَ لعلمِ الوراثةِ.\nبدأَ جِريجورُ مندلُ تَجاربَهُ على نَباتِ البَازلَّاءِ عام ١٨٥٦م، حيثُ قامَ بِتلقيحِ نَباتاتٍ ذاتِ صِفاتٍ مُختلفةٍ، ولاحَظَ كيفَ تُورَثُ هِذهِ الصِّفاتُ. واستعملَ جِريجورُ مندلُ البازلاءِ في أبحاثِهِ؛ لأنَّها تُنتجُ البُذورَ بِسرعةٍ، مما يسهلُ تتبُّعَ صِفاتِها منْ جيلٍ إلى آخرَ.\nوقدْ توصَّلَ جِريجورُ مندلُ إلى أنَّ الصفاتِ المَوروثةَ تَنتقلُ منَ الآباءِ إلى الأَبناءِ خلالَ عمليةِ التَّكاثُرِ. وأنَّ كُلَّ صِفةٍ مَوروثةٍ يتحكَّمُ فيها عامِلانِ؛ عَامِلٌ منَ الأبِ، وآخرُ منَ الأمِّ يسمَّانِ الجَيناتِ. ويَحتوي الجينُ علَى المعلوماتِ الكيميائيةِ للصفةِ الموروثةِ. وتُخزنُ الجِيناتُ على الكُروموسوماتِ.\nولاحظَ جِريجورُ مندلُ في أثناءِ تجاربِهِ وجودَ أشكالِ صفاتٍ وراثيةٍ تطغَى على أخرَى. فعِندَما قامَ بتلقيحِ بازلاءَ أرجوانيةِ الأزهارِ معَ بازلاءَ بيضاءِ الأزهارِ جاءَ جميعُ الأبناءِ بأزهارٍ أرجوانيةِ اللونِ. فماذا حدثَ إذنْ لصفةِ الأَزهارِ البيضاءِ؟! وَعندَما قامَ جِريجورُ مندلُ بِتلقيحِ نَباتَيْ بازلاءَ أرجوانيَّيِ الأزهارِ منْ أبناءِ الجيلِ الأولِ ظَهرتْ صِفةُ الأزهارِ البيضاءِ مَرةً أُخرى في الجيلِ الثاني. إنَّ صفةَ الأزهارِ البيضاءِ لم تختفِ، وإنَّما منعَتْها منَ الظهورِ صفةُ الأزهارِ الأرجوانيةِ. وتوصَّلَ جريجور مندل إلى أنَّ كُلَّ صفةٍ لها شَكْلٌ سائدٌ وشكلٌ مُتَنَحٍّ. والصفةُ السائدةُ صفةٌ تَمنعُ صفةً أخرَى منَ الظُّهورِ. ومنْ هذهِ الصفاتِ في نباتِ البازلاءِ البذورُ الملساءُ، والأزهارُ الأرجوانيةُ، والقرونُ الخضراءُ. أمّا الصفةُ المتنحِّيةُ فهيَ صفةٌ تَحجُبُها صفةٌ سائدةٌ. ومنَ الصفاتِ المتنحّيةِ في نباتاتِ البازلاءِ البذورُ المجعّدةُ، والأزهارُ البيضاءُ، والقرونُ الصفراءُ.\nوإذا كانَ النباتُ يحملُ جينَ الصفةِ السائدةِ وجينَ الصفةِ المتنحِّيةِ فإنَّ هذا النباتَ يُسمَّى نباتًا هجينًا.\nوقد مثَّلَ العلماءُ الصفاتِ بأَنواعِها بِاستعمالِ الحُروفِ، حيثُ يُمثِّلُ الحرفُ الكبيرُ الصفةَ السائدةَ، والحرفُ الصغيرُ الصفةَ المتنحّيةَ. فَمثلاً في نباتِ البازلاءِ يُرمَزُ لصفةِ الأزهارِ الأرجوانيةِ بالحرفِ (P) بَينما يُرمَزُ لصفةِ الأزهارِ البيضاءِ بالحرفِ (p).", "simple": "العالم جريجور مندل جرّب على نبات البازلاء. وجد أن كل صفة يتحكم فيها جينان: واحد من الأب وواحد من الأم. بعض الصفات سائدة تمنع غيرها من الظهور. والصفة المحجوبة اسمها صفة متنحية.", "steps": [{"q": "ماذا أرى؟", "t": "أرى جدول «صفات نبات البازلاء»: عمود للصفة السائدة وعمود للمتنحية.", "fig": "f66a", "parts": [], "a": "vb81659cb024f"}, {"q": "ما الأجزاء؟", "t": "الجين يحتوي المعلومات الكيميائية للصفة، والجينات مخزنة على الكروموسومات.", "a": "vee1eec2e9e25"}, {"q": "ما اسم كل جزء؟", "t": "الصفة السائدة تمنع غيرها من الظهور: بذور ملساء، أزهار أرجوانية، قرون خضراء.", "fig": "f66a", "parts": ["p1", "p3", "p5"], "a": "va4a952142494"}, {"q": "ما اسم كل جزء؟", "t": "الصفة المتنحية تحجبها صفة سائدة: بذور متجعدة، أزهار بيضاء، قرون صفراء.", "fig": "f66a", "parts": ["p2", "p4", "p6"], "a": "v12426e8b1fa3"}, {"q": "كيف يرتبط بغيره؟", "t": "النبات الذي يحمل جين السائدة وجين المتنحية يسمى نباتًا هجينًا.", "a": "v597342c18f28"}, {"q": "الفكرة المهمة", "t": "الحرف الكبير (P) للصفة السائدة، والحرف الصغير (p) للصفة المتنحية.", "a": "vf35aadcf94a6"}], "figs": ["f66a"], "key": "كل صفة موروثة يتحكم فيها جينان، والصفة السائدة تحجب الصفة المتنحية.", "sa": "v45ec47db908c"}, {"id": "L08-s6", "page": 67, "title": "تلقيحُ البازلّاءِ", "book": "و اكتشافاتُ جريجورَ مندلَ في الوراثةِ مهمةٌ جدًّا؛ لأنها تَنطبقُ على جَميعِ المَخلوقاتِ الحيةِ. فالجِيناتُ التي تُحدِّدُ شكلَ شَحمةِ الأذُنِ وشَكْلَ الإبهامِ لدى الإنسانِ مثلًا لَها شَكْلٌ سَائِدٌ، وآخَرُ مُتنَحٍّ. ومن الطبيعيِّ أن تظهرَ الصفاتُ السائدةُ أكثرَ من الصفاتِ المُتنحيةِ التي يُحجَبُ ظهورُها بتأثيرِ الصفاتِ السائدةِ.\nمفتاحُ الشكلِ: الأزهارُ البيضاءُ صِفةٌ مُتنحيةٌ، الأزهارُ الأرجوانيةُ صِفةٌ سائِدةٌ.", "simple": "الشكل يبين تجربة مندل خطوة خطوة. لقّح زهرة أرجوانية PP مع زهرة بيضاء pp. جاء الجيل الأول كله أرجوانيًا. وفي الجيل الثاني ظهرت الزهرة البيضاء من جديد.", "steps": [{"q": "ماذا أرى؟", "t": "أرى ثلاثة صفوف: جيل الآباء، ثم الجيل الأول، ثم الجيل الثاني.", "fig": "f67b", "parts": [], "a": "v917fe4f7262d"}, {"q": "ما الأجزاء؟", "t": "جيل الآباء: زهرة أرجوانية PP وزهرة بيضاء pp.", "fig": "f67b", "parts": ["p1", "p2"], "a": "v26b81c2e381d"}, {"q": "ماذا يفعل؟", "t": "الجيل الأول: جميعها أرجوانية، وكل زهرة Pp.", "fig": "f67b", "parts": ["p3"], "a": "vaf365582f5d5"}, {"q": "كيف يرتبط بغيره؟", "t": "الجيل الثاني: PP وPp وPp أرجوانية، وpp بيضاء.", "fig": "f67b", "parts": ["p4", "p5"], "a": "v21aae9cd39f1"}, {"q": "الفكرة المهمة", "t": "الصفات السائدة تظهر أكثر من المتنحية التي تحجبها السائدة.", "a": "v85731127484f"}], "figs": ["f67b", "f67c"], "key": "صفة الأزهار البيضاء لم تختفِ، بل حجبتها السائدة، ثم ظهرت في الجيل الثاني.", "sa": "v0465b1dcfab2"}, {"id": "L08-s7", "page": 67, "title": "نشاطٌ: الصفاتُ المَوروثةُ في الذُّرَةِ", "book": "كلُّ حَبةِ ذُرَةٍ هيَ بَذرةٌ مُنفصلةٌ انتقلتْ إليها الصفاتُ الوراثيةُ، كاللونِ مَثلًا، من النَّبتةِ الأمِّ.\n١ ألاحظُ. أنظرُ إلى كُوزِ الذُّرةِ. ماذا ألاحظُ؟\n٢ أعُدُّ الحبوبَ السوداءَ في كُوزِ الذرةِ، وأسجِّلُ عَددَها.\n٣ أعدُّ الحبوبَ الصفراءَ، وأسجلُ عَدَدَها.\n٤ أُفسّرُ البياناتِ. أي لونٍ عددُ حبوبِه أكثرُ؟\n٥ هلْ صفةُ الحبوبِ السوداءِ سائدةٌ أم مُتنحِّيةٌ؟ أفسِّرُ إجابتي.", "simple": "كل حبة ذرة بذرة منفصلة. ورثت صفاتها، مثل اللون، من النبتة الأم. نعدّ الحبوب السوداء والصفراء. ثم نقرر أي اللونين صفة سائدة.", "steps": [{"q": "ماذا أرى؟", "t": "أرى كوز ذرة فيه حبوب بألوان مختلفة.", "fig": "f67a", "parts": [], "a": "vb2431ee81e64"}, {"q": "ماذا يفعل؟", "t": "أعدّ الحبوب السوداء، ثم الصفراء، وأسجل العددين.", "a": "v42f97b119c61"}, {"q": "كيف يرتبط بغيره؟", "t": "أقارن العددين لأعرف أي لون حبوبه أكثر.", "a": "v3a060f706356"}, {"q": "الفكرة المهمة", "t": "الصفة السائدة تظهر عادة أكثر من الصفة المتنحية.", "a": "vef23eb547e6b"}], "figs": ["f67a"], "key": "لون حبة الذرة صفة موروثة، ونستدل بعدد الحبوب على الصفة السائدة.", "sa": "vdb3ff21ba870"}, {"id": "L08-s8", "page": 68, "title": "كيفَ نتتبَّعُ الصفاتِ الوراثيةَ؟", "book": "بَعضُ الصِّفاتِ التي تَحكُمُها الجِيناتُ يَسْهلُ رُؤيتُها، ومنها لونُ الشَّعرِ. وهناكَ صِفاتٌ أُخْرى تَحكُمها الجيناتُ لا يُمكنُكَ رُؤيتُها؛ فبعضُ الأفرادِ يحملون صِفاتٍ غيرَ ظاهِرةٍ. فكيفَ يُمكنُ مثلاً لوالِدينِ لَديهِما غَمّازاتٌ أنْ ينجبَا طِفلًا ليسَ لَه غَمّازاتٌ؟ يُمكنُكَ معرفةُ الإجابةِ عنْ هذا السؤالِ باستخدام مُخطَّطِ السُّلالةِ، وهوَ مُخطَّطٌ يُستعملُ لِتتبُّعِ الصِّفاتِ في العائِلةِ، ودراسةِ الأنماطِ الوِراثيةِ.\nويُظهرُ المُخطّطُ الآباءَ والأبناءَ، وتربطُ الخُطوطُ الأُفقيةُ الآباءَ معًا. أمّا الخُطوطُ العموديةُ فتربطُ الآباءَ بالأبناءِ. كما يُرمزُ إلى الذكورِ في المُخطّطِ بالمُربعاتِ، ويُرمزُ إلى الإناثِ بالدوائرِ. وفي المُخطّطِ التالي تمثّلُ المربعاتُ والدوائرُ الملونةُ الأفرادَ الذين تظهرُ عليهم الصفاتُ السائدةَ وتُمثِّلُ المربعاتُ والدوائرُ ذاتُ الخلفيةِ البيضاءِ الأفرادَ الذين تظهر عليهم الصفاتُ المتنحيةَ.\nيُمكنُكَ رؤيةُ أنَّ كِلا الأبوينِ لهُ غَمّازاتٌ، ولكنَّهما يَحملانِ جينَ الصفةِ المُتنحّيةِ. والحامِلُ للصفةِ هوَ الشخصُ الذي ورثَ جِينَ الصفةِ ولكنَّ الصفةَ لا تَظهرُ عليهِ شكليًا.", "simple": "بعض الصفات نراها، وبعضها لا نراه. مخطط السلالة يتتبع الصفات في العائلة. الذكور مربعات والإناث دوائر. الحامل للصفة يرث جينها، لكنها لا تظهر عليه.", "steps": [{"q": "ماذا أرى؟", "t": "أرى «مخطط السلالة» لصفة الغمازات: جيل الأبوين وجيل الأبناء.", "fig": "f68b", "parts": [], "a": "va8daf1515d3e"}, {"q": "ما الأجزاء؟", "t": "المربع الملون غمازات (سائدة)، والمربع الأبيض بدون غمازات (متنحية).", "fig": "f68c", "parts": [], "a": "vf45904f2f160"}, {"q": "ما اسم كل جزء؟", "t": "الأم دائرة والأب مربع، وكلاهما ملون؛ أي لهما غمازات.", "fig": "f68b", "parts": ["p1", "p2"], "a": "v457752a0ca0e"}, {"q": "ماذا يفعل؟", "t": "الخط الأفقي يربط الأبوين، والخطوط العمودية تربطهما بالأبناء.", "a": "v4fd81f9a1d84"}, {"q": "كيف يرتبط بغيره؟", "t": "ابن واحد مربعه أبيض؛ ليس له غمازات.", "fig": "f68b", "parts": ["p5"], "a": "v77861ef4c556"}, {"q": "الفكرة المهمة", "t": "الأبوان يحملان جين الصفة المتنحية، فهما حاملان للصفة.", "a": "veef56daeceee"}], "figs": ["f68b", "f68c", "f68d"], "key": "مخطط السلالة يتتبع الصفات في العائلة، والحامل يرث جين صفة لا تظهر عليه.", "sa": "vd94a3259144a"}, {"id": "L08-s9", "page": 68, "title": "ما الانتخابُ الطَّبيعيُّ؟", "book": "يُعرفُ الانتخابُ الطَّبيعيُّ بأنَّه عمليةُ تكيُّفِ الكائناتِ الحيَّةِ في بيئةٍ معينةٍ بفضلِ امتلاكِها بعضَ الخصائصِ الَّتي تُمكّنُها من العيشِ في تلكَ البيئةِ أكثرَ من غيرِهَا، وتُعرفُ هذه الخصائصُ باسمِ السِّماتِ التَّكيفيَّةِ، وغالبًا ما تكونُ الكائناتُ الَّتي تمتلكُ هذه السمَات أكثرَ قدرةٍ على البقاءِ والتَّكاثرِ.\nتتوارثُ الكائناتُ الحيَّةُ السِّماتِ التَّكيفيَّةَ عند تكاثرِهَا عبرَ الأجيالِ، ويُعززُ الانتخابُ الطبيعيُّ من انتقالِ هذه السِّماتِ، ويُؤدي أحيانًا إلى تنوُّعِ الكائناتِ الحيَّةِ، وظهورُ أنواعٍ جديدةٍ ذاتِ سماتٍ جديدةٍ، وهو ما ساعدَ على تفسيرِ تنوُّعِ الحياةِ على الأرضِ.\nومن الأمثلةِ الواقعيَّةِ لتأثيرِ الانتخابِ الطبيعيِّ على الحيواناتِ عصافيرُ غالاباغوس حيثُ كانتْ ذاتَ مناقيرَ كبيرةٍ وتتلاءمُ مع الوفرةِ في البذورِ التي تتغذَّى عليها ومعَ حجمِهَا وكانتْ تعيشُ بشكلٍ أفضلَ خلالَ أوقاتِ الأمطارِ الَّتي كانتْ تتسمُ بها البِيئةُ ثمَّ اختلفَ المناخُ وأصبحَ يتَّسمُ بالجفافِ ومع مرورِ الأجيالِ تغيرَّتْ أشكالُ مناقيرِ العصافيرِ لتكونَ أصغرَ لتتكيفَ مع البيئةِ حيثُ كانَ أداءُ العصافيرِ ذاتِ المناقيرِ الصَّغيرةِ أفضلُ في التقاطِ البذورِ الَّتي أصبحتْ نادرةً وصغيرةَ الحجْمِ.", "simple": "بعض المخلوقات لها خصائص تساعدها على العيش في بيئتها أكثر من غيرها. هذه الخصائص اسمها السمات التكيفية. وهي تنتقل عبر الأجيال. هذه العملية اسمها الانتخاب الطبيعي.", "steps": [{"q": "ماذا أرى؟", "t": "أرى رؤوس عصافير غالاباغوس بمناقير مختلفة الأحجام.", "fig": "f68a", "parts": [], "a": "v901abb1466f0"}, {"q": "ما اسم كل جزء؟", "t": "السمات التكيفية خصائص تمكّن المخلوق من العيش في بيئته أكثر من غيره.", "a": "vf0ac10387e2e"}, {"q": "ماذا يفعل؟", "t": "في أوقات الأمطار كانت المناقير الكبيرة تناسب البذور الوفيرة.", "a": "v2fb7b8762cac"}, {"q": "كيف يرتبط بغيره؟", "t": "لما صار المناخ جافًا، صارت المناقير أصغر مع مرور الأجيال.", "a": "vfeabb243cd0e"}, {"q": "الفكرة المهمة", "t": "الانتخاب الطبيعي يساعد على تفسير تنوع الحياة على الأرض.", "a": "v2bd7aae49233"}], "figs": ["f68a"], "key": "الانتخاب الطبيعي تكيّف المخلوقات مع بيئتها بسمات تكيفية تتوارثها عبر الأجيال.", "sa": "vfc052651b7ef"}, {"id": "L08-s10", "page": 69, "title": "مراجعةُ الدرسِ: ملخَّصٌ مصوَّرٌ", "book": "الوراثةُ هي انتقالُ الصِّفاتِ منَ الآباءِ إلى الأَبناءِ.\nوَجدَ جريجورُ مندلُ أنَّ الصِّفاتِ السائدةَ تَمْنَعُ الصِّفاتِ المُتنحِّيةَ منَ الظُّهورِ.\nحاملُو الصفاتِ يمكنُهم نقلُ جيناتِ الصفةِ إلى أبنائِ ةٍ؛ حيثُ يتمُّ تركيزُ الصفاتِ المرغوبةِ في النباتاتِ بعمليةٍ خاصةٍ تجمعُ بينَ صفاتٍ مرغوبةٍ من كلٍّ من النبتةِ الأمِّ والنبتةِ الأبِ.\nكيفَ يمكنُ أنْ يقومَ مزارعٌ بتحسينِ صفاتٍ معينةٍ لنباتِ الذرةِ؟\nأولًا: يقومُ المزارعُ بزراعةِ هذه النباتاتِ منْ سُلالتَيْنِ مختلفتَيْنِ. نسمِّي الصفَّ الأولَ (السلالةَ أ) والصفَّ الآخرَ (السلالةَ ب). وبعدَ نحوِ ٥٥ يومًا نجدُ أنَّ كلَّ سلالةٍ منَ النباتِ قد أنتجتْ شُرَّابةَ الذرةِ الخاصةَ بها (جزءٌ من نباتِ الذرةِ مسؤولٌ عنْ إنتاجِ حبوبِ اللقاحِ في الجزءِ الذكريِّ منَ النباتِ). ثمَّ يقومُ المزارعُ بإزالةِ شُرَّابةِ الذرةِ منَ السلالةِ (أ)؛ ليضمنَ تلقيحَ هذهِ النباتاتِ منْ حبوبِ اللقاحِ التي تنتجُها السلالةُ (ب).\nفي اليومِ ٦٠ يتشكلُ الجزءُ الأنثويُّ منَ الذرةِ، وهي حبيباتٌ على شكلِ صفوفٍ على كوزِ الذرةِ.\nالخطوةُ التاليةُ، تُسمى التلقيحَ الخلطيَّ، وهوَ يحدثُ بشكلٍ طبيعيٍّ. حيثُ يتمُّ تحريرُ حبوبِ اللقاحِ منَ السلالةِ (ب) في الهواءِ، فتقعُ على أفرادِ السلالةِ (أ).\nوعندَ حصادِ نباتاتِ الذرةِ، يكونُ المحصولُ قدْ حملَ صفاتٍ محسّنةٍ منَ السلالتَيْنِ، وتُستخدمُ هذهِ الحبوبُ بذورًا لزراعةِ محاصيلِ الذرةِ المحسّنةِ في المواسمِ التاليةِ.", "simple": "المزارع يريد محصولًا بصفات أفضل. يزرع سلالتين مختلفتين من الذرة. ينزع شرابة الذرة من السلالة (أ). فتتلقح من حبوب لقاح السلالة (ب) بالهواء. هذا اسمه التلقيح الخلطي.", "steps": [{"q": "ماذا أرى؟", "t": "أرى نبات ذرة، وفي أعلاه جزء اسمه شرابة الذرة.", "fig": "f70a", "parts": [], "a": "vd74974f38de8"}, {"q": "ما الأجزاء؟", "t": "شرابة الذرة جزء ذكري ينتج حبوب اللقاح.", "fig": "f70a", "parts": ["p1"], "a": "v6a712af481a8"}, {"q": "الخطوة الأولى", "t": "يزرع المزارع سلالتين مختلفتين: السلالة (أ) والسلالة (ب).", "a": "vca9781261502"}, {"q": "اليوم ٥٥", "t": "تنتج كل سلالة شرابتها، فينزع المزارع شرابة السلالة (أ).", "fig": "f70a", "parts": ["p1"], "a": "vaf027e5f63ab"}, {"q": "اليوم ٦٠", "t": "يتشكّل الجزء الأنثوي: حبيبات في صفوف على كوز الذرة.", "a": "v5bc32543375f"}, {"q": "التلقيح الخلطي", "t": "تنتقل حبوب لقاح السلالة (ب) في الهواء، فتقع على السلالة (أ).", "a": "v0e9577718bfc"}, {"q": "الفكرة المهمة /* ---------- progress ---------- */

/* ---------- lesson ---------- */
function lesson(id, tab = 'e', at) {
  stopA(); const l = D.lessons.find(x => x.id === id); if (!l) return home();
  S.last = {l: id, tab, at}; save(); $('#ttl').textContent = l.name;
  let h = `<div class="tabs"><button data-t="e" class="${tab === 'e' ? 'on' : ''}">📘 الشرح (${AR(l.sections.length)})</button><button data-t="q" class="${tab === 'q' ? 'on' : ''}">✏️ أسئلة الكتاب (${AR(l.questions.length)})</button></div>`;
  h += `<div class="card"><b>${esc(l.unit)} ← ${esc(l.chapter)}</b><br>${esc(l.name)} · صفحات الكتاب ${AR(l.pages[0])}–${AR(l.pages[1])}${l.note ? `<div class="oos" style="margin-top:6px">${esc(l.note)}</div>` : ''}
  <div class="row">${(tab === 'e' ? l.sections : l.questions).map((x, i) => `<button class="btn" data-go="${x.id}">${tab === 'e' ? esc(x.title) : AR(i + 1)}</button>`).join('')}</div></div>`;
  h += tab === 'e' ? l.sections.map(secHTML).join('') : l.questions.map((q, i) => qHTML(q, i)).join('');
  const i = D.lessons.indexOf(l), nx = D.lessons[i + 1];
  h += `<div class="row" style="justify-content:space-between">${tab === 'e' ? `<button class="btn b" data-tab="q">✏️ انتقل إلى أسئلة الدرس</button>` : `<button class="btn" data-tab="e">📘 ارجع للشرح</button>`}${nx ? `<button class="btn p" data-next="${nx.id}">الدرس التالي ‹</button>` : ''}</div>`;
  $('#m').innerHTML = h;
  $$('.tabs button,[data-tab]').forEach(b => b.onclick = () => lesson(id, b.dataset.t || b.dataset.tab));
  $$('[data-next]').forEach(b => b.onclick = () => lesson(b.dataset.next, tab));
  $$('[data-go]').forEach(b => b.onclick = () => goTo(b.dataset.go));

function goTo(id) { const e = document.getElementById(id); if (e) { e.scrollIntoView({behavior: S.calm ? 'auto' : 'smooth', block: 'start'}); S.last.at = id; save(); } }
function watchSeen(l) {

}
function findSec(id) { for (const l of D.lessons) for (const s of l.sections) if (s.id === id) return [l, s]; return []; }

/* ---------- section (explanation) ---------- */
function secHTML(s) {
  return `<section class="card sec" id="${s.id}"><h3>${esc(s.title)} ${PG(s.page)}</h3>
  ${s.book ? `<details class="book"><summary>📖 نص الكتاب (صفحة ${AR(s.page)})</summary>${s.book.split('\n').map(p => `<p>${esc(p)}</p>`).join('')}</details>` : ''}
  <div class="ours"><span class="lbl">شرح مبسّط مستند إلى الكتاب</span><div class="simple">${esc(s.simple)}</div></div>
  <div class="row"><button class="btn p" data-a="steps">▶ شاهد خطوة بخطوة</button><button class="btn" data-a="simple">💡 اشرح لي ببساطة</button><button class="btn" data-a="again">↺ أعد الشرح</button>
  <span class="audio"><button data-a="say" aria-label="استمع">🔊</button><button data-a="stop" aria-label="إيقاف">⏸</button></span>

}
function bindSec(s) {

  let run = null;
  const lis = $$('.steps li', e);
  const show = i => { lis.forEach((li, k) => { li.classList.toggle('on', k === i); li.classList.toggle('done', k < i); }); const st = s.steps[i]; if (st && st.fig) { const v = VIEW[st.fig + '@' + s.id]; v && v.highlight(st.parts || []); } };

    const tok = run = {}; let i = from;

      show(i); const st = s.steps[i]; i++; play(st.a, $('[data-a=say]', e), () => setTimeout(next, dur(.35) * 1000)); };
    next();
  };

    const b = ev.target.closest('[data-a]'); if (!b) { const li = ev.target.closest('.steps li'); if (li) { run = null; show(+li.dataset.i); play(s.steps[+li.dataset.i].a); } return; }

const flash = el => { if (!S.calm && window.gsap) gsap.fromTo(el, {backgroundColor: '#fff3b0'}, {backgroundColor: '#f1f6fb', duration: dur(1.2)}); };

/* ---------- figure viewer: book figure + clipped parts ---------- */
const VIEW = {};

function mountFig(fid, sid) {
  const f = D.figs[fid], host = $(`#${sid} [data-fig="${fid}"]`); if (!f || !host) return;
  const W = f.w, H = f.h;
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', f.title || 'رسم الكتاب');
  const uid = 'u' + Math.random().toString(36).slice(2, 8);
  let defs = '', g = `<image class="base" href="fig/${fid}.webp" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="none"/>`;
  f.parts.forEach((p, i) => {
    const [x0, y0, x1, y1] = p.box, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = (x1 - x0) / 2, ry = (y1 - y0) / 2;
    const ring = (k) => { const q = Math.min(rx, ry) * .14; return `<path fill-rule="evenodd" clip-rule="evenodd" d="M${cx - rx} ${cy}a${rx} ${ry} 0 1 0 ${2 * rx} 0a${rx} ${ry} 0 1 0 ${-2 * rx} 0ZM${cx - rx + q} ${cy}a${rx - q} ${ry - q} 0 1 0 ${2 * (rx - q)} 0a${rx - q} ${ry - q} 0 1 0 ${-2 * (rx - q)} 0Z"/>`; };
    const shape = p.shape === 'ring' ? ring() : p.shape === 'ellipse' ? `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>` : p.poly ? `<polygon points="${p.poly.map(q => q.join(',')).join(' ')}"/>` : `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" rx="6"/>`;
    defs += `<clipPath id="${uid}c${i}">${shape}</clipPath>`;
    g += `<line class="ld" data-l="${i}" x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy}" opacity="0"/>`;
    g += `<g class="part" data-i="${i}" tabindex="0" role="button" aria-label="${esc(p.name)}"><image class="pimg" href="fig/${fid}.webp" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="none" clip-path="url(#${uid}c${i})"/>${shape.replace(/^<(\w+)/, '<$1 class="hit"')}</g>`;
  });
  f.parts.forEach((p, i) => { const [x0, y0, x1, y1] = p.box; g += `<text class="nm" data-n="${i}" x="${(x0 + x1) / 2}" y="${(y0 + y1) / 2}" text-anchor="middle" opacity="0">${esc(p.name)}</text>`; });
  svg.innerHTML = `<defs>${defs}</defs>${g}`;
  $('.stage', host).appendChild(svg);
  const parts = $$('.part', svg), lines = $$('.ld', svg), names = $$('.nm', svg), base = $('.base', svg), info = $('.infobox', host);
  let exploded = false, showNames = false, cur = -1;
  const btn = k => $(`[data-f="${k}"]`, host);
  const setOn = k => $$('[data-f]', host).forEach(b => b.classList.toggle('on', b.dataset.f === k || (b.dataset.f === 'names' && showNames)));
  // explode layout: pieces go to a ring (ellipse) around the figure, ordered by angle so leader lines don't cross;
  // each piece is enlarged to fill its slot, and the viewBox grows to hold the ring.
  const M = Math.max(W, H), PAD = M * .2;
  let VBOUT = `${-PAD} ${-PAD} ${W + 2 * PAD} ${H + 2 * PAD}`;
  const layout = () => {
    const n = f.parts.length, cx = W / 2, cy = H / 2, A = W / 2 + PAD * .55, B = H / 2 + PAD * .55;
    const per = Math.PI * (3 * (A + B) - Math.sqrt((3 * A + B) * (A + 3 * B)));
    const slot = Math.min(PAD * 1.25, .8 * per / n);
    const order = f.parts.map((p, i) => { const [x0, y0, x1, y1] = p.box; return {i, a: Math.atan2(((y0 + y1) / 2 - cy) / B, ((x0 + x1) / 2 - cx) / A)}; }).sort((u, v) => u.a - v.a);
    const res = []; let bx0 = 0, by0 = 0, bx1 = W, by1 = H;
    order.forEach((o, k) => { const t = order[0].a + k * 2 * Math.PI / n, x = cx + A * Math.cos(t), y = cy + B * Math.sin(t);
      const [x0, y0, x1, y1] = f.parts[o.i].box, sc = Math.max(.5, Math.min(2.4, slot / Math.max(x1 - x0, y1 - y0)));
      const hw = (x1 - x0) * sc / 2, hh = (y1 - y0) * sc / 2; res[o.i] = {x, y, sc, hh};
      bx0 = Math.min(bx0, x - hw); bx1 = Math.max(bx1, x + hw); by0 = Math.min(by0, y - hh); by1 = Math.max(by1, y + hh + M / 18); });
    const m = M * .03, mx = M * .12; VBOUT = `${bx0 - mx} ${by0 - m} ${bx1 - bx0 + 2 * mx} ${by1 - by0 + 2 * m}`;

  };
  const vbIn = `0 0 ${W} ${H}`;
  const fsIn = Math.max(14, M / 24), fsOut = Math.max(16, M / 20);
  names.forEach(n => n.setAttribute('font-size', fsIn));
  function explode() {
    exploded = true; const sl = layout();
    gsap.to(svg, {attr: {viewBox: VBOUT}, duration: dur(.6)}); base.classList.add('dim');

      const [x0, y0, x1, y1] = f.parts[i].box, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, q = sl[i];
      gsap.to(g, {x: q.x - cx, y: q.y - cy, scale: q.sc, svgOrigin: `${cx} ${cy}`, duration: dur(.9), delay: dur(.06 * i), ease: 'power2.out'});

      gsap.to(names[i], {attr: {x: q.x, y: q.y + q.hh + fsOut * .95, 'font-size': fsOut}, duration: dur(.9), delay: dur(.06 * i)});

  }
  function assemble(only) {
    const list = only == null ? parts.map((_, i) => i) : [only];
    list.forEach(i => { const [x0, y0, x1, y1] = f.parts[i].box;
      gsap.to(parts[i], {x: 0, y: 0, scale: 1, duration: dur(.8), ease: 'power2.inOut'});
      gsap.to(lines[i], {attr: {x2: (x0 + x1) / 2, y2: (y0 + y1) / 2}, opacity: 0, duration: dur(.8)});
      gsap.to(names[i], {attr: {x: (x0 + x1) / 2, y: (y0 + y1) / 2, 'font-size': fsIn}, opacity: showNames ? 1 : 0, duration: dur(.8)}); });
    if (only == null) { exploded = false; base.classList.remove('dim'); gsap.to(svg, {attr: {viewBox: vbIn}, duration: dur(.6), delay: dur(.3)}); }
  }
  function select(i) {
    cur = i; parts.forEach((g, k) => g.classList.toggle('hi', k === i));
    if (i < 0) { info.innerHTML = ''; return; }
    const p = f.parts[i];
    if (!S.calm) gsap.fromTo(parts[i], {opacity: .5}, {opacity: 1, duration: dur(.5)});
    info.innerHTML = `<div class="info"><h4>${esc(p.name)} ${PG(p.page || f.page)}</h4>${p.fn ? `<div><b>وظيفته:</b> ${esc(p.fn)}</div>` : ''}${p.rel ? `<div><b>علاقته بغيره:</b> ${esc(p.rel)}</div>` : ''}
      <div class="row">${p.a ? `<span class="audio"><button data-say="${p.a}" aria-label="استمع">🔊</button></span>` : ''}${exploded ? `<button class="btn" data-one="${i}">↩︎ أعد هذا الجزء</button>` : ''}</div></div>`;

  }
  function highlight(ids) {
    const idx = ids.map(n => f.parts.findIndex(p => p.id === n)).filter(i => i >= 0);

    base.classList.toggle('dim', !!idx.length && !exploded);
    if (idx.length && !exploded) parts.forEach((g, k) => gsap.to(g, {opacity: idx.includes(k) ? 1 : 0, duration: dur(.35)}));
    else parts.forEach(g => gsap.to(g, {opacity: 1, duration: dur(.35)}));
