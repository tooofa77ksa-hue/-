e, "ta": "vbeade7bf666b", "da": "v243aa69e2ecd"}, {"term": "العضوُ", "def": "مجموعةٌ منْ نسيجينِ مختلفينِ أوْ أكثرَ، تعملُ معًا للقيامِ بوظيفةٍ محددةٍ.", "page": 26, "sec": "L01-s5", "fig": "f27a", "parts": ["p1", "p3"], "exact": true, "ta": "v3f539579f560", "da": "vf5bcb506a335"}, {"term": "الجهازُ الحيويُّ", "def": "تشكّلُ مجموعةُ الأعضاءِ التي تعملُ معًا لأداءِ وظائفَ محددةٍ جهازًا حيويًّا.", "page": 27, "sec": "L01-s5", "fig": "f27a", "parts": ["p1", "p2"], "exact": true, "ta": "v293ada18c67f", "da": "vcbe776396a7d"}, {"term": "العنصرُ", "def": "مادةٌ نقيةٌ لا يمكنُ تجزئتُها إلى موادَّ أبسطَ منْها.", "page": 28, "sec": "L01-s7", "fig": null, "parts": [], "exact": true, "ta": "v6ccbd335734f", "da": "v757755f82165"}, {"term": "المركَّبُ", "def": "مادةٌ تتكوَّنُ باتّحادٍ كيميائيٍّ بينَ عنصرينِ أو أكثرَ.", "page": 28, "sec": "L01-s7", "fig": null, "parts": [], "exact": true, "ta": "vb11b0cb3cf51", "da": "va0872de7a151"}], "points": [{"t": "روبرت هوك (إنجليزي) أول من شاهد الخلية وسمّاها، سنة ١٦٦٥م، في شريحة فلين، ووصفها بصناديق صغيرة متراصة تشبه خلايا النحل.", "page": 24, "sec": "L01-s1", "fig": "f24a", "parts": ["p1", "p2"], "a": "v395ea5135cd5"}, {"t": "ليفنهوك (تاجر هولندي) أول من شاهد مخلوقات حية وحيدة الخلية، ومجهره أقوى تكبيرًا من مجهر هوك تسع مرات.", "page": 24, "sec": "L01-s1", "fig": null, "parts": [], "a": "vc0991f0ead0f"}, {"t": "١٨٣١م: روبرت براون اكتشف نواة الخلية النباتية. ١٨٣٨م: شلايدن: كل النباتات من خلايا. وبعد سنة شفان: كل الحيوانات من خلايا.", "page": 25, "sec": "L01-s2", "fig": null, "parts": [], "a": "v7a5557f4f2bb"}, {"t": "أفكار نظرية الخلية الثلاث: كل المخلوقات الحية من خلية أو أكثر، والخلية وحدة التركيب والوظيفة، والخلايا تنتج عن خلايا موجودة.", "page": 25, "sec": "L01-s2", "fig": null, "parts": [], "a": "v7ea2dc44cc8e"}, {"t": "وحيدة الخلية مثل البكتيريا والبراميسيوم واليوجلينا. والعديدة الخلايا قد تحوي بلايين الخلايا، ومستعمرة الفولفكس قد تزيد على ٥٠٠ خلية.", "page": 25, "sec": "L01-s3", "fig": "f25b", "parts": [], "a": "v1792c2b75e93"}, {"t": "أنواع الأنسجة الأربعة في الحيوان: العضلي (يحرك ويضخ)، والضام (عظام وغضاريف ودهون ودم)، والعصبي (ينقل الرسائل)، والطلائي (يغطي).", "page": 26, "sec": "L01-s4", "fig": "f26a", "parts": ["p1", "p2", "p3", "p4"], "a": "ve3ad52b099a5"}, {"t": "الجلد أكبر عضو في جسم الإنسان، والقلب عضو فيه نسيج عضلي ونسيج عصبي ونسيج ضام.", "page": 26, "sec": "L01-s5", "fig": null, "parts": [], "a": "ve32c4216f5c1"}, {"t": "أعضاء النبات: الجذر يمتص الماء والأملاح، والساق يدعم ويحمل الأوراق، والورقة للبناء الضوئي، والزهرة للتكاثر الجنسي.", "page": 26, "sec": "L01-s5", "fig": null, "parts": [], "a": "ve52894cb9d7e"}, {"t": "جهاز الدوران: القلب والأوعية الدموية والدم، ينقل الأكسجين والغذاء إلى الخلايا ويتخلص من الفضلات.", "page": 27, "sec": "L01-s5", "fig": "f27a", "parts": ["p1", "p2"], "a": "v3fcd189b3c02"}, {"t": "مستويات التنظيم الخمسة بالترتيب: الخلايا ← الأنسجة ← الأعضاء ← الأجهزة ← المخلوق الحي.", "page": 29, "sec": "L01-s9", "fig": "f29a", "parts": [], "a": "vb824bf78c2d6"}, {"t": "هناك أكثر من ١٠٠ نوع من الذرات، والعنصر يتكون من نوع واحد من الذرات، والعناصر تتحد لتكوّن المركبات.", "page": 28, "sec": "L01-s7", "fig": null, "parts": [], "a": "v8ad15ac78ca4"}, {"t": "الكربوهيدرات (كربون وهيدروجين وأكسجين) تزود الخلية بالطاقة، والدهون (العناصر نفسها) تختزن وتحرر طاقة أكبر من الكربوهيدرات.", "page": 28, "sec": "L01-s8", "fig": "f28b", "parts": ["p5", "p3"], "a": "v8eefa83de928"}, {"t": "البروتينات (كربون وهيدروجين وأكسجين ونيتروجين) لنمو الخلايا وتجديدها، والأحماض النووية (ومعها الفوسفور) تساعد الخلية على بناء بروتيناتها.", "page": 28, "sec": "L01-s8", "fig": "f28b", "parts": ["p2", "p4"], "a": "vc19c4e786a44"}, {"t": "مكونات خلايا الإنسان في الشكل: ماء ٧٠٪، بروتينات ١٥٪، دهون ١٠٪، أحماض نووية ٤٪، كربوهيدرات ١٪.", "page": 28, "sec": "L01-s8", "fig": "f28b", "parts": ["p1", "p2", "p3", "p4", "p5"], "a": "v70c3df59a7ef"}], "quiz": [{"id": "L01-m1", "src": "L01-q1", "kept": false, "page": 25, "type": "mcq", "text": "أتتبع تطور نظرية الخلية. ما الترتيب الصحيح لهؤلاء العلماء من الأقدم إلى الأحدث؟", "options": ["أ. براون ← هوك ← شلايدن", "ب. هوك ← براون ← شلايدن", "ج. شلايدن ← براون ← هوك", "د. هوك ← شلايدن ← براون"], "answer": 1, "answerText": "ب. هوك ← براون ← شلايدن", "explain": "هوك شاهد الخلية عام ١٦٦٥م، ثم اكتشف براون النواة عام ١٨٣١م، ثم استنتج شلايدن عام ١٨٣٨م أن النباتات كلها من خلايا.", "why": {"0": "براون جاء بعد هوك بزمن طويل (١٨٣١م).", "2": "هذا الترتيب مقلوب؛ هوك هو الأقدم (١٦٦٥م).", "3": "شلايدن (١٨٣٨م) جاء بعد براون (١٨٣١م)."}, "evp": 25, "back": "L01-s2", "section": "اختر الإجابة الصحيحة", "qa": "vb57bb954cb26", "ea": "v9cfb367e59f2", "wa": null, "ha": null, "whyA": {"0": "vd4598831e971", "2": "v46e9f268caee", "3": "v04164dd0dfc8"}}, {"id": "L01-m2", "src": "L01-q2", "kept": false, "page": 25, "type": "mcq", "text": "ما أهمية تطوير مجاهر ذات قوة تكبير عالية؟", "options": ["أ. تجعل الخلايا أكبر حجمًا في الحقيقة", "ب. تحوّل العناصر إلى مركّبات", "ج. تُظهر تفاصيل الخلايا التي لا تُرى بالعين المجردة", "د. تصنع خلايا جديدة"], "answer": 2, "answerText": "ج. تُظهر تفاصيل الخلايا التي لا تُرى بالعين المجردة", "explain": "معظم الخلايا لا تُرى بالعين المجردة، ومع تقدم صناعة المجاهر وتحسينها ازداد فهمنا لتركيب الخلية.", "why": {"0": "المجهر يكبّر الصورة فقط، ولا يغيّر حجم الخلية.", "1": "المجهر أداة للرؤية، لا يغيّر المواد.", "3": "الخلايا تنتج عن خلايا موجودة، لا عن المجهر."}, "evp": 25, "back": "L01-s2", "section": "اختر الإجابة الصحيحة", "qa": "v790db05f4785", "ea": "vc02014bc778c", "wa": null, "ha": null, "whyA": {"0": "v2ce7940e8b09", "1": "vfb4ff5822813", "3": "v2082471635c2"}}, {"id": "L01-m3", "src": "L01-q3", "kept": false, "page": 26, "type": "mcq", "text": "لماذا يختلف مظهر كل نسيج عن الآخر؟", "options": ["أ. لأن كل نسيج يقوم بوظيفة مختلفة", "ب. لأن كل نسيج يتكوّن من خلية واحدة", "ج. لأن الأنسجة كلها تنقل الرسائل", "د. لأن الأنسجة لا تحتوي على خلايا"], "answer": 0, "answerText": "أ. لأن كل نسيج يقوم بوظيفة مختلفة", "explain": "في المخلوقات المتعددة الخلايا تقوم كل خلية بوظيفة خاصة؛ فالعضلي يحرّك، والعصبي ينقل الرسائل، والطلائي يغطي.", "why": {"1": "النسيج مجموعة من الخلايا المتشابهة، لا خلية واحدة.", "2": "النسيج العصبي وحده هو الذي ينقل الرسائل.", "3": "كل نسيج يتكوّن من خلايا متشابهة."}, "evp": 26, "back": "L01-s4", "fig": "f26a", "section": "اختر الإجابة الصحيحة", "qa": "v6f6536c5e759", "ea": "vc20990eb3410", "wa": null, "ha": null, "whyA": {"1": "vb4e0e0323243", "2": "v122944c46157", "3": "vdac70eece8a2"}}, {"id": "L01-m4", "src": "L01-q5", "kept": false, "page": 26, "type": "tf", "text": "يتكوّن النسيج العضلي من ألياف تحرّك العظام وتضخّ الدم.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "الكتاب: النسيج العضلي يتكوّن من ألياف تحرّك العظام وتضخّ الدم وتحرّك المواد في الجهاز الهضمي.", "why": {"1": "العبارة صحيحة كما في الكتاب ص٢٦."}, "evp": 26, "back": "L01-s4", "fig": "f26a", "section": "صح أم خطأ", "qa": "v20d6827fd7d5", "ea": "v80daedcee529", "wa": null, "ha": null, "whyA": {"1": "v7bf2f591bf82"}}, {"id": "L01-m5", "src": "L01-q6", "kept": false, "page": 27, "type": "mcq", "text": "لماذا يتخصص الأطباء في الأمراض التي تصيب نوعًا من الأعضاء أو الأنسجة؟", "options": ["أ. لأن جميع الأنسجة متشابهة تمامًا", "ب. لأن خلايا كل نسيج أو عضو تؤدي وظائف محددة", "ج. لأن الأعضاء تتكوّن من نسيج واحد فقط", "د. لأن الخلايا لا تقوم بأي وظيفة"], "answer": 1, "answerText": "ب. لأن خلايا كل نسيج أو عضو تؤدي وظائف محددة", "explain": "الكتاب: الخلايا التي تكوّن أنواعًا مختلفة من الأنسجة تؤدي وظائف محددة، فكل عضو أو نسيج يحتاج معرفة خاصة به.", "why": {"0": "الأنسجة مختلفة: عضلي وضام وعصبي وطلائي.", "2": "العضو يتكوّن من نسيجين مختلفين أو أكثر.", "3": "لكل خلية وظيفة خاصة في المخلوق المتعدد الخلايا."}, "evp": 27, "back": "L01-s6", "section": "اختر الإجابة الصحيحة", "qa": "v6866e293a2cc", "ea": "v0a46e99e1ca7", "wa": null, "ha": null, "whyA": {"0": "v1f5e82772c81", "2": "vd775a942110f", "3": "v577bc28c1074"}}, {"id": "L01-m6", "src": "L01-q7", "kept": false, "page": 27, "type": "mcq", "text": "ما الترتيب الصحيح لمستويات التنظيم في المخلوقات الحية المتعددة الخلايا؟", "options": ["أ. الأنسجة ← الخلايا ← الأعضاء ← الأجهزة ← المخلوق الحي", "ب. الخلايا ← الأعضاء ← الأنسجة ← الأجهزة ← المخلوق الحي", "ج. الخلايا ← الأنسجة ← الأجهزة ← الأعضاء ← المخلوق الحي", "د. الخلايا ← الأنسجة ← الأعضاء ← الأجهزة ← المخلوق الحي"], "answer": 3, "answerText": "د. الخلايا ← الأنسجة ← الأعضاء ← الأجهزة ← المخلوق الحي", "explain": "الخلايا المتشابهة تكوّن الأنسجة، والأنسجة تكوّن الأعضاء، والأعضاء تكوّن الأجهزة، والأجهزة تكوّن المخلوق الحي.", "why": {"0": "الخلية هي أصغر مستوى، فهي أولًا قبل النسيج.", "1": "النسيج يأتي قبل العضو؛ فالعضو مكوّن من أنسجة.", "2": "العضو يأتي قبل الجهاز؛ فالجهاز مجموعة أعضاء."}, "evp": 27, "back": "L01-s5", "section": "اختر الإجابة الصحيحة", "qa": "v3dd215c35a04", "ea": "v1ee828be4e05", "wa": null, "ha": null, "whyA": {"0": "v879f3d510861", "1": "vbb62c1624a6a", "2": "v01e080b7e58f"}}, {"id": "L01-m7", "src": "L01-q8", "kept": false, "page": 27, "type": "mcq", "text": "ماذا يحدث لو لم يوجد أحد الأجهزة الحيوية في المخلوق الحي؟", "options": ["أ. لا يتأثر المخلوق الحي أبدًا", "ب. يتحوّل المخلوق إلى مخلوق وحيد الخلية", "ج. لا يستطيع المخلوق أداء الوظيفة التي يقوم بها ذلك الجهاز", "د. تقوم الخلية الواحدة بكل وظائف الجهاز"], "answer": 2, "answerText": "ج. لا يستطيع المخلوق أداء الوظيفة التي يقوم بها ذلك الجهاز", "explain": "الأجهزة الحيوية تقوم بالوظائف الأساسية للحياة؛ فإذا غاب جهاز لم تُؤدَّ وظيفته، مثل نقل الأكسجين والغذاء في جهاز الدوران.", "why": {"0": "كل جهاز يؤدي وظيفة أساسية للحياة، فغيابه يؤثر.", "1": "المخلوق المتعدد الخلايا لا يتحوّل إلى وحيد الخلية.", "3": "في المخلوق المتعدد الخلايا تقوم كل خلية بوظيفة خاصة فقط."}, "evp": 27, "back": "L01-s5", "section": "اختر الإجابة الصحيحة", "qa": "va8e4110406c4", "ea": "v308f949e1aa5", "wa": null, "ha": null, "whyA": {"0": "vd22cac77f699", "1": "v8c304d124b2e", "3": "v3a9117e67476"}}, {"id": "L01-m8", "src": "L01-q9", "kept": false, "page": 28, "type": "mcq", "text": "أقرأ الشكل: ما المادتان اللتان تشكّلان ربع مكوّنات خلية الإنسان؟", "options": ["أ. البروتينات والدهون", "ب. الماء والبروتينات", "ج. الكربوهيدرات والأحماض النووية", "د. الدهون والكربوهيدرات"], "answer": 0, "answerText": "أ. البروتينات والدهون", "explain": "في الشكل: البروتينات ١٥٪ + الدهون ١٠٪ = ٢٥٪، أي الربع.", "why": {"1": "الماء وحده ٧٠٪، وهذا أكثر بكثير من الربع.", "2": "الكربوهيدرات ١٪ والأحماض النووية ٤٪ = ٥٪ فقط.", "3": "الدهون ١٠٪ والكربوهيدرات ١٪ = ١١٪ فقط."}, "evp": 28, "back": "L01-s8", "fig": "f28b", "section": "اختر الإجابة الصحيحة", "qa": "v7caa363f61ad", "ea": "vd4aa4578080c", "wa": null, "ha": null, "whyA": {"1": "v459f9688c7da", "2": "vdcf3a8628010", "3": "v164cc9313253"}}, {"id": "L01-m9", "src": "L01-q10", "kept": false, "page": 28, "type": "mcq", "text": "ما الوحدات البنائية للمركّبات كلها؟", "options": ["أ. الخلايا", "ب. الأنسجة", "ج. العناصر", "د. الأعضاء"], "answer": 2, "answerText": "ج. العناصر", "explain": "المركّب مادة تتكوّن باتحاد كيميائي بين عنصرين أو أكثر؛ فالعناصر هي وحداته البنائية.", "why": {"0": "الخلايا وحدات بناء المخلوقات الحية، لا المركّبات.", "1": "الأنسجة تتكوّن من خلايا، لا تكوّن المركّبات.", "3": "الأعضاء مستوى من مستويات التنظيم في المخلوق الحي."}, "evp": 28, "back": "L01-s7", "section": "اختر الإجابة الصحيحة", "qa": "v9b674eef4505", "ea": "v027880faade5", "wa": null, "ha": null, "whyA": {"0": "vafe83d26f64e", "1": "v08fea6360f38", "3": "v9620e5db4ded"}}, {"id": "L01-m10", "src": "L01-q11", "kept": false, "page": 28, "type": "mcq", "text": "كيف يشبه المركّب النسيج؟", "options": ["أ. كلاهما يتكوّن من نوع واحد من الذرات", "ب. كلاهما يتكوّن من وحدات أصغر تجتمع معًا", "ج. كلاهما لا يمكن تجزئته إلى أبسط منه", "د. كلاهما أكبر مستويات التنظيم"], "answer": 1, "answerText": "ب. كلاهما يتكوّن من وحدات أصغر تجتمع معًا", "explain": "النسيج مجموعة خلايا متشابهة، والمركّب اتحاد عنصرين أو أكثر؛ فكلاهما مكوّن من وحدات أصغر.", "why": {"0": "العنصر هو الذي يتكوّن من نوع واحد من الذرات.", "2": "العنصر هو الذي لا يمكن تجزئته إلى مواد أبسط.", "3": "أكبر مستوى هو المخلوق الحي."}, "evp": 28, "back": "L01-s7", "section": "اختر الإجابة الصحيحة", "qa": "v415c2da4c2bd", "ea": "ve5f30094359d", "wa": null, "ha": null, "whyA": {"0": "vf9c846e69c3c", "2": "v2e822efdce76", "3": "vd54066830069"}}, {"id": "L01-m11", "src": "L01-q12", "kept": false, "page": 29, "type": "mcq", "text": "مجموعة الخلايا المتشابهة التي تؤدي الوظيفة نفسها تُسمّى:", "options": ["أ. العضو", "ب. الجهاز الحيوي", "ج. المركّب", "د. النسيج"], "answer": 3, "answerText": "د. النسيج", "explain": "الكتاب: تقوم مجموعة الخلايا المتشابهة معًا بالوظيفة نفسها، وتشكّل نسيجًا.", "why": {"0": "العضو نسيجان مختلفان أو أكثر.", "1": "الجهاز الحيوي مجموعة أعضاء.", "2": "المركّب اتحاد عنصرين أو أكثر، وليس خلايا."}, "evp": 26, "back": "L01-s4", "section": "اختر الإجابة الصحيحة", "qa": "vd4b601989f69", "ea": "vb6e19a8495d0", "wa": null, "ha": null, "whyA": {"0": "ve582726f878a", "1": "v40d6847660e6", "2": "v575af5dbd5ca"}}, {"id": "L01-m12", "src": "L01-q13", "kept": false, "page": 29, "type": "tf", "text": "في مستويات التنظيم يأتي العضو قبل النسيج.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "الصحيح: النسيج يأتي قبل العضو؛ لأن العضو يتكوّن من نسيجين مختلفين أو أكثر.", "why": {"0": "العضو مكوّن من أنسجة، فالنسيج يسبقه."}, "evp": 29, "back": "L01-s5", "fig": "f29b", "section": "صح أم خطأ", "qa": "v248faf0e3973", "ea": "vaa9629ec8247", "wa": null, "ha": null, "whyA": {"0": "v10d4579f14c0"}}, {"id": "L01-m13", "src": "L01-q14", "kept": false, "page": 25, "type": "tf", "text": "أدّى تقدم صناعة المجاهر وتحسينها إلى زيادة فهمنا لتركيب الخلية.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "الكتاب: ازداد فهمنا لتركيب الخلية عبر السنين مع تقدم صناعة المجاهر وتحسينها.", "why": {"1": "العبارة صحيحة كما في الكتاب ص٢٥."}, "evp": 25, "back": "L01-s2", "section": "صح أم خطأ", "qa": "v79b6d9cc0170", "ea": "vc8030c87a4c4", "wa": null, "ha": null, "whyA": {"1": "v3973c3cedf09"}}, {"id": "L01-m14", "src": "L01-q15", "kept": true, "page": 29, "type": "mcq", "text": "أختار الإجابة الصحيحة. يتكون الماء من الهيدروجين والأكسجين. كيف أصنف الماء؟", "options": ["أ. مركبٌ", "ب. ذرةٌ", "ج. عنصرٌ", "د. خليةٌ"], "answer": 0, "answerText": "أ. مركبٌ", "explain": "المركّب مادة تتكون باتحاد كيميائي بين عنصرين أو أكثر، والماء من الهيدروجين والأكسجين.", "why": {"1": "الذرة جسيم دقيق، والماء مكوّن من عنصرين متحدين.", "2": "العنصر من نوع واحد من الذرات، والماء من عنصرين.", "3": "الخلية وحدة المخلوقات الحية، والماء مادة."}, "evp": 28, "back": "L01-s7", "section": "اختر الإجابة الصحيحة", "qa": "v799b8d989da2", "ea": "vf5dbca4d3eb6", "wa": null, "ha": null, "whyA": {"1": "v761f5f4718ba", "2": "v1e71c7df1ded", "3": "v78bfb7c116ab"}}, {"id": "L01-m15", "src": "L01-q16", "kept": true, "page": 29, "type": "mcq", "text": "أختار الإجابة الصحيحة. ما القلب؟", "options": ["أ. نسيجٌ", "ب. جهازٌ", "ج. عضوٌ", "د. مخلوقٌ حيٌّ"], "answer": 2, "answerText": "ج. عضوٌ", "explain": "العضو مجموعة من نسيجين مختلفين أو أكثر تعمل معًا. والكتاب يقول: القلب عضو آخر.", "why": {"0": "القلب فيه أكثر من نسيج: عضلي وعصبي وضام.", "1": "الجهاز مجموعة أعضاء، والقلب عضو واحد منها.", "3": "القلب جزء من المخلوق الحي، لا مخلوق كامل."}, "evp": 26, "back": "L01-s5", "section": "اختر الإجابة الصحيحة", "qa": "vd3c8c712a2d9", "ea": "v215ed0c61633", "wa": null, "ha": null, "whyA": {"0": "vb74009dae9ac", "1": "vbde782bb141c", "3": "v2312e7aa3e96"}}, {"id": "L01-m16", "src": "L01-q17", "kept": false, "page": 26, "type": "tf", "text": "تنتظم الأنسجة في أجسام المخلوقات الحية لتشكّل الأعضاء.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "الكتاب: تنتظم الأنسجة في أجسام المخلوقات الحية لتشكّل الأعضاء.", "why": {"1": "العبارة صحيحة كما في الكتاب ص٢٦."}, "evp": 26, "back": "L01-s5", "section": "صح أم خطأ", "qa": "vc54eafe5d61a", "ea": "vad0f5f9981f5", "wa": null, "ha": null, "whyA": {"1": "v7bf2f591bf82"}}, {"id": "L01-m17", "src": "L01-q18", "kept": false, "page": 25, "type": "mcq", "text": "أيّ مما يلي من أفكار نظرية الخلية؟", "options": ["أ. تنتج الخلايا عن خلايا موجودة", "ب. جميع المخلوقات الحية تتكوّن من خلية واحدة فقط", "ج. النسيج هو الوحدة الأساسية للتركيب والوظيفة", "د. تنتج الخلايا عن مواد غير حية"], "answer": 0, "answerText": "أ. تنتج الخلايا عن خلايا موجودة", "explain": "أفكار النظرية الثلاث: المخلوقات من خلية أو أكثر، والخلية وحدة التركيب والوظيفة، وتنتج الخلايا عن خلايا موجودة.", "why": {"1": "النظرية تقول: من خلية أو أكثر، لا خلية واحدة فقط.", "2": "الخلية (لا النسيج) هي الوحدة الأساسية.", "3": "النظرية تقول: الخلايا تنتج عن خلايا موجودة."}, "evp": 25, "back": "L01-s2", "fig": "f29c", "section": "اختر الإجابة الصحيحة", "qa": "v23e39dfef8b8", "ea": "v2d3ea7f49595", "wa": null, "ha": null, "whyA": {"1": "v73ff2bb192f7", "2": "vf0b68ca746c9", "3": "v044062185bd2"}}, {"id": "L01-m18", "src": "L01-q19", "kept": false, "page": 28, "type": "mcq", "text": "لماذا يحتاج جسم الإنسان إلى البروتينات؟", "options": ["أ. لأنها تكسب النبات لونه الأخضر", "ب. لأنها أكثر مادة في الخلية", "ج. لأنها تتكوّن من نوع واحد من الذرات", "د. لأنها ضرورية لنمو الخلايا وتجديدها"], "answer": 3, "answerText": "د. لأنها ضرورية لنمو الخلايا وتجديدها", "explain": "الكتاب: البروتينات مركّبات من الكربون والهيدروجين والأكسجين والنيتروجين، وهي ضرورية لنمو الخلايا وتجديدها.", "why": {"0": "الكلوروفيل هو الذي يكسب النبات لونه الأخضر.", "1": "الماء هو الأكثر (٧٠٪)، والبروتينات ١٥٪.", "2": "البروتينات مركّبات من عدة عناصر."}, "evp": 28, "back": "L01-s8", "section": "اختر الإجابة الصحيحة", "qa": "ve74262ac4b53", "ea": "v4825fd1092e2", "wa": null, "ha": null, "whyA": {"0": "v15ff1a97dbb5", "1": "v797a0d8f3d8c", "2": "v46c40a4ddbf7"}}, {"id": "L01-m19", "src": "point", "kept": false, "page": 24, "type": "mcq", "text": "مَن أول من شاهد الخلية وأطلق عليها اسم الخلية؟", "options": ["أ. ليفنهوك", "ب. روبرت هوك", "ج. شلايدن", "د. شفان"], "answer": 1, "answerText": "ب. روبرت هوك", "explain": "العالم الإنجليزي روبرت هوك شاهد جدران نسيج الفلين عام ١٦٦٥م وسمّاها خلايا.", "why": {"0": "ليفنهوك أول من شاهد مخلوقات وحيدة الخلية.", "2": "شلايدن استنتج أن النباتات كلها من خلايا.", "3": "شفان اكتشف أن الحيوانات كلها من خلايا."}, "evp": 24, "back": "L01-s1", "fig": "f24a", "section": "اختر الإجابة الصحيحة", "qa": "vb9bfb5c32542", "ea": "v38f42fb33cad", "wa": null, "ha": null, "whyA": {"0": "v669c8123bc28", "2": "v1f8411047dd4", "3": "v9ee732ff5fd0"}}, {"id": "L01-m20", "src": "point", "kept": false, "page": 24, "type": "tf", "text": "كانت قوة تكبير مجهر ليفنهوك أقل من قوة تكبير مجهر روبرت هوك.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "الصحيح: قوة تكبير مجهر ليفنهوك أكبر تسع مرات من قوة تكبير مجهر هوك.", "why": {"0": "مجهر ليفنهوك كان أقوى تسع مرات."}, "evp": 24, "back": "L01-s1", "section": "صح أم خطأ", "qa": "v3bbd7ec44ae0", "ea": "v6fd8e08de70c", "wa": null, "ha": null, "whyA": {"0": "vc268d7dc0979"}}, {"id": "L01-m21", "src": "point", "kept": false, "page": 25, "type": "mcq", "text": "مَن العالم الذي اكتشف نواة الخلية النباتية عام ١٨٣١م؟", "options": ["أ. شفان", "ب. ليفنهوك", "ج. روبرت براون", "د. روبرت هوك"], "answer": 2, "answerText": "ج. روبرت براون", "explain": "الكتاب: في عام ١٨٣١م اكتشف العالم الإسكتلندي روبرت براون نواة الخلية النباتية.", "why": {"0": "شفان اكتشف أن الحيوانات كلها من خلايا.", "1": "ليفنهوك شاهد مخلوقات وحيدة الخلية.", "3": "هوك شاهد خلايا الفلين وسمّاها."}, "evp": 25, "back": "L01-s2", "section": "اختر الإجابة الصحيحة", "qa": "v5c83d113d0e5", "ea": "v3fbfde066221", "wa": null, "ha": null, "whyA": {"0": "v9ee732ff5fd0", "1": "v3850f273ca82", "3": "v1606218ba5ce"}}, {"id": "L01-m22", "src": "point", "kept": false, "page": 25, "type": "tf", "text": "الخلايا هي الوحدة الأساسية للتركيب والوظيفة في المخلوقات الحية جميعها.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "هذه إحدى أفكار نظرية الخلية الثلاث في الكتاب.", "why": {"1": "العبارة صحيحة كما في الكتاب ص٢٥."}, "evp": 25, "back": "L01-s2", "section": "صح أم خطأ", "qa": "ve954f03b4181", "ea": "v2c57156ecacd", "wa": null, "ha": null, "whyA": {"1": "v3973c3cedf09"}}, {"id": "L01-m23", "src": "point", "kept": false, "page": 25, "type": "mcq", "text": "أيّ المخلوقات التالية وحيد الخلية؟", "options": ["أ. الإنسان", "ب. مستعمرة الفولفكس", "ج. الضفدع", "د. البراميسيوم"], "answer": 3, "answerText": "د. البراميسيوم", "explain": "الكتاب: البكتيريا والبراميسيوم واليوجلينا مخلوقات وحيدة الخلية.", "why": {"0": "جسم الإنسان مكوّن من خلايا كثيرة مختلفة.", "1": "مستعمرة الفولفكس قد تحتوي على أكثر من ٥٠٠ خلية.", "2": "الضفدع مخلوق عديد الخلايا."}, "evp": 25, "back": "L01-s3", "fig": "f25b", "section": "اختر الإجابة الصحيحة", "qa": "vae0d21573629", "ea": "v81eb71872a99", "wa": null, "ha": null, "whyA": {"0": "v274cc6e07875", "1": "v07bedddd89c9", "2": "vbe654b6c5e78"}}, {"id": "L01-m24", "src": "point", "kept": false, "page": 26, "type": "tf", "text": "العظام والغضاريف من أمثلة النسيج العصبي.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "الصحيح: العظام والغضاريف والدهون والدم من النسيج الضام، أما العصبي فينقل الرسائل.", "why": {"0": "العظام والغضاريف نسيج ضام."}, "evp": 26, "back": "L01-s4", "fig": "f26a", "section": "صح أم خطأ", "qa": "v020429ec4173", "ea": "vd73028682d6d", "wa": null, "ha": null, "whyA": {"0": "vd265d089f85d"}}, {"id": "L01-m25", "src": "point", "kept": false, "page": 26, "type": "mcq", "text": "ما أكبر عضو في جسم الإنسان؟", "options": ["أ. الجلد", "ب. القلب", "ج. الدماغ", "د. الرئة"], "answer": 0, "answerText": "أ. الجلد", "explain": "الكتاب: الجلد أكبر عضو في جسم الإنسان.", "why": {"1": "القلب عضو، لكنه ليس الأكبر.", "2": "الدماغ عضو، لكنه ليس الأكبر.", "3": "الرئة عضو، لكنها ليست الأكبر."}, "evp": 26, "back": "L01-s5", "section": "اختر الإجابة الصحيحة", "qa": "v71524247db35", "ea": "vab254d845f85", "wa": null, "ha": null, "whyA": {"1": "v1adcce48b003", "2": "v01ac72ba1b96", "3": "v4993f56a93ad"}}, {"id": "L01-m26", "src": "point", "kept": false, "page": 26, "type": "mcq", "text": "ما عضو النبات الذي يمتص الماء والأملاح المعدنية من التربة؟", "options": ["أ. الساق", "ب. الجذر", "ج. الورقة", "د. الزهرة"], "answer": 1, "answerText": "ب. الجذر", "explain": "الكتاب: الجذر من وظائفه امتصاص الماء والأملاح المعدنية من التربة.", "why": {"0": "الساق يدعم النبات ويحمل الأوراق والأزهار.", "2": "الورقة تقوم بالبناء الضوئي.", "3": "الزهرة عضو التكاثر الجنسي."}, "evp": 26, "back": "L01-s5", "section": "اختر الإجابة الصحيحة", "qa": "vce03474f02a0", "ea": "va5c63851b879", "wa": null, "ha": null, "whyA": {"0": "v0a4b6715f309", "2": "v4d6006311cae", "3": "va6a19900ed61"}}, {"id": "L01-m27", "src": "point", "kept": false, "page": 27, "type": "tf", "text": "يتكوّن جهاز الدوران من القلب والأوعية الدموية والرئتين.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "الصحيح: جهاز الدوران يتكوّن من القلب والأوعية الدموية والدم. والرئتان من الجهاز التنفسي.", "why": {"0": "الرئتان من الجهاز التنفسي، لا من جهاز الدوران."}, "evp": 27, "back": "L01-s5", "fig": "f27a", "section": "صح أم خطأ", "qa": "v7caeebcdbc79", "ea": "vf3df11271363", "wa": null, "ha": null, "whyA": {"0": "vaed7c88f7c23"}}, {"id": "L01-m28", "src": "point", "kept": false, "page": 29, "type": "tf", "text": "مستويات التنظيم في المخلوقات الحية ثلاثة فقط.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "الصحيح: هي خمسة: الخلايا، والأنسجة، والأعضاء، والأجهزة، والمخلوقات الحية.", "why": {"0": "الكتاب يذكر خمسة مستويات."}, "evp": 29, "back": "L01-s9", "fig": "f29a", "section": "صح أم خطأ", "qa": "v227bd29b3029", "ea": "vc28a5c288bd2", "wa": null, "ha": null, "whyA": {"0": "vae5b05c11c63"}}, {"id": "L01-m29", "src": "point", "kept": false, "page": 28, "type": "tf", "text": "يتكوّن العنصر الواحد من عدة أنواع مختلفة من الذرات.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "الصحيح: يتكوّن العنصر الواحد من نوع واحد من الذرات لها التركيب نفسه.", "why": {"0": "العنصر من نوع واحد فقط من الذرات."}, "evp": 28, "back": "L01-s7", "section": "صح أم خطأ", "qa": "vd080b134bfe9", "ea": "v7d7a51554c7e", "wa": null, "ha": null, "whyA": {"0": "v0bb35a8bf439"}}, {"id": "L01-m30", "src": "point", "kept": false, "page": 28, "type": "mcq", "text": "أيّ المركّبات التالية تختزن وتحرّر طاقة أكبر من الكربوهيدرات؟", "options": ["أ. البروتينات", "ب. الأحماض النووية", "ج. الدهون", "د. الماء"], "answer": 2, "answerText": "ج. الدهون", "explain": "الكتاب: تختزن الدهون وتحرّر طاقة أكبر من الكربوهيدرات؛ وذلك بسبب تركيبها.", "why": {"0": "البروتينات ضرورية لنمو الخلايا وتجديدها.", "1": "الأحماض النووية تساعد على بناء البروتينات.", "3": "الكتاب لم يذكر الماء مصدرًا للطاقة."}, "evp": 28, "back": "L01-s8", "section": "اختر الإجابة الصحيحة", "qa": "vded76a05e4c8", "ea": "v82e3dc34448c", "wa": null, "ha": null, "whyA": {"0": "v1271487d799d", "1": "vcfa208f07874", "3": "va642dc69f074"}}, {"id": "L01-m31", "src": "point", "kept": false, "page": 28, "type": "tf", "text": "تساعد الأحماض النووية الخلايا على بناء بروتيناتها.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "الكتاب: الأحماض النووية مركّبات من الأكسجين والكربون والهيدروجين والنيتروجين والفوسفور، تساعد الخلايا على بناء بروتيناتها.", "why": {"1": "العبارة صحيحة كما في الكتاب ص٢٨."}, "evp": 28, "back": "L01-s8", "section": "صح أم خطأ", "qa": "v83bf8521b062", "ea": "v9905e3015715", "wa": null, "ha": null, "whyA": {"1": "v0511688f1c5c"}}, {"id": "L01-m32", "src": "point", "kept": false, "page": 28, "type": "mcq", "text": "أقرأ الشكل: ما المادة الأكثر في خلايا الإنسان؟", "options": ["أ. البروتينات", "ب. الماء", "ج. الدهون", "د. الكربوهيدرات"], "answer": 1, "answerText": "ب. الماء", "explain": "في شكل مكوّنات خلايا الإنسان: الماء ٧٠٪، وهو الأكبر.", "why": {"0": "البروتينات ١٥٪ فقط.", "2": "الدهون ١٠٪ فقط.", "3": "الكربوهيدرات ١٪ فقط."}, "evp": 28, "back": "L01-s8", "fig": "f28b", "section": "اختر الإجابة الصحيحة", "qa": "vf4476a1597ef", "ea": "vfaf9b696e92f", "wa": null, "ha": null, "whyA": {"0": "v2e771dd30b12", "2": "v6f08c3a05162", "3": "v126277f6249c"}}]}, {"id": "L02", "unit": "الوحدة الأولى: تنوّع الحياة", "chapter": "الفصل الأول: الخلايا", "name": "التركيز على المهارات: الملاحظة", "pages": [30, 31], "note": "صفحتا مهارة بعد الدرس الأول: نتعلّم فيهما مهارة الملاحظة بتجربة شرائح البطاطس.", "sections": [{"id": "L02-s1", "page": 30, "title": "مهارة الاستقصاء: الملاحظة", "book": "تحاط كل خلية بغشاء أو غطاء رقيق يسمح للغذاء بالدخول إليها، ويسمح للفضلات بالخروج منها. ويعرف العلماء الكثير من المعلومات حول طريقة عمل الخلايا، ولكنهم يطمحون دائمًا إلى معرفة المزيد. وأول طريقة للمعرفة هي ملاحظة الخلايا في أثناء حدوث انتقال الماء بالخاصية الأسموزية. ما الذي يحدث للخلايا عندما يتحرك الماء من منطقة ذات تركيز أملاح منخفض إلى منطقة ذات تركيز أملاح مرتفع؟\nأتعلم\nعندما ألاحظ أستعمل حاسة أو أكثر لتحديد شيء ما أو لتعرفه. ومن المهم تسجيل ملاحظاتي أو أي قياسات أخرى قد أجريتها. ومن المستحسن تنظيم هذه البيانات في جدول أو رسم بياني. وبهذه الطريقة أستطيع مشاهدة المعلومات المتوافرة في لمحة واحدة.", "simple": "كل خلية يحيط بها غشاء رقيق. الغشاء يُدخل الغذاء ويُخرج الفضلات. العلماء يتعلّمون عن الخلايا بالملاحظة. والملاحظة أن أستعمل حواسّي، ثم أسجّل ما أرى في جدول.", "steps": [{"q": "ماذا أرى؟", "t": "صورة خلايا البطاطس تحت المجهر.", "fig": "f30a", "parts": [], "a": "v4c5d3923f56e"}, {"q": "ما الفكرة؟", "t": "كل خلية يحيط بها غشاء أو غطاء رقيق.", "a": "ve2feee67e72b"}, {"q": "ماذا يفعل الغشاء؟", "t": "يسمح للغذاء بالدخول، ويسمح للفضلات بالخروج.", "a": "vf8b34cb9f078"}, {"q": "ما الملاحظة؟", "t": "أستعمل حاسة أو أكثر لأتعرّف شيئًا ما.", "a": "v681d2a7dfb55"}, {"q": "كيف أنظّم ملاحظاتي؟", "t": "أسجّلها في جدول أو رسم بياني، فأرى المعلومات في لمحة واحدة.", "a": "vb47fd0a49007"}, {"q": "الفكرة المهمة", "t": "سنلاحظ ماذا يحدث للخلايا عندما ينتقل الماء بالخاصية الأسموزية.", "a": "vded7bcd76a10"}], "figs": ["f30a"], "key": "الملاحظة استعمال الحواس لتعرّف الأشياء، مع تسجيل الملاحظات وتنظيمها في جدول.", "sa": "vb3ee81dad6db"}, {"id": "L02-s2", "page": 30, "title": "أجرب", "book": "المواد والأدوات: دورقان أو كأسان زجاجيان، ورق تنشيف، شريحتان من البطاطس، مسطرة مترية، ماء، ملعقة، ملح، سكر، بطاقتا فهرس، ساعة إيقاف.\n١ ألصق على الكأس الأول عبارة (ماء عذب)، وعلى الكأس الأخرى (ماء مالح).\n٢ أضع كل شريحة بطاطس على ورقة تنشيف، وأرسم خطًا حولها.\n٣ أوجد قياس قطر كل شريحة من البطاطس إلى أقرب ملمتر، وأسجل القيم في الجدول كما هو موضح.\n٤ أصب الماء العذب في كل كأس، ثم أضيف ٣ ملاعق من الملح إلى الكأس التي تحمل عنوان (ماء مالح).", "simple": "نُجهّز كأسين: ماء عذب، وماء مالح. نرسم حول كل شريحة بطاطس ونقيس قطرها. ثم نضيف الملح إلى كأس الماء المالح.", "steps": [{"q": "ماذا أحتاج؟", "t": "كأسين، وشريحتي بطاطس، ومسطرة، وماء، وملح، وساعة إيقاف.", "a": "vccd977b48521"}, {"q": "الخطوة ١", "t": "أكتب على كأس «ماء عذب»، وعلى الأخرى «ماء مالح».", "a": "vaa96192329f6"}, {"q": "الخطوة ٢", "t": "أضع كل شريحة على ورقة تنشيف، وأرسم خطًّا حولها.", "fig": "f30b", "parts": [], "a": "v469aac52287f"}, {"q": "الخطوة ٣", "t": "أقيس قطر كل شريحة بالملمتر، وأسجّله في الجدول.", "a": "vfa3a47af49a8"}, {"q": "الخطوة ٤", "t": "أصبّ الماء العذب في الكأسين، وأضيف ٣ ملاعق ملح إلى كأس الماء المالح.", "fig": "f30c", "parts": [], "a": "v68dc9aa8eb2f"}], "figs": ["f30b", "f30c"], "key": "نقارن شريحتين من البطاطس: واحدة في ماء عذب، وأخرى في ماء مالح.", "sa": "v6962b9417414"}, {"id": "L02-s3", "page": 31, "title": "بناء المهارة", "book": "٥ أضع شريحة بطاطس في قاع كل كأس، ثم أغطي الكأس ببطاقة فهرس، ثم أترك الكأسين من دون تحريك عشرين دقيقة.\n٦ أخرج شريحة البطاطس من كل كأس، وأضعها فوق الرسم الذي رسمته من قبل، ثم أقيس قطر كل شريحة. ماذا ألاحظ؟\n٧ أسجل في الجدول الملاحظات والقيم الجديدة على قطر كل شريحة.", "simple": "نترك الشريحتين في الكأسين عشرين دقيقة. ثم نضع كل شريحة فوق رسمها ونقيس قطرها. ونسجّل القيم والملاحظات في الجدول.", "steps": [{"q": "الخطوة ٥", "t": "أضع شريحة في كل كأس، وأغطي الكأس، وأنتظر عشرين دقيقة.", "a": "v8f53d36c61ca"}, {"q": "الخطوة ٦", "t": "أُخرج الشريحتين، وأضع كل واحدة فوق رسمها، وأقيس قطرها.", "a": "v574d44e53874"}, {"q": "الخطوة ٧", "t": "أسجّل القيم الجديدة وملاحظاتي في الجدول.", "fig": "f31a", "parts": [], "a": "va330d4a87001"}, {"q": "كيف أقرأ الجدول؟", "t": "لكل كأس ثلاثة قياسات: في البداية، وبعد ٢٠ دقيقة، وبعد ٢٤ ساعة.", "a": "vc1d623ee1933"}, {"q": "الفكرة المهمة", "t": "القياس والتسجيل المنظّم يجعلان المقارنة سهلة وواضحة.", "a": "vf073bcab84b8"}], "figs": ["f31a"], "key": "نسجّل قطر كل شريحة في أوقات مختلفة لنلاحظ أثر الماء العذب والماء المالح.", "sa": "v64b61bd149af"}], "questions": [{"id": "L02-q1", "page": 30, "section": "مهارة الاستقصاء: الملاحظة", "type": "explain", "text": "ما الذي يحدث للخلايا عندما يتحرك الماء من منطقة ذات تركيز أملاح منخفض إلى منطقة ذات تركيز أملاح مرتفع؟", "options": [], "answer": null, "answerText": "في الماء المالح يخرج الماء من الخلايا فتنكمش وتصبح طرية. وفي الماء العذب يدخل الماء إليها فتتماسك.", "why": {}, "what": "ماذا يحدث للخلايا إذا خرج منها الماء أو دخل إليها؟", "hint": "تذكّر: الماء يتحرك نحو المكان الذي فيه أملاح أكثر.", "explain": "الماء يتحرك من تركيز الأملاح المنخفض إلى المرتفع. فإذا كان الملح خارج الخلية أكثر، خرج الماء منها.", "solve": ["الماء المالح فيه أملاح أكثر من داخل خلايا البطاطس.", "إذن يخرج الماء من الخلايا إلى الماء المالح.", "فتنكمش الخلايا وتصبح الشريحة طرية.", "وفي الماء العذب يحدث العكس: يدخل الماء فتتماسك."], "keys": [{"t": "في الماء المالح يخرج الماء فتنكمش الخلايا", "alts": ["تنكمش", "يخرج", "طرية", "تذبل"]}, {"t": "في الماء العذب يدخل الماء فتتماسك", "alts": ["يدخل", "صلبة", "تتماسك", "تنتفخ"]}], "back": "L02-s1", "fig": null, "evp": 30, "oos": null, "left": [], "right": [], "items": [], "qa": "v052db214a520", "ea": "v93e38f69a290", "wa": "vd4e8fdd945e3", "ha": "v06e822093231", "whyA": {}}, {"id": "L02-q2", "page": 31, "section": "بناء المهارة", "type": "open", "text": "٦ أخرج شريحة البطاطس من كل كأس، وأضعها فوق الرسم الذي رسمته من قبل، ثم أقيس قطر كل شريحة. ماذا ألاحظ؟", "options": [], "answer": null, "answerText": "شريحة الماء العذب بقيت بحجم رسمها تقريبًا وصارت صلبة. وشريحة الماء المالح صغرت قليلًا وصارت طرية.", "why": {}, "what": "قارن حجم كل شريحة بالرسم الذي رسمته حولها قبل التجربة.", "hint": "انظر إلى حافة الشريحة: هل خرجت عن الخط أم صارت داخله؟", "explain": "الماء خرج من خلايا شريحة الماء المالح فصغرت، ودخل خلايا شريحة الماء العذب فتماسكت.", "solve": ["أضع كل شريحة فوق رسمها.", "أقيس القطر وأقارنه بالقياس الأول.", "أكتب الفرق في الجدول."], "keys": [{"t": "شريحة الماء المالح صغرت وصارت طرية", "alts": ["صغرت", "نقص", "طرية", "لينة", "انكمشت"]}, {"t": "شريحة الماء العذب بقيت صلبة", "alts": ["صلبة", "متماسكة", "كما هي", "كبرت"]}], "back": "L02-s3", "fig": "f31a", "evp": 31, "oos": null, "left": [], "right": [], "items": [], "qa": "v33a4a2ce7a2b", "ea": "v2e3670a905ef", "wa": "vc46046b77132", "ha": "vf0b487a06614", "whyA": {}}, {"id": "L02-q3", "page": 31, "section": "أطبق", "type": "short", "text": "١ ماذا ألاحظ على شريحة البطاطس التي وضعت في كأس الماء العذب؟", "options": [], "answer": null, "answerText": "أصبحت صلبة متماسكة، وبقي قطرها تقريبًا كما هو أو زاد قليلًا.", "why": {}, "what": "صف شريحة الماء العذب بعد التجربة: صلابتها وحجمها.", "hint": "في الماء العذب أملاح أقل من داخل الخلايا. إلى أين يتحرك الماء؟", "explain": "الماء دخل إلى خلايا البطاطس، فصارت الشريحة متماسكة.", "solve": ["الماء العذب فيه أملاح أقل.", "الماء يتحرك نحو الأملاح الأكثر، أي إلى داخل الخلايا.", "فتمتلئ الخلايا وتتماسك الشريحة."], "keys": [{"t": "صلبة متماسكة", "alts": ["صلبة", "متماسكة", "قاسية"]}, {"t": "القطر بقي أو زاد قليلًا", "alts": ["زاد", "كما هو", "لم يتغير", "كبر"]}], "back": "L02-s1", "fig": null, "evp": 30, "oos": null, "left": [], "right": [], "items": [], "qa": "v7b99784b0e4d", "ea": "vf33ad88687fa", "wa": "v8731fae2fe5d", "ha": "vf47cea7e99fa", "whyA": {}}, {"id": "L02-q4", "page": 31, "section": "أطبق", "type": "short", "text": "٢ ماذا ألاحظ على شريحة البطاطس التي وضعت في كأس الماء المالح؟", "options": [], "answer": null, "answerText": "أصبحت طرية لينة سهلة الثني، ونقص قطرها قليلًا.", "why": {}, "what": "صف شريحة الماء المالح بعد التجربة: صلابتها وحجمها.", "hint": "في الماء المالح أملاح أكثر من داخل الخلايا. إلى أين يتحرك الماء؟", "explain": "الماء خرج من خلايا البطاطس إلى الماء المالح، فانكمشت الشريحة.", "solve": ["الماء المالح فيه أملاح أكثر.", "الماء يخرج من الخلايا نحو الماء المالح.", "فتنكمش الخلايا وتلين الشريحة."], "keys": [{"t": "طرية لينة", "alts": ["طرية", "لينة", "تنثني", "رخوة"]}, {"t": "نقص قطرها", "alts": ["نقص", "صغر", "صغرت", "انكمشت"]}], "back": "L02-s1", "fig": null, "evp": 30, "oos": null, "left": [], "right": [], "items": [], "qa": "vc1fce7d52ac0", "ea": "vad21717f8b5c", "wa": "vea8acd5f9832", "ha": "va7878a9269c2", "whyA": {}}, {"id": "L02-q5", "page": 31, "section": "أطبق", "type": "open", "text": "٣ أضع شريحة من شرائح البطاطس مرة أخرى في كل كأس. وأغطي الكأس ببطاقة فهرس، وأتركها ٢٤ ساعة، ثم أخرج الشريحتين من الكأسين، وأقيس قطر كل منهما، وأضيف القيم الجديدة إلى الجدول.", "options": [], "answer": null, "answerText": "أسجّل قطر كل شريحة بعد ٢٤ ساعة. يكون التغيّر أوضح: شريحة الماء المالح أصغر وألين.", "why": {}, "what": "المطلوب أن تكرّر التجربة مدة أطول، ثم تقيس وتسجّل.", "hint": "استعمل صفّ «بعد ٢٤ ساعة» في الجدول.", "explain": "كلما طال الوقت انتقل ماء أكثر، فيظهر الفرق بين الشريحتين بوضوح.", "solve": ["أترك الشريحتين ٢٤ ساعة.", "أقيس قطر كل شريحة.", "أسجّل القيم في صف «بعد ٢٤ ساعة»."], "keys": [{"t": "أسجّل قطر كل شريحة بعد ٢٤ ساعة", "alts": ["اسجل", "الجدول", "قطر", "24", "٢٤"]}], "back": "L02-s3", "fig": "f31a", "evp": 31, "oos": null, "left": [], "right": [], "items": [], "qa": "v528025c7e614", "ea": "v5e16ebbe5ae4", "wa": "v18da7b6cb315", "ha": "v2cb3cbba9ab5", "whyA": {}}, {"id": "L02-q6", "page": 31, "section": "أطبق", "type": "explain", "text": "٤ أقارن القيم الجديدة بالقيم التي حصلت عليها من قبل. ماذا أستنتج بناء على ملاحظاتي؟", "options": [], "answer": null, "answerText": "كلما طال الوقت زاد التغيّر. الماء ينتقل عبر غشاء الخلية من تركيز الأملاح المنخفض إلى المرتفع (الخاصية الأسموزية).", "why": {}, "what": "قارن قياسات ٢٠ دقيقة بقياسات ٢٤ ساعة، ثم اكتب ما تتعلّمه منها.", "hint": "ارجع إلى سؤال الصفحة ٣٠ عن حركة الماء بين منطقتين.", "explain": "الماء خرج من خلايا شريحة الماء المالح فانكمشت، ودخل خلايا شريحة الماء العذب فتماسكت. وهذه هي الخاصية الأسموزية.", "solve": ["الدليل: التغيّر بعد ٢٤ ساعة أكبر منه بعد ٢٠ دقيقة.", "التفسير: الماء يستمر في الانتقال عبر غشاء الخلية.", "الاستنتاج: الماء يتحرك نحو تركيز الأملاح المرتفع."], "keys": [{"t": "كلما طال الوقت زاد التغيّر", "alts": ["الوقت", "زاد", "اكبر", "اوضح"]}, {"t": "الماء ينتقل من تركيز الأملاح المنخفض إلى المرتفع", "alts": ["الاسموزية", "ينتقل الماء", "من المنخفض", "تركيز"]}], "back": "L02-s1", "fig": null, "evp": 30, "oos": null, "left": [], "right": [], "items": [], "qa": "v2cd1dfd25bdb", "ea": "v18f596489a25", "wa": "vbfcba8e6129e", "ha": "v08c360a9c98f", "whyA": {}}, {"id": "L02-q7", "page": 31, "section": "أطبق", "type": "explain", "text": "٥ ما النتيجة التي أتوقعها إذا وضعت إحدى شرائح البطاطس في الكأس التي تحتوي ماء مالحًا، بينما وضعت شريحة البطاطس الأخرى في كأس تحتوي ماء وسكرًا؟ أنفذ هذه التجربة ثم ألاحظ ما يحدث. ما المعلومات الجديدة التي أتعلمها من ملاحظاتي؟", "options": [], "answer": null, "answerText": "أتوقع أن تنكمش الشريحتان وتصبحا طريتين. فالماء يخرج من الخلايا نحو المحلول الأكثر تركيزًا، ملحًا كان أو سكرًا.", "why": {}, "what": "توقّع ماذا يحدث لشريحة في ماء مالح، ولأخرى في ماء وسكر، ثم جرّب.", "hint": "فكّر: السكر مثل الملح، يذوب في الماء ويزيد تركيز المحلول.", "explain": "الماء يتحرك من المكان الأقل تركيزًا للمواد الذائبة إلى الأكثر تركيزًا، مهما كانت المادة الذائبة.", "solve": ["الدليل: في الماء المالح خرج الماء من الخلايا.", "التفسير: الماء مع السكر محلول مركّز أيضًا.", "الاستنتاج: سيخرج الماء من الشريحتين فتنكمشان."], "keys": [{"t": "تنكمش الشريحتان وتصبحان طريتين", "alts": ["تنكمش", "طرية", "الشريحتان", "كلتاهما"]}, {"t": "الماء يتحرك نحو المحلول الأكثر تركيزًا", "alts": ["اكثر تركيزا", "السكر", "يخرج الماء", "تركيز"]}], "back": "L02-s1", "fig": null, "evp": 30, "oos": null, "left": [], "right": [], "items": [], "qa": "v8a60f2035ad8", "ea": "v5462d456c0a0", "wa": "vd541911279a1", "ha": "v661a7f7d5ea7", "whyA": {}}], "terms": [], "points": [{"t": "كل خلية يحيط بها غشاء رقيق يسمح للغذاء بالدخول إليها وللفضلات بالخروج منها.", "page": 30, "sec": "L02-s1", "fig": "f30a", "parts": [], "a": "v0a6ee5f111d6"}, {"t": "الملاحظة: أستعمل حاسة أو أكثر لأحدد شيئًا أو أتعرفه، وأسجل ملاحظاتي وقياساتي في جدول أو رسم بياني.", "page": 30, "sec": "L02-s1", "fig": null, "parts": [], "a": "vd9bb83aa323f"}, {"t": "التجربة: شريحتا بطاطس، واحدة في ماء عذب وأخرى في ماء مالح (٣ ملاعق ملح)، عشرين دقيقة، ثم أقيس قطر كل شريحة.", "page": 31, "sec": "L02-s3", "fig": "f31a", "parts": [], "a": "v40428dc023ad"}], "quiz": [{"id": "L02-m1", "src": "L02-q1", "kept": false, "page": 30, "type": "mcq", "text": "ما الذي يحدث للخلايا عندما يتحرك الماء منها إلى منطقة ذات تركيز أملاح مرتفع؟", "options": ["أ. يدخلها الماء فتصبح أكثر صلابة", "ب. يخرج الماء منها فتنكمش", "ج. تصنع غذاءها بالبناء الضوئي", "د. لا يحدث لها أي تغيّر"], "answer": 1, "answerText": "ب. يخرج الماء منها فتنكمش", "explain": "عندما يخرج الماء من الخلايا أكثر مما يدخل إليها تنكمش أجزاؤها الداخلية (ص٣٧)، لذلك تصبح شريحة البطاطس في الماء المالح طرية.", "why": {"0": "الماء هنا يخرج من الخلايا، لا يدخلها.", "2": "البناء الضوئي لا علاقة له بالماء المالح.", "3": "خروج الماء يغيّر الخلايا فتنكمش."}, "evp": 37, "back": "L02-s1", "section": "اختر الإجابة الصحيحة", "qa": "va5e538a88729", "ea": "v97b82d04de0c", "wa": null, "ha": null, "whyA": {"0": "v3931f9b423b6", "2": "va05f125a056e", "3": "v81051cbe0d0e"}}, {"id": "L02-m2", "src": "L02-q3", "kept": false, "page": 31, "type": "mcq", "text": "ماذا يحدث لشريحة البطاطس التي توضع في كأس الماء العذب؟", "options": ["أ. يخرج الماء من خلاياها فتصبح طرية", "ب. يدخلها الملح فتذوب", "ج. يدخل الماء إلى خلاياها فتبقى متماسكة", "د. تتحول خلاياها إلى خلايا حيوانية"], "answer": 2, "answerText": "ج. يدخل الماء إلى خلاياها فتبقى متماسكة", "explain": "تركيز الماء في الكأس أعلى منه في خلايا البطاطس، فينتقل الماء إلى داخل الخلايا بالخاصية الأسموزية فتتماسك الشريحة.", "why": {"0": "هذا ما يحدث في الماء المالح، لا العذب.", "1": "لا يوجد ملح في كأس الماء العذب.", "3": "خلايا البطاطس خلايا نباتية ولا تتحول."}, "evp": 36, "back": "L02-s1", "section": "اختر الإجابة الصحيحة", "qa": "vaa4fffccae0c", "ea": "v46ceda704167", "wa": null, "ha": null, "whyA": {"0": "vfd5eb4fc10f6", "1": "vc0503b6b4721", "3": "v3ebaf34f69f9"}}, {"id": "L02-m3", "src": "L02-q4", "kept": false, "page": 31, "type": "tf", "text": "شريحة البطاطس في الماء المالح يدخل الماء إلى خلاياها فتصبح أكثر صلابة.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "الصحيح: في الماء المالح يخرج الماء من خلايا البطاطس، فتنكمش وتصبح الشريحة طرية لينة.", "why": {"0": "الماء يخرج من الخلايا نحو الماء المالح."}, "evp": 37, "back": "L02-s1", "section": "صح أم خطأ", "qa": "v533b51aaca80", "ea": "v7fd32c1e9b30", "wa": null, "ha": null, "whyA": {"0": "v6edd325fe02e"}}, {"id": "L02-m4", "src": "L02-q6", "kept": false, "page": 31, "type": "mcq", "text": "ما اسم عملية انتقال الماء عبر غشاء خلايا البطاطس في هذه التجربة؟", "options": ["أ. النقل النشط", "ب. البناء الضوئي", "ج. البلعمة", "د. الخاصية الأسموزية"], "answer": 3, "answerText": "د. الخاصية الأسموزية", "explain": "الخاصية الأسموزية هي انتقال جزيئات الماء عبر الغشاء البلازمي (ص٣٦).", "why": {"0": "النقل النشط يحتاج طاقة، وانتقال الماء هنا لا يحتاجها.", "1": "البناء الضوئي صنع الغذاء بالضوء.", "2": "البلعمة إحاطة المواد الكبيرة بجيب."}, "evp": 36, "back": "L02-s1", "section": "اختر الإجابة الصحيحة", "qa": "v5de4e61711c8", "ea": "v54f44f7768fe", "wa": null, "ha": null, "whyA": {"0": "vf5c41fbcf14d", "1": "v49fada7673cd", "2": "vf58bc4ea86e3"}}, {"id": "L02-m5", "src": "L02-q7", "kept": false, "page": 31, "type": "tf", "text": "إذا وُضعت شريحة بطاطس في ماء فيه سكر كثير يخرج الماء من خلاياها كما في الماء المالح.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "الماء ينتقل من حيث تركيزه أكبر (داخل الخلايا) إلى حيث تركيزه أقل (الماء المحلّى أو المالح)، فتنكمش الشريحة في الحالتين.", "why": {"1": "السكر الكثير يقلّل تركيز الماء خارج الخلايا، فيخرج الماء منها."}, "evp": 36, "back": "L02-s1", "section": "صح أم خطأ", "qa": "v603c062e3d17", "ea": "ve5be7662c5b8", "wa": null, "ha": null, "whyA": {"1": "vcb54002ee916"}}]}, {"id": "L03", "unit": "الوحدة الأولى: تنوّع الحياة", "chapter": "الفصل الأول: الخلايا", "name": "الدرس الثاني: الخلية النباتية والخلية الحيوانية", "pages": [32, 41], "sections": [{"id": "L03-s1", "page": 32, "title": "أنظر وأتساءل", "book": "الخلايا هي الوحدات البنائية الأساسية للحياة. وتقوم الخلايا بوظائف محددة لمساعدة المخلوقات الحية على العيش، مثل هذا الضفدع، أو نبات عدس الماء. كيف يمكن المقارنة بين تركيب الخلية النباتية والخلية الحيوانية؟", "simple": "الخلايا هي الوحدات البنائية الأساسية للحياة. في الصورة ضفدع ونبات عدس الماء. كلاهما مكوّن من خلايا. سنقارن في هذا الدرس بين الخلية النباتية والخلية الحيوانية.", "steps": [{"q": "ماذا أرى؟", "t": "ضفدع (حيوان) بين نباتات عدس الماء (نبات).", "fig": "f32a", "parts": [], "a": "va675eeaa7ad0"}, {"q": "ما الفكرة؟", "t": "الخلايا هي الوحدات البنائية الأساسية للحياة.", "a": "vcda837f43fa3"}, {"q": "ماذا تفعل الخلايا؟", "t": "تقوم بوظائف محددة لتساعد المخلوق الحي على العيش.", "a": "v27465cd2f152"}, {"q": "سؤال الدرس", "t": "كيف نقارن بين تركيب الخلية النباتية والخلية الحيوانية؟", "a": "v13f250f4ded3"}], "figs": ["f32a"], "key": "الخلايا هي الوحدات البنائية الأساسية للحياة، في النبات وفي الحيوان.", "sa": "v47a4be191d02"}, {"id": "L03-s2", "page": 33, "title": "أستكشف: فيم تختلف الخلايا النباتية عن الخلايا الحيوانية؟", "book": "الهدف: الخلايا هي الوحدات البنائية الأساسية في المخلوقات الحية جميعها. كيف أقارن بين الخلايا النباتية والخلايا الحيوانية؟ أفحص خلايا من حيوانات ونباتات، وأحدد أوجه التشابه وأوجه الاختلاف بين النوعين.\nأحتاج إلى: شريحة مجهرية، قطارة، ملقط، ورقة نبات كالإلوديا أو البصل، غطاء شريحة، ماء، مجهر مركب، شريحة محضرة لخلايا، باطن خد الإنسان\nالخطوات\n١ أحضر شريحة رطبة لورقة نبات الإلوديا (نبات مائي)، مأخوذة من قمة النبات، وذلك بوضع قطرة ماء على شريحة زجاجية، ثم أستخدم الملقط لنزع ورقة من نبات الإلوديا، وأضعها فوق قطرة الماء، وأضع فوقها غطاء الشريحة.\n٢ ألاحظ أفحص الورقة باستخدام القوة الصغرى للمجهر مركزًا على أطراف الخلايا، وأدون ملاحظاتي حول خلية واحدة. ثم أستخدم القوة الكبرى للمجهر لأفحص مركز الخلية، وأرسم ما أشاهد. ثم أعيد العدسة الشيئية الصغرى إلى مكانها فوق الشريحة، وأنزع الشريحة عن منضدة المجهر.\n٣ ألاحظ أعيد الخطوة الثانية مستخدمًا شريحة محضرة لخلايا باطن الخد بدلًا من ورقة الإلوديا.\nأستخلص النتائج\n٤ أقارن أصف أوجه التشابه وأوجه الاختلاف بين خلايا الإلوديا وخلايا باطن الخد.\n٥ أفسر البيانات: كيف أفسر بعض أوجه التشابه والاختلاف بين هذه الخلايا؟\nأستكشف أكثر: أفحص شرائح محضرة لعينات خلايا أخرى. هل تتشابه الخلايا الجديدة مع خلايا نبات الإلوديا أو مع خلايا باطن الخد عند الإنسان؟ ولماذا؟", "simple": "نفحص بالمجهر خلايا ورقة نبات الإلوديا. ثم نفحص خلايا باطن الخد عند الإنسان. ونكتب أوجه التشابه وأوجه الاختلاف بينهما.", "steps": [{"q": "ما الهدف؟", "t": "أقارن بين خلايا نبات وخلايا حيوان بالمجهر.", "a": "v661a90ef60ef"}, {"q": "الخطوة ١", "t": "أحضّر شريحة رطبة لورقة الإلوديا: قطرة ماء، ثم الورقة، ثم غطاء الشريحة.", "fig": "f33b", "parts": [], "a": "vc29d9af6a437"}, {"q": "الخطوة ٢", "t": "أفحص الورقة بالقوة الصغرى ثم الكبرى للمجهر، وأرسم ما أشاهد.", "fig": "f33c", "parts": [], "a": "v619af5b818fa"}, {"q": "الخطوة ٣", "t": "أكرّر الفحص مع شريحة محضّرة لخلايا باطن الخد.", "a": "v3c2725a4b3ec"}, {"q": "أستخلص النتائج", "t": "أقارن بين النوعين، وأفسّر سبب التشابه والاختلاف.", "a": "vc92a889eedfd"}], "figs": ["f33b", "f33c"], "key": "نفحص خلايا نباتية وخلايا حيوانية بالمجهر لنكتشف ما يتشابه فيهما وما يختلف.", "sa": "v43160abd1ea1"}, {"id": "L03-s3", "page": 34, "title": "كيف أقارن بين الخلايا النباتية والخلايا الحيوانية؟", "book": "تتكون كلُّ خليةٍ من مجموعةٍ منَ الأجزاءِ تعملُ معًا بوصفِها وحدةً واحدةً. وعلى الرغمِ مِنْ أنَّ الخلايا النباتيةَ والخلايَا الحيوانيةَ لها أجزاءٌ مشتركةٌ إلا أنَّ هناكَ بعضَ الاختلافاتِ بينَهُما. أبحثُ أولًا في الأشياءِ المشتركةِ بينَهُما.\nلكلِّ خليةٍ غشاءٌ بلازميٌّ يحيطُ بها، ويُعطيها شكلَها المميزَ، ويسمحُ بدخولِ الموادِّ وخروجِها منَ الخليةِ. وهذا الغشاءُ البلازميُّ يشبهُ الجدارَ الذي يحيطُ بمصنعٍ ليحميَهُ.\nمعظمُ الخلايا لها نواةٌ تعملُ بوصفِها مركزَ تحكُّمٍ في الخليةِ، حيثُ تنظّمُ التفاعلاتِ الكيميائيةَ فيها، وتخزنُ المعلوماتِ الضروريةَ لانقسامِ الخليةِ. ويَسهلُ رؤيةُ نواةِ الخليةِ باستعمالِ مجهرٍ بسيطٍ؛ لأنَّها كبيرةٌ، ولونُها داكنٌ.\nوتحتوي النواةُ على معظمِ المعلوماتِ الوراثيةِ للخليةِ، التي تحدّدُ كيفَ تقومُ الخليةُ بنَسْخِ نفسِها. ويوجدُ في النواةِ أشرطةٌ طويلةٌ منَ الأحماضِ النوويةِ تُسمّى الكروموسوماتِ، تخزنُ المعلوماتِ اللازمةَ لتنفيذِ كافةِ الأنشطةِ وتحفظُها؛ لنقلِها إلى خلايَا النسلِ الجديدِ.", "simple": "كل خلية أجزاء تعمل معًا كوحدة واحدة. للخلية النباتية والحيوانية أجزاء مشتركة. منها الغشاء البلازمي الذي يحيط بالخلية. ومنها النواة، مركز التحكم، وفيها الكروموسومات.", "steps": [{"q": "ماذا أرى؟", "t": "رسم مقطوع لخلية حيوانية، تظهر أجزاؤها الداخلية.", "fig": "f34a", "parts": [], "a": "v84143bf045fc"}, {"q": "ما الأجزاء؟", "t": "من الخارج الغشاء البلازمي، وفي الوسط النواة، وداخلها الكروموسومات.", "fig": "f34a", "parts": ["p1", "p2", "p3"], "a": "ve8e61aeafa1d"}, {"q": "ماذا يفعل الغشاء البلازمي؟", "t": "يحيط بالخلية، ويعطيها شكلها، ويسمح بدخول المواد وخروجها.", "fig": "f34a", "parts": ["p1"], "a": "vadc515e73bd6"}, {"q": "ماذا تفعل النواة؟", "t": "تتحكّم في الخلية، وتنظّم تفاعلاتها، وتخزن معلومات انقسامها.", "fig": "f34a", "parts": ["p2"], "a": "v3df2d90790ea"}, {"q": "ما الكروموسومات؟", "t": "أشرطة طويلة من الأحماض النووية داخل النواة، تحفظ المعلومات وتنقلها إلى النسل الجديد.", "fig": "f34a", "parts": ["p3"], "a": "vf441c26ee8e4"}, {"q": "الفكرة المهمة", "t": "كل خلية في جسم الببغاء فيها هذه التراكيب.", "fig": "f34b", "parts": [], "a": "vfdd308ef959d"}], "figs": ["f34a", "f34b"], "key": "لكل خلية غشاء بلازمي يحيط بها، ولمعظم الخلايا نواة تعمل مركز تحكّم.", "sa": "v9bb00c4340b0"}, {"id": "L03-s4", "page": 35, "title": "كيف أقارن بين الخلايا النباتية والخلايا الحيوانية؟ (تابع)", "book": "يوجدُ بينَ النواةِ والغشاءِ البلازميِّ مادةٌ تشبهُ الهلامَ تسمَّى السيتوبلازمَ، ويحتوي علَى كميةٍ كبيرةٍ منَ الماءِ. ويوجدُ فيه أيضًا أجزاءُ الخليةِ الداخليةُ والموادُّ الكيميائيةُ، ولكلٍّ منها وظائفُ محددةٌ. ويمتدُّ في السيتوبلازمِ أيضًا نظامُ النقلِ في الخليةِ، حيثُ يقومُ بنقلِ الموادِّ اللازمةِ إليها.\nوالميتوكندريا مصدرُ طاقةِ الخليةِ. وهيَ أجسامٌ على شكلِ عصيٍّ تقومُ بعمليةِ التنفسِ الهوائيِّ، ويتمُّ فيها تحوّلُ الموادِّ الكيميائيةِ في الغذاءِ إلى طاقةٍ تستعملُها الخليةُ. والخلايَا التي تحتاجُ إلى الطاقةِ باستمرارٍ - ومنها خلايَا عضلاتِ القلبِ - تحتوي على ألوفٍ منَ الميتوكندريا.\nأمّا الفجواتُ فهيَ تراكيبُ تشبهُ الكيسَ، تخزنُ الماءَ والغِذاءَ، كما تقومُ بخزنِ بعضِ الفضلاتِ قبلَ أنْ تتخلَّصَ منها. والفجواتُ في الخليةِ النباتيةِ أكبرُ منها في الخليةِ الحيوانيةِ.", "simple": "بين النواة والغشاء يوجد السيتوبلازم، وهو يشبه الهلام. والميتوكندريا مصدر طاقة الخلية. والفجوات أكياس تخزن الماء والغذاء والفضلات.", "steps": [{"q": "ما السيتوبلازم؟", "t": "مادة تشبه الهلام بين النواة والغشاء البلازمي، فيها ماء كثير.", "fig": "f34a", "parts": ["p4"], "a": "vbc4e257a5228"}, {"q": "ماذا يوجد فيه؟", "t": "أجزاء الخلية الداخلية والمواد الكيميائية، ونظام النقل في الخلية.", "a": "v35acc0666607"}, {"q": "ما الميتوكندريا؟", "t": "أجسام على شكل عصي، هي مصدر طاقة الخلية.", "fig": "f34a", "parts": ["p5"], "a": "vdad7de96714b"}, {"q": "ماذا تفعل الميتوكندريا؟", "t": "تقوم بالتنفس الهوائي، فتحوّل الغذاء إلى طاقة. وخلايا عضلات القلب فيها ألوف منها.", "a": "vcffe728053cf"}, {"q": "ما الفجوات؟", "t": "أكياس تخزن الماء والغذاء وبعض الفضلات.", "fig": "f34a", "parts": ["p6"], "a": "vdba84833b8a0"}, {"q": "الفكرة المهمة", "t": "الفجوات في الخلية النباتية أكبر منها في الخلية الحيوانية.", "a": "v27bb4886c7fb"}], "figs": ["f34a"], "key": "السيتوبلازم يملأ الخلية، والميتوكندريا مصدر الطاقة، والفجوات للتخزين.", "sa": "v720e4ef1aaea"}, {"id": "L03-s5", "page": 35, "title": "تركيب الخلية النباتية", "book": "تركيبُ الخليةِ النباتيةِ\nويوجدُ في الخلايا النباتيةِ تراكيبُ وموادُّ كيميائيةٌ لا توجدُ في الخلايا الحيوانيةِ، ومنها: الجدارُ الخلويُّ، والبلاستيداتُ الخضراءُ، والكلوروفيلُ.\nأمّا الجدارُ الخلويُّ فطبقةٌ صلبةٌ تحيطُ بالغشاءِ البلازميِّ. ويدعمُ هذا الجدارُ الخليةَ النباتيةَ، ويعطيها شكلَها، ويحميها منَ الظروفِ البيئيةِ.\nوتوجدُ البلاستيداتُ الخضراءُ في أوراقِ العديدِ منَ النباتاتِ وسيقانِها، وتقومُ بصنعِ الغذاءِ؛ إذْ تمتصُّ طاقةَ الضوءِ عنْ طريقِ صبغةٍ خضراءَ فيها تُسمَّى الكلوروفيلَ، وهذه الصبغةُ هيَ التي تُكسبُ النباتاتِ لونَها الأخضرَ.", "simple": "في الخلية النباتية أجزاء لا توجد في الخلية الحيوانية. منها الجدار الخلوي الصلب الذي يدعمها ويحميها. ومنها البلاستيدات الخضراء التي تصنع الغذاء بصبغة الكلوروفيل.", "steps": [{"q": "ماذا أرى؟", "t": "رسم مقطوع لخلية نباتية على شكل صندوق.", "fig": "f35a", "parts": [], "a": "va0fb9d9c37e3"}, {"q": "ما الأجزاء المشتركة؟", "t": "الغشاء البلازمي، والسيتوبلازم، والنواة، والميتوكندريا، والفجوة.", "fig": "f35a", "parts": ["p2", "p3", "p4", "p8", "p6"], "a": "v369df786b49e"}, {"q": "ما الجدار الخلوي؟", "t": "طبقة صلبة تحيط بالغشاء البلازمي، تدعم الخلية وتعطيها شكلها وتحميها.", "fig": "f35a", "parts": ["p1"], "a": "vb1254970dc79"}, {"q": "ما البلاستيدات الخضراء؟", "t": "تراكيب تصنع الغذاء، وتمتص طاقة الضوء بصبغة الكلوروفيل الخضراء.", "fig": "f35a", "parts": ["p7"], "a": "v077e6b614b46"}, {"q": "كيف يرتبط بغيره؟", "t": "الكلوروفيل هو الذي يُكسب النباتات لونها الأخضر.", "a": "v7d1eb762b2a5"}, {"q": "الفكرة المهمة", "t": "الجدار الخلوي والبلاستيدات الخضراء والكلوروفيل في الخلايا النباتية فقط.", "fig": "f35b", "parts": [], "a": "v67c2bb83054f"}], "figs": ["f35a", "f35b"], "key": "تتميّز الخلية النباتية بالجدار الخلوي والبلاستيدات الخضراء والكلوروفيل.", "sa": "v8806c8adcdb8"}, {"id": "L03-s6", "page": 36, "title": "ما النقل السلبي؟", "book": "يدخلُ المخبزَ كلَّ يومٍ موادُّ مختلفةٌ، حيثُ تُخلَطُ هذهِ الموادُّ وتعجَنُ وتخبَزُ، ثمَّ يغلَّفُ المنتَجُ ويوزَّعُ، ويُتخلَّصُ منَ النفاياتِ.\nهلْ يعملُ جسمِي بطريقةٍ مشابهةٍ؟ تقومُ خلايَا الدمِ باستمرارٍ بتزويدِ خلايَا الجسمِ بالغذاءِ والأكسجينِ وموادَّ أخرَى للقيامِ بنشاطاتِها الحيويةِ، وفي الوقتِ نفسِه يقومُ الدمُ بنقلِ الفضلاتِ الناتجةِ - ومنها ثاني أكسيدِ الكربونِ - بعيدًا عنِ الخليةِ. ومعَ ذلكَ لا يدخلُ الدمُ إلى الخلايا! فكيفَ تنتقلُ الموادُّ التي تحتاجُ إليهَا خلايَا جسمي؟ وكيفَ يتمُّ التخلصُ منَ الفضلاتِ وطرحُها خارجَ الخليةِ؟\nالنقلُ السلبيُّ هو حركةُ الموادِّ عبرَ أغشيةٍ مِنْ دونِ أنْ تستخدمَ طاقةَ الخليةِ. وهناكَ نوعانِ من النقلِ السلبيِّ، اعتمادًا علَى نوعِ المادةِ التي تنتقلُ عبرَ الغشاءِ البلازميِّ، هما: الانتشارُ، والخاصيةُ الأسموزيةُ. وكلاهما ضروريٌّ وأساسيٌّ للخلايا الحيةِ.\nوالانتشارُ عمليةُ انتقالِ الموادِّ - ومنها السكرُ والأكسجينُ وثاني أكسيدِ الكربونِ - عبرَ الغشاءِ البلازميِّ مِنْ منطقةِ التركيزِ المرتفعِ إلى منطقةِ التركيزِ المنخفضِ منْ دونِ الحاجةِ إلى طاقةٍ. وهذهِ العمليةُ تشبهُ وضعَ نقطةِ حبرٍ في كأسٍ فيها ماءٌ؛ إذ تنتشرُ جسيماتُ الحبرِ منَ المناطقِ الأكثرِ تركيزًا إلى المناطقِ الأقلِّ تركيزًا مِنْ دونِ أنْ تحتاجَ إلى طاقةٍ.\nوالخاصيةُ الأسموزيةُ هي انتقالُ جزيئاتِ الماءِ عبرَ الغشاءِ البلازميِّ، وينتقلُ الماءُ مثلَ باقِي الموادِّ منَ المناطقِ التي يكونُ تركيزُهُ فيها أكبرَ إلى المناطقِ التي يكونُ تركيزُه فيها أقلَّ. وبذلك يمكنُ القولُ إن الخاصيةَ الأسموزيةَ عمليةُ انتشارٍ للماءِ فقطْ.", "simple": "الدم يوصل الغذاء والأكسجين، لكنه لا يدخل الخلايا. فالمواد تعبر الغشاء البلازمي. النقل السلبي: حركة المواد عبر الأغشية بلا طاقة من الخلية. ونوعاه: الانتشار والخاصية الأسموزية.", "steps": [{"q": "ما المشكلة؟", "t": "الدم يحمل الغذاء والأكسجين، لكنه لا يدخل إلى الخلايا. فكيف تصل المواد؟", "a": "v27deaa7a52cb"}, {"q": "ما النقل السلبي؟", "t": "حركة المواد عبر الأغشية من دون أن تستخدم طاقة الخلية.", "a": "vc65d815cbbab"}, {"q": "ما الانتشار؟", "t": "انتقال المواد، مثل الأكسجين، من التركيز المرتفع إلى المنخفض، بلا طاقة.", "fig": "f36b", "parts": ["p1", "p2"], "a": "v08b8e403ea35"}, {"q": "ما مثاله؟", "t": "نقطة حبر في كأس ماء تنتشر وحدها في الماء.", "a": "v9f1a5741da06"}, {"q": "ما الخاصية الأسموزية؟", "t": "انتقال جزيئات الماء عبر الغشاء البلازمي؛ أي انتشار للماء فقط.", "fig": "f36a", "parts": [], "a": "v1c385b1fabe5"}, {"q": "الفكرة المهمة", "t": "الانتشار والخاصية الأسموزية كلاهما نقل سلبي، وكلاهما ضروري للخلايا.", "a": "vc05ff767c66b"}], "figs": ["f36b", "f36a"], "key": "النقل السلبي حركة المواد عبر الأغشية بلا طاقة، ونوعاه: الانتشار والخاصية الأسموزية.", "sa": "v8cb9985971c7"}, {"id": "L03-s7", "page": 37, "title": "ما النقل السلبي؟ (تابع): الاتزان", "book": "افترضْ أنَّ ماءً وجليسرولًا قد فُصلَ أحدُهما عنْ الآخرِ بغشاءٍ رقيقٍ فإنَّ جسيماتِ الماءِ تنتقلُ بفعلِ الخاصيةِ الأسموزيةِ إلى الجليسرول، منْ جانبِ الغشاءِ الذي فيه تركيزُ الماءِ مرتفعٌ إلى الجانبِ الآخرِ الذي يكونُ فيه تركيزُ الماءِ منخفضًا. وهذهِ العمليةُ لا تستهلكُ طاقةً.\nوتستمرُّ عمليتا الانتشارِ والخاصيّةِ الأسموزيةِ إلى أنْ يتساوَى تركيزُ الموادِّ على جانبَيِ الغشاءِ، وعندَها تتوقفُ عمليتَا الانتشارِ والخاصيّةِ الأسموزيةِ، ويحدثُ الاتّزانُ.\nويكونُ النباتُ سليمًا إذا كانَ في حالةِ اتزانٍ، وذلكَ عندَما يكونُ دخولُ الماءِ إلى خلايَاهُ وخروجُه منهَا بكمياتٍ متساويةٍ. أمَّا إذَا كانَ خروجُ الماءِ من خلاياه أكثرَ من دخولِهِ إليها فإنَّ أجزاءَ الخليةِ الداخليةَ تنكمشُ، وينكمشُ الغشاءُ البلازميُّ مبتعدًا عنِ الجدارِ الخلويِّ، فيذبلُ النباتُ.", "simple": "الماء ينتقل من الجانب الذي فيه ماء كثير إلى الجانب الذي فيه ماء قليل. ويستمر ذلك حتى يتساوى التركيز، فيحدث الاتزان. والنبات السليم متزن؛ فإن خرج منه ماء أكثر ذبل.", "steps": [{"q": "مثال الكتاب", "t": "ماء وجليسرول بينهما غشاء رقيق: الماء ينتقل إلى جهة الجليسرول.", "a": "ve6fc26df4470"}, {"q": "إلى أين يتحرك الماء؟", "t": "من جهة تركيز الماء المرتفع إلى جهة تركيز الماء المنخفض، بلا طاقة.", "a": "v013830c45a09"}, {"q": "متى يتوقف؟", "t": "عندما يتساوى التركيز على جانبي الغشاء، فيحدث الاتزان.", "a": "v054209093d1d"}, {"q": "النبات السليم", "t": "يدخل الماء إلى خلاياه ويخرج منها بكميات متساوية.", "fig": "f36a", "parts": [], "a": "v3d593ffe5f9e"}, {"q": "النبات الذابل", "t": "يخرج منه ماء أكثر مما يدخل؛ فينكمش الغشاء البلازمي مبتعدًا عن الجدار الخلوي.", "fig": "f37a", "parts": [], "a": "ve3efff5d7a93"}, {"q": "الفكرة المهمة", "t": "الانتشار والخاصية الأسموزية يستمران حتى الاتزان.", "a": "vac2a1c282725"}], "figs": ["f36a", "f37a"], "key": "تستمر حركة المواد حتى يتساوى التركيز على جانبي الغشاء، وعندها يحدث الاتزان.", "sa": "vb6116630341e"}, {"id": "L03-s8", "page": 37, "title": "نشاط: الانتشار والخاصية الأسموزية", "book": "١ أجرّبُ. أملأُ كأسًا بماءٍ دافئٍ، وأضعُ فيهِ كيسَ شاي صغيرًا، وأضيفُ إليهِ ملعقةً منَ الرملِ.\n٢ ألاحظُ. أحرّكُ الكأسَ عدةَ ثوانٍ، ثمَّ أتركُه مِنْ دونِ تحريكٍ مدةَ ١٥ دقيقةً. ما لونُ الماءِ؟ وهلْ توزَّعَ اللونُ في الكأسِ بالتساوي؟\n٣ أدوّنُ البياناتِ. أرفعُ كيسَ الشاي منَ الكأسِ، وأضعُه على منشفةٍ ورقيةٍ. وأنظرُ بدقةٍ إلى الماءِ الذي في الكأسِ. هلْ هناكَ أوراقُ شاي طافيةٌ في الماءِ؟ أفتحُ كيسَ الشاي بالمقصِّ. هلْ يوجدُ رملٌ في الكيسِ؟\n٤ أفسّرُ البياناتِ. ما الذي انتقلَ منْ كيسِ الشاي وإليْهِ؟ كيفَ تعرفُ أنَّ هذا قدْ حدثَ؟\n٥ أستنتجُ. ما الذي حدّدَ حركةَ الجزيئاتِ إلى داخلِ الكيسِ وإلى خارجِه. ماذَا أتوقعُ أنْ يحدثَ للماءِ لو بقيَ كيسُ الشاي داخلَه مدةً طويلةً؟", "simple": "نضع كيس شاي في ماء دافئ ونضيف رملًا. ثم نلاحظ لون الماء، وهل دخل الرمل الكيس. وبذلك نرى ما يعبر الكيس وما لا يعبره.", "steps": [{"q": "الخطوة ١", "t": "أملأ كأسًا بماء دافئ، وأضع فيه كيس شاي، وأضيف ملعقة رمل.", "fig": "f37b", "parts": [], "a": "v33ebc4875030"}, {"q": "الخطوة ٢", "t": "أحرّك الكأس، ثم أتركه ١٥ دقيقة، وألاحظ لون الماء.", "a": "v239e45307021"}, {"q": "الخطوة ٣", "t": "أُخرج الكيس وأفتحه: هل فيه رمل؟ وهل في الماء أوراق شاي؟", "a": "v903afdc4c939"}, {"q": "الخطوتان ٤ و٥", "t": "أفسّر ما انتقل من الكيس وإليه، وأستنتج ما حدّد حركة الجزيئات.", "a": "v04ca3d290fc2"}], "figs": ["f37b"], "key": "كيس الشاي يشبه الغشاء: بعض المواد تعبره وبعضها لا يعبره.", "sa": "v169f8ad5829c"}, {"id": "L03-s9", "page": 38, "title": "ما البناء الضوئي؟ وما التنفس الخلوي؟ — البناء الضوئي", "book": "عندَ إعدادِ الكعكِ تُخلطُ مكوّناتُه - ومنها الدقيقُ ومسحوقُ الخَبْزِ (مسحوقُ الخميرةِ) والسكرُ والبيضُ - معًا. وعندَ وضعِها في الفرنِ تسبِّبُ الحرارةُ حدوثَ تفاعلاتٍ تحوِّلُ هذهِ المكوّناتِ إلى كعكٍ. وبطريقةٍ مشابهةٍ تحدثُ عمليةُ البناءِ الضوئيِّ. وعمليةُ البناءِ الضوئيِّ التي تحدثُ في النباتاتِ وبعضِ المخلوقاتِ الحيةِ الأخرَى تستخدمُ طاقةَ الشمسِ لإنتاجِ غذاءٍ على شكلِ سكرِ الجلوكوز. والموادُّ المتفاعلةُ في هذهِ العمليةِ هي ثاني أكسيدِ الكربونِ والماءُ. أمَّا الموادُّ الناتجةُ عنِ العمليةِ فهيَ سكرُ الجلوكوزِ والأكسجينُ. وتتحكمُ الطاقةُ الشمسيةُ في سيرِ عمليةِ البناءِ الضوئيِّ كلِّها. وتمثّلُ المعادلةُ التاليةُ خلاصةَ التفاعلاتِ الكيميائيةِ لهذهِ العمليةِ بالكلماتِ:\nثاني أكسيد الكربون + ماء ← (ضوء) سكر الجلوكوز + الأكسجين\nوتتمُّ عمليةُ البناءِ الضوئيِّ داخلَ البلاستيداتِ الخضراءِ. وهيَ تراكيبُ مميزةٌ تحتوِي علَى صبغةِ الكلوروفيلِ الخضراءِ، وتقومُ بالتقاطِ الطاقةِ الشمسيةِ التي تُستعمَلُ في عمليةِ البناءِ الضوئيِّ، ويُخزنُ سكرُ الجلوكوزِ الناتجُ عنْ هذهِ العمليةِ داخلَ المخلوقِ الحيِّ، ويُطردُ الأكسجينُ بوصفِه فضلاتٍ ناتجةً عنْ عمليةِ البناءِ الضوئيِّ إلى الغلافِ الجويِّ.", "simple": "البناء الضوئي عملية يصنع بها النبات غذاءه. يستخدم طاقة الشمس، مع ثاني أكسيد الكربون والماء. فينتج سكر الجلوكوز والأكسجين. وتتم داخل البلاستيدات الخضراء.", "steps": [{"q": "ماذا أرى؟", "t": "الشمس فوق أوراق نبات، ثم تكبير لخلية نباتية، ثم لبلاستيدة خضراء.", "fig": "f38a", "parts": [], "a": "v8e16f25ab495"}, {"q": "ما المواد المتفاعلة؟", "t": "ثاني أكسيد الكربون والماء.", "fig": "f38a", "parts": ["p3", "p4"], "a": "v371fd88ab10b"}, {"q": "من أين الطاقة؟", "t": "من الشمس؛ تتحكم طاقتها في سير العملية كلها.", "fig": "f38a", "parts": ["p1"], "a": "v98346526422c"}, {"q": "أين تحدث؟", "t": "داخل البلاستيدات الخضراء التي فيها الكلوروفيل.", "fig": "f38a", "parts": ["p2"], "a": "v68f614db246f"}, {"q": "ما النواتج؟", "t": "سكر الجلوكوز يُخزَّن في النبات، والأكسجين يخرج إلى الغلاف الجوي.", "fig": "f38a", "parts": ["p5", "p6"], "a": "v0d5cdc205bb9"}, {"q": "الفكرة المهمة", "t": "ثاني أكسيد الكربون + ماء ← (ضوء) سكر الجلوكوز + الأكسجين.", "a": "v3298e043ea7d"}], "figs": ["f38a"], "key": "البناء الضوئي يستخدم طاقة الشمس لتحويل ثاني أكسيد الكربون والماء إلى جلوكوز وأكسجين.", "sa": "v156822338b8e"}, {"id": "L03-s10", "page": 39, "title": "التنفس والتخمر", "book": "تستخلصُ النباتاتُ والحيواناتُ الطاقةَ منْ سكرِ الجلوكوزِ بعمليةٍ تُسمَّى التنفسَ الخلويَّ، وخلالَ هذهِ العمليةِ تقومُ الخلايا بتحليلِ السكرِ وإطلاقِ الطاقةِ. ويتطلبُ حدوثُ التنفسِ الخلويِّ في النباتاتِ والحيواناتِ وجودَ الأكسجينِ. لذا يُسمَّى هذا التنفسَ التنفسَ الهوائيَّ. وتستعملُ الخلايا الأكسجينَ لتحليلِ السكرِ لإطلاقِ طاقةٍ يمكنُ استخدامُها للقيامِ بالنشاطاتِ الحيويةِ. ويَنتجُ عنْ هذهِ العمليةِ الماءُ وثاني أكسيدِ الكربونِ بوصفِهما فضلاتٍ، وتَستخدمُ النباتاتُ هذهِ الفضلاتِ مرةً أخرَى في عمليةِ البناءِ الضوئيِّ.\nهناكَ نوعٌ آخرُ منَ التنفسِ الخلويِّ لا يَستعملُ الأكسجينَ، يُسمَّى التنفسَ اللاهوائيَّ. وأكثرُ عملياتِ التنفسِ اللاهوائيِّ شيوعًا هيَ التخمّرُ. وهيَ عمليةٌ مرتبطةٌ معَ إنتاجِ الغذاءِ وحفظِهِ، ومنْ ذلكَ إنتاجُ اللبنِ الرائبِ.\nتحدثُ عمليةُ التنفسِ اللاهوائيُّ في جميعِ الخلايا، عندَما لا تستطيعُ الخليةُ القيامَ بعمليةِ التنفسِ الخلويِّ. ويحدثُ هذا عندَ ممارسةِ التمارينِ الرياضيةِ المجهدةِ. ورغمَ أنَّ الشخصَ يتنفسُ (شهيقًا وزفيرًا) بسرعةٍ في أثناءِ هذهِ التمارينِ إلا أنَّ الأكسجينَ لا يصلُ إلى جميعِ الخلايا. ويتمُّ إطلاقُ الطاقةِ عنْ طريقِ عمليةِ التخمُّرِ. وتُنتجُ عمليةُ التخمُّرِ فضلاتٍ تُسمَّى حمضَ اللاكتيك، الذي يسبِّبُ ارتفاعُ تركيزِه في العضلاتِ الإحساسَ بألمٍ في العضلاتِ أوِ الإعياءِ.", "simple": "التنفس الخلوي: الخلايا تحلّل السكر لتطلق الطاقة، ويحتاج إلى الأكسجين. وينتج عنه الماء وثاني أكسيد الكربون. وعند نقص الأكسجين يحدث التخمّر، فينتج حمض اللاكتيك.", "steps": [{"q": "ما التنفس الخلوي؟", "t": "عملية تستخلص بها النباتات والحيوانات الطاقة من سكر الجلوكوز.", "a": "v53cabb9cdc2b"}, {"q": "لماذا يسمّى هوائيًّا؟", "t": "لأنه يحتاج إلى الأكسجين لتحليل السكر.", "a": "v2eacee7a27f0"}, {"q": "ما نواتجه؟", "t": "الماء وثاني أكسيد الكربون، ويستعملهما النبات مرة أخرى في البناء الضوئي.", "fig": "f39a", "parts": ["p1", "p2", "p3", "p4"], "a": "vc9e3c501375f"}, {"q": "كيف أقارن العمليتين؟", "t": "البناء الضوئي يخزّن الطاقة في الجلوكوز، والتنفس يحرّر الطاقة منه.", "fig": "f39b", "parts": [], "a": "v90a0d1f62d5e"}, {"q": "ما التنفس اللاهوائي؟", "t": "تنفس خلوي بلا أكسجين، وأشهره التخمّر، ومنه إنتاج اللبن الرائب.", "a": "v5f4d6cd04955"}, {"q": "الفكرة المهمة", "t": "في التمارين المجهدة يحدث التخمّر في العضلات، فيتجمع حمض اللاكتيك ويسبّب الألم.", "a": "v5cded0feedfa"}], "figs": ["f39a", "f39b"], "key": "التنفس الخلوي يحرّر الطاقة من الجلوكوز بالأكسجين، والتخمّر يحرّرها بلا أكسجين.", "sa": "v6714dc230c37"}, {"id": "L03-s11", "page": 40, "title": "ما النقل النشط؟", "book": "تشملُ عمليتَا الانتشارِ والخاصيَّةِ الأسموزيةِ نقلَ موادَّ مِنْ منطقةِ تركيزٍ مرتفعٍ إلى منطقةِ تركيزٍ منخفضٍ، ولا يتطلبُ هذا أنْ تَستخدمَ الخليةُ طاقةً. ومعَ ذلكَ هناكَ بعضُ الموادِّ تنتقلُ أحيانًا مِنْ منطقةِ التركيزِ المنخفضِ إلى منطقةِ التركيزِ المرتفعِ. وعندَما يحتاجُ انتقالُ الموادِّ عبرَ الأغشيةِ إلى طاقةٍ يحدثُ نقلٌ نشطٌ. ومنْ ذلكَ حاجةُ الخليةِ إلى الطاقةِ؛ لنقلِ الأملاحِ المعدنيةِ والموادِّ الغذائيةِ إلى داخلِ الخليةِ وخارجِها. فالخليةُ العصبيةُ تحتاجُ إلى النقلِ النشطِ لضخِّ البوتاسيومِ داخلَ الخليةِ، كما أنَّها تحتاجُ إلى النقلِ النشطِ لضخِّ الصوديومِ خارجَها.\nولكنَّ هناكَ بعضَ الموادِّ حجمُها كبيرٌ جدًّا، لذا لا تستطيعُ أنَّ تمرَّ في خلالِ الغشاءِ البلازميِّ للخليةِ عنْ طريقِ النقلِ النشطِ أوِ النقلِ السلبيِّ؛ ولذلكَ تقومُ هذهِ الخلايا بهضمِ الموادِّ الكبيرةِ مثلِ البروتيناتِ والبكتيريا بإحاطتِها بغشاءٍ بلازميٍّ، وتكوينِ جيبٍ حولَها. وتُسمَّى هذه العمليةُ البلعمةَ، كما في طريقةِ ابتلاعِ الأميبا لغذائِها ومخلوقاتٍ حيةٍ أخرَى وحيدةِ الخليةِ كذلكَ.\nحقيقة: يحدثُ النقلُ النشطُ عبرَ أغشيةٍ متلاصقةٍ سليمةٍ.", "simple": "أحيانًا تنتقل المواد من التركيز المنخفض إلى المرتفع. هنا تحتاج الخلية إلى طاقة، وهذا هو النقل النشط. أما المواد الكبيرة جدًّا فتحيطها الخلية بجيب من غشائها، وهذه البلعمة.", "steps": [{"q": "ما الفرق عن النقل السلبي؟", "t": "النقل السلبي من المرتفع إلى المنخفض بلا طاقة.", "a": "vfbb3fa73e295"}, {"q": "ما النقل النشط؟", "t": "انتقال المواد عبر الأغشية عندما يحتاج إلى طاقة.", "a": "v508f81286523"}, {"q": "كيف يحدث في الشكل؟", "t": "الغشاء يحيط بالجزيئات، ثم يكوّن جيبًا، ثم ينقلها إلى الداخل.", "fig": "f40b", "parts": ["p1", "p2", "p3"], "a": "vfcab44a48c8e"}, {"q": "ما مثاله؟", "t": "الخلية العصبية تضخ البوتاسيوم إلى داخلها والصوديوم إلى خارجها.", "a": "v65b0101601bd"}, {"q": "ما البلعمة؟", "t": "إحاطة مادة كبيرة بغشاء بلازمي وتكوين جيب حولها، كما تفعل الأميبا.", "fig": "f40a", "parts": ["p1", "p2"], "a": "v064a9e6090a5"}, {"q": "الفكرة المهمة", "t": "النقل النشط يستهلك طاقة الخلية، ويحدث عبر أغشية متلاصقة سليمة.", "a": "ve1e90f1244f3"}], "figs": ["f40b", "f40a"], "key": "النقل النشط يحتاج إلى طاقة لنقل المواد من التركيز المنخفض إلى المرتفع.", "sa": "vb08f58123723"}, {"id": "L03-s12", "page": 41, "title": "مراجعة الدرس: ملخص مصور", "book": "تتكوَّنُ الخلايَا مِنْ أجزاءٍ عديدةٍ، لكلٍّ منها دورُه ووظيفتُه في النشاطاتِ التي تحافظُ على الحياةِ.\nتنتقلُ الموادُّ منَ الخليةِ وإليها عنْ طريقِ الانتشارِ. وتنتقلُ جزيئاتُ الماءِ عبرَ الأغشيةِ البلازميةِ عنْ طريقِ الخاصيةِ الأسموزيةِ.\nالبناءُ الضوئيُّ عمليةٌ تقومُ فيها النباتاتُ بصنعِ الغذاءِ. والتنفسُ الخلويُّ عمليةٌ تستعملُ فيها الخليةُ الطاقةَ.", "simple": "الخلية أجزاء لكل منها وظيفة. المواد تدخل وتخرج بالانتشار، والماء بالخاصية الأسموزية. النبات يصنع غذاءه بالبناء الضوئي، والخلية تستعمل الطاقة بالتنفس الخلوي.", "steps": [{"q": "الفكرة ١", "t": "الخلية أجزاء كثيرة، لكل جزء دوره في الحفاظ على الحياة.", "fig": "f41a", "parts": ["p1"], "a": "v8f644cabd435"}, {"q": "الفكرة ٢", "t": "المواد تنتقل بالانتشار، والماء ينتقل بالخاصية الأسموزية.", "fig": "f41a", "parts": ["p2"], "a": "vd208488073bc"}, {"q": "الفكرة ٣", "t": "البناء الضوئي يصنع الغذاء، والتنفس الخلوي تستعمل فيه الخلية الطاقة.", "fig": "f41a", "parts": ["p3"], "a": "va9cd7835c13d"}], "figs": ["f41a"], "key": "أجزاء الخلية، وانتقال المواد، والبناء الضوئي والتنفس: هذه أفكار الدرس الثلاث.", "sa": "v11ba0fb61aac"}], "questions": [{"id": "L03-q1", "page": 32, "section": "أنظر وأتساءل", "type": "explain", "text": "كيف يمكن المقارنة بين تركيب الخلية النباتية والخلية الحيوانية؟", "options": [], "answer": null, "answerText": "نفحص الخليتين بالمجهر ونحدّد أجزاءهما. كلتاهما فيها غشاء بلازمي وسيتوبلازم ونواة وميتوكندريا. وتختص النباتية بالجدار الخلوي والبلاستيدات الخضراء وفجوة كبيرة.", "why": {}, "what": "كيف نعرف ما يتشابه وما يختلف بين الخليتين؟", "hint": "انظر إلى رسمي الخليتين في صفحتي ٣٤ و٣٥.", "explain": "الكتاب يبيّن الأجزاء المشتركة أولًا، ثم الأجزاء الخاصة بالخلية النباتية.", "solve": ["أفحص الخليتين وأحدّد أجزاءهما.", "أكتب الأجزاء المشتركة.", "أكتب الأجزاء الخاصة بالخلية النباتية."], "keys": [{"t": "أجزاء مشتركة: الغشاء البلازمي والسيتوبلازم والنواة", "alts": ["مشتركة", "النواة", "الغشاء", "السيتوبلازم"]}, {"t": "النباتية فيها جدار خلوي وبلاستيدات خضراء", "alts": ["الجدار", "البلاستيدات", "الخضراء", "الكلوروفيل"]}], "back": "L03-s5", "fig": null, "evp": 34, "oos": null, "left": [], "right": [], "items": [], "qa": "vb21ac7e434ee", "ea": "vcf3c54022188", "wa": "ve47ea9255068", "ha": "veebedcc4324b", "whyA": {}}, {"id": "L03-q2", "page": 33, "section": "الخطوات", "type": "open", "text": "٢ ألاحظ أفحص الورقة باستخدام القوة الصغرى للمجهر مركزًا على أطراف الخلايا، وأدون ملاحظاتي حول خلية واحدة. ثم أستخدم القوة الكبرى للمجهر لأفحص مركز الخلية، وأرسم ما أشاهد. ثم أعيد العدسة الشيئية الصغرى إلى مكانها فوق الشريحة، وأنزع الشريحة عن منضدة المجهر.", "options": [], "answer": null, "answerText": "خلايا الإلوديا مستطيلة منتظمة متلاصقة، لها جدار واضح، وفيها حبيبات خضراء صغيرة كثيرة.", "why": {}, "what": "صف شكل خلية الإلوديا وما تراه داخلها، ثم ارسمها.", "hint": "تذكّر أجزاء الخلية النباتية الخاصة بها في صفحة ٣٥.", "explain": "الجدار الخلوي يعطي الخلية النباتية شكلها، والبلاستيدات الخضراء تظهر حبيبات خضراء.", "solve": ["أفحص بالقوة الصغرى أطراف الخلايا.", "أفحص بالقوة الكبرى مركز الخلية.", "أرسم ما أراه وأكتب ملاحظاتي."], "keys": [{"t": "شكل منتظم مستطيل وجدار واضح", "alts": ["مستطيلة", "منتظمة", "جدار"]}, {"t": "حبيبات خضراء", "alts": ["خضراء", "البلاستيدات", "حبيبات"]}], "back": "L03-s2", "fig": "f33c", "evp": 35, "oos": null, "left": [], "right": [], "items": [], "qa": "v84a871601991", "ea": "v565316ab35b3", "wa": "va7b28be79a56", "ha": "v227f503bb095", "whyA": {}}, {"id": "L03-q3", "page": 33, "section": "الخطوات", "type": "open", "text": "٣ ألاحظ أعيد الخطوة الثانية مستخدمًا شريحة محضرة لخلايا باطن الخد بدلًا من ورقة الإلوديا.", "options": [], "answer": null, "answerText": "خلايا باطن الخد غير منتظمة الشكل، ليس لها جدار ولا حبيبات خضراء، وتظهر فيها النواة بوضوح.", "why": {}, "what": "افحص خلايا باطن الخد كما فعلت مع الإلوديا، وصف ما تراه.", "hint": "هذه خلية حيوانية. ارجع إلى رسم الخلية الحيوانية في صفحة ٣٤.", "explain": "الخلية الحيوانية ليس لها جدار خلوي ولا بلاستيدات خضراء، ونواتها كبيرة داكنة يسهل رؤيتها.", "so
