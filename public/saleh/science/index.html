5a", "parts": ["p1", "p2", "p3", "p4", "p5"], "a": "v5b6d7ec336e7"}, {"t": "المخلوقات الوحيدة الخلية تتكاثر بانقسام الخلية، أما معظم الحيوانات والنباتات فتتحد فيها كروموسومات من الأبوين في التكاثر الجنسي.", "page": 56, "sec": "L06-s11", "fig": null, "parts": [], "a": "v4befbdd1908c"}, {"t": "في الانقسام المنصّف تنقسم النواة مرتين فتنتج ٤ خلايا جنسية، في كل منها ٢٣ كروموسومًا، واتحاد المشيجين يعطي خلية مخصبة فيها ٤٦.", "page": 56, "sec": "L06-s11", "fig": "f56a", "parts": ["p1", "p2", "p3", "p4", "p5"], "a": "vd1c91ffb9ac3"}, {"t": "المقارنة: المتساوي انقسام واحد ينتج خليتين بنفس عدد الكروموسومات، والمنصّف انقسامان ينتجان ٤ خلايا بنصف العدد. وكلاهما يبدأ في النواة.", "page": 57, "sec": "L06-s12", "fig": null, "parts": [], "a": "v11912f80d7ab"}, {"t": "مدة الحياة أطول زمن يعيشه المخلوق في أفضل الظروف ولا تتأثر بالغذاء والماء، أما العمر المتوقع فيتغير بالظروف (متوسطه في السعودية حوالي ٧٣ سنة).", "page": 58, "sec": "L06-s14", "fig": "f58c", "parts": [], "a": "v6e28108f8445"}], "quiz": [{"id": "L06-m1", "src": "L06-q1", "kept": false, "page": 48, "type": "mcq", "text": "كيف تنقلُ المخلوقاتُ الحيةُ الصفاتِ إلى أبنائِها؟", "options": ["أ. بالوراثة؛ أي انتقال الصفات الموروثة من الآباء إلى الأبناء", "ب. بدورة الخلية فقط", "ج. بالتعلّم والتدريب", "د. بالانقسام المتساوي في خلايا الجلد"], "answer": 0, "answerText": "أ. بالوراثة؛ أي انتقال الصفات الموروثة من الآباء إلى الأبناء", "explain": "الوراثة هي انتقال الصفات الموروثة من الآباء إلى الأبناء (ص٤٩)، فيتحد المشيجان وتنتقل إلى الابن كروموسومات وصفات من الأبوين (ص٥٦).", "why": {"1": "دورة الخلية نموّ الخلايا وانقسامها وتعويض التالف منها، لا انتقال الصفات للأبناء.", "2": "ما يُتعلَّم بالتدريب صفة مكتسبة، والصفة المكتسبة لا تُورَث.", "3": "الانقسام المتساوي يصنع خلايا جسمية جديدة في الجسم نفسه، لا ينقل الصفات للأبناء."}, "evp": 56, "back": "L06-s11", "section": "اختر الإجابة الصحيحة", "qa": "vc8e6d3f9e459", "ea": "v7b7973d268de", "wa": null, "ha": null, "whyA": {"1": "v6c9f84349aa1", "2": "v656aab645f2b", "3": "v1a7edc9d08f6"}}, {"id": "L06-m2", "src": "L06-q2", "kept": false, "page": 48, "type": "mcq", "text": "كيف تُنتِجُ الخليةُ خلايا جديدةً؟", "options": ["أ. تأخذ خلايا جاهزة من الغذاء", "ب. تنمو بلا حدّ فتصبح خليتين", "ج. تنقسم بعد أن تضاعف كروموسوماتها", "د. تتخلص من نواتها"], "answer": 2, "answerText": "ج. تنقسم بعد أن تضاعف كروموسوماتها", "explain": "الخلية تنمو ثم تنقسم (دورة الخلية). وفي الانقسام المتساوي تضاعف كروموسوماتها ثم تنقسم إلى خليتين متماثلتين.", "why": {"0": "الخلايا الجديدة لا تأتي من الغذاء؛ كل خلية جديدة تنتج من انقسام خلية موجودة.", "1": "للخلية حدّ أعلى للحجم، فهي لا تنمو بلا حد.", "3": "النواة مهمة في الانقسام، فمنها يبدأ الانقسام."}, "evp": 54, "back": "L06-s8", "section": "اختر الإجابة الصحيحة", "qa": "v8f88fba12254", "ea": "vc38cf88d86d5", "wa": null, "ha": null, "whyA": {"0": "v7060e9c6672c", "1": "v7a28a7949dc1", "3": "vc293a314d39b"}}, {"id": "L06-m3", "src": "L06-q3", "kept": false, "page": 48, "type": "tf", "text": "الوراثةُ هي انتقالُ الصفاتِ الموروثةِ منَ الآباءِ إلى الأبناءِ.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "صح. هذا تعريف الوراثة في مفردات الفصل (ص٤٩).", "why": {"1": "العبارة صحيحة؛ هي تعريف الكتاب للوراثة."}, "evp": 49, "back": "L06-s2", "section": "صح أم خطأ", "qa": "v545f27fefca9", "ea": "v06de5f9c8db0", "wa": null, "ha": null, "whyA": {"1": "v74bc15aede61"}}, {"id": "L06-m4", "src": "L06-q4", "kept": false, "page": 50, "type": "mcq", "text": "يبدأُ الضفدعُ حياتَهُ من خليةٍ واحدةٍ. كيف تنمو هذه الخليةُ لتصبحَ ضفدعًا مكتملَ النموِّ؟", "options": ["أ. تكبر الخلية الواحدة حتى تصبح بحجم الضفدع", "ب. تنقسم الخلايا مرات كثيرة فيزيد عددها", "ج. تتحد مع خلايا من الماء", "د. تموت الخلية وتحل محلها خلية كبيرة"], "answer": 1, "answerText": "ب. تنقسم الخلايا مرات كثيرة فيزيد عددها", "explain": "للخلية حدّ أعلى للحجم. لذلك تنمو ثم تنقسم، وتتكرر دورة الخلية فيزيد عدد الخلايا حتى يكتمل الجسم.", "why": {"0": "الكتاب يقول إن هناك حدًّا أعلى لحجم الخلية، فلا يمكن أن تكبر بحجم الضفدع.", "2": "الخلايا الجديدة تأتي من انقسام الخلايا نفسها، لا من الماء.", "3": "الخلايا الجديدة تنتج بالانقسام وليست خلية واحدة كبيرة."}, "evp": 52, "back": "L06-s5", "fig": "f50a", "section": "اختر الإجابة الصحيحة", "qa": "v48c4ca393ce5", "ea": "v02d36fea07e0", "wa": null, "ha": null, "whyA": {"0": "v0f56b76de60c", "2": "v33dfd095570a", "3": "v461a440576a0"}}, {"id": "L06-m5", "src": "L06-q9", "kept": false, "page": 51, "type": "tf", "text": "تمرُّ الخلايا النباتيةُ والخلايا الحيوانيةُ كلتاهما بالانقسامِ المتساوي.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "صح. الكتاب: «وتمرّ الخلايا النباتية والخلايا الحيوانية بالانقسام المتساوي» (ص٥٥).", "why": {"1": "العبارة صحيحة؛ النبات والحيوان كلاهما يمر بالانقسام المتساوي."}, "evp": 55, "back": "L06-s9", "section": "صح أم خطأ", "qa": "v9a186cbdc429", "ea": "v9b9276b11825", "wa": null, "ha": null, "whyA": {"1": "v4c2bbc450932"}}, {"id": "L06-m6", "src": "L06-q8", "kept": false, "page": 51, "type": "mcq", "text": "في الانقسامِ المتساوي، ماذا يحدثُ بعدَ أنْ تصطفَّ الكروموسوماتُ المتضاعفةُ عندَ وسطِ الخليةِ؟", "options": ["أ. يتضاعف عدد الكروموسومات", "ب. يبدأ غلاف النواة في التلاشي", "ج. تنفصل الكروموسومات وتتحرك في اتجاهين متضادين", "د. تتحد الخلية مع خلية أخرى"], "answer": 2, "answerText": "ج. تنفصل الكروموسومات وتتحرك في اتجاهين متضادين", "explain": "ترتيب الكتاب (ص٥٥): تتضاعف ← تظهر ويتلاشى الغلاف ← تصطف في الوسط ← تنفصل في اتجاهين متضادين ← غلاف نووي لكل مجموعة.", "why": {"0": "التضاعف هو الخطوة الأولى، قبل الاصطفاف.", "1": "تلاشي غلاف النواة في الخطوة الثانية، قبل الاصطفاف.", "3": "الانقسام المتساوي لا يتحد فيه شيء؛ الاتحاد يكون بين الأمشاج."}, "evp": 55, "back": "L06-s10", "fig": "f55a", "section": "اختر الإجابة الصحيحة", "qa": "v9b1c89702d69", "ea": "vc7d0b9334269", "wa": null, "ha": null, "whyA": {"0": "v394fbe5c6877", "1": "vfa6c5c7dc1bf", "3": "v191108008f78"}}, {"id": "L06-m7", "src": "L06-q10", "kept": false, "page": 53, "type": "mcq", "text": "ما الترتيبُ الصحيحُ لمراحلِ دورةِ الخليةِ؟", "options": ["أ. نمو الخلية ← انقسام الخلية ← التهيؤ للانقسام", "ب. نمو الخلية ← التهيؤ للانقسام ← انقسام الخلية", "ج. انقسام الخلية ← التهيؤ للانقسام ← نمو الخلية", "د. التهيؤ للانقسام ← نمو الخلية ← انقسام الخلية"], "answer": 1, "answerText": "ب. نمو الخلية ← التهيؤ للانقسام ← انقسام الخلية", "explain": "شكل دورة الخلية (ص٥٢): نمو الخلية، ثم التهيؤ للانقسام، ثم انقسام الخلية، ثم تتكرر الدورة.", "why": {"0": "التهيؤ للانقسام يأتي قبل الانقسام لا بعده.", "2": "هذا عكس اتجاه الدورة؛ فبعد الانقسام تنمو الخلايا الجديدة، ثم تتهيأ للانقسام.", "3": "الخلية تنمو أولًا ثم تتهيأ للانقسام، لا العكس."}, "evp": 52, "back": "L06-s5", "fig": "f52a", "section": "اختر الإجابة الصحيحة", "qa": "v50e1a84b68e6", "ea": "v9e479c8287f2", "wa": null, "ha": null, "whyA": {"0": "vcec7fce3576c", "2": "v0c8f954933dc", "3": "v50f4ad31f86d"}}, {"id": "L06-m8", "src": "L06-q11", "kept": false, "page": 53, "type": "mcq", "text": "أيُّ الخليتينِ يمكنُ أنْ ينموَ حجمُها أكبرَ: الخليةُ المنبسطةُ أمِ الخليةُ المكعبةُ؟", "options": ["أ. المكعبة؛ لأن الغشاء البلازمي فيها ينمو أسرع", "ب. المنبسطة؛ لأنها لا تُخرج فضلات", "ج. المكعبة؛ لأنها لا تحتاج إلى أكسجين", "د. المنبسطة؛ لأن مساحة غشائها كبيرة بالنسبة إلى حجمها"], "answer": 3, "answerText": "د. المنبسطة؛ لأن مساحة غشائها كبيرة بالنسبة إلى حجمها", "explain": "حجم الخلية تحدّده النسبة بين مساحة الغشاء البلازمي وحجمها؛ فكل المواد تمرّ عبر الغشاء. والخلية المنبسطة سطحها كبير مقارنة بحجمها.", "why": {"0": "الغشاء البلازمي ينمو أبطأ من نمو حجم الخلية، لا أسرع.", "2": "كل خلية تحتاج إلى الأكسجين والسكر والمواد المغذية.", "1": "كل خلية يجب أن تتخلص من الفضلات."}, "evp": 53, "back": "L06-s6", "section": "اختر الإجابة الصحيحة", "qa": "v782523855081", "ea": "v3f25a9676d60", "wa": null, "ha": null, "whyA": {"0": "vdf74b730073e", "2": "v1bc8705ecb77", "1": "v64f50cb34a58"}}, {"id": "L06-m9", "src": "L06-q12", "kept": false, "page": 55, "type": "mcq", "text": "ماذا يحدثُ للكروموسوماتِ في المرحلةِ الأخيرةِ منْ مراحلِ الانقسامِ المتساوي؟", "options": ["أ. تصطف عند وسط الخلية", "ب. تتضاعف داخل النواة", "ج. تصبح مرئية لأول مرة", "د. يتكوّن غلاف نووي حول كل مجموعة منها"], "answer": 3, "answerText": "د. يتكوّن غلاف نووي حول كل مجموعة منها", "explain": "الخطوة ٥ (ص٥٥): يتكوّن غلاف نووي حول كل مجموعة من الكروموسومات، ثم ينقسم السيتوبلازم وتنتج خليتان.", "why": {"0": "الاصطفاف في الوسط هو الخطوة ٣.", "1": "التضاعف هو الخطوة ١، في البداية.", "2": "ظهور الكروموسومات هو الخطوة ٢."}, "evp": 55, "back": "L06-s10", "fig": "f55a", "section": "اختر الإجابة الصحيحة", "qa": "va36e6a4cc506", "ea": "vfc815d8dfe75", "wa": null, "ha": null, "whyA": {"0": "vfaeda9639f11", "1": "v7090619377af", "2": "v20445235b81a"}}, {"id": "L06-m10", "src": "L06-q13", "kept": false, "page": 55, "type": "mcq", "text": "ما الخطوةُ الأولى في الانقسامِ المتساوي؟", "options": ["أ. يتضاعف عدد الكروموسومات في نواة الخلية", "ب. ينقسم السيتوبلازم", "ج. تنفصل الكروموسومات إلى طرفي الخلية", "د. تتكوّن صفيحة خلوية"], "answer": 0, "answerText": "أ. يتضاعف عدد الكروموسومات في نواة الخلية", "explain": "الخطوة ١ (ص٥٥): تشاهَد النواة بوضوح، وعند بدء الانقسام المتساوي يتضاعف عدد الكروموسومات.", "why": {"1": "انقسام السيتوبلازم في آخر الانقسام.", "2": "الانفصال هو الخطوة ٤.", "3": "الصفيحة الخلوية تتكون في النبات عند نهاية الانقسام لتفصل الخليتين."}, "evp": 55, "back": "L06-s10", "fig": "f55a", "section": "اختر الإجابة الصحيحة", "qa": "vc8db36db9808", "ea": "v1f0ccb327a4d", "wa": null, "ha": null, "whyA": {"1": "v9723f7d19d45", "2": "va872859bbe8d", "3": "v3ca90c99eca6"}}, {"id": "L06-m11", "src": "L06-q14", "kept": false, "page": 55, "type": "mcq", "text": "تحتوي خلايا جسمِ القطِّ على ٣٨ كروموسومًا. ما عددُ الكروموسوماتِ في كلٍّ منَ الخليتينِ الناتجتينِ عن الانقسامِ المتساوي؟", "options": ["أ. ٣٨", "ب. ١٩", "ج. ٧٦", "د. ٤٦"], "answer": 0, "answerText": "أ. ٣٨", "explain": "في الانقسام المتساوي تحتوي كل خلية جديدة على مجموعة كاملة مماثلة تمامًا لكروموسومات الخلية الأصلية: ٣٨.", "why": {"1": "النصف (١٩) يكون في الانقسام المنصّف، لا المتساوي.", "2": "الخلية تضاعف كروموسوماتها ثم تنقسم، فلا يبقى الضعف في كل خلية.", "3": "٤٦ عدد كروموسومات معظم خلايا الإنسان، لا القط."}, "evp": 54, "back": "L06-s8", "section": "اختر الإجابة الصحيحة", "qa": "vd2c8c84dcd4c", "ea": "v3c02dcde748b", "wa": null, "ha": null, "whyA": {"1": "vf6d0c243f96d", "2": "vb6c1e928166b", "3": "v19de88ec2e7d"}}, {"id": "L06-m12", "src": "L06-q19", "kept": false, "page": 57, "type": "mcq", "text": "في الانقسامِ المنصِّفِ، ماذا يحدثُ بعدَ أنْ تتضاعفَ الكروموسوماتُ؟", "options": ["أ. تنقسم الخلية الانقسام الثاني", "ب. تصطف الكروموسومات في أزواج", "ج. يتحد المشيج المذكر بالمشيج المؤنث", "د. تنتج أربع خلايا مباشرة"], "answer": 1, "answerText": "ب. تصطف الكروموسومات في أزواج", "explain": "أطوار الانقسام المنصّف (ص٥٦–٥٧): تتضاعف الكروموسومات ← تصطف في أزواج ← تبتعد الأزواج ← تنقسم الخلية (الأول) ← … ← تنقسم الخلية (الثاني).", "why": {"0": "الانقسام الثاني يأتي في النهاية بعد الانقسام الأول.", "2": "اتحاد المشيجين يحدث بعد تكوّن الأمشاج، وليس طورًا من الانقسام.", "3": "الخلايا الأربع تنتج بعد انقسامين، لا بعد التضاعف مباشرة."}, "evp": 56, "back": "L06-s11", "fig": "f56a", "section": "اختر الإجابة الصحيحة", "qa": "v6570db4a2fc9", "ea": "v9c5ad86c0a8d", "wa": null, "ha": null, "whyA": {"0": "vd0b4c076db2a", "2": "v1398b294fa31", "3": "vba8b65210377"}}, {"id": "L06-m13", "src": "L06-q20", "kept": false, "page": 57, "type": "mcq", "text": "ما أهميةُ أنْ يُختزَلَ عددُ الكروموسوماتِ في الخلايا الجنسيةِ إلى النصفِ؟", "options": ["أ. حتى تتحرك الخلية الجنسية ذاتيًّا", "ب. حتى تحتوي الخلية المخصبة على ٩٢ كروموسومًا", "ج. حتى تحتوي الخلية المخصبة على العدد الطبيعي ٤٦ لا ضعفه", "د. حتى لا تنقسم الخلية المخصبة أبدًا"], "answer": 2, "answerText": "ج. حتى تحتوي الخلية المخصبة على العدد الطبيعي ٤٦ لا ضعفه", "explain": "كل خلية جنسية في الإنسان فيها ٢٣، فإذا اتحد المشيجان تكوّنت خلية مخصبة فيها ٤٦ مثل الخلية الأم، لا ٩٢.", "why": {"0": "قدرة الحيوان المنوي على الحركة لا علاقة لها بنقص الكروموسومات.", "1": "٩٢ ضعف العدد الطبيعي، وهذا ما يمنعه الانقسام المنصّف.", "3": "الخلية المخصبة تنمو وتنقسم لتصبح مخلوقًا حيًّا جديدًا."}, "evp": 56, "back": "L06-s11", "section": "اختر الإجابة الصحيحة", "qa": "vc5ab46e00d45", "ea": "v83ebb0ad2070", "wa": null, "ha": null, "whyA": {"0": "va800e2081b8e", "1": "vb844b1cc846e", "3": "v672c288c9fb8"}}, {"id": "L06-m14", "src": "L06-q21", "kept": false, "page": 58, "type": "mcq", "text": "في جدولِ ص٥٨: معدلُ العمرِ المتوقعِ للكلبِ ١٢ سنةً، وأطولُ مدةِ حياةٍ له ٢٩ سنةً. كم مرةً تقريبًا تساوي أطولُ مدةِ حياتِه معدلَ عمرِه المتوقعِ؟", "options": ["أ. ١٧ مرة", "ب. ٤١ مرة", "ج. نصف مرة", "د. ٢٫٤ مرة تقريبًا"], "answer": 3, "answerText": "د. ٢٫٤ مرة تقريبًا", "explain": "نقسم أطول مدة حياة على معدل العمر المتوقع: ٢٩ ÷ ١٢ ≈ ٢٫٤ مرة.", "why": {"0": "١٧ ناتج الطرح (٢٩ − ١٢)، والمطلوب القسمة.", "1": "٤١ ناتج الجمع (٢٩ + ١٢)، والمطلوب القسمة.", "2": "أطول مدة حياة أكبر من العمر المتوقع، فالناتج أكبر من مرة."}, "evp": 58, "back": "L06-s14", "fig": "f58c", "section": "اختر الإجابة الصحيحة", "qa": "v68873bd4fafa", "ea": "v103eb88e412a", "wa": null, "ha": null, "whyA": {"0": "v1ab4c2dde2e0", "1": "v3764c8cc5a77", "2": "vcd57057626f6"}}, {"id": "L06-m15", "src": "L06-q22", "kept": false, "page": 58, "type": "mcq", "text": "ما الترتيبُ الصحيحُ لدورةِ حياةِ الإنسانِ؟", "options": ["أ. الولادة ← النضج ← التكاثر ← الهرم ← الموت", "ب. الولادة ← التكاثر ← النضج ← الهرم ← الموت", "ج. النضج ← الولادة ← التكاثر ← الموت ← الهرم", "د. الولادة ← الهرم ← النضج ← التكاثر ← الموت"], "answer": 0, "answerText": "أ. الولادة ← النضج ← التكاثر ← الهرم ← الموت", "explain": "الكتاب (ص٥٨): تشتمل دورة حياة الحيوان على الولادة والنضج والتكاثر والهرم والموت.", "why": {"1": "النضج يأتي قبل التكاثر.", "2": "الولادة هي البداية، والموت هو النهاية.", "3": "الهرم يأتي في آخر الحياة قبل الموت."}, "evp": 58, "back": "L06-s14", "section": "اختر الإجابة الصحيحة", "qa": "vda927250a648", "ea": "vec648c01089f", "wa": null, "ha": null, "whyA": {"1": "vfd9f36a769c5", "2": "v5c8ea0b89222", "3": "ve2c4937f056e"}}, {"id": "L06-m16", "src": "L06-q23", "kept": false, "page": 58, "type": "tf", "text": "توافرُ الغذاءِ والماءِ يؤثّرُ في مدةِ الحياةِ.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "خطأ. الغذاء والماء يؤثران في العمر المتوقع، لكنهما لا يؤثران في مدة الحياة (ص٥٨).", "why": {"0": "الكتاب يقول: هذه العوامل لا تؤثر في مدة الحياة، بل في العمر المتوقع."}, "evp": 58, "back": "L06-s14", "section": "صح أم خطأ", "qa": "v262f265c248c", "ea": "v10ad86b1aae8", "wa": null, "ha": null, "whyA": {"0": "va7911922c2c1"}}, {"id": "L06-m17", "src": "L06-q23", "kept": false, "page": 58, "type": "tf", "text": "تؤثّرُ الظروفُ البيئيةُ في العمرِ المتوقعِ للمخلوقِ الحيِّ.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "صح. الكتاب: «وتؤثر الظروف البيئية في العمر المتوقع، ومنها توافر كمية الغذاء والماء» (ص٥٨).", "why": {"1": "العبارة صحيحة؛ العمر المتوقع يختلف باختلاف الظروف."}, "evp": 58, "back": "L06-s14", "section": "صح أم خطأ", "qa": "v13cc2d123f23", "ea": "v4f69d49947b4", "wa": null, "ha": null, "whyA": {"1": "v9479bf499e17"}}, {"id": "L06-m18", "src": "L06-q24", "kept": false, "page": 59, "type": "mcq", "text": "العمليةُ المستمرةُ منَ النموِّ والانقسامِ والتعويضِ تُسمّى:", "options": ["أ. الانقسام المنصّف", "ب. مدة الحياة", "ج. دورة الخلية", "د. الوراثة"], "answer": 2, "answerText": "ج. دورة الخلية", "explain": "الكتاب: «وتُسمَّى هذه العملية المستمرة من النمو والانقسام والتعويض دورةَ الخلية» (ص٥٢).", "why": {"0": "الانقسام المنصّف ينتج الخلايا الجنسية فقط.", "1": "مدة الحياة أطول زمن يعيشه المخلوق في أفضل الظروف.", "3": "الوراثة انتقال الصفات من الآباء إلى الأبناء."}, "evp": 52, "back": "L06-s5", "section": "اختر الإجابة الصحيحة", "qa": "v25205ff16d4a", "ea": "vf34749adeeae", "wa": null, "ha": null, "whyA": {"0": "vb852b0d54e48", "1": "vd2418ad89def", "3": "vef8326609d17"}}, {"id": "L06-m19", "src": "L06-q25", "kept": false, "page": 59, "type": "mcq", "text": "فيمَ يتشابهُ الانقسامُ المتساوي والانقسامُ المنصِّفُ؟", "options": ["أ. كلاهما ينتج أربع خلايا", "ب. كلاهما يبدأ في النواة", "ج. كلاهما يحدث فيه انقسامان", "د. كلاهما ينتج خلايا بنصف عدد الكروموسومات"], "answer": 1, "answerText": "ب. كلاهما يبدأ في النواة", "explain": "الكتاب (ص٥٧): كلاهما يبدأ في النواة، وبعد مضاعفة الكروموسومات تصبح الخلايا أكثر من الأصلية.", "why": {"0": "المتساوي ينتج خليتين، والمنصّف ينتج أربعًا.", "2": "المتساوي فيه انقسام واحد، والمنصّف انقسامان.", "3": "خلايا المتساوي فيها العدد نفسه، والنصف في المنصّف فقط."}, "evp": 57, "back": "L06-s12", "section": "اختر الإجابة الصحيحة", "qa": "v91d3ede632d2", "ea": "veb23cee943af", "wa": null, "ha": null, "whyA": {"0": "vea1f622e3a68", "2": "v60b654406672", "3": "vb45aad74375c"}}, {"id": "L06-m20", "src": "L06-q26", "kept": false, "page": 59, "type": "tf", "text": "تحتوي الخليةُ الناتجةُ عنِ الانقسامِ المنصِّفِ على العددِ نفسِه منْ كروموسوماتِ الخليةِ الأمِّ.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "خطأ. الخلية الناتجة عن الانقسام المنصّف فيها نصف العدد الأصلي من الكروموسومات (ص٥٧)، مثل ٢٣ بدل ٤٦ في الإنسان.", "why": {"0": "العدد نفسه يكون في الانقسام المتساوي، أما المنصّف فينتج خلايا بنصف العدد."}, "evp": 57, "back": "L06-s12", "section": "صح أم خطأ", "qa": "vb54a153bbac3", "ea": "vcf1c3527c0d4", "wa": null, "ha": null, "whyA": {"0": "v32f83bed1fe0"}}, {"id": "L06-m21", "src": "L06-q27", "kept": true, "page": 59, "type": "mcq", "text": "أختارُ الإجابةَ الصحيحةَ. أطولُ فترةٍ زمنيةٍ يعيشُها المخلوقُ الحيُّ في أفضلِ الظروفِ هيَ:", "options": ["أ. مدةُ الحياةِ", "ب. دورةُ الخليةِ", "جـ. العمرُ المتوقَّعُ", "د. دورةُ الحياةِ"], "answer": 0, "answerText": "أ. مدةُ الحياةِ", "explain": "الكتاب: «وأطول فترة زمنية يعيشها المخلوق في أفضل الظروف تسمى مدة الحياة».", "why": {"1": "دورة الخلية نمو الخلايا وانقسامها وتعويض التالف منها.", "2": "العمر المتوقع هو الزمن الذي سيعيشه المخلوق، ويتغير بالظروف.", "3": "دورة الحياة مراحل النمو: الولادة والنضج والتكاثر والهرم والموت."}, "evp": 58, "back": "L06-s14", "section": "اختر الإجابة الصحيحة", "qa": "v2ec7a381326e", "ea": "v48f7465aa12f", "wa": null, "ha": null, "whyA": {"1": "vd6b2533e4882", "2": "vd8f10ddd42a3", "3": "v866096509ace"}}, {"id": "L06-m22", "src": "L06-q28", "kept": true, "page": 59, "type": "mcq", "text": "أختارُ الإجابةَ الصحيحةَ. ما عددُ الكروموسوماتِ الموجودةِ في الخليةِ الجنسيةِ عندَ الإنسانِ؟", "options": ["أ. ١٢", "ب. ٢٣", "جـ. ٤٦", "د. ٩٢"], "answer": 1, "answerText": "ب. ٢٣", "explain": "الكتاب: «وكل خلية جنسية في الإنسان تحتوي على ٢٣ كروموسومًا»، وهو نصف ٤٦.", "why": {"0": "١٢ ليس عددًا مذكورًا في الكتاب للخلايا الجنسية.", "2": "٤٦ عدد كروموسومات معظم خلايا الجسم، لا الخلية الجنسية.", "3": "٩٢ ضعف العدد الطبيعي، ولا يوجد في خلايا الإنسان."}, "evp": 56, "back": "L06-s11", "section": "اختر الإجابة الصحيحة", "qa": "v2c7f0516576a", "ea": "vf029c0a32621", "wa": null, "ha": null, "whyA": {"0": "v7d3f8abc9b35", "2": "v9f32bb8cda7c", "3": "v7e2dfd44e773"}}, {"id": "L06-m23", "src": "L06-q29", "kept": false, "page": 59, "type": "tf", "text": "في الانقسامِ المنصِّفِ تنقسمُ النواةُ مرةً واحدةً فقط.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "خطأ. في الانقسام المنصّف تنقسم النواة مرتين فتنتج أربع خلايا جنسية (ص٥٦)، أما المتساوي ففيه انقسام واحد.", "why": {"0": "المنصّف فيه انقسامان، والانقسام الواحد في المتساوي."}, "evp": 56, "back": "L06-s11", "section": "صح أم خطأ", "qa": "v2918d0767b14", "ea": "vc266cdefc4ee", "wa": null, "ha": null, "whyA": {"0": "v1003622f7bbf"}}, {"id": "L06-m24", "src": "L06-q31", "kept": false, "page": 59, "type": "mcq", "text": "يُنتجُ جسمُ الإنسانِ ٢٫٣ مليون خليةِ دمٍ حمراءَ تقريبًا كلَّ ثانيةٍ. كم خليةً ينتجُ في دقيقةٍ واحدةٍ؟", "options": ["أ. ٢٫٣ مليون", "ب. ٦٢٫٣ مليون", "ج. ٢٣ مليون", "د. ١٣٨ مليون"], "answer": 3, "answerText": "د. ١٣٨ مليون", "explain": "الدقيقة ٦٠ ثانية: ٢٫٣ × ٦٠ = ١٣٨ مليون خلية تقريبًا.", "why": {"0": "هذا ما ينتجه في ثانية واحدة فقط.", "1": "هذا ناتج الجمع (٢٫٣ + ٦٠)، والمطلوب الضرب.", "2": "هذا ناتج الضرب في ١٠، والدقيقة ٦٠ ثانية."}, "evp": 59, "back": "L06-s15", "section": "اختر الإجابة الصحيحة", "qa": "v269f4ec009f5", "ea": "v665f2506797e", "wa": null, "ha": null, "whyA": {"0": "vafed152bc929", "1": "vfc6f681c07e7", "2": "vcbc0d7dfaea4"}}, {"id": "L06-m25", "src": "point", "kept": false, "page": 52, "type": "mcq", "text": "ماذا يحدثُ في دورةِ الخليةِ بعدَ أنْ تنقسمَ الخليةُ؟", "options": ["أ. تتوقف الخليتان الجديدتان عن النمو إلى الأبد", "ب. تتحد الخليتان معًا من جديد", "ج. تنمو الخليتان الجديدتان وتتكرر الدورة", "د. تتحول الخليتان إلى خلايا جنسية"], "answer": 2, "answerText": "ج. تنمو الخليتان الجديدتان وتتكرر الدورة", "explain": "شكل دورة الخلية (ص٥٢): بعد الانقسام تنمو الخليتان الجديدتان، ثم تتهيآن للانقسام، وتتكرر الدورة.", "why": {"0": "دورة الخلية عملية مستمرة، فالخلايا الجديدة تنمو.", "1": "الخليتان لا تتحدان؛ الاتحاد يحدث بين الأمشاج.", "3": "الخلايا الجنسية تنتج بالانقسام المنصّف فقط."}, "evp": 52, "back": "L06-s5", "fig": "f52a", "section": "اختر الإجابة الصحيحة", "qa": "vbf2539296b75", "ea": "vfe9e53fa462a", "wa": null, "ha": null, "whyA": {"0": "vbfb33ed91420", "1": "v3d6741274347", "3": "v4550871fcffd"}}, {"id": "L06-m26", "src": "point", "kept": false, "page": 52, "type": "tf", "text": "بعدَ اكتمالِ نموِّ الخلايا يموتُ بعضُها، وينقسمُ بعضُها لتعويضِ الخلايا الميتةِ.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "صح. الكتاب (ص٥٢): بعد أن يكتمل نموها تموت بعض الخلايا، وينقسم بعضها الآخر لينتج خلايا جديدة تعوّض الميتة.", "why": {"1": "العبارة صحيحة كما في الكتاب."}, "evp": 52, "back": "L06-s5", "section": "صح أم خطأ", "qa": "v451f88f2f159", "ea": "v1c4fa819f96d", "wa": null, "ha": null, "whyA": {"1": "v4a4926c1d851"}}, {"id": "L06-m27", "src": "point", "kept": false, "page": 52, "type": "mcq", "text": "كلُّ كمْ دقيقةٍ تستطيعُ الخليةُ البكتيريةُ أنْ تُنتجَ خليتينِ جديدتينِ؟", "options": ["أ. ٢٠ دقيقة", "ب. ١٢٠ دقيقة", "ج. ٦٠ دقيقة", "د. ٤٦ دقيقة"], "answer": 0, "answerText": "أ. ٢٠ دقيقة", "explain": "الكتاب (ص٥٢): الخلية البكتيرية تستطيع أن تنتج خليتين جديدتين كل ٢٠ دقيقة.", "why": {"1": "١٢٠ رقم خلايا الدم الحمراء (تُستبدل كل ١٢٠ يومًا).", "2": "الكتاب يذكر ٢٠ دقيقة لا ساعة.", "3": "٤٦ عدد كروموسومات خلايا الإنسان."}, "evp": 52, "back": "L06-s5", "section": "اختر الإجابة الصحيحة", "qa": "vcef747ebada9", "ea": "va158b66ac74b", "wa": null, "ha": null, "whyA": {"1": "vf41658365d4e", "2": "v93ab3c92fa16", "3": "vd9b0dabb0dc8"}}, {"id": "L06-m28", "src": "point", "kept": false, "page": 52, "type": "tf", "text": "يستبدلُ جسمُ الإنسانِ جميعَ خلايا الدمِ الحمراءِ كلَّ ٢٠ يومًا تقريبًا.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "خطأ. الكتاب: يستبدل جسم الإنسان جميع خلايا الدم الحمراء كل ١٢٠ يومًا تقريبًا (ص٥٢).", "why": {"0": "الرقم الصحيح ١٢٠ يومًا، أما ٢٠ فهي دقائق انقسام البكتيريا."}, "evp": 52, "back": "L06-s5", "section": "صح أم خطأ", "qa": "va78ab0c3e83e", "ea": "vc50429dfaf8c", "wa": null, "ha": null, "whyA": {"0": "vd94770710eb4"}}, {"id": "L06-m29", "src": "point", "kept": false, "page": 53, "type": "mcq", "text": "لماذا تتوقفُ الخليةُ عنِ النموِّ؟", "options": ["أ. لأن النواة تختفي", "ب. لأن مساحة الغشاء البلازمي لا تكفي لتبادل المواد مع حجمها الكبير", "ج. لأن الخلية لا تحتاج إلى غذاء", "د. لأن الكروموسومات تتضاعف"], "answer": 1, "answerText": "ب. لأن مساحة الغشاء البلازمي لا تكفي لتبادل المواد مع حجمها الكبير", "explain": "الغشاء البلازمي ينمو بمعدل أقل من نمو حجم الخلية، فتصبح مساحته غير كافية لحصولها على المواد وتخلّصها من الفضلات (ص٥٣).", "why": {"0": "النواة لا تختفي عند توقف النمو.", "2": "كل خلية تحتاج إلى الأكسجين والسكر والمواد المغذية.", "3": "تضاعف الكروموسومات بداية الانقسام، لا سبب توقف النمو."}, "evp": 53, "back": "L06-s6", "section": "اختر الإجابة الصحيحة", "qa": "v69f49eebc0a3", "ea": "v9f2b66e76af8", "wa": null, "ha": null, "whyA": {"0": "v55ea83e74e4a", "2": "v1bc8705ecb77", "3": "vde4140a1abbb"}}, {"id": "L06-m30", "src": "point", "kept": false, "page": 53, "type": "mcq", "text": "متى يحدثُ مرضُ السرطانِ؟", "options": ["أ. عندما لا يُسيطَر على انقسام الخلايا ونموها", "ب. عندما تتوقف الخلايا عن الانقسام تمامًا", "ج. عندما تلتهم الخلية الأكولة خلايا الدم", "د. عندما يُختزَل عدد الكروموسومات إلى النصف"], "answer": 0, "answerText": "أ. عندما لا يُسيطَر على انقسام الخلايا ونموها", "explain": "الكتاب (ص٥٣): يحدث السرطان عندما لا تتم السيطرة على انقسام الخلايا ونموها، وقد تتكون أورام.", "why": {"1": "السرطان انقسام زائد غير مسيطر عليه، لا توقف عن الانقسام.", "2": "الخلية الأكولة خلية دم بيضاء تلتهم الخلية السرطانية، فهي تحمي الجسم.", "3": "اختزال العدد إلى النصف يحدث طبيعيًّا في الانقسام المنصّف."}, "evp": 53, "back": "L06-s7", "fig": "f53a", "section": "اختر الإجابة الصحيحة", "qa": "vaad782fbe294", "ea": "v1860479c5c94", "wa": null, "ha": null, "whyA": {"1": "vd73b334948a6", "2": "v7c92fb265018", "3": "v79f95fa1946f"}}, {"id": "L06-m31", "src": "point", "kept": false, "page": 54, "type": "tf", "text": "تحتوي معظمُ خلايا الإنسانِ على ٢٣ كروموسومًا.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "خطأ. معظم خلايا الإنسان تحتوي على ٤٦ كروموسومًا (ص٥٤)، أما ٢٣ فهو عدد الخلية الجنسية.", "why": {"0": "٢٣ في الخلية الجنسية فقط، ومعظم خلايا الجسم فيها ٤٦."}, "evp": 54, "back": "L06-s8", "section": "صح أم خطأ", "qa": "vac7ee46bd946", "ea": "v42fa3914c894", "wa": null, "ha": null, "whyA": {"0": "vf285a1f77fb0"}}, {"id": "L06-m32", "src": "point", "kept": false, "page": 54, "type": "mcq", "text": "أيُّ الخلايا التاليةِ خليةٌ جسميةٌ تنقسمُ انقسامًا متساويًا؟", "options": ["أ. المشيج المذكر", "ب. البويضة", "ج. خلية الجلد", "د. الخلية الجنسية"], "answer": 2, "answerText": "ج. خلية الجلد", "explain": "الكتاب (ص٥٤): يحدث الانقسام المتساوي في الخلايا الجسمية، ومنها خلايا الجلد والعظام وخلايا الدم البيضاء والعضلات.", "why": {"0": "المشيج المذكر خلية جنسية تنتج بالانقسام المنصّف.", "1": "البويضة خلية جنسية أنثوية تنتج بالانقسام المنصّف.", "3": "الخلية الجنسية تنتج بالانقسام المنصّف لا المتساوي."}, "evp": 54, "back": "L06-s9", "section": "اختر الإجابة الصحيحة", "qa": "v273bb289509f", "ea": "vf08a3825abc7", "wa": null, "ha": null, "whyA": {"0": "v25ef232f49f2", "1": "vf2aa025eb411", "3": "vb12f99202032"}}, {"id": "L06-m33", "src": "point", "kept": false, "page": 55, "type": "mcq", "text": "ما الذي يفصلُ بينَ الخليتينِ الجديدتينِ في الخليةِ النباتيةِ عندَ الانقسامِ المتساوي؟", "options": ["أ. تضيّق الغشاء البلازمي إلى الداخل", "ب. صفيحة خلوية تشبه امتدادًا للجدار الخلوي", "ج. غلاف النواة", "د. الخلية الأكولة"], "answer": 1, "answerText": "ب. صفيحة خلوية تشبه امتدادًا للجدار الخلوي", "explain": "بسبب الجدار الخلوي في النبات تتكون صفيحة خلوية تفصل بين الخليتين. أما في الحيوان فيضيق الغشاء البلازمي إلى الداخل (ص٥٥).", "why": {"0": "تضيّق الغشاء البلازمي يحدث في الخلية الحيوانية.", "2": "غلاف النواة يحيط بالكروموسومات، ولا يفصل الخليتين.", "3": "الخلية الأكولة خلية دم بيضاء تلتهم الخلايا السرطانية."}, "evp": 55, "back": "L06-s9", "section": "اختر الإجابة الصحيحة", "qa": "v9d8c6bb8dc28", "ea": "v419f7fbf3ccf", "wa": null, "ha": null, "whyA": {"0": "ve8fd2d173a06", "2": "v71f23371432d", "3": "v743971b756a3"}}, {"id": "L06-m34", "src": "point", "kept": false, "page": 55, "type": "tf", "text": "في الخطوةِ الأولى منَ الانقسامِ المتساوي تصطفُّ الكروموسوماتُ عندَ وسطِ الخليةِ.", "options": ["صح", "خطأ"], "answer": 1, "answerText": "خطأ", "explain": "خطأ. في الخطوة ١ يتضاعف عدد الكروموسومات في النواة، أما الاصطفاف عند وسط الخلية فهو الخطوة ٣ (ص٥٥).", "why": {"0": "الاصطفاف في الوسط هو الخطوة ٣، والخطوة ١ تضاعف الكروموسومات."}, "evp": 55, "back": "L06-s10", "fig": "f55a", "section": "صح أم خطأ", "qa": "v529a19b68899", "ea": "v4ab8cc195706", "wa": null, "ha": null, "whyA": {"0": "v26a0ce2b2734"}}, {"id": "L06-m35", "src": "point", "kept": false, "page": 56, "type": "mcq", "text": "كيف تتكاثرُ المخلوقاتُ الوحيدةُ الخليةِ؟", "options": ["أ. باتحاد كروموسومات من الأبوين", "ب. بانقسام الخلية", "ج. بالمشيج المؤنث فقط", "د. بالصفيحة الخلوية"], "answer": 1, "answerText": "ب. بانقسام الخلية", "explain": "الكتاب (ص٥٦): تتكاثر المخلوقات الوحيدة الخلية عن طريق انقسام الخلية، أما معظم الحيوانات والنباتات فتتكاثر تكاثرًا جنسيًّا.", "why": {"0": "اتحاد كروموسومات الأبوين هو التكاثر الجنسي في معظم الحيوانات والنباتات.", "2": "المشيج المؤنث يحتاج إلى مشيج مذكر في التكاثر الجنسي.", "3": "الصفيحة الخلوية تفصل الخليتين في النبات فقط."}, "evp": 56, "back": "L06-s11", "section": "اختر الإجابة الصحيحة", "qa": "v295b9d7b1727", "ea": "v65d4c7714356", "wa": null, "ha": null, "whyA": {"0": "v46d9f47ef866", "2": "va09a0dea7444", "3": "vd9a1777aaf39"}}, {"id": "L06-m36", "src": "point", "kept": false, "page": 56, "type": "tf", "text": "ينتجُ عنِ الانقسامِ المنصِّفِ أربعُ خلايا جنسيةٍ، وعنِ اتحادِ المشيجينِ خليةٌ مخصبةٌ فيها ٤٦ كروموسومًا.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "صح. الكتاب (ص٥٦): تنقسم النواة مرتين فتنتج أربع خلايا جنسية في كل منها ٢٣، ويتحد المشيجان فتتكون خلية مخصبة فيها ٤٦.", "why": {"1": "العبارة صحيحة كما في الكتاب."}, "evp": 56, "back": "L06-s11", "fig": "f56a", "section": "صح أم خطأ", "qa": "v185f84ee1a8b", "ea": "v690e169a2f5f", "wa": null, "ha": null, "whyA": {"1": "v4a4926c1d851"}}, {"id": "L06-m37", "src": "point", "kept": false, "page": 57, "type": "mcq", "text": "كم خليةً جديدةً تنتجُ عنِ الانقسامِ المتساوي؟", "options": ["أ. خلية واحدة", "ب. أربع خلايا", "ج. ثماني خلايا", "د. خليتان"], "answer": 3, "answerText": "د. خليتان", "explain": "الكتاب (ص٥٧): عدد الخلايا الناتجة في الانقسام المتساوي خليتان جديدتان، وفي المنصّف أربع خلايا.", "why": {"0": "الانقسام يزيد عدد الخلايا، فلا ينتج خلية واحدة.", "1": "أربع خلايا تنتج عن الانقسام المنصّف.", "2": "ثماني خلايا ليست ناتج انقسام واحد."}, "evp": 57, "back": "L06-s12", "section": "اختر الإجابة الصحيحة", "qa": "va4baeba87160", "ea": "v177beaab02fc", "wa": null, "ha": null, "whyA": {"0": "v6802294f3aa3", "1": "v18df714169f2", "2": "v74c82bc766dd"}}, {"id": "L06-m38", "src": "point", "kept": false, "page": 58, "type": "tf", "text": "العمرُ المتوقعُ يتغيرُ بحسبِ الظروفِ، ومتوسطُ العمرِ للناسِ في المملكةِ العربيةِ السعوديةِ حوالي ٧٣ سنةً.", "options": ["صح", "خطأ"], "answer": 0, "answerText": "صح", "explain": "صح. الكتاب (ص٥٨): يختلف العمر المتوقع اعتمادًا على الظروف، ومتوسط العمر في المملكة حوالي ٧٣ سنة.", "why": {"1": "العبارة صحيحة كما في الكتاب."}, "evp": 58, "back": "L06-s14", "section": "صح أم خطأ", "qa": "v269f2ea69a3f", "ea": "v7f43c82fc593", "wa": null, "ha": null, "whyA": {"1": "v4a4926c1d851"}}]}, {"id": "L07", "unit": "الوحدة الأولى: تنوّع الحياة", "chapter": "الفصل الثاني: الخلية والوراثة", "name": "قراءة علمية: السرطان خلل في دورة الخلية", "pages": [60, 61], "note": "قراءة إثرائية بعد الدرس الأول؛ عنوانها في الكتاب: «السرطانُ: خَلَلٌ في دورةِ الخليةِ».", "sections": [{"id": "L07-s1", "page": 60, "title": "السرطانُ: خَلَلٌ في دورةِ الخليةِ", "book": "وهبَ اللهُ للمخلوقاتِ الحيةِ القدرةَ على السيطرةِ على نموِّ خلاياهُ وانقسامِها؛ حيثُ تتحكّمُ مجموعةُ عواملَ في دورةِ الخليةِ. فالخليةُ تنمو وتنقسمُ وقدْ تتوقّفُ عن النموِّ وفقَ دورةٍ منتظمةٍ لا تؤثّرُ في سلامةِ الخلايا المجاورةِ.\nولكنْ قدْ يحدثُ خللٌ في السيطرةِ على العواملِ التي تتحكّمُ في دورةِ الخليةِ، فتمرُّ الخلايا بسلسلةٍ لا نهائيةٍ من الانقساماتِ تحدثُ بصورةٍ غيرِ منتظمةٍ. وقدْ يؤدِّي النموُّ السريعُ للخلايا إلى تكوُّنِ تجمّعاتٍ للخلايا تُسمّى الأورامَ السرطانيةَ. وهذه الأورامُ تحدثُ في أجسامِ العديدِ من المخلوقاتِ الحيةِ، ومنها الإنسانُ، وقدْ تهدِّدُ حياتَه.", "simple": "وهب الله المخلوقات القدرة على ضبط نمو خلاياها وانقسامها. فالخلية تنمو وتنقسم وتتوقف وفق دورة منتظمة. إذا حدث خلل في هذا الضبط، تنقسم الخلايا بلا نهاية وبلا نظام. فتتكوّن تجمعات اسمها الأورام السرطانية.", "steps": [{"q": "ماذا أرى؟", "t": "نسيج فيه طبقة منتظمة من الخلايا، وكتلة كبيرة غير منتظمة تنتفخ منها.", "fig": "f60a", "parts": [], "a": "v009c112ae752"}, {"q": "ما الأجزاء؟", "t": "خلايا طبيعية في صف منتظم، وخلايا سرطانية متكدّسة.", "fig": "f60a", "parts": ["p1", "p2"], "a": "v6501cf4346c0"}, {"q": "كيف تعمل الخلايا الطبيعية؟", "t": "تنمو وتنقسم وتتوقف وفق دورة منتظمة، ولا تضر الخلايا المجاورة.", "fig": "f60a", "parts": ["p1"], "a": "v422e6d5aabc4"}, {"q": "ماذا يحدث عند الخلل؟", "t": "تنقسم الخلايا انقسامات لا نهائية غير منتظمة، فتتكوّن الأورام السرطانية.", "fig": "f60a", "parts": ["p2"], "a": "v8ccdc18d6bb6"}, {"q": "الفكرة المهمة", "t": "السرطان خلل في السيطرة على العوامل التي تتحكم في دورة الخلية.", "a": "vb32e6c897f7d"}], "figs": ["f60a"], "key": "السرطان خلل في السيطرة على دورة الخلية، فتنقسم الخلايا بلا نظام وتتكوّن أورام.", "sa": "vec1ed1cebe10"}, {"id": "L07-s2", "page": 60, "title": "ما السرطانُ؟", "book": "ويمكنُ القولُ إنَّ السرطانَ مصطلحٌ يشملُ مجموعةً واسعةً منَ الأمراضِ تتميّزُ بنموِّ الخلايا وانقسامِها بشكلٍ غيرِ طبيعيٍّ، ولديْها القدرةُ على اختراقِ أنسجةِ الجسمِ وتدميرِ السليمِ منها. ويمكنُ للسرطانِ الانتشارُ في جميعِ أنحاءِ الجسمِ.\nأطلق اليونان تسميةَ السرطانِ على هذه الأمراضِ تشبيهًا لها بسرطانِ البحرِ ومقدرتهِ على التحركِ بسرعةٍ وفي جميعِ الاتجاهاتِ منْ دونِ أنْ يُحسَّ بهِ أحدٌ.", "simple": "السرطان ليس مرضًا واحدًا، بل مجموعة واسعة من الأمراض. تنمو فيها الخلايا وتنقسم بشكل غير طبيعي، وتخترق الأنسجة السليمة. وسُمّي بهذا الاسم تشبيهًا بسرطان البحر.", "steps": [{"q": "ما السرطان؟", "t": "مصطلح يشمل مجموعة واسعة من الأمراض.", "a": "v6b188e9193a2"}, {"q": "بماذا تتميز؟", "t": "بنمو الخلايا وانقسامها بشكل غير طبيعي.", "a": "v084a9ff97e35"}, {"q": "ماذا تفعل الخلايا السرطانية؟", "t": "تخترق أنسجة الجسم وتدمّر السليم منها، وقد تنتشر في الجسم كله.", "fig": "f60a", "parts": ["p2"], "a": "v74755d9aeeaf"}, {"q": "لماذا سُمّي سرطانًا؟", "t": "شبّهه اليونان بسرطان البحر الذي يتحرك بسرعة وفي كل اتجاه دون أن يُحسّ به أحد.", "a": "ve5543d89a1a1"}], "figs": ["f60a"], "key": "السرطان مجموعة أمراض تنمو فيها الخلايا بشكل غير طبيعي وتخترق الأنسجة السليمة.", "sa": "v7f60f24bd4fd"}, {"id": "L07-s3", "page": 61, "title": "أسبابُ السرطانِ", "book": "أمَّا عنْ أسبابِه فلا يوجدُ سببٌ محددٌ لحدوثِ خللٍ في انقسامِ الخلايا والإصابةِ بالسرطانِ، إلا أنَّ الأطباءَ لاحظوا زيادةً في عددِ المصابينَ بينَ الأشخاصِ الذين يتعرَّضونَ لعواملَ معينةٍ؛ مثلِ التدخينِ، والتلوّثِ، وتناولِ أنواعٍ معينةٍ منَ الموادِّ الغذائيةِ المعلبةِ بشكلٍ مستمرٍّ.\nوالأمراضُ السرطانيةُ في مُجملِها أمراضٌ غيرُ مُعديةٍ، وَلا تنتقِلُ مِنْ شخصٍ إلى آخرَ. وَلا يُوجدُ - حتى الآنَ - ما يُثبتُ أنَّها تنتقلُ بالوراثةِ.", "simple": "لا يوجد سبب محدد للسرطان. لكن الإصابة تزيد عند التعرض للتدخين والتلوث، وكثرة تناول بعض الأغذية المعلبة. والسرطان لا ينتقل بالعدوى من شخص إلى آخر.", "steps": [{"q": "هل له سبب محدد؟", "t": "لا يوجد سبب محدد لحدوث الخلل في انقسام الخلايا.", "a": "vd50b98d77a71"}, {"q": "ماذا لاحظ الأطباء؟", "t": "زيادة الإصابة عند من يتعرضون للتدخين، والتلوث، وتناول أنواع معينة من الأغذية المعلبة باستمرار.", "a": "v6e36718ae11e"}, {"q": "هل هو معدٍ؟", "t": "لا. الأمراض السرطانية في مجملها غير معدية، ولا تنتقل من شخص إلى آخر.", "a": "vccdab1e1b61e"}, {"q": "هل ينتقل بالوراثة؟", "t": "لا يوجد حتى الآن ما يثبت أنه ينتقل بالوراثة.", "a": "v515bde8fef17"}, {"q": "الفكرة المهمة", "t": "نبتعد عن التدخين والتلوث، ونقلل الأغذية المعلبة؛ حفاظًا على صحتنا.", "a": "vf089618ff06c"}], "figs": [], "key": "لا يوجد سبب محدد للسرطان، لكن التدخين والتلوث وبعض الأغذية المعلبة تزيد الإصابة.", "sa": "v5254f44604f0"}, {"id": "L07-s4", "page": 61, "title": "علاجُ السرطانِ", "book": "وعلى الرغمِ مِنْ أنَّ هذا المرضَ يُعدُّ مِنْ أكثرِ الأمراضِ المسبِّبةِ للوفاةِ إلا أنَّ احتمالاتِ الشفاءِ منهُ آخذةٌ في الازديادِ باستمرارٍ في معظمِ الأنواعِ؛ بفضلِ التقدّمِ في أساليبِ الكشفِ المبكِّرِ عنْ هذا المرضِ وأسبابِهِ.\nوقدْ أنشئتِ العديدُ منَ المراكزِ المتخصصةِ في الكشفِ عنْ هذا المرضِ وعلاجِهِ في العالَمِ، وفي المملكةِ العربيّةِ السُّعوديَّةِ تَنتشرُ العديدُ منَ المراكزِ المتقدمةِ لعلاجِ هذا المرضِ، ومِنْ أهمِّها مركزُ المَلكِ عبدُاللَّهِ للأورامِ وأمراضِ الكبدِ في مُستشفَى المَلكِ فيصلٍ التَّخصصيِّ ومركزِ الأبحاثِ الذي يُعدُّ أكبرَ مِرفقٍ طبّيٍّ لعلاجِ الأورامِ في منطقةِ الخليجِ العربيِّ.", "simple": "احتمالات الشفاء من السرطان تزيد باستمرار، بفضل الله ثم التقدم في الكشف المبكر. وفي المملكة مراكز متقدمة لعلاجه، أهمها مركز الملك عبدالله للأورام وأمراض الكبد.", "steps": [{"q": "هل الشفاء ممكن؟", "t": "نعم، احتمالات الشفاء تزداد باستمرار في معظم الأنواع.", "a": "v47eaa651c7ea"}, {"q": "لماذا تزداد؟", "t": "بفضل التقدم في أساليب الكشف المبكر عن المرض وأسبابه.", "a": "v17cda5c6e80c"}, {"q": "أين يُعالج؟", "t": "في مراكز متخصصة في العالم وفي المملكة العربية السعودية.", "a": "v3e12863877db"}, {"q": "ما أهم مركز في المملكة؟", "t": "مركز الملك عبدالله للأورام وأمراض الكبد في مستشفى الملك فيصل التخصصي ومركز الأبحاث.", "a": "vdcc7612f6871"}, {"q": "الفكرة المهمة", "t": "الكشف المبكر يزيد فرص الشفاء، والعلماء والأطباء يعملون لنفع الناس.", "a": "v35ed3ae0f847"}], "figs": [], "key": "الكشف المبكر يزيد احتمالات الشفاء من السرطان، وفي المملكة مراكز متقدمة لعلاجه.", "sa": "vc961cb4ee6cd"}, {"id": "L07-s5", "page": 61, "title": "السببُ والنتيجةُ", "book": "أفكّرُ في الأسبابِ التي تؤدّي إلى حدوثِ ظاهرةٍ أوْ حدثٍ ما.\nما الآثارُ الناتجةُ عنْ وقوعِ تلكَ الأسبابِ؟", "simple": "مهارة السبب والنتيجة: أسأل لماذا حدث الشيء؟ ثم أسأل ماذا نتج عنه؟ مثال: خلل في ضبط دورة الخلية (سبب) ← أورام سرطانية (نتيجة).", "steps": [{"q": "ما السبب؟", "t": "هو ما يؤدي إلى حدوث ظاهرة أو حدث.", "a": "vdca4aa56eb2b"}, {"q": "ما النتيجة؟", "t": "هي الأثر الذي ينتج عن وقوع السبب.", "a": "vbbc07a5dd0ec"}, {"q": "مثال من القراءة", "t": "خلل في السيطرة على دورة الخلية ← انقسامات غير منتظمة ← أورام سرطانية.", "a": "v710f59ee3f16"}], "figs": [], "key": "لكل نتيجة سبب؛ وفي السرطان: الخلل في ضبط الانقسام يسبب الأورام.", "sa": "v230100ac7296"}], "questions": [{"id": "L07-q1", "page": 61, "section": "أكتبُ عنْ: السببُ والنتيجةُ", "type": "explain", "text": "١. لماذا تكونُ انقساماتُ الخلايا وفقَ دورةٍ منتظمةٍ؟", "answerText": "لأن الله وهب المخلوقات القدرة على السيطرة على نمو خلاياها وانقسامها؛ إذ تتحكم مجموعة عوامل في دورة الخلية، فلا تتأثر سلامة الخلايا المجاورة.", "what": "يسألك عن سبب انتظام انقسام الخلايا.", "hint": "اقرأ الفقرة الأولى في ص٦٠.", "explain": "الكتاب: وهب الله المخلوقات القدرة على السيطرة على نمو خلاياها وانقسامها، وتتحكم مجموعة عوامل في دورة الخلية.", "solve": ["السبب: عوامل تتحكم في دورة الخلية، بقدرة وهبها الله.", "النتيجة: تنمو الخلية وتنقسم وتتوقف بنظام.", "فلا تتأثر الخلايا المجاورة."], "keys": [{"t": "تتحكم مجموعة عوامل في دورة الخلية", "alts": ["عوامل", "تتحكم", "السيطرة"]}, {"t": "قدرة وهبها الله للمخلوقات", "alts": ["الله", "وهب"]}], "back": "L07-s1", "fig": null, "evp": 60, "oos": null, "left": [], "right": [], "items": [], "qa": "v45536a0a0347", "ea": "vc25773c57b3e", "wa": "v4259446e9a1f", "ha": "v387a49d984c3", "whyA": {}}, {"id": "L07-q2", "page": 61, "section": "أكتبُ عنْ: السببُ والنتيجةُ", "type": "explain", "text": "٢. ما الذي يسببُ خللًا في السيطرةِ على انقسامِ الخليةِ؟", "answerText": "لا يوجد سبب محدد، لكن الأطباء لاحظوا زيادة الإصابة عند التعرض لعوامل مثل: التدخين، والتلوث، وتناول أنواع معينة من الأغذية المعلبة باستمرار.", "what": "يسألك عن أسباب الخلل في انقسام الخلية.", "hint": "اقرأ فقرة «أما عن أسبابه» في ص٦١.", "explain": "الكتاب: لا يوجد سبب محدد، إلا أن الأطباء لاحظوا زيادة المصابين بين من يتعرضون للتدخين والتلوث وبعض الأغذية المعلبة.", "solve": ["لا يوجد سبب محدد.", "لكن هناك عوامل تزيد الإصابة.", "وهي: التدخين، والتلوث، والأغذية المعلبة باستمرار."], "keys": [{"t": "لا يوجد سبب محدد", "alts": ["محدد", "لا يوجد"]}, {"t": "التدخين", "alts": ["التدخين", "تدخين"]}, {"t": "التلوث", "alts": ["التلوث", "تلوث"]}, {"t": "الأغذية المعلبة", "alts": ["معلبة", "المعلبة", "معلبه"]}], "back": "L07-s3", "fig": null, "evp": 61, "oos": null, "left": [], "right": [], "items": [], "qa": "vbf0669c64c3c", "ea": "vb95cc45bfb43", "wa": "vdaddc146d3bc", "ha": "vb088f48ef28c", "whyA": {}}], "terms": [], "points": [{"t": "وهب الله المخلوقات القدرة على التحكم في نموّ خلاياها وانقسامها، فالخلية تنمو وتنقسم وفق دورة منتظمة لا تضر الخلايا المجاورة.", "page": 60, "sec": "L07-s1", "fig": null, "parts": [], "a": "v8326990b08c4"}, {"t": "إذا حدث خلل في التحكم بدورة الخلية تنقسم الخلايا بلا نهاية وبلا انتظام، وقد يؤدي نموها السريع إلى تجمعات تسمى الأورام السرطانية.", "page": 60, "sec": "L07-s1", "fig": "f60a", "parts": ["p1", "p2"], "a": "v04f458d93e36"}, {"t": "السرطان مجموعة أمراض فيها نموّ وانقسام غير طبيعي، يخترق أنسجة الجسم ويدمّر السليم منها، ويمكن أن ينتشر في الجسم كله.", "page": 60, "sec": "L07-s2", "fig": "f60a", "parts": ["p2"], "a": "v5792f2b44838"}, {"t": "لا يوجد سبب محدد للسرطان، لكنه يزيد مع التدخين والتلوث وأكل أنواع معينة من الأطعمة المعلبة باستمرار.", "page": 61, "sec": "L07-s3", "fig": null, "parts": [], "a": "v82f2cfdaf150"}, {"t": "أمراض السرطان غير مُعدية ولا تنتقل من شخص إلى آخر، ولا يوجد حتى الآن ما يثبت أنها تنتقل بالوراثة.", "page": 61, "sec": "L07-s3", "fig": null, "parts": [], "a": "v2a49fd6ee465"}, {"t": "فرص الشفاء تزداد بفضل التقدم في الكشف المبكر، ومن أهم مراكز العلاج في المملكة مركز الملك عبدالله للأورام وأمراض الكبد في مستشفى الملك فيصل التخصصي ومركز الأبحاث.", "page": 61, "sec": "L07-s4", "fig": null, "parts": [], "a": "vd5d8481be692"}], "quiz": [{"id": "L07-m1", "src": "L07-q1", "kept": false, "page": 61, "type": "mcq", "text": "لماذا تكونُ انقساماتُ الخلايا وفقَ دورةٍ منتظمةٍ؟", "options": ["أ. لأن الخلايا تنقسم بلا نهاية", "ب. لأن الله وهب المخلوقات القدرة على السيطرة على نمو خلاياها وانقسامها", "ج. لأن التدخين ينظم الانقسام", "د. لأن الأورام تنظم دورة الخلية"], "answer": 1, "answerText": "ب. لأن الله وهب المخلوقات القدرة على السيطرة على نمو خلاياها وانقسامها", "explain": "الكتاب (ص٦٠): وهب الله المخلوقات القدرة على السيطرة على نمو خلاياها وانقسامها؛ إذ تتحكم مجموعة عوامل في دورة الخلية، فلا تتأثر سلامة الخلايا المجاورة.", "why": {"0": "الانقسام بلا نهاية وبلا انتظام هو ما يحدث في السرطان.", "2": "التدخين من العوامل التي تزيد الإصابة بالسرطان.", "3": "الأورام تجمعات خلايا تنتج عن خلل في الانقسام."}, "evp": 60, "back": "L07-s1", "section": "اختر الإجابة الصحيحة", "qa": "v042b3d9d1d82", "ea": "vc66c1782a259", "wa": null, "ha": null, "whyA": {"0": "v754fbe503aaf", "2": "v366fd650962a", "3": "v18734f8f7433"}}, {"id": "L07-m2", "src": "L07-q2", "kept": false, "page": 61, "type": "mcq", "text": "ما الذي لاحظَ الأطباءُ أنه يزيدُ الإصابةَ بالسرطانِ (الخللِ في انقسامِ الخليةِ)؟", "options": ["أ. التعلّم والتدريب", "ب. الانتقال من شخص مريض بالعدوى", "ج. التدخين والتلوث وتناول أنواع معينة من الأغذية المعلبة باستمرار", "د. الكشف المبكر"], "answer": 2, "answerText": "ج. التدخين والتلوث وتناول أنواع معينة من الأغذية المعلبة باستمرار", "explain": "الكتاب (ص٦١): لا يوجد سبب محدد، لكن الأطباء لاحظوا زيادة الإصابة مع التدخين والتلوث وتناول أنواع معينة من الأغذية المعلبة باستمرار.", "why": {"0": "التعلم والتدريب يكسبان مهارات، ولا علاقة لهما بالسرطان.", "1": "الكتاب يقول إن أمراض السرطان غير معدية ولا تنتقل من شخص إلى آخر.", "3": "الكشف المبكر يزيد فرص الشفاء، لا الإصابة."}, "evp": 61, "back": "L07-s3", "section": "اختر الإجابة الصحيحة", "qa": "ve9147f6ca27a", "ea": "v4b23ce6546f1", "wa": null, "ha": null, "whyA": {"0": "vd764653a8899", "1": "v0113f398fbee", "3": "v321d66855aee"}}]}, {"id": "L08", "unit": "الوحدة الأولى: تنوّع الحياة", "chapter": "الفصل الثاني: الخلية والوراثة", "name": "الدرس الثاني: الوراثة والصفات", "pages": [62, 69], "note": "الصفحة ٦٩ مراجعة الدرس.", "sections": [{"id": "L08-s1", "page": 62, "title": "أنظرُ وأتساءلُ", "book": "صِغارُ الدِّببةِ في الصورةِ تُشْبِهُ أُمَّها. هلْ حدثَ ذلكَ مصادفةً، أَمِ أنَّ اللهَ تعالَى جعلَ الصفاتِ تنتقلُ منَ الآباءِ إلى الأَبناءِ؟", "simple": "الصغار في الصورة تشبه أمها. هذا ليس مصادفة. الله تعالى جعل الصفات تنتقل من الآباء إلى الأبناء. هذا ما سنتعلمه في درس الوراثة والصفات.", "steps": [{"q": "ماذا أرى؟", "t": "أرى دبة قطبية تمشي على الثلج ومعها صغيران.", "fig": "f62a", "parts": [], "a": "v65e92554d1e3"}, {"q": "كيف يرتبط بغيره؟", "t": "الصغيران يشبهان أمهما في الشكل واللون.", "a": "v515ee2ea7acf"}, {"q": "الفكرة المهمة", "t": "الصفات تنتقل من الآباء إلى الأبناء بتقدير الله تعالى.", "a": "vfaa41eb4d081"}], "figs": ["f62a"], "key": "الأبناء يشبهون آباءهم لأن الصفات تنتقل من الآباء إلى الأبناء.", "sa": "v102863b18224"}, {"id": "L08-s2", "page": 63, "title": "أستكشفُ: ما بعضُ الصِّفاتِ التي يَرِثُها الإنسانُ؟", "book": "لكلِّ شَخصٍ خواصُّ جسْميةٌ تميِّزُهُ. وعلى الرغمِ مِن ذلكَ هناكَ صفاتٌ عديدةٌ يشتركُ فيها الأشخاصُ المختلفونَ. فهلْ أتحلَّى بصفاتٍ مُشابهةٍ لصفاتِ أحدِ زُملائِي في الصَّفِّ؟ أتأمّلُ صفاتِ زُملائي، وأَستعملُ المَعلوماتِ التي حصلْتُ عليها لأعرفَ أيُّ الصّفاتِ أكثرُ ظُهورًا وتَكرارًا.\nأحتاجُ إلى: أوراقٍ بيضاءَ، أقلامِ رصاصٍ\n١ أَطلبُ إلى أحدِ زُملائي أَنْ يتأمَّلَني ليتعرَّفَ أيُّ الصِّفاتِ الظاهرةِ في الصُّورِ المقابلةِ موجودةٌ لديَّ، ثمَّ أُسجِّلُ الصِّفةَ التي أتَّصِفُ بها في جَدولٍ.\n٢ أتبادلُ الأدوارَ معَ زَميلِي، ثمَّ أكرِّرُ الخُطوةَ السابقةَ.\n٣ أَتَواصلُ. أعرِضُ نَتائِجي على الصَّفِّ، وَأُقارِنُها بنَتائجِ زُملائي، وَأُسجِّلُ النّتائجَ في لوحةِ الصفِّ.\n٤ أُفسِّرُ البياناتِ. أَستعملُ بياناتِ لوحةِ الصفِّ، وَأُمثِّلُها برسمٍ بيانيٍّ بالأعمدةِ.\n٥ أستخدِمُ الأرقامَ. أَكتبُ الكسرَ الذي يمثّلُ كلَّ صفةٍ منَ الصفاتِ الموجودةِ في الصفِّ.\n٦ أيُّ الصفاتِ تتكرَّرُ أكثرَ؟\n٧ أَستَنتِجُ. هلْ هناكَ صِفاتٌ شائعةٌ أكثرُ مِنْ غيرِها؟ ولماذا؟\nأستكشفُ أكثرَ: كيفَ أُقارِنُ نَتائِجي بنَتائجِ مجموعاتِ التلاميذِ؟ أضعُ مخطَّطَ تجربةٍ لأتمكَّنَ مِنَ الإجابةِ عنْ هذا السؤالِ.", "simple": "لكل شخص صفات جسمية تميزه. لكن بعض الصفات يشترك فيها كثير من الناس. في هذا النشاط نفحص ثلاث صفات في زملاء الصف. ثم نعرف أي الصفات أكثر تكرارًا.", "steps": [{"q": "ماذا أرى؟", "t": "أرى صورًا لثلاث صفات، ولكل صفة شكلان.", "fig": "f63b", "parts": [], "a": "v2ab048f0a82a"}, {"q": "ما الأجزاء؟", "t": "الإبهام: مقوّس إلى الخلف أو مستقيم.", "fig": "f63c", "parts": [], "a": "v327459d8ac9d"}, {"q": "ما الأجزاء؟", "t": "شحمة الأذن: ملتحمة أو غير ملتحمة.", "fig": "f63d", "parts": [], "a": "v23c36192b49e"}, {"q": "ما الأجزاء؟", "t": "اللسان: قادر على الالتفاف أو غير قادر.", "fig": "f63f", "parts": [], "a": "v7f499bba8486"}, {"q": "ماذا يفعل؟", "t": "زميلي يتأملني ويسجل صفاتي في جدول، ثم نتبادل الأدوار.", "a": "v3014313a8996"}, {"q": "كيف يرتبط بغيره؟", "t": "نجمع نتائج الصف في لوحة، ونمثلها برسم بياني بالأعمدة.", "a": "v0bf584f0b1ad"}, {"q": "الفكرة المهمة", "t": "نكتب كسرًا لكل صفة لنعرف أي الصفات أكثر تكرارًا.", "a": "v4f3e99becb05"}], "figs": ["f63a", "f63b", "f63c", "f63d", "f63e", "f63f", "f63g"], "key": "بعض الصفات الجسمية يشترك فيها كثير من الناس، وبعضها أكثر تكرارًا من غيره.", "sa": "v56ea249f6349"}, {"id": "L08-s3", "page": 64, "title": "ما الوراثةُ؟", "book": "لعلّكَ تجوَّلتَ في إحدَى الحدائقِ، فأبصرتَ الأزهارَ بألوانِها المختلفةِ الجميلةِ. ولعلّكَ لاحظتَ أيضًا اختلافَ ألوانِ عيونِ زملائِك. إن اختلافَ ألوانِ الأزهارِ والعيونِ يعودُ إلَى السببِ نفسِهِ، وهوَ عاملُ الوراثةِ. الوراثةُ تعنِي انتقالَ الصفاتِ الوراثيةِ منَ الآباءِ إلى الأبناءِ.\nوتنطبقُ مبادئُ الوراثةِ على المخلوقاتِ الحيّةِ جميعِها؛ فبعضُ خواصِّ النباتاتِ ـ ومنها لونُ الزهرةِ، وطولُ النباتِ، وشكلُ البذورِ ـ صفاتٌ موروثةٌ. الصفةُ الموروثةُ صفةٌ تنتقلُ من الآباءِ إلى الأبناءِ. ومنَ الصفاتِ الموروثةِ في الإنسانِ لونُ الشَّعرِ والعيونِ، وملامحُ الوجهِ، وحتى طريقةُ الضحكِ. لكنَّ هلْ يمكنُ للوراثةِ أنْ تؤثِّرَ في سلوكِ المخلوقِ الحيِّ؟ بعضُ السلوكِ ـ ومنهُ الغرائزُ ـ صفاتٌ موروثةٌ.\nالغريزةُ سلوكٌ ومهاراتٌ تولدُ مع الإنسانِ أو الحيوانِ، ولا يتمُّ اكتسابُها؛ أيْ أنها سلوكٌ غيرُ مكتسبٍ. هلْ يتعلَّمُ العنكبوتُ مثلاً كيفَ ينسجُ هذهِ الشبكةَ المعقّدةَ، أمْ أنَّ مهارةَ بناءِ الشبكةِ غريزةٌ موروثةٌ؟ نعمْ، هيَ غريزةٌ، تمامًا كما يولدُ صغارُ الإنسانِ يتنفَّسونَ منْ دونِ حاجةٍ إلى تعلّمِ طريقةِ التنفُّسِ. وكما تخرجُ أفراخُ الطيورِ منْ البيضِ ولدى كلِّ نوعٍ منها مهارةٌ وطريقةٌ مختلفةٌ في بناءِ عُشِّه، وكما هو الحالُ أيضًا لدى النحلِ في اتِّخاذِ بيوتِها منَ الأشجارِ والجبالِ.", "simple": "تختلف ألوان الأزهار وألوان العيون بسبب الوراثة. الوراثة انتقال الصفات من الآباء إلى الأبناء. الصفة التي تنتقل هكذا اسمها الصفة الموروثة. وبعض السلوك موروث أيضًا، واسمه الغريزة.", "steps": [{"q": "ماذا أرى؟", "t": "أرى طائر الحباك معلقًا بعشه المنسوج من العشب.", "fig": "f64a", "parts": [], "a": "v34c73606cb39"}, {"q": "ما اسم كل جزء؟", "t": "الوراثة: انتقال الصفات الوراثية من الآباء إلى الأبناء.", "a": "v380024f13f60"}, {"q": "ما الأجزاء؟", "t": "صفات موروثة في النبات: لون الزهرة، وطول النبات، وشكل البذور.", "a": "v52e9471214d8"}, {"q": "ما الأجزاء؟", "t": "صفات موروثة في الإنسان: لون الشعر والعيون، وملامح الوجه، وطريقة الضحك.", "a": "v7a3cf9941bcf"}, {"q": "ماذا يفعل؟", "t": "الغريزة سلوك يولد مع المخلوق، ولا يتعلمه.", "fig": "f64b", "parts": [], "a": "va33f2bfde29a"}, {"q": "الفكرة المهمة", "t": "بناء العنكبوت لشبكته وبناء الحباك لعشه سلوك غريزي موروث.", "a": "v30e5b1185fa0"}], "figs": ["f64a", "f64b"], "key": "الوراثة انتقال الصفات من الآباء إلى الأبناء، وبعض السلوك كالغرائز موروث.", "sa": "vcbe9eff40784"}, {"id": "L08-s4", "page": 65, "title": "ما الوراثةُ؟ (الغريزةُ والصفةُ المكتسَبةُ)", "book": "﴿ وَأَوۡحَىٰ رَبُّكَ إِلَى ٱلنَّحۡلِ أَنِ ٱتَّخِذِي مِنَ ٱلۡجِبَالِ بُيُوتٗا وَمِنَ ٱلشَّجَرِ وَمِمَّا يَعۡرِشُونَ ٦٨ ﴾ النحل. فسبحانَ منْ هداهَا وألهمَها إلى فِعلِ ذلكَ، وأودعَ فيها وفي غيرِها منَ المخلوقاتِ ما يفيدُها منْ صفاتٍ غريزيةٍ.\nوهناكَ سلوكٌ مكتسبٌ غيرُ موروثٍ، وهوَ ما يكتسبُهُ الإنسانُ أو الحيوانُ منْ خلالِ الممارسةِ والخبرةِ. فمثلاً تعلُّمُ علمٍ منَ العلومِ أو مهارةٍ منَ المهاراتِ، كمهارةِ لعبِ كرةِ القدمِ سلوكٌ مكتسبٌ. ولعلَّكَ شاهدْتَ الدلافينَ وهيَ تلعبُ الكرةَ بكلِّ مهارةٍ واقتدارٍ. والصفةُ المكتسبةُ لا تورثُ منْ أبوينِ، بلْ تُكتسبُ بالتعلُّمِ والتدريبِ. وتساعدُ القدرةُ على التَّعلُّمِ على المحافظةِ على البقاءِ والاستجابةِ بشكلٍ أفضلَ للتغيراتِ التي تحدثُ في البيئةِ.\nوتؤثرُ البيئةُ في الصفاتِ المكتسَبةِ بطُرقٍ عدةٍ، فمثلاً كميةُ الماءِ التي يُسقَى بها النباتُ تؤثرُ في طولِهِ. وكميةُ الغذاءِ التي تُطعمُها لصغارِ القططِ تؤثرُ في أحجامِها، وممارسةُ الألعابِ الرياضيةِ تُكسبُ الشخصَ مهاراتٍ رياضيةً.\nوالصفاتُ المكتسبةُ لا تُنقَلُ إلى الأفرادِ الناتجةِ الجديدةِ. ولو كُسرَ غصنُ شجرةٍ فإنَّ هذا لا يؤثّرُ في الصفاتِ التي ستنقلُها الشجرةُ إلى أفرادِها الناتجةِ، بلْ تنمو أغصانٌ جديدةٌ للأفرادِ الجديدةِ.", "simple": "الله ألهم النحل أن تتخذ بيوتها من الجبال والشجر؛ هذه غريزة. أما السلوك المكتسب فنتعلمه بالممارسة والخبرة. الصفة المكتسبة لا تورث من الأبوين. وهي لا تنتقل إلى الأبناء.", "steps": [{"q": "ماذا أرى؟", "t": "أرى دلفينًا يدفع كرة زرقاء في الماء.", "fig": "f65a", "parts": [], "a": "ve4e0f2fea000"}, {"q": "ما اسم كل جزء؟", "t": "لعب الدلفين بالكرة سلوك مكتسب، تعلّمه بالتدريب.", "a": "v5a80e48ddc4c"}, {"q": "ماذا يفعل؟", "t": "القدرة على التعلم تساعد على البقاء والاستجابة لتغيرات البيئة.", "a": "v2e5144d10c7d"}, {"q": "كيف يرتبط بغيره؟", "t": "البيئة تؤثر في الصفات المكتسبة: الماء يؤثر في طول النبات، والغذاء في حجم القطط.", "a": "v1f37247b583d"}, {"q": "الفكرة المهمة", "t": "الصفات المكتسبة لا تنتقل إلى الأبناء؛ فكسر غصن الشجرة لا يؤثر في صفات أفرادها الجديدة.", "a": "v5b9da1e73ed1"}], "figs": ["f65a"], "key": "الصفة المكتسبة تُكتسب بالتعلم والتدريب، ولا تورث من الأبوين.", "sa": "v7e4fc286189f"}, {"id": "L08-s5", "page": 66, "title": "كيفَ تُورَّثُ الصِّفاتُ؟", "book": "مَا الذي يَحكُمُ الصِّفاتِ التي نرثُها عنْ آبائِنَا؟ لماذا يُشبهُ بَعضُ الأشخاصِ أحدَ الآباءِ ولا يشبهُ الآخَرَ؟ لأتعرَّفَ الإجابةَ عنْ هذينِ السؤالينِ يجبُ أنْ أتعرَّفَ نتائجَ تجاربِ العالِمِ جِريجورِ مندلِ الذي اكتشفَ المبادئَ الأساسيةَ لعلمِ الوراثةِ.\nبدأَ جِريجورُ مندلُ تَجاربَهُ على نَباتِ البَازلَّاءِ عام ١٨٥٦م، حيثُ قامَ بِتلقيحِ نَباتاتٍ ذاتِ صِفاتٍ مُختلفةٍ، ولاحَظَ كيفَ تُورَثُ هِذهِ الصِّفاتُ. واستعملَ جِريجورُ مندلُ البازلاءِ في أبحاثِهِ؛ لأنَّها تُنتجُ البُذورَ بِسرعةٍ، مما يسهلُ تتبُّعَ صِفاتِها منْ جيلٍ إلى آخرَ.\nوقدْ توصَّلَ جِريجورُ مندلُ إلى أنَّ الصفاتِ المَوروثةَ تَنتقلُ منَ الآباءِ إلى الأَبناءِ خلالَ عمليةِ التَّكاثُرِ. وأنَّ كُلَّ صِفةٍ مَوروثةٍ يتحكَّمُ فيها عامِلانِ؛ عَامِلٌ منَ الأبِ، وآخرُ منَ الأمِّ يسمَّانِ الجَيناتِ. ويَحتوي الجينُ علَى المعلوماتِ الكيميائيةِ للصفةِ الموروثةِ. وتُخزنُ الجِيناتُ على الكُروموسوماتِ.\nولاحظَ جِريجورُ مندلُ في أثناءِ تجاربِهِ وجودَ أشكالِ صفاتٍ وراثيةٍ تطغَى على أخرَى. فعِندَما قامَ بتلقيحِ بازلاءَ أرجوانيةِ الأزهارِ معَ بازلاءَ بيضاءِ الأزهارِ جاءَ جميعُ الأبناءِ بأزهارٍ أرجوانيةِ اللونِ. فماذا حدثَ إذنْ لصفةِ الأَزهارِ البيضاءِ؟! وَعندَما قامَ جِريجورُ مندلُ بِتلقيحِ نَباتَيْ بازلاءَ أرجوانيَّيِ الأزهارِ منْ أبناءِ الجيلِ الأولِ ظَهرتْ صِفةُ الأزهارِ البيضاءِ مَرةً أُخرى في الجيلِ الثاني. إنَّ صفةَ الأزهارِ البيضاءِ لم تختفِ، وإنَّما منعَتْها منَ الظهورِ صفةُ الأزهارِ الأرجوانيةِ. وتوصَّلَ جريجور مندل إلى أنَّ كُلَّ صفةٍ لها شَكْلٌ سائدٌ وشكلٌ مُتَنَحٍّ. والصفةُ السائدةُ صفةٌ تَمنعُ صفةً أخرَى منَ الظُّهورِ. ومنْ هذهِ الصفاتِ في نباتِ البازلاءِ البذورُ الملساءُ، والأزهارُ الأرجوانيةُ، والقرونُ الخضراءُ. أمّا الصفةُ المتنحِّيةُ فهيَ صفةٌ تَحجُبُها صفةٌ سائدةٌ. ومنَ الصفاتِ المتنحّيةِ في نباتاتِ البازلاءِ البذورُ المجعّدةُ، والأزهارُ البيضاءُ، والقرونُ الصفراءُ.\nوإذا كانَ النباتُ يحملُ جينَ الصفةِ السائدةِ وجينَ الصفةِ المتنحِّيةِ فإنَّ هذا النباتَ يُسمَّى نباتًا هجينًا.\nوقد مثَّلَ العلماءُ الصفاتِ بأَنواعِها بِاستعمالِ الحُروفِ، حيثُ يُمثِّلُ الحرفُ الكبيرُ الصفةَ السائدةَ، والحرفُ الصغيرُ الصفةَ المتنحّيةَ. فَمثلاً في نباتِ البازلاءِ يُرمَزُ لصفةِ الأزهارِ الأرجوانيةِ بالحرفِ (P) بَينما يُرمَزُ لصفةِ الأزهارِ البيضاءِ بالحرفِ (p).", "simple": "العالم جريجور مندل جرّب على نبات البازلاء. وجد أن كل صفة يتحكم فيها جينان: واحد من الأب وواحد من الأم. بعض الصفات سائدة تمنع غيرها من الظهور. والصفة المحجوبة اسمها صفة متنحية.", "steps": [{"q": "ماذا أرى؟", "t": "أرى جدول «صفات نبات البازلاء»: عمود للصفة السائدة وعمود للمتنحية.", "fig": "f66a", "parts": [], "a": "vb81659cb024f"}, {"q": "ما الأجزاء؟", "t": "الجين يحتوي المعلومات الكيميائية للصفة، والجينات مخزنة على الكروموسومات.", "a": "vee1eec2e9e25"}, {"q": "ما اسم كل جزء؟", "t": "الصفة السائدة تمنع غيرها من الظهور: بذور ملساء، أزهار أرجوانية، قرون خضراء.", "fig": "f66a", "parts": ["p1", "p3", "p5"], "a": "va4a952142494"}, {"q": "ما اسم كل جزء؟", "t": "الصفة المتنحية تحجبها صفة سائدة: بذور متجعدة، أزهار بيضاء، قرون صفراء.", "fig": "f66a", "parts": ["p2", "p4", "p6"], "a": "v12426e8b1fa3"}, {"q": "كيف يرتبط بغيره؟", "t": "النبات الذي يحمل جين السائدة وجين المتنحية يسمى نباتًا هجينًا.", "a": "v597342c18f28"}, {"q": "الفكرة المهمة", "t": "الحرف الكبير (P) للصفة السائدة، والحرف الصغير (p) للصفة المتنحية.", "a": "vf35aadcf94a6"}], "figs": ["f66a"], "key": "كل صفة موروثة يتحكم فيها جينان، والصفة السائدة تحجب الصفة المتنحية.", "sa": "v45ec47db908c"}, {"id": "L08-s6", "page": 67, "title": "تلقيحُ البازلّاءِ", "book": "و اكتشافاتُ جريجورَ مندلَ في الوراثةِ مهمةٌ جدًّا؛ لأنها تَنطبقُ على جَميعِ المَخلوقاتِ الحيةِ. فالجِيناتُ التي تُحدِّدُ شكلَ شَحمةِ الأذُنِ وشَكْلَ الإبهامِ لدى الإنسانِ مثلًا لَها شَكْلٌ سَائِدٌ، وآخَرُ مُتنَحٍّ. ومن الطبيعيِّ أن تظهرَ الصفاتُ السائدةُ أكثرَ من الصفاتِ المُتنحيةِ التي يُحجَبُ ظهورُها بتأثيرِ الصفاتِ السائدةِ.\nمفتاحُ الشكلِ: الأزهارُ البيضاءُ صِفةٌ مُتنحيةٌ، الأزهارُ الأرجوانيةُ صِفةٌ سائِدةٌ.", "simple": "الشكل يبين تجربة مندل خطوة خطوة. لقّح زهرة أرجوانية PP مع زهرة بيضاء pp. جاء الجيل الأول كله أرجوانيًا. وفي الجيل الثاني ظهرت الزهرة البيضاء من جديد.", "steps": [{"q": "ماذا أرى؟", "t": "أرى ثلاثة صفوف: جيل الآباء، ثم الجيل الأول، ثم الجيل الثاني.", "fig": "f67b", "parts": [], "a": "v917fe4f7262d"}, {"q": "ما الأجزاء؟", "t": "جيل الآباء: زهرة أرجوانية PP وزهرة بيضاء pp.", "fig": "f67b", "parts": ["p1", "p2"], "a": "v26b81c2e381d"}, {"q": "ماذا يفعل؟", "t": "الجيل الأول: جميعها أرجوانية، وكل زهرة Pp.", "fig": "f67b", "parts": ["p3"], "a": "vaf365582f5d5"}, {"q": "كيف يرتبط بغيره؟", "t": "الجيل الثاني: PP وPp وPp أرجوانية، وpp بيضاء.", "fig": "f67b", "parts": ["p4", "p5"], "a": "v21aae9cd39f1"}, {"q": "الفكرة المهمة", "t": "الصفات السائدة تظهر أكثر من المتنحية التي تحجبها السائدة.", "a": "v85731127484f"}], "figs": ["f67b", "f67c"], "key": "صفة الأزهار البيضاء لم تختفِ، بل حجبتها السائدة، ثم ظهرت في الجيل الثاني.", "sa": "v0465b1dcfab2"}, {"id": "L08-s7", "page": 67, "title": "نشاطٌ: الصفاتُ المَوروثةُ في الذُّرَةِ", "book": "كلُّ حَبةِ ذُرَةٍ هيَ بَذرةٌ مُنفصلةٌ انتقلتْ إليها الصفاتُ الوراثيةُ، كاللونِ مَثلًا، من النَّبتةِ الأمِّ.\n١ ألاحظُ. أنظرُ إلى كُوزِ الذُّرةِ. ماذا ألاحظُ؟\n٢ أعُدُّ الحبوبَ السوداءَ في كُوزِ الذرةِ، وأسجِّلُ عَددَها.\n٣ أعدُّ الحبوبَ الصفراءَ، وأسجلُ عَدَدَها.\n٤ أُفسّرُ البياناتِ. أي لونٍ عددُ حبوبِه أكثرُ؟\n٥ هلْ صفةُ الحبوبِ السوداءِ سائدةٌ أم مُتنحِّيةٌ؟ أفسِّرُ إجابتي.", "simple": "كل حبة ذرة بذرة منفصلة. ورثت صفاتها، مثل اللون، من النبتة الأم. نعدّ الحبوب السوداء والصفراء. ثم نقرر أي اللونين صفة سائدة.", "steps": [{"q": "ماذا أرى؟", "t": "أرى كوز ذرة فيه حبوب بألوان مختلفة.", "fig": "f67a", "parts": [], "a": "vb2431ee81e64"}, {"q": "ماذا يفعل؟", "t": "أعدّ الحبوب السوداء، ثم الصفراء، وأسجل العددين.", "a": "v42f97b119c61"}, {"q": "كيف يرتبط بغيره؟", "t": "أقارن العددين لأعرف أي لون حبوبه أكثر.", "a": "v3a060f706356"}, {"q": "الفكرة المهمة", "t": "الصفة السائدة تظهر عادة أكثر من الصفة المتنحية.", "a": "vef23eb547e6b"}], "figs": ["f67a"], "key": "لون حبة الذرة صفة موروثة، ونستدل بعدد الحبوب على الصفة السائدة.", "sa": "vdb3ff21ba870"}, {"id": "L08-s8", "page": 68, "title": "كيفَ نتتبَّعُ الصفاتِ الوراثيةَ؟", "book": "بَعضُ الصِّفاتِ التي تَحكُمُها الجِيناتُ يَسْهلُ رُؤيتُها، ومنها لونُ الشَّعرِ. وهناكَ صِفاتٌ أُخْرى تَحكُمها الجيناتُ لا يُمكنُكَ رُؤيتُها؛ فبعضُ الأفرادِ يحملون صِفاتٍ غيرَ ظاهِرةٍ. فكيفَ يُمكنُ مثلاً لوالِدينِ لَديهِما غَمّازاتٌ أنْ ينجبَا طِفلًا ليسَ لَه غَمّازاتٌ؟ يُمكنُكَ معرفةُ الإجابةِ عنْ هذا السؤالِ باستخدام مُخطَّطِ السُّلالةِ، وهوَ مُخطَّطٌ يُستعملُ لِتتبُّعِ الصِّفاتِ في العائِلةِ، ودراسةِ الأنماطِ الوِراثيةِ.\nويُظهرُ المُخطّطُ الآباءَ والأبناءَ، وتربطُ الخُطوطُ الأُفقيةُ الآباءَ معًا. أمّا الخُطوطُ العموديةُ فتربطُ الآباءَ بالأبناءِ. كما يُرمزُ إلى الذكورِ في المُخطّطِ بالمُربعاتِ، ويُرمزُ إلى الإناثِ بالدوائرِ. وفي المُخطّطِ التالي تمثّلُ المربعاتُ والدوائرُ الملونةُ الأفرادَ الذين تظهرُ عليهم الصفاتُ السائدةَ وتُمثِّلُ المربعاتُ والدوائرُ ذاتُ الخلفيةِ البيضاءِ الأفرادَ الذين تظهر عليهم الصفاتُ المتنحيةَ.\nيُمكنُكَ رؤيةُ أنَّ كِلا الأبوينِ لهُ غَمّازاتٌ، ولكنَّهما يَحملانِ جينَ الصفةِ المُتنحّيةِ. والحامِلُ للصفةِ هوَ الشخصُ الذي ورثَ جِينَ الصفةِ ولكنَّ الصفةَ لا تَظهرُ عليهِ شكليًا.", "simple": "بعض الصفات نراها، وبعضها لا نراه. مخطط السلالة يتتبع الصفات في العائلة. الذكور مربعات والإناث دوائر. الحامل للصفة يرث جينها، لكنها لا تظهر عليه.", "steps": [{"q": "ماذا أرى؟", "t": "أرى «مخطط السلالة» لصفة الغمازات: جيل الأبوين وجيل الأبناء.", "fig": "f68b", "parts": [], "a": "va8daf1515d3e"}, {"q": "ما الأجزاء؟", "t": "المربع الملون غمازات (سائدة)، والمربع الأبيض بدون غمازات (متنحية).", "fig": "f68c", "parts": [], "a": "vf45904f2f160"}, {"q": "ما اسم كل جزء؟", "t": "الأم دائرة والأب مربع، وكلاهما ملون؛ أي لهما غمازات.", "fig": "f68b", "parts": ["p1", "p2"], "a": "v457752a0ca0e"}, {"q": "ماذا يفعل؟", "t": "الخط الأفقي يربط الأبوين، والخطوط العمودية تربطهما بالأبناء.", "a": "v4fd81f9a1d84"}, {"q": "كيف يرتبط بغيره؟", "t": "ابن واحد مربعه أبيض؛ ليس له غمازات.", "fig": "f68b", "parts": ["p5"], "a": "v77861ef4c556"}, {"q": "الفكرة المهمة", "t": "الأبوان يحملان جين الصفة المتنحية، فهما حاملان للصفة.", "a": "veef56daeceee"}], "figs": ["f68b", "f68c", "f68d"], "key": "مخطط السلالة يتتبع الصفات في العائلة، والحامل يرث جين صفة لا تظهر عليه.", "sa": "vd94a3259144a"}, {"id": "L08-s9", "page": 68, "title": "ما الانتخابُ الطَّبيعيُّ؟", "book": "يُعرفُ الانتخابُ الطَّبيعيُّ بأنَّه عمليةُ تكيُّفِ الكائناتِ الحيَّةِ في بيئةٍ معينةٍ بفضلِ امتلاكِها بعضَ الخصائصِ الَّتي تُمكّنُها من العيشِ في تلكَ البيئةِ أكثرَ من غيرِهَا، وتُعرفُ هذه الخصائصُ باسمِ السِّماتِ التَّكيفيَّةِ، وغالبًا ما تكونُ الكائناتُ الَّتي تمتلكُ هذه السمَات أكثرَ قدرةٍ على البقاءِ والتَّكاثرِ.\nتتوارثُ الكائناتُ الحيَّةُ السِّماتِ التَّكيفيَّةَ عند تكاثرِهَا عبرَ الأجيالِ، ويُعززُ الانتخابُ الطبيعيُّ من انتقالِ هذه السِّماتِ، ويُؤدي أحيانًا إلى تنوُّعِ الكائناتِ الحيَّةِ، وظهورُ أنواعٍ جديدةٍ ذاتِ سماتٍ جديدةٍ، وهو ما ساعدَ على تفسيرِ تنوُّعِ الحياةِ على الأرضِ.\nومن الأمثلةِ الواقعيَّةِ لتأثيرِ الانتخابِ الطبيعيِّ على الحيواناتِ عصافيرُ غالاباغوس حيثُ كانتْ ذاتَ مناقيرَ كبيرةٍ وتتلاءمُ مع الوفرةِ في البذورِ التي تتغذَّى عليها ومعَ حجمِهَا وكانتْ تعيشُ بشكلٍ أفضلَ خلالَ أوقاتِ الأمطارِ الَّتي كانتْ تتسمُ بها البِيئةُ ثمَّ اختلفَ المناخُ وأصبحَ يتَّسمُ بالجفافِ ومع مرورِ الأجيالِ تغيرَّتْ أشكالُ مناقيرِ العصافيرِ لتكونَ أصغرَ لتتكيفَ مع البيئةِ حيثُ كانَ أداءُ العصافيرِ ذاتِ المناقيرِ الصَّغيرةِ أفضلُ في التقاطِ البذورِ الَّتي أصبحتْ نادرةً وصغيرةَ الحجْمِ.", "simple": "بعض المخلوقات لها خصائص تساعدها على العيش في بيئتها أكثر من غيرها. هذه الخصائص اسمها السمات التكيفية. وهي تنتقل عبر الأجيال. هذه العملية اسمها الانتخاب الطبيعي.", "steps": [{"q": "ماذا أرى؟", "t": "أرى رؤوس عصافير غالاباغوس بمناقير مختلفة الأحجام.", "fig": "f68a", "parts": [], "a": "v901abb1466f0"}, {"q": "ما اسم كل جزء؟", "t": "السمات التكيفية خصائص تمكّن المخلوق من العيش في بيئته أكثر من غيره.", "a": "vf0ac10387e2e"}, {"q": "ماذا يفعل؟", "t": "في أوقات الأمطار كانت المناقير الكبيرة تناسب البذور الوفيرة.", "a": "v2fb7b8762cac"}, {"q": "كيف يرتبط بغيره؟", "t": "لما صار المناخ جافًا، صارت المناقير أصغر مع مرور الأجيال.", "a": "vfeabb243cd0e"}, {"q": "الفكرة المهمة", "t": "الانتخاب الطبيعي يساعد على تفسير تنوع الحياة على الأرض.", "a": "v2bd7aae49233"}], "figs": ["f68a"], "key": "الانتخاب الطبيعي تكيّف المخلوقات مع بيئتها بسمات تكيفية تتوارثها عبر الأجيال.", "sa": "vfc052651b7ef"}, {"id": "L08-s10", "page": 69, "title": "مراجعةُ الدرسِ: ملخَّصٌ مصوَّرٌ", "book": "الوراثةُ هي انتقالُ الصِّفاتِ منَ الآباءِ إلى الأَبناءِ.\nوَجدَ جريجورُ مندلُ أنَّ الصِّفاتِ السائدةَ تَمْنَعُ الصِّفاتِ المُتنحِّيةَ منَ الظُّهورِ.\nحاملُو الصفاتِ يمكنُهم نقلُ جيناتِ الصفةِ إلى أبنائِهم على الرغمِ مِنْ أنَّ الصفةَ لا تظهرُ علَيهم. ويُساعدُنا مُخطَّطُ السُّلالةِ على دراسةِ أنماطِ الوراثةِ.", "simple": "الدرس كله في ثلاث أفكار. الوراثة انتقال الصفات من الآباء إلى الأبناء. الصفات السائدة تمنع المتنحية من الظهور. والحامل ينقل جين صفة لا تظهر عليه.", "steps": [{"q": "ماذا أرى؟", "t": "الوراثة: الدبة وصغارها.", "fig": "f69a", "parts": [], "a": "v71f22fb24649"}, {"q": "ما الأجزاء؟", "t": "السائدة والمتنحية: تلقيح البازلاء.", "fig": "f69b", "parts": [], "a": "v75a7735bea2b"}, {"q": "كيف يرتبط بغيره؟", "t": "حاملو الصفات ومخطط السلالة.", "fig": "f69c", "parts": [], "a": "v8a23af3a18f5"}, {"q": "الفكرة المهمة", "t": "ألخص الأفكار الثلاث في مطوية ثلاثية.", "fig": "f69d", "parts": ["p1", "p2", "p3"], "a": "v87c45fa185db"}], "figs": ["f69a", "f69b", "f69c", "f69d"], "key": "الوراثة تنقل الصفات، والسائدة تحجب المتنحية، ومخطط السلالة يتتبع الصفات.", "sa": "v90ea9c0e18b1"}], "questions": [{"id": "L08-q1", "page": 62, "section": "أنظرُ وأتساءلُ", "type": "explain", "text": "صِغارُ الدِّببةِ في الصورةِ تُشْبِهُ أُمَّها. هلْ حدثَ ذلكَ مصادفةً، أَمِ أنَّ اللهَ تعالَى جعلَ الصفاتِ تنتقلُ منَ الآباءِ إلى الأَبناءِ؟", "options": [], "answer": null, "answerText": "ليس مصادفة؛ الله تعالى جعل الصفات تنتقل من الآباء إلى الأبناء، وه
