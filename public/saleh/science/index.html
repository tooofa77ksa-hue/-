}
function origModal(fid) {
  const f = D.figs[fid];
  $('#mbox').innerHTML = `<div class="row" style="justify-content:space-between"><b>${esc(f.title || 'رسم الكتاب')} · صفحة الكتاب ${AR(f.page)}</b><button class="btn" id="mx">✕ إغلاق</button></div><img src="fig/${fid}.webp" alt="${esc(f.title || '')}"><div class="cap">${esc(f.caption || '')}</div><button class="btn" id="mp">📄 افتح الصفحة كاملة</button>`;
  $('#modal').classList.add('on'); $('#mx').onclick = () => $('#modal').classList.remove('on'); $('#mp').onclick = () => pageModal(f.page);
}

/* ---------- questions ---------- */
const TY = {mcq: 'اختيار من متعدد', tf: 'صح أو خطأ', short: 'إجابة قصيرة', fill: 'أكمل', critical: 'التفكير الناقد', explain: 'اشرح', match: 'وصّل', order: 'رتّب', label: 'سمِّ الأجزاء', open: 'سؤال مفتوح'};
const isChoice = q => q.type === 'mcq' || q.type === 'tf' || (q.options && q.options.length > 1 && typeof q.answer === 'number');
function qHTML(q, i) {
  const st = S.ans[q.id];
  let body = '';
  if (isChoice(q)) body = (q.type === 'tf' && !(q.options || []).length ? ['صح', 'خطأ'] : q.options).map((o, k) => `<button class="opt" data-o="${k}">${esc(o)}</button>`).join('');
  else if (q.type === 'match') body = `<p class="note">اضغط عنصرًا من اليمين ثم ما يناسبه من اليسار.</p><div class="mt"><div>${q.left.map((x, k) => `<button data-ml="${k}">${esc(x)}</button>`).join('')}</div><div>${q.rightShuffled.map(k => `<button data-mr="${k}">${esc(q.right[k])}</button>`).join('')}</div></div><div class="row"><button class="btn p" data-q="check">✔ تحقّق</button></div>`;
  else if (q.type === 'order') body = `<p class="note">اضغط العناصر بالترتيب الصحيح.</p><div class="row">${q.shuffled.map(k => `<button class="btn" data-od="${k}">${esc(q.items[k])}</button>`).join('')}</div><ol class="seq"></ol><div class="row"><button class="btn p" data-q="check">✔ تحقّق</button><button class="btn" data-q="reset">↺ من جديد</button></div>`;
  else body = `<textarea placeholder="اكتب إجابتك هنا…"></textarea><div class="row"><button class="btn p" data-q="cmp">✔ قارن إجابتي</button></div>`;
  return `<section class="card q" id="${q.id}"><div class="row" style="justify-content:space-between;margin:0"><b>سؤال ${AR(i + 1)} <span class="tag">${TY[q.type] || ''}</span> <span class="tag">${esc(q.section)}</span></b>${PG(q.page)}</div>
  ${q.oos ? `<div class="oos">⚠️ ${esc(q.oos)}</div>` : ''}
  <div class="book" style="margin-top:6px"><span class="lbl">📖 نص السؤال من الكتاب</span><div class="qt">${esc(q.text)}</div>${q.fig ? figHTML(q.fig) : ''}</div>
  <div class="row"><button class="btn" data-q="what">🤔 ما المطلوب؟</button><button class="btn" data-q="hint">💡 تلميح</button>${q.back ? `<button class="btn" data-q="back">📘 ارجع للشرح</button>` : ''}</div>
  <div class="aux"></div>${body}<div class="out">${st ? `<div class="fb info2">✓ أجبت عنه من قبل${st === 'ok' ? ' إجابة صحيحة' : ''}. يمكنك المحاولة مجددًا.</div>` : ''}</div></section>`;
}
function bindQ(q) {
  const e = document.getElementById(q.id); if (!e) return;
  if (q.fig) mountFig(q.fig, q.id);
  const out = $('.out', e), aux = $('.aux', e);
  let tried = false;
  const sol = () => `<div class="fb info2"><b>✅ الإجابة:</b> ${esc(q.answerText)}<br><b>لماذا؟</b> ${esc(q.explain || '')}
    ${q.solve && q.solve.length ? `<details style="margin-top:6px"><summary><b>🪜 اشرح الحل خطوة بخطوة</b></summary><ol>${q.solve.map(x => `<li>${esc(x)}</li>`).join('')}</ol></details>` : ''}
    <div class="note">الإجابة والشرح من إعدادنا اعتمادًا على الكتاب ${q.evp ? '(صفحة ' + AR(q.evp) + ')' : ''}.</div></div>`;
  const done = ok => { tried = true; S.ans[q.id] = ok ? 'ok' : 'try'; save(); };
  e.addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.q === 'what') aux.innerHTML = `<div class="fb info2">🤔 ${esc(q.what)}</div>`;
    else if (b.dataset.q === 'hint') aux.innerHTML = `<div class="fb info2">💡 ${esc(q.hint)}</div>`;
    else if (b.dataset.q === 'back') { const [l] = findSec(q.back); l && lesson(l.id, 'e', q.back); }
    else if (b.dataset.o != null) {
      const k = +b.dataset.o, ok = k === q.answer;
      $$('.opt', e).forEach((o, j) => { o.classList.remove('ok', 'no'); if (j === k) o.classList.add(ok ? 'ok' : 'no'); });
      if (ok) { $$('.opt', e)[k].classList.add('ok'); out.innerHTML = `<div class="fb ok">👏 أحسنت! ركّزت فوصلت، والتوفيق من الله.</div>` + sol(); }
      else out.innerHTML = `<div class="fb no">قريبة! ${esc((q.why && q.why[k]) || 'راجع الرسم أو الشرح ثم حاول مرة أخرى.')}</div><div class="row"><button class="btn" data-q="show">👀 أرني الحل</button></div>`;
      done(ok);
    }
    else if (b.dataset.q === 'show') { if (isChoice(q)) $$('.opt', e)[q.answer].classList.add('ok'); out.innerHTML = sol(); }
    else if (b.dataset.q === 'cmp') {
      const v = $('textarea', e).value.trim();
      if (!v && S.mode === 'quiz') { toast('اكتب محاولتك أولًا، ثم قارن'); return; }
      const hit = (q.keys || []).map(k => ({k, ok: k.alts.some(a => norm(v).includes(norm(a)))}));
      out.innerHTML = `<div class="fb info2"><b>قارن إجابتك بعناصر الإجابة:</b><div class="chk">${hit.map((h, j) => `<label><input type="checkbox" ${h.ok ? 'checked' : ''}> ${esc(h.k.t)}</label>`).join('')}</div>
        <div class="note">${hit.length ? 'علّمتُ لك العناصر التي وجدتها في إجابتك؛ صحّح العلامات بنفسك أو مع معلمتك.' : ''}</div></div>` + sol();
      done(hit.length && hit.every(h => h.ok));
    }
    else if (b.dataset.ml != null) { $$('[data-ml]', e).forEach(x => x.classList.remove('sel')); b.classList.add('sel'); e._ml = +b.dataset.ml; }
    else if (b.dataset.mr != null && e._ml != null) {
      e._m = e._m || {}; e._m[e._ml] = +b.dataset.mr; const L = $$('[data-ml]', e)[e._ml]; L.classList.remove('sel'); L.classList.add('done'); L.textContent = q.left[e._ml] + ' ← ' + q.right[+b.dataset.mr]; e._ml = null;
    }
    else if (b.dataset.od != null) { e._o = e._o || []; e._o.push(+b.dataset.od); b.disabled = true; $('.seq', e).innerHTML = e._o.map(k => `<li>${esc(q.items[k])}</li>`).join(''); }
    else if (b.dataset.q === 'reset') { e._o = []; $$('[data-od]', e).forEach(x => x.disabled = false); $('.seq', e).innerHTML = ''; }
    else if (b.dataset.q === 'check') {
      let ok;
      if (q.type === 'match') { const m = e._m || {}; ok = q.left.every((_, k) => m[k] === k); }
      else { ok = (e._o || []).join() === q.items.map((_, k) => k).join(); }
      out.innerHTML = ok ? `<div class="fb ok">👏 أحسنت! ركّزت فوصلت.</div>` + sol() : `<div class="fb no">ليس بعد. راجع ترتيبك/توصيلك وحاول مجددًا.</div><div class="row"><button class="btn" data-q="show">👀 أرني الحل</button></div>`;
      done(ok);
    }
  });
}
const norm = s => String(s).replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').trim();

/* ---------- settings ---------- */
$('#setb').onclick = () => {
  $('#mbox').innerHTML = `<div class="row" style="justify-content:space-between"><b>⚙️ الإعدادات</b><button class="btn" id="mx">✕ إغلاق</button></div><div class="set">
  <label>سرعة الحركة والصوت <select id="sp"><option value=".75">بطيئة</option><option value="1">عادية</option><option value="1.25">سريعة</option></select></label>
  <label>تقليل الحركة <input type="checkbox" id="cm"></label>
  <label>كتم الصوت <input type="checkbox" id="mu"></label>
  <label>مسح تقدّمي في هذا الجهاز <button class="btn" id="rs">مسح</button></label></div>
  <p class="note">${esc(D.credit)}</p>`;
  $('#modal').classList.add('on'); $('#mx').onclick = () => $('#modal').classList.remove('on');
  $('#sp').value = String(S.speed); $('#cm').checked = S.calm; $('#mu').checked = S.mute;
  $('#sp').onchange = e => { S.speed = +e.target.value; save(); };
  $('#cm').onchange = e => { S.calm = e.target.checked; S.calmSet = 1; save(); };
  $('#mu').onchange = e => { S.mute = e.target.checked; if (S.mute) stopA(); $('#mute').textContent = S.mute ? '🔇' : '🔊'; save(); };
  $('#rs').onclick = () => { if (confirm('مسح التقدّم والإجابات المحفوظة؟')) { S.seen = {}; S.ans = {}; S.last = null; save(); home(); $('#modal').classList.remove('on'); } };
};
$('#mute').textContent = S.mute ? '🔇' : '🔊';
$('#mute').onclick = () => { S.mute = !S.mute; if (S.mute) stopA(); $('#mute').textContent = S.mute ? '🔇' : '🔊'; save(); toast(S.mute ? 'الصوت مكتوم' : 'الصوت يعمل'); };
$('#home').onclick = home;
if (!window.gsap) window.gsap = {to(t, v) { const els = t instanceof Element ? [t] : t; if (v.attr) for (const k in v.attr) els.setAttribute ? els.setAttribute(k, v.attr[k]) : 0; if ('opacity' in v && els.style) els.style.opacity = v.opacity; if ('x' in v && els.style) els.setAttribute('transform', `translate(${v.x} ${v.y}) `); }, fromTo() {}};
bar(); home();
</script>
</body>
</html>
