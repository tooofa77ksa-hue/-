/* One idea per screen: home = 6 big tiles; each tile opens a deck of cards with a fixed bottom bar. Everything is read aloud. */
:root{--bg:#eef6ff;--card:#fff;--ink:#14263f;--muted:#5f6f86;--line:#d8e4f2;--b:#1f6fd1;--b2:#e6f0fd;--g:#1e8a4f;--g2:#e5f6ec;--o:#f08a24;--y:#ffd84d;--y2:#fff6cc;--r:#d23c3c;--p:#7b4bd1;
--f:'SalehBaloo','Segoe UI',Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:19px;line-height:1.65;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--f)}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#1f6fd1,#7b4bd1);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px}
.top h1{flex:1;margin:0;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:rgba(255,255,255,.18);border:0;border-radius:14px;min-width:48px;min-height:48px;font-size:1.25rem;color:#fff}
.ib.w{background:#fff;color:var(--b)}
main{max-width:720px;margin:0 auto;padding:12px 16px 120px}
.hero{text-align:center;margin:6px 0 10px}
.hero h2{margin:0;font-size:1.6rem}.hero p{margin:0;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:22px;padding:14px 10px;min-height:120px;color:#fff;font-size:1.1rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.tile b{font-size:2.2rem;line-height:1.2}.tile small{font-weight:400;font-size:.8rem;opacity:.95}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 3px 14px rgba(20,38,63,.08);min-height:52vh}
.ct{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85rem;margin-bottom:6px}
.big{font-size:2.6rem;text-align:center;margin:4px 0;line-height:1.2}
.word{font-size:2.3rem;font-weight:700;text-align:center;color:var(--b);letter-spacing:1px}
.spell{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;direction:ltr;margin:6px 0}
.spell span{min-width:38px;height:46px;border-radius:10px;background:var(--b2);display:grid;place-items:center;font-size:1.5rem;font-weight:700;color:var(--b)}
.spell span.on{background:var(--y);color:var(--ink);transform:scale(1.15);transition:transform .15s}
.ar{font-size:1.5rem;text-align:center;font-weight:700}
.hook{background:var(--y2);border:2px dashed #e8c33a;border-radius:16px;padding:8px 12px;margin:10px 0;font-size:1.05rem}
.ex{background:var(--b2);border-radius:16px;padding:8px 12px;margin:8px 0}
.ex .en{font-size:1.15rem;font-weight:700;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:14px;min-height:48px;padding:4px 14px;font-size:1rem}
.chip.on{background:var(--y2);border-color:var(--y)}
.formula{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;direction:ltr;margin:10px 0}
.formula span{border-radius:14px;padding:8px 14px;font-weight:700;font-size:1.3rem;color:#fff}
.bro{background:#111;color:#fff;border-radius:16px;padding:10px 14px;text-align:center;font-size:1.1rem;margin:8px 0}
.bro b{color:var(--y)}
.sent{font-size:1.35rem;font-weight:700;direction:ltr;text-align:left;line-height:1.6}
.sent mark{background:var(--y);border-radius:6px;padding:0 3px}
.sent .k{color:var(--b)}
.lyr{direction:ltr;text-align:left;font-size:1.08rem;line-height:1.7}
.lyr div{padding:3px 8px;border-radius:10px;transition:background .2s}
.lyr div.on{background:var(--y)}
.lyr small{display:block;direction:rtl;text-align:right;color:var(--muted);font-size:.8rem}
.lyr .tag{color:var(--p);font-weight:700}
.style{background:#f3eefe;border:2px solid #d9c9fb;border-radius:14px;padding:8px 12px;font-size:.85rem;direction:ltr;text-align:left;margin:8px 0}
.opt{display:block;width:100%;text-align:left;direction:ltr;border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 14px;margin:8px 0;min-height:54px;font-size:1.15rem}
.opt.ar2{text-align:right;direction:rtl}
.opt.ok{border-color:var(--g);background:var(--g2)}
.opt.no{border-color:var(--r);background:#fdeaea}
.fb{border-radius:16px;padding:8px 12px;margin:8px 0}
.fb.ok{background:var(--g2);border:2px solid var(--g)}.fb.no{background:#fdeaea;border:2px solid var(--r)}
.tiles2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr;margin:10px 0}
.tiles2 button{min-width:52px;min-height:52px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:1.25rem;font-weight:700;padding:0 10px}
.tiles2 button:disabled{opacity:.3}
.built{min-height:56px;border:3px dashed var(--line);border-radius:16px;padding:8px;direction:ltr;text-align:left;font-size:1.25rem;font-weight:700;margin:8px 0}
.built.ok{border-color:var(--g);background:var(--g2)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt button{min-height:56px;border:2px solid var(--line);border-radius:14px;background:#fff;padding:6px;font-size:.95rem;direction:ltr}
.mt button.sel{border-color:var(--b);background:var(--b2)}.mt button.done{border-color:var(--g);background:var(--g2)}
.plan{border-right:6px solid var(--o);background:#fff4e8;border-radius:12px;padding:6px 12px;margin:6px 0}
.cnt{font-size:.9rem;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(238,246,255,.97);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.bar .in{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center}
.nav{flex:1;min-height:56px;border-radius:18px;border:2px solid var(--line);background:#fff;font-size:1.05rem}
.nav.n{background:var(--b);border-color:var(--b);color:#fff}
.nav.n.pulse{animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 0 6px rgba(31,111,209,.25)}}
.nav:disabled{opacity:.35}
#pos{min-width:64px;text-align:center;color:var(--muted);font-size:.9rem}
.dots{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:0 0 10px}.dots i{display:block;height:100%;background:var(--y)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#14263f;color:#fff;padding:8px 16px;border-radius:14px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.chunks{display:flex;flex-direction:column;gap:8px;margin-top:10px}.chunk{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--b2);border:2px solid var(--line);border-radius:16px;padding:10px;font:inherit;cursor:pointer;min-height:44px}.chunk b{font-size:1.35rem;color:var(--b)}.chunk small{color:var(--muted)}.chunk.on{border-color:var(--o);background:var(--y2)}
.units{display:flex;gap:6px;justify-content:center;margin:0 0 10px;flex-wrap:wrap}.un{min-height:44px;display:inline-flex;align-items:center;padding:0 14px;border-radius:14px;background:#fff;color:var(--b);font-weight:700;text-decoration:none;border:2px solid var(--line)}.un.on{background:var(--b);color:#fff;border-color:var(--b)}
@media (max-width:400px){html,body{font-size:17px}.word{font-size:2rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

      const run = () => say([[A('E|' + w.en)], ...spell(), [null, () => sp.forEach(x => x.classList.remove('on'))], [A('E|' + w.en)], [A('R|' + w.ar)], [A('R|' + w.hook)], [A('E|' + w.ex)]], done);
      c.onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a;
        if (a === 'w') say([[A('E|' + w.en)], [A('R|' + w.ar)]]); else if (a === 's') say([...spell(), [null, () => sp.forEach(x => x.classList.remove('on'))]]); else say([[A('E|' + w.ex)], [A('R|' + w.exar)]]); };
      view.replay = run; run();
    }));
    // quick checks for the group: picture → word, and spell with letter tiles
    ws.forEach((w, k) => out.push(k % 2 === 0 ? (c, done) => {
      const ops = shuf([w, ...shuf(D.words.filter(x => x !== w)).slice(0, 3)]);
      c.innerHTML = `<div class="ct"><span>🧠 اختبر نفسك · ${esc(g)}</span></div><div class="big" style="font-size:4rem">${w.e}</div><p class="ar">${esc(w.ar)}</p><p style="text-align:center">اختر الكلمة الصحيحة:</p>${ops.map(o => `<button class="opt" data-w="${esc(o.en)}">${esc(o.en)}</button>`).join('')}<div id="fb"></div>`;
      say([[A('R|' + w.ar)]]);
      $$('.opt', c).forEach(b => b.onclick = () => { const ok = b.dataset.w === w.en; b.classList.add(ok ? 'ok' : 'no');
        if (ok) { $$('.opt', c).forEach(x => x.disabled = true); $('#fb', c).innerHTML = `<div class="fb ok">👏 ${pick(D.praise)}</div>`; say([[A('E|' + w.en)], [A('R|' + pick(D.praise))]], done); }
        else say([[A('R|' + D.retry)]]); });
    } : (c, done) => spellCard(c, done, w.en, w.e, w.ar)));
  });
  return out;
}
function spellCard(c, done, word, emoji, ar, scrambled) {
  const letters = [...word.replace(/ /g, '')], pool = scrambled ? [...scrambled] : shuf(letters);
  c.innerHTML = `<div class="ct"><span>🔡 رتّب الحروف</span></div><div class="big" style="font-size:3.6rem">${emoji}</div>${ar ? `<p class="ar">${esc(ar)}</p>` : ''}
    <div class="built" id="bt"></div><div class="tiles2">${pool.map((ch, k) => `<button data-k="${k}">${esc(ch)}</button>`).join('')}</div>
    <div class="row"><button class="chip" id="rs">↺ من جديد</button><button class="chip" id="hint">💡 أول حرف</button><button class="chip" id="hear">🔊 اسمع الكلمة</button></div><div id="fb"></div>`;
  let got = '';
  const bt = $('#bt', c), fb = $('#fb', c);
  $$('.tiles2 button', c).forEach(b => b.onclick = () => { got += pool[+b.dataset.k]; b.disabled = true; bt.textContent = got;
    if (got.length === letters.length) { if (got.toLowerCase() === letters.join('').toLowerCase()) { bt.classList.add('ok'); fb.innerHTML = `<div class="fb ok">👏 ${pick(D.praise)} <span class="en">${esc(word)}</span></div>`; say([[A('E|' + word)], [A('R|' + pick(D.praise))]], done); }
      else { fb.innerHTML = `<div class="fb no">قريبة! الصحيح: <b class="en">${esc(word)}</b> · اضغط «من جديد» وجرّب</div>`; say([[A('R|' + D.retry)]]); } } });
  $('#rs', c).onclick = () => { got = ''; bt.textContent = ''; bt.classList.remove('ok'); fb.innerHTML = ''; $$('.tiles2 button', c).forEach(x => x.disabled = false); };
  $('#hint', c).onclick = () => toast('أول حرف: ' + letters[0]);
  $('#hear', c).onclick = () => say([[A('E|' + word)]]);
}

/* ---------- 🧩 grammar ---------- */
const COL = ['#1f6fd1', '#e0603a', '#1e8a4f', '#7b4bd1'];
function hl(s) { return esc(s).replace(/\b(is|are|am|where|isn't|aren't|have|has|haven't|hasn't|will|won't|was|were|wasn't|weren't|while|who|which)\b/g, '<mark>$1</mark>').replace(/\b(\w+(ed|en)|built|sent|made|found|seen|written|studied)\b/g, '<span class="k">$1</span>'); }
function grammarCards() {
  const out = [];
  D.grammar.forEach(g => {
    out.push((c, done) => {
      c.innerHTML = `<div class="ct"><span>🧩 القاعدة</span></div><h2 class="en" style="margin:0">${esc(g.title)}</h2>
        <div class="formula">${g.formula.map((f, k) => `<span style="background:${COL[k % 4]}">${esc(f)}</span>`).join('<b style="align-self:center">+</b>')}</div>
        <div class="bro">😎 قاعدة البطل: <b>${esc(g.bro)}</b></div>`;
      view.replay = () => say([[A('R|' + g.bro)]], done); view.replay();
    });
    g.steps.forEach(([en, ar]) => out.push((c, done) => {
      c.innerHTML = `<div class="ct"><span>🧩 ${esc(g.title)}</span></div><div class="formula">${g.formula.map((f, k) => `<span style="background:${COL[k % 4]};font-size:1rem">${esc(f)}</span>`).join('')}</div>
        <p class="sent">${hl(en)}</p><p class="ar" style="font-size:1.15rem;font-weight:400">${esc(ar)}</p>`;
      view.replay = () => say([[A('E|' + en)], [A('R|' + ar)]], done); view.replay();
    }));
    if (g.v3) out.push((c, done) => {
      c.innerHTML = `<div class="ct"><span>📋 التصريف الثالث (V3) من الوحدة</span></div><div class="mt" style="direction:ltr">${g.v3.map(([a, b]) => `<button data-v="${b}">${a} → <b style="color:var(--b)">${b}</b></button>`).join('')}</div><p class="cnt">اضغط أي فعل لتسمعه.</p>`;
      $$('[data-v]', c).forEach(b => b.onclick = () => say([[A('E|' + b.textContent.replace('→', ', '))]])); done();
    });
    if (g.mistakes) out.push((c, done) => {
      c.innerHTML = `<div class="ct"><span>⚠️ أخطاء مشهورة</span></div>${g.mistakes.map(([w, r]) => `<div class="fb no en">${esc(w)}</div><div class="fb ok en">${esc(r)}</div>`).join('<hr>')}${(g.mbro || g.tip) ? `<div class="bro">${esc(g.mbro || g.tip)}</div>` : (D.unit.n === 1 ? '<div class="bro">trees كثير ← <b>are</b> · ocean واحد ← <b>is</b></div>' : '')}`; done();
    });
  });
  D.test.filter(s => s.sec.startsWith('Grammar')).forEach(s => s.items.forEach(it => out.push((c, done) => mcqCard(c, done, it, '🧩 تدريب القواعد'))));
  return out;
}

/* ---------- ✍️ writing ---------- */
function writingCards() {
  // one essay, the easiest way: the 5 questions → each sentence in small pieces (meaning + sound) → build it → spell the key words → the whole paragraph
  const out = [], w = D.writing[0];
  out.push((c, done) => {
    c.innerHTML = `<div class="ct"><span>✍️ ${esc(w.ar)}</span></div><h2 class="en" style="margin:0">${esc(w.title)}</h2>
      <div class="bro">${w.intro ? esc(w.intro) : `تعبير واحد فقط تحفظه: «${esc(w.title)}» ${w.emoji[0]}. في الاختبار تكتبه كما هو. كل سؤال = جملة واحدة.`}</div>
      ${w.plan.map(([q, ar, e], k) => `<div class="plan"><b>${e} ${AR(k + 1)}) ${esc(ar)}</b><div class="en" style="color:var(--muted)">${esc(q)}</div></div>`).join('')}`;
    view.replay = () => say([[A('R|' + 'تعبير واحد فقط تحفظه. كل سؤال جملة واحدة.')], ...w.plan.map(p => [A('R|' + p[1])])], done); view.replay();
  });
  w.model.forEach((s, k) => {
    const ch = w.chunks[k];
    // 1) understand: the sentence in small pieces
    out.push((c, done) => {
      c.innerHTML = `<div class="ct"><span>✍️ الجملة ${AR(k + 1)} من ${AR(w.model.length)} · افهمها</span></div>
        <div class="big" style="text-align:center">${w.emoji[k]}</div><p class="sent en" style="text-align:center">${esc(s)}</p>
        <p class="ar" style="text-align:center;font-weight:400">${esc(w.model_ar[k])}</p>
        <div class="chunks">${ch.map(([en, ar, pr], n) => `<button class="chunk" data-n="${n}"><b class="en">${esc(en)}</b><span>${esc(ar)}</span><small>🔊 ${esc(pr)}</small></button>`).join('')}</div>
        <p class="cnt" style="text-align:center">اضغط أي قطعة لتسمعها ببطء</p>`;
      $$('.chunk', c).forEach(b => b.onclick = () => { const x = ch[+b.dataset.n]; say([[A('E|' + x[0])], [A('R|' + x[1])]]); });
      const bs = $$('.chunk', c);
      view.replay = () => say([...ch.flatMap(([en, ar], n) => [[A('E|' + en), () => bs.forEach((b, j) => b.classList.toggle('on', j === n))], [A('R|' + ar)]]), [A('E|' + s), () => bs.forEach(b => b.classList.remove('on'))]], done); view.replay();
    });
    // 2) build it from the pieces' words

      const words = s.replace(/[.,]/g, m => ' ' + m).split(' ').filter(Boolean), pool = shuf(words.map((x, i) => [x, i]));
      c.innerHTML = `<div class="ct"><span>✍️ الجملة ${AR(k + 1)} · ابنِها بنفسك</span></div>
        <div class="big" style="text-align:center">${w.emoji[k]}</div><p class="ar" style="font-size:1.15rem;font-weight:400;text-align:center">${esc(w.model_ar[k])}</p><p class="cnt">رتّب الكلمات:</p>
        <div class="built" id="bt"></div><div class="tiles2">${pool.map(([x, i]) => `<button data-i="${i}">${esc(x)}</button>`).join('')}</div>
        <div class="row"><button class="chip" id="rs">↺ من جديد</button><button class="chip" id="sh">👀 أرني الجملة</button><button class="chip" id="hr">🔊 اسمعها</button></div><div id="fb"></div>`;
      let got = []; const bt = $('#bt', c), fb = $('#fb', c);
      const fin = () => { bt.classList.add('ok'); fb.innerHTML = `<div class="fb ok">👏 ${pick(D.praise)}</div><div class="bro">✏️ الآن اكتبها في دفترك مرة واحدة.</div>`; say([[A('E|' + s)], [A('R|' + pick(D.praise))]], done); };
      $$('.tiles2 button', c).forEach(b => b.onclick = () => { const i = +b.dataset.i;
        if (words[i] === words[got.length]) { got.push(i); b.disabled = true; bt.textContent = got.map(j => words[j]).join(' ').replace(/ ([.,])/g, '$1'); if (got.length === words.length) fin(); }
        else { b.animate && b.animate([{transform: 'translateX(-6px)'}, {transform: 'translateX(6px)'}, {transform: 'none'}], 250); toast('ليست هذه، جرّب كلمة أخرى'); } });
      $('#rs', c).onclick = () => { got = []; bt.textContent = ''; bt.classList.remove('ok'); fb.innerHTML = ''; $$('.tiles2 button', c).forEach(x => x.disabled = false); };
      $('#sh', c).onclick = () => { fb.innerHTML = `<div class="fb ok en">${esc(s)}</div>`; };

  });

}

/* ---------- 🏁 unit test ---------- */
function mcqCard(c, done, it, head) {
  const [q, ops, a] = it;
  c.innerHTML = `<div class="ct"><span>${esc(head)}</span></div><p class="sent">${hl(q)}</p>${ops.map((o, k) => `<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}<div id="fb"></div>`;
  say([[A('E|' + q.replace(/_+/g, 'blank'))]]);
  $$('.opt', c).forEach(b => b.onclick = () => { const ok = +b.dataset.k === a; b.classList.add(ok ? 'ok' : 'no');
    if (ok) { $$('.opt', c).forEach(x => x.disabled = true); $('#fb', c).innerHTML = `<div class="fb ok">👏 ${pick(D.praise)} <b class="en">${esc(q.replace(/_+/g, ops[a]))}</b></div>`; say([[A('E|' + q.replace(/_+/g, ops[a]))], [A('R|' + pick(D.praise))]], done); }
    else say([[A('R|' + D.retry)]]); });
}
function tfCard(c, done, q, a, ev) {
  c.innerHTML = `<div class="ct"><span>✓ / ✗ صح أم خطأ</span></div><p class="sent">${esc(q)}</p><div class="mt" style="direction:rtl"><button data-v="1" style="font-size:1.6rem">✓ True</button><button data-v="0" style="font-size:1.6rem">✗ False</button></div><div id="fb"></div>`;
  say([[A('E|' + q.replace(/^\S+\s/, m => /\p{Extended_Pictographic}/u.test(m) ? '' : m))]]);
  $$('[data-v]', c).forEach(b => b.onclick = () => { const ok = (b.dataset.v === '1') === a; b.classList.add(ok ? 'done' : 'sel');
    $('#fb', c).innerHTML = ok ? `<div class="fb ok">👏 ${pick(D.praise)}${ev ? `<br><span class="en">${esc(ev)}</span>` : ''}</div>` : `<div class="fb no">قريبة! ${ev ? `الدليل: <span class="en">${esc(ev)}</span>` : 'انظر للصورة مرة ثانية'}</div>`;
    say([[A('R|' + (ok ? pick(D.praise) : D.retry))]], ok ? done : null); });
}
function testCards() {
  const out = [];
  D.test.forEach(s => {
    if (s.type === 'mcq') s.items.forEach(it => out.push((c, done) => mcqCard(c, done, it, '🏁 ' + s.sec)));
    else if (s.type === 'tf') s.items.forEach(([q, a]) => out.push((c, done) => tfCard(c, done, q, a, null)));
    else if (s.type === 'spell') s.items.forEach(([scr, w, e]) => out.push((c, done) => spellCard(c, done, w, e, '', scr)));
    else if (s.type === 'order') s.items.forEach(sent => out.push((c, done) => {
      const words = sent.replace(/[.?]/g, m => ' ' + m).split(' ').filter(Boolean), pool = shuf(words.map((x, i) => [x, i]));
      c.innerHTML = `<div class="ct"><span>🏁 ${esc(s.sec)}</span></div><div class="built" id="bt"></div><div class="tiles2">${pool.map(([x, i]) => `<button data-i="${i}">${esc(x)}</button>`).join('')}</div><div class="row"><button class="chip" id="rs">↺ من جديد</button><button class="chip" id="sh">👀 الحل</button></div><div id="fb"></div>`;
      let got = []; const bt = $('#bt', c);
      $$('.tiles2 button', c).forEach(b => b.onclick = () => { const i = +b.dataset.i; if (words[i] !== words[got.length]) { toast('جرّب كلمة أخرى'); return; }
        got.push(i); b.disabled = true; bt.textContent = got.map(j => words[j]).join(' ').replace(/ ([.?])/g, '$1');
        if (got.length === words.length) { bt.classList.add('ok'); say([[A('E|' + sent)], [A('R|' + pick(D.praise))]], done); } });
      $('#rs', c).onclick = () => { got = []; bt.textContent = ''; bt.classList.remove('ok'); $$('.tiles2 button', c).forEach(x => x.disabled = false); };
      $('#sh', c).onclick = () => { $('#fb', c).innerHTML = `<div class="fb ok en">${esc(sent)}</div>`; };
    }));
    else if (s.type === 'match') out.push((c, done) => {
      const right = shuf(s.items.map((x, i) => i)); let sel = null, n = 0;
      c.innerHTML = `<div class="ct"><span>🏁 ${esc(s.sec)}</span></div><p class="cnt">اضغط السؤال ثم جوابه.</p><div class="mt"><div>${s.items.map((x, i) => `<button data-l="${i}" style="width:100%;margin:4px 0">${esc(x[0])}</button>`).join('')}</div><div>${right.map(i => `<button data-r="${i}" style="width:100%;margin:4px 0">${esc(s.items[i][1])}</button>`).join('')}</div></div><div id="fb"></div>`;
      $$('[data-l]', c).forEach(b => b.onclick = () => { if (b.classList.contains('done')) return; $$('[data-l]', c).forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = +b.dataset.l; say([[A('E|' + s.items[sel][0])]]); });
      $$('[data-r]', c).forEach(b => b.onclick = () => { if (sel == null || b.classList.contains('done')) return;
        if (+b.dataset.r === sel) { b.classList.add('done'); $(`[data-l="${sel}"]`, c).classList.replace('sel', 'done'); say([[A('E|' + s.items[sel][1])]]); sel = null;
          if (++n === s.items.length) { $('#fb', c).innerHTML = `<div class="fb ok">👏 ${pick(D.praise)}</div>`; say([[A('R|' + pick(D.praise))]], done); } }
        else { toast('ليست هذه'); say([[A('R|' + D.retry)]]); } });
    });
  });
  out.push((c, done) => { c.innerHTML = `<div class="big" style="font-size:4rem">🏆</div><h2 style="text-align:center">انتهى اختبار الوحدة!</h2><p style="text-align:center">ركّزت فوصلت، والتوفيق من الله 🌱<br>أعد الأقسام التي أخطأت فيها، وعلّم صاحبك كلمة جديدة 😉</p>`; say([[A('R|' + D.end)]], done); });
  return out;
}
