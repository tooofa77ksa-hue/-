function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function open_(pw,quiet){try{var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
 var out=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},key,u8(D.c));
 try{localStorage.setItem('saleh-pw',pw)}catch(e){}
 var html=new TextDecoder().decode(out);document.open();document.write(html);document.close();return true}
 catch(e){if(!quiet)document.getElementById('msg').textContent='كلمة السر غير صحيحة، جرّب مرة ثانية';return false}}
document.getElementById('f').onsubmit=function(e){e.preventDefault();document.getElementById('msg').textContent='جاري الفتح…';open_(document.getElementById('p').value.trim())};
var h=decodeURIComponent((location.hash||'').slice(1));
if(h){open_(h,true).then(function(ok){if(ok)return;try{var s=localStorage.getItem('saleh-pw');if(s)open_(s,true)}catch(e){}})}
else{try{var s=localStorage.getItem('saleh-pw');if(s)open_(s,true)}catch(e){}}
