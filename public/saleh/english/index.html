<style>
/* Palette taken from Saleh's revision sheets (sky blue page, navy titles, blue/green table heads, orange section pills, cream panels)
   plus the five game rarity colours, which here mark how well a word is remembered. Single light look by choice. */
:root{
  color-scheme:light;
  --sky:#8fd0f5; --sky2:#c7eafc; --cream:#fffaf0; --paper:#ffffff; --line:#cfe3f3;
  --navy:#16365f; --blue:#2f6fc4; --green:#5c9e3c; --orange:#f0882a; --red:#c0392b; --sun:#ffc93c;
  --ink:#1b2a3a; --muted:#5d6f83;
  --r1:#9aa5b1; --r2:#4caf50; --r3:#2f80ed; --r4:#9b51e0; --r5:#f2a20c;
  --ok:#2e9e5b; --ok-bg:#e6f6ec; --bad:#d9534f; --bad-bg:#fdecea;
  --ar:"Saw","Baloo Bhaijaan 2","Readex Pro","Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;
  --body:"Saw","Readex Pro","Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;
  --poem:"Saw","Amiri","Traditional Arabic","Geeza Pro",serif;
  --fs:clamp(16px,.7vw + 12.5px,30px);
  --rad:20px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:var(--body);font-size:var(--fs);line-height:1.6;color:var(--ink);
  background:linear-gradient(180deg,var(--sky) 0,var(--sky2) 60%,#eaf6fd 100%) fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--ar);line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,4.5vw,64px);font-weight:800}
h2{font-size:clamp(22px,2.6vw,42px);font-weight:800}
h3{font-size:clamp(19px,1.8vw,30px);font-weight:700}
p{margin:0}
.en{direction:ltr;unicode-bidi:isolate;font-family:"Readex Pro",system-ui,sans-serif}
.wrap{max-width:min(100%,1180px);margin:0 auto;padding:12px 16px 48px;display:flex;flex-direction:column;gap:16px}

/* ---------- top HUD ---------- */
.hud{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.hud .in{max-width:min(100%,1180px);margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.ava{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:linear-gradient(160deg,var(--rk,#2f80ed),#16365f);border:3px solid #fff;flex:none}
.who b{font-family:var(--ar);font-size:1.05em;display:block;line-height:1.2}
.who small{opacity:.85}
.xp{flex:1;min-width:120px;max-width:340px}
.xp .bar{height:12px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
.xp .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),var(--orange));border-radius:99px;transition:width .5s}
.xp small{display:flex;justify-content:space-between;font-size:.75em;opacity:.9}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:99px;padding:4px 12px;font-weight:700;min-height:40px}
.hbtn{min-width:44px;min-height:44px;border-radius:12px;background:rgba(255,255,255,.14);font-size:1.1em}

/* ---------- generic ---------- */
.card{background:var(--cream);border:3px solid #fff;border-radius:var(--rad);box-shadow:0 6px 0 rgba(22,54,95,.12);padding:clamp(14px,2.4vw,32px);display:flex;flex-direction:column;gap:14px;min-width:0}
.pill{display:inline-block;align-self:flex-start;background:var(--orange);color:#fff;font-family:var(--ar);font-weight:800;border-radius:14px;padding:6px 18px;box-shadow:0 4px 0 #c96a12}
.pill.blue{background:var(--blue);box-shadow:0 4px 0 #1f4f99}.pill.green{background:var(--green);box-shadow:0 4px 0 #3f7426}.pill.navy{background:var(--navy);box-shadow:0 4px 0 #0b1f38}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--orange);color:#fff;font-family:var(--ar);font-weight:800;font-size:1.08em;border-radius:16px;padding:10px 26px;min-height:56px;box-shadow:0 5px 0 #c96a12;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c96a12}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 #1f4f99}.btn.green{background:var(--green);box-shadow:0 5px 0 #3f7426}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:0 5px 0 #b9d3ea;border:2px solid var(--line)}
.btn.big{font-size:1.3em;min-height:68px;padding:12px 34px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.muted{color:var(--muted)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,15em),1fr))}

/* ---------- lobby ---------- */
.lobby{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.hero{background:linear-gradient(150deg,#1f4f99,#16365f);color:#fff;border-radius:var(--rad);padding:clamp(16px,3vw,36px);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.hero .bus{position:absolute;inset-inline-end:-10px;top:-6px;font-size:clamp(60px,9vw,120px);opacity:.9;animation:float 4s ease-in-out infinite}
.hero p{opacity:.92;max-width:34em}
.daily{background:var(--paper);border-radius:var(--rad);padding:16px;display:flex;flex-direction:column;gap:10px;border:3px solid var(--sun);box-shadow:0 6px 0 rgba(242,162,12,.35)}
.daily .num{font-family:var(--ar);font-weight:800;font-size:2.2em;color:var(--orange);line-height:1}
.island{position:relative;text-align:start;background:var(--paper);border-radius:var(--rad);border:3px solid var(--c);box-shadow:0 6px 0 var(--c);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:150px;transition:transform .15s}
.island:hover{transform:translateY(-3px)}
.island .ic{font-size:2.6em;line-height:1;animation:float 3.4s ease-in-out infinite}
.island:nth-child(2n) .ic{animation-delay:-1.7s}
.island .t{font-family:var(--ar);font-weight:800;font-size:1.15em;line-height:1.3}
.island .meter{height:10px;background:#e8eef5;border-radius:99px;overflow:hidden}
.island .meter i{display:block;height:100%;background:var(--c)}
.rar{display:flex;gap:4px;flex-wrap:wrap;font-size:.8em}
.rar span{border-radius:8px;padding:0 8px;color:#fff;font-weight:700}

/* ---------- unit ---------- */
.uhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.uhead .ic{font-size:3em;line-height:1;animation:float 3.4s ease-in-out infinite}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tab{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--ar);font-weight:800;min-height:96px;box-shadow:0 5px 0 #b9d3ea}
.tab .e{font-size:1.9em;line-height:1}
.tab.on{border-color:var(--orange);background:#fff4e6;box-shadow:0 5px 0 #f2b773}
.tab small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.72em}

/* word cards */
.words{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,9.5em),1fr))}
.wc{background:var(--paper);border:3px solid var(--rc,var(--r1));border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-height:132px;position:relative}
.wc .e{font-size:2.3em;line-height:1.1}
.wc .w{font-weight:700;color:var(--blue);font-size:1.02em;line-height:1.25}
.wc .a{color:var(--green);font-family:var(--ar);font-weight:700;font-size:.92em}
.wc .lv{position:absolute;top:6px;inset-inline-start:6px;width:12px;height:12px;border-radius:50%;background:var(--rc,var(--r1))}

/* flash card */
.flash{perspective:1200px;align-self:center;width:min(100%,520px)}
.flash .inner{position:relative;min-height:330px;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border:4px solid var(--blue);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center}
.flash .back{transform:rotateY(180deg);border-color:var(--green)}
.flash .e{font-size:clamp(70px,14vw,130px);line-height:1}
.flash .w{font-size:clamp(30px,4vw,54px);font-weight:800;color:var(--blue)}
.flash .a{font-family:var(--ar);font-weight:800;font-size:clamp(26px,3.4vw,44px);color:var(--green)}
.flash .s{font-size:.95em}

/* grammar */
.rule{background:var(--paper);border:3px dashed var(--blue);border-radius:18px;padding:14px 16px;font-weight:700;text-align:center;font-size:1.08em}
.ex{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.ex>div{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:600}
.ex .arw{border:0;background:none;color:var(--green);font-size:1.6em;padding:0}
.note{background:#fff8e1;border-inline-start:6px solid var(--sun);border-radius:12px;padding:10px 14px}
.k-b{color:var(--blue);font-weight:800}.k-o{color:var(--orange);font-weight:800}.k-g{color:var(--green);font-weight:800}.k-r{color:var(--red);font-weight:800}
.bad-line{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:3px}

/* ---------- battle ---------- */
.battle-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.shield{flex:1;min-width:160px}
.shield .bar{height:16px;background:#dfe9f3;border-radius:99px;overflow:hidden;border:2px solid #fff}
.shield .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fc3f7,var(--blue));transition:width .35s}
.storm{font-weight:800;color:var(--navy);background:#fff;border-radius:99px;padding:4px 14px;border:2px solid var(--line)}
.storm.low{color:#fff;background:#7b3fe4;border-color:#7b3fe4;animation:pulse 1s infinite}
.qbox{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.qk{font-family:var(--ar);font-weight:800;color:var(--muted);font-size:.9em}
.prompt{font-size:1.25em;font-weight:700;text-align:center}
.prompt .e{display:block;font-size:clamp(64px,11vw,120px);line-height:1.1;animation:pop .4s ease-out}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:12px;min-height:66px;font-weight:700;font-size:1.08em;line-height:1.35;box-shadow:0 4px 0 #b9d3ea;overflow-wrap:anywhere}
.opt:active{transform:translateY(2px)}
.opt.good{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 #9fd8b4}
.opt.badx{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 #f1b0ac}
.opt.dim{opacity:.4}
.opt.ar{font-family:var(--ar)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-width:48px;min-height:52px;padding:6px 12px;border-radius:12px;background:var(--paper);border:3px solid var(--blue);font-weight:800;font-size:1.15em;box-shadow:0 4px 0 #9fbbe6}
.tile.used{visibility:hidden}
.slot{min-height:64px;border:3px dashed var(--blue);border-radius:16px;background:#f3f8fe;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:8px}
.slot .tile{box-shadow:none;border-color:var(--green)}
.type{width:100%;font:inherit;font-size:1.3em;font-weight:700;text-align:center;direction:ltr;border:3px solid var(--blue);border-radius:16px;padding:12px;background:#fff;color:var(--ink)}
.type.good{border-color:var(--ok);background:var(--ok-bg)}.type.badx{border-color:var(--bad);background:var(--bad-bg)}
.diff{direction:ltr;text-align:center;font-size:1.4em;font-weight:800;letter-spacing:.06em}
.diff .y{color:var(--ok)}.diff .n{color:var(--bad);text-decoration:underline}
.passage{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:600;line-height:1.8}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs>div{display:flex;flex-direction:column;gap:10px;min-width:0}
.opt.sel{border-color:var(--orange);background:#fff4e6}
#fb{min-height:3em;border-radius:16px;padding:10px 14px;text-align:center;font-family:var(--ar);font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#fb.ok{background:var(--ok-bg);color:var(--ok);border:2px solid var(--ok);animation:pop .35s}
#fb.bad{background:#fff4e6;color:#b35a00;border:2px solid var(--orange)}
#fb.show{background:#eef4fd;color:var(--navy);border:2px solid var(--blue)}
#fb .why{font-family:var(--body);font-weight:600;font-size:.9em}
.shake{animation:shake .35s}

/* victory */
.victory{text-align:center;align-items:center;background:radial-gradient(circle at 50% 0,#fff6d6,var(--cream) 60%)}
.victory .crown{font-size:clamp(70px,14vw,140px);line-height:1;animation:pop .6s ease-out,float 3s ease-in-out .6s infinite}
.victory .big{font-family:var(--ar);font-weight:800;font-size:clamp(34px,6vw,80px);color:var(--orange);line-height:1.1;text-shadow:0 4px 0 #ffe0b0}
.poem{font-family:var(--poem);font-size:1.3em;line-height:2;color:var(--navy);background:#fff;border:3px solid var(--sun);border-radius:18px;padding:10px 18px}
.poem small{display:block;font-family:var(--body);font-size:.6em;color:var(--muted)}
.loot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.loot span{background:#fff;border-radius:14px;padding:6px 14px;border:2px solid var(--line);font-weight:700}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.conf i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}

/* toast */
#toast{position:fixed;inset-inline:0;bottom:16px;margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--navy);color:#fff;font-family:var(--ar);font-weight:800;padding:12px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:10;text-align:center;opacity:0;transform:translateY(20px);transition:.3s}
#toast.on{opacity:1;transform:none}

/* trace canvas */
.trace{position:relative;width:100%;max-width:720px;align-self:center;aspect-ratio:16/7;background:#fff;border:3px solid var(--blue);border-radius:18px;overflow:hidden;touch-action:none}
.trace canvas{position:absolute;inset:0;width:100%;height:100%}
table.par{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
table.par td,table.par th{border-bottom:1px solid var(--line);padding:8px;text-align:start}
.exam-q{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.exam-sec{display:flex;flex-direction:column;gap:12px}
.exam-sec>h3{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.marks{font-family:var(--body);font-size:.75em;color:var(--muted);direction:ltr}

/* print sheet */
#print{display:none}
@media print{
  body{background:#fff}
  .hud,.wrap,#toast{display:none!important}
  #print{display:block;font-family:"Readex Pro",sans-serif;color:#000}
  #print h2{font-size:22px;margin:0 0 8px}
  #print .ln{border-bottom:1.5px solid #888;height:46px;position:relative;margin-bottom:6px}
  #print .ln span{position:absolute;bottom:4px;left:8px;font-size:30px;color:#c8c8c8;letter-spacing:.04em}
  #print .ln.mid::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed #ccc}
  #print .pg{page-break-after:always;direction:ltr}
}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(8px)}50%{transform:translateX(-8px)}75%{transform:translateX(4px)}}
@keyframes pulse{50%{opacity:.6}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (max-width:760px){.lobby{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.exam-q .pairs{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.ex{grid-template-columns:1fr}.ex .arw{transform:rotate(90deg)}.pairs{gap:6px}.pairs .opt{font-size:.92em;padding:10px 8px}
  .hud .in{gap:6px;padding:6px 10px}.ava{width:38px;height:38px;font-size:20px;border-radius:11px}.who small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.75em}.hbtn{min-width:40px;min-height:40px}.chip{min-height:40px;padding:2px 10px}
  .hud .xp{order:3;max-width:none;flex-basis:100%}.xp small{display:none}.xp .bar{height:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.shake,.conf i,.storm.low{animation:none!important}.island .ic,.uhead .ic,.hero .bus,.victory .crown{animation:float 6s ease-in-out infinite!important}}
</style>

  var ws=u.words.map(function(w){return {u:u,w:w,id:wid(u,w)}});
  // weakest first: new or low-box words, then the rest
  ws.sort(function(a,b){return boxOf(a.id)-boxOf(b.id)||Math.random()-.5});
  var qs=bankItems(u);if(lessonId)qs=qs.filter(function(x){return x.b.l===lessonId});
  if(mode==='words')return pick(ws.slice(0,Math.max(n,12)),n).map(function(x){x.task=wordTask(x);return x});
  if(mode==='grammar'){var g=qs.filter(function(x){return x.b.k!=='reading'});return pick(g,Math.min(n,g.length))}
  var a=pick(ws.slice(0,14),6).map(function(x){x.task=wordTask(x);return x});return shuffle(a.concat(pick(qs,n-a.length)))}

  cv.onpointerdown=function(e){down=true;cv.setPointerCapture(e.pointerId);var p=pt(e);ctx.beginPath();ctx.moveTo(p[0],p[1])};cv.onpointermove=function(e){if(!down)return;var p=pt(e);ctx.lineTo(p[0],p[1]);ctx.stroke()};cv.onpointerup=cv.onpointercancel=function(){down=false};
  cl.onclick=guide}
function printSheet(u){var p=$('#print');p.innerHTML='';var pg=el('div','pg');pg.appendChild(el('h2',null,'Unit '+u.n+': '+esc(u.en)+' — Handwriting · Saleh'));

// ---------- EXAM ----------
function examTab(u){var c=el('div','card');c.appendChild(el('span','pill navy','🏆 الاختبارات'));
  c.appendChild(el('p',null,'نفس شكل اختبار المدرسة: أقسام ودرجات ووقت. لا تظهر الإجابات إلا في النهاية، وكل خطأ يدخل تلقائيًا في مراجعتك اليومية.'));
  var list=(u.exams||[]).slice();list.push({title:'اختبار ذكي متجدد',sub:'أسئلة جديدة كل مرة من الوحدة',auto:true});
  var g=el('div','grid');list.forEach(function(x){var b=el('button','island');b.type='button';b.style.setProperty('--c','#16365f');b.innerHTML='<div class="ic">'+(x.auto?'🎲':'📝')+'</div><div class="t">'+esc(x.title)+'</div><small class="muted">'+esc(x.sub||((x.time?x.time+' دقيقة · ':'')+(x.total?x.total+' درجة':'')))+'</small>';b.onclick=function(){exam(x.auto?autoExam(u):x,u)};g.appendChild(b)});
  c.appendChild(g);var last=U(u.id).exam;if(last)c.appendChild(el('p','muted','آخر نتيجة: '+last.score+' / '+last.total));main.appendChild(c)}
function autoExam(u){var ws=pick(u.words,8),q=bankItems(u).map(function(x){return x.b});
  var secs=[{h:'Vocabulary: choose the correct word',m:4,items:ws.slice(0,4).map(function(w){var o=shuffle([w].concat(pick(u.words.filter(function(x){return x!==w}),2)));return {t:'mcq',pic:w.e,q:'This is a/an …',o:o.map(function(x){return x.en}),a:o.indexOf(w)}})},
    {h:'Orthography: choose the missing letter',m:4,items:ws.slice(4,8).map(function(w){var i=w.en.search(/[aeiou]/i);if(i<0)i=0;var L=w.en[i].toLowerCase();var o=shuffle([L].concat(pick('aeiou'.split('').filter(function(c){return c!==L}),2)));return {t:'mcq',q:w.en.slice(0,i)+'_'+w.en.slice(i+1),o:o,a:o.indexOf(L)}})}];
  var g=pick(q.filter(function(b){return b.t==='mcq'}),4);if(g.length)secs.push({h:'Grammar: choose the correct answer',m:g.length,items:g});
  var o=pick(q.filter(function(b){return b.t==='order'}),2);if(o.length)secs.push({h:'Order the words',m:o.length*2,items:o});
  var t=pick(q.filter(function(b){return b.t==='tf'}),3);if(t.length)secs.push({h:'Read and answer: True or False',m:t.length,items:t});
  var w=pick(q.filter(function(b){return b.t==='write'}),2);if(w.length)secs.push({h:'Do as shown in brackets',m:w.length*2,items:w});
  return {title:'اختبار ذكي · الوحدة '+u.n,time:25,sections:secs}}
function exam(x,u){screen();var c=el('div','card');main.appendChild(c);var left=(x.time||25)*60;
  var tm=el('div','row');tm.style.justifyContent='space-between';tm.innerHTML='<h2>'+esc(x.title)+'</h2><span class="storm" id="etm"></span>';c.appendChild(tm);
  var tst=cheer('examStart');if(tst)c.appendChild(el('p',null,'🤲 '+esc(tst)));
  var answers=[];var total=0;
  x.sections.forEach(function(s,si){var sec=el('div','exam-sec');sec.appendChild(el('h3',null,'<span class="en">'+(si+1)+'- '+fmt(s.h)+'</span><span class="marks">…/ '+s.m+' marks</span>'));if(s.txt)sec.appendChild(el('div','passage en',fmt(s.txt)));
    var per=s.m/s.items.length;total+=s.m;
    s.items.forEach(function(b,qi){var q=el('div','exam-q');var rec={b:b,per:per,val:null,sec:si};answers.push(rec);
      if(b.t==='match'){q.appendChild(el('div','en',''));var tb=el('div','pairs en');var L=el('div'),R=el('div');tb.appendChild(L);tb.appendChild(R);rec.val={};var ord=shuffle(b.pairs.map(function(p,i){return i}));
        b.pairs.forEach(function(p,i){var row=el('div','opt');row.style.display='flex';row.style.gap='8px';row.style.alignItems='center';var sel=el('select');sel.style.font='inherit';sel.innerHTML='<option value="">?</option>'+ord.map(function(j,k){return '<option value="'+j+'">'+String.fromCharCode(65+k)+'</option>'}).join('');sel.onchange=function(){rec.val[i]=sel.value};row.appendChild(el('span',null,fmt(p[0])));row.appendChild(sel);L.appendChild(row)});
        ord.forEach(function(j,k){R.appendChild(el('div','opt','<b>'+String.fromCharCode(65+k)+')</b> '+fmt(b.pairs[j][1])))});q.appendChild(tb);rec.n=b.pairs.length}
      else if(b.t==='write'||b.t==='order'){q.appendChild(el('div','en',(qi+1)+') '+(b.t==='order'?esc(shuffle(b.a.replace(/[.?!]$/,'').split(' ')).join(' / ')):fmt(b.q))));var inp=el('input','type');inp.style.fontSize='1em';inp.oninput=function(){rec.val=inp.value};q.appendChild(inp)}
      else{var opts=b.t==='tf'?['True','False']:b.o;q.appendChild(el('div','en',(b.pic?'<span style="font-size:'+(b.pic.length>4?'1em;color:var(--muted)':'1.8em')+'">'+esc(b.pic)+'</span> ':'')+(qi+1)+') '+fmt(b.q)));var g=el('div','opts');opts.forEach(function(o,oi){var bt=el('button','opt','<span class="en">'+fmt(o)+'</span>');bt.type='button';bt.onclick=function(){[].forEach.call(g.children,function(z){z.classList.remove('sel')});bt.classList.add('sel');rec.val=oi;sfx('tap')};g.appendChild(bt)});q.appendChild(g)}
      sec.appendChild(q)});c.appendChild(sec)});
  var r=el('div','row');var sb=el('button','btn big green','📤 سلّم الاختبار');sb.type='button';r.appendChild(sb);c.appendChild(r);
  timer=setInterval(function(){left--;var e=$('#etm');if(e){e.textContent='⏱️ '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');e.classList.toggle('low',left<=120)}if(left<=0){clearInterval(timer);submit()}},1000);
  sb.onclick=submit;
  function right(rec){var b=rec.b;if(b.t==='match'){var k=0;b.pairs.forEach(function(p,i){if(String(rec.val[i])===String(i))k++});return k/b.pairs.length}
    if(b.t==='write')return b.a.some(function(a){return norm(a)===norm(rec.val||'')})?1:0;if(b.t==='order')return norm(rec.val||'')===norm(b.a)?1:0;if(b.t==='tf')return rec.val===(b.a?0:1)?1:0;return rec.val===b.a?1:0}
  function submit(){clearInterval(timer);var score=0,wrongs=[];answers.forEach(function(rec){var f=right(rec);score+=f*rec.per;if(f<1)wrongs.push(rec)});score=Math.round(score*2)/2;
    if(u){U(u.id).exam={score:score,total:total,at:dayNum()};save()}addXP(Math.round(score*3));
    // every missed exam item becomes a daily-review item
    wrongs.forEach(function(rec){var id='x|'+(u?u.id:'f')+'|'+norm(JSON.stringify(rec.b.q||rec.b.a||'')).slice(0,60);var c=card(id);c.b=1;c.due=dayNum()+1;c.bad++;if(u){u.bank=u.bank||[];if(u.bank.indexOf(rec.b)<0&&rec.b.t!=='match'){u.bank.push(rec.b);}}});save();
    screen();var pct=score/total;var cc=el('div','card victory');cc.innerHTML='<div class="crown">'+(pct>=.9?'👑':pct>=.7?'🥇':'🛡️')+'</div><div class="big">'+score+' / '+total+'</div><p style="font-family:var(--ar);font-weight:800">'+esc(cheer(pct>=.8?'examGood':'mistakes')||'')+'</p>';
    if(wrongs.length){cc.appendChild(el('h3',null,'راجع هذه ('+wrongs.length+')'));wrongs.forEach(function(rec){var b=rec.b;var ans=b.t==='tf'?(b.a?'True':'False'):b.t==='match'?b.pairs.map(function(p){return plain(p[0])+' → '+plain(p[1])}).join(' | '):b.t==='write'?b.a[0]:b.t==='order'?b.a:b.o[b.a];cc.appendChild(el('div','exam-q','<div class="en">'+fmt(b.q||'')+'</div><div>✅ <span class="en k-g">'+fmt(ans)+'</span></div>'+(b.why?'<div class="muted">'+fmtA(b.why)+'</div>':'')))})}
    var rr=el('div','row');var bk=el('button','btn big','متابعة ←');bk.type='button';bk.onclick=function(){if(u)unit(u,'exam');else lobby()};rr.appendChild(bk);cc.appendChild(rr);main.appendChild(cc);sfx('win');if(pct>=.8)confetti()}
}

$('#b-home').onclick=lobby;$('#b-parent').onclick=parent;$('#b-sound').onclick=function(){S.sound=!S.sound;save();hud();if(!S.sound)stopVoice()};
