ع للحاضر أو المستقبل، مثل: يكتبُ."}, {"q": "الفعل الذي يُطلب به حدوث شيء في المستقبل هو:", "o": ["الماضي", "المضارع", "الأمر", "الجامد"], "a": 2, "why": "الأمر طلب، مثل: اكتبْ، احفظْ."}, {"q": "علامة الفعل الماضي:", "o": ["قبول السين وسوف", "قبول تاء التأنيث الساكنة وتاء الفاعل", "قبول ياء المخاطبة مع الطلب", "التنوين"], "a": 1, "why": "كتبَتْ هندُ، كتبْتُ الواجبَ."}, {"q": "علامة الفعل المضارع:", "o": ["قبول السين أو سوف", "قبول تاء الفاعل", "قبول ال التعريف", "قبول التنوين"], "a": 0, "why": "سيكتبُ، سوف يكتبُ. ويبدأ بأحد حروف (أنيت)."}, {"q": "يبدأ الفعل المضارع بأحد حروف:", "o": ["(أنيت)", "(سوف)", "(ال)", "(تاء مربوطة)"], "a": 0, "why": "أ، ن، ي، ت: أكتبُ، نكتبُ، يكتبُ، تكتبُ."}, {"q": "علامة فعل الأمر:", "o": ["دلالته على الطلب وقبوله ياء المخاطبة", "قبول السين", "قبول تاء الفاعل", "قبول التنوين"], "a": 0, "why": "اكتبْ ← اكتبي."}, {"q": "نوع الفعل (حفظتُ):", "o": ["ماضٍ", "مضارع", "أمر", "ليس فعلًا"], "a": 0, "why": "اتصلت به تاء الفاعل، فهو ماضٍ."}, {"q": "نوع الفعل (نعملُ):", "o": ["ماضٍ", "مضارع", "أمر", "ليس فعلًا"], "a": 1, "why": "بدأ بالنون من (أنيت) ويقبل السين: سنعملُ."}, {"q": "نوع الفعل (اغْفِرْ):", "o": ["ماضٍ", "مضارع", "أمر", "ليس فعلًا"], "a": 2, "why": "فيه طلب ويقبل ياء المخاطبة: اغفري."}]}, {"id": "jumla", "n": 3, "t": "الجملة نوعان", "color": 8280002, "pages": [4], "qs": [{"q": "التنوين", "o": ["علامة فعل (أزرق)", "علامة اسم (أحمر)"], "a": 1, "why": ""}, {"q": "تَاءُ التَّأْنِيثِ السَّاكِنَةُ", "o": ["علامة فعل (أزرق)", "علامة اسم (أحمر)"], "a": 0, "why": ""}, {"q": "حروف الجر", "o": ["علامة فعل (أزرق)", "علامة اسم (أحمر)"], "a": 1, "why": ""}, {"q": "السـين", "o": ["علامة فعل (أزرق)", "علامة اسم (أحمر)"], "a": 0, "why": ""}, {"q": "سوف", "o": ["علامة فعل (أزرق)", "علامة اسم (أحمر)"], "a": 0, "why": ""}, {"q": "(ال) التعريف", "o": ["علامة فعل (أزرق)", "علامة اسم (أحمر)"], "a": 1, "why": ""}, {"q": "رجع الحجاج إلى أوطانهم. كلمة ( الحجاج ) تعرب..................", "o": ["مبتدأ", "خبر", "فاعل", "مفعول به"], "a": 2, "why": "الحجاج هم الذين قاموا : 2, "why": "فرّامة أداة للفرم على وزن فعّالة."}, {"q": "(الحاسوب وسيلة رئيسة في التعليم عن بعد)، اسم الآلة في العبارة السابقة هو:", "o": ["الحاسوب.", "وسيلة.", "رئيسة.", "التعليم."], "a": 0, "why": "الحاسوب آلة يُحسب بها، على وزن فاعول."}, {"q": "(نستخدم المنجل لقطع الأعشاب)، وزن اسم الآلة في العبارة السابقة هو:", "o": ["مِفعال.", "فعَّالة.", "فَاعلة.", "مِفعل."], "a": 3, "why": "مِنجَل على وزن مِفعَل."}, {"q": "(الطالب المجتهد محبوب لدى المجتمع)، اسم المفعول في الجملة السابقة كلمة (المجتمع)", "o": ["صح", "خطأ"], "a": 1, "why": "اسم المفعول هو (محبوب) على وزن مفعول."}, {"q": "اسم المفعول من الفعل الثلاثي (رسم): مرسوم.", "o": ["صح", "خطأ"], "a": 0, "why": "اسم المفعول من الثلاثي على وزن مفعول: مرسوم."}, {"q": "كافل اليتيم موعود بالجنة. (حدد نوع الاسم المشتق). – كافل", "o": ["اسم فاعل", "خطأ؛ لأنها فعل أمر", "اسم مفعول", "جامد"], "a": 0, "why": "كافل على وزن فاعل."}, {"q": "كافل اليتيم موعود بالجنة. (حدد نوع الاسم المشتق). – موعود", "o": ["جامد", "اسم فاعل", "اسم مفعول", "خطأ؛ لأنها فعل أمر"], "a": 2, "why": "موعود على وزن مفعول."}, {"q": "قطع المزارع الأشجار بالفأس. ، يستعمل الطبيب المشرط في العمليات الجراحية. (ميز بين نوعي اسم الآلة من حيث الاشتقاق والجمود فيما تحته خط). – الفأس", "o": ["اسم مفعول", "خطأ؛ لأنها فعل أمر", "جامد", "اسم فاعل"], "a": 2, "why": "الفأس ليس مأخوذًا من فعل."}, {"q": "قطع المزارع الأشجار بالفأس. ، يستعمل الطبيب المشرط في العمليات الجراحية. (ميز بين نوعي اسم الآلة من حيث الاشتقاق والجمود فيما تحته خط). – المشرط", "o": ["مشتق", "اسم فاعل", "جامد", "اسم مفعول"], "a": 0, "why": "المشرط من الفعل شرط على وزن مِفعل."}, {"q": "باذل الخير محمود فعله. (زن ما تحته خط فيما سبق). – باذل", "o": ["جامد", "اسم فاعل", "فاعل", "اسم مفعول"], "a": 2, "why": "باذل اسم فاعل على وزن فاعل."}, {"q": "باذل الخير محمود فعله. (زن ما تحته خط فيما سبق). – محمود", "o": ["جامد", "اسم فاعل", "اسم مفعول", "مفعول"], "a": 3, "why": "محمود اسم مفعول على وزن مفعول."}, {"q": "عامل الناس كما تحب أن يعاملوك. (عامل) وردت في الجملة السابقة اسم فاعل. أصدر حكمًا على صحة العبارة التي ت function beep(freq, dur = .15, type = 'sine', vol = .15, when = 0) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();

}
const sfx = {
  jump: () => beep(520, .12, 'triangle', .12),
  ok: () => { beep(660, .14); beep(990, .2, 'sine', .15, .09); },
  bad: () => beep(260, .18, 'triangle'),
  win: () => [523, 659, 784, 1047].forEach((f, i) => beep(f, .18, 'square', .09, i * .1)),
};

// ---------- toast ----------
const toast = t => { const e = document.getElementById('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 2400); };

// ---------- three.js world ----------
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.insertBefore(renderer.domElement, document.getElementById('toast'));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd3ff);
scene.fog = new THREE.Fog(0x8fd3ff, 70, 170);
const cam = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, .1, 400);

scene.add(new THREE.HemisphereLight(0xffffff, 0x4a7a3a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(30, 50, 20); sun.castShadow = true; sun.shadow.mapSize.set(512, 512);
Object.assign(sun.shadow.camera, {left: -60, right: 60, top: 60, bottom: -60});
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshLambertMaterial({color: 0x5cb85c}));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

function block(x, y, z, w, h, d, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({color}));
  m.position.set(x, y + h / 2, z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}

// one flat zone per lesson, laid out in 3 rows of 6 (walkable at ground level)
const zones = LESSONS.map((L, i) => {
  const x = (i % 6 - 2.5) * 18, z = (Math.floor(i / 6) - 1) * 24 - 24;
  const base = block(x, 0, z, 10, .2, 10, 0x9e9e9e);
  const top = block(x, .2, z, 8, .1, 8, S.done[L.id] ? L.color : 0x6b7280);
  const label = document.createElement('div'); label.className = 'lab'; document.body.appendChild(label);
  return {L, x, z, top, label};
});

// Saleh: a block character (original design)
const hero = new THREE.Group();
const bodyMat = new THREE.MeshLambertMaterial({color: S.color});
const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.3, .7), bodyMat);
body.position.y = 1.35; body.castShadow = true; hero.add(body);
const head = new THREE.Mesh(new THREE.BoxGeometry(.9, .9, .9), new THREE.MeshLambertMaterial({color: 0x1f2328}));
head.position.y = 2.6; head.castShadow = true; hero.add(head);
const legL = new THREE.Mesh(new THREE.BoxGeometry(.45, .8, .5), new THREE.MeshLambertMaterial({color: 0x15181c}));
const legR = legL.clone();
legL.position.set(-.3, .4, 0); legR.position.set(.3, .4, 0);
hero.add(legL, legR);
scene.add(hero);

// ---------- controls ----------
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') jump(); });
addEventListener('keyup', e => { keys[e.code] = false; });
const press = {left: false, right: false, fwd: false, bwd: false};
[['left', 'left'], ['right', 'right'], ['fwd', 'fwd'], ['bwd', 'bwd']].forEach(([id, k]) => {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', () => press[k] = true);
  b.addEventListener('pointerup', () => press[k] = false);
  b.addEventListener('pointerleave', () => press[k] = false);
});
document.getElementById('jump').addEventListener('pointerdown', jump);
let vy = 0, onGround = true, busy = false;
function jump() { if (onGround && !busy) { vy = 9; onGround = false; sfx.jump(); } }

// ---------- store: stars buy looks, not help ----------
const STORE = [
  {id: 'crown', name: '👑 تاج ذهبي', price: 10},
  {id: 'flame', name: '🔥 جناح نار', price: 15},
  {id: 'rainbow', name: '🌈 أثر قوس قزح', price: 20},
  {id: 'star', name: '⭐ قبعة نجمة', price: 25},
];
let crownMesh = null, trail = [];
const TRAIL_MAX = 40, trailGeo = new THREE.BoxGeometry(.3, .3, .3), trailPool = [];
for (let i = 0; i < TRAIL_MAX; i++) {
  const m = new THREE.Mesh(trailGeo, new THREE.MeshBasicMaterial({color: 0xffffff}));
  m.visible = false; scene.add(m); trailPool.push(m);
}
function buildItems() {
  const box = document.getElementById('items'); box.innerHTML = '';
  STORE.forEach(it => {
    const row = document.createElement('div'); row.className = 'it';
    const own = S.owned[it.id];
    row.innerHTML = `<span>${it.name} · ${ar(it.price)} ⭐</span>`;
    const b = document.createElement('button');
    b.textContent = own ? 'مُلك' : 'شراء';
    b.disabled = !!own || S.stars < it.price;
    b.onclick = () => {
      if (S.stars < it.price) return;
      S.stars -= it.price; S.owned[it.id] = 1; save();
      applyLook(); refreshHud(); buildItems(); toast('✅ اشتريت ' + it.name); sfx.win();
    };
    row.appendChild(b); box.appendChild(row);
  });
}
function applyLook() {
  if (S.owned.crown && !crownMesh) {
    crownMesh = new THREE.Mesh(new THREE.BoxGeometry(.9, .35, .9), new THREE.MeshLambertMaterial({color: 0xf2b13b}));
    crownMesh.position.y = 3.2; hero.add(crownMesh);
  }
  if (S.owned.star && !hero.getObjectByName('starHat')) {
    const st = new THREE.Mesh(new THREE.ConeGeometry(.5, .6, 5), new THREE.MeshLambertMaterial({color: 0xffd166}));
    st.position.y = 3.3; st.name = 'starHat'; hero.add(st);
  }
  if (S.owned.flame && !hero.getObjectByName('flame')) {
    const f = new THREE.Mesh(new THREE.BoxGeometry(.3, .9, .15), new THREE.MeshLambertMaterial({color: 0xe0603a}));
    f.position.set(-.8, 1.5, -.3); f.name = 'flame'; hero.add(f);
  }
}
const shop = document.getElementById('shop');
document.getElementById('shopBtn').onclick = () => { buildItems(); shop.classList.add('on'); };
document.getElementById('shopClose').onclick = () => shop.classList.remove('on');

// ---------- progress HUD ----------
function refreshHud() {
  const n = Object.keys(S.done).length;
  document.getElementById('ach').textContent = ar(n) + ' / ' + ar(LESSONS.length);
  document.getElementById('xp').style.width = Math.round(n / LESSONS.length * 100) + '%';
  document.getElementById('lvl').textContent = 'الدروس المفتوحة ' + ar(n) + ' · ⭐ ' + ar(S.stars);
  document.getElementById('stars').textContent = ar(S.stars);
  zones.forEach(z => { z.top.material.color.setHex(S.done[z.L.id] ? z.L.color : 0x6b7280); });
}

// ---------- the quiz in a zone: 3 book questions, 2 right opens the zone ----------
const quiz = document.getElementById('quiz');
let qz = null, zoneIn = null;
function poolOf(L) {
  return L.qs.filter(q => q.o.length >= 2);
}
function openQuiz(z) {
  const pool = poolOf(z.L);
  if (!pool.length) { toast('لا توجد أسئلة في هذا الدرس بعد'); return; }
  busy = true;
  qz = {z, items: shuffle(pool).slice(0, 3), i: 0, ok: 0};
  document.getElementById('qTitle').textContent = ar(z.L.n) + '. ' + z.L.t;
  document.getElementById('qPages').textContent = '📖 من كتاب الطالب: ص ' + z.L.pages.map(ar).join('، ');
  quiz.classList.add('on');
  renderQ();
}
function renderQ() {
  const it = qz.items[qz.i];
  document.getElementById('qProg').textContent = 'السؤال ' + ar(qz.i + 1) + ' من ' + ar(qz.items.length);
  document.getElementById('qText').textContent = clean(it.q);
  document.getElementById('qWhy').innerHTML = '';
  const nextBtn = document.getElementById('qNext'); nextBtn.hidden = true;
  const box = document.getElementById('qOpts'); box.innerHTML = '';
  it.o.forEach((text, k) => {
    const b = document.createElement('button'); b.className = 'opt'; b.textContent = clean(text);
    b.onclick = () => answer(it, k, box);
    box.appendChild(b);
  });
}
function answer(it, k, box) {
  const ok = k === it.a;
  [...box.children].forEach((b, j) => { b.disabled = true; if (j === it.a) b.classList.add('good'); else if (j === k) b.classList.add('bad'); });
  if (ok) { qz.ok++; sfx.ok(); } else sfx.bad();
  if (it.why) document.getElementById('qWhy').innerHTML = '<div class="why">' + clean(it.why) + '</div>';
  const nextBtn = document.getElementById('qNext'); nextBtn.hidden = false;
  const last = qz.i === qz.items.length - 1;
  nextBtn.textContent = last ? 'النتيجة' : 'التالي';
  nextBtn.onclick = last ? finishQuiz : () => { qz.i++; renderQ(); };
}
function finishQuiz() {
  const need = Math.min(2, qz.items.length);
  if (qz.ok >= need) {
    unlock(qz.z);
    closeQuiz();
  } else {
    document.getElementById('qText').textContent = 'وصلت ' + ar(qz.ok) + ' من ' + ar(qz.items.length) + '. حاول مرة ثانية، والتوفيق من الله!';
    document.getElementById('qOpts').innerHTML = '';
    document.getElementById('qWhy').innerHTML = '';
    const nextBtn = document.getElementById('qNext'); nextBtn.hidden = false; nextBtn.textContent = 'حاول مرة ثانية';
    nextBtn.onclick = () => openQuiz(qz.z);
  }
}
function closeQuiz() { quiz.classList.remove('on'); busy = false; qz = null; document.getElementById('qNext').onclick = null; }
document.getElementById('qLeave').onclick = closeQuiz;

function unlock(z) {
  if (S.done[z.L.id]) return;
  S.done[z.L.id] = 1; S.stars += 5; save();
  refreshHud(); sfx.win();
  toast('🏆 فتحت: ' + ar(z.L.n) + '. ' + z.L.t + ' · +٥ ⭐');
}

// ---------- game loop ----------
const clock = new THREE.Clock();
let t = 0;
function update(dt) {
  t += dt;
  const left = !busy && (keys.ArrowLeft || keys.KeyA || press.left);
  const right = !busy && (keys.ArrowRight || keys.KeyD || press.right);
  const fwd = !busy && (keys.ArrowUp || keys.KeyW || press.fwd);
  const back = !busy && (keys.ArrowDown || keys.KeyS || press.bwd);
  const dx = (right ? 1 : 0) - (left ? 1 : 0);
  const dz = (back ? 1 : 0) - (fwd ? 1 : 0);
  const len = Math.hypot(dx, dz) || 1;
  const TOP = 8, moving = dx || dz;
  const tvx = (dx / len) * TOP * (moving ? 1 : 0), tvz = (dz / len) * TOP * (moving ? 1 : 0);
  const k = 1 - Math.exp(-12 * dt);
  hero.userData.vx = (hero.userData.vx || 0) + (tvx - (hero.userData.vx || 0)) * k;
  hero.userData.vz = (hero.userData.vz || 0) + (tvz - (hero.userData.vz || 0)) * k;
  hero.position.x += hero.userData.vx * dt;
  hero.position.z += hero.userData.vz * dt;
  hero.position.x = Math.max(-75, Math.min(75, hero.position.x));
  hero.position.z = Math.max(-75, Math.min(75, hero.position.z));
  const sp = Math.hypot(hero.userData.vx, hero.userData.vz);
  if (sp > .3) {
    const want = Math.atan2(hero.userData.vx, hero.userData.vz);
    const diff = ((want - hero.rotation.y + Math.PI) % (Math.PI * 2)) - Math.PI;
    hero.rotation.y += diff * (1 - Math.exp(-14 * dt));
  }
  const walking = sp > .3;
  const swing = walking ? Math.sin(t * 12) * Math.min(.7, sp / 8) : 0;
  legL.rotation.x = swing; legR.rotation.x = -swing;

  vy -= 22 * dt; hero.position.y += vy * dt;
  if (hero.position.y <= 0) { hero.position.y = 0; vy = 0; onGround = true; }

  // walking into a zone opens its quiz once; leaving the zone lets it open again
  const inside = zones.find(z => Math.abs(hero.position.x - z.x) < 5 && Math.abs(hero.position.z - z.z) < 5) || null;
  if (inside !== zoneIn && !busy) {
    zoneIn = inside;
    if (zoneIn && !S.done[zoneIn.L.id]) openQuiz(zoneIn);
  }

  if (S.owned.rainbow && walking && Math.random() < .5) {
    const c = trailPool.find(m => !m.visible);
    if (c) {
      c.material.color.setHSL((t * .2) % 1, 1, .6); c.scale.set(1, 1, 1);
      c.position.copy(hero.position); c.position.y += .4; c.visible = true; trail.push({m: c, life: .8});
    }
  }
  trail = trail.filter(p => { p.life -= dt; p.m.scale.multiplyScalar(.97); if (p.life <= 0) { p.m.visible = false; return false; } return true; });

  const want = new THREE.Vector3(hero.position.x - 12, hero.position.y + 8, hero.position.z + 12);
  cam.position.lerp(want, 1 - Math.exp(-6 * dt));
  cam.lookAt(hero.position.x, hero.position.y + 2, hero.position.z);
}

// number labels float above each zone, hidden when off screen
const tmp = new THREE.Vector3();
function placeLabels() {
  zones.forEach(z => {
    tmp.set(z.x, 3, z.z).project(cam);
    const on = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
    z.label.style.display = on ? '' : 'none';
    if (!on) return;
    const sx = (tmp.x + 1) / 2 * innerWidth, sy = (1 - tmp.y) / 2 * innerHeight;
    z.label.style.transform = `translate(${sx - z.label.offsetWidth / 2}px,${sy}px)`;
    z.label.textContent = (S.done[z.L.id] ? '✅ ' : '') + ar(z.L.n);
  });
}

function resize() { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize);

applyLook();
refreshHud();
resize();
hero.position.set(0, 0, 0);
cam.position.set(-12, 8, 12);

function loop() {
  const dt = Math.min(.05, clock.getDelta());
  update(dt);
  renderer.render(scene, cam);
  placeLabels();
  requestAnimationFrame(loop);
}
window.__lg = {hero, zones, S};
loop();
</script>
