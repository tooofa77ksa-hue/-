<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e2038">
<title>مشاريع صالح الشمراني</title>
<style>
  :root{color-scheme:dark;--night:#0e2038;--panel:#183659;--line:#2f5788;--ink:#f7f2e6;--muted:#b8c7dc;--gold:#f3c552}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--night);color:var(--ink);font-family:"Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;line-height:1.7;
    background-image:radial-gradient(circle at 12% 8%,#1d4170 0,transparent 42%)}
  main{max-width:760px;margin:0 auto;padding:40px 16px}
  h1{margin:0;font-size:clamp(28px,6vw,44px)}
  .sub{color:var(--muted);margin:4px 0 28px}
  a.card{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:18px}
  a.card:hover,a.card:focus-visible{border-color:var(--gold)}
  .ic{font-size:2.4em;display:inline-block;animation:bob 3s ease-in-out infinite}
  .t{font-weight:800;font-size:1.25em}.d{color:var(--muted)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @media (prefers-reduced-motion:reduce){.ic{animation-duration:6s}}
</style>
</head>
<body>
<main>
  <h1>مشاريع صالح الشمراني</h1>
  <p class="sub">الصف السادس</p>
  <a class="card" href="lughati/" style="margin-bottom:14px"><span class="ic">🏰</span><span><span class="t">معركة الضاد · لغتي</span><br><span class="d">🔒 بالرابط الخاص</span></span></a>
  <a class="card" href="english/" style="margin-bottom:14px"><span class="ic">🪂</span><span><span class="t">English Battle · الإنجليزي</span><br><span class="d">🔒 بالرابط الخاص</span></span></a>
  <a class="card" href="deen/"><span class="ic">🌙</span><span><span class="t">رحلة الدراسات الإسلامية</span><br><span class="d">الحديث · التوحيد · الفقه</span></span></a>
</main>
</body>
</html>
