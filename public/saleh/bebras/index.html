<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f78">
<title>نهر القندس · ألغاز التفكير</title>
<meta name="description" content="ألغاز تفاعلية للتدرّب على أنواع أسئلة مسابقة بيبراس للتفكير الحاسوبي">
<style>
@font-face{font-family:"Baloo Bhaijaan 2";src:url("../../fonts/nahrawan-baloo-regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Baloo Bhaijaan 2";src:url("../../fonts/nahrawan-baloo-semibold.ttf") format("truetype");font-weight:600;font-display:swap}
@font-face{font-family:"Baloo Bhaijaan 2";src:url("../../fonts/nahrawan-baloo-extrabold.ttf") format("truetype");font-weight:800;font-display:swap}
:root{
  --water:#1f6f78; --deep:#134a52; --foam:#dff3f1; --sky:#eef9fb;
  --bark:#7a4b22; --wood:#c58b4c; --leaf:#4f9a5c; --sun:#f4c04e;
  --ink:#1d2b30; --muted:#56717a; --bad:#c2453b; --good:#2f8a4a;
  --r-big:28px; --r-mid:18px; --r-small:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;background:var(--sky);color:var(--ink);font-family:"Baloo Bhaijaan 2","Geeza Pro",Tahoma,sans-serif;font-size:18px;line-height:1.6;
  background-image:radial-gradient(120% 60% at 50% 110%,#cdebe6 0,transparent 60%)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.screen{display:none;max-width:860px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 120px}
.screen.on{display:block}
h1,h2,h3{line-height:1.25;margin:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.back{background:#fff;border:2px solid #cfe3e6;border-radius:999px;padding:6px 16px;font-weight:600}
.pill{background:#fff;border-radius:999px;padding:4px 14px;font-weight:600;border:2px solid #cfe3e6;white-space:nowrap}
.muted{color:var(--muted)}

/* ---------- Home ---------- */
.hero{position:relative;text-align:center;padding:26px 0 8px}
.hero h1{font-size:clamp(38px,9vw,64px);font-weight:800;color:var(--deep);letter-spacing:0}
.hero p{margin:4px 0 0;color:var(--muted);font-size:1.05em}
.dam{display:block;margin:10px auto 0;width:min(420px,90%)}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:22px}
.player{background:#fff;border:3px solid #cfe3e6;border-radius:var(--r-mid);padding:14px 10px;text-align:center}
.player .av{font-size:44px;display:block;line-height:1.1}
.player b{display:block;font-size:1.2em}
.player small{color:var(--muted)}
.player.add{border-style:dashed;background:transparent}
.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:.85em}
.foot button{background:none;border:none;color:var(--water);text-decoration:underline;font-weight:600}

/* ---------- Map ---------- */
.mapwrap{position:relative;margin-top:6px}
.river{width:100%;height:auto;display:block}
.station{position:absolute;transform:translate(50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;padding:0}
.station .lodge{width:78px;height:78px;border-radius:50%;background:#fff;border:5px solid var(--wood);display:grid;place-items:center;font-size:38px;box-shadow:0 5px 0 var(--bark)}
.station span{background:#fff;border-radius:10px;padding:0 10px;font-weight:800;font-size:.9em;white-space:nowrap}
.station .stars{font-size:.75em;letter-spacing:1px;background:none;padding:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.big{border:none;border-radius:var(--r-mid);padding:16px 14px;font-weight:800;font-size:1.1em;text-align:right;display:flex;align-items:center;gap:12px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.big .e{font-size:1.8em}
.big small{display:block;font-weight:600;font-size:.75em;opacity:.85}
.big.daily{background:var(--sun);color:#3c2a00}
.big.chal{background:var(--water);color:#fff}
.big.dash{background:#fff;color:var(--ink);grid-column:1/-1;border:2px solid #cfe3e6;box-shadow:none}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}

/* ---------- World ---------- */
.wtitle{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.wtitle .e{font-size:54px}
.wtitle h2{font-size:1.7em;color:var(--deep)}
.learn{background:#fff;border-radius:var(--r-mid);padding:14px 18px;border-inline-start:8px solid var(--leaf);margin:12px 0}
.learn b{color:var(--leaf)}
.typelist{display:grid;gap:12px}
.tcard{background:#fff;border:3px solid #cfe3e6;border-radius:var(--r-mid);padding:14px 16px;text-align:right;display:flex;align-items:center;gap:14px}
.tcard .e{font-size:36px}
.tcard b{font-size:1.15em}
.lv{display:inline-flex;gap:4px;margin-top:2px}
.lv i{width:22px;height:8px;border-radius:4px;background:#dce9eb;display:block}
.lv i.on{background:var(--leaf)}

/* ---------- Puzzle ---------- */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.level{font-weight:800;border-radius:999px;padding:2px 14px;color:#fff}
.level.l1{background:var(--leaf)}.level.l2{background:#d98a2b}.level.l3{background:var(--bad)}
.story{background:#fff;border-radius:var(--r-big);padding:16px 20px;margin:12px 0;position:relative}
.story .who{float:left;font-size:46px;line-height:1;margin:-4px 8px 0 0}
.story p{margin:0 0 6px}
.story .ask{font-weight:800;color:var(--deep);margin-top:8px}
.board{background:var(--foam);border-radius:var(--r-big);padding:16px;min-height:120px;display:flex;flex-direction:column;align-items:center;gap:14px}
.ltr{direction:ltr}
.checkbar{position:fixed;inset:auto 0 0 0;background:rgba(238,249,251,.96);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-top:2px solid #cfe3e6;padding:10px 16px max(10px,env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:5}
.checkbar[hidden]{display:none}
.btn{border:none;border-radius:var(--r-mid);padding:12px 26px;font-weight:800;font-size:1.1em;background:var(--water);color:#fff;box-shadow:0 4px 0 var(--deep)}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 4px 0 #b9d2d6}
.btn:disabled{opacity:.45}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.fb{border-radius:var(--r-mid);padding:14px 18px;margin-top:14px;font-weight:600}
.fb.ok{background:#e1f4e5;border:3px solid var(--good)}
.fb.no{background:#fbe7e4;border:3px solid var(--bad)}
.fb h3{font-size:1.25em;margin-bottom:4px}

/* grid boards */
.grid{display:grid;gap:4px;direction:ltr;touch-action:manipulation}
.cell{width:var(--c,52px);height:var(--c,52px);border-radius:10px;background:#fff;display:grid;place-items:center;font-size:calc(var(--c,52px)*.62);border:none;padding:0}
.cell.rock{background:#9aa7a3}
.cell.on{background:var(--water)}
.cell.path{background:#ffe9a8}
.cell.pick{outline:4px solid var(--sun)}
.cell.target{background:#ffe2a0}
.minigrid{--c:30px}.minigrid .cell{border-radius:6px}
.minigrid .cell.on{background:var(--bark)}
.cmds{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;direction:ltr}
.cmd{min-width:58px;height:58px;border-radius:14px;border:none;background:#fff;font-size:30px;font-weight:800;box-shadow:0 4px 0 #b9d2d6}
.prog{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:48px;direction:rtl;background:#fff;border-radius:14px;padding:8px;width:100%}
.prog span{width:40px;height:40px;border-radius:10px;background:var(--foam);display:grid;place-items:center;font-size:24px;font-weight:800}
.prog span.run{background:var(--sun)}
.code{background:#fff;border-radius:14px;padding:10px 16px;font-size:1.15em;line-height:2;direction:rtl}
.code .loop{border-inline-start:6px solid var(--sun);padding-inline-start:12px;margin:4px 0}
.code .ar{direction:rtl;display:inline-block;font-size:1.2em;letter-spacing:4px;unicode-bidi:isolate}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opt{background:#fff;border:3px solid #cfe3e6;border-radius:var(--r-mid);padding:12px;font-size:1.2em;font-weight:800;min-height:64px}
.opt.sel{border-color:var(--water);background:#d7eef0}
.opt.right{border-color:var(--good);background:#e1f4e5}
.opt.wrong{border-color:var(--bad);background:#fbe7e4}

svg.g{width:100%;max-width:520px;height:auto;touch-action:manipulation}
svg.g .node{cursor:pointer}
.total{font-weight:800;font-size:1.2em}

.lamps{display:flex;gap:10px;justify-content:center;direction:ltr;flex-wrap:wrap}
.lamp{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none}
.lamp .bulb{width:60px;height:60px;border-radius:50%;background:#55666a;border:4px solid #3c494c;transition:background .15s}
.lamp.on .bulb{background:var(--sun);border-color:#d19a1c;box-shadow:0 0 22px #f7d77a}
.lamp b{background:#fff;border-radius:8px;padding:0 10px}
.keytab{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.keytab span{background:#fff;border-radius:10px;padding:2px 10px;font-size:1.15em}
.msg{font-size:2em;letter-spacing:6px;background:#fff;border-radius:14px;padding:4px 16px;direction:rtl}
.alpha{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;font-size:1.05em}
.alpha span{background:#fff;border-radius:6px;padding:0 7px}

.stack{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:230px;justify-content:flex-end}
.cake{height:30px;border-radius:15px;background:linear-gradient(#e7b56b,#c98a3c);border:3px solid #9a6420;display:grid;place-items:center;font-weight:800;color:#5a3608;padding:0}
.cake.hint{outline:3px dashed var(--water);outline-offset:2px}
.plate{width:240px;height:14px;border-radius:8px;background:#9fb6ba}
.seq{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;direction:rtl}
.seq span{background:#fff;border-radius:12px;min-width:52px;min-height:52px;padding:4px 8px;display:grid;place-items:center;font-size:1.5em}
.seq span.q{background:var(--sun);font-weight:800}
.houses{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.house{width:84px;min-height:110px;background:#fff;border:3px solid var(--wood);border-radius:16px 16px 10px 10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px;font-weight:800}
.house .who{font-size:34px;min-height:40px}
.house.sel{border-color:var(--water);background:#d7eef0}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{background:#fff;border:3px solid #cfe3e6;border-radius:999px;padding:4px 14px;font-weight:800;font-size:1.05em}
.chip.sel{border-color:var(--water);background:#d7eef0}
.chip.used{opacity:.35}
.clues{background:#fff;border-radius:14px;padding:8px 18px;margin:0;width:100%}
.clues li{margin:2px 0}
.scales{display:grid;gap:8px;width:100%}
.scale{background:#fff;border-radius:14px;padding:6px 12px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:1.6em}
.scale small{font-size:.55em;color:var(--muted)}
.truck{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.box{width:44px;height:44px;border-radius:8px;background:var(--wood);color:#fff;font-weight:800;display:grid;place-items:center;font-size:1.2em;border:3px solid var(--bark)}

/* ---------- Challenge ---------- */
.qnav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.qnav button{width:40px;height:40px;border-radius:10px;border:2px solid #cfe3e6;background:#fff;font-weight:800}
.qnav button.done{background:#d7eef0;border-color:var(--water)}
.qnav button.cur{outline:3px solid var(--sun)}
.timer{font-weight:800;font-size:1.1em}
.score{font-size:clamp(56px,16vw,96px);font-weight:800;color:var(--deep);text-align:center;line-height:1}
.rev{background:#fff;border-radius:var(--r-mid);padding:10px 14px;margin:8px 0;display:flex;gap:10px;align-items:flex-start}
.rev .m{font-size:1.4em}

/* ---------- Dashboard ---------- */
.dcard{background:#fff;border-radius:var(--r-mid);padding:14px 18px;margin:12px 0}
.bar{height:14px;border-radius:7px;background:#e3eef0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf)}
.drow{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;margin:6px 0}
table.hist{width:100%;border-collapse:collapse}
table.hist td,table.hist th{padding:4px 6px;border-bottom:1px solid #e3eef0;text-align:right}

dialog{border:none;border-radius:var(--r-big);padding:20px;max-width:420px;width:92%}
dialog::backdrop{background:rgba(19,74,82,.45)}
dialog input{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:2px solid #cfe3e6;margin:6px 0 12px}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;border:3px solid #cfe3e6;border-radius:14px;background:#fff;padding:8px;font-weight:800}
.seg button.sel{border-color:var(--water);background:#d7eef0}
.avs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.avs button{font-size:30px;border:3px solid transparent;background:#f2f7f8;border-radius:12px;width:52px;height:52px;padding:0}
.avs button.sel{border-color:var(--water)}

@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.pop{animation:pop .35s ease-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){.pop,.shake{animation:none}*{transition:none!important}}
@media (max-width:520px){
  body{font-size:17px}
  .station .lodge{width:62px;height:62px;font-size:30px}
  .actions{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .drow{grid-template-columns:96px 1fr 52px}
}
</style>
</head>
<body>

<!-- HOME -->
<section class="screen on" id="s-home" aria-labelledby="h-home">
  <div class="hero">
    <svg class="dam" viewBox="0 0 420 120" aria-hidden="true">
      <path d="M0 92 C60 70 120 110 210 88 S350 70 420 92 V120 H0Z" fill="#1f6f78"/>
      <path d="M0 100 C70 84 140 116 210 98 S350 84 420 100" stroke="#dff3f1" stroke-width="3" fill="none" opacity=".6"/>
      <g fill="#7a4b22"><rect x="150" y="56" width="120" height="14" rx="7"/><rect x="140" y="68" width="140" height="14" rx="7" fill="#c58b4c"/><rect x="132" y="80" width="156" height="14" rx="7"/></g>
      <text x="210" y="48" font-size="52" text-anchor="middle">🦫</text>
    </svg>
    <h1 id="h-home">نهر القندس</h1>
    <p>ألغاز تفكير بنفس أنواع أسئلة بيبراس</p>
  </div>
  <h2 style="font-size:1.2em;margin-top:18px">مين بيلعب؟</h2>
  <div class="players" id="players"></div>
  <p class="foot">أنواع الألغاز مستوحاة من أرشيف مسابقة بيبراس الدولية (France-ioi، رخصة CC BY-SA)، والألغاز نفسها من تأليفنا.<br>
  صفحة تدريب غير رسمية، ليست تابعة لموهبة.<br>
  <button id="toParent">لوحة ولي الأمر</button></p>
</section>

<!-- MAP -->
<section class="screen" id="s-map" aria-labelledby="h-map">
  <div class="topbar">
    <button class="back" data-go="home">⇦ تغيير اللاعب</button>
    <span class="pill" id="mapWho"></span>
  </div>
  <h2 id="h-map" style="font-size:1.5em;color:var(--deep)">خريطة النهر</h2>
  <div class="mapwrap" id="mapwrap">
    <svg class="river" viewBox="0 0 600 520" aria-hidden="true">
      <path d="M520 0 C560 90 420 110 360 150 S120 190 110 270 S330 330 440 380 S470 470 300 520" stroke="#1f6f78" stroke-width="54" fill="none" stroke-linecap="round"/>
      <path d="M520 0 C560 90 420 110 360 150 S120 190 110 270 S330 330 440 380 S470 470 300 520" stroke="#dff3f1" stroke-width="4" fill="none" stroke-dasharray="14 18" opacity=".7"/>
      <g font-size="26"><text x="40" y="60">🌲</text><text x="560" y="250">🌲</text><text x="40" y="430">🌳</text><text x="250" y="300">🌿</text><text x="520" y="500">🌲</text><text x="200" y="90">🌿</text></g>
    </svg>
  </div>
  <div class="actions">
    <button class="big daily" id="goDaily"><span class="e">☀️</span><span>مهمة اليوم<small id="dailyInfo">٥ ألغاز مختارة لك</small></span></button>
    <button class="big chal" id="goChal"><span class="e">🏆</span><span>تحدي بيبراس<small>١٢ سؤالاً في ٣٠ دقيقة، مثل المسابقة</small></span></button>
    <button class="big dash" id="goStats"><span class="e">📈</span><span>تقدّمي<small></small></span></button>
  </div>
</section>

<!-- WORLD -->
<section class="screen" id="s-world">
  <div class="topbar"><button class="back" data-go="map">⇦ الخريطة</button><span class="pill" id="worldWho"></span></div>
  <div class="wtitle"><span class="e" id="wEmoji"></span><h2 id="wName"></h2></div>
  <div class="learn" id="wLearn"></div>
  <div class="typelist" id="wTypes"></div>
</section>

<!-- PLAY -->
<section class="screen" id="s-play">
  <div class="topbar"><button class="back" id="playBack">⇦ رجوع</button><span class="pill" id="playProg"></span></div>
  <div class="qhead"><h2 id="pTitle" style="font-size:1.3em"></h2><span class="level" id="pLevel"></span></div>
  <div class="story" id="pStory"></div>
  <div class="board" id="pBoard"></div>
  <div id="pFb"></div>
</section>

<!-- CHALLENGE -->
<section class="screen" id="s-chal">
  <div class="topbar"><button class="back" id="chalQuit">⇦ إنهاء</button><span class="pill timer" id="chalTimer">30:00</span></div>
  <div class="qnav" id="chalNav"></div>
  <div class="qhead"><h2 id="cTitle" style="font-size:1.3em"></h2><span class="level" id="cLevel"></span></div>
  <div class="story" id="cStory"></div>
  <div class="board" id="cBoard"></div>
  <p class="muted" id="cNote" style="text-align:center"></p>
</section>

<!-- RESULT -->
<section class="screen" id="s-result">
  <div class="topbar"><button class="back" data-go="map">⇦ الخريطة</button></div>
  <div id="resBody"></div>
</section>

<!-- STATS -->
<section class="screen" id="s-stats">
  <div class="topbar"><button class="back" id="statsBack">⇦ رجوع</button></div>
  <div id="statsBody"></div>
</section>

<div class="checkbar" id="checkbar" hidden>
  <button class="btn alt" id="btnSkip">لغز ثاني</button>
  <button class="btn" id="btnCheck" disabled>تحقّق</button>
</div>

<dialog id="dlgAdd">
  <form method="dialog" id="addForm">
    <h3 style="margin-bottom:10px">لاعب جديد</h3>
    <label>الاسم<input id="addName" maxlength="16" required autocomplete="off"></label>
    <div class="seg" id="addG"><button type="button" data-g="m" class="sel">ولد</button><button type="button" data-g="f">بنت</button></div>
    <div class="avs" id="addAv"></div>
    <div style="display:flex;gap:10px"><button class="btn" value="ok" style="flex:1">أضف</button><button class="btn alt" value="cancel" formnovalidate>إلغاء</button></div>
  </form>
</dialog>

<script>
(()=>{"use strict";
/* ================= utilities ================= */
const $=s=>document.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const k in attrs){const v=attrs[k];if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e};
const SVGNS="http://www.w3.org/2000/svg";
const sv=(tag,attrs={})=>{const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e};
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];

const AR="٠١٢٣٤٥٦٧٨٩";const n2a=n=>String(n).replace(/\d/g,d=>AR[d]);

/* ================= shared graph helpers ================= */
function segCross(a,b,c,d){const o=(p,q,r)=>Math.sign((q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x));if(a===c||a===d||b===c||b===d)return false;return o(a,b,c)!==o(a,b,d)&&o(c,d,a)!==o(c,d,b)}
function makeGraph(n,extra){
  // place nodes on a jittered lattice, MST + non-crossing extra edges
  const cols=n<=6?3:4, rows=Math.ceil(n/cols)+1;
  const slots=shuffle([...Array(cols*rows).keys()]).slice(0,n);
  const pts=slots.map(s=>({x:70+(s%cols)*(380/(cols-1))+ri(-22,22),y:60+Math.floor(s/cols)*(300/(rows-1))+ri(-18,18)}));
  const d=(i,j)=>Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);
  const edges=[];const inT=new Set([0]);
  while(inT.size<n){let best=null;for(const i of inT)for(let j=0;j<n;j++)if(!inT.has(j)){const v=d(i,j);if(!best||v<best[2])best=[i,j,v]}edges.push([best[0],best[1]]);inT.add(best[1])}
  const cand=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(!edges.some(e=>(e[0]===i&&e[1]===j)||(e[0]===j&&e[1]===i)))cand.push([i,j,d(i,j)]);
  cand.sort((a,b)=>a[2]-b[2]);let added=0;
  for(const [i,j] of cand){if(added>=extra)break;if(d(i,j)>230)continue;if(edges.some(e=>segCross(pts[i],pts[j],pts[e[0]],pts[e[1]])))continue;edges.push([i,j]);added++}
  const adj=[...Array(n)].map(()=>[]);edges.forEach(([a,b],k)=>{adj[a].push([b,k]);adj[b].push([a,k])});
  return {n,pts,edges,adj};
}
function bfs(G,s){const dist=Array(G.n).fill(-1);dist[s]=0;const q=[s];while(q.length){const u=q.shift();for(const[v]of G.adj[u])if(dist[v]<0){dist[v]=dist[u]+1;q.push(v)}}return dist}
function drawGraph(G,{labels,weights,onNode,fill}={}){
  const svg=sv("svg",{class:"g",viewBox:"0 0 520 400",role:"img"});
  G.edges.forEach(([a,b],k)=>{const A=G.pts[a],B=G.pts[b];const ln=sv("line",{x1:A.x,y1:A.y,x2:B.x,y2:B.y,stroke:"#7a4b22","stroke-width":6,"stroke-linecap":"round","data-e":k});svg.append(ln);
    if(weights){const mx=(A.x+B.x)/2,my=(A.y+B.y)/2;svg.append(sv("circle",{cx:mx,cy:my,r:15,fill:"#fff",stroke:"#7a4b22","stroke-width":2}));const t=sv("text",{x:mx,y:my+7,"text-anchor":"middle","font-size":20,"font-weight":800,fill:"#1d2b30"});t.textContent=n2a(weights[k]);svg.append(t)}});
  G.pts.forEach((p,i)=>{const g=sv("g",{class:"node","data-n":i,tabindex:onNode?0:-1});g.append(sv("circle",{cx:p.x,cy:p.y,r:27,fill:fill?fill(i):"#fff",stroke:"#1f6f78","stroke-width":4}));const t=sv("text",{x:p.x,y:p.y+9,"text-anchor":"middle","font-size":24});t.textContent=labels?labels[i]:"";g.append(t);
    if(onNode){g.addEventListener("click",()=>onNode(i));g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onNode(i)}})}svg.append(g)});
  return svg;
}
function mcq(board,options,api,render=o=>o){
  const box=el("div",{class:"opts"});let chosen=null;
  options.forEach((o,i)=>{const b=el("button",{class:"opt",type:"button"});const r=render(o);b.append(r.nodeType?r:document.createTextNode(r));b.addEventListener("click",()=>{sndTap();chosen=i;[...box.children].forEach((c,k)=>c.classList.toggle("sel",k===i));api.ready(true)});box.append(b)});

gen(L){

    const rocks=new Set();const s=[0,ri(0,N-1)],g=[N-1,ri(0,N-1)];
    while(rocks.size<R){const c=[ri(0,N-1),ri(0,N-1)];const k=c+"";if(k!==s+""&&k!==g+"")rocks.add(k)}
    const dist={};dist[s]=0;const q=[s];while(q.length){const u=q.shift();for(const d of "UDLR"){const v=[u[0]+DIRS[d][0],u[1]+DIRS[d][1]];if(v[0]<0||v[1]<0||v[0]>=N||v[1]>=N||rocks.has(v+"")||(v+"" in dist))continue;dist[v]=dist[u]+1;q.push(v)}}
    const best=dist[g];if(best===undefined||best<N-1+(L>1?2:0))continue;
    const limit=best+(L===1?2:0);

  }
},

TYPES.path={world:"graph",emoji:"🛶",name:"أقصر طريق",
gen(L){const n=[6,7,9][L-1];for(;;){const G=makeGraph(n,[2,4,6][L-1]);const w=G.edges.map(()=>ri(1,9));
  let s=0,t=0,far=-1;for(let i=0;i<n;i++){const d=bfs(G,i);d.forEach((v,j)=>{if(v>far){far=v;s=i;t=j}})}if(far<2)continue;

story(q){return {who:"🛶",p:["القندس يبي يروح من بيته 🏠 إلى الشجرة 🌳 عبر القنوات.","الرقم على كل قناة هو عدد الدقائق."],ask:"اضغط على المحطات بالترتيب لتكوين أسرع طريق."}},
