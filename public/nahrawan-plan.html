<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>خطة تحسين النهروان</title>
<meta name="description" content="لوحة متابعة خطة التحسين المدرسية - مدرسة النهروان الثانوية 1448هـ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{color-scheme:light;box-sizing:border-box}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}
/* ============ Design tokens (Ministry of Education identity guide v3) ============ */
:root{
  --navy:#15445A; --teal:#0DA9A6; --blue:#3D7EB9; --green:#07A869; --gold:#C1B489; --gray:#C2C1C1;
  --bg:#f4f6f6; --surface:#ffffff; --surface-2:#eef3f2;
  --ink:#15445A; --ink-2:#3d5a68; --muted:#5b6b73; --border:#d9e3de;
  --accent:var(--blue); --accent-ink:#ffffff;
  --blue-bg:#eaf2fa; --blue-ink:#2a5f8f; --teal-bg:#e4f6f5; --green-bg:#e6f3ec; --gold-bg:#f6f1e4;
  --ok-bg:#e7f5ee; --ok-ink:#0a6b46; --warn-bg:#f7f3e9; --warn-ink:#8a6d1f; --idle-bg:#f0f1f1; --idle-ink:#5b6b73;
  --shadow:0 10px 30px rgba(21,68,90,.10); --shadow-lg:0 20px 50px rgba(21,68,90,.16);
  --radius:14px; --radius-sm:9px;
}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,'Segoe UI',Cairo,system-ui,sans-serif;line-height:1.55}
.tabular{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
::selection{background:var(--teal);color:#fff}

/* ============ Shell layout ============ */
.shell{display:flex;min-height:100vh}
.sidebar{
  width:250px;flex:none;background:linear-gradient(180deg,var(--navy),#0e2f3f);color:#fff;
  display:flex;flex-direction:column;padding:24px 18px;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
@media (max-width:860px){
  .shell{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;padding:14px 16px;gap:10px}
  .brand{display:flex;align-items:center;justify-content:space-between}
  .brand .rule{display:none}
  .nav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;margin-top:0;gap:6px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .nav button{flex:none;padding:8px 12px;font-size:13px;border-inline-start:none;border-bottom:3px solid transparent;white-space:nowrap}
  .nav button.active{border-inline-start-color:transparent;border-bottom-color:var(--gold)}
  .sidebar-footer{padding-top:8px;margin-top:0}
  .sidebar-org{font-size:10px}
  .sidebar-org img{height:20px}
  .orgbar,.topbar{padding:12px 16px}
  .orgbar-brand span{display:none}
  .content{padding:16px 16px 40px}
  .kpi-hero{flex:1 1 100%}
}
@media (max-width:480px){
  .actions{width:100%}
  .actions .btn{flex:1;justify-content:center}
}
.brand .school{font-weight:800;font-size:16px;line-height:1.35}
.brand .rule{width:34px;height:3px;background:var(--gold);border-radius:2px;margin-top:8px}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.nav button{
  display:flex;align-items:center;gap:10px;background:transparent;border:none;border-inline-start:3px solid transparent;color:#cfe1e6;
  padding:11px 12px;border-radius:8px;font-size:14.5px;font-weight:600;text-align:right;transition:.15s;
}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.active{background:rgba(255,255,255,.08);color:#fff;border-inline-start-color:var(--gold)}
.ic{width:18px;height:18px;flex:none}
.sidebar-footer{margin-top:auto;font-size:11px;opacity:.75;padding-top:14px;border-top:1px solid rgba(255,255,255,.15)}
.sidebar-org{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;opacity:.9;line-height:1.4}
.sidebar-org img{height:26px;width:auto;flex:none}
.mode-pill{
  font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.mode-pill.dash{background:var(--idle-bg);color:var(--ink-2)}
.mode-pill.admin{background:var(--gold);color:#3a3320}

.main{flex:1;min-width:0}
.clock-bar{
  background:var(--navy);color:#fff;padding:8px 26px;
  display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;
  font-size:12.5px;font-weight:700;
}
.clock-item{display:flex;align-items:center;gap:8px}
.clock-label{opacity:.75;font-weight:600}
.clock-time{font-variant-numeric:tabular-nums;letter-spacing:.5px;font-size:13.5px}
@media (max-width:640px){
  .clock-bar{padding:8px 14px;gap:10px 20px;font-size:11.5px}
  .clock-time{font-size:12.5px}
}

/* ============ Royal Anthem player (independent of app state/render) ============ */
.anthem-gate{
  position:fixed;inset:0;z-index:400;background:rgba(15,27,32,.55);
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.anthem-gate-card{
  background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  padding:26px 24px;max-width:380px;width:100%;text-align:center;
}
.anthem-gate-title{font-size:17px;font-weight:800;color:var(--navy)}
.anthem-gate-sub{font-size:13px;color:var(--muted);margin-top:4px}
.anthem-gate-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.anthem-gate-actions .btn{width:100%;justify-content:center}
.anthem-bar{
  position:fixed;left:16px;bottom:16px;z-index:90;
  display:flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--border);border-radius:999px;
  box-shadow:var(--shadow);padding:6px 10px;
}
.anthem-bar .ic{width:18px;height:18px}
.anthem-bar button{
  display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:999px;border:none;background:transparent;color:var(--navy);
}
.anthem-bar button:hover{background:var(--surface-2)}
.anthem-bar input[type=range]{width:70px;accent-color:var(--teal)}
.anthem-bar .anthem-label{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;padding-inline-start:2px}
@media (max-width:640px){
  .anthem-bar{left:8px;bottom:8px;padding:5px 8px;gap:4px}
  .anthem-bar input[type=range]{width:52px}
  .anthem-bar .anthem-label{display:none}
}
.orgbar{
  background:var(--surface);border-bottom:1px solid var(--border);padding:12px 26px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.orgbar-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13.5px;color:var(--ink-2)}
.orgbar-brand img{height:34px;width:auto}
.topbar{
  position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);
  padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:21px;margin:0;font-weight:800}
.topbar .sub{font-size:13px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:10px;
  font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px;transition:.15s;
}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.06);color:#fff}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.teal:hover{filter:brightness(1.06);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}

.content{padding:24px 26px 60px;max-width:1400px;margin:0 auto}
.hidden{display:none!important}

/* ============ Cards / KPIs ============ */
.kpi-area{display:flex;gap:14px;margin-bottom:22px;align-items:stretch}
@media (max-width:900px){.kpi-area{flex-direction:column}}
.kpi-hero{
  flex:0 0 300px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:18px 20px;display:flex;flex-direction:column;gap:10px;
}
.kpi-hero-hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi-hero-hd h3{margin:0;font-size:14.5px;font-weight:800}
.kpi-hero-icon{width:34px;height:34px;border-radius:9px;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.kpi-hero .val{font-size:38px;font-weight:800;color:var(--green)}
.kpi-hero .lbl{font-size:12.5px;color:var(--ink-2);font-weight:700}
.kpi-hero .sub{font-size:11.5px;color:var(--muted)}
.kpi-row{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:1100px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.kpi-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.kpi .val{font-size:24px;font-weight:800;color:var(--blue)}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-hd{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-hd h3{margin:0;font-size:16px;font-weight:800}
.card-bd{padding:16px 18px}

.grid-2{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
@media (max-width:980px){.grid-2{grid-template-columns:1fr}}

/* ============ Search / filter ============ */
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.search input{border:none;background:transparent;outline:none;flex:1;font-family:inherit;font-size:13.5px;color:var(--ink)}
.search svg{flex:none;opacity:.55}

/* ============ Priority list ============ */
.pri-list{list-style:none;margin:0;padding:0;max-height:640px;overflow-y:auto}
.pri-item{
  display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent;
}
.pri-item:hover{background:var(--surface-2)}
.pri-item.active{background:var(--teal-bg);border-color:var(--teal)}
.pri-num{
  flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface-2);color:var(--navy);font-weight:800;font-size:12.5px;
  display:flex;align-items:center;justify-content:center;
}
.pri-item.active .pri-num{background:var(--teal);color:#fff}
.pri-txt{flex:1;font-size:13.5px;font-weight:600;line-height:1.4}
.pri-dom{font-size:11px;color:var(--muted);margin-top:2px;font-weight:700}
.pri-chevron{flex:none;color:var(--muted);opacity:.6}

/* ============ Domain pills ============ */
.domain-row{display:flex;flex-wrap:wrap;gap:10px}
.domain-pill{
  display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-2);
}
.domain-pill .dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.domain-pill.active{background:var(--teal-bg);border-color:var(--teal);color:var(--ink)}

/* ============ Indicator detail ============ */
.detail-title{font-size:16.5px;font-weight:800;line-height:1.5;margin:0 0 6px}
.detail-tag{display:inline-flex;font-size:12px;font-weight:700;color:#fff;background:var(--blue);padding:3px 11px;border-radius:999px;margin-inline-end:6px}
.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.metric{background:var(--surface-2);border-radius:10px;padding:12px;text-align:center}
.metric .n{font-size:20px;font-weight:800;color:var(--navy)}
.metric .l{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field .val{font-size:13.5px;line-height:1.6}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px}
.status-pill.ok{background:var(--ok-bg);color:var(--ok-ink)}
.status-pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.status-pill.idle{background:var(--idle-bg);color:var(--idle-ink)}
.actions-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.action-row{border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.action-row .m{font-weight:700;font-size:13px}
.action-row .meta{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}

/* ============ Tables ============ */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
@media (max-width:760px){ table{min-width:640px} }
thead th{
  background:var(--surface-2);color:var(--ink-2);font-weight:800;font-size:12px;padding:10px 12px;text-align:right;
  white-space:nowrap;border-bottom:2px solid var(--border);
}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:hover{background:var(--surface-2)}
.chip{display:inline-flex;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip.high{background:var(--ok-bg);color:var(--ok-ink)}
.chip.mid{background:var(--warn-bg);color:var(--warn-ink)}
.chip.low{background:var(--idle-bg);color:var(--idle-ink)}
.chip.yes{background:var(--ok-bg);color:var(--ok-ink)}
.chip.no{background:var(--idle-bg);color:var(--idle-ink)}

/* ============ Forms (admin) ============ */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.form-grid{grid-template-columns:1fr}}
.form-grid .full{grid-column:1/-1}
.f-field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.f-field input,.f-field select,.f-field textarea{
  width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13.5px;
  background:var(--surface);color:var(--ink);outline:none;
}
.f-field input:focus,.f-field select:focus,.f-field textarea:focus{border-color:var(--teal)}
.f-field textarea{resize:vertical;min-height:64px}
.save-bar{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.save-msg{font-size:12.5px;font-weight:700}
.save-msg.ok{color:var(--ok-ink)}
.save-msg.err{color:#a33}

/* ============ Login gate ============ */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:20px}
.gate-card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);padding:34px 30px;width:100%;max-width:380px;text-align:center}
.gate-card img{height:52px;margin-bottom:14px}
.gate-card h2{margin:0 0 4px;font-size:18px;font-weight:800}
.gate-card p{margin:0 0 18px;font-size:13px;color:var(--muted)}
.gate-card input{
  width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:14px;
  margin-bottom:10px;outline:none;text-align:center;letter-spacing:.03em;
}
.gate-card input:focus{border-color:var(--teal)}
.gate-err{color:#a33;font-size:12.5px;font-weight:700;min-height:18px;margin-bottom:6px}

/* ============ Misc ============ */
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13.5px}
.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--muted);font-size:14px}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.team-card{border:1px solid var(--border);border-radius:12px;padding:14px}
.team-card .name{font-weight:800;font-size:14px}
.team-card .role{font-size:12.5px;color:var(--muted);margin-top:3px}
.team-card .task{font-size:11.5px;color:var(--teal);font-weight:700;margin-top:8px}

/* ============ Evidence / QR ============ */
.evidence-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.evidence-card{border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;transition:.2s;background:var(--surface)}
.evidence-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.evidence-card .txt{font-weight:700;font-size:13px;line-height:1.4;margin:8px 0;min-height:36px}
.evidence-src{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--muted)}
.evidence-src .ic{width:13px;height:13px}
.qr-box{
  width:118px;height:118px;margin:6px auto;border-radius:10px;overflow:hidden;background:#fff;padding:6px;
  border:2px solid var(--teal);cursor:pointer;animation:qrIn .4s ease-out, qrPulse 2.6s ease-in-out infinite;
  display:flex;align-items:center;justify-content:center;
}
.qr-box:hover{border-color:var(--blue);transform:scale(1.04)}
.qr-box img{width:100%;height:100%}
@keyframes qrIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes qrPulse{0%,100%{box-shadow:0 0 0 0 rgba(13,169,166,.35)}50%{box-shadow:0 0 0 7px rgba(13,169,166,0)}}
.evidence-actions{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}

.print-header{display:none}
@media print{
  .sidebar,.orgbar,.gate,.topbar,.clock-bar,.anthem-gate,.anthem-bar{display:none!important}
  .shell{display:block}
  .main{width:100%}
  .content{padding:0;max-width:none}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .print-header{
    display:flex!important;align-items:center;gap:18px;padding:0 0 16px;margin-bottom:20px;
    border-bottom:3px solid #15445A;
  }
  .print-header img{height:64px;width:auto}
  .print-header .ph-kingdom{font-size:12px;color:#5b6b73;font-weight:700}
  .print-header .ph-school{font-size:19px;font-weight:800;color:#15445A;margin-top:2px}
  .print-header .ph-title{font-size:13px;color:#0DA9A6;font-weight:700;margin-top:3px}
  .print-footer{
    display:flex!important;flex-direction:column;align-items:flex-end;gap:4px;
    position:fixed;bottom:0;right:0;left:0;padding:10px 0 6px;border-top:2px solid #d9e3de;background:#fff;
  }
  .print-footer .pf-row{display:flex;align-items:center;gap:8px;font-size:11px;color:#3d5a68;font-weight:700}
  .print-footer .pf-row img{height:22px;width:auto}
  .print-footer .pf-school{width:100%;text-align:center;font-size:12px;font-weight:800;color:#15445A;margin-top:4px;padding-top:4px;border-top:1px dashed #d9e3de}
  .content{padding-bottom:90px!important}
}
@page{ size: A4 landscape; margin: 10mm; }

/* Mirrors the @media print rules above so html2canvas (which renders in
   screen context, not print context) captures the same official look for
   the real downloadable PDF. */
.pdf-capture-mode{ background:#fff; direction:rtl; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
.pdf-capture-mode *{ -webkit-text-size-adjust:100%!important; text-size-adjust:100%!important; }
.pdf-capture-mode .card{ box-shadow:none; border:1px solid #ccc; }
.pdf-capture-mode .print-header{

.pdf-capture-mode .grid-2{display:block!important}
/* Any internally-scrollable box (like the priorities list, which is capped
   to a fixed height with overflow-y:auto on screen) must expand fully here —
   otherwise html2canvas only ever sees the clipped, currently-scrolled-to
   portion and the rest of the data silently never makes it into the PDF. */
.pdf-capture-mode .content, .pdf-capture-mode .content *{max-height:none!important;overflow:visible!important}
.pdf-capture-mode .search,.pdf-capture-mode button{display:none!important}
.pdf-capture-mode .save-bar{display:none!important}

}
.print-footer{display:none}

/* ---------------- field mapping: DB (snake_case) <-> app (camelCase) ---------------- */
function metaFromDb(r){
  if (!r) return null;
  return {schoolName:r.school_name, year:r.year, stage:r.stage, ministryNumber:r.ministry_number, performance:r.performance||[], staff:r.staff||{},

    monitoringOfficials:r.monitoring_officials||{}, evaluationToolsNote:r.evaluation_tools_note};
}
function priorityFromDb(r){
  return {id:r.id, domain:r.domain, framework:r.framework, level:r.level, baseline:r.baseline, text:r.text, target:r.target,
    lastMeasured:r.last_measured, executionStatus:r.execution_status, responsible:r.responsible, evidenceUrl:r.evidence_url, notes:r.notes,
    archived:!!r.archived, evidenceType:r.evidence_type||'link', evidenceNote:r.evidence_note||'', deleted:!!r.deleted};
}
function actionFromDb(r){
  return {id:r.id, domain:r.domain, indicatorText:r.indicator_text, improvementAction:r.improvement_action, method:r.method,
    dueDate:r.due_date, needDescription:r.need_description, responsible:r.responsible, deleted:!!r.deleted};
}
function programFromDb(r){
  return {id:r.id, name:r.name, domain:r.domain, executionDate:r.execution_date, executed:r.executed, achievementLevel:r.achievement_level,
    evaluationTool:r.evaluation_tool, notExecutedReason:r.not_executed_reason, proposedDate:r.proposed_date, archived:!!r.archived, deleted:!!r.deleted};
}
function teamFromDb(r){ return {id:r.id, name:r.name, role:r.role, task:r.task, deleted:!!r.deleted}; }
function domainAnalysisFromDb(r){
  return {id:r.id, domain:r.domain, framework:r.framework, evalDomain:r.eval_domain, standard:r.standard, code:r.code,

/* ---------------- data loading ---------------- */
async function loadAll(){
  const [metaRes, teamRes, priRes, actRes, progRes, daRes, dnRes, piRes] = await Promise.all([
    sb.from('meta').select('*').eq('id','main').maybeSingle(),
    sb.from('team').select('*').order('id'),
    sb.from('priorities').select('*').order('id'),
    sb.from('actions').select('*').order('id'),
    sb.from('programs').select('*').order('id'),
    sb.from('domain_analysis').select('*').order('id'),
    sb.from('domain_notes').select('*').order('id'),
    sb.from('plan_improvements').select('*').order('id'),
  ]);
  state.meta = metaFromDb(metaRes.data);
  const allTeam = (teamRes.data||[]).map(teamFromDb);
  const allPri = (priRes.data||[]).map(priorityFromDb);
  const allAct = (actRes.data||[]).map(actionFromDb);
  const allProg = (progRes.data||[]).map(programFromDb);
  const allDa = (daRes.data||[]).map(domainAnalysisFromDb);
  const allPi = (piRes.data||[]).map(planImprovementFromDb);
  state.team = allTeam.filter(x=>!x.deleted);
  state.priorities = allPri.filter(x=>!x.deleted);
  state.actions = allAct.filter(x=>!x.deleted);
  state.programs = allProg.filter(x=>!x.deleted);
  state.domainAnalysis = allDa.filter(x=>!x.deleted);
  state.domainNotes = (dnRes.data||[]).map(domainNoteFromDb);
  state.planImprovements = allPi.filter(x=>!x.deleted);
  state.trash = {
    team: allTeam.filter(x=>x.deleted),
    priorities: allPri.filter(x=>x.deleted),
    actions: allAct.filter(x=>x.deleted),
    programs: allProg.filter(x=>x.deleted),
    domainAnalysis: allDa.filter(x=>x.deleted),
    planImprovements: allPi.filter(x=>x.deleted),
  };
  state.loaded = true;
  if (!state.selectedPriority && state.priorities.length) state.selectedPriority = state.priorities[0].id;
  render();
}
const TRASH_LABELS = {priorities:'مؤشر', programs:'برنامج', team:'عضو فريق', actions:'إجراء', domainAnalysis:'عنصر تحليل واقع', planImprovements:'عنصر تحسين خطة'};
async function softDelete(table, id, confirmMsg){
  if (!confirm(confirmMsg)) return false;
  const {error} = await sb.from(table).update({deleted:true, deleted_at: new Date().toISOString()}).eq('id', id);
  return !error;
}
async function restoreFromTrash(table, id){
  const {error} = await sb.from(table).update({deleted:false, deleted_at:null}).eq('id', id);
  return !error;
}

function num(v){ const n = parseFloat(String(v).replace(/[^\d.]/g,'')); return isNaN(n)?null:n; }
function achievementChip(v){
  if (v==='عالي') return `<span class="chip high">عالي</span>`;
  if (v==='متوسط') return `<span class="chip mid">متوسط</span>`;
  if (v==='ضعيف') return `<span class="chip low">ضعيف</span>`;
  return `<span class="chip low">لم يقيَّم بعد</span>`;
}
function executedChip(v){
  if (v === true) return `<span class="chip yes">✓ نُفّذ</span>`;
  if (v === false) return `<span class="chip no">لم يُنفذ</span>`;
  return `<span class="chip low">لم يُحدَّث</span>`;
}
function priorityActions(p){
  return state.actions.filter(a => a.domain === p.domain && a.indicatorText && p.text && (a.indicatorText.trim() === p.text.trim() || p.text.includes(a.indicatorText.slice(0,18)) || a.indicatorText.includes(p.text.slice(0,18))));
}

function updateClock(){
  const saEl = document.getElementById('clockSA');
  const utcEl = document.getElementById('clockUTC');
  if (!saEl || !utcEl) return;
  const now = new Date();
  const saTime = new Intl.DateTimeFormat('ar-SA', {timeZone:'Asia/Riyadh', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false, numberingSystem:'latn'}).format(now);
  const saDate = new Intl.DateTimeFormat('ar-SA', {timeZone:'Asia/Riyadh', weekday:'long', day:'numeric', month:'long', numberingSystem:'latn', calendar:'gregory'}).format(now);
  const utcTime = new Intl.DateTimeFormat('ar-SA', {timeZone:'UTC', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false, numberingSystem:'latn'}).format(now);
  saEl.textContent = `${saTime} — ${saDate}`;
  utcEl.textContent = utcTime;
}
setInterval(updateClock, 1000);

function renderContent(){
  const c = document.getElementById('content');

}

/* ---------------- priorities + detail ---------------- */
function renderPriorities(c){
  const all = state.priorities.filter(p=>!state.activeDomain || normDomain(p.domain)===state.activeDomain);
  const list = all.filter(p=>state.showArchived ? p.archived : !p.archived);
  const selected = state.priorities.find(p=>p.id===state.selectedPriority) || list[0];
  const archivedCount = all.filter(p=>p.archived).length;
  c.innerHTML = `
    <div class="grid-2">
      <div id="detailPane"></div>
      <div class="card">
        <div class="card-hd"><h3>${state.showArchived?'المؤشرات المؤرشفة':'المؤشرات'} (${list.length})</h3>
          ${canEdit() && archivedCount>0 ? `<button class="btn sm ${state.showArchived?'primary':''}" id="toggleArchivedBtn">${icon('archive')} ${state.showArchived?'عرض النشط':'عرض الأرشيف ('+archivedCount+')'}</button>` : ''}
        </div>
        <div class="card-bd">
          <div class="search">${icon('search')}<input id="priSearch" placeholder="البحث في المؤشرات…"></div>
          <ul class="pri-list" id="priListEl">
            ${list.map((p,i)=>priListItem(p,i)).join('') || '<li class="empty">لا توجد مؤشرات ضمن هذا المجال</li>'}
          </ul>
        </div>
      </div>
    </div>
    <div style="margin-top:18px">${domainPillsRow()}</div>
  `;
  const toggleArchivedBtn = document.getElementById('toggleArchivedBtn');
  if (toggleArchivedBtn) toggleArchivedBtn.addEventListener('click', ()=>{ state.showArchived=!state.showArchived; state.selectedPriority=null; renderPriorities(c); });
  c.querySelectorAll('.pri-item').forEach(el=>el.addEventListener('click',()=>{state.selectedPriority=el.dataset.id;renderPriorities(c);}));
  const search = document.getElementById('priSearch');
  search.addEventListener('input', ()=>{
    const q = search.value.trim();
    const filtered = list.filter(p=>p.text.includes(q));
    document.getElementById('priListEl').innerHTML = filtered.map((p)=>priListItem(p, list.indexOf(p))).join('') || '<li class="empty">لا نتائج</li>';
    document.querySelectorAll('.pri-item').forEach(el=>el.addEventListener('click',()=>{state.selectedPriority=el.dataset.id;renderPriorities(c);}));
  });
  wireDomainPills(c, ()=>{ state.selectedPriority=null; renderPriorities(c); });
  renderDetail(document.getElementById('detailPane'), selected, {showAdminForm:true});
}

function renderDetail(el, p, opts){
  opts = opts || {showAdminForm:true};
  if (!p){ el.innerHTML = `<div class="card"><div class="card-bd empty">اختاري مؤشرًا من القائمة</div></div>`; return; }
  const acts = priorityActions(p);
  const statusLabel = p.executionStatus || 'لم يُحدَّث';
  const statusCls = p.executionStatus==='مكتمل' ? 'ok' : (p.executionStatus==='قيد التنفيذ' ? 'warn' : 'idle');
  const documented = !!p.lastMeasured;

  el.innerHTML = `
    <div class="card">
      <div class="card-hd"><h3>تفاصيل المؤشر</h3>${icon('list')}</div>
      <div class="card-bd">
        <div class="field"><label>مجال المؤشر</label><div class="val" style="display:inline-flex;background:var(--blue-bg);color:var(--blue-ink);padding:4px 12px;border-radius:999px;font-weight:700;font-size:12.5px">${esc(normDomain(p.domain))}</div></div>
        <h2 class="detail-title">${esc(p.text)}</h2>

        <div class="metric-row" style="grid-template-columns:1fr 1fr">
          <div class="metric"><div class="n tabular" style="color:var(--blue)">${esc(p.target)}%</div><div class="l">المستهدف</div></div>
          <div class="metric"><div class="n tabular">${esc(p.baseline)}%</div><div class="l">خط الأساس</div></div>
        </div>
        <div class="metric-row" style="grid-template-columns:1fr 1fr">
          <div class="metric"><div class="n tabular" style="font-size:14px">${documented?'موثّق':'لم يوثّق بعد'}</div><div class="l">حالة التوثيق</div></div>
          <div class="metric"><div class="n tabular" style="font-size:14px">${esc(p.lastMeasured||'—')}</div><div class="l">آخر قياس موثق</div></div>
        </div>

        <div class="field"><label>حالة التنفيذ</label><div class="val"><span class="status-pill ${statusCls}">${esc(statusLabel)}</span></div></div>
        <div class="field"><label>المسؤول عن التنفيذ</label><div class="val">${esc(p.responsible||'—')}</div></div>
        ${p.evidenceUrl?`<div class="field"><label>الشواهد</label><div class="val"><a href="${esc(p.evidenceUrl)}" target="_blank" rel="noopener" style="color:var(--blue);font-weight:700">فتح رابط الشاهد ↗</a></div></div>`:''}
        ${p.notes?`<div class="field"><label>ملاحظات</label><div class="val">${esc(p.notes)}</div></div>`:''}

        <button type="button" class="btn primary" id="toggleActionsBtn" style="width:100%;justify-content:center;margin-top:8px">${icon('doc')} عرض الإجراءات والشواهد (${acts.length})</button>
        <div id="actionsWrap" class="hidden" style="margin-top:14px">
          <div class="field"><label>الإطار الموجه</label><div class="val">${esc(p.framework||'—')}</div></div>
          <ul class="actions-list">
            ${acts.map(a=>`<li class="action-row" data-action-id="${a.id}">
              <div class="m">${esc(a.method)}</div>
              <div class="meta"><span>📅 ${esc(a.dueDate)}</span><span>👤 ${esc(a.responsible)}</span></div>
              ${canEdit()?`<div class="actions" style="margin-top:6px"><button type="button" class="btn sm ghost" data-edit-action="${a.id}">تعديل</button><button type="button" class="btn sm ghost" data-delete-action="${a.id}" style="color:#a33">${icon('trash')} حذف</button></div>`:''}
            </li>`).join('') || '<li class="empty">لا توجد إجراءات مرتبطة موثقة</li>'}
          </ul>
          ${canEdit()?`<button type="button" class="btn sm teal" id="addActionBtn" style="margin-top:10px">${icon('plus')} إضافة إجراء جديد</button>`:''}
          <div id="actionModal"></div>
        </div>

        ${opts.showAdminForm && canEdit() ? adminPriorityForm(p) : ''}
      </div>
    </div>
  `;
  const toggleBtn = document.getElementById('toggleActionsBtn');
  if (toggleBtn) toggleBtn.addEventListener('click', ()=>{ document.getElementById('actionsWrap').classList.toggle('hidden'); });
  if (canEdit()){
    document.querySelectorAll('[data-edit-action]').forEach(b=>b.addEventListener('click', ()=>{
      openActionEditor(state.actions.find(a=>a.id===b.dataset.editAction), p, el);
    }));
    document.querySelectorAll('[data-delete-action]').forEach(b=>b.addEventListener('click', async ()=>{
      const id = b.dataset.deleteAction;
      const ok = await softDelete('actions', id, 'هل تريدين حذف هذا الإجراء؟ يمكن استعادته لاحقًا من سلة المحذوفات.');
      if (ok){
        const item = state.actions.find(x=>x.id===id);
        state.actions = state.actions.filter(x=>x.id!==id);
        if (item) state.trash.actions.push(Object.assign({}, item, {deleted:true}));
        renderDetail(el, p, opts);
      }
    }));
    const addActionBtn = document.getElementById('addActionBtn');
    if (addActionBtn) addActionBtn.addEventListener('click', ()=>{ openActionEditor(null, p, el); });
  }
  if (opts.showAdminForm && canEdit()) wireAdminPriorityForm(p);
}

function openActionEditor(a, p, el){
  const isNew = !a;
  const modal = document.getElementById('actionModal');
  modal.innerHTML = `
    <div style="position:fixed;inset:0;background:rgba(15,27,32,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px" id="actModalBg">
      <div class="card" style="max-width:520px;width:100%;max-height:88vh;overflow-y:auto">
        <div class="card-hd"><h3>${isNew?'إضافة إجراء جديد':'تعديل الإجراء'}</h3><button class="btn sm ghost" id="actModalClose">✕</button></div>
        <div class="card-bd">
          <form id="actForm">
            <div class="form-grid">
              <div class="f-field full"><label>الإجراء التحسيني</label><textarea name="improvementAction">${esc(a?.improvementAction||'')}</textarea></div>
              <div class="f-field full"><label>طريقة التنفيذ / الآلية</label><textarea name="method">${esc(a?.method||'')}</textarea></div>
              <div class="f-field"><label>التاريخ المستهدف</label><input name="dueDate" value="${esc(a?.dueDate||'')}"></div>
              <div class="f-field"><label>المسؤول عن التنفيذ</label><input name="responsible" value="${esc(a?.responsible||'')}"></div>
              <div class="f-field full"><label>وصف الاحتياج / المبرر</label><textarea name="needDescription">${esc(a?.needDescription||'')}</textarea></div>
            </div>
            <div class="save-bar">
              <button type="submit" class="btn teal">${isNew?'إضافة':'حفظ'}</button>
              <span class="save-msg" id="actSaveMsg"></span>
            </div>
          </form>
        </div>
      </div>
    </div>
  `;
  document.getElementById('actModalClose').addEventListener('click', ()=>modal.innerHTML='');
  document.getElementById('actModalBg').addEventListener('click', e=>{ if(e.target.id==='actModalBg') modal.innerHTML=''; });
  document.getElementById('actForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const patch = Object.fromEntries(fd.entries());
    const msg = document.getElementById('actSaveMsg');
    msg.textContent = 'جارِ الحفظ…'; msg.className='save-msg';
    if (isNew){
      const newId = 'a' + String(Date.now()).slice(-8);
      const row = Object.assign({id:newId, domain:p.domain, indicatorText:p.text}, patch);
      const {error} = await sb.from('actions').insert(actionPatchToDb(row));
      if (!error){
        state.actions.push(row);
        msg.textContent='تم الحفظ ✓'; msg.className='save-msg ok';
        setTimeout(()=>{ modal.innerHTML=''; renderDetail(el, p, {showAdminForm:true}); }, 500);
      } else { msg.textContent='تعذّر الحفظ'; msg.className='save-msg err'; }
    } else {
      const {error} = await sb.from('actions').update(actionPatchToDb(patch)).eq('id', a.id);
      if (!error){
        Object.assign(a, patch);
        msg.textContent='تم الحفظ ✓'; msg.className='save-msg ok';
        setTimeout(()=>{ modal.innerHTML=''; renderDetail(el, p, {showAdminForm:true}); }, 500);
      } else { msg.textContent='تعذّر الحفظ'; msg.className='save-msg err'; }
    }
  });
}

function wireAdminPriorityForm(p){
  const form = document.getElementById('priForm');
  if (!form) return;
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(form);
    const patch = Object.fromEntries(fd.entries());
    const msg = document.getElementById('priSaveMsg');
    msg.textContent = 'جارِ الحفظ…'; msg.className='save-msg';
    const {error} = await sb.from('priorities').update(priorityPatchToDb(patch)).eq('id', p.id);
    if (!error){
      Object.assign(p, patch);
      msg.textContent = 'تم الحفظ ✓'; msg.className='save-msg ok';
    } else {
      msg.textContent = 'تعذّر الحفظ — حاولي مجددًا'; msg.className='save-msg err';
    }
  });
  const archiveBtn = document.getElementById('archiveBtn');
  if (archiveBtn) archiveBtn.addEventListener('click', async ()=>{
    const newVal = !p.archived;
    const {error} = await sb.from('priorities').update({archived:newVal}).eq('id', p.id);
    if (!error){ p.archived = newVal; state.selectedPriority=null; renderPriorities(document.getElementById('content')); }
  });
  const deleteBtn = document.getElementById('deletePriBtn');
  if (deleteBtn) deleteBtn.addEventListener('click', async ()=>{
    const ok = await softDelete('priorities', p.id, 'هل تريدين حذف هذا المؤشر؟ يمكن استعادته لاحقًا من سلة المحذوفات.');
    if (ok){
      state.priorities = state.priorities.filter(x=>x.id!==p.id);
      state.trash.priorities.push(Object.assign({}, p, {deleted:true}));
      state.selectedPriority = null;
      renderPriorities(document.getElementById('content'));
    }
  });
}

function detectEvidenceSource(p){
  const type = p.evidenceType || 'link';
  if (type === 'text') return {label:'نص', ic:'note'};
  const u = String(p.evidenceUrl||'').toLowerCase();
  if (type === 'youtube' || u.includes('youtube.com') || u.includes('youtu.be')) return {label:'يوتيوب', ic:'youtube'};
  if (u.includes('drive.google.com') || u.includes('docs.google.com')) return {label:'Google Drive', ic:'cloud'};
  if (u.includes('t.me/') || u.includes('telegram.me') || u.includes('telegram.org')) return {label:'Telegram', ic:'telegram'};
  return {label:'رابط', ic:'link'};
}

function youtubeEmbedUrl(url){
  const m = String(url||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : null;
}

function wireEvidenceAddForm(){
  const form = document.getElementById('evidenceForm');
  if (!form) return;
  const evTypeSel = document.getElementById('evTypeSel');
  const evUrlWrap = document.getElementById('evUrlWrap');
  const evTextWrap = document.getElementById('evTextWrap');
  evTypeSel.addEventListener('change', ()=>{
    const isText = evTypeSel.value === 'text';
    evUrlWrap.classList.toggle('hidden', isText);
    evTextWrap.classList.toggle('hidden', !isText);
  });
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(form);
    const id = fd.get('priorityId');
    const evType = fd.get('evType');
    const url = evType === 'text' ? '' : (fd.get('url')||'');
    const note = evType === 'text' ? (fd.get('note')||'') : '';
    const msg = document.getElementById('evSaveMsg');
    if (evType !== 'text' && !url){ msg.textContent='أدخلي رابطًا صحيحًا'; msg.className='save-msg err'; return; }
    if (evType === 'text' && !note){ msg.textContent='أدخلي نصًا'; msg.className='save-msg err'; return; }
    msg.textContent = 'جارِ الحفظ…'; msg.className = 'save-msg';
    const {error} = await sb.from('priorities').update({evidence_url: url, evidence_type: evType, evidence_note: note}).eq('id', id);
    if (!error){
      const p = state.priorities.find(x=>x.id===id);
      if (p){ p.evidenceUrl = url; p.evidenceType = evType; p.evidenceNote = note; }
      msg.textContent = 'تم الحفظ ✓'; msg.className = 'save-msg ok';
      form.reset();
      renderEvidence(document.getElementById('content'));
    } else {
      msg.textContent = 'تعذّر الحفظ — حاولي مجددًا'; msg.className = 'save-msg err';
    }
  });
}

function evidenceCard(p){
  const src = detectEvidenceSource(p);
  const embed = src.label==='يوتيوب' ? youtubeEmbedUrl(p.evidenceUrl) : null;
  return `<div class="evidence-card">
    <div style="display:flex;align-items:center;justify-content:center;gap:6px">
      <div class="pri-dom">${esc(normDomain(p.domain))}</div>
      <span class="evidence-src">${icon(src.ic)} ${src.label}</span>
    </div>
    <div class="txt">${esc(p.text.length>70?p.text.slice(0,70)+'…':p.text)}</div>
    ${p.evidenceType==='text' ? `<div class="val" style="text-align:right;padding:10px;background:var(--surface-2);border-radius:8px;font-size:12.5px">${esc(p.evidenceNote)}</div>` :
      embed ? `<div style="aspect-ratio:16/9;border-radius:10px;overflow:hidden;margin:6px 0"><iframe src="${esc(embed)}" style="width:100%;height:100%;border:0" allowfullscreen></iframe></div>` :
      `<div class="qr-box" id="qr-${p.id}" title="اضغطي لفتح رابط الشاهد"></div>`}
    <div class="evidence-actions">
      ${p.evidenceType!=='text' ? `<a href="${esc(p.evidenceUrl)}" target="_blank" rel="noopener" class="btn sm">${icon('doc')} فتح الرابط</a>` : ''}
      ${canEdit() ? `<button type="button" class="btn sm ghost" data-remove-ev="${p.id}" title="حذف الشاهد">${icon('trash')} حذف الشاهد</button>` : ''}
    </div>
  </div>`;
}

function renderEvidence(c){
  const withEvidence = state.priorities.filter(p=>p.evidenceUrl || p.evidenceNote);
  c.innerHTML = `
    <div class="card">
      <div class="card-hd"><h3>الشواهد الموثّقة (${withEvidence.length})</h3></div>
      <div class="card-bd">
        ${canEdit() ? evidenceAddForm() : ''}
        <div class="evidence-grid">
          ${withEvidence.map(p=>evidenceCard(p)).join('') || '<div class="empty">لا توجد شواهد موثّقة بعد لأي مؤشر</div>'}
        </div>
      </div>
    </div>
  `;
  if (canEdit()){
    wireEvidenceAddForm();
    c.querySelectorAll('[data-remove-ev]').forEach(b=>b.addEventListener('click', async ()=>{
      const id = b.dataset.removeEv;
      const {error} = await sb.from('priorities').update({evidence_url: '', evidence_type: 'link', evidence_note: ''}).eq('id', id);
      if (!error){
        const p = state.priorities.find(x=>x.id===id);
        if (p){ p.evidenceUrl = ''; p.evidenceType = 'link'; p.evidenceNote = ''; }
        renderEvidence(c);
      }
    }));
  }
  renderQRCodes(withEvidence.filter(p=>p.evidenceType!=='text' && !(detectEvidenceSource(p).label==='يوتيوب' && youtubeEmbedUrl(p.evidenceUrl))));
}

function renderQRCodes(list){
  if (!window.QRCode) return;
  list.forEach(p=>{
    const el = document.getElementById('qr-'+p.id);
    if (!el) return;
    el.innerHTML = '';
    new QRCode(el, {text: p.evidenceUrl, width:104, height:104, colorDark:'#15445A', colorLight:'#ffffff'});
    el.addEventListener('click', ()=>window.open(p.evidenceUrl, '_blank', 'noopener'));
  });
}

/* ---------------- سلة المحذوفات (Trash / Restore, admin only) ---------------- */
function renderTrash(c){
  const groups = Object.keys(state.trash).map(type=>({type, items: state.trash[type]})).filter(g=>g.items.length);
  const total = groups.reduce((n,g)=>n+g.items.length, 0);
  c.innerHTML = `
    <div class="card">
      <div class="card-hd"><h3>سلة المحذوفات (${total})</h3></div>
      <div class="card-bd">
        ${total===0 ? '<div class="empty">لا يوجد عناصر محذوفة حاليًا</div>' : groups.map(g=>`
          <div style="margin-bottom:18px">
            <h4 style="margin:0 0 8px;font-size:13.5px;color:var(--ink-2)">${esc(TRASH_LABELS[g.type])} (${g.items.length})</h4>
            <ul class="actions-list">
              ${g.items.map(it=>`<li class="action-row" data-trash-type="${g.type}" data-trash-id="${it.id}">
                <div class="m">${esc(it.text||it.name||it.programName||it.indicatorText||it.method||it.id)}</div>
                <div class="meta">
                  <button type="button" class="btn sm" data-restore="${it.id}" data-restore-type="${g.type}">${icon('undo')} استعادة</button>
                </div>
              </li>`).join('')}
            </ul>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  c.querySelectorAll('[data-restore]').forEach(b=>b.addEventListener('click', async ()=>{
    const id = b.dataset.restore, type = b.dataset.restoreType;
    const tableMap = {priorities:'priorities', programs:'programs', team:'team', actions:'actions', domainAnalysis:'domain_analysis', planImprovements:'plan_improvements'};
    const ok = await restoreFromTrash(tableMap[type], id);
    if (ok){
      const item = state.trash[type].find(x=>x.id===id);
      state.trash[type] = state.trash[type].filter(x=>x.id!==id);
      if (item){
        const restored = Object.assign({}, item, {deleted:false});
        if (type==='priorities') state.priorities.push(restored);
        else if (type==='programs') state.programs.push(restored);
        else if (type==='team') state.team.push(restored);
        else if (type==='actions') state.actions.push(restored);
        else if (type==='domainAnalysis') state.domainAnalysis.push(restored);
        else if (type==='planImprovements') state.planImprovements.push(restored);
      }
      renderTrash(c);
    }
  }));
}

/* ---------------- Excel export (styled workbook via ExcelJS, real browser download) ---------------- */
const XL_NAVY='FF15445A', XL_WHITE='FFFFFFFF', XL_BORDER='FFD9E3DE', XL_STRIPE='FFF4F6F6';
const XL_PAGE_MARGINS = {left:0.35, right:0.35, top:0.5, bottom:0.5, header:0.2, footer:0.2};
function xlPageSetup(withTitlesRow){
  const setup = {paperSize:9, orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0, margins:XL_PAGE_MARGINS, horizontalCentered:true};
  if (withTitlesRow) setup.printTitlesRow = '1:1';
  return setup;
}

function xlStyleHeader(row){
  row.eachCell(cell=>{
    cell.font = {bold:true, color:{argb:XL_WHITE}, size:11, name:'Calibri'};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:XL_NAVY}};
    cell.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    cell.border = {top:{style:'thin',color:{argb:XL_BORDER}},bottom:{style:'thin',color:{argb:XL_BORDER}},left:{style:'thin',color:{argb:XL_BORDER}},right:{style:'thin',color:{argb:XL_BORDER}}};
  });
  row.height = 26;
}
function xlStyleBody(row, i){
  row.eachCell(cell=>{
    cell.alignment = {horizontal:'right', vertical:'top', wrapText:true};
    cell.border = {top:{style:'thin',color:{argb:XL_BORDER}},bottom:{style:'thin',color:{argb:XL_BORDER}},left:{style:'thin',color:{argb:XL_BORDER}},right:{style:'thin',color:{argb:XL_BORDER}}};
    if (i % 2 === 1) cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:XL_STRIPE}};
  });
}

  const btn = document.getElementById('btnExcel');
  if (!window.ExcelJS){ alert('تعذّر تحميل مكتبة إكسل. جرّبي إعادة فتح الصفحة.'); return; }
  const origHtml = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = 'جارِ التجهيز…';
  try{
    const wb = new ExcelJS.Workbook();
    wb.creator = 'خطة تحسين ' + (state.meta?.schoolName||'');

/* ---------------- real PDF export (html2canvas + jsPDF, row-safe pagination) ---------------- */
const PDF_MARGIN_MM = 10;
const PDF_PAGE_W_MM = 297, PDF_PAGE_H_MM = 210;
const PDF_CONTENT_W_MM = PDF_PAGE_W_MM - PDF_MARGIN_MM*2;
const PDF_CONTENT_H_MM = PDF_PAGE_H_MM - PDF_MARGIN_MM*2;
const PDF_CAPTURE_WIDTH_PX = 1400;
const PDF_MM_PER_PX = PDF_CONTENT_W_MM / PDF_CAPTURE_WIDTH_PX;
const PDF_RENDER_SCALE = 2;

async function waitForPendingSaves(){
  for (let i=0;i<40;i++){
    const busy = Array.from(document.querySelectorAll('[id$="SaveMsg"]')).some(el => (el.textContent||'').includes('جارِ الحفظ'));
    if (!busy) return;
    await new Promise(r=>setTimeout(r,150));
  }
}

function inlinePdfFormValues(root){
  root.querySelectorAll('select').forEach(el=>{
    const opt = el.options[el.selectedIndex];
    const div = document.createElement('div');
    div.className = 'pdf-field-value';
    div.textContent = opt ? opt.textContent : '';
    el.replaceWith(div);
  });
  root.querySelectorAll('input, textarea').forEach(el=>{
    const div = document.createElement('div');
    div.className = 'pdf-field-value';
    div.textContent = el.value || '';
    el.replaceWith(div);
  });
}

function flattenGridsForCapture(root){
  root.querySelectorAll('.grid-2').forEach(grid=>{
    const parent = grid.parentNode;
    Array.from(grid.children).forEach((child,i)=>{
      if (i>0) child.style.marginTop = '14px';
      parent.insertBefore(child, grid);
    });
    grid.remove();
  });
}

function decomposeForPdf(el, maxHeightPx, depth){
  const h = el.getBoundingClientRect().height;
  if (h <= maxHeightPx || depth >= 8) return [el];
  const children = Array.from(el.children).filter(c => c.getBoundingClientRect().height > 0);
  if (children.length < 1) return [el];
  // Only safe to split a container into its children when they're stacked
  // top-to-bottom with no vertical overlap (e.g. a 2-column grid row, or a
  // row of side-by-side KPI cards, would otherwise get the same page-slice
  // sliced twice — once per sibling — producing duplicated content).
  const rects = children.map(c => c.getBoundingClientRect());
  let prevBottom = -Infinity, stacked = true;
  for (const r of rects){
    if (r.top < prevBottom - 1){ stacked = false; break; }
    prevBottom = Math.max(prevBottom, r.bottom);
  }
  if (!stacked) return [el];
  let out = [];
  children.forEach(ch => { out.push(...decomposeForPdf(ch, maxHeightPx, depth+1)); });
  return out;
}

function buildPdfSegments(contentEl, maxHeightPx){
  const containerTop = contentEl.getBoundingClientRect().top;
  const leaves = [];
  Array.from(contentEl.children).forEach(child=>{
    leaves.push(...decomposeForPdf(child, maxHeightPx, 0));
  });
  const theadsNeeded = new Set();
  const segments = leaves.map(el=>{
    const r = el.getBoundingClientRect();
    let repeatEl = null;
    if (el.tagName === 'TR'){
      const table = el.closest('table');
      const thead = table ? table.querySelector('thead') : null;
      if (thead){ repeatEl = thead; theadsNeeded.add(thead); }
    }
    return {top: r.top - containerTop, bottom: r.bottom - containerTop, repeatEl};
  });
  return {segments, theadsNeeded};
}

function paginatePdfSegments(segments, budgetFirstPx, budgetRestPx, headerHeightsPx){
  const pages = [];
  let page = [], used = 0, budget = budgetFirstPx;
  function startNewPage(){ if (page.length) pages.push(page); page = []; used = 0; budget = budgetRestPx; }
  segments.forEach(seg=>{
    const h = seg.bottom - seg.top;
    if (page.length === 0){
      const extra = seg.repeatEl ? (headerHeightsPx.get(seg.repeatEl) || 0) : 0;
      page.push({top:seg.top, bottom:seg.bottom, headerImgEl: seg.repeatEl || null});
      used = h + extra;
      return;
    }
    if (used + h > budget){
      startNewPage();
      const extra = seg.repeatEl ? (headerHeightsPx.get(seg.repeatEl) || 0) : 0;
      page.push({top:seg.top, bottom:seg.bottom, headerImgEl: seg.repeatEl || null});
      used = h + extra;
    } else {
      page.push({top:seg.top, bottom:seg.bottom, headerImgEl: null});
      used += h;
    }
  });
  if (page.length) pages.push(page);
  return pages;
}

function sliceCanvasVertical(canvas, yStart, yEnd){
  yStart = Math.max(0, Math.round(yStart));
  yEnd = Math.min(canvas.height, Math.round(yEnd));
  const h = Math.max(1, yEnd - yStart);
  const out = document.createElement('canvas');
  out.width = canvas.width; out.height = h;
  const ctx = out.getContext('2d');
  ctx.drawImage(canvas, 0, yStart, canvas.width, h, 0, 0, canvas.width, h);
  return out;
}

function downloadPdfBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

function buildPdfFilename(){
  const school = (state.meta?.schoolName || 'مدرسة-النهروان-الثانوية').replace(/\s+/g,'-');
  const sectionEl = document.querySelector('.topbar h1');
  const section = (sectionEl?.textContent || 'تقرير').trim().replace(/\s+/g,'-');
  const now = new Date();
  const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0'), d = String(now.getDate()).padStart(2,'0');
  return `${school}-${section}-${y}-${m}-${d}.pdf`.replace(/[\\/:*?"<>|]/g,'-');
}

async function exportPdfReal(){
  const btn = document.getElementById('btnPrint');
  if (!window.html2canvas || !window.jspdf){
    alert('تعذّر تحميل أدوات إنشاء PDF (تحقّقي من الاتصال بالإنترنت). سيتم فتح نافذة الطباعة العادية بدلاً من ذلك.');
    window.print();
    return;
  }
  const origHtml = btn.innerHTML;
  btn.disabled = true;
  let capture = null;
  try{
    btn.innerHTML = `${icon('print')} جارِ تحديث البيانات…`;
    await waitForPendingSaves();
    await loadAll();
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

    btn.innerHTML = `${icon('print')} جارِ إنشاء PDF…`;

    const sourceHeader = document.querySelector('.print-header');
    const sourceContent = document.getElementById('content');
    const sourceFooter = document.querySelector('.print-footer');
    if (!sourceHeader || !sourceContent || !sourceFooter) throw new Error('تعذّر العثور على محتوى الصفحة للتصدير');

    capture = document.createElement('div');
    capture.className = 'pdf-capture-mode';
    capture.style.cssText = `position:fixed;top:0;left:-99999px;width:${PDF_CAPTURE_WIDTH_PX}px;background:#fff;`;
    const headerClone = sourceHeader.cloneNode(true);
    const contentClone = document.createElement('div');
    contentClone.className = 'content';
    contentClone.innerHTML = sourceContent.innerHTML;
    const footerClone = sourceFooter.cloneNode(true);
    capture.appendChild(headerClone);
    capture.appendChild(contentClone);
    capture.appendChild(footerClone);
    document.body.appendChild(capture);

    inlinePdfFormValues(contentClone);
    flattenGridsForCapture(contentClone);
    contentClone.querySelectorAll('[id$="Modal"]').forEach(m=>{ if(!m.textContent.trim()) m.remove(); });

    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    if (document.fonts && document.fonts.ready) await document.fonts.ready;

    if (!contentClone.children.length) throw new Error('لا يوجد محتوى ظاهر لتصديره في هذه الصفحة');

    const headerHeightPx = headerClone.getBoundingClientRect().height;
    const footerHeightPx = footerClone.getBoundingClientRect().height;
    const fullBudgetPx = (PDF_CONTENT_H_MM / PDF_MM_PER_PX) - footerHeightPx - 10;
    const firstBudgetPx = fullBudgetPx - headerHeightPx;

    const {segments, theadsNeeded} = buildPdfSegments(contentClone, fullBudgetPx);
    const headerHeightsPx = new Map();
    const headerCanvases = new Map();
    for (const thead of theadsNeeded){
      const rect = thead.getBoundingClientRect();
      headerHeightsPx.set(thead, rect.height);
      const wrapTable = thead.closest('table');
      const miniTable = document.createElement('table');
      miniTable.className = wrapTable ? wrapTable.className : '';
      miniTable.style.cssText = 'width:100%;border-collapse:collapse;';
      miniTable.appendChild(thead.cloneNode(true));
      const miniWrap = document.createElement('div');
      miniWrap.className = 'pdf-capture-mode table-wrap';
      miniWrap.style.cssText = `position:fixed;top:0;left:-99999px;width:${PDF_CAPTURE_WIDTH_PX}px;background:#fff;`;
      miniWrap.appendChild(miniTable);
      document.body.appendChild(miniWrap);
      const c = await html2canvas(miniWrap, {scale: PDF_RENDER_SCALE, backgroundColor:'#ffffff', useCORS:true});
      headerCanvases.set(thead, c);
      document.body.removeChild(miniWrap);
    }

    const headerCanvas = await html2canvas(headerClone, {scale: PDF_RENDER_SCALE, backgroundColor:'#ffffff', useCORS:true});
    const footerCanvas = await html2canvas(footerClone, {scale: PDF_RENDER_SCALE, backgroundColor:'#ffffff', useCORS:true});
    const contentCanvas = await html2canvas(contentClone, {scale: PDF_RENDER_SCALE, backgroundColor:'#ffffff', useCORS:true});

    const pages = paginatePdfSegments(segments, firstBudgetPx, fullBudgetPx, headerHeightsPx);
    if (!pages.length) throw new Error('تعذّر تقسيم المحتوى إلى صفحات');

    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});

    pages.forEach((segs, pageIdx)=>{
      if (pageIdx > 0) pdf.addPage();
      let cursorMm = PDF_MARGIN_MM;
      if (pageIdx === 0){
        const hHmm = headerHeightPx * PDF_MM_PER_PX;
        pdf.addImage(headerCanvas.toDataURL('image/jpeg', 0.95), 'JPEG', PDF_MARGIN_MM, cursorMm, PDF_CONTENT_W_MM, hHmm);
        cursorMm += hHmm;
      }
      segs.forEach(seg=>{
        if (seg.headerImgEl){
          const hc = headerCanvases.get(seg.headerImgEl);
          const hHmm = (headerHeightsPx.get(seg.headerImgEl) || 0) * PDF_MM_PER_PX;
          if (hc && hHmm > 0){
            pdf.addImage(hc.toDataURL('image/jpeg', 0.95), 'JPEG', PDF_MARGIN_MM, cursorMm, PDF_CONTENT_W_MM, hHmm);
            cursorMm += hHmm;
          }
        }
        const segHpx = seg.bottom - seg.top;
        if (segHpx <= 0) return;
        const segHmm = segHpx * PDF_MM_PER_PX;
        const slice = sliceCanvasVertical(contentCanvas, seg.top*PDF_RENDER_SCALE, seg.bottom*PDF_RENDER_SCALE);
        pdf.addImage(slice.toDataURL('image/jpeg', 0.95), 'JPEG', PDF_MARGIN_MM, cursorMm, PDF_CONTENT_W_MM, segHmm);
        cursorMm += segHmm;
      });
      const footerHmm = footerHeightPx * PDF_MM_PER_PX;
      const footerY = PDF_PAGE_H_MM - PDF_MARGIN_MM - footerHmm;
      pdf.addImage(footerCanvas.toDataURL('image/jpeg', 0.95), 'JPEG', PDF_MARGIN_MM, footerY, PDF_CONTENT_W_MM, footerHmm);
      pdf.setFontSize(8);
      pdf.setTextColor(120,120,120);
      pdf.text(`${pageIdx+1} / ${pages.length}`, PDF_PAGE_W_MM/2, PDF_PAGE_H_MM - 4, {align:'center'});
    });

    const filename = buildPdfFilename();
    const blob = pdf.output('blob');
    let shared = false;
    if (navigator.canShare && navigator.share){
      try{
        const file = new File([blob], filename, {type:'application/pdf'});
        if (navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title: filename});
          shared = true;
        }
      }catch(shareErr){
        if (shareErr && shareErr.name === 'AbortError') shared = true; // user cancelled share sheet on purpose
      }
    }
    if (!shared) downloadPdfBlob(blob, filename);

  }catch(err){
    alert('تعذّر إنشاء ملف PDF: ' + (err?.message || 'حدث خطأ غير متوقع') + '\nجرّبي مرة أخرى.');
  }finally{
    if (capture && capture.parentNode) capture.parentNode.removeChild(capture);
    btn.disabled = false; btn.innerHTML = origHtml;
  }
}

/* ---------------- Royal Anthem player (independent: no state, no render(), no reload) ---------------- */
let anthemInitStarted = false;
function initAnthem(){
  if (anthemInitStarted) return;
  anthemInitStarted = true;
  try{
    const audio = document.getElementById('anthemAudio');
    const gate = document.getElementById('anthemGate');
    const bar = document.getElementById('anthemBar');
    const gatePlayBtn = document.getElementById('anthemGatePlay');
    const gateSkipBtn = document.getElementById('anthemGateSkip');
    const toggleBtn = document.getElementById('anthemToggle');
    const stopBtn = document.getElementById('anthemStop');
    const muteBtn = document.getElementById('anthemMute');
    const volumeInput = document.getElementById('anthemVolume');
    if (!audio || !gate || !bar || !toggleBtn || !stopBtn || !muteBtn) return;

    audio.volume = Number(volumeInput?.value || 70) / 100;

    function renderToggleIcon(){ toggleBtn.innerHTML = icon(audio.paused ? 'play' : 'pause'); }
    function renderMuteIcon(){ muteBtn.innerHTML = icon(audio.muted ? 'volumeMute' : 'volume'); }
    renderToggleIcon();
    renderMuteIcon();

    audio.addEventListener('play', renderToggleIcon);
    audio.addEventListener('pause', renderToggleIcon);
    audio.addEventListener('volumechange', renderMuteIcon);
    // Any playback failure (missing file, blocked codec, network hiccup) must never
    // break the rest of the site: just retire the anthem UI quietly.
    audio.addEventListener('error', ()=>{ gate.hidden = true; bar.hidden = true; });

    function showBar(){ gate.hidden = true; bar.hidden = false; }

    toggleBtn.addEventListener('click', ()=>{
      if (audio.paused) audio.play().catch(()=>{});
      else audio.pause();
    });
    stopBtn.addEventListener('click', ()=>{ audio.pause(); audio.currentTime = 0; });
    muteBtn.addEventListener('click', ()=>{ audio.muted = !audio.muted; });
    volumeInput?.addEventListener('input', ()=>{
      audio.volume = Number(volumeInput.value) / 100;
      if (audio.volume > 0 && audio.muted) audio.muted = false;
    });
    gatePlayBtn?.addEventListener('click', ()=>{ showBar(); audio.play().catch(()=>{}); });
    gateSkipBtn?.addEventListener('click', showBar);

    // One autoplay attempt right when the dashboard opens. Browsers that block
    // unsolicited audio reject this promise (never throw synchronously) — the gate
    // button is the guaranteed fallback: one direct user gesture is all it needs.
    const playAttempt = audio.play();
    if (playAttempt && typeof playAttempt.then === 'function'){
      playAttempt.then(showBar).catch(()=>{ gate.hidden = false; });
    } else {
      showBar();
    }
  }catch(err){
    console.error('anthem init failed (non-fatal, rest of the app is unaffected):', err);
  }
}

/* ---------------- login gate (real Supabase Auth) ---------------- */
function renderGate(){
  root.innerHTML = `
    <div class="gate">
      <div class="gate-card">
        <img src="${MINISTRY_LOGO}" alt="شعار وزارة التعليم">
        <h2>الدخول إلى إدارة الخطة</h2>
        <p>مدرسة النهروان الثانوية — خطة التحسين 1448هـ</p>
        <form id="gateForm">
          <input name="user" placeholder="اسم المستخدم" autocomplete="off">
          <input name="pin" placeholder="الرمز السري" type="password" autocomplete="off">
          <div class="gate-err" id="gateErr"></div>
          <button type="submit" class="btn primary" style="width:100%;justify-content:center">دخول</button>
        </form>
      </div>
    </div>
  `;
  document.getElementById('gateForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const user = (fd.get('user')||'').trim();
    const pin = (fd.get('pin')||'').trim();
    const err = document.getElementById('gateErr');
    const email = resolveLoginEmail(user);
    if (!email){ err.textContent = 'اسم المستخدم أو الرمز السري غير صحيح'; return; }
    const {data, error} = await sb.auth.signInWithPassword({email, password: pin});
    if (error || !data.session){
      err.textContent = 'اسم المستخدم أو الرمز السري غير صحيح';
      return;
    }
    state.session = data.session;
    state.authed = true;
    loadAll();
  });
}

/* ---------------- boot ---------------- */
async function boot(){
  render();
  initAnthem();
  const {data:{session}} = await sb.auth.getSession();
  state.session = session;
  if (MODE === 'admin') state.authed = !!session;
  if (state.authed) { await loadAll(); }
  else if (MODE !== 'admin') { await loadAll(); }
  else { render(); }
}
boot();
</script>
