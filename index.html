<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0b0824" />

    <!--
      بيانات معاينة الرابط.
      ------------------------------------------------------------------
      زاحف واتساب (وiMessage وتيليجرام) يطلب الصفحة من الخادم ولا يشغّل
      JavaScript، ولا يرى ما بعد # إطلاقًا. فرابط الطالبة
      …/#/s/<code> يصل إليه على أنه الصفحة الجذر وحدها — ومعاينته تُبنى
      من هذه الوسوم الثابتة لا من حالة React. ولهذا يجب أن تكون هوية
      «إنجازي يحكي» مكتوبة هنا في HTML الذي يعود من الخادم.
      og:image مطلق لا نسبيّ: الزاحف لا يحلّ المسارات النسبية.
    -->
    <title>إنجازي يحكي</title>
    <meta
      name="description"
      content="ملف إنجاز رقمي لطالبات الابتدائية الخامسة والستون بعد المائة"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="إنجازي يحكي" />
    <meta property="og:title" content="إنجازي يحكي" />
    <meta
      property="og:description"
      content="ملف إنجاز رقمي لطالبات الابتدائية الخامسة والستون بعد المائة"
    />
    <meta property="og:locale" content="ar_SA" />
    <meta property="og:url" content="https://mauve-pi-99.vercel.app/" />
    <meta
      property="og:image"
      content="https://mauve-pi-99.vercel.app/assets/injazi/og-cover.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="إنجازي يحكي" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="إنجازي يحكي" />
    <meta
      name="twitter:description"
      content="ملف إنجاز رقمي لطالبات الابتدائية الخامسة والستون بعد المائة"
    />
    <meta
      name="twitter:image"
      content="https://mauve-pi-99.vercel.app/assets/injazi/og-cover.png"
    />

    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Tajawal يخصّ المشروع التعليمي الآخر في هذا المستودع (هوية وزارة
      التعليم — لا تُمسّ)؛ اسمه لا يُكتب هنا كي لا يظهر في مصدر صفحة
      «إنجازي يحكي» بأي صورة.
      Baloo Bhaijaan 2 و Readex Pro لـ«إنجازي يحكي»: الأول كان معلَنًا في
      الرموز دون تحميل، فكان يسقط صامتًا إلى Tajawal وتضيع شخصية العناوين.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Readex+Pro:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
