name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/shuala-lugati-platform-bzvynb", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      # قيم Firebase Web App SDK التالية عامة (Public) بطبيعتها - وليست
      # Secrets: هذا بالضبط ما يُضمَّن في حزمة أي تطبيق ويب يستخدم Firebase،
      # وحمايتها الحقيقية تأتي من Firestore/Auth Security Rules وليس من
      # إخفاء هذه القيم (توثيق Firebase الرسمي يؤكد هذا). مشروع الإنتاج:
      # lughati165.
      - name: Build (GitHub Pages base path + Firebase Production config)
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_FIREBASE_API_KEY: AIzaSyA_S3yvILDo7ewZaaNhDoBAg_e3Z2i_Yqs
          VITE_FIREBASE_AUTH_DOMAIN: lughati165.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: lughati165
          VITE_FIREBASE_STORAGE_BUCKET: lughati165.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "51460513048"
          VITE_FIREBASE_APP_ID: "1:51460513048:web:8b5d4be67364716bf4126d"
          VITE_USE_FIREBASE_EMULATORS: "false"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
